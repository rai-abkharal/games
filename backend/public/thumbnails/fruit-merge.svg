<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBE8D9"/>
      <stop offset="100%" stop-color="#A5D4BC"/>
    </linearGradient>
    <linearGradient id="wmGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="peachGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FECACA"/>
      <stop offset="60%" stop-color="#FFA88B"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <linearGradient id="lemonGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="40" fill="url(#bgGrad)"/>

  <!-- Top Badges -->
  <rect x="140" y="30" width="110" height="42" rx="10" fill="#263334"/>
  <text x="195" y="56" font-family="'Fredoka', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">454</text>

  <rect x="262" y="30" width="110" height="42" rx="10" fill="#263334"/>
  <text x="317" y="56" font-family="'Fredoka', sans-serif" font-weight="900" font-size="20" fill="#38E1BF" text-anchor="middle">454</text>

  <!-- Container Jar Outline -->
  <rect x="46" y="90" width="420" height="340" rx="16" fill="#FAF0DB" stroke="#A75330" stroke-width="12" filter="url(#shadow)"/>

  <!-- Dotted Danger Line -->
  <line x1="56" y1="120" x2="456" y2="120" stroke="#D45A3E" stroke-width="4" stroke-dasharray="10 8"/>

  <!-- Dotted Trajectory -->
  <line x1="256" y1="120" x2="256" y2="280" stroke="#DF5B90" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Peach at Top Drop Point -->
  <circle cx="256" cy="115" r="28" fill="url(#peachGrad)" stroke="#2B1810" stroke-width="3"/>
  <circle cx="248" cy="112" r="3" fill="#2B1810"/>
  <circle cx="264" cy="112" r="3" fill="#2B1810"/>
  <path d="M 252 118 Q 256 122 260 118" stroke="#2B1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Giant Kawaii Watermelon in Center Bottom -->
  <g filter="url(#shadow)">
    <circle cx="256" cy="330" r="85" fill="url(#wmGrad)" stroke="#2B1810" stroke-width="4.5"/>
    <!-- Watermelon Stripes -->
    <path d="M 215 255 Q 225 330 220 405" stroke="#052E16" stroke-width="6" fill="none"/>
    <path d="M 256 245 Q 260 330 256 415" stroke="#052E16" stroke-width="6" fill="none"/>
    <path d="M 297 255 Q 287 330 292 405" stroke="#052E16" stroke-width="6" fill="none"/>
    <!-- Watermelon Kawaii Face -->
    <circle cx="225" cy="318" r="8" fill="#2B1810"/>
    <circle cx="287" cy="318" r="8" fill="#2B1810"/>
    <circle cx="222" cy="315" r="3" fill="#FFFFFF"/>
    <circle cx="284" cy="315" r="3" fill="#FFFFFF"/>
    <ellipse cx="212" cy="332" rx="9" ry="6" fill="#F472B6" opacity="0.6"/>
    <ellipse cx="300" cy="332" rx="9" ry="6" fill="#F472B6" opacity="0.6"/>
    <!-- Big Happy Open Mouth -->
    <path d="M 242 328 Q 256 348 270 328 Z" fill="#BE123C" stroke="#2B1810" stroke-width="3"/>
  </g>

  <!-- Kawaii Lemon on Left -->
  <g filter="url(#shadow)">
    <ellipse cx="120" cy="355" rx="42" ry="36" fill="url(#lemonGrad)" stroke="#2B1810" stroke-width="3"/>
    <circle cx="108" cy="350" r="4.5" fill="#2B1810"/>
    <circle cx="132" cy="350" r="4.5" fill="#2B1810"/>
    <circle cx="106" cy="348" r="1.5" fill="#FFFFFF"/>
    <circle cx="130" cy="348" r="1.5" fill="#FFFFFF"/>
    <path d="M 115 358 Q 120 366 125 358 Z" fill="#BE123C" stroke="#2B1810" stroke-width="2"/>
  </g>

  <!-- Kawaii Apple on Right -->
  <g filter="url(#shadow)">
    <circle cx="390" cy="345" r="48" fill="#EF4444" stroke="#2B1810" stroke-width="3.5"/>
    <circle cx="376" cy="340" r="5" fill="#2B1810"/>
    <circle cx="404" cy="340" r="5" fill="#2B1810"/>
    <path d="M 384 348 Q 390 354 396 348" stroke="#2B1810" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Title at Bottom -->
  <text x="256" y="475" font-family="'Fredoka', sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" stroke="#263334" stroke-width="5" stroke-linejoin="round" text-anchor="middle">FRUIT MERGE!</text>
</svg>
