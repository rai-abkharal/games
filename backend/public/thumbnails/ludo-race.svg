<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFA08D" />
      <stop offset="100%" stop-color="#5EA7C9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)" />

  <!-- Board Frame -->
  <g filter="url(#shadow)">
    <rect x="76" y="76" width="360" height="360" rx="24" fill="#262B34" />
    <!-- Quadrants -->
    <rect x="84" y="84" width="140" height="140" fill="#00B0FF" />
    <rect x="296" y="296" width="140" height="140" fill="#FA5252" />
    <rect x="296" y="84" width="140" height="140" fill="#363B44" />
    <rect x="84" y="296" width="140" height="140" fill="#363B44" />

    <!-- Nests -->
    <rect x="104" y="104" width="100" height="100" rx="16" fill="#D0F2FC" />
    <rect x="316" y="316" width="100" height="100" rx="16" fill="#FFD7D7" />

    <!-- Center Cross Path -->
    <rect x="84" y="224" width="344" height="64" fill="#FFFFFF" />
    <rect x="108" y="244" width="116" height="24" fill="#00B0FF" />
    <rect x="296" y="244" width="116" height="24" fill="#FA5252" />

    <!-- Center Hub Triangles -->
    <polygon points="224,224 288,224 256,256" fill="#4CAF50" />
    <polygon points="224,288 288,288 256,256" fill="#FFC107" />
    <polygon points="224,224 224,288 256,256" fill="#00B0FF" />
    <polygon points="288,224 288,288 256,256" fill="#FA5252" />
  </g>

  <!-- Red Pawn in Foreground -->
  <g transform="translate(340, 200) scale(1.4)" filter="url(#shadow)">
    <ellipse cx="0" cy="18" rx="16" ry="7" fill="#C92A2A" stroke="#000000" stroke-width="2.5" />
    <path d="M-10,18 Q-4,6 -6,0 L6,0 Q4,6 10,18 Z" fill="#FA5252" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="-6" r="10" fill="#FA5252" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="-3" cy="-9" rx="3.5" ry="2" fill="#FF8585" transform="rotate(-30, -3, -9)" />
  </g>

  <!-- Cyan Pawn in Foreground -->
  <g transform="translate(160, 200) scale(1.4)" filter="url(#shadow)">
    <ellipse cx="0" cy="18" rx="16" ry="7" fill="#0088CC" stroke="#000000" stroke-width="2.5" />
    <path d="M-10,18 Q-4,6 -6,0 L6,0 Q4,6 10,18 Z" fill="#00B0FF" stroke="#000000" stroke-width="2.5" />
    <circle cx="0" cy="-6" r="10" fill="#00B0FF" stroke="#000000" stroke-width="2.5" />
    <ellipse cx="-3" cy="-9" rx="3.5" ry="2" fill="#50C8FF" transform="rotate(-30, -3, -9)" />
  </g>

  <!-- 3D Die in Center -->
  <g transform="translate(256, 420)" filter="url(#shadow)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    <!-- 6 dots -->
    <circle cx="-16" cy="-16" r="4.5" fill="#1E293B" />
    <circle cx="16" cy="-16" r="4.5" fill="#1E293B" />
    <circle cx="-16" cy="0" r="4.5" fill="#1E293B" />
    <circle cx="16" cy="0" r="4.5" fill="#1E293B" />
    <circle cx="-16" cy="16" r="4.5" fill="#1E293B" />
    <circle cx="16" cy="16" r="4.5" fill="#1E293B" />
  </g>
</svg>
