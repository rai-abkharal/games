<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Rainbow Segment Gradients -->
    <radialGradient id="pinkSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#88003E" />
    </radialGradient>
    <radialGradient id="orangeSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#994400" />
    </radialGradient>
    <radialGradient id="yellowSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FFCC00" />
      <stop offset="100%" stop-color="#997700" />
    </radialGradient>
    <radialGradient id="greenSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#0D6325" />
    </radialGradient>
    <radialGradient id="cyanSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#00C7BE" />
      <stop offset="100%" stop-color="#00635E" />
    </radialGradient>
    <radialGradient id="blueSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#007AFF" />
      <stop offset="100%" stop-color="#003780" />
    </radialGradient>
    <radialGradient id="purpleSeg" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#AF52DE" />
      <stop offset="100%" stop-color="#551B75" />
    </radialGradient>

    <!-- Crown Gradient -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="50%" stop-color="#FBC02D" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>

    <!-- Food Pellet Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#bgGrad)" />

  <!-- Squiggly Arena Background Details -->
  <path d="M 60 100 Q 120 40 180 120 T 300 80" stroke="#233554" stroke-width="22" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 320 380 Q 400 320 440 420" stroke="#1E293B" stroke-width="28" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M 80 340 Q 140 440 220 360" stroke="#253755" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Glowing Food Pellets -->
  <circle cx="120" cy="180" r="10" fill="#FF2E93" filter="url(#glow)"/>
  <circle cx="380" cy="140" r="14" fill="#34C759" filter="url(#glow)"/>
  <circle cx="420" cy="280" r="8" fill="#FFCC00" filter="url(#glow)"/>
  <circle cx="160" cy="400" r="12" fill="#00C7BE" filter="url(#glow)"/>
  <circle cx="340" cy="420" r="9" fill="#FF3B30" filter="url(#glow)"/>

  <!-- Worm Body Segments (S-Curve) -->
  <circle cx="140" cy="380" r="32" fill="url(#purpleSeg)"/>
  <circle cx="175" cy="340" r="33" fill="url(#blueSeg)"/>
  <circle cx="215" cy="305" r="34" fill="url(#cyanSeg)"/>
  <circle cx="260" cy="280" r="35" fill="url(#greenSeg)"/>
  <circle cx="305" cy="265" r="36" fill="url(#yellowSeg)"/>
  <circle cx="350" cy="260" r="37" fill="url(#orangeSeg)"/>

  <!-- Worm Head -->
  <circle cx="395" cy="260" r="42" fill="url(#pinkSeg)"/>

  <!-- Eyes -->
  <!-- Left Eye -->
  <circle cx="410" cy="238" r="15" fill="#FFFFFF"/>
  <circle cx="416" cy="238" r="8" fill="#1C1C1E"/>
  <circle cx="414" cy="235" r="3" fill="#FFFFFF"/>
  <!-- Right Eye -->
  <circle cx="410" cy="282" r="15" fill="#FFFFFF"/>
  <circle cx="416" cy="282" r="8" fill="#1C1C1E"/>
  <circle cx="414" cy="279" r="3" fill="#FFFFFF"/>

  <!-- Golden Crown atop Head -->
  <path d="M 380 190 L 385 165 L 398 178 L 410 155 L 422 178 L 435 165 L 440 190 Z" fill="url(#crownGrad)" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="385" cy="165" r="3" fill="#FF2E93"/>
  <circle cx="410" cy="155" r="3.5" fill="#FF2E93"/>
  <circle cx="435" cy="165" r="3" fill="#FF2E93"/>

  <!-- Title Badge -->
  <rect x="76" y="435" width="360" height="52" rx="26" fill="rgba(15, 23, 42, 0.85)" stroke="#38BDF8" stroke-width="2.5"/>
  <text x="256" y="470" font-family="'Nunito', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle">SNAKE ARENA</text>
</svg>
