<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131c26"/>
      <stop offset="50%" stop-color="#0d131a"/>
      <stop offset="100%" stop-color="#06090d"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd32a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fffae6"/>
      <stop offset="100%" stop-color="#ffd32a"/>
    </linearGradient>
    <linearGradient id="boardL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3efe6"/>
      <stop offset="100%" stop-color="#e5dfd3"/>
    </linearGradient>
    <linearGradient id="boardD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262f3d"/>
      <stop offset="100%" stop-color="#1a212c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="48" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#spot)"/>

  <!-- Chess Board Pattern -->
  <g transform="translate(96, 120)">
    <rect x="-14" y="-14" width="348" height="348" rx="22" fill="#1e293b" stroke="#ffd32a" stroke-width="4"/>
    <g>
      <rect x="0" y="0" width="80" height="80" fill="url(#boardL)"/>
      <rect x="80" y="0" width="80" height="80" fill="url(#boardD)"/>
      <rect x="160" y="0" width="80" height="80" fill="url(#boardL)"/>
      <rect x="240" y="0" width="80" height="80" fill="url(#boardD)"/>

      <rect x="0" y="80" width="80" height="80" fill="url(#boardD)"/>
      <rect x="80" y="80" width="80" height="80" fill="url(#boardL)"/>
      <rect x="160" y="80" width="80" height="80" fill="url(#boardD)"/>
      <rect x="240" y="80" width="80" height="80" fill="url(#boardL)"/>

      <rect x="0" y="160" width="80" height="80" fill="url(#boardL)"/>
      <rect x="80" y="160" width="80" height="80" fill="url(#boardD)"/>
      <rect x="160" y="160" width="80" height="80" fill="url(#boardL)"/>
      <rect x="240" y="160" width="80" height="80" fill="url(#boardD)"/>

      <rect x="0" y="240" width="80" height="80" fill="url(#boardD)"/>
      <rect x="80" y="240" width="80" height="80" fill="url(#boardL)"/>
      <rect x="160" y="240" width="80" height="80" fill="url(#boardD)"/>
      <rect x="240" y="240" width="80" height="80" fill="url(#boardL)"/>
    </g>
  </g>

  <!-- 3D Pearl White King on Board -->
  <g transform="translate(256, 260) scale(1.4)">
    <circle cx="0" cy="20" r="42" fill="rgba(0,0,0,0.5)"/>
    <!-- Pedestal -->
    <ellipse cx="0" cy="24" rx="38" ry="13" fill="#cbd5e1"/>
    <ellipse cx="0" cy="18" rx="34" ry="9" fill="#f59e0b"/>
    <ellipse cx="0" cy="12" rx="30" ry="8" fill="#ffffff"/>

    <!-- Robe -->
    <path d="M-22,12 Q-10,-5 -14,-16 L14,-16 Q10,-5 22,12 Z" fill="#ffffff"/>
    <rect x="-22" y="-18" width="44" height="6" fill="#f59e0b"/>

    <!-- Crown Dome -->
    <path d="M-18,-18 A18,18 0 0,1 18,-18 Z" fill="#ffffff"/>
    <rect x="-4" y="-38" width="8" height="20" fill="#fbbf24"/>
    <rect x="-9" y="-33" width="18" height="6" fill="#fbbf24"/>
    <circle cx="0" cy="-30" r="3" fill="#ff3838"/>
  </g>

  <!-- Title Badge -->
  <g transform="translate(256, 74)">
    <rect x="-180" y="-36" width="360" height="64" rx="22" fill="#1e293b" stroke="#ffd32a" stroke-width="3"/>
    <text x="0" y="8" font-family="'Fredoka', 'Lilita One', sans-serif" font-size="28" font-weight="900" fill="url(#gold)" text-anchor="middle">ROYAL CHESS 3D</text>
  </g>
</svg>
