<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9EAFF0"/>
      <stop offset="50%" stop-color="#A9B9F5"/>
      <stop offset="100%" stop-color="#B9C7F7"/>
    </linearGradient>

    <!-- Red Bubble Gradient -->
    <radialGradient id="redSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF5C69"/>
      <stop offset="35%" stop-color="#E51D2A"/>
      <stop offset="85%" stop-color="#9E0C17"/>
      <stop offset="100%" stop-color="#4A050B"/>
    </radialGradient>

    <!-- Green Bubble Gradient -->
    <radialGradient id="greenSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#61F07C"/>
      <stop offset="35%" stop-color="#18C83A"/>
      <stop offset="85%" stop-color="#0E7A22"/>
      <stop offset="100%" stop-color="#05380E"/>
    </radialGradient>

    <!-- Yellow Bubble Gradient -->
    <radialGradient id="yellowSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="35%" stop-color="#F4D600"/>
      <stop offset="85%" stop-color="#9E8500"/>
      <stop offset="100%" stop-color="#473C00"/>
    </radialGradient>

    <!-- Purple Bubble Gradient -->
    <radialGradient id="purpleSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F35CFA"/>
      <stop offset="35%" stop-color="#C51BCB"/>
      <stop offset="85%" stop-color="#7A0E7E"/>
      <stop offset="100%" stop-color="#3D063F"/>
    </radialGradient>

    <!-- Cyan Bubble Gradient -->
    <radialGradient id="cyanSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#61F0FA"/>
      <stop offset="35%" stop-color="#16C8D5"/>
      <stop offset="85%" stop-color="#0C7E87"/>
      <stop offset="100%" stop-color="#053B40"/>
    </radialGradient>

    <!-- Gold Star Gradient -->
    <linearGradient id="starGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF480"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#E69500"/>
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specular" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <!-- Soft Ambient Clouds -->
  <circle cx="90" cy="120" r="70" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="430" cy="200" r="90" fill="#FFFFFF" fill-opacity="0.12"/>
  <circle cx="120" cy="380" r="80" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Hanging Bubble Formation -->
  <!-- Row 1 -->
  <g transform="translate(106, 90)">
    <circle cx="0" cy="0" r="34" fill="url(#redSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(174, 90)">
    <circle cx="0" cy="0" r="34" fill="url(#redSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(242, 90)">
    <circle cx="0" cy="0" r="34" fill="url(#greenSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(310, 90)">
    <circle cx="0" cy="0" r="34" fill="url(#yellowSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(378, 90)">
    <circle cx="0" cy="0" r="34" fill="url(#purpleSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>

  <!-- Row 2 -->
  <g transform="translate(140, 148)">
    <circle cx="0" cy="0" r="34" fill="url(#greenSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(208, 148)">
    <circle cx="0" cy="0" r="34" fill="url(#cyanSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(276, 148)">
    <circle cx="0" cy="0" r="34" fill="url(#purpleSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>
  <g transform="translate(344, 148)">
    <circle cx="0" cy="0" r="34" fill="url(#redSphere)"/>
    <ellipse cx="-12" cy="-12" rx="13" ry="7" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>

  <!-- Golden 3D Star in Center -->
  <g transform="translate(242, 215)">
    <circle cx="0" cy="0" r="42" fill="#FFD700" fill-opacity="0.25"/>
    <polygon points="0,-36 10,-11 36,-11 15,6 22,32 0,16 -22,32 -15,6 -36,-11 -10,-11" fill="url(#starGrad)" stroke="#D48800" stroke-width="2.5"/>
    <polygon points="0,-36 10,-11 0,0" fill="#FFFFFF" fill-opacity="0.45"/>
    <polygon points="0,0 -36,-11 -10,-11" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>

  <!-- Aiming Trajectory Dots -->
  <circle cx="256" cy="360" r="5" fill="#FF5C69"/>
  <circle cx="252" cy="330" r="5.5" fill="#FF5C69"/>
  <circle cx="248" cy="300" r="6" fill="#FF5C69"/>
  <circle cx="244" cy="270" r="6.5" fill="#FF5C69"/>

  <!-- Launcher Base & Fired Red Bubble -->
  <circle cx="256" cy="420" r="48" fill="#BAC7EC" stroke="#FFFFFF" stroke-width="4"/>
  <g transform="translate(256, 420)">
    <circle cx="0" cy="0" r="36" fill="url(#redSphere)"/>
    <ellipse cx="-12" cy="-12" rx="14" ry="7.5" transform="rotate(-45 -12 -12)" fill="url(#specular)"/>
  </g>

  <!-- Next Bubble Preview -->
  <g transform="translate(330, 420)">
    <circle cx="0" cy="0" r="24" fill="url(#greenSphere)"/>
    <ellipse cx="-8" cy="-8" rx="9" ry="5" transform="rotate(-45 -8 -8)" fill="url(#specular)"/>
  </g>
</svg>
