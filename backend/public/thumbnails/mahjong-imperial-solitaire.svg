<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f3328"/>
      <stop offset="70%" stop-color="#081c16"/>
      <stop offset="100%" stop-color="#040d0a"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fbf8ee"/>
      <stop offset="100%" stop-color="#eee6cb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="32"/>
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="url(#goldGrad)" stroke-width="3" rx="20" opacity="0.4"/>

  <!-- Jade Tile Body Shadow & Backing -->
  <g filter="url(#shadow)">
    <!-- Jade Base -->
    <rect x="146" y="116" width="220" height="290" rx="24" fill="#0e3a26"/>
    <rect x="146" y="110" width="220" height="290" rx="24" fill="#1b5e3f"/>
    <!-- Ivory Face -->
    <rect x="146" y="100" width="220" height="280" rx="22" fill="url(#tileFace)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Red Dragon Character '中' -->
  <text x="256" y="250" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Serif CJK SC', serif" font-size="140" font-weight="bold" fill="#d50000" text-anchor="middle" dominant-baseline="central">中</text>

  <!-- Gold Title -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">IMPERIAL MAHJONG</text>
</svg>
