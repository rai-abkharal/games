<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d2c6b"/>
      <stop offset="50%" stop-color="#28469a"/>
      <stop offset="100%" stop-color="#3b5cb8"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#17224d"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="20%" stop-color="#ff9900"/>
      <stop offset="40%" stop-color="#ffee00"/>
      <stop offset="60%" stop-color="#00ff66"/>
      <stop offset="80%" stop-color="#00ddff"/>
      <stop offset="100%" stop-color="#ff00cc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="40" fill="url(#bgGrad)"/>

  <!-- Top Crown & Best Score -->
  <path d="M 40 45 L 36 28 L 50 36 L 64 22 L 78 36 L 92 28 L 88 45 Z" fill="url(#crownGrad)" filter="url(#glow)"/>
  <text x="102" y="42" font-family="'Fredoka', sans-serif" font-weight="900" font-size="28" fill="#fbbf24">315</text>

  <!-- Current Score Diamond & Text -->
  <rect x="236" y="24" width="40" height="40" transform="rotate(45 256 44)" fill="#38bdf8" filter="url(#glow)"/>
  <text x="256" y="52" font-family="'Fredoka', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle">315</text>

  <!-- 8x8 Board Container -->
  <rect x="56" y="86" width="400" height="340" rx="20" fill="url(#boardGrad)" stroke="#22326b" stroke-width="4"/>

  <!-- Grid Cells Sample Blocks -->
  <!-- Blue Row -->
  <rect x="76" y="210" width="42" height="42" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <rect x="122" y="210" width="42" height="42" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <rect x="168" y="210" width="42" height="42" rx="4" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <rect x="214" y="210" width="42" height="42" rx="4" fill="#22c55e" stroke="#4ade80" stroke-width="2"/>
  <rect x="260" y="210" width="42" height="42" rx="4" fill="#a855f7" stroke="#c084fc" stroke-width="2"/>

  <!-- Green Block Group -->
  <rect x="214" y="164" width="42" height="42" rx="4" fill="#22c55e" stroke="#4ade80" stroke-width="2"/>
  <rect x="260" y="164" width="42" height="42" rx="4" fill="#22c55e" stroke="#4ade80" stroke-width="2"/>
  <rect x="306" y="164" width="42" height="42" rx="4" fill="#22c55e" stroke="#4ade80" stroke-width="2"/>

  <!-- Yellow Blocks -->
  <rect x="168" y="302" width="42" height="42" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="214" y="302" width="42" height="42" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <rect x="260" y="302" width="42" height="42" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>

  <!-- Rainbow Clearing Line -->
  <rect x="72" y="344" width="368" height="46" rx="6" fill="#22c55e" stroke="url(#rainbowGrad)" stroke-width="6" filter="url(#glow)"/>

  <!-- Giant Combo Banner -->
  <text x="220" y="325" font-family="'Fredoka', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#ffffff" stroke="#1d4ed8" stroke-width="8" stroke-linejoin="round" text-anchor="middle">Combo</text>
  <text x="220" y="325" font-family="'Fredoka', sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#ffffff" text-anchor="middle">Combo</text>
  <text x="315" y="328" font-family="'Fredoka', sans-serif" font-weight="900" font-style="italic" font-size="52" fill="#facc15" stroke="#b45309" stroke-width="8" stroke-linejoin="round" text-anchor="middle">4</text>
  <text x="315" y="328" font-family="'Fredoka', sans-serif" font-weight="900" font-style="italic" font-size="52" fill="#facc15" text-anchor="middle">4</text>

  <!-- Score Popup -->
  <text x="256" y="275" font-family="'Fredoka', sans-serif" font-weight="900" font-size="30" fill="#fb923c" text-anchor="middle">+50</text>

  <!-- Title at bottom -->
  <text x="256" y="480" font-family="'Fredoka', sans-serif" font-weight="900" font-size="36" fill="#ffffff" stroke="#0f172a" stroke-width="4" text-anchor="middle">BLOCK BLAST!</text>
</svg>
