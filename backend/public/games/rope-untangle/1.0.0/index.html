        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.r = r;
        this.color = color;
        this.ttl = ttl;
        this.life = 1;
    }
    update(dt) {
        this.life -= dt / this.ttl;
        this.vy += 900 * dt;
        this.vx *= 0.99;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
    }
}
class FloatText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.life = 1;
    }
    update(dt) {
        this.life -= dt / 0.9;
        this.y -= 62 * dt;
    }
}

const STEP = 1 / 60;
const PATH_N = SEG * SUB + 1;

class Sfx {
    constructor() {
        this.ctx = null;
        this.master = null;
        this.muted = false;
    }
    /** Must be called from inside a user gesture or autoplay policy blocks it. */
    unlock() {
        if (this.ctx)
            return;
        try {
            const Ctor = window.AudioContext || window.webkitAudioContext;
            if (!Ctor)
                return;
            this.ctx = new Ctor();
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.32;
            this.master.connect(this.ctx.destination);
        }
        catch {
            this.ctx = null;
        }
    }
    blip(freq, dur, type, vol, slide = 0) {
        if (!this.ctx || !this.master || this.muted)
            return;
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, t);
        if (slide)
            o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g);
        g.connect(this.master);
        o.start(t);
        o.stop(t + dur + 0.02);
    }
    grab() { this.blip(320, 0.09, 'triangle', 0.5, 90); }
    drop() { this.blip(180, 0.12, 'sine', 0.6, -60); }
    deny() { this.blip(140, 0.16, 'square', 0.28, -40); }
    pop(combo) {
        const f = 520 * Math.pow(1.09, Math.min(combo, 10));
        this.blip(f, 0.16, 'triangle', 0.55, 240);
    }
    win() {
        [0, 120, 240, 400].forEach((ms, i) => {
            setTimeout(() => this.blip(440 * Math.pow(1.26, i), 0.22, 'triangle', 0.5, 60), ms);
        });
    }

function emptyPath() {

/**
 * Samples a rope into a smooth polyline and applies the braid offset so the
 * cord visibly winds around whatever it crosses.
 */
function buildPath(rope, crossings, out) {
    // Catmull-Rom through the verlet points. Straight-line interpolation left a
    // visible facet at every segment joint; this rides through them smoothly.
    const bx = [];
    const by = [];
    const cr = (p0, p1, p2, p3, f) => {
        const f2 = f * f;
        const f3 = f2 * f;
        return 0.5 * ((2 * p1)
            + (-p0 + p2) * f
            + (2 * p0 - 5 * p1 + 4 * p2 - p3) * f2
            + (-p0 + 3 * p1 - 3 * p2 + p3) * f3);
    };
    for (let k = 0; k < PATH_N; k++) {
        const s = k / SUB;
        const i = Math.min(SEG - 1, Math.floor(s));
        const f = s - i;
        const i0 = Math.max(0, i - 1);
        const i2 = i + 1;
        const i3 = Math.min(SEG, i + 2);
        bx[k] = cr(rope.px[i0], rope.px[i], rope.px[i2], rope.px[i3], f);
        by[k] = cr(rope.py[i0], rope.py[i], rope.py[i2], rope.py[i3], f);
    }
    for (let k = 0; k < PATH_N; k++) {
        const p = Math.max(0, k - 1);
        const n = Math.min(PATH_N - 1, k + 1);
        let tx = bx[n] - bx[p];
        let ty = by[n] - by[p];
        const len = Math.hypot(tx, ty) || 1;
        tx /= len;
        ty /= len;
        out.nx[k] = -ty;
        out.ny[k] = tx;
        // taper the braid to zero at the knobs so ends stay planted on their pegs
        const edge = Math.min(k, PATH_N - 1 - k) / (SUB * 1.5);
        const fade = clamp(edge, 0, 1);
        const off = braidOffset(k / SUB, crossings, rope.id, rope.restLen / SEG) * fade;
        out.x[k] = bx[k] + out.nx[k] * off;
        out.y[k] = by[k] + out.ny[k] * off;
    }
    out.arc[0] = 0;
    for (let k = 1; k < PATH_N; k++) {
        out.arc[k] = out.arc[k - 1] + Math.hypot(out.x[k] - out.x[k - 1], out.y[k] - out.y[k - 1]);

    let hi = PATH_N - 1;
    while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (path.arc[mid] < target)

/** Draws the cord for path indices [from, to]. Used whole, and for weave patches. */
function strokeCord(g, path, col, from, to, width, alpha, caps = true) {

    const hi = clamp(to, 0, PATH_N - 1);

        return;
    const pts = [];
    for (let k = lo; k <= hi; k++)
        pts.push({ x: path.x[k], y: path.y[k] });

    g.lineStyle(width + OUTLINE, COL_INK, alpha);
    g.strokePoints(pts, false, false);
    // Rounded ends, since Phaser's WebGL graphics has no round line cap. Weave
    // patches skip them: a capped slice reads as a separate link in a chain
    // rather than the same cord continuing through the crossing.
    if (caps) {
        g.fillStyle(COL_INK, alpha);
        g.fillCircle(path.x[lo], path.y[lo], (width + OUTLINE) / 2);
        g.fillCircle(path.x[hi], path.y[hi], (width + OUTLINE) / 2);
    }
    // 2. body
    g.lineStyle(width, col.mid, alpha);
    g.strokePoints(pts, false, false);
    if (caps) {
        g.fillStyle(col.mid, alpha);
        g.fillCircle(path.x[lo], path.y[lo], width / 2);
        g.fillCircle(path.x[hi], path.y[hi], width / 2);
    }

    const edge = [];
    for (let k = lo; k <= hi; k++) {

    g.lineStyle(width * 0.46, col.dark, alpha * 0.55);
    g.strokePoints(edge, false, false);

    for (let k = lo; k <= hi; k++) {
        lit.push({ x: path.x[k] - path.nx[k] * width * 0.28, y: path.y[k] - path.ny[k] * width * 0.28 });

    g.lineStyle(width * 0.26, col.light, alpha * 0.95);
    g.strokePoints(lit, false, false);

    for (let k = lo; k <= hi; k++) {
        spec.push({ x: path.x[k] - path.nx[k] * width * 0.32, y: path.y[k] - path.ny[k] * width * 0.32 });

    g.lineStyle(width * 0.1, 0xffffff, alpha * 0.4);

        const ay = path.nx[k] * sn + path.ny[k] * cs;

        const ty = path.nx[k];
        g.lineStyle(Math.max(2.4, width * 0.17), col.dark, TWIST_ALPHA * alpha);
        g.lineBetween(gx - ax * h, gy - ay * h, gx + ax * h, gy + ay * h);

        g.lineBetween(gx - ax * h * 0.8 + tx * 2.6, gy - ay * h * 0.8 + ty * 2.6, gx + ax * h * 0.8 + tx * 2.6, gy + ay * h * 0.8 + ty * 2.6);

    const R = KNOB_R * scale;

    g.fillCircle(x, y, R + 3.5);
    g.fillStyle(COL_METAL, 1);
    g.fillCircle(x, y, R);
    for (let i = 0; i < 4; i++) {
        const a = i * Math.PI * 0.5 + Math.PI * 0.25;
        const bx = x + Math.cos(a) * R * 0.62;
        const by = y + Math.sin(a) * R * 0.62;
        g.fillStyle(0x24262a, 1);
        g.fillCircle(bx, by, R * 0.27);
        g.fillStyle(COL_METAL_HI, 1);
        g.fillCircle(bx, by, R * 0.22);
    }
    g.fillStyle(COL_INK, 1);
    g.fillCircle(x, y, R * 0.5 + 2.5);
    g.fillStyle(COL_METAL_HUB_LO, 1);
    g.fillCircle(x, y, R * 0.5);
    g.fillStyle(COL_METAL_HUB, 1);
    g.fillCircle(x, y - R * 0.05, R * 0.44);
    g.fillStyle(0xffffff, 0.65);
    g.fillCircle(x + R * 0.14, y - R * 0.2, R * 0.06);

        g.fillStyle(0x000000, 0.16);
        g.fillCircle(x + 5, y + 9, R * 1.02);
    }
    g.fillStyle(COL_INK, 1);
    g.fillCircle(x, y, R + 3.5);
    g.fillStyle(col.dark, 1);
    g.fillCircle(x, y, R);
    g.fillStyle(col.mid, 1);
    g.fillCircle(x, y, R - 3.5);
    g.fillStyle(COL_INK, 1);
    g.fillCircle(x, y, R * KNOB_HOLE + 3.5);
    g.fillStyle(col.mid, 1);
    g.fillCircle(x, y, R * KNOB_HOLE);
    g.fillStyle(col.light, 0.5);
    g.fillCircle(x - R * 0.16, y - R * 0.2, R * KNOB_HOLE * 0.52);

        best.end.homePeg = best.end.peg;

        const anyAlive = this.ropes.some((r) => r.alive);
        if (!anyAlive) {
            if (this.ropes.every((r) => r.state === 'gone'))
                this.onWin();
            return;
        }
        const free = ropesUncrossed(this.ropes, this.crossings);
        if (!free.size) {
            this.combo = 0;
            return;
        }
        let popped = 0;
        for (const rope of this.ropes) {
            if (!free.has(rope.id))
                continue;
            if (rope.state === 'held')
                continue;
            rope.state = 'escaping';
            rope.escapeT = 0;
            if (rope.a.peg >= 0)
                this.pegs[rope.a.peg].taken = false;
            if (rope.b.peg >= 0)
                this.pegs[rope.b.peg].taken = false;
            this.combo++;
            this.coins += COINS_PER_ROPE;
            this.burst(rope);
            this.sfx.pop(this.combo);
            popped++;
        }
        if (popped) {
            this.shakeMag = Math.min(7, 3 + this.combo * 0.6);
            this.shakeT = 0.22;
        }
    }
    burst(rope) {
        const col = PALETTE[rope.color];
        const mx = (rope.a.x + rope.b.x) / 2;
        const my = (rope.a.y + rope.b.y) / 2;
        for (let i = 0; i < 16; i++) {
            const ang = (i / 16) * Math.PI * 2 + Math.random();
            const sp = 130 + Math.random() * 190;
            this.particles.push(new Particle(mx, my, Math.cos(ang) * sp, Math.sin(ang) * sp - 60, 3 + Math.random() * 5, i % 3 === 0 ? col.light : col.mid, 0.5 + Math.random() * 0.35));
        }
        this.floats.push(new FloatText(mx + (Math.random() - 0.5) * 40, my, '+' + COINS_PER_ROPE, col.dark));
    }
    onWin() {
        this.fsm = 'WIN';
        this.winT = 0;
        this.txtWinCoins.setText('+' + COINS_PER_LEVEL + ' coins');
        this.sfx.win();
    }
    /* ------------------------------------------------------------- render -- */
    update(_time, deltaMs) {
        this.acc += Math.min(deltaMs / 1000, 0.25);
        let steps = 0;
        while (this.acc >= STEP && steps < 5) {
            this.sim(STEP);
            this.acc -= STEP;
            steps++;
        }
        if (steps === 5)
            this.acc = 0;
        this.draw();
    }
    draw() {
        const shake = this.shakeT > 0 ? this.shakeMag : 0;
        const sx = shake ? (Math.random() - 0.5) * shake : 0;
        const sy = shake ? (Math.random() - 0.5) * shake : 0;
        this.cameras.main.setScroll(sx, sy);
        this.drawBoard();
        this.drawRopes();
        this.drawFx();
        this.drawHud();
        this.drawWin();
    }
    drawBoard() {
        const g = this.gBoard;
        g.clear();
        g.fillStyle(COL_BG, 1);
        g.fillRect(-40, -40, VIEW_W + 80, VIEW_H + 80);
        for (const peg of this.pegs) {
            const r = PEG_R * (1 + peg.pulse * 0.16);
            if (peg.glow > 0) {
                g.fillStyle(0x8f95ff, 0.22 * peg.glow);
                g.fillCircle(peg.x, peg.y, r + 16 * peg.glow);
            }
            g.fillStyle(COL_PEG, 1);
            g.fillCircle(peg.x, peg.y, r);
            g.fillStyle(COL_PEG_HI, 0.85);
            g.fillCircle(peg.x, peg.y - 2, r - 5);
            if (peg.glow > 0) {
                g.lineStyle(4, 0x6f76ff, 0.7 * peg.glow);
                g.strokeCircle(peg.x, peg.y, r + 3);
            }
        }
    }
    drawRopes() {
        const g = this.gRope;
        g.clear();
        for (const rope of this.ropes) {
            if (rope.state === 'gone')
                continue;
            buildPath(rope, this.crossings, this.paths[rope.id]);
            if (rope.shake > 0) {
                // wobble a rope the player just tried and failed to move
                const dx = Math.sin(this.t * 46) * rope.shake * 5;
                const path = this.paths[rope.id];
                for (let k = 0; k < PATH_N; k++)
                    path.x[k] += dx;
            }
        }
        // halo under whatever is pinning the rope the player just poked
        if (this.flashT > 0 && this.flashId >= 0) {
            const blocker = this.ropes[this.flashId];
            if (blocker && blocker.state !== 'gone') {
                const path = this.paths[blocker.id];
                const pts = [];
                for (let k = 0; k < PATH_N; k++)
                    pts.push({ x: path.x[k], y: path.y[k] });
                const pulse = this.flashT * (0.6 + 0.4 * Math.sin(this.t * 16));
                g.lineStyle(ROPE_W + 24, 0xffc21f, 0.7 * pulse);
                g.strokePoints(pts, false, false);
                g.lineStyle(ROPE_W + 12, 0xffffff, 0.4 * pulse);
                g.strokePoints(pts, false, false);
            }
        }
        // Base pass in stack order, so every crossing draws its over/under exactly
        // as the rules see it. A rope the player has picked up is lifted clear of
        // the board, so it always draws last.
        const order = this.ropes
            .filter((r) => r.state !== 'gone')
            .sort((p, q) => {
            const held = (p.state === 'held' ? 1 : 0) - (q.state === 'held' ? 1 : 0);
            return held !== 0 ? held : p.layer - q.layer;
        });
        for (const rope of order) {
            const col = PALETTE[rope.color];
            const alpha = rope.state === 'escaping' ? 1 - easeOutCubic(rope.escapeT) * 0.15 : 1;
            const w = ROPE_W * (rope.state === 'escaping' ? 1 + rope.escapeT * 0.25 : 1);
            strokeCord(g, this.paths[rope.id], col, 0, PATH_N - 1, w, alpha);
        }
        // Weave pass. Each rope leans the opposite way through a crossing, so the
        // pair meets three times. Redraw the under rope across the two flanking
        // meetings and the over rope across the middle one, and the crossing reads
        // over-under-over — a real braid, from one logical crossing.
        for (const c of this.crossings) {
            const overId = c.iOver ? c.i : c.j;
            const underId = c.iOver ? c.j : c.i;
            const over = this.ropes[overId];
            const under = this.ropes[underId];
            if (!over || over.state === 'gone' || !under || under.state === 'gone')
                continue;
            if (under.state === 'held' || over.state === 'held')
                continue;
            const overPath = this.paths[overId];
            const underPath = this.paths[underId];
            const overArc = arcAt(overPath, (c.iOver ? c.ai : c.aj) * SUB);
            const underArc = arcAt(underPath, (c.iOver ? c.aj : c.ai) * SUB);
            for (const side of [-1, 1]) {
                const centre = underArc + side * WEAVE_FLANK_AT;
                strokeCord(g, underPath, PALETTE[under.color], indexAtArc(underPath, centre - WEAVE_FLANK_PX), indexAtArc(underPath, centre + WEAVE_FLANK_PX), ROPE_W, 1, false);
            }
            strokeCord(g, overPath, PALETTE[over.color], indexAtArc(overPath, overArc - WEAVE_OVER_PX), indexAtArc(overPath, overArc + WEAVE_OVER_PX), ROPE_W, 1, false);
        }
        // knobs and plates always sit on top of everything
        for (const rope of this.ropes) {
            if (rope.state === 'gone')
                continue;
            const col = PALETTE[rope.color];
            let scale = 1;
            if (rope.state === 'escaping')
                scale = 1 - easeOutCubic(rope.escapeT) * 0.85;
            else if (rope.bornT < 1)
                scale = easeOutBack(rope.bornT);
            // A rope with nothing on top of it is one move from coming loose, so its
            // knobs breathe. Buried ropes sit still — a hint, never a restriction.
            if (rope.state === 'idle' && !this.buried.has(rope.id)) {
                scale *= 1 + 0.035 * Math.sin(this.t * 3.4 + rope.id * 1.7);
            }
            if (scale <= 0.02)
                continue;
            const dx = rope.shake > 0 ? Math.sin(this.t * 46) * rope.shake * 5 : 0;
            for (const end of [rope.a, rope.b]) {
                const ex = end.x + dx;
                if (end.locked)
                    drawPlate(g, ex, end.y, scale);
                else
                    drawKnob(g, ex, end.y, col, scale * (end.held ? 1.14 : 1), end.held);
            }
        }
    }
    drawFx() {
        const g = this.gFx;
        g.clear();
        for (const p of this.particles) {
            g.fillStyle(p.color, clamp(p.life, 0, 1));
            g.fillCircle(p.x, p.y, p.r * clamp(p.life, 0, 1));
        }
        for (let i = 0; i < this.popPool.length; i++) {
            const f = this.floats[i];
            const label = this.popPool[i];
            if (!f) {
                label.setVisible(false);
                continue;
            }
            const a = clamp(f.life, 0, 1);
            label.setVisible(true);
            label.setPosition(f.x, f.y);
            label.setAlpha(a);
            label.setScale(0.8 + 0.35 * clamp((1 - f.life) * 4, 0, 1));
            label.setText(f.text);
            label.setColor('#' + f.color.toString(16).padStart(6, '0'));
        }
    }
    drawHud() {
        const g = this.gHud;
        g.clear();
        // coin pill
        g.fillStyle(0xffffff, 0.9);
        g.fillRoundedRect(22, 32, 130, 44, 22);
        g.fillStyle(0xf7b733, 1);
        g.fillCircle(44, 54, 19);
        g.fillStyle(0xffd76e, 1);
        g.fillCircle(44, 54, 14);
        // level pill
        g.fillStyle(0xffffff, 0.85);
        const lw = 150;
        g.fillRoundedRect(VIEW_W / 2 - lw / 2, 34, lw, 40, 20);
        // sound button
        g.fillStyle(0xffffff, 0.9);
        g.fillCircle(this.soundHit.x, this.soundHit.y, this.soundHit.r);
        g.fillStyle(this.sfx.muted ? 0xb9bcd6 : COL_HUD_INK, 1);
        g.fillRect(this.soundHit.x - 11, this.soundHit.y - 6, 8, 12);
        g.fillTriangle(this.soundHit.x + 4, this.soundHit.y - 13, this.soundHit.x + 4, this.soundHit.y + 13, this.soundHit.x - 8, this.soundHit.y);
        if (!this.sfx.muted) {
            g.lineStyle(3, COL_HUD_INK, 0.85);
            g.beginPath();
            g.arc(this.soundHit.x + 6, this.soundHit.y, 11, -0.7, 0.7, false);
            g.strokePath();
        }
        if (this.sfx.muted) {
            g.lineStyle(3.5, 0xe5372b, 1);
            g.lineBetween(this.soundHit.x - 13, this.soundHit.y - 13, this.soundHit.x + 13, this.soundHit.y + 13);
        }
        // restart button
        g.fillStyle(0xffffff, 0.95);
        g.fillCircle(this.restartHit.x, this.restartHit.y, this.restartHit.r);
        g.lineStyle(4.5, COL_HUD_INK, 1);
        g.beginPath();
        g.arc(this.restartHit.x, this.restartHit.y, 13, Math.PI * 0.35, Math.PI * 1.85, false);
        g.strokePath();
        g.fillStyle(COL_HUD_INK, 1);
        g.fillTriangle(this.restartHit.x + 6, this.restartHit.y - 18, this.restartHit.x + 18, this.restartHit.y - 12, this.restartHit.x + 5, this.restartHit.y - 5);
        const hudVisible = this.fsm !== 'WIN';
        this.txtCoins.setVisible(hudVisible).setText(String(this.coins));
        this.txtLevel.setVisible(hudVisible);
        this.txtToast.setAlpha(hudVisible ? clamp(this.toastT, 0, 1) : 0);
    }
    drawWin() {
        const g = this.gWin;
        g.clear();
        const show = this.fsm === 'WIN';
        this.txtWinBig.setVisible(show);
        this.txtWinSub.setVisible(show);
        this.txtWinCoins.setVisible(show);
        this.txtTap.setVisible(show && this.winT > WIN_HOLD);
        if (!show)
            return;
        const t = clamp(this.winT / 0.45, 0, 1);
        g.fillStyle(0x0a0a14, 0.82 * t);
        g.fillRect(-40, -40, VIEW_W + 80, VIEW_H + 80);
        const pop = easeOutBack(t);
        const cx = VIEW_W / 2;
        const cy = 300;
        const R = 96 * pop;
        g.fillStyle(0xffc83d, 1);
        g.fillCircle(cx, cy, R);
        g.fillStyle(0xffdd7a, 0.6);
        g.fillCircle(cx - R * 0.22, cy - R * 0.26, R * 0.52);
        g.fillStyle(0xff8f6b, 0.55);
        g.fillCircle(cx - R * 0.58, cy + R * 0.22, R * 0.2);
        g.fillCircle(cx + R * 0.58, cy + R * 0.22, R * 0.2);
        g.lineStyle(R * 0.11, 0x4a2a08, 1);
        g.beginPath();
        g.arc(cx - R * 0.36, cy - R * 0.16, R * 0.2, Math.PI, Math.PI * 2, false);
        g.strokePath();
        g.beginPath();
        g.arc(cx + R * 0.36, cy - R * 0.16, R * 0.2, Math.PI, Math.PI * 2, false);
        g.strokePath();
        g.fillStyle(0x4a2a08, 1);
        g.beginPath();
        g.arc(cx, cy + R * 0.16, R * 0.46, 0, Math.PI, false);
        g.fillPath();
        g.fillStyle(0xff6b6b, 1);
        g.fillCircle(cx, cy + R * 0.5, R * 0.16);
        if (this.winT > WIN_HOLD) {
            this.txtTap.setAlpha(0.55 + 0.45 * Math.sin(this.t * 5));
        }
        const scale = 0.6 + 0.4 * pop;
        this.txtWinBig.setScale(scale);
        this.txtWinSub.setScale(scale);
    }
}


/* ------------------------------------------------------------ */

/* ============================================================================
 * main.ts — boot only.
 * ==========================================================================*/
function boot() {
    const config = {
        type: Phaser.AUTO,
        parent: 'stage',
        width: VIEW_W,
        height: VIEW_H,
        backgroundColor: COL_BG,
        roundPixels: false,
        antialias: true,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            width: VIEW_W,
            height: VIEW_H,
        },
        input: { activePointers: 2 },
        scene: [BoardScene],
    };
    // eslint-disable-next-line no-new
    new Phaser.Game(config);
}
function start() {
    // No-op when the page already loaded the real Phaser, or when shim.ts already
    // installed the built-in Canvas 2D runtime at parse time. Kept so the dev
    // module graph pulls shim.ts in ahead of engine.ts.
    installPhaserFallback();
    boot();
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
}
else {
    start();
}

</script>
