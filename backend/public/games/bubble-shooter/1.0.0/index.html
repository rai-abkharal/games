        this.currentBubbleType = pickSmartNextColor(this.bubbles, level.availableColors);
        this.nextBubbleType = pickSmartNextColor(this.bubbles, level.availableColors);
        this.updateTrajectory();
    }
    updateCameraScroll(immediate = false) {
        const activeBubbles = this.bubbles.filter(b => !b.isPopping && !b.isDropping);
        if (activeBubbles.length === 0) {
            this.targetCameraOffsetY = 0;
            if (immediate)
                this.cameraOffsetY = 0;
            return;
        }
        let maxRow = 0;
        activeBubbles.forEach(b => {
            if (b.row > maxRow)
                maxRow = b.row;
        });
        const desiredWorldY = getHexPosition(maxRow, 0).y;
        const targetY = 320;
        const offset = Math.max(0, desiredWorldY - targetY);
        this.targetCameraOffsetY = offset;
        if (immediate) {
            this.cameraOffsetY = offset;
        }
    }
    updateTrajectory() {
        if (this.status !== 'AIMING') {
            this.trajectoryPoints = [];
            return;
        }
        this.trajectoryPoints = BubblePhysics.calculateTrajectory(this.aimAngle, this.bubbles, this.cameraOffsetY);
    }
    setAim(targetX, targetY) {
        if (this.status !== 'AIMING')
            return;
        const dx = targetX - LAUNCHER_X;
        const dy = LAUNCHER_Y - targetY;
        if (dy <= 10)
            return;
        let angle = Math.atan2(dy, dx);
        angle = Math.max(MIN_AIM_ANGLE, Math.min(MAX_AIM_ANGLE, angle));
        this.aimAngle = angle;
        this.isAiming = true;
        this.updateTrajectory();
    }
    swapBubbles() {
        if (this.status !== 'AIMING' || this.isSwapping)
            return;
        SoundSynth.playSwap();
        this.isSwapping = true;
        this.swapProgress = 0;
        const temp = this.currentBubbleType;
        this.currentBubbleType = this.nextBubbleType;
        this.nextBubbleType = temp;
    }
    shoot() {
        if (this.status !== 'AIMING' || this.shotsRemaining <= 0)
            return;
        let shootType = this.currentBubbleType;
        const activePowerUp = this.powerUps.consumeSelected();
        if (activePowerUp) {
            shootType = activePowerUp;
        }
        const vx = Math.cos(this.aimAngle) * PROJECTILE_SPEED;
        const vy = -Math.sin(this.aimAngle) * PROJECTILE_SPEED;
        this.projectile = {
            x: LAUNCHER_X,
            y: LAUNCHER_Y,
            prevX: LAUNCHER_X,
            prevY: LAUNCHER_Y,
            vx,
            vy,
            radius: BUBBLE_RADIUS,
            type: shootType,
            active: true,
            trail: []
        };

        this.shotsRemaining--;
        this.isAiming = false;
        this.trajectoryPoints = [];
        SoundSynth.playShoot();
        if (!activePowerUp) {
            const level = LEVEL_DEFINITIONS[this.currentLevelIndex];
            this.currentBubbleType = this.nextBubbleType;
            this.nextBubbleType = pickSmartNextColor(this.bubbles, level.availableColors);
        }
    }
    handlePointerDown(x, y) {
        SoundSynth.unlock();
        if (this.status === 'CLEAR' || this.status === 'FAILED') {
            const btn = this.actionBtnBounds;
            if (x >= btn.x &&
                x <= btn.x + btn.width &&
                y >= btn.y &&
                y <= btn.y + btn.height) {
                SoundSynth.playClick();
                if (this.status === 'CLEAR') {
                    this.loadLevel(this.currentLevelIndex + 1);
                }
                else {
                    this.loadLevel(this.currentLevelIndex);
                }
                return true;
            }
            return false;
        }
        if (this.status !== 'AIMING')
            return false;
        if (this.powerUps.handleClick({ x, y })) {
            return true;
        }
        const dNext = dist(x, y, this.nextBubbleBounds.x, this.nextBubbleBounds.y);
        if (dNext <= 36) {
            this.swapBubbles();
            return true;
        }
        if (y < LAUNCHER_Y + 40 && y > 60) {
            this.setAim(x, y);
            return true;
        }
        return false;
    }
    handlePointerMove(x, y) {
        if (this.status === 'AIMING' && this.isAiming) {
            this.setAim(x, y);
        }
    }
    handlePointerUp(x, y) {

        this.isAiming = false;
    }
    update(dt) {
        this.animTime += dt;
        this.cameraOffsetY += (this.targetCameraOffsetY - this.cameraOffsetY) * (dt * 4.5);
        if (this.displayScore < this.score) {
            const diff = this.score - this.displayScore;
            this.displayScore += Math.max(1, Math.ceil(diff * 0.2));
        }
        if (this.isSwapping) {
            this.swapProgress += dt * 5;
            if (this.swapProgress >= 1) {
                this.isSwapping = false;
                this.swapProgress = 0;
            }
        }
        if (this.status === 'CLEAR' || this.status === 'FAILED') {
            this.resultAnimProgress = Math.min(1, this.resultAnimProgress + dt * 2.5);
        }
        if (this.status === 'FLYING' && this.projectile && this.projectile.active) {
            this.updateProjectile(dt);
        }
        let anyPopping = false;
        for (let i = this.bubbles.length - 1; i >= 0; i--) {
            const b = this.bubbles[i];
            if (b.isPopping) {
                anyPopping = true;
                b.popProgress += dt * 4.5;
                if (b.popProgress < 0.3) {
                    b.scale = 1 + b.popProgress * 0.6;
                }
                else {
                    b.scale = Math.max(0, 1.18 - (b.popProgress - 0.3) * 1.7);
                    b.opacity = Math.max(0, 1 - (b.popProgress - 0.3) * 1.5);
                }
                if (b.popProgress >= 1) {
                    this.spawnPopParticles(b.x, b.y - this.cameraOffsetY, b.type, b.dualColors);
                    this.bubbles.splice(i, 1);
                }
            }
        }
        let anyDropping = false;
        for (let i = this.bubbles.length - 1; i >= 0; i--) {
            const b = this.bubbles[i];
            if (b.isDropping) {
                anyDropping = true;
                b.vy += 22 * dt;
                b.x += b.vx * 60 * dt;
                b.y += b.vy * 60 * dt;
                b.rotation += b.vr;
                b.opacity = Math.max(0, b.opacity - dt * 1.2);
                if (b.y - this.cameraOffsetY > VIRTUAL_HEIGHT + 60 || b.opacity <= 0) {
                    this.bubbles.splice(i, 1);
                }
            }
        }
        if (this.status === 'RESOLVING' && !anyPopping && !anyDropping) {
            this.checkLevelEndConditions();
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life += dt;
            p.x += p.vx * 60 * dt;
            p.y += p.vy * 60 * dt;
            p.vy += 8 * dt;
            if (p.vr)
                p.rotation = (p.rotation || 0) + p.vr;
            p.alpha = Math.max(0, 1 - p.life / p.maxLife);
            if (p.life >= p.maxLife) {
                this.particles.splice(i, 1);
            }
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.life += dt;
            ft.y += ft.vy * 60 * dt;
            ft.alpha = Math.max(0, 1 - ft.life / ft.maxLife);
            if (ft.life >= ft.maxLife) {
                this.floatingTexts.splice(i, 1);
            }
        }
    }
    updateProjectile(dt) {
        const proj = this.projectile;
        proj.prevX = proj.x;
        proj.prevY = proj.y;
        proj.x += proj.vx;
        proj.y += proj.vy;
        if (proj.x <= LEFT_WALL + proj.radius) {
            proj.x = LEFT_WALL + proj.radius;
            proj.vx = -proj.vx;
            SoundSynth.playBounce();
        }
        else if (proj.x >= RIGHT_WALL - proj.radius) {
            proj.x = RIGHT_WALL - proj.radius;
            proj.vx = -proj.vx;
            SoundSynth.playBounce();
        }
        const effectiveCeilingY = Math.max(CEILING_Y, CEILING_Y - this.cameraOffsetY);
        if (proj.y <= effectiveCeilingY + proj.radius) {
            this.attachProjectile(proj.x, effectiveCeilingY + proj.radius);
            return;
        }
        const activeBubbles = this.bubbles.filter(b => !b.isPopping && !b.isDropping);
        for (const b of activeBubbles) {
            const renderY = b.y - this.cameraOffsetY;
            if (renderY > -30 && renderY < LAUNCHER_Y) {
                if (distSq(proj.x, proj.y, b.x, renderY) <= Math.pow(BUBBLE_RADIUS * 1.85, 2)) {
                    this.attachProjectile(proj.x, proj.y);
                    return;
                }
            }
        }
    }
    attachProjectile(x, y) {
        const proj = this.projectile;
        proj.active = false;
        if (proj.type === 'bomb') {
            SoundSynth.playBomb();
            const worldY = y + this.cameraOffsetY;
            const targets = BubblePhysics.findBombTargets(x, worldY, this.bubbles);
            targets.forEach(b => {
                b.isPopping = true;
                b.popProgress = 0;
                this.addScore(10, b.x, b.y - this.cameraOffsetY);
                if (b.isStone)
                    SoundSynth.playStoneBreak();
            });
            this.spawnBombExplosion(x, y);
            this.status = 'RESOLVING';
            this.resolveCeilingSupport();
            return;
        }
        const slot = BubblePhysics.findAttachmentSlot(x, y, this.bubbles, this.cameraOffsetY);
        if (!slot) {
            this.status = 'RESOLVING';
            this.resolveCeilingSupport();
            return;
        }
        const pos = getHexPosition(slot.row, slot.col);
        const newBubble = {
            id: `b_new_${Date.now()}`,
            row: slot.row,
            col: slot.col,
            x: pos.x,
            y: pos.y,
            radius: BUBBLE_RADIUS,
            type: proj.type,
            dualColors: proj.dualColors,
            isStone: false,
            isStar: false,
            isPopping: false,
            popProgress: 0,
            isDropping: false,
            vx: 0,
            vy: 0,
            vr: 0,
            rotation: 0,
            opacity: 1,
            scale: 1,
            scaleOffset: 0
        };
        this.bubbles.push(newBubble);
        SoundSynth.playAttach();
        const matches = BubblePhysics.findConnectedMatches(newBubble, this.bubbles);
        if (matches.length >= 3) {
            this.comboStreak++;
            const comboMult = Math.min(3, 1 + (this.comboStreak - 1) * 0.5);
            matches.forEach(m => {
                m.isPopping = true;
                m.popProgress = 0;
                this.addScore(Math.round(10 * comboMult), m.x, m.y - this.cameraOffsetY);
            });
            SoundSynth.playPop(this.comboStreak - 1);
            if (matches.length >= 5) {
                this.addFloatingText('NICE COMBO! ✨', pos.x, pos.y - this.cameraOffsetY - 20, '#FFD700');
            }
            this.status = 'RESOLVING';
            this.resolveCeilingSupport();
        }
        else {
            this.comboStreak = 0;
            this.status = 'RESOLVING';
            this.resolveCeilingSupport();
        }
    }
    resolveCeilingSupport() {
        setTimeout(() => {
            const unsupported = BubblePhysics.findUnsupportedBubbles(this.bubbles);
            if (unsupported.length > 0) {
                SoundSynth.playDrop(unsupported.length);
                let dropScore = 0;
                unsupported.forEach(b => {
                    b.isDropping = true;
                    b.vx = (Math.random() - 0.5) * 3;
                    b.vy = -(Math.random() * 2 + 1);
                    b.vr = (Math.random() - 0.5) * 0.15;
                    dropScore += 10;
                });
                this.addScore(dropScore, VIRTUAL_WIDTH / 2, 200);
                this.addFloatingText(`+${dropScore} DROP BONUS! 💥`, VIRTUAL_WIDTH / 2, 220, '#61F07C');
            }
            this.updateCameraScroll();
        }, 120);
    }
    checkLevelEndConditions() {
        const activeBubbles = this.bubbles.filter(b => !b.isPopping && !b.isDropping && !b.isStone);
        if (activeBubbles.length === 0) {
            this.status = 'CLEAR';
            this.calculateStarRating();
            SoundSynth.playWin();
            this.spawnVictoryConfetti();
            return;
        }
        if (this.shotsRemaining <= 0) {
            this.status = 'FAILED';
            SoundSynth.playFail();
            return;
        }
        const level = LEVEL_DEFINITIONS[this.currentLevelIndex];
        const presentColors = [];
        activeBubbles.forEach(b => {
            if (b.type === 'dual' && b.dualColors) {
                if (!presentColors.includes(b.dualColors[0]))
                    presentColors.push(b.dualColors[0]);
                if (!presentColors.includes(b.dualColors[1]))
                    presentColors.push(b.dualColors[1]);
            }
            else if (b.type !== 'tricolor') {
                if (!presentColors.includes(b.type)) {
                    presentColors.push(b.type);
                }
            }
        });
        if (presentColors.length > 0) {
            if (this.currentBubbleType !== 'tricolor' &&
                !presentColors.includes(this.currentBubbleType)) {
                this.currentBubbleType = pickSmartNextColor(this.bubbles, level.availableColors);
            }
            if (this.nextBubbleType !== 'tricolor' &&
                !presentColors.includes(this.nextBubbleType)) {

            }
        }

        this.updateTrajectory();

    calculateStarRating() {
        const level = LEVEL_DEFINITIONS[this.currentLevelIndex];
        if (this.score >= level.targetScore) {
            this.resultStarsCount = 3;
        }
        else if (this.score >= level.targetScore * 0.65) {
            this.resultStarsCount = 2;
        }
        else {
            this.resultStarsCount = 1;
        }
    }
    addScore(pts, x, y) {

    addFloatingText(text, x, y, color) {

            text,
            x,
            y,
            color,
            strokeColor: 'rgba(0, 0, 0, 0.7)',
            scale: 1,
            alpha: 1,
            vy: -1.2,
            life: 0,
            maxLife: 0.8
        });
    }
    spawnPopParticles(x, y, type, dualColors) {

            const p = COLOR_PALETTE[dualColors[0]] || COLOR_PALETTE.red;
            col = p.main;
        }
        else {
            const p = COLOR_PALETTE[type] || COLOR_PALETTE.red;
            col = p.main;
        }
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
            const speed = Math.random() * 3.5 + 1.5;
            this.particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                radius: Math.random() * 3 + 1.5,
                color: col,
                alpha: 1,
                life: 0,
                maxLife: Math.random() * 0.3 + 0.2
            });
        }

    spawnBombExplosion(x, y) {
        for (let i = 0; i < 24; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 6 + 2;
            this.particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 1,
                radius: Math.random() * 5 + 2,
                color: ['#FF4500', '#FFA500', '#FFFF00', '#555555'][Math.floor(Math.random() * 4)],

                life: 0,
                maxLife: Math.random() * 0.4 + 0.25
            });
        }

            this.particles.push({
                x: VIRTUAL_WIDTH / 2 + (Math.random() - 0.5) * 200,
                y: 260 + (Math.random() - 0.5) * 60,
                vx: (Math.random() - 0.5) * 7,
                vy: -(Math.random() * 6 + 2.5),
                radius: Math.random() * 4 + 2,
                color: colors[Math.floor(Math.random() * colors.length)],
                alpha: 1,
                life: 0,
                maxLife: Math.random() * 1.0 + 0.6,

                vr: (Math.random() - 0.5) * 0.3

        }

    draw(ctx) {
        ctx.clearRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
        this.drawBackground(ctx);
        this.drawBoardBubbles(ctx);
        if (this.status === 'AIMING' && this.isAiming && this.trajectoryPoints.length > 1) {
            this.drawTrajectory(ctx);
        }
        if (this.status === 'FLYING' && this.projectile && this.projectile.active) {
            BubbleRenderer.drawBubble(ctx, this.projectile.x, this.projectile.y, this.projectile.radius, this.projectile.type, 1, 1, 0, this.projectile.dualColors);
        }
        this.drawLauncher(ctx);
        this.powerUps.draw(ctx, this.animTime);
        this.drawVFX(ctx);
        this.drawTopHeader(ctx);
        if (this.status === 'CLEAR' || this.status === 'FAILED') {

        }
    }
    drawBackground(ctx) {
        const bgGrad = ctx.createLinearGradient(0, -60, 0, VIRTUAL_HEIGHT + 60);
        bgGrad.addColorStop(0, '#95A7EC');
        bgGrad.addColorStop(0.5, '#A1B2F2');
        bgGrad.addColorStop(1, '#B5C3F7');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(-80, -80, VIRTUAL_WIDTH + 160, VIRTUAL_HEIGHT + 160);
    }
    drawBoardBubbles(ctx) {
        for (const b of this.bubbles) {
            const renderY = b.y - this.cameraOffsetY;
            if (renderY > -40 && renderY < LAUNCHER_Y + 20) {
                const idleBreathing = Math.sin(this.animTime * 2.5 + b.scaleOffset) * 0.015;
                const curScale = b.scale + (b.isPopping || b.isDropping ? 0 : idleBreathing);
                BubbleRenderer.drawBubble(ctx, b.x, renderY, b.radius, b.type, curScale, b.opacity, b.rotation, b.dualColors);
            }
        }

    getActiveBubbleColorHex() {
        let type = this.currentBubbleType;
        if (this.powerUps.selectedPowerUp) {
            type = this.powerUps.selectedPowerUp;
        }
        if (type === 'bomb')
            return '#334155';
        if (type === 'tricolor')
            return '#06B6D4';
        if (type === 'dual') {
            return COLOR_PALETTE.red.main;
        }
        const pal = COLOR_PALETTE[type];
        return pal ? pal.main : '#E51D2A';
    }
    drawTrajectory(ctx) {
        ctx.save();
        const verts = this.trajectoryPoints;
        const dotSpacing = 24;
        const activeColor = this.getActiveBubbleColorHex();
        if (verts.length > 1) {
            const p0 = verts[0];
            const p1 = verts[1];
            const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
            ctx.save();
            ctx.translate(p0.x + Math.cos(ang) * 32, p0.y + Math.sin(ang) * 32);
            ctx.rotate(ang + Math.PI / 2);
            ctx.strokeStyle = activeColor;
            ctx.lineWidth = 3.0;
            ctx.beginPath();
            ctx.moveTo(-6, 6);
            ctx.lineTo(0, -6);
            ctx.lineTo(6, 6);
            ctx.stroke();
            ctx.restore();
        }
        let distTraveled = 0;
        let nextDotDist = 20;
        for (let i = 1; i < verts.length; i++) {
            const p1 = verts[i - 1];
            const p2 = verts[i];
            const segLen = dist(p1.x, p1.y, p2.x, p2.y);
            if (segLen <= 0.1)
                continue;
            while (distTraveled + segLen >= nextDotDist) {
                const t = (nextDotDist - distTraveled) / segLen;
                const x = lerp(p1.x, p2.x, t);
                const y = lerp(p1.y, p2.y, t);
                ctx.beginPath();
                ctx.arc(x, y, 3.6, 0, Math.PI * 2);
                ctx.fillStyle = activeColor;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x - 1, y - 1, 1.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
                ctx.fill();
                nextDotDist += dotSpacing;
            }
            distTraveled += segLen;
        }
        ctx.restore();
    }
    drawLauncher(ctx) {

        const a1x = Math.cos(Math.PI * 1.35) * arrowR;
        const a1y = Math.sin(Math.PI * 1.35) * arrowR;
        ctx.save();
        ctx.translate(a1x, a1y);
        ctx.rotate(Math.PI * 1.35 + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(-4, -4);
        ctx.lineTo(0, 2);
        ctx.lineTo(4, -4);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();
        ctx.beginPath();
        ctx.arc(0, 0, arrowR, Math.PI * 1.75, Math.PI * 2.35);
        ctx.stroke();
        const a2x = Math.cos(Math.PI * 2.35) * arrowR;
        const a2y = Math.sin(Math.PI * 2.35) * arrowR;
        ctx.save();
        ctx.translate(a2x, a2y);
        ctx.rotate(Math.PI * 2.35 + Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(-4, -4);
        ctx.lineTo(0, 2);
        ctx.lineTo(4, -4);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();
        ctx.restore();
        const pillW = 46;

        const pillX = LAUNCHER_X - 66;

        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, pillH, 14);
        const purpleGrad = ctx.createLinearGradient(pillX, pillY, pillX, pillY + pillH);
        purpleGrad.addColorStop(0, '#8B5CF6');
        purpleGrad.addColorStop(1, '#6D28D9');
        ctx.fillStyle = purpleGrad;
        ctx.shadowColor = 'rgba(0, 0, 50, 0.25)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 14px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${this.shotsRemaining}`, pillX + pillW / 2, pillY + pillH / 2 + 1);
        ctx.restore();
    }
    drawTopHeader(ctx) {
        ctx.save();
        const topY = 16;
        const topH = 32;
        const lvlX = 10;
        const lvlW = 66;
        ctx.beginPath();
        ctx.roundRect(lvlX, topY, lvlW, topH, 16);
        const lvlGrad = ctx.createLinearGradient(lvlX, topY, lvlX, topY + topH);
        lvlGrad.addColorStop(0, '#38BDF8');
        lvlGrad.addColorStop(1, '#0284C7');
        ctx.fillStyle = lvlGrad;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 13px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`LV ${this.currentLevelIndex + 1}`, lvlX + lvlW / 2, topY + topH / 2 + 1);
        const barX = 84;
        const barW = 196;
        const barH = 24;
        const barY = topY + 4;
        ctx.beginPath();
        ctx.roundRect(barX, barY, barW, barH, 12);
        ctx.fillStyle = 'rgba(30, 45, 80, 0.65)';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#5E8CE8';
        ctx.stroke();
        const activeNonStone = this.bubbles.filter(b => !b.isPopping && !b.isDropping && !b.isStone).length;
        const clearedRatio = Math.max(0, Math.min(1, 1 - activeNonStone / this.initialBubbleCount));
        if (clearedRatio > 0.02) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(barX + 2, barY + 2, (barW - 4) * clearedRatio, barH - 4, 10);
            const fillGrad = ctx.createLinearGradient(barX, barY, barX, barY + barH);
            fillGrad.addColorStop(0, '#5ED5F8');
            fillGrad.addColorStop(1, '#1D82E2');
            ctx.fillStyle = fillGrad;
            ctx.fill();
            ctx.restore();
        }
        const starMilestones = [0.33, 0.66, 0.98];
        starMilestones.forEach(m => {
            const starX = barX + barW * m;
            const starY = barY + barH / 2;
            const isReached = clearedRatio >= m;
            ctx.save();
            if (isReached) {
                BubbleRenderer.drawStarBubble(ctx, 11);
            }
            else {
                ctx.globalAlpha = 0.45;
                BubbleRenderer.drawStarBubble(ctx, 9);
            }
            ctx.restore();
        });
        const scoreX = 288;
        const scoreW = 82;
        ctx.beginPath();
        ctx.roundRect(scoreX, topY, scoreW, topH, 16);
        const scoreGrad = ctx.createLinearGradient(scoreX, topY, scoreX, topY + topH);
        scoreGrad.addColorStop(0, '#2D3A5D');
        scoreGrad.addColorStop(1, '#18223C');
        ctx.fillStyle = scoreGrad;
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 15px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${this.displayScore}`, scoreX + scoreW / 2, topY + topH / 2 + 1);
        ctx.restore();
    }
    drawVFX(ctx) {
        for (const p of this.particles) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        for (const ft of this.floatingTexts) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, Math.min(1, ft.alpha));
            ctx.font = '900 16px Nunito, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 3;
            ctx.strokeStyle = ft.strokeColor;
            ctx.strokeText(ft.text, ft.x, ft.y);
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x, ft.y);
            ctx.restore();
        }
    }
    drawResultModal(ctx) {
        ctx.save();
        const t = this.resultAnimProgress;
        ctx.fillStyle = `rgba(15, 20, 45, ${0.72 * t})`;
        ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
        const cardW = 320;
        const cardH = 340;
        const cardX = (VIRTUAL_WIDTH - cardW) / 2;
        const cardY = (VIRTUAL_HEIGHT - cardH) / 2 - 20;
        const scale = lerp(0.85, 1.0, t);
        ctx.translate(VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT / 2);
        ctx.scale(scale, scale);
        ctx.translate(-VIRTUAL_WIDTH / 2, -VIRTUAL_HEIGHT / 2);
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
        cardGrad.addColorStop(0, '#FFFFFF');
        cardGrad.addColorStop(1, '#EBF1FF');
        ctx.fillStyle = cardGrad;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 10;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = this.status === 'CLEAR' ? '#FFD700' : '#8E44AD';
        ctx.stroke();
        if (this.status === 'CLEAR') {
            this.drawResultStars(ctx, cardX + cardW / 2, cardY + 45);
            ctx.fillStyle = '#2C3E50';
            ctx.font = '900 24px Nunito, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('YOU DID IT!', cardX + cardW / 2, cardY + 115);
            ctx.font = '700 15px Nunito, sans-serif';
            ctx.fillStyle = '#617D98';
            ctx.fillText(`LEVEL ${this.currentLevelIndex + 1} COMPLETED!`, cardX + cardW / 2, cardY + 140);
            ctx.font = '800 20px Nunito, sans-serif';
            ctx.fillStyle = '#E51D2A';
            ctx.fillText(`SCORE: ${this.score}`, cardX + cardW / 2, cardY + 180);
            this.draw3DButton(ctx, this.actionBtnBounds, 'NEXT', '#18C83A', '#0E8F28');
        }
        else {
            ctx.font = '48px Nunito, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('💔', cardX + cardW / 2, cardY + 65);
            ctx.fillStyle = '#2C3E50';
            ctx.font = '900 24px Nunito, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('TRY AGAIN!', cardX + cardW / 2, cardY + 120);
            ctx.font = '700 15px Nunito, sans-serif';
            ctx.fillStyle = '#8E44AD';
            ctx.fillText('OUT OF SHOTS', cardX + cardW / 2, cardY + 145);
            ctx.font = '800 20px Nunito, sans-serif';
            ctx.fillStyle = '#555555';
            ctx.fillText(`SCORE: ${this.score}`, cardX + cardW / 2, cardY + 185);
            this.draw3DButton(ctx, this.actionBtnBounds, 'RETRY', '#18C83A', '#0E8F28');
        }
        ctx.restore();
    }
    drawResultStars(ctx, cx, cy) {
        const starSpacing = 42;
        for (let i = 0; i < 3; i++) {
            const starX = cx + (i - 1) * starSpacing;
            const starY = cy + (i === 1 ? -6 : 4);
            const isEarned = i < this.resultStarsCount;
            ctx.save();
            if (isEarned) {
                BubbleRenderer.drawStarBubble(ctx, 16);
            }
            else {
                ctx.globalAlpha = 0.3;
                BubbleRenderer.drawStarBubble(ctx, 14);
            }
            ctx.restore();
        }
    }
    draw3DButton(ctx, bounds, label, colorTop, colorBottom) {
        ctx.save();
        const r = bounds.height / 2;
        ctx.beginPath();
        ctx.roundRect(bounds.x, bounds.y + 4, bounds.width, bounds.height, r);
        ctx.fillStyle = colorBottom;
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(bounds.x, bounds.y, bounds.width, bounds.height, r);
        const grad = ctx.createLinearGradient(bounds.x, bounds.y, bounds.x, bounds.y + bounds.height);
        grad.addColorStop(0, colorTop);
        grad.addColorStop(1, colorBottom);
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 2;
        ctx.fill();
        ctx.shadowColor = 'transparent';
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 18px Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, bounds.x + bounds.width / 2, bounds.y + bounds.height / 2);
        ctx.restore();
    }
}
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) {
        console.error('❌ gameCanvas element not found!');
        return;
    }
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx) {
        console.error('❌ Could not acquire 2D context!');
        return;
    }
    const engine = new GameEngine();
    let canvasScale = 1;
    let offsetX = 0;
    let offsetY = 0;
    function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const scaleX = winW / VIRTUAL_WIDTH;
        const scaleY = winH / VIRTUAL_HEIGHT;
        if (winW / winH < VIRTUAL_WIDTH / VIRTUAL_HEIGHT) {
            canvasScale = scaleX;
            offsetX = 0;
            offsetY = Math.max(0, (winH - VIRTUAL_HEIGHT * canvasScale) / 2);
        }
        else {
            canvasScale = scaleY;
            offsetX = (winW - VIRTUAL_WIDTH * canvasScale) / 2;
            offsetY = 0;
        }
        canvas.width = Math.round(winW * dpr);
        canvas.height = Math.round(winH * dpr);
        canvas.style.width = `${winW}px`;
        canvas.style.height = `${winH}px`;
        ctx.resetTransform?.();
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', resizeCanvas);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeCanvas);
    }
    resizeCanvas();
    function getVirtualCoords(clientX, clientY) {
        const x = (clientX - offsetX) / canvasScale;
        const y = (clientY - offsetY) / canvasScale;
        return { x, y };
    }
    let isPointerActive = false;
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        isPointerActive = true;
        const pt = getVirtualCoords(e.clientX, e.clientY);
        engine.handlePointerDown(pt.x, pt.y);
    });
    window.addEventListener('pointermove', (e) => {
        if (!isPointerActive)
            return;
        e.preventDefault();
        const pt = getVirtualCoords(e.clientX, e.clientY);
        engine.handlePointerMove(pt.x, pt.y);
    });
    window.addEventListener('pointerup', (e) => {
        if (!isPointerActive)
            return;
        e.preventDefault();
        isPointerActive = false;
        const pt = getVirtualCoords(e.clientX, e.clientY);
        engine.handlePointerUp(pt.x, pt.y);
    });
    window.addEventListener('pointercancel', (e) => {
        if (!isPointerActive)
            return;
        isPointerActive = false;
        const pt = getVirtualCoords(e.clientX, e.clientY);
        engine.handlePointerUp(pt.x, pt.y);
    });
    let lastTime = performance.now();
    function loop(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        engine.update(dt);
        ctx.save();
        const bgGrad = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
        bgGrad.addColorStop(0, '#95A7EC');
        bgGrad.addColorStop(0.5, '#A1B2F2');
        bgGrad.addColorStop(1, '#B5C3F7');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        ctx.translate(offsetX, offsetY);
        ctx.scale(canvasScale, canvasScale);
        engine.draw(ctx);
        ctx.restore();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
});
})();
  </script>
