<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fruit Frenzy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#fff3d6}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#fff3d6}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;
const holder=document.getElementById('game-container');holder.appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

let score=0,best=+localStorage.getItem('fruit-frenzy-best')||0;
let lives=3,over=false,started=false,combo=0,shake=0;
let last=performance.now(),spawnAt=0,elapsed=0,intro=1500;
let fruits=[],particles=[],splashes=[],leaves=[];
let muted=false;

const fruitsTypes=[
 {name:'apple',color:'#e94f4f',light:'#ff8580',r:19,pts:1},
 {name:'orange',color:'#f6a623',light:'#ffd06a',r:18,pts:2},
 {name:'pear',color:'#8cbe4f',light:'#c7e87a',r:18,pts:2},
 {name:'plum',color:'#7654a8',light:'#ad8bd5',r:18,pts:3},
 {name:'watermelon',color:'#47a85a',light:'#8edb7d',r:22,pts:3}
];

for(let i=0;i<18;i++) leaves.push({x:Math.random()*W,y:Math.random()*H,s:.25+Math.random()*.6,a:.18+Math.random()*.3,r:4+Math.random()*5});

let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,d=.07,type='sine'){
 if(muted)return;
 try{
  const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
  const o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;
  g.gain.value=.035;g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);
  o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+d)
 }catch(e){}
}
function burst(x,y,n,color){
 for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=45+Math.random()*180;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.55,max:.55,r:1+Math.random()*3,color})
 }
}
function spawn(){
 const f=fruitsTypes[Math.floor(Math.random()*fruitsTypes.length)];
 fruits.push({
   ...f,x:35+Math.random()*(W-70),y:H+35,
   vx:(Math.random()-.5)*(50+elapsed/900),vy:-(620+Math.random()*150+Math.min(260,elapsed/30000*260)),
   rot:Math.random()*6.28,vr:(Math.random()-.5)*4,
   sliced:false,missed:false
 });
}
function tap(clientX,clientY){
 if(over){reset();return}
 if(!started){
   started=true;
   if(!sound.A) try{sound.A=new(window.AudioContext||window.webkitAudioContext)();sound.A.resume()}catch(e){}
   return;
 }

 // Convert the screen tap into the game's 360x640 coordinate system.
 const rect=c.getBoundingClientRect();
 const px=(clientX-rect.left)*(W/rect.width);
 const py=(clientY-rect.top)*(H/rect.height);

 // Find the fruit closest to the tap point and catch/slice it.
 let hit=null, hitIndex=-1, bestDist=Infinity;
 for(let i=0;i<fruits.length;i++){
   const f=fruits[i];
   if(f.sliced) continue;
   const d=Math.hypot(px-f.x,py-f.y);
   const hitRadius=f.r+22;
   if(d<=hitRadius && d<bestDist){
     hit=f; hitIndex=i; bestDist=d;
   }
 }

 if(hit){
   sliceFruit(hit);
   fruits.splice(hitIndex,1);
 }else{
   // Missed tap: small feedback, but don't remove a life.
   burst(px,py,5,'#e6a06d');
   sound(220,.035,'sine');
 }
}
addEventListener('pointerdown',e=>{
 e.preventDefault();
 tap(e.clientX,e.clientY);
},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')tap()});
document.addEventListener('visibilitychange',()=>bridge(document.hidden?'onPause':'onResume'));

function reset(){
 score=0;lives=3;combo=0;over=false;started=false;fruits=[];particles=[];splashes=[];elapsed=0;intro=900;shake=0;last=performance.now();
}
function end(){
 if(over)return;over=true;shake=.35;sound(110,.18,'sawtooth');burst(W/2,H/2,35,'#e94f4f');
 if(score>best){best=score;localStorage.setItem('fruit-frenzy-best',best)}
 bridge('sendGameOver',score,1,Math.round(elapsed));
}
function sliceFruit(f){
 f.sliced=true;score+=f.pts+(combo>=4?1:0);combo++;
 bridge('sendScoreUpdated',score,1);sound(450+combo*25,.055,'triangle');
 burst(f.x,f.y,18,f.color);
 splashes.push({x:f.x,y:f.y,life:.45,max:.45,color:f.light,r:f.r*2});
 if(combo>=3)burst(f.x,f.y,8,'#fff7df');
}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function drawFruit(f){
 ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
 if(f.name==='apple'){
  ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(-6,2,f.r*.75,0,Math.PI*2);ctx.arc(7,2,f.r*.75,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=f.light;ctx.beginPath();ctx.arc(-7,-4,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#6d4428';ctx.fillRect(-2,-19,5,9);
  ctx.fillStyle='#4d9b4d';ctx.beginPath();ctx.ellipse(7,-17,8,4,-.4,0,Math.PI*2);ctx.fill();
 }else if(f.name==='orange'){
  ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=f.light;ctx.beginPath();ctx.arc(-6,-6,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#4e8b42';ctx.beginPath();ctx.ellipse(4,-18,8,4,.3,0,Math.PI*2);ctx.fill();
 }else if(f.name==='pear'){
  ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(0,7,f.r*.82,0,Math.PI*2);ctx.arc(0,-8,f.r*.58,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=f.light;ctx.beginPath();ctx.arc(-5,-7,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#735132';ctx.fillRect(-2,-22,4,9);
 }else if(f.name==='plum'){
  ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(0,0,f.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=f.light;ctx.beginPath();ctx.arc(-6,-7,6,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#735132';ctx.fillRect(-2,-19,4,8);
 }else{
  ctx.fillStyle='#3f9c58';ctx.beginPath();ctx.ellipse(0,0,f.r*1.05,f.r,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ef6461';ctx.beginPath();ctx.ellipse(0,0,f.r*.82,f*.0+f.r*.74,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff0d2';ctx.beginPath();ctx.ellipse(0,0,f.r*.64,f.r*.58,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#3d8c4c';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.ellipse(i*8,2,2,5,.3,0,Math.PI*2);ctx.fill()}
 }
 ctx.restore();
}

function frame(t){
 if(isPaused||window.__GAME_PAUSED__)return;
 const dt=Math.min(.033,(t-last)/1000);last=t;
 ctx.save();
 if(shake>0){ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);shake-=dt}
 elapsed+=started&&!over?dt:0;

 const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#fff0c9');bg.addColorStop(.55,'#fff8e9');bg.addColorStop(1,'#e7f4cf');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // Decorative leaves / garden atmosphere
 for(const l of leaves){
   l.y+=l.s*12*dt;if(l.y>H+10){l.y=-10;l.x=Math.random()*W}
   ctx.globalAlpha=l.a;ctx.fillStyle='#5c9d55';ctx.beginPath();ctx.ellipse(l.x,l.y,l.r,l.r*.45,l.x%2,0,Math.PI*2);ctx.fill()
 }
 ctx.globalAlpha=1;

 // soft awning
 ctx.fillStyle='rgba(255,255,255,.45)';ctx.fillRect(0,0,W,70);
 ctx.fillStyle='#d96b4f';ctx.fillRect(0,65,W,6);
 for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#fff1dc':'#e98969';ctx.beginPath();ctx.moveTo(i*45,0);ctx.lineTo((i+1)*45,0);ctx.lineTo((i+.7)*45,65);ctx.lineTo((i-.3)*45,65);ctx.closePath();ctx.fill()}

 if(!over&&started){
   if(t>spawnAt){spawn();if(Math.random()<.28)spawn();spawnAt=t+(730-Math.min(260,elapsed/25000*260))}
   for(let i=fruits.length-1;i>=0;i--){
     const f=fruits[i];f.vy+=780*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;
     if(f.x<18||f.x>W-18)f.vx*=-1;
     drawFruit(f);
     if(!f.missed&&f.y>H+40){f.missed=true;lives--;combo=0;shake=.12;sound(150,.06,'square');if(lives<=0)end()}
     if(f.y<-80||f.sliced)fruits.splice(i,1);
   }
 }else{
   for(const f of fruits)drawFruit(f)
 }

 // particles
 for(let i=particles.length-1;i>=0;i--){
   const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;
   if(p.life<=0){particles.splice(i,1);continue}
   ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()
 }
 ctx.globalAlpha=1;

 // splash rings
 for(let i=splashes.length-1;i>=0;i--){
   const s=splashes[i];s.life-=dt;if(s.life<=0){splashes.splice(i,1);continue}
   ctx.globalAlpha=s.life/s.max;ctx.strokeStyle=s.color;ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.x,s.y,s.r*(1+(1-s.life/s.max)*.8),0,Math.PI*2);ctx.stroke()
 }
 ctx.globalAlpha=1;

 // HUD
 ctx.textAlign='center';ctx.font='bold 43px Arial Black,Arial';ctx.fillStyle='#68452f';ctx.shadowColor='rgba(255,255,255,.8)';ctx.shadowBlur=5;ctx.fillText(score,W/2,48);ctx.shadowBlur=0;
 ctx.textAlign='left';ctx.font='bold 12px Arial';ctx.fillStyle='#7d604b';ctx.fillText('BEST '+best,16,24);
 ctx.textAlign='right';ctx.fillStyle='#d96b4f';ctx.font='bold 13px Arial';
 ctx.fillText('❤'.repeat(lives),W-16,25);
 if(combo>=3){ctx.textAlign='center';ctx.font='bold 15px Arial Black,Arial';ctx.fillStyle='#d96b4f';ctx.fillText('COMBO ×'+combo,W/2,86)}

 if(!started&&!over){
   intro-=dt*1000;
   if(intro>0){
     ctx.fillStyle='rgba(255,247,226,.22)';ctx.fillRect(0,0,W,H);
     ctx.textAlign='center';ctx.font='bold 31px Arial Black,Arial';ctx.fillStyle='#6a432d';ctx.fillText('FRUIT',W/2,255);ctx.fillText('FRENZY',W/2,292);
     ctx.font='bold 14px Arial';ctx.fillStyle='#d96b4f';ctx.fillText('TAP TO START',W/2,342);
     ctx.font='12px Arial';ctx.fillStyle='#8b725f';ctx.fillText('CATCH • COMBO • CELEBRATE',W/2,366);
   }
 }
 if(over){
   ctx.fillStyle='rgba(72,45,27,.48)';ctx.fillRect(0,0,W,H);
   ctx.fillStyle='#fffaf0';rounded(35,H/2-135,290,270,24);ctx.fill();
   ctx.strokeStyle='#e6a06d';ctx.lineWidth=3;rounded(35,H/2-135,290,270,24);ctx.stroke();
   ctx.textAlign='center';ctx.font='bold 28px Arial Black,Arial';ctx.fillStyle='#68452f';ctx.fillText('FRUIT BREAK',W/2,H/2-73);
   ctx.font='bold 50px Arial Black,Arial';ctx.fillStyle='#d96b4f';ctx.fillText(score,W/2,H/2-10);
   ctx.font='14px Arial';ctx.fillStyle='#8b725f';ctx.fillText('BEST  '+best,W/2,H/2+37);
   ctx.fillStyle='#d96b4f';rounded(80,H/2+60,200,50,25);ctx.fill();
   ctx.font='bold 13px Arial Black,Arial';ctx.fillStyle='#fff';ctx.fillText('TAP TO PLAY AGAIN',W/2,H/2+91);
 }
 ctx.restore();requestAnimationFrame(frame)
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
