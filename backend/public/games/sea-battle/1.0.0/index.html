function roundRectPath(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.lineTo(x + w - radius, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
    ctx.lineTo(x + w, y + h - radius);
    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
    ctx.lineTo(x + radius, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
    ctx.lineTo(x, y + radius);
    ctx.quadraticCurveTo(x, y, x + radius, y);
    ctx.closePath();
}

    }

    }

            { r, c: c + 1 }

            const st = grid[r][c].state;
            return st === 'empty' || st === 'ship';
        };
        if (this.difficulty === 'HARD') {
            if (this.hitsInCurrentShip.length >= 2) {
                const hits = this.hitsInCurrentShip;

                    const r = hits[0].r;
                    let minC = 999;
                    let maxC = -1;
                    for (const h of hits) {
                        if (h.c < minC)
                            minC = h.c;
                        if (h.c > maxC)
                            maxC = h.c;
                    }
                    if (isAvailable(r, minC - 1))

                    if (isAvailable(r, maxC + 1))
                        return { r, c: maxC + 1 };

                    const c = hits[0].c;

                    let maxR = -1;
                    for (const h of hits) {
                        if (h.r < minR)
                            minR = h.r;
                        if (h.r > maxR)
                            maxR = h.r;
                    }
                    if (isAvailable(minR - 1, c))
                        return { r: minR - 1, c };
                    if (isAvailable(maxR + 1, c))
                        return { r: maxR + 1, c };
                }
            }
            while (this.targetQueue.length > 0) {
                const target = this.targetQueue.shift();
                if (isAvailable(target.r, target.c)) {
                    return target;
                }
            }
            return this.getHighestProbabilityCell(grid, rows, cols, remainingShipSizes);
        }
        if (this.difficulty === 'MEDIUM') {
            while (this.targetQueue.length > 0) {
                const target = this.targetQueue.shift();
                if (isAvailable(target.r, target.c)) {
                    return target;
                }
            }
            const parityCells = [];
            const minShipSize = remainingShipSizes.length > 0 ? Math.min(...remainingShipSizes) : 2;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if ((r + c) % minShipSize === 0 && isAvailable(r, c)) {
                        parityCells.push({ r, c });
                    }
                }
            }
            if (parityCells.length > 0) {
                return parityCells[Math.floor(Math.random() * parityCells.length)];
            }
        }
        const allAvailable = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (isAvailable(r, c)) {
                    allAvailable.push({ r, c });
                }
            }
        }
        if (allAvailable.length > 0) {
            return allAvailable[Math.floor(Math.random() * allAvailable.length)];

    getHighestProbabilityCell(grid, rows, cols, shipSizes) {

            if (r < 0 || r >= rows || c < 0 || c >= cols)
                return false;
            const st = grid[r][c].state;
            return st === 'empty' || st === 'ship';
        };
        for (const size of shipSizes) {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c <= cols - size; c++) {
                    let valid = true;
                    for (let k = 0; k < size; k++) {
                        if (!canFit(r, c + k)) {
                            valid = false;
                            break;
                        }
                    }
                    if (valid) {
                        for (let k = 0; k < size; k++) {
                            heatmap[r][c + k]++;
                        }
                    }
                }
            }
            for (let c = 0; c < cols; c++) {
                for (let r = 0; r <= rows - size; r++) {
                    let valid = true;
                    for (let k = 0; k < size; k++) {
                        if (!canFit(r + k, c)) {
                            valid = false;
                            break;
                        }
                    }
                    if (valid) {
                        for (let k = 0; k < size; k++) {
                            heatmap[r + k][c]++;
                        }
                    }
                }
            }
        }
        let maxWeight = -1;
        let bestCells = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (canFit(r, c)) {

                    }

                    }
                }
            }
        }

            return bestCells[Math.floor(Math.random() * bestCells.length)];
        }

    }

    isPlacementValid(ship, r, c, isVertical, grid) {
        const size = ship.size;
        if (isVertical) {
            if (r < 0 || r + size > GRID_ROWS || c < 0 || c >= GRID_COLS)
                return false;
            for (let i = 0; i < size; i++) {
                const cell = grid[r + i][c];
                if (cell.shipId !== null && cell.shipId !== ship.id)
                    return false;
            }
        }
        else {
            if (r < 0 || r >= GRID_ROWS || c < 0 || c + size > GRID_COLS)
                return false;
            for (let i = 0; i < size; i++) {
                const cell = grid[r][c + i];
                if (cell.shipId !== null && cell.shipId !== ship.id)
                    return false;
            }
        }
        return true;
    }
    placeShip(ship, r, c, isVertical, grid) {
        if (!this.isPlacementValid(ship, r, c, isVertical, grid))
            return false;
        if (ship.isPlaced) {
            this.clearShipFromGrid(ship, grid);
        }
        ship.r = r;
        ship.c = c;
        ship.isVertical = isVertical;
        ship.isPlaced = true;
        for (let i = 0; i < ship.size; i++) {
            const cr = isVertical ? r + i : r;
            const cc = isVertical ? c : c + i;
            grid[cr][cc].state = 'ship';
            grid[cr][cc].shipId = ship.id;
        }
        return true;
    }
    clearShipFromGrid(ship, grid) {
        if (!ship.isPlaced)
            return;
        for (let r = 0; r < GRID_ROWS; r++) {
            for (let c = 0; c < GRID_COLS; c++) {
                if (grid[r][c].shipId === ship.id) {
                    grid[r][c].state = 'empty';
                    grid[r][c].shipId = null;
                }
            }
        }
        ship.isPlaced = false;
        ship.r = -1;
        ship.c = -1;
    }
    autoPlaceFleet(ships, grid) {
        for (let r = 0; r < GRID_ROWS; r++) {
            for (let c = 0; c < GRID_COLS; c++) {
                grid[r][c].state = 'empty';
                grid[r][c].shipId = null;
            }
        }
        const sorted = [...ships].sort((a, b) => b.size - a.size);
        for (const ship of sorted) {
            let placed = false;
            let attempts = 0;
            while (!placed && attempts < 200) {
                attempts++;
                const isVertical = Math.random() < 0.5;
                const maxR = isVertical ? GRID_ROWS - ship.size : GRID_ROWS - 1;
                const maxC = isVertical ? GRID_COLS - 1 : GRID_COLS - ship.size;
                if (maxR < 0 || maxC < 0)
                    continue;
                const r = Math.floor(Math.random() * (maxR + 1));
                const c = Math.floor(Math.random() * (maxC + 1));
                if (this.isPlacementValid(ship, r, c, isVertical, grid)) {
                    this.placeShip(ship, r, c, isVertical, grid);
                    placed = true;
                }
            }
        }
    }
    startDeploy() {

            isVertical: false,
            isPlaced: false,
            hits: 0,
            isSunk: false,

    onPointerUp() {

                this.placeShip(this.draggedShip, this.hoveredCell.r, this.hoveredCell.c, this.draggedShip.isVertical, this.playerGrid);
                Sound.playButton();
            }
            else {
                const { x: dx, y: dy, w: dw, h: dh } = this.deployDockBounds;

        const targetY = gy + targetR * cellSize + cellSize / 2;
        const cannonX = this.playerCannonPos.x;
        const cannonY = this.playerCannonPos.y;
        this.targetCannonAngle = Math.atan2(targetY - cannonY, targetX - cannonX);

        const isHit = cell.state === 'ship' && cell.shipId !== null;

            startY: cannonY,
            targetX,
            targetY,
            curX: cannonX,
            curY: cannonY,
            progress: 0,
            targetR,
            targetC,
            isBot: false,
            isHit
        });

    handlePlayerShotImpact(p) {
        const { targetR, targetC, isHit, targetX, targetY } = p;

        if (isHit && cell.shipId !== null) {
            cell.state = 'hit';
            this.stats.hits++;
            this.stats.score += 100;
            Sound.playHit();
            this.addHitExplosion(targetX, targetY);
            const ship = this.enemyShips.find(s => s.id === cell.shipId);
            if (ship) {
                ship.hits++;
                if (ship.hits >= ship.size) {
                    ship.isSunk = true;
                    this.stats.botShipsSunk++;
                    this.stats.score += 300;
                    Sound.playShipSunk();
                    this.screenShake.trigger(9, 0.3);
                }

            if (this.enemyShips.every(s => s.isSunk)) {
                setTimeout(() => this.triggerVictory(), 700);
                return;
            }
            this.isActionLocked = false;
        }
        else {
            cell.state = 'miss';
            this.stats.misses++;
            Sound.playMiss();
            this.addSplashParticles(targetX, targetY);

        const { x: gx, y: gy, cellSize } = this.playerGridBounds;
        const targetX = gx + target.c * cellSize + cellSize / 2;
        const targetY = gy + target.r * cellSize + cellSize / 2;
        const botCannonX = this.botCannonPos.x;
        const botCannonY = this.botCannonPos.y;
        this.targetBotCannonAngle = Math.atan2(targetY - botCannonY, targetX - botCannonX);
        this.botCannonRecoil = 1.0;
        const cell = this.playerGrid[target.r][target.c];
        const isHit = cell.state === 'ship' && cell.shipId !== null;
        Sound.playCannonShot();
        this.addMuzzleParticles(botCannonX, botCannonY, this.targetBotCannonAngle);
        this.screenShake.trigger(5, 0.18);
        this.projectiles.push({
            startX: botCannonX,
            startY: botCannonY,
            targetX,
            targetY,
            curX: botCannonX,
            curY: botCannonY,
            progress: 0,
            targetR: target.r,
            targetC: target.c,
            isBot: true,

    handleBotShotImpact(p) {
        const { targetR, targetC, isHit, targetX, targetY } = p;
        const cell = this.playerGrid[targetR][targetC];
        if (isHit && cell.shipId !== null) {
            cell.state = 'hit';
            Sound.playHit();
            this.addHitExplosion(targetX, targetY);
            this.ai.notifyHit(targetR, targetC);
            const ship = this.playerShips.find(s => s.id === cell.shipId);
            if (ship) {
                ship.hits++;
                if (ship.hits >= ship.size) {
                    ship.isSunk = true;
                    this.stats.playerShipsSunk++;
                    this.ai.notifyShipSunk();

                y,
                vx: Math.cos(a) * speed,
                vy: Math.sin(a) * speed - 40,
                size: Math.random() * 16 + 8,
                color: 'rgba(50, 60, 70, 0.75)',
                alpha: 0.8,
                life: 0,
                maxLife: 0.45,
                shape: 'smoke',
                rotation: Math.random() * Math.PI,
                gravity: -50
            });
        }
    }
    addSplashParticles(x, y) {
        for (let i = 0; i < 16; i++) {
            const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
            const speed = Math.random() * 180 + 60;
            this.particles.push({
                x,
                y,
                vx: Math.cos(a) * speed,
                vy: Math.sin(a) * speed,
                size: Math.random() * 8 + 3,
                color: '#74B9FF',
                alpha: 0.9,
                life: 0,
                maxLife: 0.35,
                shape: 'splash',
                rotation: 0,
                gravity: 420
            });

    }
    update(dt) {
        this.screenShake.update(dt);
        this.globalTime += dt;
        const targetPlayerAlpha = this.turn === 'PLAYER' ? 0.20 : 1.0;
        const targetEnemyAlpha = this.turn === 'PLAYER' ? 1.0 : 0.20;
        this.playerGridOpacity = lerp(this.playerGridOpacity, targetPlayerAlpha, dt * 7);
        this.enemyGridOpacity = lerp(this.enemyGridOpacity, targetEnemyAlpha, dt * 7);
        this.cannonAngle = lerp(this.cannonAngle, this.targetCannonAngle, dt * 10);
        if (this.cannonRecoil > 0) {
            this.cannonRecoil = Math.max(0, this.cannonRecoil - dt * 4);
        }
        this.botCannonAngle = lerp(this.botCannonAngle, this.targetBotCannonAngle, dt * 10);
        if (this.botCannonRecoil > 0) {
            this.botCannonRecoil = Math.max(0, this.botCannonRecoil - dt * 4);
        }
        if (this.state === 'BOT_DEPLOY') {
            this.botDeployTimer -= dt;
            if (this.botDeployTimer <= 0) {
                this.startBattle();
            }
        }
        for (let i = this.projectiles.length - 1; i >= 0; i--) {
            const p = this.projectiles[i];
            p.progress += dt * 1.3;
            p.curX = lerp(p.startX, p.targetX, p.progress);
            p.curY = lerp(p.startY, p.targetY, p.progress);
            if (Math.random() < 0.85) {
                const arcY = -Math.sin(p.progress * Math.PI) * 90;
                this.particles.push({
                    x: p.curX + (Math.random() - 0.5) * 6,
                    y: p.curY + arcY + (Math.random() - 0.5) * 6,
                    vx: (Math.random() - 0.5) * 20,
                    vy: (Math.random() - 0.5) * 20,
                    size: Math.random() * 8 + 4,
                    color: Math.random() < 0.6 ? '#FFA500' : 'rgba(160, 160, 160, 0.65)',
                    alpha: 0.8,
                    life: 0,
                    maxLife: 0.25,
                    shape: 'smoke',
                    rotation: Math.random() * Math.PI,
                    gravity: 0
                });
            }
            if (p.progress >= 1.0) {
                this.projectiles.splice(i, 1);
                if (p.isBot) {
                    this.handleBotShotImpact(p);
                }
                else {
                    this.handlePlayerShotImpact(p);
                }
            }
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life += dt;
            if (p.life >= p.maxLife) {
                this.particles.splice(i, 1);
                continue;
            }
            p.vy += p.gravity * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.alpha = 1 - p.life / p.maxLife;
        }
        if ((this.state === 'VICTORY' || this.state === 'DEFEAT') && this.resultModalAnim < 1.0) {
            this.resultModalAnim = Math.min(1.0, this.resultModalAnim + dt * 3.5);
        }
    }

                break;
            case 'DEPLOY':
                this.renderDeploy(ctx);
                break;

                break;
            case 'BATTLE':
            case 'VICTORY':
            case 'DEFEAT':
                this.renderBattle(ctx);
                break;
        }
        if (this.showHelpModal) {

        const barrelW = 36;
        const barrelH = 64;
        const grad = ctx.createLinearGradient(-barrelW / 2, 0, barrelW / 2, 0);
        grad.addColorStop(0, '#2F3640');
        grad.addColorStop(0.3, '#718093');
        grad.addColorStop(0.7, '#2F3640');
        grad.addColorStop(1, '#1E272E');
        ctx.fillStyle = grad;
        ctx.strokeStyle = '#1E272E';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        roundRectPath(ctx, -barrelW / 2, -barrelH + recoilOff, barrelW, barrelH, 10);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#1E272E';
        ctx.beginPath();
        ctx.ellipse(0, -barrelH + recoilOff, barrelW / 2 + 3, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(0, -barrelH + recoilOff, barrelW / 2 - 4, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    renderBotCannonTurret(ctx) {
        const cx = this.botCannonPos.x;
        const cy = this.botCannonPos.y;
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#2980B9';
        ctx.strokeStyle = '#102A43';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(0, 0, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#102A43';
        ctx.beginPath();
        ctx.arc(0, 0, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.rotate(this.botCannonAngle + Math.PI / 2);
        const recoilOff = this.botCannonRecoil * 10;
        const barrelW = 26;
        const barrelH = 46;
        const grad = ctx.createLinearGradient(-barrelW / 2, 0, barrelW / 2, 0);
        grad.addColorStop(0, '#1F3A52');
        grad.addColorStop(0.3, '#4FA8D8');
        grad.addColorStop(0.7, '#1F3A52');
        grad.addColorStop(1, '#0B1D2E');
        ctx.fillStyle = grad;
        ctx.strokeStyle = '#0B1D2E';
        ctx.lineWidth = 3;
        ctx.beginPath();
        roundRectPath(ctx, -barrelW / 2, -barrelH + recoilOff, barrelW, barrelH, 8);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#0B1D2E';
        ctx.beginPath();
        ctx.ellipse(0, -barrelH + recoilOff, barrelW / 2 + 2, 5.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#000000';
        ctx.beginPath();
        ctx.ellipse(0, -barrelH + recoilOff, barrelW / 2 - 3, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    renderSegmentBadges(ctx) {
        const enemyAlive = this.enemyShips.reduce((acc, s) => acc + (s.isSunk ? 0 : s.size - s.hits), 0);
        ctx.fillStyle = '#1E272E';
        ctx.beginPath();
        roundRectPath(ctx, 16, 12, 46, 26, 8);
        ctx.fill();
        ctx.font = '900 15px "Fredoka", sans-serif';
        ctx.fillStyle = COLORS.shipCyan;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${enemyAlive}`, 39, 25);
        const isPlayer = this.turn === 'PLAYER';
        ctx.fillStyle = isPlayer ? 'rgba(46, 204, 113, 0.25)' : 'rgba(231, 76, 60, 0.25)';
        ctx.strokeStyle = isPlayer ? '#2ECC71' : '#E74C3C';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        roundRectPath(ctx, this.width - 105, 12, 90, 26, 8);
        ctx.fill();
        ctx.stroke();
        ctx.font = '800 11px "Fredoka", sans-serif';
        ctx.fillStyle = isPlayer ? '#2ECC71' : '#FF7675';
        ctx.fillText(isPlayer ? 'YOUR TURN' : 'BOT TURN', this.width - 60, 25);
        const playerAlive = this.playerShips.reduce((acc, s) => acc + (s.isSunk ? 0 : s.size - s.hits), 0);
        const gridRight = this.playerGridBounds.x + this.playerGridBounds.w;
        const gridBottom = this.playerGridBounds.y + this.playerGridBounds.h;
        const badgeW = 46;
        const badgeH = 26;
        const badgeX = gridRight - badgeW;
        const badgeY = gridBottom + 8;
        ctx.fillStyle = '#1E272E';
        ctx.beginPath();
        roundRectPath(ctx, badgeX, badgeY, badgeW, badgeH, 8);
        ctx.fill();
        ctx.fillStyle = COLORS.shipCoral;
        ctx.font = '900 15px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${playerAlive}`, badgeX + badgeW / 2, badgeY + badgeH / 2);
    }
    drawFlameMarker(ctx, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        const pulse = 1.0 + Math.sin(this.globalTime * 9 + x * 0.1) * 0.12;
        const curSize = size * pulse;
        ctx.fillStyle = COLORS.hitFlame;
        ctx.beginPath();
        ctx.moveTo(0, -curSize);
        ctx.lineTo(curSize, 0);
        ctx.lineTo(0, curSize);
        ctx.lineTo(-curSize, 0);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = COLORS.hitFlameCenter;
        ctx.beginPath();
        ctx.moveTo(0, -curSize * 0.6);
        ctx.lineTo(curSize * 0.6, 0);
        ctx.lineTo(0, curSize * 0.6);
        ctx.lineTo(-curSize * 0.6, 0);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
    drawMissMarker(ctx, x, y, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = color || '#3E4C59';
        ctx.lineWidth = 6.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-size, -size);
        ctx.lineTo(size, size);
        ctx.moveTo(size, -size);
        ctx.lineTo(-size, size);
        ctx.stroke();
        ctx.restore();
    }
    renderProjectiles(ctx) {
        for (const p of this.projectiles) {
            ctx.save();
            const ballRadius = 16;
            const arcY = -Math.sin(p.progress * Math.PI) * 90;
            const altitudeScale = 1.0 + Math.sin(p.progress * Math.PI) * 0.35;
            const shadowRadius = ballRadius * (1.1 - (altitudeScale - 1) * 0.4);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
            ctx.beginPath();
            ctx.ellipse(p.curX, p.curY + 10, shadowRadius, shadowRadius * 0.6, 0, 0, Math.PI * 2);
            ctx.fill();
            const bx = p.curX;
            const by = p.curY + arcY;
            const ballGrad = ctx.createRadialGradient(bx - ballRadius * 0.35, by - ballRadius * 0.35, ballRadius * 0.1, bx, by, ballRadius * altitudeScale);
            ballGrad.addColorStop(0, '#95A5A6');
            ballGrad.addColorStop(0.35, '#34495E');
            ballGrad.addColorStop(0.85, '#1E272E');
            ballGrad.addColorStop(1, '#000000');
            ctx.fillStyle = ballGrad;
            ctx.beginPath();
            ctx.arc(bx, by, ballRadius * altitudeScale, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            ctx.arc(bx - ballRadius * 0.35, by - ballRadius * 0.35, ballRadius * 0.22, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
    renderParticles(ctx) {
        for (const p of this.particles) {
            if (p.alpha <= 0)
                continue;
            ctx.save();
            ctx.globalAlpha = p.alpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillStyle = p.color;
            if (p.shape === 'flame') {
                ctx.beginPath();
                ctx.moveTo(0, -p.size);
                ctx.lineTo(p.size, 0);
                ctx.lineTo(0, p.size);
                ctx.lineTo(-p.size, 0);
                ctx.fill();
            }
            else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
    }
    renderHelpModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fillRect(0, 0, this.width, this.height);
        const mw = Math.min(this.width - 40, 330);
        const mh = 320;
        const mx = (this.width - mw) / 2;
        const my = (this.height - mh) / 2;
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        roundRectPath(ctx, mx, my, mw, mh, 20);
        ctx.fill();
        ctx.font = '900 24px "Fredoka", sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('HOW TO PLAY', this.width / 2, my + 24);
        ctx.font = '600 14px "Fredoka", sans-serif';
        ctx.fillStyle = '#64748B';
        const lines = [
            '1. Drag ships onto the grid to deploy.',
            '2. Tap ships to rotate horizontally/vertically.',
            '3. Take turns firing cannons at enemy cells.',
            '4. Hits reveal enemy ships; sink all 5 ships to win!',
            '5. Hard mode AI uses probability heatmaps.'
        ];
        lines.forEach((l, i) => {
            ctx.fillText(l, this.width / 2, my + 75 + i * 32);
        });
        ctx.font = '800 15px "Fredoka", sans-serif';
        ctx.fillStyle = COLORS.btnBlue;
        ctx.fillText('TAP ANYWHERE TO CLOSE', this.width / 2, my + mh - 35);
    }
    renderResultModal(ctx) {
        const isWin = this.state === 'VICTORY';
        const scale = easeOutBack(Math.min(1.0, this.resultModalAnim));
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, this.width, this.height);
        const mw = Math.min(this.width - 40, 330);
        const mh = 360;
        const mx = (this.width - mw) / 2;
        const my = (this.height - mh) / 2 - 20;
        ctx.save();
        ctx.translate(this.width / 2, this.height / 2 - 20);
        ctx.scale(scale, scale);
        ctx.translate(-this.width / 2, -(this.height / 2 - 20));
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        roundRectPath(ctx, mx, my, mw, mh, 24);
        ctx.fill();
        ctx.font = '900 32px "Fredoka", sans-serif';
        ctx.fillStyle = isWin ? '#2ECC71' : '#E74C3C';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText(isWin ? 'VICTORY!' : 'DEFEAT', this.width / 2, my + 25);
        ctx.font = '900 42px "Fredoka", sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.fillText(`${this.stats.score}`, this.width / 2, my + 75);
        ctx.font = '700 14px "Fredoka", sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText(`ACCURACY: ${this.stats.accuracy}%  •  TURNS: ${this.stats.turns}`, this.width / 2, my + 130);
        ctx.fillText(`SHIPS SUNK: ${this.stats.botShipsSunk} / 5`, this.width / 2, my + 155);
        const { x: pax, y: pay, w: paw, h: pah } = this.modalPlayAgainRect;
        ctx.fillStyle = COLORS.btnBlue;
        ctx.beginPath();
        roundRectPath(ctx, pax, pay, paw, pah, 14);
        ctx.fill();
        ctx.font = '900 16px "Fredoka", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textBaseline = 'middle';
        ctx.fillText('PLAY AGAIN', pax + paw / 2, pay + pah / 2);
        const { x: mx2, y: my2, w: mw2, h: mh2 } = this.modalMenuRect;
        ctx.fillStyle = '#E2E8F0';
        ctx.beginPath();
        roundRectPath(ctx, mx2, my2, mw2, mh2, 14);
        ctx.fill();
        ctx.fillStyle = '#475569';
        ctx.fillText('MAIN MENU', mx2 + mw2 / 2, my2 + mh2 / 2);
        ctx.restore();
    }
}
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas)
        return;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx)
        return;
    const engine = new GameEngine();
    let dpr = 1;
    let cssWidth = 390;
    let cssHeight = 844;
    function resizeCanvas() {
        const vv = window.visualViewport;
        cssWidth = vv ? vv.width : window.innerWidth;
        cssHeight = vv ? vv.height : window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(cssWidth * dpr);
        canvas.height = Math.floor(cssHeight * dpr);
        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
        engine.resize(cssWidth, cssHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeCanvas);
    }
    resizeCanvas();
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (cssWidth / rect.width),
            y: (e.clientY - rect.top) * (cssHeight / rect.height)
        };
    }
    let isPointerDown = false;
    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isPointerDown = true;
        const { x, y } = getPointerPos(e);
        engine.onPointerDown(x, y);
    });
    window.addEventListener('mousemove', (e) => {
        if (!isPointerDown)
            return;
        const { x, y } = getPointerPos(e);
        engine.onPointerMove(x, y);
    });
    window.addEventListener('mouseup', (e) => {
        if (!isPointerDown)
            return;
        isPointerDown = false;
        engine.onPointerUp();
    });
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length > 0) {
            isPointerDown = true;
            const { x, y } = getPointerPos(e.touches[0]);
            engine.onPointerDown(x, y);
        }
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (!isPointerDown)
            return;
        e.preventDefault();
        if (e.touches.length > 0) {
            const { x, y } = getPointerPos(e.touches[0]);
            engine.onPointerMove(x, y);
        }
    }, { passive: false });
    window.addEventListener('touchend', (e) => {
        if (!isPointerDown)
            return;
        isPointerDown = false;
        engine.onPointerUp();
    }, { passive: false });
    window.addEventListener('touchcancel', () => {
        isPointerDown = false;
        engine.onPointerUp();
    }, { passive: false });
    let lastTime = performance.now();
    function loop(currentTime) {
        const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;
        engine.update(dt);
        engine.render(ctx);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
});
})();
  </script>
