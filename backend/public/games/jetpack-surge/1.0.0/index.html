<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jetpack Surge</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#f0f9ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#f0f9ff}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;c.style.width='min(100vw,56.25vh)';c.style.height='min(177.78vw,100vh)';
document.getElementById('game-container').appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

let score=0,coins=0,best=+localStorage.getItem('jetpack-surge-best')||0;
let over=false,started=false,last=performance.now(),shake=0,speed=290;
let player={x:65,y:H/2,vy:0,w:26,h:32,thrust:false,tilt:0};
let barriers=[],collectibles=[],particles=[],popups=[],clouds=[],spawnTimer=0;
let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

for(let i=0;i<8;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*(H-100),s:0.3+Math.random()*0.5,w:60+Math.random()*80});

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,dur=0.06,type='sine',vol=0.04){
  try{
    const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
    if(A.state==='suspended')A.resume();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
    o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
  }catch(e){}
}

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,r:2+Math.random()*3,color});
  }
}

function spawnBarrier(){
  const gap=120;
  const centerY=80+Math.random()*(H-220);
  const isMoving=Math.random()<0.4;
  barriers.push({
    x:W+40,
    topY:centerY-gap/2,
    botY:centerY+gap/2,
    w:28,
    isMoving,
    vy:isMoving?60:0,
    color:'#ef4444'
  });

  if(Math.random()<0.7){
    collectibles.push({
      x:W+40,
      y:centerY+(Math.random()-0.5)*40,
      r:11,
      color:'#f59e0b'
    });
  }
}

function reset(){
  score=0;coins=0;over=false;started=true;
  barriers=[];collectibles=[];particles=[];popups=[];
  player={x:65,y:H/2,vy:0,w:26,h:32,thrust:false,tilt:0};
  spawnTimer=0;speed=290;last=performance.now();shake=0;
  bridge('gameStarted');
}

function endGame(){
  if(over)return;
  over=true;shake=0.4;
  sound(130,0.35,'sawtooth',0.08);
  bridge('haptic','error');
  burst(player.x+player.w/2,player.y+player.h/2,24,'#ef4444');
  if(score>best){best=score;localStorage.setItem('jetpack-surge-best',best);}
  bridge('sendGameOver',score,1,30);
}

function setThrust(val){
  if(over){if(val)reset();return;}
  if(!started){if(val){started=true;bridge('gameStarted');}}
  player.thrust=val;
  if(val){
    sound(320,0.05,'sawtooth',0.03);
    bridge('haptic','light');
  }
}

c.addEventListener('touchstart',e=>{e.preventDefault();setThrust(true);},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();setThrust(false);},{passive:false});
c.addEventListener('pointerdown',e=>{e.preventDefault();setThrust(true);},{passive:false});
c.addEventListener('pointerup',e=>{e.preventDefault();setThrust(false);},{passive:false});

function frame(t){
  if(isPaused||window.__GAME_PAUSED__)return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);shake-=dt;}

  // Sky Background
  ctx.fillStyle='#f0f9ff';ctx.fillRect(0,0,W,H);

  // Parallax Clouds
  for(const cl of clouds){
    if(started&&!over)cl.x-=cl.s*speed*dt*0.4;
    if(cl.x<-120)cl.x=W+60;
    ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.arc(cl.x,cl.y,cl.w*0.25,0,Math.PI*2);
    ctx.arc(cl.x+cl.w*0.2,cl.y-10,cl.w*0.3,0,Math.PI*2);
    ctx.arc(cl.x+cl.w*0.45,cl.y,cl.w*0.25,0,Math.PI*2);
    ctx.fill();
  }

  if(started&&!over){
    speed+=dt*5;
    score+=Math.round(speed*dt*0.1);
    bridge('sendScoreUpdated',score,1);

    spawnTimer+=dt;
    if(spawnTimer>=Math.max(1.0,1.9-speed*0.002)){
      spawnTimer=0;
      spawnBarrier();
    }

    // Jetpack Physics
    if(player.thrust){
      player.vy-=850*dt; // Upward rocket boost
      player.tilt+=( -0.35 - player.tilt)*0.2;
      // Rocket Fire Particle
      particles.push({
        x:player.x-4,
        y:player.y+player.h-4,
        vx:-150-(Math.random()*80),
        vy:(Math.random()-0.5)*60,
        life:0.25,max:0.25,r:3+Math.random()*3,color:'#f97316'
      });
    }else{
      player.vy+=720*dt; // Gravity
      player.tilt+=( 0.25 - player.tilt)*0.15;
    }

    player.y+=player.vy*dt;

    // Boundaries
    if(player.y<30){player.y=30;player.vy=0;}
    if(player.y>H-60){endGame();}
  }

  // Update & Draw Barriers
  for(let i=barriers.length-1;i>=0;i--){
    const bar=barriers[i];
    if(started&&!over){
      bar.x-=speed*dt;
      if(bar.isMoving){
        bar.topY+=bar.vy*dt;
        bar.botY+=bar.vy*dt;
        if(bar.topY<60||bar.botY>H-80)bar.vy*=-1;
      }
    }
    if(bar.x<-50){barriers.splice(i,1);continue;}

    // Top Barrier
    ctx.fillStyle='#ef4444';
    ctx.fillRect(bar.x-bar.w/2,0,bar.w,bar.topY);
    ctx.fillStyle='#dc2626';ctx.fillRect(bar.x-bar.w/2+4,0,bar.w-8,bar.topY);
    ctx.fillStyle='#fbbf24';ctx.fillRect(bar.x-bar.w/2,bar.topY-10,bar.w,10);

    // Bottom Barrier
    ctx.fillStyle='#ef4444';
    ctx.fillRect(bar.x-bar.w/2,bar.botY,bar.w,H-bar.botY);
    ctx.fillStyle='#dc2626';ctx.fillRect(bar.x-bar.w/2+4,bar.botY,bar.w-8,H-bar.botY);
    ctx.fillStyle='#fbbf24';ctx.fillRect(bar.x-bar.w/2,bar.botY,bar.w,10);

    // Collision Check
    if(!over&&player.x+player.w-4>bar.x-bar.w/2&&player.x+4<bar.x+bar.w/2){
      if(player.y+4<bar.topY||player.y+player.h-4>bar.botY){
        endGame();
      }
    }
  }

  // Update & Draw Collectibles
  for(let i=collectibles.length-1;i>=0;i--){
    const col=collectibles[i];
    if(started&&!over)col.x-=speed*dt;
    if(col.x<-40){collectibles.splice(i,1);continue;}

    ctx.fillStyle=col.color;ctx.beginPath();ctx.arc(col.x,col.y,col.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fef08a';ctx.beginPath();ctx.arc(col.x,col.y,col.r*0.6,0,Math.PI*2);ctx.fill();

    // Pickup Check
    if(!over&&Math.hypot((player.x+player.w/2)-col.x,(player.y+player.h/2)-col.y)<player.w/2+col.r){
      coins++;score+=50;
      sound(780,0.06,'triangle',0.06);
      bridge('haptic','light');
      burst(col.x,col.y,10,col.color);
      popups.push({x:col.x,y:col.y,text:'+50',color:col.color,life:0.45,max:0.45});
      collectibles.splice(i,1);
    }
  }

  // Draw Player Hero
  ctx.save();
  ctx.translate(player.x+player.w/2,player.y+player.h/2);
  ctx.rotate(player.tilt);

  // Jetpack Rocket
  ctx.fillStyle='#64748b';ctx.fillRect(-16,-8,8,20);
  ctx.fillStyle='#ef4444';ctx.fillRect(-16,8,8,6);

  // Hero Body
  ctx.fillStyle='#0284c7';
  ctx.beginPath();ctx.roundRect(-8,-14,20,28,6);ctx.fill();
  // Visor
  ctx.fillStyle='#38bdf8';
  ctx.beginPath();ctx.roundRect(0,-10,10,8,3);ctx.fill();

  ctx.restore();

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Popups
  for(let i=popups.length-1;i>=0;i--){
    const pp=popups[i];pp.life-=dt;pp.y-=25*dt;
    if(pp.life<=0){popups.splice(i,1);continue;}
    ctx.globalAlpha=pp.life/pp.max;ctx.fillStyle=pp.color;
    ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText(pp.text,pp.x,pp.y);
  }
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle='#0f172a';ctx.font='900 24px sans-serif';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,20,40);
  ctx.textAlign='right';ctx.fillStyle='#f59e0b';
  ctx.fillText(`★ ${coins}`,W-20,40);

  // Start Screen
  if(!started&&!over){
    ctx.fillStyle='rgba(240,249,255,0.92)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#0f172a';ctx.font='900 34px sans-serif';
    ctx.fillText('JETPACK SURGE',W/2,H*0.36);
    ctx.fillStyle='#0284c7';ctx.font='bold 15px sans-serif';
    ctx.fillText('HIGH-VELOCITY SKY BOOSTER',W/2,H*0.36+32);
    ctx.fillStyle='#64748b';ctx.font='14px sans-serif';
    ctx.fillText('Hold touch to boost upward, release to fall!',W/2,H*0.52);
    ctx.fillStyle='#0284c7';
    ctx.beginPath();ctx.roundRect(W/2-90,H*0.62,180,50,25);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';
    ctx.fillText('TAP TO PLAY',W/2,H*0.62+30);
  }

  // Game Over
  if(over){
    ctx.fillStyle='rgba(240,249,255,0.92)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.roundRect(35,H/2-130,290,260,20);ctx.fill();
    ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.strokeRect(35,H/2-130,290,260);
    ctx.textAlign='center';ctx.fillStyle='#ef4444';ctx.font='900 26px sans-serif';
    ctx.fillText('BOOSTER OVERHEAT',W/2,H/2-70);
    ctx.fillStyle='#0f172a';ctx.font='900 48px sans-serif';
    ctx.fillText(score,W/2,H/2-10);
    ctx.fillStyle='#64748b';ctx.font='14px sans-serif';
    ctx.fillText(`BEST SCORE: ${best}`,W/2,H/2+38);
    ctx.fillStyle='#0284c7';
    ctx.beginPath();ctx.roundRect(W/2-85,H/2+62,170,44,22);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';
    ctx.fillText('PLAY AGAIN',W/2,H/2+89);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
