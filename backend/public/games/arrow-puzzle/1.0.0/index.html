<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arrow Puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F6F7FB;
      color: #23283B;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 920px;
      background: #F6F7FB;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }

    @media (min-width: 481px) {
      #app {
        border-radius: 28px;
        height: 92vh;
      }
    }

    .screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Splash Screen */
    .splash-screen {
      background: #FFFFFF;
      justify-content: center;
      align-items: center;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .splash-title {
      font-size: 20px;
      font-weight: 700;
      color: #33B679;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #23283B;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.15s ease;
    }

    .icon-btn:active {
      background: rgba(0, 0, 0, 0.05);
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
    }

    /* Game Screen */
    .game-screen {
      justify-content: space-between;
    }

    .game-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 8px 20px;
    }

    .game-header-info {
      display: flex;
      flex-direction: column;
    }

    .game-header-lvl {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .badge-hard {
      background: #000000;
      color: #FFFFFF;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .game-header-sub {
      font-size: 12px;
      color: #8B90A3;
      font-weight: 600;
      margin-top: 2px;
    }

    .game-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hearts-container {
      display: flex;
      gap: 4px;
    }

    .heart-icon {
      width: 26px;
      height: 26px;
    }

    .heart-icon.full {
      color: #F25757;
    }

    .heart-icon.broken {
      color: rgba(0, 0, 0, 0.18);
    }

    .canvas-viewport {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      touch-action: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      position: absolute;
      cursor: pointer;
      touch-action: none;
    }

    .game-bottom-bar {
      padding: 12px 20px 24px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 56px;
    }

    .tutorial-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #33B679;
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 16px;
      font-weight: 900;
      letter-spacing: 1.2px;
      box-shadow: 0 4px 12px rgba(51, 182, 121, 0.35);
    }

    .tutorial-badge svg {
      width: 24px;
      height: 24px;
    }

    /* Modal Overlays */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .modal-card {
      width: 100%;
      max-width: 320px;
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    .win-title { color: #33B679; }
    .fail-title { color: #F25757; }

    .modal-subtitle {
      font-size: 14px;
      color: #8B90A3;
      margin-top: 6px;
      margin-bottom: 20px;
    }

    .celebration-canvas-wrap {
      position: relative;
      width: 280px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .celebration-canvas-wrap canvas {
      position: absolute;
      top: 0;
      left: 0;
    }

    .win-trophy-icon {
      width: 60px;
      height: 60px;
      color: #33B679;
      position: relative;
      z-index: 2;
    }

    .modal-stars {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .star-pop {
      font-size: 34px;
      color: #F0A93B;
      animation: starBounce 0.4s ease-out;
    }

    .star-pop.empty {
      color: rgba(0, 0, 0, 0.15);
    }

    @keyframes starBounce {
      0% { transform: scale(0); }
      70% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .modal-actions-single {
      display: flex;
      width: 100%;
      justify-content: center;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 800;
      letter-spacing: 2px;
      border-radius: 16px;
      transition: transform 0.12s ease, opacity 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-next-single {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #33B679, #10B981);
      color: #FFFFFF;
      font-size: 15px;
      box-shadow: 0 6px 16px rgba(51, 182, 121, 0.38);
    }

    .btn-retry-single {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #F25757, #E03131);
      color: #FFFFFF;
      font-size: 15px;
      box-shadow: 0 6px 16px rgba(242, 87, 87, 0.38);
    }

    .fail-icon-wrap {
      margin-bottom: 4px;
    }

    .fail-heart-icon {
      width: 58px;
      height: 58px;
      color: #F25757;
    }
