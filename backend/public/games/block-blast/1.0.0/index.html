class ScreenShake {
    constructor() {
        this.intensity = 0;
        this.duration = 0;
        this.timer = 0;
        this.offsetX = 0;
        this.offsetY = 0;
    }
    trigger(intensity = 6, duration = 0.2) {
        this.intensity = intensity;
        this.duration = duration;
        this.timer = duration;
    }
    update(dt) {
        if (this.timer > 0) {
            this.timer -= dt;
            const progress = this.timer / this.duration;
            const currentIntensity = this.intensity * progress;
            this.offsetX = (Math.random() * 2 - 1) * currentIntensity;
            this.offsetY = (Math.random() * 2 - 1) * currentIntensity;
        }
        else {
            this.offsetX = 0;
            this.offsetY = 0;
        }
    }
}

    spawnNextRoundPieces() {
        const newPieces = generateNextTrayPieces(this.board.grid);
        for (let i = 0; i < 3; i++) {
            this.traySlots[i].shape = newPieces[i] || null;
            this.traySlots[i].available = !!newPieces[i];
            this.traySlots[i].spawnProgress = 0;
            this.traySlots[i].scale = 0.1;
        }
        this.updateDimmedStates();

    updateDimmedStates() {
        let anyCanFit = false;
        for (const slot of this.traySlots) {
            if (slot.available && slot.shape) {
                const fits = canShapeFitOnBoard(slot.shape, this.board.grid);
                slot.isDimmed = !fits;
                if (fits)
                    anyCanFit = true;
            }
        }
        const hasRemaining = this.traySlots.some(s => s.available && s.shape);
        if (hasRemaining && !anyCanFit && this.state === 'PLAYING') {
            this.triggerGameOver();
        }
    }
    triggerGameOver() {
        this.state = 'GAME_OVER';
        this.showGameOverModal = true;
        this.gameOverAnimProgress = 0;
        Sound.playGameOver();
        GameBridge.sendGameOver(this.score);
        if (this.score > this.bestScore) {
            this.newBestAchieved = true;

            this.bestScore = this.score;
            setTimeout(() => Sound.playHighScore(), 400);

        for (let i = 0; i < 3; i++) {
            const slotX = 16 + i * slotW;
            this.traySlots[i].x = slotX;
            this.traySlots[i].y = trayY;
            this.traySlots[i].baseX = slotX + slotW / 2;
            this.traySlots[i].baseY = trayY + trayH / 2 - 20;
            this.traySlots[i].width = slotW;
            this.traySlots[i].height = trayH - 30;

    onPointerDown(px, py) {
        if (px >= this.settingsBtnRect.x &&
            px <= this.settingsBtnRect.x + this.settingsBtnRect.w &&
            py >= this.settingsBtnRect.y &&
            py <= this.settingsBtnRect.y + this.settingsBtnRect.h) {
            Sound.playPop(600, 0.05);
            this.isSettingsOpen = !this.isSettingsOpen;
            return;
        }
        if (this.isSettingsOpen) {
            if (px >= this.soundToggleRect.x &&
                px <= this.soundToggleRect.x + this.soundToggleRect.w &&
                py >= this.soundToggleRect.y &&
                py <= this.soundToggleRect.y + this.soundToggleRect.h) {
                Sound.toggleSound();
                return;
            }
            if (px >= this.vibeToggleRect.x &&
                px <= this.vibeToggleRect.x + this.vibeToggleRect.w &&
                py >= this.vibeToggleRect.y &&
                py <= this.vibeToggleRect.y + this.vibeToggleRect.h) {
                Sound.toggleVibration();
                return;
            }
            if (px >= this.closeSettingsRect.x &&
                px <= this.closeSettingsRect.x + this.closeSettingsRect.w &&
                py >= this.closeSettingsRect.y &&
                py <= this.closeSettingsRect.y + this.closeSettingsRect.h) {
                Sound.playPop(480, 0.04);
                this.isSettingsOpen = false;
                return;
            }
            this.isSettingsOpen = false;
            return;
        }
        if (this.state === 'GAME_OVER' && this.showGameOverModal) {
            if (px >= this.restartBtnRect.x &&
                px <= this.restartBtnRect.x + this.restartBtnRect.w &&
                py >= this.restartBtnRect.y &&
                py <= this.restartBtnRect.y + this.restartBtnRect.h) {
                Sound.playPop(550, 0.08);
                this.startNewGame();
                return;
            }
            return;
        }
        if (this.state !== 'PLAYING')
            return;
        for (let i = 0; i < 3; i++) {
            const slot = this.traySlots[i];
            if (!slot.available || !slot.shape)
                continue;
            const hitMargin = 15;
            if (px >= slot.x - hitMargin &&
                px <= slot.x + slot.width + hitMargin &&
                py >= slot.y - hitMargin &&
                py <= slot.y + slot.height + hitMargin) {
                const touchOffsetY = 72;
                const cellSize = this.board.cellSize;
                const pieceW = slot.shape.width * cellSize;
                const pieceH = slot.shape.height * cellSize;
                this.draggedPiece = {
                    shape: slot.shape,
                    slotIndex: i,
                    currentX: px,
                    currentY: py,
                    touchOffsetX: 0,
                    grabOffsetX: pieceW / 2,
                    grabOffsetY: pieceH / 2,
                    scale: slot.scale,
                    targetGridX: -1,
                    targetGridY: -1,
                    isValidPlacement: false
                };
                slot.available = false;
                Sound.playPickup();
                this.updateDragSnap(px, py, touchOffsetY);

            }

    onPointerMove(px, py) {
        if (!this.draggedPiece)
            return;
        this.draggedPiece.currentX = px;
        this.draggedPiece.currentY = py;

    updateDragSnap(px, py, touchOffsetY) {
        if (!this.draggedPiece)
            return;
        const cellSize = this.board.cellSize;
        const step = cellSize + this.board.cellGap;
        const pieceTopLeftX = px - this.draggedPiece.grabOffsetX;
        const pieceTopLeftY = py - this.draggedPiece.grabOffsetY - touchOffsetY;
        const { gx, gy } = this.board.pixelToGrid(pieceTopLeftX + cellSize * 0.3, pieceTopLeftY + cellSize * 0.3);
        if (this.board.canPlace(this.draggedPiece.shape, gx, gy)) {
            this.draggedPiece.targetGridX = gx;
            this.draggedPiece.targetGridY = gy;
            this.draggedPiece.isValidPlacement = true;
        }
        else {
            this.draggedPiece.targetGridX = -1;
            this.draggedPiece.targetGridY = -1;
            this.draggedPiece.isValidPlacement = false;
        }
    }
    onPointerUp() {
        if (!this.draggedPiece)
            return;
        const { shape, slotIndex, isValidPlacement, targetGridX, targetGridY } = this.draggedPiece;
        if (isValidPlacement && targetGridX >= 0 && targetGridY >= 0) {
            this.board.placeShape(shape, targetGridX, targetGridY);
            this.traySlots[slotIndex].shape = null;
            this.traySlots[slotIndex].available = false;
            const placementPoints = shape.blockCount;
            this.score += placementPoints;
            this.scorePulseTimer = 0.25;
            const { x: placePx, y: placePy } = this.board.gridToPixel(targetGridX, targetGridY);
            this.particles.addFloatingScore(`+${placementPoints}`, placePx + (shape.width * this.board.cellSize) / 2, placePy + (shape.height * this.board.cellSize) / 2, '#ffffff', '#1e293b');
            Sound.playSnap();
            this.screenShake.trigger(3.5, 0.1);
            const fullLines = this.board.detectFullLines();
            const totalLines = fullLines.rows.length + fullLines.cols.length;
            if (totalLines > 0) {
                this.combo++;
                this.state = 'CLEARING';
                let lineScore = totalLines * 10;
                if (totalLines > 1)
                    lineScore += totalLines * 15;
                if (this.combo > 1)
                    lineScore += this.combo * 15;
                this.score += lineScore;
                this.scorePulseTimer = 0.35;
                const clearedBlocks = this.board.startLineClear(fullLines.rows, fullLines.cols);
                for (const r of fullLines.rows) {
                    const p = this.board.gridToPixel(0, r);
                    this.particles.addLineClearAura('row', r, this.board.boardX + this.board.padding, p.y, this.board.boardSize - this.board.padding * 2, this.board.cellSize);
                }
                for (const c of fullLines.cols) {
                    const p = this.board.gridToPixel(c, 0);
                    this.particles.addLineClearAura('col', c, p.x, this.board.boardY + this.board.padding, this.board.cellSize, this.board.boardSize - this.board.padding * 2);
                }
                for (const blk of clearedBlocks) {
                    const p = this.board.gridToPixel(blk.c, blk.r);
                    this.particles.addGemBurst(p.x + this.board.cellSize / 2, p.y + this.board.cellSize / 2, blk.color.base, 12);
                }
                const centerPx = this.board.boardX + this.board.boardSize / 2;
                const centerPy = this.board.boardY + this.board.boardSize / 2;
                if (this.combo > 1) {
                    Sound.playCombo(this.combo);
                    this.particles.addFloatingScore(`+${lineScore}`, centerPx, centerPy, '#fbbf24', '#1e3a8a', true, this.combo);
                }
                else {
                    Sound.playLineClear(totalLines);
                    this.particles.addFloatingScore(`+${lineScore}`, centerPx, centerPy, '#ffffff', '#0f172a');
                }
                this.screenShake.trigger(Math.min(10, 5 + this.combo * 1.5), 0.28);
            }
            else {
                this.combo = 0;
            }
            const anyTrayLeft = this.traySlots.some(s => s.available && s.shape);
            if (!anyTrayLeft) {
                this.spawnNextRoundPieces();
            }
            else {
                this.updateDimmedStates();
            }
        }
        else {
            this.traySlots[slotIndex].available = true;
        }
        this.draggedPiece = null;
    }
    update(dt) {
        this.screenShake.update(dt);
        this.particles.update(dt, this.width, this.height);
        if (this.scorePulseTimer > 0) {
            this.scorePulseTimer -= dt;
        }
        for (const slot of this.traySlots) {
            if (slot.spawnProgress < 1.0) {
                slot.spawnProgress = Math.min(1.0, slot.spawnProgress + dt * 4.5);
                slot.scale = lerp(0.1, 0.62, easeOutBack(slot.spawnProgress));
            }
        }
        if (this.draggedPiece) {
            this.draggedPiece.scale = lerp(this.draggedPiece.scale, 1.0, dt * 16);
        }
        if (this.state === 'CLEARING') {
            const finished = this.board.updateClearing(dt);
            if (finished) {
                this.state = 'PLAYING';
                this.updateDimmedStates();
            }
        }
        if (this.showGameOverModal && this.gameOverAnimProgress < 1.0) {
            this.gameOverAnimProgress = Math.min(1.0, this.gameOverAnimProgress + dt * 3.5);
        }
    }

        ctx.lineTo(0, -h / 2);
        ctx.lineTo(w / 4, 0);

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-w / 2 - 2, -h / 4, 2, 0, Math.PI * 2);

    drawGearIcon(ctx, cx, cy, radius) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = '#cbd5e1';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 4;
        const teeth = 8;
        const innerR = radius * 0.7;
        const outerR = radius;
        ctx.beginPath();
        for (let i = 0; i < teeth * 2; i++) {
            const r = i % 2 === 0 ? outerR : innerR;
            const a = (Math.PI * i) / teeth;
            const x = Math.cos(a) * r;
            const y = Math.sin(a) * r;
            if (i === 0)
                ctx.moveTo(x, y);
            else
                ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#28469a';
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

                        const bx = px + c * cellSize;
                        const by = py + r * cellSize;

        const cardH = 360;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2 - 20;
        ctx.save();
        ctx.translate(this.width / 2, this.height / 2 - 20);
        ctx.scale(alpha, alpha);
        ctx.translate(-this.width / 2, -(this.height / 2 - 20));
        ctx.fillStyle = '#17224d';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 4;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
        ctx.shadowBlur = 30;
        ctx.beginPath();
        roundRectPath(ctx, cardX, cardY, cardW, cardH, 24);
        ctx.fill();
        ctx.stroke();
        this.drawCrownIcon(ctx, this.width / 2, cardY + 36, 36);
        ctx.font = '900 32px "Fredoka", "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('GAME OVER', this.width / 2, cardY + 70);
        if (this.newBestAchieved) {
            ctx.font = '900 18px "Fredoka", sans-serif';
            ctx.fillStyle = '#fbbf24';
            ctx.fillText('🎉 NEW BEST SCORE! 🎉', this.width / 2, cardY + 112);
        }
        const scoreBoxY = cardY + (this.newBestAchieved ? 142 : 125);
        ctx.font = '700 16px "Fredoka", sans-serif';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('FINAL SCORE', this.width / 2, scoreBoxY);
        ctx.font = '900 48px "Fredoka", "Lilita One", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(`${this.score}`, this.width / 2, scoreBoxY + 32);
        ctx.font = '700 16px "Fredoka", sans-serif';
        ctx.fillStyle = '#fbbf24';
        ctx.fillText(`BEST: ${this.bestScore}`, this.width / 2, scoreBoxY + 84);
        const btnW = 230;
        const btnH = 54;
        const btnX = (this.width - btnW) / 2;
        const btnY = cardY + cardH - 74;
        this.restartBtnRect = { x: btnX, y: btnY, w: btnW, h: btnH };
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        roundRectPath(ctx, btnX, btnY + 4, btnW, btnH, 16);
        ctx.fill();
        const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
        btnGrad.addColorStop(0, '#4ade80');
        btnGrad.addColorStop(1, '#22c55e');
        ctx.fillStyle = btnGrad;
        ctx.beginPath();
        roundRectPath(ctx, btnX, btnY, btnW, btnH, 16);
        ctx.fill();
        ctx.font = '900 22px "Fredoka", "Outfit", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 2;
        ctx.fillText('PLAY AGAIN', this.width / 2, btnY + btnH / 2);
        ctx.restore();
        ctx.restore();
    }
}
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas)
        return;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx)
        return;
    const engine = new GameEngine();
    let dpr = 1;
    let cssWidth = 390;
    let cssHeight = 844;
    function resizeCanvas() {
        const vv = window.visualViewport;
        cssWidth = vv ? vv.width : window.innerWidth;
        cssHeight = vv ? vv.height : window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(cssWidth * dpr);
        canvas.height = Math.floor(cssHeight * dpr);
        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
        engine.resize(cssWidth, cssHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeCanvas);
    }
    resizeCanvas();
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top
        };
    }
    let isPointerDown = false;
    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isPointerDown = true;
        const { x, y } = getPointerPos(e);
        engine.onPointerDown(x, y);
    });
    window.addEventListener('mousemove', (e) => {
        if (!isPointerDown)
            return;
        const { x, y } = getPointerPos(e);
        engine.onPointerMove(x, y);
    });
    window.addEventListener('mouseup', (e) => {
        if (!isPointerDown)
            return;
        isPointerDown = false;
        engine.onPointerUp();
    });
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length > 0) {
            isPointerDown = true;
            const { x, y } = getPointerPos(e.touches[0]);
            engine.onPointerDown(x, y);
        }
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (!isPointerDown)
            return;
        e.preventDefault();
        if (e.touches.length > 0) {
            const { x, y } = getPointerPos(e.touches[0]);
            engine.onPointerMove(x, y);
        }
    }, { passive: false });
    window.addEventListener('touchend', (e) => {
        if (!isPointerDown)
            return;
        isPointerDown = false;
        engine.onPointerUp();
    }, { passive: false });
    window.addEventListener('touchcancel', () => {
        isPointerDown = false;
        engine.onPointerUp();
    }, { passive: false });
    let lastTime = performance.now();
    function loop(currentTime) {
        const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;
        engine.update(dt);
        engine.render(ctx);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
});
})();
  </script>
