<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Memory Flip</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#090d1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0f172a}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;c.style.width='min(100vw,56.25vh)';c.style.height='min(177.78vw,100vh)';
document.getElementById('game-container').appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

const SYMBOLS=['★','♥','♦','⚡','●','▲','🌙','✦'];
const COLORS=['#fbbf24','#ef4444','#ec4899','#38bdf8','#22c55e','#f97316','#a855f7','#06b6d4'];

let cards=[],flipped=[],matched=0,moves=0,score=0,combo=0,best=+localStorage.getItem('memory-flip-best')||0;
let over=false,started=false,last=performance.now(),shake=0,timer=0,lock=false;
let particles=[],popups=[];
let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,dur=0.06,type='sine',vol=0.04){
  try{
    const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
    if(A.state==='suspended')A.resume();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
    o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
  }catch(e){}
}

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,r:2+Math.random()*3,color});
  }
}

function initGrid(){
  const pairs=[...SYMBOLS,...SYMBOLS];
  for(let i=pairs.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pairs[i],pairs[j]]=[pairs[j],pairs[i]];
  }

  cards=[];
  const gridW=4,gridH=4;
  const cardSize=68,gap=12;
  const startX=(W-(gridW*cardSize+(gridW-1)*gap))/2;
  const startY=H*0.22;

  for(let r=0;r<gridH;r++){
    for(let col=0;col<gridW;col++){
      const sym=pairs[r*gridW+col];
      const symIdx=SYMBOLS.indexOf(sym);
      cards.push({
        x:startX+col*(cardSize+gap),
        y:startY+r*(cardSize+gap),
        w:cardSize,
        h:cardSize,
        symbol:sym,
        color:COLORS[symIdx],
        state:'down', // 'down', 'flipping_up', 'up', 'flipping_down', 'matched'
        flipScale:1
      });
    }
  }
}

function flipCard(card){
  if(lock||card.state!=='down'||flipped.length>=2)return;
  if(over){reset();return;}
  if(!started){started=true;bridge('gameStarted');}

  card.state='flipping_up';
  sound(480,0.06,'sine',0.05);
  bridge('haptic','light');
  flipped.push(card);

  if(flipped.length===2){
    moves++;
    lock=true;
    const [c1,c2]=flipped;
    if(c1.symbol===c2.symbol){
      // MATCH!
      setTimeout(()=>{
        c1.state='matched';c2.state='matched';
        matched+=2;combo++;
        const pts=100+combo*25;
        score+=pts;
        bridge('sendScoreUpdated',score,1);
        bridge('haptic','medium');
        sound(650+combo*40,0.1,'triangle',0.06);
        burst(c1.x+c1.w/2,c1.y+c1.h/2,12,c1.color);
        burst(c2.x+c2.w/2,c2.y+c2.h/2,12,c2.color);
        flipped=[];lock=false;
        if(matched===16)endGame();
      },300);
    }else{
      // NO MATCH
      combo=0;
      setTimeout(()=>{
        c1.state='flipping_down';c2.state='flipping_down';
        sound(220,0.08,'sawtooth',0.05);
        flipped=[];lock=false;
      },750);
    }
  }
}

function reset(){
  score=0;combo=0;moves=0;matched=0;timer=0;over=false;started=true;lock=false;
  flipped=[];particles=[];popups=[];last=performance.now();shake=0;
  initGrid();
  bridge('gameStarted');
}

function endGame(){
  if(over)return;
  over=true;shake=0.25;
  sound(750,0.3,'triangle',0.08);
  if(score>best){best=score;localStorage.setItem('memory-flip-best',best);}
  bridge('sendGameOver',score,1,Math.round(timer));
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const clX=e.touches?e.touches[0].clientX:e.clientX;
  const clY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clX-r.left)*(W/r.width),y:(clY-r.top)*(H/r.height)};
}

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=getPos(e);
  if(!started||over){reset();return;}

  for(const card of cards){
    if(p.x>=card.x&&p.x<=card.x+card.w&&p.y>=card.y&&p.y<=card.y+card.h){
      flipCard(card);
      break;
    }
  }
},{passive:false});

initGrid();

function frame(t){
  if(isPaused||window.__GAME_PAUSED__)return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);shake-=dt;}

  // Background
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);

  if(started&&!over)timer+=dt;

  // HUD
  ctx.fillStyle='#ffffff';ctx.font='bold 22px sans-serif';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,24,42);
  ctx.textAlign='right';ctx.fillStyle='#38bdf8';
  ctx.fillText(`MOVES: ${moves}`,W-24,42);

  // Draw Cards
  for(const card of cards){
    // Flip Animation Scaling
    if(card.state==='flipping_up'){
      card.flipScale-=dt*8;
      if(card.flipScale<=-1){card.flipScale=1;card.state='up';}
    }else if(card.state==='flipping_down'){
      card.flipScale-=dt*8;
      if(card.flipScale<=-1){card.flipScale=1;card.state='down';}
    }

    const cx=card.x+card.w/2,cy=card.y+card.h/2;
    const scaleX=Math.abs(card.flipScale);

    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(scaleX,1);

    if(card.state==='down'||(card.state==='flipping_up'&&card.flipScale>0)||(card.state==='flipping_down'&&card.flipScale<0)){
      // Card Back
      ctx.fillStyle='#1e293b';ctx.fillRect(-card.w/2,-card.h/2,card.w,card.h);
      ctx.strokeStyle='#38bdf8';ctx.lineWidth=2;ctx.strokeRect(-card.w/2,-card.h/2,card.w,card.h);
      ctx.fillStyle='#334155';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('?',0,0);
    }else{
      // Card Front
      ctx.fillStyle=card.state==='matched'?'#064e3b':'#1e293b';
      ctx.fillRect(-card.w/2,-card.h/2,card.w,card.h);
      ctx.strokeStyle=card.color;ctx.lineWidth=card.state==='matched'?3:2;
      ctx.strokeRect(-card.w/2,-card.h/2,card.w,card.h);
      ctx.fillStyle=card.color;ctx.font='bold 32px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(card.symbol,0,0);
    }
    ctx.restore();
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Start Screen
  if(!started&&!over){
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 32px sans-serif';
    ctx.fillText('MEMORY FLIP',W/2,H*0.36);
    ctx.fillStyle='#38bdf8';ctx.font='bold 14px sans-serif';
    ctx.fillText('4×4 CARD MATCHING PUZZLE',W/2,H*0.36+30);
    ctx.fillStyle='#94a3b8';ctx.font='13px sans-serif';
    ctx.fillText('Tap cards to find matching pairs!',W/2,H*0.52);
    ctx.fillStyle='#0284c7';ctx.fillRect(W/2-90,H*0.62,180,48);
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';
    ctx.fillText('TAP TO PLAY',W/2,H*0.62+30);
  }

  // Game Over
  if(over){
    ctx.fillStyle='rgba(15,23,42,0.88)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1e293b';ctx.fillRect(35,H/2-130,290,260);
    ctx.strokeStyle='#22c55e';ctx.lineWidth=2;ctx.strokeRect(35,H/2-130,290,260);
    ctx.textAlign='center';ctx.fillStyle='#22c55e';ctx.font='bold 26px sans-serif';
    ctx.fillText('BOARD CLEARED!',W/2,H/2-70);
    ctx.fillStyle='#ffffff';ctx.font='bold 48px sans-serif';
    ctx.fillText(score,W/2,H/2-10);
    ctx.fillStyle='#94a3b8';ctx.font='14px sans-serif';
    ctx.fillText(`BEST SCORE: ${best}`,W/2,H/2+38);
    ctx.fillStyle='#0284c7';ctx.fillRect(W/2-85,H/2+62,170,44);
    ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';
    ctx.fillText('PLAY AGAIN',W/2,H/2+89);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
