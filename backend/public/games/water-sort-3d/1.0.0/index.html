            if (tubes[i].length === 0)

            for (let j = 0; j < tubes.length; j++) {
                if (i === j || tubes[j].length >= capacity)

        const sinA = Math.sin(tiltAngle);

        const ctrl1X = spoutX + (isPouringRight ? Math.abs(cosA) * shootDist : -Math.abs(cosA) * shootDist);
        const ctrl1Y = spoutY + Math.abs(sinA) * (shootDist * 0.4);

        const ctrl2Y = targetY - 18;

        ctx.strokeStyle = palette.glow;
        ctx.lineWidth = 16;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(spoutX, spoutY);
        ctx.bezierCurveTo(ctrl1X, ctrl1Y, ctrl2X, ctrl2Y, targetX, targetY);
        ctx.strokeStyle = palette.primary; // Pure flat solid color

        ctx.lineWidth = pulseWidth;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(spoutX, spoutY);
        ctx.bezierCurveTo(ctrl1X, ctrl1Y, ctrl2X, ctrl2Y, targetX, targetY);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.82)';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        const beadPhase = (time * 5.2) % 1.0;
        const u = 1 - beadPhase;
        const tt = beadPhase * beadPhase;
        const uu = u * u;
        const uuu = uu * u;
        const ttt = tt * beadPhase;
        const bx = uuu * spoutX + 3 * uu * beadPhase * ctrl1X + 3 * u * tt * ctrl2X + ttt * targetX;
        const by = uuu * spoutY + 3 * uu * beadPhase * ctrl1Y + 3 * u * tt * ctrl2Y + ttt * targetY;

        ctx.arc(bx, by, 2.6, 0, Math.PI * 2);

class ParticleSystem {
    constructor() {

    }

        this.particles = [];
        this.popups = [];
    }

        const palette = LIQUID_PALETTE[colorId % LIQUID_PALETTE.length];
        for (let i = 0; i < count; i++) {
            const angle = -Math.PI * 0.5 + (Math.random() - 0.5) * 1.6;
            const speed = 50 + Math.random() * 90;
            this.particles.push({
                x: cx + (Math.random() - 0.5) * 10,
                y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: palette.particles[Math.floor(Math.random() * palette.particles.length)],
                size: 2.5 + Math.random() * 3.5,
                life: 0.4 + Math.random() * 0.2,
                maxLife: 0.6,
                type: 'SPLASH'
            });
        }
    }
    spawnTubeCompleteAura(cx, cy, colorId) {
        const palette = LIQUID_PALETTE[colorId % LIQUID_PALETTE.length];
        for (let i = 0; i < 22; i++) {
            const angle = (i / 22) * Math.PI * 2;
            const speed = 80 + Math.random() * 120;
            this.particles.push({
                x: cx,
                y: cy,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                color: palette.primary,
                size: 5 + Math.random() * 4,
                life: 0.75,
                maxLife: 0.75,
                type: 'STAR'
            });
        }
    }
    spawnScorePopup(x, y, text, color = '#FFE082') {
        this.popups.push({
            x,
            y,
            text,
            color,
            life: 1.1,
            maxLife: 1.1
        });
    }
    spawnConfetti(width, height) {
        const colors = ['#FF416C', '#00D2FC', '#00E676', '#FFB300', '#9D4EDD', '#FFFFFF'];
        for (let i = 0; i < 48; i++) {
            this.particles.push({
                x: Math.random() * width,
                y: -15 - Math.random() * 60,
                vx: (Math.random() - 0.5) * 70,
                vy: 110 + Math.random() * 150,
                color: colors[Math.floor(Math.random() * colors.length)],
                size: 6 + Math.random() * 5,
                life: 2.0,
                maxLife: 2.0,
                type: 'STAR'
            });
        }
    }
    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life -= dt;
            if (p.life <= 0) {
                this.particles.splice(i, 1);
                continue;
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (p.type === 'SPLASH' || p.type === 'STAR') {
                p.vy += 260 * dt;
            }
        }
        for (let i = this.popups.length - 1; i >= 0; i--) {
            const pop = this.popups[i];
            pop.life -= dt;
            pop.y -= 32 * dt;
            if (pop.life <= 0) {
                this.popups.splice(i, 1);
            }
        }
    }

        ctx.save();
        for (const p of this.particles) {
            const alpha = Math.max(0, p.life / p.maxLife);
            ctx.globalAlpha = alpha;
            if (p.type === 'STAR') {
                VectorIcons.drawStar(ctx, p.x, p.y, p.size, p.color, '#FF9100');
            }
            else {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        for (const pop of this.popups) {
            const alpha = Math.max(0, pop.life / pop.maxLife);
            const scale = 1.0 + (1.0 - alpha) * 0.35;
            ctx.globalAlpha = alpha;
            ctx.save();
            ctx.translate(pop.x, pop.y);
            ctx.scale(scale, scale);
            ctx.font = '900 16px Fredoka, Lilita One, sans-serif';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillText(pop.text, 1.5, 1.5);
            ctx.fillStyle = pop.color;
            ctx.fillText(pop.text, 0, 0);
            ctx.restore();
        }
        ctx.restore();
    }
}

    layoutTubes() {
        if (this.tubes.length === 0)
            return;
        const count = this.tubes.length;
        let cols = count;
        let rows = 1;
        if (count > 4) {
            rows = 2;
            cols = Math.ceil(count / 2);
        }
        const topPadding = 68;
        const bottomNavHeight = 96;
        const availW = this.width - 36;
        const availH = this.height - topPadding - bottomNavHeight;
        const currentCapacity = this.tubes[0].capacity;
        // Aspect ratio scales with color stack capacity (4 cap -> 4.0, 6 cap -> 5.2, 7 cap -> 5.8, 9 cap -> 6.8)
        let aspect = 4.0;
        if (currentCapacity === 6)
            aspect = 5.2;
        else if (currentCapacity === 7)
            aspect = 5.8;
        else if (currentCapacity >= 8)
            aspect = 6.8;
        const maxTubeW = (currentCapacity >= 8) ? 38 : (currentCapacity >= 6 ? 42 : 46);
        let tubeW = Math.min(maxTubeW, (availW - (cols - 1) * (cols > 3 ? 14 : 20)) / cols);
        let tubeH = tubeW * aspect;
        const totalGridH = rows * tubeH + (rows - 1) * 26;
        if (totalGridH > availH) {
            const scale = availH / totalGridH;
            tubeW *= scale;
            tubeH *= scale;
        }
        let maxSpacing = 24;
        if (cols === 2)
            maxSpacing = 44;
        else if (cols === 3)
            maxSpacing = 32;
        else if (cols === 4)
            maxSpacing = 24;
        else
            maxSpacing = 18;
        const naturalSpacing = (availW - cols * tubeW) / (cols > 1 ? cols - 1 : 1);
        const spacingX = Math.max(14, Math.min(maxSpacing, naturalSpacing));
        const spacingY = Math.max(22, tubeH * 0.14);
        const actualGridW = cols * tubeW + (cols - 1) * spacingX;
        const actualGridH = rows * tubeH + (rows - 1) * spacingY;
        const startX = (this.width - actualGridW) / 2;
        const startY = topPadding + (availH - actualGridH) / 2;
        for (let i = 0; i < count; i++) {
            let r = 0;
            let c = i;
            if (rows === 2) {
                const topRowCols = Math.ceil(count / 2);
                if (i < topRowCols) {
                    r = 0;
                    c = i;
                }
                else {
                    r = 1;
                    const bottomRowCols = count - topRowCols;
                    const bottomStartX = (this.width - (bottomRowCols * tubeW + (bottomRowCols - 1) * spacingX)) / 2;
                    const colIdx = i - topRowCols;
                    this.tubes[i].width = tubeW;
                    this.tubes[i].height = tubeH;
                    this.tubes[i].x = bottomStartX + colIdx * (tubeW + spacingX);
                    this.tubes[i].y = startY + r * (tubeH + spacingY);
                    continue;
                }
            }
            this.tubes[i].width = tubeW;
            this.tubes[i].height = tubeH;
            this.tubes[i].x = startX + c * (tubeW + spacingX);
            this.tubes[i].y = startY + r * (tubeH + spacingY);
        }
    }

    onTubeTap(index) {
        if (this.state !== 'PLAYING' || this.activePour !== null)
            return;
        if (index < 0 || index >= this.tubes.length)
            return;
        this.clearHints();
        const clickedTube = this.tubes[index];
        if (this.selectedTubeIndex === null) {
            if (!clickedTube.isEmpty && !clickedTube.isCompleted) {
                this.selectedTubeIndex = index;
                clickedTube.isSelected = true;
                this.synth.playSelect();
                if (this.isTutorial && index === 0) {
                    this.tutorialStep = 1;
                }
            }
            else if (clickedTube.isCompleted) {
                this.synth.playButton();
            }
        }
        else {
            if (this.selectedTubeIndex === index) {
                clickedTube.isSelected = false;
                this.selectedTubeIndex = null;
                this.synth.playButton();
                if (this.isTutorial)
                    this.tutorialStep = 0;
            }
            else {
                const sourceTube = this.tubes[this.selectedTubeIndex];
                if (sourceTube.canPourInto(clickedTube)) {
                    this.executePour(this.selectedTubeIndex, index);
                }
                else {
                    this.synth.playError();
                    this.screenShake = 5;
                    sourceTube.isSelected = false;
                    this.selectedTubeIndex = null;
                    if (this.isTutorial)
                        this.tutorialStep = 0;
                }
            }
        }
    }
    executePour(fromIdx, toIdx) {
        const from = this.tubes[fromIdx];
        const to = this.tubes[toIdx];
        const color = from.topColor;
        const amount = from.getPourableAmount(to);
        if (amount <= 0)
            return;
        this.pushUndoSnapshot();
        this.state = 'POURING';
        this.selectedTubeIndex = null;
        from.isSelected = false;
        const sourceStartX = from.x;
        const sourceStartY = from.y;
        const isPouringRight = to.x >= from.x;
        const targetTiltAngle = isPouringRight ? 1.36 : -1.36; // ~78 degrees tilt
        // Target mouth opening center
        const targetMouthCenterX = to.x + to.width / 2;
        const targetMouthCenterY = to.y + (to.isBottleShape ? 4 : 2);
        // Spout position: hovers ~26px above and slightly offset so stream arcs cleanly into center
        const targetSpoutX = targetMouthCenterX + (isPouringRight ? -14 : 14);
        const targetSpoutY = targetMouthCenterY - 26;
        let localLipX = 0;
        let localLipY = 0;
        const halfW = from.width / 2;
        const halfH = from.height / 2;
        if (from.isBottleShape) {
            const neckW = from.width * 0.45;
            localLipX = isPouringRight ? (neckW / 2 + 1) : -(neckW / 2 + 1);
            localLipY = -halfH + 3;
        }
        else {
            localLipX = isPouringRight ? (halfW + 1) : -(halfW + 1);
            localLipY = -halfH + 1;
        }
        const rad = targetTiltAngle;
        const cosA = Math.cos(rad);
        const sinA = Math.sin(rad);
        const rotatedLipOffsetX = (localLipX * cosA - localLipY * sinA);
        const rotatedLipOffsetY = (localLipX * sinA + localLipY * cosA);
        const targetCenterX = targetSpoutX - rotatedLipOffsetX;
        const targetCenterY = targetSpoutY - rotatedLipOffsetY;
        const targetPourX = targetCenterX - halfW;
        const targetPourY = targetCenterY - halfH;
        // Transfer duration scales strictly with block count: 1 block = 0.88s, 2 blocks = 1.76s, etc.
        const tiltSec = 0.24;
        const transferSec = amount * 0.88;
        const returnSec = 0.22;
        const totalDuration = tiltSec + transferSec + returnSec;
        const tiltFraction = tiltSec / totalDuration;
        const transferFraction = transferSec / totalDuration;
        const returnStartFraction = tiltFraction + transferFraction;
        this.activePour = {
            fromIdx,
            toIdx,
            colorId: color,
            amount,
            progress: 0,
            sourceStartX,
            sourceStartY,
            targetPourX,
            targetPourY,
            targetTiltAngle,
            streamStarted: false,
            totalDuration,
            tiltFraction,
            transferFraction,
            returnStartFraction
        };
        from.pourDrainAmount = 0;
        to.pourFillAmount = 0;
        to.pourFillColor = color;
        this.synth.playSwoosh();
    }
    finishActivePour() {
        if (!this.activePour)
            return;
        const { fromIdx, toIdx, colorId, amount } = this.activePour;
        const from = this.tubes[fromIdx];
        const to = this.tubes[toIdx];
        // Transfer liquid units into data model + keep newly poured units revealed
        for (let i = 0; i < amount; i++) {
            if (from.liquids.length > 0 && from.topColor === colorId && to.liquids.length < to.capacity) {
                from.liquids.pop();
                from.revealed.pop();
                to.liquids.push(colorId);
                to.revealed.push(true);
            }
        }
        // Permanently unlock layer underneath in ghost levels
        if (this.isGhostLevel && from.liquids.length > 0) {
            const topIdx = from.liquids.length - 1;
            if (!from.revealed[topIdx]) {
                from.revealed[topIdx] = true;
                this.synth.playRevealMystery();
                this.particles.spawnSplash(from.x + from.width / 2, from.y + from.height * 0.35, from.topColor, 8);
                this.particles.spawnScorePopup(from.x + from.width / 2, from.y - 12, 'UNLOCKED!', '#FFA726');
            }
        }
        from.x = this.activePour.sourceStartX;
        from.y = this.activePour.sourceStartY;
        from.tiltAngle = 0;
        from.pourDrainAmount = 0;
        to.pourFillAmount = 0;
        to.pourFillColor = -1;
        this.moves++;
        this.activePour = null;
        this.synth.stopPourLoop();
        this.synth.playPourComplete();
        const justCompleted = to.checkCompletion();
        if (justCompleted) {
            this.synth.playTubeComplete();
            this.particles.spawnTubeCompleteAura(to.x + to.width / 2, to.y + to.height / 2, colorId);
            this.particles.spawnScorePopup(to.x + to.width / 2, to.y - 12, 'BOTTLE SOLVED! +150', '#00E676');
            this.addScore(150);
            this.comboStreak++;
            this.comboTimer = 4.0;
        }
        else {
            this.synth.playBubble();
            this.particles.spawnSplash(to.x + to.width / 2, to.y + 12, colorId, 8);
            this.addScore(40);
        }
        this.setupButtons();
        const isWon = this.tubes.every(t => t.isEmpty || t.isCompleted);
        if (isWon) {
            this.triggerVictory();
        }
        else {
            this.state = 'PLAYING';
        }
    }
    pushUndoSnapshot() {
        this.undoStack.push({

    undo() {

            t.isSelected = false;

    // ==========================================================================
    // Synchronized Frame Update Loop
    // ==========================================================================
    update(dt) {
        this.gameTime += dt;
        if (this.screenShake > 0) {
            this.screenShake = Math.max(0, this.screenShake - dt * 25);
        }
        if (this.comboTimer > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0)
                this.comboStreak = 0;
        }
        for (const tube of this.tubes) {
            tube.update(dt);
        }
        // --- Frame-Synchronized Pour Progression (Exact Sound & Water Sync) ---
        if (this.state === 'POURING' && this.activePour) {
            const p = this.activePour;
            p.progress += dt / p.totalDuration;
            const from = this.tubes[p.fromIdx];
            const to = this.tubes[p.toIdx];
            if (p.progress < p.tiltFraction) {
                // Phase 1: Smooth translate & tilt to destination opening (NO SOUND, NO STREAM)
                const ease = this.easeInOutQuad(p.progress / p.tiltFraction);
                from.x = p.sourceStartX + (p.targetPourX - p.sourceStartX) * ease;
                from.y = p.sourceStartY + (p.targetPourY - p.sourceStartY) * ease;
                from.tiltAngle = p.targetTiltAngle * ease;
            }
            else if (p.progress < p.returnStartFraction) {
                // Phase 2: Active pouring liquid transfer & Sound Playback
                if (!p.streamStarted) {
                    p.streamStarted = true;
                    this.synth.startPourLoop();
                }
                const pourEase = (p.progress - p.tiltFraction) / p.transferFraction;
                from.x = p.targetPourX;
                from.y = p.targetPourY;
                from.tiltAngle = p.targetTiltAngle + Math.sin(pourEase * Math.PI * 4) * 0.02;
                // Synchronized real-time liquid transfer
                from.pourDrainAmount = pourEase * p.amount;
                to.pourFillAmount = pourEase * p.amount;
                this.synth.updatePourPitch(pourEase);
                if (Math.random() < 0.35) {
                    const targetOpening = to.getTargetOpeningWorldPosition();
                    this.particles.spawnSplash(targetOpening.x, targetOpening.y, p.colorId, 2);
                }
            }
            else if (p.progress < 1.0) {
                // Phase 3: Stream ends, sound stops, tube returns upright
                if (p.streamStarted) {
                    p.streamStarted = false;
                    this.synth.stopPourLoop();
                }
                const returnEase = this.easeInOutQuad((p.progress - p.returnStartFraction) / (1.0 - p.returnStartFraction));
                from.x = p.targetPourX + (p.sourceStartX - p.targetPourX) * returnEase;
                from.y = p.targetPourY + (p.sourceStartY - p.targetPourY) * returnEase;
                from.tiltAngle = p.targetTiltAngle * (1.0 - returnEase);
            }
            else {
                // Phase 4: Complete
                this.finishActivePour();
            }
        }
        if (this.state === 'VICTORY') {
            for (let s = 0; s < 3; s++) {
                if (s < this.victoryStars) {
                    this.victoryStarAnims[s] = Math.min(1.0, this.victoryStarAnims[s] + dt * 3.5);
                }
            }
        }
        this.particles.update(dt);
    }
    easeInOutQuad(t) {
        return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }
    // ==========================================================================
    // Render Loop & Minimalist Uplifted HUD
    // ==========================================================================
    render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        if (this.screenShake > 0) {
            const shakeX = (Math.random() - 0.5) * this.screenShake;
            const shakeY = (Math.random() - 0.5) * this.screenShake;
            ctx.translate(shakeX, shakeY);
        }
        // 1. Background
        this.renderBackground(ctx);
        // 2. Stationary Tubes (non-pouring)
        for (let i = 0; i < this.tubes.length; i++) {
            if (this.activePour && this.activePour.fromIdx === i)
                continue;
            this.tubes[i].render(ctx, this.gameTime);
        }
        // 3. Active Pour Stream & Tilted Source Tube on Top
        if (this.activePour) {
            const p = this.activePour;
            const from = this.tubes[p.fromIdx];
            const to = this.tubes[p.toIdx];
            const isRight = to.x >= from.x;
            // Stream is visible only while in active transfer phase
            if (p.progress >= p.tiltFraction && p.progress <= p.returnStartFraction) {
                const streamProgress = (p.progress - p.tiltFraction) / p.transferFraction;
                const spout = from.getSpoutWorldPosition(isRight);
                const targetOpening = to.getTargetOpeningWorldPosition();
                LiquidStream.render(ctx, spout.x, spout.y, targetOpening.x, targetOpening.y, p.colorId, streamProgress, this.gameTime, isRight, from.tiltAngle);
            }
            from.render(ctx, this.gameTime);
        }
        // 4. Particles
        this.particles.render(ctx);
        // 5. Minimalist Uplifted Background HUD
        this.renderMinimalistHUD(ctx);
        // 6. Level 1 Tutorial Guide (Clean White Text & Animated Hand)
        if (this.isTutorial && this.state === 'PLAYING') {
            this.renderTutorialGuide(ctx);
        }
        // 7. Action Buttons
        if (this.state === 'PLAYING' || this.state === 'POURING') {
            this.renderActionButtons(ctx);
        }
        // 8. Victory Celebration Modal
        if (this.state === 'VICTORY') {
            this.renderVictoryModal(ctx);
        }
        ctx.restore();
    }
    renderBackground(ctx) {
        const bgGrad = ctx.createLinearGradient(0, 0, 0, this.height);
        bgGrad.addColorStop(0, '#0d2238');
        bgGrad.addColorStop(0.4, '#091827');
        bgGrad.addColorStop(1, '#050e17');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, this.width, this.height);
        ctx.save();
        const glow1 = ctx.createRadialGradient(this.width * 0.3, this.height * 0.22, 10, this.width * 0.3, this.height * 0.22, 180);
        glow1.addColorStop(0, 'rgba(0, 210, 252, 0.08)');
        glow1.addColorStop(1, 'rgba(0, 210, 252, 0)');
        ctx.fillStyle = glow1;
        ctx.fillRect(0, 0, this.width, this.height);
        ctx.restore();

    renderMinimalistHUD(ctx) {

        }
        else if (this.isGhostLevel) {

            ctx.fillStyle = '#FFA726';
            ctx.fillText('👻 MYSTERY MODE', 20, topY + 18);
        }
        else if (this.isBottleShape) {

            ctx.fillStyle = '#00E676';
            ctx.fillText('🍾 BOTTLE SPRINT', 20, topY + 18);
        }
        ctx.font = '800 14px Fredoka, Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fillText(`MOVES: ${this.moves}`, this.width / 2, topY);
        const scoreText = this.score.toLocaleString();
        ctx.font = '900 15px Fredoka, Lilita One, sans-serif';
        ctx.textAlign = 'right';
        const textW = ctx.measureText(scoreText).width;
        const coinBadgeW = textW + 34;
        const coinBadgeH = 26;
        const coinBadgeX = this.width - 56 - coinBadgeW;
        const coinBadgeY = topY - 13;
        ctx.beginPath();
        ctx.roundRect(coinBadgeX, coinBadgeY, coinBadgeW, coinBadgeH, 13);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.45)';
        ctx.lineWidth = 1;
        ctx.stroke();
        VectorIcons.drawCoin(ctx, coinBadgeX + 12, coinBadgeY + coinBadgeH / 2, 7.5);
        ctx.fillStyle = '#FFE082';
        ctx.fillText(scoreText, coinBadgeX + coinBadgeW - 8, coinBadgeY + coinBadgeH / 2 + 1);
        const snd = this.soundButtonRect;
        snd.x = this.width - 44;
        snd.y = topY - 16;
        ctx.beginPath();
        ctx.arc(snd.x + snd.w / 2, snd.y + snd.h / 2, snd.w / 2, 0, Math.PI * 2);
        ctx.fillStyle = this.synth.muted ? '#E53935' : '#00E676';
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.font = '900 11px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.synth.muted ? 'OFF' : 'ON', snd.x + snd.w / 2, snd.y + snd.h / 2 + 1);
        if (this.comboStreak > 1) {
            const comboText = `🔥 x${this.comboStreak} COMBO!`;
            ctx.font = '900 13px Fredoka, Lilita One, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#FF9100';
            ctx.fillText(comboText, this.width / 2, topY + 22);
        }
        ctx.restore();
    }
    renderTutorialGuide(ctx) {
        if (this.tubes.length < 2)
            return;
        ctx.save();
        const targetTube = this.tutorialStep === 0 ? this.tubes[0] : this.tubes[1];
        const fingerX = targetTube.x + targetTube.width / 2;
        const bounce = Math.sin(this.gameTime * 6) * 10;
        const fingerY = targetTube.y - 38 + bounce;
        const msg = this.tutorialStep === 0 ? 'Tap the colored flask to select' : 'Tap the target flask to pour';
        ctx.font = '900 17px Fredoka, Nunito, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const textY = Math.max(78, targetTube.y - 72);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillText(msg, this.width / 2 + 1, textY + 1);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(msg, this.width / 2, textY);
        VectorIcons.drawPointingHand(ctx, fingerX, fingerY, 28);
        ctx.restore();
    }
    renderActionButtons(ctx) {
        for (const btn of this.actionButtons) {
            ctx.save();
            const squish = btn.pressProgress * 3;
            const bx = btn.x;
            const by = btn.y + squish;
            const bw = btn.w;
            const bh = btn.h - squish;
            const r = 14;
            ctx.beginPath();
            ctx.roundRect(bx, by + 4, bw, bh, r);
            ctx.fillStyle = btn.disabled ? '#1C2530' : btn.shadowColor;
            ctx.fill();
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, r);
            const grad = ctx.createLinearGradient(bx, by, bx, by + bh);
            if (btn.disabled) {
                grad.addColorStop(0, '#37474F');
                grad.addColorStop(1, '#263238');
            }
            else {
                grad.addColorStop(0, btn.bgGrad[0]);
                grad.addColorStop(1, btn.bgGrad[1]);
            }
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = btn.disabled ? 'rgba(255, 255, 255, 0.1)' : 'rgba(255, 255, 255, 0.45)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
            ctx.beginPath();
            ctx.roundRect(bx + 3, by + 2, bw - 6, bh * 0.4, [10, 10, 3, 3]);
            const highGrad = ctx.createLinearGradient(0, by + 2, 0, by + bh * 0.4);
            highGrad.addColorStop(0, 'rgba(255, 255, 255, 0.42)');
            highGrad.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
            ctx.fillStyle = highGrad;
            ctx.fill();
            const iconColor = btn.disabled ? 'rgba(255, 255, 255, 0.4)' : '#FFFFFF';
            const iconY = by + bh * 0.36;
            const iconSize = 18;
            if (btn.iconType === 'UNDO')
                VectorIcons.drawUndo(ctx, bx + bw / 2, iconY, iconSize, iconColor);
            else if (btn.iconType === 'RELOAD')
                VectorIcons.drawReload(ctx, bx + bw / 2, iconY, iconSize, iconColor);
            else if (btn.iconType === 'ADD_TUBE')
                VectorIcons.drawAddTube(ctx, bx + bw / 2, iconY, iconSize, iconColor);
            else if (btn.iconType === 'HINT')
                VectorIcons.drawBulb(ctx, bx + bw / 2, iconY, iconSize, iconColor);
            ctx.font = '900 10px Fredoka, Lilita One, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.fillText(btn.label, bx + bw / 2 + 0.5, by + bh - 9 + 0.5);
            ctx.fillStyle = btn.disabled ? 'rgba(255, 255, 255, 0.4)' : '#FFFFFF';
            ctx.fillText(btn.label, bx + bw / 2, by + bh - 9);
            if (btn.badgeText && !btn.disabled) {
                const badgeW = 28;
                const badgeH = 14;
                const badgeX = bx + bw - badgeW + 3;
                const badgeY = by - 4;
                ctx.beginPath();
                ctx.roundRect(badgeX, badgeY, badgeW, badgeH, 7);
                ctx.fillStyle = '#FF416C';
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.font = '900 8px Fredoka, sans-serif';
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(btn.badgeText, badgeX + badgeW / 2, badgeY + badgeH / 2 + 1);
            }
            ctx.restore();
        }
    }
    renderVictoryModal(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(4, 14, 24, 0.78)';
        ctx.fillRect(0, 0, this.width, this.height);
        const cardW = Math.min(330, this.width - 40);
        const cardH = 360;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2 - 10;
        const r = 26;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY + 8, cardW, cardH, r);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, r);
        const cardGrad = ctx.createLinearGradient(cardX, cardY, cardX, cardY + cardH);
        cardGrad.addColorStop(0, '#1E3A5F');
        cardGrad.addColorStop(1, '#0F1E32');
        ctx.fillStyle = cardGrad;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0, 210, 252, 0.6)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.font = '900 23px Fredoka, Lilita One, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFE082';
        ctx.fillText('LEVEL COMPLETED!', this.width / 2, cardY + 45);
        ctx.font = '700 14px Fredoka, Nunito, sans-serif';
        ctx.fillStyle = '#A0F4FF';
        ctx.fillText(`Level ${this.currentLevel} Solved!`, this.width / 2, cardY + 74);
        const starSpacing = 56;
        const startStarX = this.width / 2 - starSpacing;
        const starY = cardY + 128;
        for (let s = 0; s < 3; s++) {
            const anim = this.victoryStarAnims[s];
            const sx = startStarX + s * starSpacing;
            const sy = s === 1 ? starY - 10 : starY;
            if (anim > 0) {
                const starScale = 1.0 + (1.0 - anim) * 0.8;
                ctx.save();
                ctx.translate(sx, sy);
                ctx.scale(starScale, starScale);
                VectorIcons.drawStar(ctx, 0, 0, 21, '#FFD700', '#FF9100');
                ctx.restore();
            }
            else {
                VectorIcons.drawStar(ctx, sx, sy, 19, '#37474F', '#263238');
            }
        }
        const boxW = cardW - 44;
        const boxH = 66;
        const boxX = (this.width - boxW) / 2;
        const boxY = cardY + 180;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, boxH, 14);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.font = '800 14px Fredoka, Nunito, sans-serif';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.fillText(`Moves Used: ${this.moves}`, boxX + boxW * 0.3, boxY + 23);
        ctx.fillText(`Total Score: ${this.score.toLocaleString()}`, boxX + boxW * 0.3, boxY + 45);
        const btn = this.playAgainButtonRect;
        btn.x = (this.width - btn.w) / 2;
        btn.y = cardY + cardH - 70;
        const btnSquish = btn.pressProgress * 3;
        const bbx = btn.x;
        const bby = btn.y + btnSquish;
        const bbw = btn.w;
        const bbh = btn.h - btnSquish;
        ctx.beginPath();
        ctx.roundRect(bbx, bby + 5, bbw, bbh, 18);
        ctx.fillStyle = '#00701A';
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(bbx, bby, bbw, bbh, 18);
        const btnGrad = ctx.createLinearGradient(bbx, bby, bbx, bby + bbh);
        btnGrad.addColorStop(0, '#198754');
        btnGrad.addColorStop(1, '#0D6938');
        ctx.fillStyle = btnGrad;
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = '900 18px Fredoka, Lilita One, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('NEXT LEVEL →', bbx + bbw / 2, bby + bbh / 2);
        ctx.restore();
    }
    // ==========================================================================
    // Pointer & Touch Events
    // ==========================================================================
    handlePointerDown(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        const x = (clientX - rect.left) * (this.width / rect.width);
        const y = (clientY - rect.top) * (this.height / rect.height);
        this.synth.init();
        const snd = this.soundButtonRect;
        if (x >= snd.x && x <= snd.x + snd.w && y >= snd.y && y <= snd.y + snd.h) {
            this.synth.toggleMute();
            this.synth.playButton();
            return;
        }
        if (this.state === 'VICTORY') {
            const btn = this.playAgainButtonRect;
            if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                btn.pressProgress = 1.0;
                this.nextLevel();
            }
            return;
        }
        if (this.state !== 'PLAYING')
            return;
        for (const btn of this.actionButtons) {
            if (!btn.disabled && x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
                btn.pressProgress = 1.0;
                if (btn.id === 'undo')
                    this.undo();
                else if (btn.id === 'restart')
                    this.restartLevel();
                else if (btn.id === 'add_tube')
                    this.addExtraTube();
                else if (btn.id === 'hint')
                    this.triggerHint();
                return;
            }
        }
        for (let i = 0; i < this.tubes.length; i++) {
            const t = this.tubes[i];
            const pad = 10;
            if (x >= t.x - pad && x <= t.x + t.width + pad && y >= t.y - pad && y <= t.y + t.height + pad) {
                this.onTubeTap(i);
                break;
            }
        }
    }
    handlePointerUp() {
        for (const btn of this.actionButtons) {
            btn.pressProgress = 0;
        }
        this.playAgainButtonRect.pressProgress = 0;
    }
}


  // --- MAIN BOOTSTRAPPER ---
  "use strict";
// ============================================================================
// Water Sort 3D - Main Bootstrapper & Viewport Listener
// ============================================================================
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas)
        return;
    const engine = new GameEngine(canvas);
    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const vp = window.visualViewport;
        const w = vp ? vp.width : window.innerWidth;
        const h = vp ? vp.height : window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        engine.setSize(w, h, dpr);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize);
        window.visualViewport.addEventListener('scroll', resize);
    }
    resize();
    // Pointer & Touch Events
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        engine.handlePointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', () => {
        engine.handlePointerUp();
    });
    window.addEventListener('pointercancel', () => {
        engine.handlePointerUp();
    });
    // Game Loop
    let lastTime = performance.now();
    function loop(currentTime) {
        const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;
        engine.update(dt);
        engine.render();
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
});

})();

  </script>
