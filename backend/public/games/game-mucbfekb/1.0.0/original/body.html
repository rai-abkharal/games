

    <canvas id="gameCanvas"></canvas>
    
    <div id="top-action-btn" class="top-btn" title="Slow down" style="display: none;"></div>
    <div id="top-action-label" style="display: none;"></div>

    <div id="skin-btn" class="skin-btn" title="CARS" style="display: none;"><div class="skin-btn-inner"><canvas id="skin-btn-canvas" width="100" height="100"></canvas></div></div>
    <div id="skin-menu" class="skin-menu"></div>

    <div id="car-reward">
        <div class="reward-stage">
            <div class="reward-rays"></div>
            <div class="reward-glow"></div>
            <canvas id="reward-particles" width="400" height="300"></canvas>
            <canvas id="reward-car-canvas" width="300" height="180"></canvas>
            <div id="reward-price-tag"><span id="reward-price-tag-inner"></span></div>
        </div>
        <div class="reward-buttons">
            <div id="reward-get" class="reward-btn reward-get"></div>
            <div id="reward-lose" class="reward-btn reward-lose"></div>
        </div>
    </div>

    <div id="tutorial-hint" style="display: block; --anim-duration: 0.5s;">
        <div class="tap-text">TAP!</div>
        <div class="tap-burst">
            <div class="line" style="transform: rotate(0deg)"></div>
            <div class="line" style="transform: rotate(60deg)"></div>
            <div class="line" style="transform: rotate(120deg)"></div>
        </div>
        <img src="hand.png" class="hand-icon" alt="Hand Hint">
    </div>

    <div id="tutorial-arrows" class="pos-left" style="display: block; --anim-duration: 0.5s;">
        <img src="arrow.png" class="arrow-key arrow-dim arrow-side arrow-left-key" alt="">
        <img src="arrow.png" class="arrow-key arrow-dim arrow-side arrow-down-key" alt="">
        <img src="arrow.png" class="arrow-key arrow-dim arrow-side arrow-right-key" alt="">
        <img src="arrow.png" class="arrow-key arrow-up-backdrop" alt="">
        <div class="arrow-burst">
            <div class="line" style="transform: rotate(0deg)"></div>
            <div class="line" style="transform: rotate(60deg)"></div>
            <div class="line" style="transform: rotate(120deg)"></div>
        </div>
        <img src="arrow.png" class="arrow-key arrow-up-anim" alt="">
    </div>
