<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sudoku Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #F8FAFC;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    'use strict';

    // 1. THEME & PALETTE (Modern Editorial Light Theme)
    const THEME = {
      bgTop: '#F8FAFC',
      bgBottom: '#EEF2F6',
      cardBg: '#FFFFFF',
      cardBorder: '#CBD5E1',
      outerBorder: '#1E293B',
      cardShadow: 'rgba(15, 23, 42, 0.08)',
      majorGrid: '#334155',
      minorGrid: '#E2E8F0',
      clueDigit: '#0F172A',
      userDigit: '#2563EB',
      errorDigit: '#DC2626',
      errorBg: '#FEE2E2',
      selectedFill: '#EEF2FF',
      selectedBorder: '#6366F1',
      relatedFill: '#F8FAFC',
      sameNumFill: '#DBEAFE',
      sameNumText: '#1E40AF',
      btnDefaultBg: '#FFFFFF',
      btnDefaultBorder: '#E2E8F0',
      btnDefaultText: '#334155',
      accentGreen: '#22C55E',
      accentYellow: '#F59E0B',
      accentRed: '#EF4444',
      accentPurple: '#8B5CF6'
    };

    // 4 Difficulty tiers with elegant vector emblems
    const DIFFICULTIES = [
      { id: 'easy', label: 'EASY', clues: 60, coins: 25, color: '#22C55E', emblem: 'leaf', subtitle: 'Relaxed & Fun' },
      { id: 'medium', label: 'MEDIUM', clues: 50, coins: 50, color: '#F59E0B', emblem: 'spark', subtitle: 'Balanced Logic' },
      { id: 'hard', label: 'HARD', clues: 40, coins: 75, color: '#EF4444', emblem: 'diamond', subtitle: 'Deep Strategy' },
      { id: 'expert', label: 'EXPERT', clues: 32, coins: 100, color: '#8B5CF6', emblem: 'crown', subtitle: 'Master Level' }
    ];

    // 2. SOUND SYNTHESIZER
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
        this.notes = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playDigit(num) {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const freq = this.notes[(num - 1) % this.notes.length];

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);

        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, t);

        gain.gain.setValueAtTime(0.24, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);

        gain2.gain.setValueAtTime(0.08, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

        osc.connect(gain);
        osc2.connect(gain2);
        gain.connect(this.ctx.destination);
        gain2.connect(this.ctx.destination);

        osc.start(t);
        osc2.start(t);
        osc.stop(t + 0.36);
        osc2.stop(t + 0.23);
      }

      playTap() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      }

      playErase() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(220, t + 0.12);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }

      playError() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        [180, 150].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, t + i * 0.08);
          gain.gain.setValueAtTime(0.14, t + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.08);
          osc.stop(t + i * 0.08 + 0.13);
        });
      }

      playBlockComplete() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const chord = [440.00, 554.37, 659.25, 880.00, 1108.73];
        chord.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + i * 0.05);
          gain.gain.setValueAtTime(0.18, t + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.05 + 0.70);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.05);
          osc.stop(t + i * 0.05 + 0.71);
        });
      }

      playVictory() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const melody = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        melody.forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + i * 0.09);
          gain.gain.setValueAtTime(0.20, t + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.09 + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + i * 0.09);
          osc.stop(t + i * 0.09 + 0.56);
        });
      }

      playButton() {
        this.playTap();
      }
    }

    // 3. MATHEMATICAL SUDOKU GENERATOR & SOLVER
    class SudokuCore {
      static createEmptyGrid() {
        return Array.from({ length: 9 }, () => Array(9).fill(0));
      }

      static copyGrid(grid) {
        return grid.map(row => [...row]);
      }

      static isValid(grid, r, c, val) {
        for (let i = 0; i < 9; i++) {
          if (grid[r][i] === val && i !== c) return false;
          if (grid[i][c] === val && i !== r) return false;
        }
        const br = Math.floor(r / 3) * 3;
        const bc = Math.floor(c / 3) * 3;
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            const tr = br + i;
            const tc = bc + j;
            if (grid[tr][tc] === val && (tr !== r || tc !== c)) return false;
          }
        }
        return true;
      }

      static countSolutions(board, limit = 2) {
        let count = 0;
        const helper = (b) => {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (b[r][c] === 0) {
                for (let n = 1; n <= 9; n++) {
                  if (this.isValid(b, r, c, n)) {
                    b[r][c] = n;
                    helper(b);
                    b[r][c] = 0;
                    if (count >= limit) return;
                  }
                }
                return;
              }
            }
          }
          count++;
        };
        helper(this.copyGrid(board));
        return count;
      }

      static generateSolved() {
        const board = this.createEmptyGrid();
        const fill = (b) => {
          for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
              if (b[r][c] === 0) {
                const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
                for (const n of nums) {
                  if (this.isValid(b, r, c, n)) {
                    b[r][c] = n;
                    if (fill(b)) return true;
                    b[r][c] = 0;
                  }
                }
                return false;
              }
            }
          }
          return true;
        };
        fill(board);
        return board;
      }

      static generatePuzzle(difficultyId) {
        const diff = DIFFICULTIES.find(d => d.id === difficultyId) || DIFFICULTIES[0];
        const solution = this.generateSolved();
        const puzzle = this.copyGrid(solution);

        const targetClues = diff.clues;
        const totalToRemove = 81 - targetClues;

        const positions = [];
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            positions.push({ r, c });
          }
        }
        positions.sort(() => Math.random() - 0.5);

        let removed = 0;
        for (const pos of positions) {
          if (removed >= totalToRemove) break;
          const temp = puzzle[pos.r][pos.c];
          puzzle[pos.r][pos.c] = 0;

          if (this.countSolutions(puzzle, 2) === 1) {
            removed++;
          } else {
            puzzle[pos.r][pos.c] = temp;
          }
        }

        return { puzzle, solution, diff };
      }

      static findHint(currentGrid, solutionGrid) {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (currentGrid[r][c] === 0) {
              const validCandidates = [];
              for (let n = 1; n <= 9; n++) {
                if (this.isValid(currentGrid, r, c, n)) validCandidates.push(n);
              }
              if (validCandidates.length === 1) {
                const val = validCandidates[0];
                return {
                  r, c, val,
                  type: 'naked_single',
                  reason: 'Only ' + val + ' can fit in this cell without conflicting with its row, column, or 3x3 box.'
                };
              }
            }
          }
        }

        for (let b = 0; b < 9; b++) {
          const br = Math.floor(b / 3) * 3;
          const bc = (b % 3) * 3;
          for (let n = 1; n <= 9; n++) {
            let possibleCells = [];
            for (let i = 0; i < 3; i++) {
              for (let j = 0; j < 3; j++) {
                const r = br + i;
                const c = bc + j;
                if (currentGrid[r][c] === 0 && this.isValid(currentGrid, r, c, n)) {
                  possibleCells.push({ r, c });
                }
              }
            }
            if (possibleCells.length === 1) {
              const pos = possibleCells[0];
              return {
                r: pos.r, c: pos.c, val: n,
                type: 'hidden_single_box',
                reason: n + ' can only appear in this single cell within its 3x3 box.'
              };
            }
          }
        }

        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (currentGrid[r][c] === 0) {
              return {
                r, c, val: solutionGrid[r][c],
                type: 'direct',
                reason: 'The correct number for this cell is ' + solutionGrid[r][c] + '.'
              };
            }
          }
        }
        return null;
      }
    }

    // 4. PARTICLE SYSTEM (Gentle, soft floating celebration sparkles)
    class ParticleSystem {
      constructor() { this.items = []; }
      clear() { this.items = []; }

      addBlockBurst(x, y, w, h) {
        const colors = ['#38BDF8', '#60A5FA', '#93C5FD', '#FDE68A', '#A7F3D0', '#BAE6FD'];
        for (let i = 0; i < 18; i++) {
          const px = x + Math.random() * w;
          const py = y + Math.random() * h;
          const a = Math.random() * Math.PI * 2;
          const speed = 12 + Math.random() * 22;
          this.items.push({
            type: 'STAR',
            x: px, y: py,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed - 10,
            size: 3.5 + Math.random() * 4,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 2.2,
            life: 1.1 + Math.random() * 0.45,
            maxLife: 1.55,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      addVictoryConfetti(w, h) {
        const colors = ['#38BDF8', '#60A5FA', '#86EFAC', '#FDE68A', '#BAE6FD', '#C4B5FD', '#F9A8D4'];
        for (let i = 0; i < 64; i++) {
          this.items.push({
            type: 'CONFETTI',
            x: Math.random() * w,
            y: -20 - Math.random() * 100,
            vx: (Math.random() - 0.5) * 50,
            vy: 70 + Math.random() * 110,
            size: 6 + Math.random() * 6,
            rot: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 4,
            life: 2.5 + Math.random() * 1.5,
            maxLife: 4.0,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      update(dt) {
        for (let i = this.items.length - 1; i >= 0; i--) {
          const p = this.items[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.rot += p.vRot * dt;
          p.life -= dt;
          if (p.type === 'CONFETTI') p.vx += Math.sin(p.life * 3) * 1.0;
          if (p.life <= 0) this.items.splice(i, 1);
        }
      }

      render(ctx) {
        for (const p of this.items) {
          const k = Math.max(0, p.life / p.maxLife);
          ctx.save();
          ctx.globalAlpha = Math.min(1, k * 1.3);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;

          if (p.type === 'CONFETTI') {
            ctx.fillRect(-p.size * 0.5, -p.size * 0.25, p.size, p.size * 0.5);
          } else {
            const s = p.size;
            ctx.beginPath();
            ctx.moveTo(0, -s);
            ctx.quadraticCurveTo(0, 0, s, 0);
            ctx.quadraticCurveTo(0, 0, 0, s);
            ctx.quadraticCurveTo(0, 0, -s, 0);
            ctx.quadraticCurveTo(0, 0, 0, -s);
            ctx.fill();
          }
          ctx.restore();
        }
      }
    }

    // 5. HOST PLATFORM BRIDGE
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const msg = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', msg);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(msg);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      }
    };

    // 6. MAIN GAME CONTROLLER
    class SudokuGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.synth = new SoundSynth();
        this.particles = new ParticleSystem();

        this.difficulty = 'easy';
        this.sliderPos = 0;
        this.isDraggingSlider = false;

        this.given = SudokuCore.createEmptyGrid();
        this.user = SudokuCore.createEmptyGrid();
        this.solution = SudokuCore.createEmptyGrid();

        this.selected = null;
        this.isPaused = false;
        this.state = 'DIFF_SELECT'; // Always show clean difficulty modal upon opening

        this.mistakes = 0;
        this.maxMistakes = 3;
        this.timer = 0;
        this.history = [];
        this.remainingHints = 3;
        this.activeHint = null;

        this.tutorialSlide = 0;
        this.maxTutorialSlides = 5;
        this.tutorialAnimT = 0;

        this.sweeps = [];
        this.lastTime = performance.now();
        this.shakeTimer = 0;
        this.errorCell = null;
        this.toast = null;
        this.keyPressTimer = Array(10).fill(0);

        this.SAVE_KEY = 'sudoku_pro_saved_game_v101';
        this.STATS_KEY = 'sudoku_pro_stats_v101';

        this.stats = this.loadStats();
        this.initLayout();
        this.bindEvents();

        // Populate a background puzzle for great visual under the dialog
        const sample = SudokuCore.generatePuzzle('easy');
        this.given = sample.puzzle;
        this.solution = sample.solution;

        requestAnimationFrame((t) => this.loop(t));
      }

      loadStats() {
        try {
          const s = localStorage.getItem(this.STATS_KEY);
          return s ? JSON.parse(s) : { gamesWon: 0, bestTimes: {} };
        } catch (e) {
          return { gamesWon: 0, bestTimes: {} };
        }
      }

      saveStats() {
        try {
          localStorage.setItem(this.STATS_KEY, JSON.stringify(this.stats));
        } catch (e) {}
      }

      saveGame() {
        if (this.state === 'VICTORY' || this.state === 'GAMEOVER' || this.state === 'DIFF_SELECT' || this.state === 'TUTORIAL') {
          try { localStorage.removeItem(this.SAVE_KEY); } catch (e) {}
          return;
        }
        try {
          const data = {
            difficulty: this.difficulty,
            given: this.given,
            user: this.user,
            solution: this.solution,
            timer: this.timer,
            mistakes: this.mistakes,
            remainingHints: this.remainingHints
          };
          localStorage.setItem(this.SAVE_KEY, JSON.stringify(data));
        } catch (e) {}
      }

      startNewGame(diffId) {
        this.difficulty = diffId || this.difficulty;
        const idx = DIFFICULTIES.findIndex(d => d.id === this.difficulty);
        this.sliderPos = idx >= 0 ? idx : 0;

        const generated = SudokuCore.generatePuzzle(this.difficulty);
        this.given = generated.puzzle;
        this.solution = generated.solution;
        this.user = SudokuCore.createEmptyGrid();
        this.selected = null;
        this.mistakes = 0;
        this.timer = 0;
        this.isPaused = false;
        this.state = 'PLAYING';
        this.history = [];
        this.remainingHints = 3;
        this.activeHint = null;
        this.sweeps = [];
        this.particles.clear();
        this.saveGame();
        Host.post('onGameStarted', { difficulty: this.difficulty });
      }

      initLayout() {
        const dpr = window.devicePixelRatio || 1;
        this.dpr = dpr;
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = Math.round(this.width * dpr);
        this.canvas.height = Math.round(this.height * dpr);

        const minDim = Math.min(this.width, this.height);
        this.scale = Math.min(1.2, Math.max(0.8, minDim / 400));

        const maxBoardSize = Math.min(this.width - 20, this.height * 0.58);
        this.boardSize = Math.floor(maxBoardSize);
        this.cellSize = this.boardSize / 9;
        this.boardX = Math.round((this.width - this.boardSize) / 2);
        this.boardY = Math.round(this.height * 0.13);

        this.headerY = Math.max(14, this.boardY - 54);
        this.toolbarY = this.boardY + this.boardSize + 16;
        this.keypadY = this.toolbarY + 54;
      }

      getDifficultyDialogBounds() {
        const cardW = Math.min(320, this.width - 36);
        const cardH = 370;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        const trackW = cardW - 56;
        const trackX = cardX + 28;
        const trackY = cardY + 225;
        const trackH = 26;
        const knobR = 14;

        const playW = cardW - 100;
        const playH = 48;
        const playX = cardX + 28;
        const playY = cardY + 295;

        const qSize = 48;
        const qX = playX + playW + 12;
        const qY = playY;

        return { cardX, cardY, cardW, cardH, trackX, trackY, trackW, trackH, knobR, playX, playY, playW, playH, qX, qY, qSize };
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initLayout());

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          return { px: clientX - rect.left, py: clientY - rect.top };
        };

        const handlePointerDown = (e) => {
          e.preventDefault();
          this.synth.init();
          const { px, py } = getPos(e);

          if (this.state === 'DIFF_SELECT') {
            const { trackX, trackW, trackY, trackH, knobR } = this.getDifficultyDialogBounds();
            if (py >= trackY - 18 && py <= trackY + trackH + 18 && px >= trackX - 10 && px <= trackX + trackW + 10) {
              this.isDraggingSlider = true;
              const usableW = trackW - 2 * knobR;
              const ratio = Math.max(0, Math.min(1, (px - (trackX + knobR)) / usableW));
              this.sliderPos = ratio * 3;
              return;
            }
          }

          this.handleClick(px, py);
        };

        const handlePointerMove = (e) => {
          if (!this.isDraggingSlider || this.state !== 'DIFF_SELECT') return;
          e.preventDefault();
          const { px } = getPos(e);
          const { trackX, trackW, knobR } = this.getDifficultyDialogBounds();
          const usableW = trackW - 2 * knobR;
          const ratio = Math.max(0, Math.min(1, (px - (trackX + knobR)) / usableW));
          this.sliderPos = ratio * 3;
        };

        const handlePointerUp = (e) => {
          if (this.isDraggingSlider && this.state === 'DIFF_SELECT') {
            this.isDraggingSlider = false;
            const nearestIdx = Math.round(this.sliderPos);
            this.sliderPos = nearestIdx;
            this.difficulty = DIFFICULTIES[nearestIdx].id;
            this.synth.playButton();
          }
        };

        this.canvas.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);

        window.addEventListener('keydown', (e) => {
          this.synth.init();
          if (e.key >= '1' && e.key <= '9') {
            this.handleInputNumber(parseInt(e.key));
          } else if (e.key === 'Backspace' || e.key === 'Delete') {
            this.handleErase();
          } else if (e.key === 'u' || e.key === 'U' || (e.ctrlKey && e.key === 'z')) {
            this.handleUndo();
          } else if (e.key === 'h' || e.key === 'H') {
            this.handleHint();
          } else if (e.key === 'ArrowLeft') {
            if (this.state === 'DIFF_SELECT') {
              this.sliderPos = Math.max(0, Math.round(this.sliderPos) - 1);
              this.difficulty = DIFFICULTIES[Math.round(this.sliderPos)].id;
              this.synth.playButton();
            } else if (this.state === 'TUTORIAL') {
              this.tutorialSlide = Math.max(0, this.tutorialSlide - 1);
              this.synth.playButton();
            } else if (this.selected) {
              this.selected.c = Math.max(0, this.selected.c - 1);
            }
          } else if (e.key === 'ArrowRight') {
            if (this.state === 'DIFF_SELECT') {
              this.sliderPos = Math.min(3, Math.round(this.sliderPos) + 1);
              this.difficulty = DIFFICULTIES[Math.round(this.sliderPos)].id;
              this.synth.playButton();
            } else if (this.state === 'TUTORIAL') {
              this.tutorialSlide = Math.min(this.maxTutorialSlides - 1, this.tutorialSlide + 1);
              this.synth.playButton();
            } else if (this.selected) {
              this.selected.c = Math.min(8, this.selected.c + 1);
            }
          } else if (e.key === 'Enter') {
            if (this.state === 'DIFF_SELECT') {
              this.startNewGame(DIFFICULTIES[Math.round(this.sliderPos)].id);
            } else if (this.state === 'TUTORIAL') {
              this.state = 'DIFF_SELECT';
            }
          } else if (e.key === 'ArrowUp' && this.selected) {
            this.selected.r = Math.max(0, this.selected.r - 1);
          } else if (e.key === 'ArrowDown' && this.selected) {
            this.selected.r = Math.min(8, this.selected.r + 1);
          }
        });
      }

      handleClick(px, py) {
        if (this.state === 'VICTORY') {
          const btnW = 220, btnH = 50;
          const btnX = (this.width - btnW) / 2;
          const btnY = this.height * 0.74;
          if (px >= btnX && px <= btnX + btnW && py >= btnY && py <= btnY + btnH) {
            this.synth.playButton();
            this.state = 'DIFF_SELECT';
          }
          return;
        }

        if (this.state === 'GAMEOVER') {
          const btnW = 200, btnH = 48;
          const btnX = (this.width - btnW) / 2;
          const btnY = this.height * 0.68;
          if (px >= btnX && px <= btnX + btnW && py >= btnY && py <= btnY + btnH) {
            this.synth.playButton();
            this.startNewGame(this.difficulty);
          }
          return;
        }

        // TUTORIAL MODAL
        if (this.state === 'TUTORIAL') {
          const modalW = Math.min(330, this.width - 32);
          const modalH = Math.min(500, this.height * 0.82);
          const modalX = (this.width - modalW) / 2;
          const modalY = (this.height - modalH) / 2;

          const btnY = modalY + modalH - 58;

          if (px >= modalX + 16 && px <= modalX + 64 && py >= btnY && py <= btnY + 44) {
            this.tutorialSlide = Math.max(0, this.tutorialSlide - 1);
            this.synth.playButton();
            return;
          }

          const okW = modalW - 144;
          const okX = modalX + 72;
          if (px >= okX && px <= okX + okW && py >= btnY && py <= btnY + 44) {
            this.synth.playButton();
            this.state = 'DIFF_SELECT';
            return;
          }

          const nextX = modalX + modalW - 64;
          if (px >= nextX && px <= nextX + 48 && py >= btnY && py <= btnY + 44) {
            if (this.tutorialSlide < this.maxTutorialSlides - 1) {
              this.tutorialSlide++;
              this.synth.playButton();
            } else {
              this.state = 'DIFF_SELECT';
              this.synth.playButton();
            }
            return;
          }

          const dotY = btnY - 20;
          for (let i = 0; i < this.maxTutorialSlides; i++) {
            const dx = this.width / 2 + (i - (this.maxTutorialSlides - 1) / 2) * 22;
            if (px >= dx - 10 && px <= dx + 10 && py >= dotY - 10 && py <= dotY + 10) {
              this.tutorialSlide = i;
              this.synth.playButton();
              return;
            }
          }
          return;
        }

        // COMPACT DIFFICULTY DIALOG
        if (this.state === 'DIFF_SELECT') {
          const bounds = this.getDifficultyDialogBounds();

          // Slider Track tap
          if (py >= bounds.trackY - 18 && py <= bounds.trackY + bounds.trackH + 18 &&
              px >= bounds.trackX - 10 && px <= bounds.trackX + bounds.trackW + 10) {
            const usableW = bounds.trackW - 2 * bounds.knobR;
            const ratio = Math.max(0, Math.min(1, (px - (bounds.trackX + bounds.knobR)) / usableW));
            const nearest = Math.round(ratio * 3);
            this.sliderPos = nearest;
            this.difficulty = DIFFICULTIES[nearest].id;
            this.synth.playButton();
            return;
          }

          // PLAY Button
          if (px >= bounds.playX && px <= bounds.playX + bounds.playW &&
              py >= bounds.playY && py <= bounds.playY + bounds.playH) {
            this.synth.playButton();
            this.startNewGame(DIFFICULTIES[Math.round(this.sliderPos)].id);
            return;
          }

          // Question Mark "?" Tutorial Button
          if (px >= bounds.qX && px <= bounds.qX + bounds.qSize &&
              py >= bounds.qY && py <= bounds.qY + bounds.qSize) {
            this.synth.playButton();
            this.tutorialSlide = 0;
            this.state = 'TUTORIAL';
            return;
          }
          return;
        }

        if (this.state === 'PAUSED') {
          const btnW = 190, btnH = 46;
          const btnX = (this.width - btnW) / 2;
          const resumeY = this.height * 0.48;
          const restartY = this.height * 0.56;

          if (px >= btnX && px <= btnX + btnW && py >= resumeY && py <= resumeY + btnH) {
            this.synth.playButton();
            this.state = 'PLAYING';
            this.isPaused = false;
          } else if (px >= btnX && px <= btnX + btnW && py >= restartY && py <= restartY + btnH) {
            this.synth.playButton();
            this.state = 'DIFF_SELECT';
          }
          return;
        }

        if (this.activeHint) {
          this.activeHint = null;
          return;
        }

        // Header Buttons: Difficulty pill, Pause, Sound
        if (py >= this.headerY - 8 && py <= this.headerY + 38) {
          if (px >= 12 && px <= 112) {
            this.synth.playButton();
            this.state = 'DIFF_SELECT';
            return;
          }
          if (px >= this.width - 82 && px <= this.width - 48) {
            this.synth.playButton();
            this.state = 'PAUSED';
            this.isPaused = true;
            return;
          }
          if (px >= this.width - 44 && px <= this.width - 10) {
            this.synth.muted = !this.synth.muted;
            this.synth.playButton();
            return;
          }
        }

        // Board Cell Selection
        if (px >= this.boardX && px <= this.boardX + this.boardSize &&
            py >= this.boardY && py <= this.boardY + this.boardSize) {
          const c = Math.floor((px - this.boardX) / this.cellSize);
          const r = Math.floor((py - this.boardY) / this.cellSize);
          if (r >= 0 && r < 9 && c >= 0 && c < 9) {
            this.selected = { r, c };
            this.synth.playTap();
          }
          return;
        }

        // Action Toolbar (Undo and Hint)
        const toolW = Math.min(130, (this.width - 48) / 2);
        const undoX = 20;
        const hintX = this.width - 20 - toolW;

        if (px >= undoX && px <= undoX + toolW && py >= this.toolbarY && py <= this.toolbarY + 44) {
          this.handleUndo();
          return;
        }

        if (px >= hintX && px <= hintX + toolW && py >= this.toolbarY && py <= this.toolbarY + 44) {
          this.handleHint();
          return;
        }

        // Keypad Buttons (1 to 9)
        const keyW = Math.min(38, (this.width - 24) / 9);
        const keyGap = (this.width - 24 - keyW * 9) / 8;
        for (let num = 1; num <= 9; num++) {
          const kx = 12 + (num - 1) * (keyW + keyGap);
          if (px >= kx && px <= kx + keyW && py >= this.keypadY && py <= this.keypadY + 54) {
            this.keyPressTimer[num] = 0.12;
            this.handleInputNumber(num);
            return;
          }
        }
      }

      handleInputNumber(num) {
        if (!this.selected || this.state !== 'PLAYING') return;
        const { r, c } = this.selected;

        // 1. Clue cells from the start can never be edited
        if (this.given[r][c] !== 0) return;

        // 2. CRITICAL FIX: If cell was already CORRECTLY filled, it is LOCKED!
        // Tapping again will NOT erase it, and tapping wrong number will NOT lose a life!
        if (this.user[r][c] !== 0 && this.user[r][c] === this.solution[r][c]) {
          return; // Permanent correct placement locked!
        }

        const prevVal = this.user[r][c];

        // If user already had a wrong value in the cell and tapped the same digit, clear it
        if (prevVal === num) {
          this.user[r][c] = 0;
          this.synth.playErase();
          this.saveGame();
          return;
        }

        const isCorrect = (this.solution[r][c] === num);

        if (!isCorrect) {
          this.mistakes++;
          this.shakeTimer = 0.35;
          this.errorCell = { r, c, num };
          this.synth.playError();
          this.haptic('error');

          if (this.mistakes >= this.maxMistakes) {
            this.state = 'GAMEOVER';
            Host.post('onGameOver', { score: 0, reason: 'mistakes_exceeded' });
            return;
          }
        } else {
          this.user[r][c] = num;
          this.synth.playDigit(num);
          this.haptic('light');

          this.checkCompletions(r, c);

          if (this.checkVictory()) {
            this.triggerVictory();
          }
        }

        this.history.push({
          type: 'digit', r, c,
          prevVal: prevVal,
          newVal: num
        });
        this.saveGame();
      }

      checkCompletions(r, c) {
        // 1. Check Row Completion (Vibrant medium-sky blue line animation)
        let rowDone = true;
        for (let i = 0; i < 9; i++) {
          const val = this.given[r][i] || this.user[r][i];
          if (val !== this.solution[r][i]) { rowDone = false; break; }
        }
        if (rowDone) {
          this.sweeps.push({ type: 'row', index: r, t: 0, maxT: 1.35 });
          this.particles.addBlockBurst(this.boardX, this.boardY + r * this.cellSize, this.boardSize, this.cellSize);
          this.synth.playBlockComplete();
        }

        // 2. Check Column Completion (Vibrant medium-sky blue line animation)
        let colDone = true;
        for (let i = 0; i < 9; i++) {
          const val = this.given[i][c] || this.user[i][c];
          if (val !== this.solution[i][c]) { colDone = false; break; }
        }
        if (colDone) {
          this.sweeps.push({ type: 'col', index: c, t: 0, maxT: 1.35 });
          this.particles.addBlockBurst(this.boardX + c * this.cellSize, this.boardY, this.cellSize, this.boardSize);
          this.synth.playBlockComplete();
        }

        // 3. Check 3x3 Box Completion (Sharp square medium-sky blue shimmer)
        const br = Math.floor(r / 3) * 3;
        const bc = Math.floor(c / 3) * 3;
        let boxDone = true;
        for (let i = 0; i < 3; i++) {
          for (let j = 0; j < 3; j++) {
            const val = this.given[br + i][bc + j] || this.user[br + i][bc + j];
            if (val !== this.solution[br + i][bc + j]) { boxDone = false; break; }
          }
        }
        if (boxDone) {
          const boxIdx = Math.floor(r / 3) * 3 + Math.floor(c / 3);
          this.sweeps.push({ type: 'box', index: boxIdx, br, bc, t: 0, maxT: 1.35 });
          this.particles.addBlockBurst(this.boardX + bc * this.cellSize, this.boardY + br * this.cellSize, this.cellSize * 3, this.cellSize * 3);
          this.synth.playBlockComplete();
        }
      }

      handleErase() {
        if (!this.selected || this.state !== 'PLAYING') return;
        const { r, c } = this.selected;
        if (this.given[r][c] !== 0) return;

        // If correctly placed, cannot be erased
        if (this.user[r][c] !== 0 && this.user[r][c] === this.solution[r][c]) return;

        if (this.user[r][c] !== 0) {
          const prevVal = this.user[r][c];
          this.user[r][c] = 0;
          this.history.push({
            type: 'erase', r, c,
            prevVal, newVal: 0
          });
          this.synth.playErase();
          this.saveGame();
        }
      }

      handleUndo() {
        if (this.history.length === 0 || this.state !== 'PLAYING') return;
        const act = this.history.pop();
        if (act.type === 'digit' || act.type === 'erase') {
          this.user[act.r][act.c] = act.prevVal;
        }
        this.selected = { r: act.r, c: act.c };
        this.synth.playButton();
        this.saveGame();
      }

      handleHint() {
        if (this.state !== 'PLAYING') return;
        if (this.remainingHints <= 0) {
          this.synth.playError();
          this.toast = { text: 'No hints remaining!', t: 1.5, max: 1.5 };
          return;
        }
        const currentGrid = this.createCombinedGrid();
        const hint = SudokuCore.findHint(currentGrid, this.solution);
        if (!hint) return;

        this.remainingHints--;
        this.activeHint = hint;
        this.selected = { r: hint.r, c: hint.c };

        this.user[hint.r][hint.c] = hint.val;
        this.synth.playDigit(hint.val);
        this.haptic('success');

        this.checkCompletions(hint.r, hint.c);
        if (this.checkVictory()) this.triggerVictory();
        this.saveGame();
      }

      createCombinedGrid() {
        const g = SudokuCore.createEmptyGrid();
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            g[r][c] = this.given[r][c] || this.user[r][c] || 0;
          }
        }
        return g;
      }

      checkVictory() {
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const val = this.given[r][c] || this.user[r][c];
            if (val !== this.solution[r][c]) return false;
          }
        }
        return true;
      }

      triggerVictory() {
        this.state = 'VICTORY';
        this.particles.addVictoryConfetti(this.width, this.height);
        this.synth.playVictory();
        this.haptic('success');

        this.stats.gamesWon = (this.stats.gamesWon || 0) + 1;
        const best = this.stats.bestTimes[this.difficulty];
        if (!best || this.timer < best) {
          this.stats.bestTimes[this.difficulty] = Math.round(this.timer);
        }
        this.saveStats();
        this.saveGame();

        const earnedCoins = (DIFFICULTIES.find(d => d.id === this.difficulty) || DIFFICULTIES[0]).coins;
        Host.post('onGameCompleted', {
          score: Math.max(10, 1000 - Math.round(this.timer)),
          level: 1,
          time: this.timer,
          coins: earnedCoins
        });
      }

      haptic(type) {
        try {
          if (navigator.vibrate) {
            if (type === 'light') navigator.vibrate(12);
            else if (type === 'error') navigator.vibrate([25, 40, 25]);
            else if (type === 'success') navigator.vibrate([15, 30, 45]);
          }
        } catch (e) {}
      }

      getRemainingCounts() {
        const counts = Array(10).fill(9);
        counts[0] = 0;
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const val = this.given[r][c] || this.user[r][c];
            if (val >= 1 && val <= 9) counts[val]--;
          }
        }
        return counts;
      }

      formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
      }

      loop(timestamp) {
        const dt = Math.min(0.1, (timestamp - this.lastTime) / 1000);
        this.lastTime = timestamp;

        if (this.state === 'PLAYING' && !this.isPaused) {
          this.timer += dt;
        }

        if (this.state === 'TUTORIAL') {
          this.tutorialAnimT += dt;
        }

        if (this.shakeTimer > 0) this.shakeTimer = Math.max(0, this.shakeTimer - dt);
        if (this.toast) {
          this.toast.t -= dt;
          if (this.toast.t <= 0) this.toast = null;
        }
        for (let n = 1; n <= 9; n++) {
          if (this.keyPressTimer[n] > 0) this.keyPressTimer[n] = Math.max(0, this.keyPressTimer[n] - dt);
        }

        for (let i = this.sweeps.length - 1; i >= 0; i--) {
          this.sweeps[i].t += dt;
          if (this.sweeps[i].t >= this.sweeps[i].maxT) this.sweeps.splice(i, 1);
        }

        this.particles.update(dt);
        this.render();

        requestAnimationFrame((t) => this.loop(t));
      }

      // --- RENDERING PIPELINE ---
      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        const bgGrad = ctx.createLinearGradient(0, 0, 0, this.height);
        bgGrad.addColorStop(0, THEME.bgTop);
        bgGrad.addColorStop(1, THEME.bgBottom);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, this.width, this.height);

        this.renderHeader(ctx);
        this.renderBoard(ctx);
        this.renderToolbar(ctx);
        this.renderKeypad(ctx);
        this.particles.render(ctx);

        if (this.toast) this.renderToast(ctx);
        if (this.activeHint) this.renderHintOverlay(ctx);
        if (this.state === 'PAUSED') this.renderPauseModal(ctx);
        if (this.state === 'DIFF_SELECT') this.renderDifficultyDialog(ctx);
        if (this.state === 'TUTORIAL') this.renderTutorialModal(ctx);
        if (this.state === 'VICTORY') this.renderVictoryModal(ctx);
        if (this.state === 'GAMEOVER') this.renderGameOverModal(ctx);

        ctx.restore();
      }

      drawHeart(ctx, cx, cy, size, filled) {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(cx, cy + size * 0.25);
        ctx.bezierCurveTo(cx - size * 0.55, cy - size * 0.25, cx - size * 0.55, cy - size * 0.7, cx, cy - size * 0.35);
        ctx.bezierCurveTo(cx + size * 0.55, cy - size * 0.7, cx + size * 0.55, cy - size * 0.25, cx, cy + size * 0.25);
        ctx.closePath();

        if (filled) {
          const hg = ctx.createLinearGradient(cx - size, cy - size, cx + size, cy + size);
          hg.addColorStop(0, '#FF4B6E');
          hg.addColorStop(1, '#DC2626');
          ctx.fillStyle = hg;
          ctx.fill();

          ctx.beginPath();
          ctx.arc(cx - size * 0.22, cy - size * 0.25, size * 0.12, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.fill();
        } else {
          ctx.fillStyle = '#F1F5F9';
          ctx.fill();
          ctx.strokeStyle = '#CBD5E1';
          ctx.lineWidth = 1.6;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(cx - size * 0.18, cy - size * 0.2);
          ctx.lineTo(cx + size * 0.18, cy + size * 0.1);
          ctx.strokeStyle = '#94A3B8';
          ctx.lineWidth = 1.4;
          ctx.stroke();
        }
        ctx.restore();
      }

      drawEmblem(ctx, cx, cy, type, color) {
        ctx.save();
        ctx.translate(cx, cy);

        if (type === 'leaf') {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(0, -18);
          ctx.quadraticCurveTo(16, -10, 14, 12);
          ctx.quadraticCurveTo(0, 18, 0, 18);
          ctx.quadraticCurveTo(0, 18, -14, 12);
          ctx.quadraticCurveTo(-16, -10, 0, -18);
          ctx.fill();

          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 2.0;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(0, -12);
          ctx.lineTo(0, 12);
          ctx.stroke();

        } else if (type === 'spark') {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(2, -18);
          ctx.lineTo(-12, 2);
          ctx.lineTo(-1, 2);
          ctx.lineTo(-3, 18);
          ctx.lineTo(12, -2);
          ctx.lineTo(1, -2);
          ctx.closePath();
          ctx.fill();

        } else if (type === 'diamond') {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(-16, -6);
          ctx.lineTo(-8, -16);
          ctx.lineTo(8, -16);
          ctx.lineTo(16, -6);
          ctx.lineTo(0, 18);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(-8, -16);
          ctx.lineTo(-4, -6);
          ctx.lineTo(0, 18);
          ctx.lineTo(4, -6);
          ctx.lineTo(8, -16);
          ctx.moveTo(-16, -6);
          ctx.lineTo(16, -6);
          ctx.stroke();

        } else {
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.moveTo(-16, 14);
          ctx.lineTo(-18, -10);
          ctx.lineTo(-7, 0);
          ctx.lineTo(0, -16);
          ctx.lineTo(7, 0);
          ctx.lineTo(18, -10);
          ctx.lineTo(16, 14);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.arc(-18, -10, 2.5, 0, Math.PI * 2);
          ctx.arc(0, -16, 3, 0, Math.PI * 2);
          ctx.arc(18, -10, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }

      renderHeader(ctx) {
        const y = this.headerY;
        const diffObj = DIFFICULTIES.find(d => d.id === this.difficulty) || DIFFICULTIES[0];

        // 1. Difficulty Pill Button (Left)
        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.06)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(12, y, 100, 34, 17);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(28, y + 17, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = diffObj.color;
        ctx.fill();

        ctx.font = '800 12px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(diffObj.label + ' ▼', 38, y + 17);
        ctx.restore();

        // 2. Center 3 Hearts Pill (Mistakes: 3 Lives)
        const heartsPillW = 86;
        const heartsPillX = (this.width - heartsPillW) / 2;
        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.06)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(heartsPillX, y, heartsPillW, 34, 17);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        const remainingHearts = Math.max(0, 3 - this.mistakes);
        for (let i = 0; i < 3; i++) {
          const hx = heartsPillX + 18 + i * 25;
          const hy = y + 17;
          const isFilled = i < remainingHearts;
          this.drawHeart(ctx, hx, hy, 16, isFilled);
        }
        ctx.restore();

        // 3. Timer & Controls Pill (Right)
        const timerPillW = 76;
        const timerPillX = this.width - timerPillW - 74;
        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.06)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(timerPillX, y, timerPillW, 34, 17);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 13px Inter, monospace';
        ctx.fillStyle = '#0F172A';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.formatTime(this.timer), timerPillX + timerPillW / 2, y + 17);
        ctx.restore();

        // 4. Pause Button
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(this.width - 70, y, 32, 34, 12);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⏸', this.width - 54, y + 17);
        ctx.restore();

        // 5. Sound Button
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(this.width - 34, y, 32, 34, 12);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.synth.muted ? '🔇' : '🔊', this.width - 18, y + 17);
        ctx.restore();
      }

      renderBoard(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const bs = this.boardSize;
        const cs = this.cellSize;

        let shakeX = 0, shakeY = 0;
        if (this.shakeTimer > 0) {
          shakeX = (Math.random() - 0.5) * 8 * (this.shakeTimer / 0.35);
          shakeY = (Math.random() - 0.5) * 6 * (this.shakeTimer / 0.35);
        }

        ctx.save();
        ctx.translate(shakeX, shakeY);

        ctx.shadowColor = THEME.cardShadow;
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 6;
        ctx.fillStyle = THEME.cardBg;
        ctx.fillRect(bx, by, bs, bs);
        ctx.restore();

        ctx.save();
        ctx.translate(shakeX, shakeY);

        const selVal = this.selected ? (this.given[this.selected.r][this.selected.c] || this.user[this.selected.r][this.selected.c]) : 0;

        // Background cell fills
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const x = bx + c * cs;
            const y = by + r * cs;
            const val = this.given[r][c] || this.user[r][c];

            const isSelected = this.selected && (this.selected.r === r && this.selected.c === c);
            const isRelated = this.selected && (this.selected.r === r || this.selected.c === c ||
              (Math.floor(this.selected.r / 3) === Math.floor(r / 3) && Math.floor(this.selected.c / 3) === Math.floor(c / 3)));
            const isSameNum = (selVal > 0 && val === selVal);
            const isError = this.errorCell && this.errorCell.r === r && this.errorCell.c === c && this.shakeTimer > 0;

            if (isError) {
              ctx.fillStyle = THEME.errorBg;
              ctx.fillRect(x, y, cs, cs);
            } else if (isSelected) {
              ctx.fillStyle = THEME.selectedFill;
              ctx.fillRect(x, y, cs, cs);
            } else if (isSameNum) {
              ctx.fillStyle = THEME.sameNumFill;
              ctx.fillRect(x, y, cs, cs);
            } else if (isRelated) {
              ctx.fillStyle = THEME.relatedFill;
              ctx.fillRect(x, y, cs, cs);
            }
          }
        }

        // CONTINUOUS MEDIUM SKY-BLUE LINE SWEEPS (Clear, vibrant, beautifully balanced)
        for (const sweep of this.sweeps) {
          const progress = sweep.t / sweep.maxT;
          ctx.save();

          if (sweep.type === 'row') {
            const ry = by + sweep.index * cs;
            let drawW = bs;
            let alpha = 1.0;

            if (progress < 0.45) {
              const k = progress / 0.45;
              drawW = k * bs;
              alpha = 0.90;
            } else {
              drawW = bs;
              alpha = Math.max(0, 1.0 - (progress - 0.45) / 0.55);
            }

            // Balanced medium sky-blue gradient (clean and vivid)
            const grad = ctx.createLinearGradient(bx, ry, bx + drawW, ry);
            grad.addColorStop(0, 'rgba(56, 189, 248, ' + alpha * 0.65 + ')');
            grad.addColorStop(0.6, 'rgba(96, 165, 250, ' + alpha * 0.85 + ')');
            grad.addColorStop(1, 'rgba(186, 230, 253, ' + alpha * 0.95 + ')');

            ctx.fillStyle = grad;
            ctx.fillRect(bx, ry, drawW, cs);

            // Luminous center flare ray
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha * 0.85 + ')';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(bx, ry + cs / 2);
            ctx.lineTo(bx + drawW, ry + cs / 2);
            ctx.stroke();

          } else if (sweep.type === 'col') {
            const cx = bx + sweep.index * cs;
            let drawH = bs;
            let alpha = 1.0;

            if (progress < 0.45) {
              const k = progress / 0.45;
              drawH = k * bs;
              alpha = 0.90;
            } else {
              drawH = bs;
              alpha = Math.max(0, 1.0 - (progress - 0.45) / 0.55);
            }

            const grad = ctx.createLinearGradient(cx, by, cx, by + drawH);
            grad.addColorStop(0, 'rgba(56, 189, 248, ' + alpha * 0.65 + ')');
            grad.addColorStop(0.6, 'rgba(96, 165, 250, ' + alpha * 0.85 + ')');
            grad.addColorStop(1, 'rgba(186, 230, 253, ' + alpha * 0.95 + ')');

            ctx.fillStyle = grad;
            ctx.fillRect(cx, by, cs, drawH);

            ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha * 0.85 + ')';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(cx + cs / 2, by);
            ctx.lineTo(cx + cs / 2, by + drawH);
            ctx.stroke();

          } else if (sweep.type === 'box') {
            const boxX = bx + sweep.bc * cs;
            const boxY = by + sweep.br * cs;
            const boxW = cs * 3.0;
            const alpha = Math.sin(progress * Math.PI) * 0.85;

            const grad = ctx.createRadialGradient(boxX + boxW / 2, boxY + boxW / 2, 5, boxX + boxW / 2, boxY + boxW / 2, boxW * 0.70);
            grad.addColorStop(0, 'rgba(255, 255, 255, ' + alpha * 0.90 + ')');
            grad.addColorStop(0.45, 'rgba(56, 189, 248, ' + alpha * 0.75 + ')');
            grad.addColorStop(0.85, 'rgba(96, 165, 250, ' + alpha * 0.50 + ')');
            grad.addColorStop(1, 'rgba(30, 58, 138, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(boxX, boxY, boxW, boxW);
          }
          ctx.restore();
        }

        // Minor grid lines
        ctx.strokeStyle = THEME.minorGrid;
        ctx.lineWidth = 1.0;
        for (let i = 1; i < 9; i++) {
          if (i % 3 === 0) continue;
          ctx.beginPath();
          ctx.moveTo(bx + i * cs, by);
          ctx.lineTo(bx + i * cs, by + bs);
          ctx.moveTo(bx, by + i * cs);
          ctx.lineTo(bx + bs, by + i * cs);
          ctx.stroke();
        }

        // Major 3x3 block grid lines
        ctx.strokeStyle = THEME.majorGrid;
        ctx.lineWidth = 2.4;
        for (let i = 3; i < 9; i += 3) {
          ctx.beginPath();
          ctx.moveTo(bx + i * cs, by);
          ctx.lineTo(bx + i * cs, by + bs);
          ctx.moveTo(bx, by + i * cs);
          ctx.lineTo(bx + bs, by + i * cs);
          ctx.stroke();
        }

        // Numbers rendering
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            const cx = bx + c * cs + cs / 2;
            const cy = by + r * cs + cs / 2;
            const givenVal = this.given[r][c];
            const userVal = this.user[r][c];

            if (givenVal > 0) {
              ctx.font = '800 ' + Math.round(cs * 0.58) + 'px Fredoka, Inter, sans-serif';
              ctx.fillStyle = THEME.clueDigit;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(givenVal.toString(), cx, cy + 1);
            } else if (userVal > 0) {
              ctx.font = '700 ' + Math.round(cs * 0.56) + 'px Fredoka, Inter, sans-serif';
              ctx.fillStyle = THEME.userDigit;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText(userVal.toString(), cx, cy + 1);
            }
          }
        }

        // Selected Cell Focus Ring
        if (this.selected) {
          const sx = bx + this.selected.c * cs;
          const sy = by + this.selected.r * cs;
          ctx.strokeStyle = THEME.selectedBorder;
          ctx.lineWidth = 2.8;
          ctx.strokeRect(sx + 1.5, sy + 1.5, cs - 3, cs - 3);
        }

        ctx.restore();

        // 9x9 OUTER BOUNDING BORDER (Crisp Straight Rectangle)
        ctx.save();
        ctx.translate(shakeX, shakeY);
        ctx.strokeStyle = THEME.outerBorder;
        ctx.lineWidth = 3.0;
        ctx.strokeRect(bx - 0.5, by - 0.5, bs + 1, bs + 1);
        ctx.restore();
      }

      renderToolbar(ctx) {

        ctx.save();

        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;
        ctx.beginPath();
        ctx.roundRect(undoX, y, toolW, 44, 14);
        ctx.fillStyle = THEME.btnDefaultBg;
        ctx.fill();
        ctx.strokeStyle = THEME.btnDefaultBorder;
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.restore();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↩️', undoX + 26, y + 22);

        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = THEME.btnDefaultText;
        ctx.textAlign = 'left';
        ctx.fillText('Undo', undoX + 46, y + 22);

        // 2. Hint Button
        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.05)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;
        ctx.beginPath();
        ctx.roundRect(hintX, y, toolW, 44, 14);
        ctx.fillStyle = THEME.btnDefaultBg;
        ctx.fill();
        ctx.strokeStyle = THEME.btnDefaultBorder;
        ctx.lineWidth = 1.4;
        ctx.stroke();
        ctx.restore();

        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💡', hintX + 26, y + 22);

        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = THEME.btnDefaultText;
        ctx.textAlign = 'left';
        ctx.fillText('Hint', hintX + 46, y + 22);

        const badgeX = hintX + toolW - 22;
        const badgeY = y + 22;

        ctx.fillStyle = this.remainingHints > 0 ? THEME.accentYellow : '#94A3B8';
        ctx.fill();
        ctx.font = '800 10px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';

      renderKeypad(ctx) {
        const y = this.keypadY;
        const keyW = Math.min(38, (this.width - 24) / 9);
        const keyGap = (this.width - 24 - keyW * 9) / 8;
        const remaining = this.getRemainingCounts();

        for (let num = 1; num <= 9; num++) {
          const x = 12 + (num - 1) * (keyW + keyGap);
          const isDone = remaining[num] === 0;
          const isPressed = this.keyPressTimer[num] > 0;
          const dy = isPressed ? 2 : 0;

          ctx.save();
          if (!isDone) {
            ctx.beginPath();
            ctx.roundRect(x, y + 3, keyW, 52, 12);
            ctx.fillStyle = '#CBD5E1';
            ctx.fill();
          }

          ctx.beginPath();
          ctx.roundRect(x, y + dy, keyW, 52, 12);
          ctx.fillStyle = isDone ? '#F1F5F9' : '#FFFFFF';
          ctx.fill();
          ctx.strokeStyle = isDone ? '#E2E8F0' : '#E2E8F0';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.font = '800 21px Fredoka, Inter, sans-serif';
          ctx.fillStyle = isDone ? '#94A3B8' : '#0F172A';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(num.toString(), x + keyW / 2, y + 20 + dy);

          if (isDone) {
            ctx.beginPath();
            ctx.arc(x + keyW / 2, y + 39 + dy, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#22C55E';
            ctx.fill();
            ctx.font = '800 9px sans-serif';
            ctx.fillStyle = '#FFFFFF';
            ctx.fillText('✓', x + keyW / 2, y + 39 + dy);
          } else {
            ctx.font = '700 10px Inter, sans-serif';
            ctx.fillStyle = '#3B82F6';
            ctx.fillText(remaining[num].toString(), x + keyW / 2, y + 39 + dy);
          }
          ctx.restore();
        }
      }

      // --- COMPACT FLOATING DIFFICULTY DIALOG ---
      renderDifficultyDialog(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.60)';
        ctx.fillRect(0, 0, this.width, this.height);

        const bounds = this.getDifficultyDialogBounds();
        const curIdx = Math.max(0, Math.min(3, Math.round(this.sliderPos)));
        const d = DIFFICULTIES[curIdx];

        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.28)';
        ctx.shadowBlur = 28;
        ctx.shadowOffsetY = 10;
        ctx.beginPath();
        ctx.roundRect(bounds.cardX, bounds.cardY, bounds.cardW, bounds.cardH, 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        ctx.font = '900 18px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#0F172A';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT DIFFICULTY', this.width / 2, bounds.cardY + 36);

        const emblemY = bounds.cardY + 95;
        const emblemR = 36;

        ctx.save();
        ctx.shadowColor = d.color + '55';
        ctx.shadowBlur = 16;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.arc(this.width / 2, emblemY, emblemR, 0, Math.PI * 2);
        ctx.fillStyle = '#F8FAFC';
        ctx.fill();
        ctx.strokeStyle = d.color;
        ctx.lineWidth = 2.8;
        ctx.stroke();

        this.drawEmblem(ctx, this.width / 2, emblemY, d.emblem, d.color);
        ctx.restore();

        ctx.font = '900 22px Fredoka, Inter, sans-serif';
        ctx.fillStyle = d.color;
        ctx.textAlign = 'center';
        ctx.fillText(d.label, this.width / 2, bounds.cardY + 162);

        ctx.font = '700 12.5px Inter, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText(d.clues + ' Clues Given • ' + d.subtitle, this.width / 2, bounds.cardY + 185);

        const usableW = bounds.trackW - 2 * bounds.knobR;
        const knobX = bounds.trackX + bounds.knobR + (this.sliderPos / 3) * usableW;

        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.06)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(bounds.trackX - 4, bounds.trackY - 4, bounds.trackW + 8, bounds.trackH + 8, (bounds.trackH + 8) / 2);
        ctx.fillStyle = '#F1F5F9';
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bounds.trackX, bounds.trackY, bounds.trackW, bounds.trackH, bounds.trackH / 2);
        ctx.fillStyle = '#E2E8F0';
        ctx.fill();

        const activeW = Math.max(bounds.trackH, knobX - bounds.trackX + bounds.knobR);
        const trackGrad = ctx.createLinearGradient(bounds.trackX, 0, bounds.trackX + bounds.trackW, 0);
        trackGrad.addColorStop(0, '#22C55E');
        trackGrad.addColorStop(0.33, '#F59E0B');
        trackGrad.addColorStop(0.66, '#EF4444');
        trackGrad.addColorStop(1, '#8B5CF6');

        ctx.beginPath();
        ctx.roundRect(bounds.trackX, bounds.trackY, activeW, bounds.trackH, bounds.trackH / 2);
        ctx.fillStyle = trackGrad;
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.24)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.arc(knobX, bounds.trackY + bounds.trackH / 2, bounds.knobR, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(knobX, bounds.trackY + bounds.trackH / 2, bounds.knobR - 4, 0, Math.PI * 2);
        ctx.fillStyle = d.color;
        ctx.fill();
        ctx.restore();

        // [ PLAY ▶ ] + [ ? Tutorial ]
        ctx.save();
        ctx.shadowColor = d.color + '66';
        ctx.shadowBlur = 14;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.roundRect(bounds.playX, bounds.playY, bounds.playW, bounds.playH, 18);
        ctx.fillStyle = d.color;
        ctx.fill();
        ctx.restore();

        ctx.font = '900 18px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PLAY ▶', bounds.playX + bounds.playW / 2, bounds.playY + bounds.playH / 2);

        ctx.save();
        ctx.shadowColor = 'rgba(139, 92, 246, 0.35)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 3;
        ctx.beginPath();
        ctx.roundRect(bounds.qX, bounds.qY, bounds.qSize, bounds.qSize, 16);
        ctx.fillStyle = '#8B5CF6';
        ctx.fill();
        ctx.restore();

        ctx.font = '900 22px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', bounds.qX + bounds.qSize / 2, bounds.qY + bounds.qSize / 2);
      }

      // --- TUTORIAL / HOW TO PLAY MODAL ---------------------------------------
      renderTutorialModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.fillRect(0, 0, this.width, this.height);

        const modalW = Math.min(330, this.width - 32);
        const modalH = Math.min(500, this.height * 0.82);
        const modalX = (this.width - modalW) / 2;
        const modalY = (this.height - modalH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.35)';
        ctx.shadowBlur = 32;
        ctx.shadowOffsetY = 12;
        ctx.beginPath();
        ctx.roundRect(modalX, modalY, modalW, modalH, 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        ctx.font = '900 20px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#0F172A';
        ctx.textAlign = 'center';
        ctx.fillText('HOW TO PLAY', this.width / 2, modalY + 34);

        const demoW = modalW - 32;
        const demoH = modalH * 0.50;
        const demoX = modalX + 16;
        const demoY = modalY + 50;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(demoX, demoY, demoW, demoH, 16);
        ctx.fillStyle = '#0284C7';
        ctx.fill();
        ctx.clip();

        const heartSize = 13;
        for (let i = -1; i <= 1; i++) {
          this.drawHeart(ctx, demoX + demoW / 2 + i * 20, demoY + 16, heartSize, true);
        }

        const miniBoardSize = Math.min(demoW * 0.72, demoH * 0.62);
        const miniX = demoX + (demoW - miniBoardSize) / 2;
        const miniY = demoY + 32;
        const mcs = miniBoardSize / 9;

        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(miniX, miniY, miniBoardSize, miniBoardSize);

        const animAlpha = 0.35 + Math.sin(this.tutorialAnimT * 4) * 0.20;
        if (this.tutorialSlide === 1) {
          ctx.fillStyle = 'rgba(37, 99, 235, ' + animAlpha + ')';
          ctx.fillRect(miniX, miniY + 3 * mcs, miniBoardSize, mcs);
        } else if (this.tutorialSlide === 2) {
          ctx.fillStyle = 'rgba(34, 197, 94, ' + animAlpha + ')';
          ctx.fillRect(miniX + 4 * mcs, miniY, mcs, miniBoardSize);
        } else if (this.tutorialSlide === 3) {
          ctx.fillStyle = 'rgba(245, 158, 11, ' + animAlpha + ')';
          ctx.fillRect(miniX + 3 * mcs, miniY + 3 * mcs, mcs * 3, mcs * 3);
        } else if (this.tutorialSlide === 4) {
          ctx.fillStyle = 'rgba(239, 68, 68, ' + animAlpha + ')';
          ctx.fillRect(miniX + 2 * mcs, miniY + 2 * mcs, mcs, mcs);
        }

        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 0.8;
        for (let i = 1; i < 9; i++) {
          if (i % 3 === 0) continue;
          ctx.beginPath();
          ctx.moveTo(miniX + i * mcs, miniY);
          ctx.lineTo(miniX + i * mcs, miniY + miniBoardSize);
          ctx.moveTo(miniX, miniY + i * mcs);
          ctx.lineTo(miniX + miniBoardSize, miniY + i * mcs);
          ctx.stroke();
        }
        ctx.strokeStyle = '#0F172A';
        ctx.lineWidth = 1.8;
        for (let i = 3; i < 9; i += 3) {
          ctx.beginPath();
          ctx.moveTo(miniX + i * mcs, miniY);
          ctx.lineTo(miniX + i * mcs, miniY + miniBoardSize);
          ctx.moveTo(miniX, miniY + i * mcs);
          ctx.lineTo(miniX + miniBoardSize, miniY + i * mcs);
          ctx.stroke();
        }

        ctx.font = '700 ' + Math.round(mcs * 0.65) + 'px Fredoka, sans-serif';
        ctx.fillStyle = '#0F172A';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const sampleNums = [
          [0,0,3,0,8,0,0,1,5],
          [0,0,0,9,0,0,8,3,0],
          [0,8,0,0,4,0,0,6,0],
          [1,5,0,8,3,0,0,2,0],
          [3,0,0,2,0,0,9,0,8],
          [0,0,0,0,9,2,1,4,6],
          [9,1,2,5,0,0,0,8,0],
          [0,0,0,0,7,0,5,0,0],
          [0,4,0,0,0,0,0,0,0]
        ];
        for (let r = 0; r < 9; r++) {
          for (let c = 0; c < 9; c++) {
            if (sampleNums[r][c] > 0) {
              ctx.fillText(sampleNums[r][c].toString(), miniX + c * mcs + mcs / 2, miniY + r * mcs + mcs / 2 + 0.5);
            }
          }
        }

        const keyBarY = miniY + miniBoardSize + 8;
        const keyW = (demoW - 32) / 9;
        for (let n = 1; n <= 9; n++) {
          const kx = demoX + 16 + (n - 1) * keyW;
          ctx.beginPath();
          ctx.roundRect(kx + 1, keyBarY, keyW - 2, 18, 4);
          ctx.fillStyle = '#0369A1';
          ctx.fill();
          ctx.font = '800 10px Inter, sans-serif';
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText(n.toString(), kx + keyW / 2, keyBarY + 9);
        }
        ctx.restore();

        const textY = demoY + demoH + 22;
        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.textAlign = 'center';

        const descriptions = [
          'The goal is to fill in all empty squares\non the 9x9 board with numbers (1 to 9).',
          'Each ROW must contain numbers 1 to 9\nwithout repeating any number.',
          'Each COLUMN must contain numbers 1 to 9\nwithout repeating any number.',
          'Each 3x3 BLOCK must contain numbers 1 to 9\nwithout repeating any number.',
          'Use HINTS (💡) when you get stuck\nto reveal the correct logical placement.'
        ];
        const lines = descriptions[this.tutorialSlide].split('\n');
        lines.forEach((ln, idx) => {
          ctx.fillText(ln, this.width / 2, textY + idx * 18);
        });

        const btnY = modalY + modalH - 54;
        const dotY = btnY - 18;
        for (let i = 0; i < this.maxTutorialSlides; i++) {
          const dx = this.width / 2 + (i - (this.maxTutorialSlides - 1) / 2) * 20;
          ctx.beginPath();
          ctx.arc(dx, dotY, i === this.tutorialSlide ? 4.5 : 3, 0, Math.PI * 2);
          ctx.fillStyle = i === this.tutorialSlide ? '#F59E0B' : '#E2E8F0';
          ctx.fill();
        }

        // 1. Prev Button
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(modalX + 16, btnY, 44, 40, 12);
        ctx.fillStyle = '#F1F5F9';
        ctx.fill();
        ctx.font = '800 15px sans-serif';
        ctx.fillStyle = '#475569';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('◀', modalX + 38, btnY + 20);
        ctx.restore();

        // 2. OK / Close Button
        const okW = modalW - 136;
        const okX = modalX + 68;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(okX, btnY, okW, 40, 14);
        ctx.fillStyle = '#8B5CF6';
        ctx.fill();
        ctx.font = '800 15px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('OK', okX + okW / 2, btnY + 20);
        ctx.restore();

        // 3. Next Button
        const nextX = modalX + modalW - 60;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(nextX, btnY, 44, 40, 12);
        ctx.fillStyle = '#F1F5F9';
        ctx.fill();
        ctx.font = '800 15px sans-serif';
        ctx.fillStyle = '#475569';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▶', nextX + 22, btnY + 20);
        ctx.restore();
      }

      renderToast(ctx) {
        const t = this.toast;
        if (!t) return;
        const tw = Math.min(280, this.width - 40);
        const tx = (this.width - tw) / 2;
        const ty = this.toolbarY - 50;

        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.12)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, 36, 18);
        ctx.fillStyle = '#1E293B';
        ctx.fill();
        ctx.font = '700 12px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.text, tx + tw / 2, ty + 18);
        ctx.restore();
      }

      renderHintOverlay(ctx) {
        const h = this.activeHint;
        if (!h) return;

        const cardW = Math.min(320, this.width - 32);
        const cardX = (this.width - cardW) / 2;
        const cardY = this.toolbarY - 100;

        ctx.save();
        ctx.shadowColor = 'rgba(15, 23, 42, 0.14)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 6;

        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, 88, 16);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#F59E0B';
        ctx.lineWidth = 2.0;
        ctx.stroke();
        ctx.restore();

        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = '#D97706';
        ctx.textAlign = 'left';
        ctx.fillText('💡 SMART HINT APPLIED', cardX + 16, cardY + 22);

        ctx.font = '600 12px Inter, sans-serif';
        ctx.fillStyle = '#334155';
        this.wrapText(ctx, h.reason, cardX + 16, cardY + 42, cardW - 32, 16);

        ctx.font = '700 10px Inter, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.textAlign = 'right';
        ctx.fillText('Tap anywhere to continue ▶', cardX + cardW - 16, cardY + 76);
      }

      wrapText(ctx, text, x, y, maxWidth, lineHeight) {
        const words = text.split(' ');
        let line = '';
        let cy = y;
        for (let n = 0; n < words.length; n++) {
          const testLine = line + words[n] + ' ';
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, x, cy);
            line = words[n] + ' ';
            cy += lineHeight;
          } else {
            line = testLine;
          }
        }
        ctx.fillText(line, x, cy);
      }

      renderPauseModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.55)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(300, this.width - 40);
        const cardH = 220;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 20);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.font = '800 20px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#0F172A';
        ctx.textAlign = 'center';
        ctx.fillText('GAME PAUSED', this.width / 2, cardY + 44);

        const resumeY = this.height * 0.48;
        ctx.beginPath();
        ctx.roundRect(cardX + 30, resumeY, cardW - 60, 44, 22);
        ctx.fillStyle = '#2563EB';
        ctx.fill();
        ctx.font = '800 15px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('RESUME ▶', this.width / 2, resumeY + 22);

        const restartY = this.height * 0.56;
        ctx.beginPath();
        ctx.roundRect(cardX + 30, restartY, cardW - 60, 44, 22);
        ctx.fillStyle = '#F1F5F9';
        ctx.fill();
        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.font = '800 14px Inter, sans-serif';
        ctx.fillStyle = '#475569';
        ctx.fillText('CHANGE LEVEL', this.width / 2, restartY + 22);
      }

      renderVictoryModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(330, this.width - 40);
        const cardH = 340;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.font = '900 24px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#22C55E';
        ctx.textAlign = 'center';
        ctx.fillText('PUZZLE SOLVED! 🎉', this.width / 2, cardY + 48);

        const starY = cardY + 92;
        for (let i = -1; i <= 1; i++) {
          ctx.font = '28px sans-serif';
          ctx.fillText('⭐', this.width / 2 + i * 42, starY);
        }

        ctx.font = '700 14px Inter, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText('Difficulty: ' + this.difficulty.toUpperCase(), this.width / 2, cardY + 144);
        ctx.fillText('Time: ' + this.formatTime(this.timer), this.width / 2, cardY + 172);

        const best = this.stats.bestTimes[this.difficulty];
        if (best) {
          ctx.fillText('Best Time: ' + this.formatTime(best), this.width / 2, cardY + 200);
        }

        const btnW = 220, btnH = 50;
        const btnX = (this.width - btnW) / 2;
        const btnY = this.height * 0.74;

        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 25);
        ctx.fillStyle = '#2563EB';
        ctx.fill();
        ctx.font = '800 16px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('PLAY NEXT PUZZLE ▶', this.width / 2, btnY + 25);
      }

      renderGameOverModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(300, this.width - 40);
        const cardH = 260;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.font = '900 22px Fredoka, Inter, sans-serif';
        ctx.fillStyle = '#DC2626';
        ctx.textAlign = 'center';
        ctx.fillText('ALL LIVES LOST', this.width / 2, cardY + 48);

        ctx.font = '600 14px Inter, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText('You made 3 mistakes in this puzzle.', this.width / 2, cardY + 84);

        const btnW = 200, btnH = 48;
        const btnX = (this.width - btnW) / 2;
        const btnY = this.height * 0.68;

        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 24);
        ctx.fillStyle = '#2563EB';
        ctx.fill();
        ctx.font = '800 16px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('TRY AGAIN 🔄', this.width / 2, btnY + 24);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('gameCanvas');
      window.game = new SudokuGame(canvas);
    });
  </script>
</body>
</html>
