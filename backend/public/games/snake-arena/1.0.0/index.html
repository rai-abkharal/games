            const SoundSynth = new SoundSynthesizer();
            class FoodManager {
                constructor() {
                    this.pellets = [];
                    this.nextId = 1;
                    this.targetFoodCount = 15000;
                    this.cellSize = 150;

                rebuildGrid() {
                    this.grid.clear();
                    for (let i = 0; i < this.pellets.length; i++) {
                        const p = this.pellets[i];
                        const key = this.getKey(p.x, p.y);
                        let list = this.grid.get(key);
                        if (!list) {
                            list = [];
                            this.grid.set(key, list);
                        }
                        list.push(i);
                    }
                }
                spawnInitialFood() {
                    this.pellets = [];
                    for (let i = 0; i < this.targetFoodCount; i++) {

                spawnRandomPellet(nearPoint, radiusSpread = 400) {
                    const isLarge = Math.random() < 0.08;
                    const colorDef = FOOD_COLORS[Math.floor(Math.random() * FOOD_COLORS.length)];

                    if (nearPoint) {
                        const angle = Math.random() * Math.PI * 2;
                        const d = Math.random() * radiusSpread;
                        x = Math.max(100, Math.min(WORLD_WIDTH - 100, nearPoint.x + Math.cos(angle) * d));
                        y = Math.max(100, Math.min(WORLD_HEIGHT - 100, nearPoint.y + Math.sin(angle) * d));
                    }
                    else {
                        x = 80 + Math.random() * (WORLD_WIDTH - 160);
                        y = 80 + Math.random() * (WORLD_HEIGHT - 160);
                    }
                    const baseRadius = isLarge ? 7.5 : 4.5;
                    const value = isLarge ? 3 : 1;
                    const pellet = {
                        id: this.nextId++,

                        y,
                        radius: baseRadius,
                        baseRadius,

                        color: colorDef.color,
                        glowColor: colorDef.glow,

                        isDeathLoot: false,

                spawnDeathLoot(segments, colors, score = 20) {
                    if (!segments || segments.length === 0)
                        return;
                    const baseCount = Math.max(6, Math.floor(segments.length * 0.9));
                    const scoreBonus = Math.min(10, Math.floor(score * 0.15));
                    const count = Math.max(6, baseCount + scoreBonus);
                    for (let i = 0; i < count; i++) {
                        const segIndex = Math.floor((i / count) * segments.length);
                        const seg = segments[segIndex] || segments[i % segments.length];
                        const col = colors[i % colors.length] || FOOD_COLORS[i % FOOD_COLORS.length].color;
                        const angle = Math.random() * Math.PI * 2;
                        const spread = (Math.random() * 18) + 2;
                        const isLarge = Math.random() < 0.25;
                        const pellet = {
                            id: this.nextId++,
                            x: Math.max(50, Math.min(WORLD_WIDTH - 50, seg.x + Math.cos(angle) * spread)),
                            y: Math.max(50, Math.min(WORLD_HEIGHT - 50, seg.y + Math.sin(angle) * spread)),
                            radius: isLarge ? 8.5 : 5.0 + Math.random() * 1.5,
                            baseRadius: isLarge ? 8.5 : 5.0 + Math.random() * 1.5,
                            value: isLarge ? 4 + Math.floor(Math.random() * 4) : 2,
                            color: col,
                            glowColor: isLarge ? col : 'transparent',
                            isLarge,
                            isDeathLoot: true,
                            pulseOffset: Math.random() * Math.PI * 2,
                            vx: (Math.random() - 0.5) * 35,
                            vy: (Math.random() - 0.5) * 35
                        };
                        this.pellets.push(pellet);
                    }
                    this.rebuildGrid();
                }
                update(dt, time) {
                    for (let i = 0; i < this.pellets.length; i++) {
                        const p = this.pellets[i];
                        if (p.vx !== 0 || p.vy !== 0) {
                            p.x += p.vx * dt;
                            p.y += p.vy * dt;
                            p.vx *= 0.92;
                            p.vy *= 0.92;
                            if (Math.abs(p.vx) < 0.5 && Math.abs(p.vy) < 0.5) {
                                p.vx = 0;
                                p.vy = 0;
                            }
                        }
                        const pulseSpeed = p.isLarge ? 4.0 : 2.5;
                        const scale = 1.0 + Math.sin(time * pulseSpeed + p.pulseOffset) * (p.isLarge ? 0.16 : 0.08);
                        p.radius = p.baseRadius * scale;
                    }
                    if (this.pellets.length < this.targetFoodCount) {
                        const deficit = this.targetFoodCount - this.pellets.length;
                        const toSpawn = Math.min(deficit, 80);
                        for (let i = 0; i < toSpawn; i++) {
                            this.spawnRandomPellet();
                        }
                    }
                    this.rebuildGrid();
                }
                checkCollection(headX, headY, headRadius) {
                    let collectedScore = 0;
                    let collectedCount = 0;
                    const minCx = Math.floor((headX - MAGNET_RADIUS) / this.cellSize);
                    const maxCx = Math.floor((headX + MAGNET_RADIUS) / this.cellSize);
                    const minCy = Math.floor((headY - MAGNET_RADIUS) / this.cellSize);
                    const maxCy = Math.floor((headY + MAGNET_RADIUS) / this.cellSize);
                    const toRemoveIndices = new Set();
                    for (let cx = minCx; cx <= maxCx; cx++) {
                        for (let cy = minCy; cy <= maxCy; cy++) {
                            const list = this.grid.get(`${cx},${cy}`);
                            if (!list)
                                continue;
                            for (const idx of list) {
                                if (toRemoveIndices.has(idx))
                                    continue;
                                const p = this.pellets[idx];
                                if (!p)
                                    continue;
                                const dSq = distSq(headX, headY, p.x, p.y);
                                const collectRadiusSq = Math.pow(headRadius + p.radius + 2, 2);
                                const magnetRadiusSq = Math.pow(MAGNET_RADIUS, 2);
                                if (dSq <= collectRadiusSq) {
                                    collectedScore += p.value;
                                    collectedCount++;
                                    toRemoveIndices.add(idx);
                                }
                                else if (dSq <= magnetRadiusSq) {
                                    const d = Math.sqrt(dSq);
                                    const pullSpeed = (1 - d / MAGNET_RADIUS) * 380;
                                    const nx = (headX - p.x) / d;
                                    const ny = (headY - p.y) / d;
                                    p.x += nx * pullSpeed * 0.016;
                                    p.y += ny * pullSpeed * 0.016;
                                }
                            }
                        }
                    }
                    if (toRemoveIndices.size > 0) {
                        this.pellets = this.pellets.filter((_, idx) => !toRemoveIndices.has(idx));
                    }
                    return { collectedScore, collectedCount };
                }
                draw(ctx, camX, camY, viewW, viewH) {
                    const margin = 50;
                    const minX = camX - viewW / 2 - margin;
                    const maxX = camX + viewW / 2 + margin;
                    const minY = camY - viewH / 2 - margin;
                    const maxY = camY + viewH / 2 + margin;
                    for (const p of this.pellets) {
                        if (p.x < minX || p.x > maxX || p.y < minY || p.y > maxY)
                            continue;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        if (p.isLarge && p.glowColor !== 'transparent') {
                            ctx.beginPath();
                            ctx.arc(0, 0, p.radius * 1.6, 0, Math.PI * 2);
                            ctx.fillStyle = p.glowColor;
                            ctx.fill();
                        }
                        const grad = ctx.createRadialGradient(-p.radius * 0.35, -p.radius * 0.35, p.radius * 0.1, 0, 0, p.radius);

            class App {

                    });
                    this.canvas.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        if (e.touches.length > 0) {
                            onDown(e.touches[0].clientX, e.touches[0].clientY);
                        }
                    }, { passive: false });
                    window.addEventListener('touchmove', (e) => {
                        if (e.touches.length > 0) {
                            onMove(e.touches[0].clientX, e.touches[0].clientY);
                        }
                    }, { passive: false });
                    window.addEventListener('touchend', (e) => {
                        if (e.changedTouches.length > 0) {
                            onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                        }
                    }, { passive: false });
                    window.addEventListener('mousemove', (e) => {
                        onMove(e.clientX, e.clientY);
                    });

                    window.addEventListener('pointercancel', (e) => {
                        onUp(e.clientX, e.clientY);
                    });

                    window.addEventListener('touchcancel', (e) => {
                        if (e.changedTouches.length > 0) {
                            onUp(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
                        }
                    }, { passive: false });

                    window.addEventListener('mouseleave', (e) => {
                        onUp(e.clientX, e.clientY);
                    });
                    window.addEventListener('keydown', (e) => {
                        if (e.code === 'Space') {
                            this.engine.isBoostPressed = true;
                        }
                        const j = this.engine.joystick;
                        if (e.code === 'KeyW' || e.code === 'ArrowUp') {
                            this.engine.player.targetAngle = -Math.PI / 2;
                            j.knobX = j.baseX;
                            j.knobY = j.baseY - j.maxDistance;
                        }
                        else if (e.code === 'KeyS' || e.code === 'ArrowDown') {
                            this.engine.player.targetAngle = Math.PI / 2;
                            j.knobX = j.baseX;
                            j.knobY = j.baseY + j.maxDistance;
                        }
                        else if (e.code === 'KeyA' || e.code === 'ArrowLeft') {
                            this.engine.player.targetAngle = Math.PI;
                            j.knobX = j.baseX - j.maxDistance;
                            j.knobY = j.baseY;
                        }
                        else if (e.code === 'KeyD' || e.code === 'ArrowRight') {
                            this.engine.player.targetAngle = 0;
                            j.knobX = j.baseX + j.maxDistance;
                            j.knobY = j.baseY;
                        }
                    });
                    window.addEventListener('keyup', (e) => {
                        if (e.code === 'Space') {
                            this.engine.isBoostPressed = false;
                        }
                        if (['KeyW', 'KeyS', 'KeyA', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                            this.engine.joystick.knobX = this.engine.joystick.baseX;
                            this.engine.joystick.knobY = this.engine.joystick.baseY;
                        }
                    });
                }
                loop(now) {
                    const dt = Math.min((now - this.lastTime) / 1000, 0.05);
                    this.lastTime = now;
                    this.engine.update(dt);
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    this.ctx.save();
                    this.ctx.scale(dpr, dpr);
                    this.ctx.fillStyle = '#0B0F19';
                    this.ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
                    this.ctx.translate(this.offsetX, this.offsetY);
                    this.ctx.scale(this.scale, this.scale);
                    this.ctx.beginPath();
                    this.ctx.rect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);
                    this.ctx.clip();
                    this.engine.draw(this.ctx);
                    this.ctx.restore();
                    requestAnimationFrame(this.loop.bind(this));
                }
            }
            window.addEventListener('DOMContentLoaded', () => {
                new App();
            });
        })();
    </script>
</body>

</html>
