<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Moto Balance: Skyline Run</title>
  <style>
    :root { color-scheme: dark; --native-dock-safe: 0px; }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #071827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { overscroll-behavior: none; }
    #game-root { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: radial-gradient(circle at 50% 22%, #1b5a7a 0%, #0a2339 58%, #050d18 100%); }
    canvas { display: block; width: min(100vw, 56.25vh) !important; height: min(177.7778vw, 100vh) !important; box-shadow: 0 22px 70px rgba(0, 0, 0, .65), 0 0 0 1px rgba(226, 248, 255, .16); border-radius: clamp(0px, 1.5vw, 18px); }
    .native-host canvas { width: 100% !important; height: 100% !important; box-shadow: none; border-radius: 0; }
  </style>
</head>
<body>
  <div id="game-root" aria-label="Moto Balance Skyline Run"></div>
  <script src="/shared/phaser-full.min.js"></script>
  <script>
  (() => {
    'use strict';

    /*
     * Moto Balance is intentionally built on Matter rather than sprite rotation.
     * The chassis, two wheels, torso, head, knees, and hands are individual
     * dynamic bodies joined with real spring constraints. Rendering is custom,
     * but all movement, landings, torque, gravity, and crashes come from Matter.
     */
    const W = 360;
    const H = 640;
    const ROAD_DEPTH = 34;
    const GAME_ID = 'moto-balance';
    const VERSION = '1.0.3';

    const MODES = {
      easy: {
        label: 'EASY', color: 0x43d6a6, colorHex: '#43d6a6', accent: 0x9ef2d1,
        maxSpeed: 6.15, speedRamp: 0.34, driveForce: 0.0090, wheelTorque: 0.0028, speedBrake: 0.0017,
        tiltTorque: 0.090, terrain: 0.55, crashImpact: 5.4, maxTilt: 1.42,
        subtitle: 'Gentle crests · forgiving recovery'
      },
      medium: {
        label: 'MEDIUM', color: 0xff9d48, colorHex: '#ff9d48', accent: 0xffd49e,
        maxSpeed: 7.05, speedRamp: 0.42, driveForce: 0.0105, wheelTorque: 0.0033, speedBrake: 0.0019,
        tiltTorque: 0.120, terrain: 0.88, crashImpact: 4.6, maxTilt: 1.18,
        subtitle: 'Fast terrain · sharp air control'
      },
      hard: {
        label: 'HARD', color: 0xff5f79, colorHex: '#ff5f79', accent: 0xffb4bf,
        maxSpeed: 7.9, speedRamp: 0.50, driveForce: 0.0120, wheelTorque: 0.0038, speedBrake: 0.0021,
        tiltTorque: 0.160, terrain: 1.23, crashImpact: 3.8, maxTilt: 0.99,
        subtitle: 'Steep rollers · precise landings'
      }
    };

    const Host = {
      post(action, payload = {}) {
        const message = JSON.stringify({ source: 'GameBridge', action, payload });
        try { if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) window.flutter_inappwebview.callHandler('GameBridgeChannel', message); } catch (_) {}
        try { if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) window.FlutterGameBridge.postMessage(message); } catch (_) {}
        try { if (window.parent && window.parent !== window) window.parent.postMessage({ source: 'GameBridge', action, payload }, '*'); } catch (_) {}
      },
      haptic(type = 'light') {
        this.post('haptic', { type });
        try {
          if (navigator.vibrate) navigator.vibrate(type === 'heavy' ? 36 : type === 'medium' ? 18 : 8);
        } catch (_) {}
      }
    };

    class AudioBed {
      constructor() {
        this.enabled = true;
        this.ctx = null;
        this.engineOsc = null;
        this.engineGain = null;
      }
      unlock() {
        if (!this.enabled || this.ctx) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new Ctx();
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.value = 38;
          this.engineGain.gain.value = 0;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 350;
          this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        } catch (_) { this.ctx = null; }
      }
      setEngine(speed, active) {
        if (!this.ctx || !this.engineOsc || !this.engineGain || !this.enabled) return;
        const now = this.ctx.currentTime;
        this.engineOsc.frequency.setTargetAtTime(34 + Math.max(0, speed) * 19, now, 0.06);
        this.engineGain.gain.setTargetAtTime(active ? Math.min(.075, .022 + speed * .010) : 0, now, .10);
      }
      beep(freq = 620, length = .06, type = 'sine', volume = .09) {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = type; osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(.001, now + length);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + length + .01);
        } catch (_) {}
      }
      crash() {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, now); osc.frequency.exponentialRampToValueAtTime(31, now + .42);
          gain.gain.setValueAtTime(.20, now); gain.gain.exponentialRampToValueAtTime(.001, now + .52);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + .54);
        } catch (_) {}
      }
      setEnabled(value) {
        this.enabled = Boolean(value);
        if (!this.enabled && this.engineGain && this.ctx) this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime);
      }
    }

    function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function smoothstep(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
    function modulo(value, divisor) { return ((value % divisor) + divisor) % divisor; }
    function normalizeAngle(angle) {
      let a = angle;
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }
    function rotate(local, angle) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return { x: local.x * c - local.y * s, y: local.x * s + local.y * c };
    }
    function add(a, b) { return { x: a.x + b.x, y: a.y + b.y }; }
    function hex(color) { return '#' + color.toString(16).padStart(6, '0'); }

    class BestScores {
      constructor() { this.key = 'moto-balance-skyline-v1'; }
      dateKey() {
        const d = new Date();
        return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
      }
      weekKey() {
        const d = new Date();
        const utc = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
        const copy = new Date(utc);
        const day = copy.getUTCDay() || 7;
        copy.setUTCDate(copy.getUTCDate() + 4 - day);
        const yearStart = new Date(Date.UTC(copy.getUTCFullYear(), 0, 1));
        const week = Math.ceil((((copy - yearStart) / 86400000) + 1) / 7);
        return copy.getUTCFullYear() + '-W' + String(week).padStart(2, '0');
      }
      read() {
        let scores = { date: this.dateKey(), week: this.weekKey(), today: 0, weekly: 0, allTime: 0 };
        try { scores = Object.assign(scores, JSON.parse(localStorage.getItem(this.key) || '{}')); } catch (_) {}
        const date = this.dateKey(), week = this.weekKey();
        if (scores.date !== date) { scores.date = date; scores.today = 0; }
        if (scores.week !== week) { scores.week = week; scores.weekly = 0; }
        return scores;
      }
      commit(score) {
        const scores = this.read();
        scores.today = Math.max(scores.today || 0, score);
        scores.weekly = Math.max(scores.weekly || 0, score);
        scores.allTime = Math.max(scores.allTime || 0, score);
        try { localStorage.setItem(this.key, JSON.stringify(scores)); } catch (_) {}
        return scores;
      }
    }

    class MotoBalanceScene extends Phaser.Scene {
      constructor() { super({ key: 'MotoBalanceScene' }); }

      preload() {
        // Supplied transparent source sprites, packaged beside this entry point.
        this.load.image('moto-bike-body', 'assets/bike.png');
        this.load.image('moto-tyre', 'assets/tyre.png');
        this.load.image('moto-environment-sheet', 'assets/environment-spritesheet.png');
      }

      create() {
        this.M = Phaser.Physics.Matter.Matter;
        this.audio = new AudioBed();
        this.bestScores = new BestScores();
        this.skyG = this.add.graphics();
        this.skyG.setDepth(0);
        this.g = this.add.graphics();
        this.g.setDepth(2);
        this.textPool = [];
        this.textIndex = 0;
        this.state = 'home';
        this.modeKey = 'medium';
        this.mode = MODES[this.modeKey];
        this.pausedByHost = false;
        this.pointerControls = new Map();
        this.keyLeft = false; this.keyRight = false;
        this.particles = [];
        this.terrainBodies = [];
        this.riderConstraints = [];
        this.bikeConstraints = [];
        this.cameraX = 0;
        this.runStartX = 0;
        this.score = 0;
        this.finalScore = 0;
        this.timeLeft = 60;
        this.countdown = 0;
        this.crashTimer = 0;
        this.shake = 0;
        this.lastWheelContactAt = -1000;
        this.speedTarget = 0;
        this.terrainNoise = 0;
        this.handledEnd = false;

        this.matter.world.engine.positionIterations = 9;
        this.matter.world.engine.velocityIterations = 7;
        this.matter.world.engine.constraintIterations = 4;
        this.matter.world.engine.timing.timeScale = 1;
        this.matter.world.setGravity(0, 1.08);
        this.matter.world.on('collisionstart', this.onCollisionStart, this);
        this.matter.world.on('collisionactive', this.onCollisionActive, this);

        this.createBike();
        this.createBikeVisuals();
        this.createEnvironment();
        this.installInput();
        this.resetWorld();
        this.matter.world.pause();
        this.installHostBridge();
        Host.post('ready', { gameId: GAME_ID, version: VERSION });
      }

      installHostBridge() {
        const clearInputs = () => this.clearInputs();
        window.GameBridge = {
          pause: () => { this.pausedByHost = true; clearInputs(); this.matter.world.pause(); this.audio.setEngine(0, false); },
          resume: () => { this.pausedByHost = false; if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') this.matter.world.resume(); },
          restart: () => this.startSelectedMode(),
          setSoundEnabled: (enabled) => this.audio.setEnabled(enabled)
        };
        window.addEventListener('blur', () => { this.pausedByHost = true; clearInputs(); this.matter.world.pause(); });
        window.addEventListener('focus', () => { if (!document.hidden) { this.pausedByHost = false; if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') this.matter.world.resume(); } });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { this.pausedByHost = true; clearInputs(); this.matter.world.pause(); }
          else if (window.__GAME_ACTIVE__ !== false) { this.pausedByHost = false; if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') this.matter.world.resume(); }
        });
      }

      installInput() {
        const canvas = this.game.canvas;
        const point = (event) => {
          const rect = canvas.getBoundingClientRect();
          return { x: clamp((event.clientX - rect.left) * W / rect.width, 0, W), y: clamp((event.clientY - rect.top) * H / rect.height, 0, H) };
        };
        const down = (event) => {
          event.preventDefault(); this.audio.unlock();
          const p = point(event);
          try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
          this.handlePress(event.pointerId, p.x, p.y);
        };
        const up = (event) => { this.pointerControls.delete(event.pointerId); this.refreshHeldButtons(); };
        canvas.addEventListener('pointerdown', down, { passive: false });
        canvas.addEventListener('pointerup', up, { passive: false });
        canvas.addEventListener('pointercancel', up, { passive: false });
        canvas.addEventListener('pointerleave', (event) => { if (event.buttons === 0) up(event); }, { passive: false });
        window.addEventListener('pointerup', up, { passive: false });
        window.addEventListener('pointercancel', up, { passive: false });
        window.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') { this.keyLeft = true; event.preventDefault(); }
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') { this.keyRight = true; event.preventDefault(); }
          if (event.key === ' ' || event.key === 'Enter') { if (this.state === 'home') this.startSelectedMode(); event.preventDefault(); }
        });
        window.addEventListener('keyup', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') this.keyLeft = false;
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd') this.keyRight = false;
        });
      }

      handlePress(pointerId, x, y) {
        if (this.state === 'playing') {
          if (x > 304 && y < 70) { this.goHome(); return; }
          if (y >= 504) {
            this.pointerControls.set(pointerId, x < W / 2 ? 'left' : 'right');
            this.refreshHeldButtons();
            return;
          }
          return;
        }
        if (this.state === 'countdown') {
          if (x > 304 && y < 70) this.goHome();
          return;
        }
        if (this.state === 'home') {
          if (y >= 295 && y < 410) {
            const selected = x < 120 ? 'easy' : x < 240 ? 'medium' : 'hard';
            this.modeKey = selected; this.mode = MODES[selected]; this.audio.beep(440, .05, 'sine', .06); Host.haptic('light');
            return;
          }
          if (y >= 446 && y <= 526) { this.startSelectedMode(); return; }
        }
        if (this.state === 'gameover') {
          if (y >= 471 && y < 525) { this.startSelectedMode(); return; }
          if (y >= 535 && y < 590) { this.goHome(); return; }
        }
      }

      refreshHeldButtons() {
        this.leftHeld = this.keyLeft || Array.from(this.pointerControls.values()).includes('left');
        this.rightHeld = this.keyRight || Array.from(this.pointerControls.values()).includes('right');
      }

      clearInputs() { this.pointerControls.clear(); this.keyLeft = false; this.keyRight = false; this.leftHeld = false; this.rightHeld = false; }

      createBike() {
        const M = this.M;
        this.bikeGroup = this.matter.world.nextGroup(true);
        const group = this.bikeGroup;
        const sameBike = { group };
        this.chassis = M.Bodies.rectangle(132, 301, 108, 23, {
          label: 'moto-chassis', density: 0.0024, frictionAir: 0.018, restitution: 0.04,
          chamfer: { radius: 7 }, collisionFilter: sameBike
        });
        this.rearWheel = M.Bodies.circle(88, 340, 22, {
          label: 'rear-wheel', density: 0.0026, friction: 0.98, frictionStatic: 1.6,
          frictionAir: 0.006, restitution: 0.02, collisionFilter: sameBike
        });
        this.frontWheel = M.Bodies.circle(177, 340, 22, {
          label: 'front-wheel', density: 0.0026, friction: 0.98, frictionStatic: 1.6,
          frictionAir: 0.006, restitution: 0.02, collisionFilter: sameBike
        });
        [this.chassis, this.rearWheel, this.frontWheel].forEach((body) => { body.plugin.role = body.label; });
        this.matter.world.add([this.chassis, this.rearWheel, this.frontWheel]);

        // A bilateral distance joint can flip a wheel above its mounting point
        // on a downhill. These are physical suspension forces instead: each wheel
        // is kept on its local axle line by spring + damper forces applied to both
        // bodies (at the chassis mount, which also produces real reaction torque).
        this.bikeConstraints = [];

        this.torso = M.Bodies.rectangle(124, 252, 27, 45, {
          label: 'rider-torso', density: 0.0012, frictionAir: 0.028, chamfer: { radius: 10 }, collisionFilter: sameBike
        });
        this.head = M.Bodies.circle(111, 217, 15, { label: 'rider-head', density: 0.0011, frictionAir: 0.02, collisionFilter: sameBike });
        this.rearKnee = M.Bodies.circle(102, 291, 10, { label: 'rider-rear-knee', density: 0.0010, frictionAir: 0.02, collisionFilter: sameBike });
        this.frontKnee = M.Bodies.circle(148, 286, 10, { label: 'rider-front-knee', density: 0.0010, frictionAir: 0.02, collisionFilter: sameBike });
        this.rearHand = M.Bodies.circle(166, 281, 7, { label: 'rider-rear-hand', density: 0.0008, frictionAir: 0.02, collisionFilter: sameBike });
        this.frontHand = M.Bodies.circle(173, 282, 7, { label: 'rider-front-hand', density: 0.0008, frictionAir: 0.02, collisionFilter: sameBike });
        this.riderBodies = [this.torso, this.head, this.rearKnee, this.frontKnee, this.rearHand, this.frontHand];
        this.riderBodies.forEach((body) => { body.plugin.role = body.label; });
        this.matter.world.add(this.riderBodies);
        this.buildRiderConstraints();
      }

      createBikeVisuals() {
        this.usingBikeSprites = this.textures.exists('moto-bike-body') && this.textures.exists('moto-tyre');
        if (!this.usingBikeSprites) return;
        const tyre = () => this.add.image(0, 0, 'moto-tyre').setOrigin(.5).setDisplaySize(51, 51).setDepth(3).setVisible(false);
        this.rearTyreSprite = tyre();
        this.frontTyreSprite = tyre();
        // The supplied body art's axle positions line up with the Matter wheel
        // bodies when this transparent square is displayed at 140px.
        this.bikeBodySprite = this.add.image(0, 0, 'moto-bike-body').setOrigin(.5).setDisplaySize(140, 140).setDepth(4).setVisible(false);
      }

      syncBikeVisuals(visible) {
        if (!this.usingBikeSprites) return;
        this.rearTyreSprite.setVisible(visible);
        this.frontTyreSprite.setVisible(visible);
        this.bikeBodySprite.setVisible(visible);
        if (!visible) return;
        const rear = this.worldPoint(this.rearWheel);
        const front = this.worldPoint(this.frontWheel);
        this.rearTyreSprite.setPosition(rear.x, rear.y).setRotation(this.rearWheel.angle);
        this.frontTyreSprite.setPosition(front.x, front.y).setRotation(this.frontWheel.angle);
        const visualOffset = rotate({ x: 0, y: 5.5 }, this.chassis.angle);
        this.bikeBodySprite
          .setPosition(this.sx(this.chassis.position.x + visualOffset.x), this.chassis.position.y + visualOffset.y)
          .setRotation(this.chassis.angle);
      }

      createEnvironment() {
        const sourceTexture = this.textures.get('moto-environment-sheet');
        const source = sourceTexture && sourceTexture.getSourceImage();
        this.environmentLayers = [];
        this.environmentClouds = [];
        if (!source) return;

        // Each range is cropped from the supplied sheet once, then tile-scrolled
        // forever. Every layer moves left with the road, at its own depth speed.
        const layers = [
          { key: 'env-far-range', x: 16, y: 8, w: 950, h: 143, screenY: 239, scale: .73, speed: .055, alpha: .77 },
          { key: 'env-mid-range', x: 16, y: 164, w: 950, h: 116, screenY: 284, scale: .84, speed: .105, alpha: .88 },
          { key: 'env-deep-range', x: 16, y: 283, w: 950, h: 120, screenY: 319, scale: .80, speed: .165, alpha: .95 },
          { key: 'env-green-range', x: 16, y: 410, w: 950, h: 111, screenY: 337, scale: .68, speed: .220, alpha: 1 },
          { key: 'env-forest-range', x: 16, y: 535, w: 950, h: 98, screenY: 353, scale: .57, speed: .285, alpha: 1 }
        ];
        const crop = (layer) => {
          const texture = this.textures.createCanvas(layer.key, layer.w, layer.h);
          texture.context.clearRect(0, 0, layer.w, layer.h);
          texture.context.drawImage(source, layer.x, layer.y, layer.w, layer.h, 0, 0, layer.w, layer.h);
          texture.refresh();
          const tile = this.add.tileSprite(W / 2, layer.screenY, W + 6, layer.h * layer.scale, layer.key)
            .setOrigin(.5).setDepth(1).setAlpha(layer.alpha);
          tile.tileScaleX = layer.scale;
          tile.tileScaleY = layer.scale;
          return { tile, speed: layer.speed };
        };
        this.environmentLayers = layers.map(crop);

        const makeCloud = (key, x, y, w, h, width, height, start, speed, screenY, alpha = 1) => {
          const texture = this.textures.createCanvas(key, w, h);
          texture.context.clearRect(0, 0, w, h);
          texture.context.drawImage(source, x, y, w, h, 0, 0, w, h);
          texture.refresh();
          const image = this.add.image(0, screenY, key).setOrigin(.5).setDisplaySize(width, height).setDepth(1).setAlpha(alpha);
          return { image, start, speed, width };
        };
        this.environmentClouds = [
          makeCloud('env-cloud-large', 976, 452, 250, 144, 124, 71, 74, .028, 126, .84),
          makeCloud('env-cloud-small', 1200, 472, 240, 103, 96, 41, 312, .041, 187, .72),
          makeCloud('env-cloud-low', 979, 595, 245, 94, 112, 43, 208, .034, 222, .64)
        ];
        this.updateEnvironment();
      }

      updateEnvironment() {
        if (!this.environmentLayers) return;
        for (const layer of this.environmentLayers) layer.tile.tilePositionX = this.cameraX * layer.speed;
        for (const cloud of this.environmentClouds) {
          cloud.image.x = modulo(cloud.start - this.cameraX * cloud.speed, W + cloud.width * 2) - cloud.width;
        }
      }

      buildRiderConstraints() {
        if (this.riderConstraints.length) this.matter.world.remove(this.riderConstraints);
        const c = (a, pointA, b, pointB, length, stiffness, damping) => this.makeConstraint(a, pointA, b, pointB, length, stiffness, damping);
        this.riderConstraints = [
          c(this.chassis, { x: -11, y: -10 }, this.torso, { x: 0, y: 17 }, 28, 0.54, 0.16),
          c(this.chassis, { x: 6, y: -9 }, this.torso, { x: 0, y: 17 }, 31, 0.42, 0.15),
          c(this.torso, { x: -5, y: -21 }, this.head, { x: 0, y: 10 }, 13, 0.48, 0.14),
          c(this.torso, { x: -4, y: 17 }, this.rearKnee, { x: 0, y: 0 }, 29, 0.34, 0.14),
          c(this.rearKnee, { x: 0, y: 0 }, this.chassis, { x: -37, y: 4 }, 25, 0.34, 0.12),
          c(this.torso, { x: 8, y: 15 }, this.frontKnee, { x: 0, y: 0 }, 29, 0.34, 0.14),
          c(this.frontKnee, { x: 0, y: 0 }, this.chassis, { x: 28, y: 3 }, 25, 0.34, 0.12),
          c(this.torso, { x: 10, y: -12 }, this.rearHand, { x: 0, y: 0 }, 52, 0.30, 0.12),
          c(this.rearHand, { x: 0, y: 0 }, this.chassis, { x: 48, y: -14 }, 18, 0.44, 0.15),

      renderHud(g) {
        const time = String(Math.max(0, Math.ceil(this.timeLeft))).padStart(2, '0');
        g.fillStyle(0x071827, .35); g.fillCircle(180, 50, 31); g.lineStyle(1.4, 0xffffff, .36); g.strokeCircle(180, 50, 31);
        this.fillText(time, 180, 52, 31, 0xffffff, '900');
        this.fillText('SECONDS', 180, 78, 8, 0xe3f5f7, '700');
        g.fillStyle(0x09121c, .82); g.fillRoundedRect(269, 159, 78, 44, 20); g.lineStyle(1.5, this.mode.color, .9); g.strokeRoundedRect(269, 159, 78, 44, 20);
        this.fillText(String(this.score), 309, 179, 22, 0xffffff, '900'); this.fillText('DIST', 309, 196, 7, this.mode.accent, '800');
        g.fillStyle(0xffffff, .92); g.fillCircle(329, 40, 17); g.lineStyle(3, 0x698896, .9); g.lineBetween(323, 34, 335, 46); g.lineBetween(335, 34, 323, 46);
        g.fillStyle(0x08212c, .66); g.fillRoundedRect(14, 125, 104, 24, 12); this.fillText(this.mode.label + ' MODE', 66, 137, 9, this.mode.accent, '900');
      }

      renderControls(g) {
        const y = 520, h = 102, gap = 28, w = (W - gap * 3) / 2;
        const buttons = [{ left: true, x: gap, held: this.leftHeld }, { left: false, x: gap * 2 + w, held: this.rightHeld }];
        for (const button of buttons) {
          const color = button.left ? 0x1aaec5 : 0xff765b;
          const alpha = button.held ? 1 : .82;
          g.fillStyle(0x071827, .66); g.fillRoundedRect(button.x, y, w, h, 24);
          g.lineStyle(button.held ? 3 : 1.5, color, button.held ? 1 : .7); g.strokeRoundedRect(button.x, y, w, h, 24);
          const cx = button.x + w / 2, cy = y + 43;
          if (button.held) { g.fillStyle(color, .23); g.fillCircle(cx, cy, 37); }
          g.fillStyle(color, alpha); g.fillCircle(cx, cy, 27); g.lineStyle(2, 0xffffff, .72); g.strokeCircle(cx, cy, 27);
          g.fillStyle(0xffffff, 1); const s = button.left ? 1 : -1;
          g.beginPath(); g.moveTo(cx + s * 9, cy - 13); g.lineTo(cx - s * 11, cy); g.lineTo(cx + s * 9, cy + 13); g.closePath(); g.fillPath();
          this.fillText(button.left ? 'TILT BACK' : 'TILT FORWARD', cx, y + 80, 7, button.held ? 0xffffff : 0xb9d7df, '800');
        }
      }

      renderHome(g) {
        g.fillStyle(0x061724, .46); g.fillRect(0, 0, W, H);
        g.fillStyle(0x06131c, .64); g.fillRoundedRect(19, 66, 322, 497, 28); g.lineStyle(1.5, 0x92e8f1, .42); g.strokeRoundedRect(19, 66, 322, 497, 28);
        g.fillStyle(0x19c9d4, .18); g.fillCircle(65, 105, 48); g.fillStyle(0xff9d48, .17); g.fillCircle(302, 170, 64);
        this.fillText('MOTO', 180, 127, 34, 0xffffff, '900'); this.fillText('BALANCE', 180, 163, 34, 0x72e2ee, '900');
        this.fillText('SKYLINE RUN', 180, 193, 11, 0xffc35c, '900');
        this.fillText('60 seconds. One connected machine.', 180, 228, 12, 0xd8eef0, '700');
        this.fillText('Hold the arrows to balance real momentum.', 180, 246, 10, 0x8eb7c0, '600');
        this.fillText('CHOOSE YOUR RIDE', 180, 281, 10, 0x9dc8d1, '900');
        const keys = ['easy', 'medium', 'hard'];
        keys.forEach((key, i) => {
          const mode = MODES[key], x = 25 + i * 106, selected = this.modeKey === key;
          g.fillStyle(selected ? mode.color : 0x0c2532, selected ? .92 : .84); g.fillRoundedRect(x, 299, 98, 95, 17);
          g.lineStyle(selected ? 2.7 : 1.1, selected ? 0xffffff : 0x4c7b89, selected ? .9 : .55); g.strokeRoundedRect(x, 299, 98, 95, 17);
          this.fillText(mode.label, x + 49, 325, 12, selected ? 0xffffff : mode.accent, '900');
          this.fillText(i === 0 ? 'CALM' : i === 1 ? 'TRUE' : 'WILD', x + 49, 347, 8, selected ? 0xffffff : 0xa7c8d0, '800');
          for (let bar = 0; bar < 3; bar++) { g.fillStyle(bar <= i ? mode.color : 0x2b4751, .95); g.fillRoundedRect(x + 25 + bar * 17, 367, 12, 5, 3); }
        });
        const selectedMode = this.mode;
        this.fillText(selectedMode.subtitle, 180, 419, 10, selectedMode.accent, '700');
        g.fillStyle(selectedMode.color, 1); g.fillRoundedRect(39, 453, 282, 65, 20); g.lineStyle(2, 0xffffff, .58); g.strokeRoundedRect(39, 453, 282, 65, 20);
        this.fillText('START RUN  ▶', 180, 480, 19, 0xffffff, '900'); this.fillText('REAL PHYSICS · 60 SECONDS', 180, 503, 8, 0xefffff, '800');
        this.fillText('Ride centered while the mountain comes to you.', 180, 542, 9, 0x9bbbc4, '600');
      }

      renderCountdown(g) {
        g.fillStyle(0x06121d, .28); g.fillRect(0, 0, W, H);
        const value = this.countdown > 1.6 ? '3' : this.countdown > .8 ? '2' : this.countdown > .15 ? '1' : 'GO!';
        g.fillStyle(0x061827, .76); g.fillCircle(180, 242, 66); g.lineStyle(3, this.mode.color, 1); g.strokeCircle(180, 242, 66);
        this.fillText(value, 180, 245, value === 'GO!' ? 34 : 64, 0xffffff, '900'); this.fillText(this.mode.label + ' MODE', 180, 323, 12, this.mode.accent, '900');
      }

      renderGameOver(g) {
        g.fillStyle(0x03101a, .69); g.fillRect(0, 0, W, H);
        const best = this.best || this.bestScores.read();
        g.fillStyle(0x071d2a, .97); g.fillRoundedRect(25, 116, 310, 458, 27); g.lineStyle(2, this.mode.color, .9); g.strokeRoundedRect(25, 116, 310, 458, 27);
        this.fillText(this.finalScore >= best.allTime && this.finalScore > 0 ? 'NEW SKYLINE BEST' : 'RUN COMPLETE', 180, 153, 12, this.mode.accent, '900');
        this.fillText('GAME OVER', 180, 188, 29, 0xffffff, '900');
        g.fillStyle(this.mode.color, .18); g.fillCircle(180, 259, 55); g.lineStyle(2, this.mode.color, .8); g.strokeCircle(180, 259, 55);
        this.fillText(String(this.finalScore), 180, 253, 42, 0xffffff, '900'); this.fillText('DISTANCE', 180, 288, 9, this.mode.accent, '900');
        this.fillText(this.mode.label + ' MODE', 180, 322, 10, 0xd2ebef, '800');
        const rows = [['TODAY’S BEST', best.today], ['THIS WEEK', best.weekly], ['ALL-TIME BEST', best.allTime]];
        rows.forEach((row, i) => {
          const y = 360 + i * 38; g.fillStyle(0x0e2a38, .82); g.fillRoundedRect(47, y - 15, 266, 30, 10);
          this.fillText(row[0], 65, y, 9, 0xa8c6cf, '800', 'left'); this.fillText(String(row[1]), 294, y, 15, 0xffffff, '900', 'right');
        });
        g.fillStyle(this.mode.color, 1); g.fillRoundedRect(48, 471, 264, 53, 17); this.fillText('RIDE AGAIN  ▶', 180, 497, 16, 0xffffff, '900');
        g.fillStyle(0x153747, 1); g.fillRoundedRect(48, 535, 264, 39, 15); this.fillText('CHANGE MODE', 180, 555, 12, 0xd9eef1, '900');
      }

      render() {
        this.skyG.clear(); this.renderSky(this.skyG); this.updateEnvironment();
        this.g.clear(); this.textIndex = 0;
        const g = this.g;
        const shakeX = this.shake ? (Math.random() - .5) * this.shake : 0;
        if (shakeX) g.x = shakeX; else g.x = 0;
        this.renderWorld(g);
        const showBikeSprites = this.state === 'countdown' || this.state === 'playing' || this.state === 'crashing';
        if (this.usingBikeSprites) this.syncBikeVisuals(showBikeSprites); else this.drawBike();
        this.renderParticles(g);
        if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') { this.renderHud(g); this.renderControls(g); }
        if (this.state === 'home') this.renderHome(g);
        if (this.state === 'countdown') this.renderCountdown(g);
        if (this.state === 'gameover') this.renderGameOver(g);
        if (this.pausedByHost && (this.state === 'playing' || this.state === 'countdown')) { g.fillStyle(0x03101a, .55); g.fillRect(0, 0, W, H); this.fillText('PAUSED', 180, 316, 24, 0xffffff, '900'); }
        if (shakeX) g.x = 0;
        for (let i = this.textIndex; i < this.textPool.length; i++) this.textPool[i].setVisible(false);
      }
    }

    const nativeHost = Boolean(window.NativeBridge || window.FlutterGameBridge || window.flutter_inappwebview);
    if (nativeHost) document.documentElement.classList.add('native-host');
    if (!window.Phaser) {
      document.getElementById('game-root').innerHTML = '<div style="color:#fff;padding:24px;text-align:center">Unable to load the game engine. Please reconnect and try again.</div>';
      return;
    }
    window.__MOTO_BALANCE_GAME__ = new Phaser.Game({
      type: Phaser.CANVAS,
      parent: 'game-root',
      width: W,
      height: H,
      transparent: false,
      backgroundColor: '#55c9ee',
      banner: false,
      render: { antialias: true, pixelArt: false, roundPixels: false },
      physics: { default: 'matter', matter: { gravity: { y: 1.08 }, enableSleeping: false, debug: false } },
      scene: [MotoBalanceScene]
    });
  })();
  </script>
</body>
</html>
