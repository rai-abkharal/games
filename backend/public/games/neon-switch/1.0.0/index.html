<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Switch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050816}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:min(100vw,56.25vh);height:min(177.78vw,100vh);background:#050816}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(() => {
'use strict';
const W=360,H=640, DPR=Math.min(devicePixelRatio||1,2);
const canvas=document.createElement('canvas');
canvas.width=W*DPR; canvas.height=H*DPR;
document.getElementById('game-container').appendChild(canvas);
const ctx=canvas.getContext('2d');
ctx.scale(DPR,DPR);

const laneX=[90,180,270];
let score=0,best=Number(localStorage.getItem('neon-switch-best')||0);
let lane=1,targetX=180,over=false,start=performance.now(),last=start;
let orbs=[],particles=[],stars=[];
let intro=1200, shake=0, combo=0, muted=false;

for(let i=0;i<55;i++) stars.push({
 x:Math.random()*W,y:40+Math.random()*(H-80),r:.5+Math.random()*1.5,
 a:.08+Math.random()*.3,s:10+Math.random()*30
});

function bridgeCall(name,...args){
 try{
  window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');
  if(window.GameBridge&&typeof window.GameBridge[name]==='function') window.GameBridge[name](...args);
 }catch(e){}
}
bridgeCall('sendReady');

function audio(freq,dur,type='sine'){
 if(muted)return;
 try{
  const A=audio.ctx||(audio.ctx=new (window.AudioContext||window.webkitAudioContext)());
  const o=A.createOscillator(),g=A.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.035,A.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);
  o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
 }catch(e){}
}
function burst(x,y,n=10,color='#00eaff'){
 for(let i=0;i<n;i++){
  const a=Math.random()*Math.PI*2,s=40+Math.random()*130;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45,max:.45,size:1+Math.random()*3,color});
 }
}
function switchLane(){
 if(over){reset();return}
 lane=lane===0?1:lane===2?1:(Math.random()<.5?0:2);
 targetX=laneX[lane]; audio(520,.07,'square'); burst(targetX,H-100,8);
}
function spawn(){
 if(over)return;
 const l=Math.floor(Math.random()*3);
 orbs.push({x:laneX[l],y:-30,lane:l,s:190+Math.random()*45,counted:false,r:15});
}
function reset(){
 score=0;combo=0;lane=1;targetX=180;orbs=[];particles=[];over=false;start=performance.now();intro=900;shake=0;
}
function end(){
 if(over)return;
 over=true;shake=.3;audio(90,.2,'sawtooth');burst(targetX,H-100,28,'#ff3d81');
 if(score>best){best=score;localStorage.setItem('neon-switch-best',best)}
 bridgeCall('sendGameOver',score,1,Math.round(performance.now()-start));
}
function resize(){
 const maxW=Math.min(innerWidth,innerHeight*W/H),maxH=Math.min(innerHeight,innerWidth*H/W);
 canvas.style.width=maxW+'px';canvas.style.height=maxH+'px';
}
addEventListener('resize',resize);resize();
addEventListener('pointerdown',e=>{e.preventDefault();switchLane()},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter')switchLane()});
addEventListener('blur',()=>bridgeCall('onPause'));
document.addEventListener('visibilitychange',()=>bridgeCall(document.hidden?'onPause':'onResume'));

let spawnAt=0;
function drawGlowCircle(x,y,r,color,alpha){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,color.replace(')',','+alpha+')').replace('rgb','rgba'));
 g.addColorStop(1,'rgba(0,0,0,0)');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function frame(t){
 const dt=Math.min(.033,(t-last)/1000);last=t;
 ctx.save();
 if(shake>0){ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);shake-=dt}
 const bg=ctx.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#050816');bg.addColorStop(.55,'#0b1030');bg.addColorStop(1,'#050816');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 for(const s of stars){
  s.y+=s.s*dt;if(s.y>H)s.y=45;
  ctx.globalAlpha=s.a*(.7+.3*Math.sin(t/500+s.x));
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 for(const x of laneX){
  ctx.fillStyle='rgba(102,234,255,.08)';ctx.fillRect(x-1,70,2,H-175);
  ctx.fillStyle='rgba(102,234,255,.16)';ctx.fillRect(x-21,H-106,42,2);
 }

 if(!over){
  const diff=Math.min(1.8,1+(t-start)/30000);
  if(t>spawnAt){spawn();spawnAt=t+(650+Math.max(0,300-(t-start)/100)*Math.random());}
  targetX+=(laneX[lane]-targetX)*.22;

  for(let i=orbs.length-1;i>=0;i--){
   const o=orbs[i];o.y+=o.s*diff*dt;
   const pulse=1+.12*Math.sin(t/160);
   const grd=ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,42*pulse);
   grd.addColorStop(0,'rgba(255,61,129,.3)');grd.addColorStop(1,'rgba(255,61,129,0)');
   ctx.fillStyle=grd;ctx.beginPath();ctx.arc(o.x,o.y,42*pulse,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='#ff3d81';ctx.lineWidth=4;ctx.beginPath();ctx.arc(o.x,o.y,23,(t/500)%6.28,(t/500)+5.1);ctx.stroke();
   ctx.fillStyle='#ff3d81';ctx.beginPath();ctx.arc(o.x,o.y,15,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(o.x-5,o.y-5,5,0,Math.PI*2);ctx.fill();

   const dx=o.x-targetX,dy=o.y-(H-100);
   if(Math.hypot(dx,dy)<30){end();break}
   if(!o.counted&&o.y>H-115){
    o.counted=true;score++;combo++;bridgeCall('sendScoreUpdated',score,1);audio(680,.045);
    burst(o.x,o.y,10,'#00eaff');
   }
   if(o.y>H+60)orbs.splice(i,1);
  }
 }

 // player
 const py=H-100+Math.sin(t/400)*5;
 const glow=ctx.createRadialGradient(targetX,py,0,targetX,py,34);
 glow.addColorStop(0,'rgba(0,234,255,.35)');glow.addColorStop(1,'rgba(0,234,255,0)');
 ctx.fillStyle=glow;ctx.beginPath();ctx.arc(targetX,py,34,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#00eaff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(targetX,py,19,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(targetX,py,10,0,Math.PI*2);ctx.fill();

 for(let i=particles.length-1;i>=0;i--){
  const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=80*dt;
  if(p.life<=0){particles.splice(i,1);continue}
  ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;

 ctx.textAlign='center';ctx.font='bold 42px Arial Black,Arial';ctx.fillStyle='#fff';ctx.shadowColor='#00eaff';ctx.shadowBlur=12;ctx.fillText(score,W/2,48);ctx.shadowBlur=0;
 ctx.textAlign='left';ctx.font='12px Arial';ctx.fillStyle='#9fb5ff';ctx.fillText('BEST '+best,16,24);
 ctx.textAlign='right';ctx.fillStyle='#ffe66d';ctx.font='bold 13px Arial';if(combo>=3)ctx.fillText('COMBO ×'+combo,W-16,24);

 if(intro>0&&!over){
  intro-=dt*1000;ctx.fillStyle='rgba(2,3,12,.2)';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';ctx.font='bold 29px Arial Black,Arial';ctx.fillStyle='#fff';ctx.shadowColor='#7a5cff';ctx.shadowBlur=12;
  ctx.fillText('TAP TO',W/2,H*.39);ctx.fillText('SWITCH',W/2,H*.39+34);ctx.shadowBlur=0;
  ctx.font='11px Arial';ctx.fillStyle='#7defff';ctx.fillText('DODGE THE NEON ORBS',W/2,H*.52);
 }

 if(over){
  ctx.fillStyle='rgba(2,3,12,.76)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#101536';ctx.fillRect(37,H/2-128,286,255);
  ctx.strokeStyle='rgba(94,114,255,.7)';ctx.lineWidth=2;ctx.strokeRect(37,H/2-128,286,255);
  ctx.textAlign='center';ctx.font='bold 28px Arial Black,Arial';ctx.fillStyle='#fff';ctx.fillText('RUN OVER',W/2,H/2-65);
  ctx.font='bold 48px Arial Black,Arial';ctx.fillStyle='#00eaff';ctx.fillText(score,W/2,H/2-10);
  ctx.font='14px Arial';ctx.fillStyle='#b7c5ff';ctx.fillText('BEST  '+best,W/2,H/2+38);
  ctx.fillStyle='#5e72ff';ctx.fillRect(85,H/2+57,190,48);
  ctx.font='bold 13px Arial Black,Arial';ctx.fillStyle='#fff';ctx.fillText('TAP TO RETRY',W/2,H/2+87);
 }
 ctx.restore();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
