<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Color Maze Paint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF7EE;
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    'use strict';

    // 1. VIBRANT LEVEL COLOR PALETTES
    const LEVEL_COLORS = [
      { id: 'cyan', hex: '#22D3EE', darkHex: '#0891B2', name: 'Cyan Glow' },
      { id: 'rose', hex: '#F43F5E', darkHex: '#BE123C', name: 'Rose Red' },
      { id: 'blue', hex: '#3B82F6', darkHex: '#1D4ED8', name: 'Royal Blue' },
      { id: 'magenta', hex: '#EC4899', darkHex: '#BE185D', name: 'Berry Magenta' },
      { id: 'emerald', hex: '#10B981', darkHex: '#047857', name: 'Vibrant Emerald' },
      { id: 'purple', hex: '#8B5CF6', darkHex: '#6D28D9', name: 'Deep Violet' },
      { id: 'amber', hex: '#F59E0B', darkHex: '#B45309', name: 'Amber Gold' },
      { id: 'orange', hex: '#FB923C', darkHex: '#C2410C', name: 'Sunset Coral' },
      { id: 'lime', hex: '#84CC16', darkHex: '#4D7C0F', name: 'Electric Lime' },
      { id: 'teal', hex: '#14B8A6', darkHex: '#0F766E', name: 'Ocean Teal' }
    ];

    // 2. PSEUDO-RANDOM NUMBER GENERATOR (Deterministic Seed for Endless Unique Levels)
    class SeededRNG {
      constructor(seed) {
        this.s = seed % 2147483647;
        if (this.s <= 0) this.s += 2147483646;
      }
      next() {
        this.s = (this.s * 16807) % 2147483647;
        return (this.s - 1) / 2147483646;
      }
      range(min, max) {
        return min + Math.floor(this.next() * (max - min + 1));
      }
    }

    // 3. INFINITE PROCEDURAL SOLVABLE MAZE GENERATOR ENGINE
    class LevelEngine {
      static solveMaze(grid, startR, startC) {
        const rows = grid.length;
        const cols = grid[0].length;
        let totalPlayable = 0;
        const tileIndices = {};
        let idx = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r][c] === 1) {
              totalPlayable++;
              tileIndices[r + ',' + c] = idx++;
            }
          }
        }
        if (totalPlayable === 0) return { solvable: false, totalPlayable: 0 };

        const initialMask = 1n << BigInt(tileIndices[startR + ',' + startC]);
        const startState = { r: startR, c: startC, mask: initialMask };
        const visited = new Set();
        visited.add(startR + ',' + startC + ':' + initialMask.toString());

        const queue = [startState];
        const targetMask = (1n << BigInt(totalPlayable)) - 1n;
        const dirs = [
          { dr: -1, dc: 0 },
          { dr: 1, dc: 0 },
          { dr: 0, dc: -1 },
          { dr: 0, dc: 1 }
        ];

        while (queue.length > 0) {
          const { r, c, mask } = queue.shift();
          if (mask === targetMask) return { solvable: true, totalPlayable };

          for (const dir of dirs) {
            let currR = r;
            let currC = c;
            let nextMask = mask;
            let steps = 0;

            while (true) {
              const nr = currR + dir.dr;
              const nc = currC + dir.dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc] === 1) {
                currR = nr;
                currC = nc;
                steps++;
                const bitIdx = tileIndices[currR + ',' + currC];
                nextMask |= (1n << BigInt(bitIdx));
              } else {
                break;
              }
            }

            if (steps > 0) {
              const stateKey = currR + ',' + currC + ':' + nextMask.toString();
              if (!visited.has(stateKey)) {
                visited.add(stateKey);
                queue.push({ r: currR, c: currC, mask: nextMask });
              }
            }
          }
        }
        return { solvable: false, totalPlayable };
      }

      static generateLevel(difficulty, levelIndex) {
        // Difficulty parameters:
        // EASY: 6x5 to 6x6, 14-22 tiles
        // MEDIUM: 7x6 to 7x7, 22-34 tiles
        // HARD: 8x7 to 9x8, 34-52 tiles
        let minRows = 5, maxRows = 6, minCols = 5, maxCols = 6, minTurns = 10, maxTurns = 18, minTiles = 14;
        if (difficulty === 'medium') {
          minRows = 6; maxRows = 7; minCols = 6; maxCols = 7; minTurns = 18; maxTurns = 30; minTiles = 22;
        } else if (difficulty === 'hard') {
          minRows = 7; maxRows = 8; minCols = 7; maxCols = 8; minTurns = 28; maxTurns = 46; minTiles = 32;
        }

        const baseSeed = (difficulty === 'easy' ? 10000 : (difficulty === 'medium' ? 40000 : 80000)) + levelIndex * 37 + 11;
        const rng = new SeededRNG(baseSeed);

        for (let attempt = 0; attempt < 1200; attempt++) {
          const rows = rng.range(minRows, maxRows);
          const cols = rng.range(minCols, maxCols);
          const grid = Array(rows).fill(null).map(() => Array(cols).fill(0));

          let r = rng.range(1, rows - 2);
          let c = rng.range(1, cols - 2);
          const startR = r;
          const startC = c;
          grid[r][c] = 1;

          let prevDir = null;
          const turns = rng.range(minTurns, maxTurns);
          const dirs = [
            { dr: -1, dc: 0 },
            { dr: 1, dc: 0 },
            { dr: 0, dc: -1 },
            { dr: 0, dc: 1 }
          ];

          for (let t = 0; t < turns; t++) {
            const validDirs = dirs.filter(d => {
              if (!prevDir) return true;
              return d.dr !== prevDir.dr && d.dc !== prevDir.dc && (d.dr !== -prevDir.dr || d.dc !== -prevDir.dc);
            });
            const dir = validDirs[Math.floor(rng.next() * validDirs.length)];
            const maxDist = (dir.dr !== 0)
              ? (dir.dr > 0 ? rows - 1 - r : r)
              : (dir.dc > 0 ? cols - 1 - c : c);

            if (maxDist < 1) continue;
            const dist = 1 + Math.floor(rng.next() * Math.min(maxDist, 4));

            for (let s = 1; s <= dist; s++) {
              r += dir.dr;
              c += dir.dc;
              grid[r][c] = 1;
            }
            prevDir = dir;
          }

          const res = this.solveMaze(grid, startR, startC);
          if (res.solvable && res.totalPlayable >= minTiles) {
            return {
              grid,
              startR,
              startC,
              colorIdx: (levelIndex) % LEVEL_COLORS.length
            };
          }
        }

        // High-Quality Fallback (Guaranteed Solvable S-Corridor)
        const fallbackRows = minRows;
        const fallbackCols = minCols;
        const fallbackGrid = Array(fallbackRows).fill(null).map(() => Array(fallbackCols).fill(0));
        for (let rr = 0; rr < fallbackRows; rr++) {
          for (let cc = 0; cc < fallbackCols; cc++) {
            if (rr % 2 === 0) fallbackGrid[rr][cc] = 1;
            else if (rr % 4 === 1 && cc === fallbackCols - 1) fallbackGrid[rr][cc] = 1;
            else if (rr % 4 === 3 && cc === 0) fallbackGrid[rr][cc] = 1;
          }
        }
        return {
          grid: fallbackGrid,
          startR: 0,
          startC: 0,
          colorIdx: (levelIndex) % LEVEL_COLORS.length
        };
      }
    }

    // 4. AUDIO SYNTHESIZER
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playRoll() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(340, t);
        osc.frequency.exponentialRampToValueAtTime(220, t + 0.12);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }

      playPaintTile() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540 + Math.random() * 80, t);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }

      playImpact() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.09);
        gain.gain.setValueAtTime(0.22, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.10);
      }

      playWinFanfare() {
        if (this.muted || !this.ctx) return;
        this.init();
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.07;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.22, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.40);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.41);
        });
      }

      playTap() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(560, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      }
    }

    // 5. HOST PLATFORM BRIDGE
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const msg = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', msg);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(msg);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      }
    };

    // 6. INTELLIGENT SOLVER / HINT SYSTEM (BFS Solver)
    class MazeSolver {
      static solveNextStep(grid, startR, startC, paintedMatrix) {
        const rows = grid.length;
        const cols = grid[0].length;
        const dirs = [
          { dr: -1, dc: 0, name: 'UP' },
          { dr: 1, dc: 0, name: 'DOWN' },
          { dr: 0, dc: -1, name: 'LEFT' },
          { dr: 0, dc: 1, name: 'RIGHT' }
        ];

        for (const dir of dirs) {
          let r = startR;
          let c = startC;
          let newTiles = 0;

          while (true) {
            const nextR = r + dir.dr;
            const nextC = c + dir.dc;

            if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols && grid[nextR][nextC] === 1) {
              r = nextR;
              c = nextC;
              if (!paintedMatrix[r][c]) newTiles++;
            } else {
              break;
            }
          }

          if ((r !== startR || c !== startC) && newTiles > 0) {
            return dir;
          }
        }

        for (const dir of dirs) {
          const nextR = startR + dir.dr;
          const nextC = startC + dir.dc;
          if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols && grid[nextR][nextC] === 1) {
            return dir;
          }
        }

        return null;
      }
    }

    // 7. MAIN COLOR MAZE PAINT GAME ENGINE
    class ColorMazeGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.synth = new SoundSynth();

        this.difficulty = this.loadDifficulty(); // 'easy', 'medium', 'hard'
        this.levelIndex = this.loadLevelIndex(this.difficulty); // starts at 0 (Level 1)
        this.hints = 1;

        this.state = 'IDLE'; // 'IDLE', 'MOVING', 'GREAT_ANIMATION', 'MODE_SELECT'
        this.toast = null;

        // 3D Marble Ball with Dynamic Squash & Stretch
        this.ball = {
          r: 0,
          c: 0,
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          targetR: 0,
          targetC: 0,
          radius: 18,
          speed: 880, // px/s
          scaleX: 1.0,
          scaleY: 1.0
        };

        this.grid = [];
        this.painted = [];
        this.totalPlayableTiles = 0;
        this.paintedCount = 0;
        this.colorObj = LEVEL_COLORS[0];

        this.splats = [];
        this.stars = []; // Star sparkles along rolling trail
        this.confetti = [];
        this.greatAnimTimer = 0;
        this.rippleRadius = 0;
        this.hintArrow = null;

        this.initLayout();
        this.bindEvents();
        this.loadLevel(this.levelIndex);

        requestAnimationFrame((t) => this.loop(t));
      }

      loadDifficulty() {
        try {
          const d = localStorage.getItem('cmp_difficulty');
          return d || 'easy';
        } catch (e) {
          return 'easy';
        }
      }

      saveDifficulty(diff) {
        this.difficulty = diff;
        try {
          localStorage.setItem('cmp_difficulty', diff);
        } catch (e) {}
      }

      loadLevelIndex(diff) {
        try {
          const v = localStorage.getItem('cmp_lvl_' + diff);
          return v !== null ? (parseInt(v) || 0) : 0;
        } catch (e) {
          return 0;
        }
      }

      saveLevelIndex() {
        try {
          localStorage.setItem('cmp_lvl_' + this.difficulty, this.levelIndex.toString());
        } catch (e) {}
      }

      loadLevel(idx) {
        this.levelIndex = idx;
        this.saveLevelIndex();

        // Generate procedural 100% solvable level (Endless, Zero Repetition!)
        const lvlData = LevelEngine.generateLevel(this.difficulty, this.levelIndex);

        this.rows = lvlData.grid.length;
        this.cols = lvlData.grid[0].length;

        this.grid = Array(this.rows).fill(null).map(() => Array(this.cols).fill(0));
        this.painted = Array(this.rows).fill(null).map(() => Array(this.cols).fill(false));
        this.totalPlayableTiles = 0;

        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (lvlData.grid[r][c] === 1) {
              this.grid[r][c] = 1; // Strict normalization to 1 ensures zero stuck bugs!
              this.totalPlayableTiles++;
            }
          }
        }

        const startR = lvlData.startR || 0;
        const startC = lvlData.startC || 0;

        this.ball.r = startR;
        this.ball.c = startC;
        this.ball.targetR = startR;
        this.ball.targetC = startC;
        this.ball.scaleX = 1.0;
        this.ball.scaleY = 1.0;

        this.painted[startR][startC] = true;
        this.paintedCount = 1;

        this.colorObj = LEVEL_COLORS[(lvlData.colorIdx) % LEVEL_COLORS.length];

        this.splats = [];
        this.stars = [];
        this.confetti = [];
        this.greatAnimTimer = 0;
        this.rippleRadius = 0;
        this.hintArrow = null;
        this.state = 'IDLE';

        this.initLayout();
        Host.post('onGameStarted', { level: this.levelIndex + 1, difficulty: this.difficulty });
      }

      initLayout() {
        const dpr = window.devicePixelRatio || 1;
        this.dpr = dpr;
        this.width = window.innerWidth || 360;
        this.height = window.innerHeight || 640;
        this.canvas.width = Math.round(this.width * dpr);
        this.canvas.height = Math.round(this.height * dpr);

        this.headerY = 44;

        const availW = Math.min(330, this.width - 48);
        const availH = Math.min(360, this.height - 230);

        this.tileSize = Math.floor(Math.min(availW / this.cols, availH / this.rows, 50));
        this.boardW = this.cols * this.tileSize;
        this.boardH = this.rows * this.tileSize;

        this.boardX = Math.round((this.width - this.boardW) / 2);
        this.boardY = Math.round((this.height - this.boardH) / 2 - 10);

        this.ball.radius = Math.floor(this.tileSize * 0.40);
        this.ball.x = this.boardX + this.ball.c * this.tileSize + this.tileSize / 2;
        this.ball.y = this.boardY + this.ball.r * this.tileSize + this.tileSize / 2;
        this.ball.targetX = this.ball.x;
        this.ball.targetY = this.ball.y;
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initLayout());

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          return { px: clientX - rect.left, py: clientY - rect.top };
        };

        const handleDown = (e) => {
          e.preventDefault();
          this.synth.init();
          if (e.pointerId !== undefined) {
            try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
          }
          const { px, py } = getPos(e);

          if (this.state === 'MODE_SELECT') {
            this.handleModeModalClick(px, py);
            return;
          }

          // Top Left Back Button Click
          if (px >= 12 && px <= 58 && py >= this.headerY - 14 && py <= this.headerY + 34) {
            this.synth.playTap();
            this.state = 'MODE_SELECT';
            return;
          }

          // Top Center Difficulty Pill Click
          const diffPillW = 86;
          const diffPillX = (this.width - diffPillW) / 2;
          if (px >= diffPillX && px <= diffPillX + diffPillW && py >= this.headerY - 20 && py <= this.headerY + 6) {
            this.synth.playTap();
            this.state = 'MODE_SELECT';
            return;
          }

          // Bottom LEFT Hint Button Click (💡 1)
          const hintBtnX = 48;
          const hintBtnY = this.height - 54;
          if (px >= hintBtnX - 26 && px <= hintBtnX + 26 && py >= hintBtnY - 26 && py <= hintBtnY + 26) {
            this.useHint();
            return;
          }

          this.touchStart = { px, py };
        };

        const handleUp = (e) => {
          if (!this.touchStart || this.state !== 'IDLE') return;
          const { px, py } = getPos(e);

          const dx = px - this.touchStart.px;
          const dy = py - this.touchStart.py;
          this.touchStart = null;

          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          const threshold = 14;

          if (absX < threshold && absY < threshold) return;

          if (absX > absY) {
            if (dx > 0) this.tryRoll(0, 1);   // RIGHT
            else this.tryRoll(0, -1);         // LEFT
          } else {
            if (dy > 0) this.tryRoll(1, 0);   // DOWN
            else this.tryRoll(-1, 0);          // UP
          }
        };

        this.canvas.addEventListener('pointerdown', handleDown);
        window.addEventListener('pointerup', handleUp);
        window.addEventListener('pointercancel', handleUp);

        window.addEventListener('keydown', (e) => {
          if (this.state !== 'IDLE') return;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.tryRoll(0, 1);
          else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.tryRoll(0, -1);
          else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.tryRoll(1, 0);
          else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.tryRoll(-1, 0);
        });
      }

      handleModeModalClick(px, py) {
        const cardW = Math.min(310, this.width - 36);
        const cardH = 300;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        if (px >= cardX + cardW - 44 && px <= cardX + cardW - 10 && py >= cardY + 10 && py <= cardY + 44) {
          this.synth.playTap();
          this.state = 'IDLE';
          return;
        }

        const modes = [
          { id: 'easy', label: 'EASY', desc: 'Challenging labyrinth tracks' },
          { id: 'medium', label: 'MEDIUM', desc: 'Complex multi-room corridors' },
          { id: 'hard', label: 'HARD', desc: 'Master labyrinths with deep planning' }
        ];

        const optH = 64;
        const startY = cardY + 68;

        for (let i = 0; i < modes.length; i++) {
          const m = modes[i];
          const optY = startY + i * (optH + 10);
          if (px >= cardX + 16 && px <= cardX + cardW - 16 && py >= optY && py <= optY + optH) {
            this.synth.playTap();
            this.saveDifficulty(m.id);
            this.levelIndex = this.loadLevelIndex(m.id);
            this.loadLevel(this.levelIndex);
            return;
          }
        }

        if (px < cardX || px > cardX + cardW || py < cardY || py > cardY + cardH) {
          this.state = 'IDLE';
        }
      }

      useHint() {
        if (this.state !== 'IDLE') return;
        const step = MazeSolver.solveNextStep(this.grid, this.ball.r, this.ball.c, this.painted);
        if (step) {
          this.hintArrow = { ...step, timer: 1.8 };
          this.synth.playTap();
          this.haptic(15);
        }
      }

      tryRoll(dr, dc) {
        if (this.state !== 'IDLE') return;
        this.hintArrow = null;

        let currR = this.ball.r;
        let currC = this.ball.c;
        let steps = 0;

        while (true) {
          const nextR = currR + dr;
          const nextC = currC + dc;

          if (nextR >= 0 && nextR < this.rows && nextC >= 0 && nextC < this.cols && this.grid[nextR][nextC] === 1) {
            currR = nextR;
            currC = nextC;
            steps++;
          } else {
            break;
          }
        }

        if (steps > 0) {
          this.state = 'MOVING';
          this.startMoveR = this.ball.r;
          this.startMoveC = this.ball.c;
          this.ball.targetR = currR;
          this.ball.targetC = currC;
          this.ball.targetX = this.boardX + currC * this.tileSize + this.tileSize / 2;
          this.ball.targetY = this.boardY + currR * this.tileSize + this.tileSize / 2;

          // Directional squash & stretch
          if (dc !== 0) {
            this.ball.scaleX = 1.18;
            this.ball.scaleY = 0.88;
          } else {
            this.ball.scaleX = 0.88;
            this.ball.scaleY = 1.18;
          }

          this.synth.playRoll();
          this.haptic(10);
        }
      }

      paintLine(r1, c1, r2, c2) {
        const dr = Math.sign(r2 - r1);
        const dc = Math.sign(c2 - c1);
        let currR = r1;
        let currC = c1;

        while (true) {
          if (this.grid[currR][currC] === 1 && !this.painted[currR][currC]) {
            this.painted[currR][currC] = true;
            this.paintedCount++;
            this.synth.playPaintTile();
            this.spawnStarSparkle(this.boardX + currC * this.tileSize + this.tileSize / 2,
                                  this.boardY + currR * this.tileSize + this.tileSize / 2);
          }
          if (currR === r2 && currC === c2) break;
          currR += dr;
          currC += dc;
        }
      }

      spawnStarSparkle(x, y) {
        for (let i = 0; i < 3; i++) {
          this.stars.push({
            x: x + (Math.random() - 0.5) * this.tileSize * 0.5,
            y: y + (Math.random() - 0.5) * this.tileSize * 0.5,
            vx: (Math.random() - 0.5) * 40,
            vy: -20 - Math.random() * 40,
            size: 4 + Math.random() * 4,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 6,
            alpha: 1.0
          });
        }
      }

      onBallReachedDestination() {
        this.paintLine(this.startMoveR !== undefined ? this.startMoveR : this.ball.r,
                       this.startMoveC !== undefined ? this.startMoveC : this.ball.c,
                       this.ball.targetR, this.ball.targetC);

        this.ball.r = this.ball.targetR;
        this.ball.c = this.ball.targetC;
        this.ball.x = this.ball.targetX;
        this.ball.y = this.ball.targetY;
        this.state = 'IDLE';

        this.ball.scaleX = 1.0;
        this.ball.scaleY = 1.0;

        for (let i = 0; i < 5; i++) {
          this.splats.push({
            x: this.ball.x,
            y: this.ball.y,
            vx: (Math.random() - 0.5) * 70,
            vy: (Math.random() - 0.5) * 70,
            size: 2.0 + Math.random() * 2.5,
            alpha: 1.0
          });
        }

        this.synth.playImpact();
        this.haptic(18);

        if (this.paintedCount >= this.totalPlayableTiles) {
          this.handleWin();
        }
      }

      handleWin() {
        this.state = 'GREAT_ANIMATION';
        this.greatAnimTimer = 1.6;
        this.rippleRadius = 0;
        this.synth.playWinFanfare();
        this.haptic(40);

        for (let i = 0; i < 40; i++) {
          this.confetti.push({
            x: this.width / 2,
            y: this.height / 2,
            vx: (Math.random() - 0.5) * 320,
            vy: -140 - Math.random() * 220,
            color: this.colorObj.hex,
            size: 5 + Math.random() * 5,
            alpha: 1.0,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 8
          });
        }

        Host.post('onLevelCompleted', { level: this.levelIndex + 1, difficulty: this.difficulty });
      }

      haptic(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      loop(timestamp) {
        const dt = Math.min(0.1, (timestamp - (this.lastTime || timestamp)) / 1000);
        this.lastTime = timestamp;

        if (this.state === 'MOVING') {
          const dx = this.ball.targetX - this.ball.x;
          const dy = this.ball.targetY - this.ball.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = this.ball.speed * dt;

          if (dist <= moveDist) {
            this.ball.x = this.ball.targetX;
            this.ball.y = this.ball.targetY;
            this.paintTileAtPos(this.ball.x, this.ball.y);
            this.onBallReachedDestination();
          } else {
            const angle = Math.atan2(dy, dx);
            this.ball.x += Math.cos(angle) * moveDist;
            this.ball.y += Math.sin(angle) * moveDist;
            this.paintTileAtPos(this.ball.x, this.ball.y);
          }
        }

        // Star Sparkles Particle Updates
        for (let i = this.stars.length - 1; i >= 0; i--) {
          const st = this.stars[i];
          st.x += st.vx * dt;
          st.y += st.vy * dt;
          st.rot += st.vrot * dt;
          st.alpha -= dt * 1.6;
          if (st.alpha <= 0) this.stars.splice(i, 1);
        }

        for (let i = this.splats.length - 1; i >= 0; i--) {
          const sp = this.splats[i];
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.alpha -= dt * 2.8;
          if (sp.alpha <= 0) this.splats.splice(i, 1);
        }

        for (let i = this.confetti.length - 1; i >= 0; i--) {
          const c = this.confetti[i];
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.vy += 320 * dt;
          c.rot += c.vrot * dt;
          c.alpha -= dt * 0.45;
          if (c.alpha <= 0) this.confetti.splice(i, 1);
        }

        if (this.hintArrow) {
          this.hintArrow.timer -= dt;
          if (this.hintArrow.timer <= 0) this.hintArrow = null;
        }

        if (this.state === 'GREAT_ANIMATION') {
          this.rippleRadius += dt * 380;
          this.greatAnimTimer -= dt;
          if (this.greatAnimTimer <= 0) {
            this.loadLevel(this.levelIndex + 1);
          }
        }

        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      paintTileAtPos(x, y) {
        const c = Math.floor((x - this.boardX) / this.tileSize);
        const r = Math.floor((y - this.boardY) / this.tileSize);

        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
          if (this.grid[r][c] === 1 && !this.painted[r][c]) {
            this.painted[r][c] = true;
            this.paintedCount++;
            this.synth.playPaintTile();
            this.spawnStarSparkle(this.boardX + c * this.tileSize + this.tileSize / 2,
                                  this.boardY + r * this.tileSize + this.tileSize / 2);
          }
        }
      }

      // --- RENDERING PIPELINE ---
      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        ctx.fillStyle = '#FAF7EE';
        ctx.fillRect(0, 0, this.width, this.height);

        this.renderTopUI(ctx);
        this.renderUndergroundSunkenTray(ctx);
        this.renderSplats(ctx);
        this.renderStarSparkles(ctx);
        this.renderHintGuide(ctx);
        this.renderJuicyMarbleBall(ctx);
        this.renderBottomHintButton(ctx);
        this.renderConfetti(ctx);

        if (this.state === 'GREAT_ANIMATION') this.renderGreatBanner(ctx);
        if (this.state === 'MODE_SELECT') this.renderModeDialog(ctx);

        ctx.restore();
      }

      renderTopUI(ctx) {
        const y = this.headerY;

        // Circular White Back Button
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.08)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 4;
        ctx.beginPath();
        ctx.arc(36, y + 2, 22, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        ctx.font = '900 20px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('‹', 36, y + 2);

        // Top Center Difficulty Pill
        const pillW = 86;
        const pillH = 22;
        const pillX = (this.width - pillW) / 2;
        const pillY = y - 16;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, pillH, 11);
        ctx.fillStyle = '#A8A29E';
        ctx.fill();

        ctx.font = '900 11px Outfit, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.difficulty.toUpperCase(), this.width / 2, pillY + pillH / 2 + 1);
        ctx.restore();

        // Level Title in Deep Berry Purple
        ctx.font = '900 24px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Level ' + (this.levelIndex + 1), this.width / 2, y + 20);
      }

      // UNDERGROUND SUNKEN TRAY 3D DEPTH (Smooth & Clean, Zero Corner Dots, Zero Harsh Lines)
      renderUndergroundSunkenTray(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const ts = this.tileSize;

        // 1. Soft Sunken Chasm Ambient Occlusion (Smooth Gradient)
        ctx.save();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r][c] === 1) {
              const tx = bx + c * ts;
              const ty = by + r * ts;

              // Top Sunken Inner Wall Shadow
              if (r === 0 || this.grid[r - 1][c] === 0) {
                const topAO = ctx.createLinearGradient(tx, ty, tx, ty + 6);
                topAO.addColorStop(0, 'rgba(30, 41, 59, 0.35)');
                topAO.addColorStop(1, 'rgba(30, 41, 59, 0)');
                ctx.fillStyle = topAO;
                ctx.fillRect(tx, ty, ts, 6);
              }
              // Left Sunken Inner Wall Shadow
              if (c === 0 || this.grid[r][c - 1] === 0) {
                const leftAO = ctx.createLinearGradient(tx, ty, tx + 6, ty);
                leftAO.addColorStop(0, 'rgba(30, 41, 59, 0.35)');
                leftAO.addColorStop(1, 'rgba(30, 41, 59, 0)');
                ctx.fillStyle = leftAO;
                ctx.fillRect(tx, ty, 6, ts);
              }
            }
          }
        }
        ctx.restore();

        // 2. Render Tile Blocks
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const tx = bx + c * ts;
            const ty = by + r * ts;

            if (this.grid[r][c] === 1) {
              const isPainted = this.painted[r][c];

              ctx.save();
              ctx.beginPath();
              ctx.rect(tx + 0.5, ty + 0.5, ts - 1, ts - 1);

              if (isPainted) {
                // Vibrant Solid Glossy Fill
                ctx.fillStyle = this.colorObj.hex;
                ctx.fill();

                // Clean Subtle Top Edge Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
                ctx.fillRect(tx + 1, ty + 1, ts - 2, 2);
              } else {
                // Clean Matte Dark Slate Tile
                ctx.fillStyle = '#334155';
                ctx.fill();

                // Subtle bottom depth step
                ctx.fillStyle = '#1E293B';
                ctx.fillRect(tx + 1, ty + ts - 2.5, ts - 2, 1.5);
              }

              // Clean Tile Separation Seam
              ctx.strokeStyle = isPainted ? this.colorObj.darkHex : '#243242';
              ctx.lineWidth = 1.0;
              ctx.stroke();
              ctx.restore();
            } else {
              // Smooth Warm Cream Void / Raised Islands
              ctx.save();
              ctx.fillStyle = '#FAF7EE';
              ctx.fillRect(tx, ty, ts, ts);

              if (r + 1 < this.rows && this.grid[r + 1][c] === 1) {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.25)';
                ctx.fillRect(tx, ty + ts - 3, ts, 3);
              }
              if (c + 1 < this.cols && this.grid[r][c + 1] === 1) {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.25)';
                ctx.fillRect(tx + ts - 3, ty, 3, ts);
              }
              ctx.restore();
            }
          }
        }

        // 3. Victory Radial Wave Animation
        if (this.state === 'GREAT_ANIMATION' && this.rippleRadius > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.width / 2, this.boardY + this.boardH / 2, this.rippleRadius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
          ctx.lineWidth = 6;
          ctx.stroke();
          ctx.restore();
        }
      }

      // STAR SPARKLES ALONG LINE
      renderStarSparkles(ctx) {
        for (const st of this.stars) {
          ctx.save();
          ctx.translate(st.x, st.y);
          ctx.rotate(st.rot);
          ctx.globalAlpha = Math.max(0, st.alpha);

          // 4-Point Star Sparkle
          ctx.beginPath();
          const sz = st.size;
          ctx.moveTo(0, -sz);
          ctx.quadraticCurveTo(0, 0, sz, 0);
          ctx.quadraticCurveTo(0, 0, 0, sz);
          ctx.quadraticCurveTo(0, 0, -sz, 0);
          ctx.quadraticCurveTo(0, 0, 0, -sz);
          ctx.fillStyle = '#FEF08A';
          ctx.fill();

          ctx.beginPath();
          const isz = sz * 0.4;
          ctx.moveTo(0, -isz);
          ctx.quadraticCurveTo(0, 0, isz, 0);
          ctx.quadraticCurveTo(0, 0, 0, isz);
          ctx.quadraticCurveTo(0, 0, -isz, 0);
          ctx.quadraticCurveTo(0, 0, 0, -isz);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();

          ctx.restore();
        }
      }

      // JUICY 3D MARBLE BALL WITH SQUASH & STRETCH
      renderJuicyMarbleBall(ctx) {
        const b = this.ball;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(b.scaleX, b.scaleY);

        // Soft Dynamic Drop Shadow
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, b.radius * 0.75, b.radius * 0.85, b.radius * 0.35, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();
        ctx.restore();

        // 3D Spherical Marble Body with Specular Highlight
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(-b.radius * 0.35, -b.radius * 0.35, b.radius * 0.1, 0, 0, b.radius);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.55, '#F1F5F9');
        grad.addColorStop(1, '#94A3B8');
        ctx.fillStyle = grad;
        ctx.fill();

        // Top Specular Gleam
        ctx.beginPath();
        ctx.arc(-b.radius * 0.35, -b.radius * 0.35, b.radius * 0.28, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.80)';
        ctx.fill();

        ctx.restore();
      }

      renderSplats(ctx) {
        for (const sp of this.splats) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
          ctx.fillStyle = this.colorObj.hex;
          ctx.globalAlpha = sp.alpha;
          ctx.fill();
          ctx.restore();
        }
      }

      // BOTTOM LEFT HINT BUTTON (💡 1)
      renderBottomHintButton(ctx) {
        const x = 48; // Positioned on LEFT
        const y = this.height - 54;
        const r = 24;

        ctx.save();
        ctx.shadowColor = 'rgba(245, 158, 11, 0.35)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;

        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        const grad = ctx.createLinearGradient(x, y - r, x, y + r);
        grad.addColorStop(0, '#FBBF24');
        grad.addColorStop(1, '#F59E0B');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.font = '22px sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💡', x, y);

        const badgeX = x + 16;
        const badgeY = y - 16;
        ctx.beginPath();
        ctx.arc(badgeX, badgeY, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.0;
        ctx.stroke();

        ctx.font = '900 11px Outfit, sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.fillText(this.hints.toString(), badgeX, badgeY + 1);

        ctx.restore();
      }

      renderHintGuide(ctx) {
        if (!this.hintArrow) return;
        const dir = this.hintArrow;
        const sx = this.ball.x;
        const sy = this.ball.y;
        const ex = sx + dir.dc * this.tileSize * 1.4;
        const ey = sy + dir.dr * this.tileSize * 1.4;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = '#FBBF24';
        ctx.lineWidth = 4.0;
        ctx.shadowColor = '#F59E0B';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ex, ey, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#F59E0B';
        ctx.fill();
        ctx.restore();
      }

      renderGreatBanner(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(250, 247, 238, 0.45)';
        ctx.fillRect(0, 0, this.width, this.height);

        const textY = this.boardY + this.boardH / 2;

        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 16;

        ctx.font = '900 48px Outfit, sans-serif';
        ctx.fillStyle = this.colorObj.hex;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('GREAT!', this.width / 2, textY);

        ctx.font = '900 18px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.fillText('Level Complete ⭐', this.width / 2, textY + 44);

        ctx.restore();
      }

      renderConfetti(ctx) {
        for (const c of this.confetti) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.globalAlpha = Math.max(0, c.alpha);
          ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.7);
          ctx.restore();
        }
      }

      renderModeDialog(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(310, this.width - 36);
        const cardH = 300;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
        ctx.shadowBlur = 28;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 20);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.font = '900 18px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT DIFFICULTY', this.width / 2, cardY + 38);

        ctx.font = '800 18px sans-serif';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('✕', cardX + cardW - 26, cardY + 38);

        const modes = [
          { id: 'easy', label: 'EASY', desc: 'Challenging labyrinth tracks' },
          { id: 'medium', label: 'MEDIUM', desc: 'Complex multi-room corridors' },
          { id: 'hard', label: 'HARD', desc: 'Master labyrinths with deep planning' }
        ];

        const optH = 64;
        const startY = cardY + 68;

        for (let i = 0; i < modes.length; i++) {
          const m = modes[i];
          const optY = startY + i * (optH + 10);
          const isSelected = (this.difficulty === m.id);

          ctx.beginPath();
          ctx.roundRect(cardX + 16, optY, cardW - 32, optH, 14);
          ctx.fillStyle = isSelected ? '#FAF7EE' : '#F8FAFC';
          ctx.fill();
          ctx.strokeStyle = isSelected ? '#701A75' : '#E2E8F0';
          ctx.lineWidth = isSelected ? 2.0 : 1.2;
          ctx.stroke();

          ctx.font = '900 15px Outfit, sans-serif';
          ctx.fillStyle = isSelected ? '#701A75' : '#1E293B';
          ctx.textAlign = 'left';
          ctx.fillText(m.label, cardX + 32, optY + 26);

          ctx.font = '600 12px Outfit, sans-serif';
          ctx.fillStyle = '#64748B';
          ctx.fillText(m.desc, cardX + 32, optY + 46);

          if (isSelected) {
            ctx.font = '900 16px sans-serif';
            ctx.fillStyle = '#701A75';
            ctx.textAlign = 'right';
            ctx.fillText('✓', cardX + cardW - 32, optY + optH / 2);
          }
        }
        ctx.restore();
      }
    }

    function initGame() {
      const canvas = document.getElementById('gameCanvas');
      if (canvas && !window.game) {
        window.game = new ColorMazeGame(canvas);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
