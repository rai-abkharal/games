name: frontend
description: "TikTok-style Mini-Games Swipe App in Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.16.0
  http: ^1.3.0
  path_provider: ^2.1.5
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  crypto: ^3.0.6
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
