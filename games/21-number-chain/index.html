<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Number Chain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Inter:wght@500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1D303E;
      font-family: 'Fredoka', 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    'use strict';

    // 1. TILE PALETTE CONFIGURATION
    const TILE_PALETTE = {
      2:    { bg: '#FF5E62', text: '#FFFFFF', border: '#E04A4E' },
      4:    { bg: '#9C51E0', text: '#FFFFFF', border: '#8338CF' },
      8:    { bg: '#F59E0B', text: '#FFFFFF', border: '#D97706' },
      16:   { bg: '#84CC16', text: '#FFFFFF', border: '#65A30D' },
      32:   { bg: '#38BDF8', text: '#FFFFFF', border: '#0EA5E9' },
      64:   { bg: '#FB923C', text: '#FFFFFF', border: '#EA580C' },
      128:  { bg: '#3B82F6', text: '#FFFFFF', border: '#2563EB' },
      256:  { bg: '#A1887F', text: '#FFFFFF', border: '#8D6E63' },
      512:  { bg: '#00BFA5', text: '#FFFFFF', border: '#00897B' },
      1024: { bg: '#5C6BC0', text: '#FFFFFF', border: '#3F51B5' },
      2048: { bg: '#22D3EE', text: '#FFFFFF', border: '#FFFFFF', isHighest: true },
      4096: { bg: '#EC4899', text: '#FFFFFF', border: '#FFFFFF', isHighest: true },
      8192: { bg: '#F43F5E', text: '#FFFFFF', border: '#FFFFFF', isHighest: true }
    };

    const MODES = [
      { id: 'easy', label: 'EASY', desc: '8×5 Grid', rows: 8, cols: 5, color: '#10B981', icon: '🌱', subtitle: 'Relaxed & Strategic' },
      { id: 'medium', label: 'MEDIUM', desc: '7×5 Grid', rows: 7, cols: 5, color: '#F59E0B', icon: '✨', subtitle: 'Balanced Flow' },
      { id: 'hard', label: 'HARD', desc: '6×5 Grid', rows: 6, cols: 5, color: '#EF4444', icon: '💎', subtitle: 'Tight Spatial Logic' }
    ];

    const THEME = {
      bgTop: '#2A4356',
      bgBottom: '#1D303E',
      cardBg: '#13161F',
      cardBorder: '#2E3547',
      pillBg: '#13212B',
      pillBorder: '#233747',
      textMain: '#FFFFFF',
      textMuted: '#94A3B8',
      accentCrown: '#2DD4BF',
      btnBg: '#FFFFFF',
      btnIcon: '#A855F7',
      undoBg: '#F59E0B',
      undoText: '#FFFFFF'
    };

    // 2. AUDIO SYNTHESIZER
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playStep(stepIndex = 1) {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const baseFreq = 261.63;
        const pentatonicIntervals = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
        const semitone = pentatonicIntervals[(stepIndex - 1) % pentatonicIntervals.length];
        const freq = baseFreq * Math.pow(2, semitone / 12);

        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
      }

      playBacktrack() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, t);
        osc.frequency.exponentialRampToValueAtTime(220, t + 0.07);
        gain.gain.setValueAtTime(0.09, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      }

      playMerge(value = 4) {
        if (this.muted || !this.ctx) return;
        this.init();
        const base = 220 * Math.min(2.5, Math.max(1, Math.log2(value) * 0.25));
        [base, base * 1.25, base * 1.5, base * 2.0].forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.035;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.20, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.39);
        });
      }

      playDropLanding() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.05);
        gain.gain.setValueAtTime(0.06, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }

      playTap() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }

      playGameOver() {
        if (this.muted || !this.ctx) return;
        this.init();
        const notes = [330, 293.66, 261.63, 220];
        notes.forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.29);
        });
      }
    }

    // 3. HOST PLATFORM BRIDGE
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const msg = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', msg);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(msg);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      }
    };

    // 4. MAIN NUMBER CHAIN GAME ENGINE
    class NumberChainGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.synth = new SoundSynth();

        this.modeId = this.loadModeId();
        this.mode = MODES.find(m => m.id === this.modeId) || MODES[0];
        this.rows = this.mode.rows;
        this.cols = this.mode.cols;

        this.sliderPos = this.modeId === 'hard' ? 1.0 : (this.modeId === 'medium' ? 0.5 : 0.0);
        this.isDraggingSlider = false;
        this.lastPlayClickTime = 0;
        this.tutorialSlide = 0;
        this.tutorialAnimT = 0;

        this.grid = [];
        this.floatingScores = [];
        this.ripples = [];

        this.score = 0;
        this.allTimeBest = this.loadBestScore();
        this.undoCharges = 1;
        this.history = [];

        this.activePath = [];
        this.isDragging = false;
        this.pointerPos = { px: 0, py: 0 };
        this.cursorPos = { x: 0, y: 0 };

        this.toast = null;

        this.initLayout();
        this.bindEvents();
        this.startNewGame(false);

        // Always show difficulty selection on initial app launch!
        this.state = 'DIFF_SELECT';

        requestAnimationFrame((t) => this.loop(t));
      }

      loadModeId() {
        try {
          const m = localStorage.getItem('number_chain_mode');
          return (m === 'easy' || m === 'medium' || m === 'hard') ? m : 'easy';
        } catch (e) {
          return 'easy';
        }
      }

      saveModeId(m) {
        this.modeId = m;
        try {
          localStorage.setItem('number_chain_mode', m);
        } catch (e) {}
      }

      loadBestScore() {
        try {
          const s = localStorage.getItem('number_chain_best_score');
          return s ? parseInt(s) || 21904 : 21904;
        } catch (e) {
          return 21904;
        }
      }

      saveBestScore() {
        try {
          localStorage.setItem('number_chain_best_score', this.allTimeBest.toString());
        } catch (e) {}
      }

      startNewGame(setPlaying = true) {
        this.mode = MODES.find(m => m.id === this.modeId) || MODES[0];
        this.rows = this.mode.rows;
        this.cols = this.mode.cols;
        this.score = 0;
        this.undoCharges = 1;
        this.history = [];
        this.activePath = [];
        this.isDragging = false;
        this.floatingScores = [];
        this.ripples = [];
        if (setPlaying) {
          this.state = 'PLAYING';
        }

        this.initLayout();
        this.generateInitialGrid();
        this.saveHistoryState();

        Host.post('onGameStarted', { mode: this.modeId });
      }

      getHighestTileOnBoard() {
        let maxVal = 2;
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r] && this.grid[r][c] && this.grid[r][c].val > maxVal) {
              maxVal = this.grid[r][c].val;
            }
          }
        }
        return maxVal;
      }

      generateWeightedValue() {
        const highest = this.grid.length > 0 ? this.getHighestTileOnBoard() : 128;

        const options = [
          { val: 2, w: 20 },
          { val: 4, w: 20 },
          { val: 8, w: 18 },
          { val: 16, w: 16 },
          { val: 32, w: 12 },
          { val: 64, w: 9 },
          { val: 128, w: 5 }
        ];

        if (highest >= 256) options.push({ val: 256, w: 2 });
        if (highest >= 512) options.push({ val: 512, w: 1 });

        const totalWeight = options.reduce((sum, o) => sum + o.w, 0);
        let rand = Math.random() * totalWeight;

        for (const opt of options) {
          if (rand < opt.w) return opt.val;
          rand -= opt.w;
        }
        return 2;
      }

      generateInitialGrid() {
        this.grid = [];
        for (let r = 0; r < this.rows; r++) {
          const row = [];
          for (let c = 0; c < this.cols; c++) {
            let val = this.generateWeightedValue();

            const leftVal = c > 0 ? row[c - 1].val : null;
            const topVal = r > 0 ? this.grid[r - 1][c].val : null;
            if (val === leftVal && val === topVal) {
              val = (val === 128) ? 2 : val * 2;
            }

            row.push({
              val: val,
              offsetY: 0,
              highlight: 0
            });
          }
          this.grid.push(row);
        }

        while (!this.hasValidMove()) {
          const r = Math.floor(Math.random() * (this.rows - 1));
          const c = Math.floor(Math.random() * this.cols);
          this.grid[r + 1][c].val = this.grid[r][c].val;
        }
      }

      saveHistoryState() {
        const snapshot = this.grid.map(row => row.map(cell => ({ ...cell })));
        this.history.push({
          grid: snapshot,
          score: this.score,
          undoCharges: this.undoCharges
        });
        if (this.history.length > 5) this.history.shift();
      }

      initLayout() {
        const dpr = window.devicePixelRatio || 1;
        this.dpr = dpr;
        this.width = window.innerWidth || 360;
        this.height = window.innerHeight || 640;
        this.canvas.width = Math.round(this.width * dpr);
        this.canvas.height = Math.round(this.height * dpr);

        const topPadding = 95;
        const bottomPadding = 105;
        const availableH = this.height - topPadding - bottomPadding;
        const availableW = this.width - 24;

        const maxCellByW = availableW / this.cols;
        const maxCellByH = availableH / this.rows;
        this.cellSize = Math.floor(Math.min(maxCellByW, maxCellByH, 68));
        this.cellGap = Math.max(3, Math.floor(this.cellSize * 0.08));
        this.tileInnerSize = this.cellSize - this.cellGap;

        this.boardW = this.cols * this.cellSize;
        this.boardH = this.rows * this.cellSize;
        this.boardX = Math.round((this.width - this.boardW) / 2);
        this.boardY = Math.round(topPadding + (availableH - this.boardH) / 2);

        this.headerY = Math.max(16, this.boardY - 74);
        this.hudY = this.boardY + this.boardH + 16;
      }

      haptic(ms = 10) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      hasActiveGameplay() {
        if (this.state !== 'PLAYING') return false;
        return (this.score > 0 || (this.history && this.history.length > 1));
      }

      onPlatformSwipeIn() {
        this.synth.init();

        // 1. If active game in progress: 0 Popups!
        if (this.hasActiveGameplay()) {
          return;
        }

        // 2. Debounce: if user just tapped PLAY within the last 2 seconds:
        if (this.lastPlayClickTime && (performance.now() - this.lastPlayClickTime < 2000)) {
          return;
        }

        if (this.state === 'DIFF_SELECT' || this.state === 'HOW_TO_PLAY') {
          return;
        }

        if (this.state === 'GAME_OVER') {
          this.startNewGame(false);
        }

        this.sliderPos = this.modeId === 'hard' ? 1.0 : (this.modeId === 'medium' ? 0.5 : 0.0);
        this.state = 'DIFF_SELECT';
      }

      showDiffSelect() {
        this.sliderPos = this.modeId === 'hard' ? 1.0 : (this.modeId === 'medium' ? 0.5 : 0.0);
        this.state = 'DIFF_SELECT';
      }

      updateDifficultySlider(px) {
        const cardW = Math.min(324, this.width - 36);
        const cardX = (this.width - cardW) / 2;
        const trackX = cardX + 32;
        const trackW = cardW - 64;

        let pct = (px - trackX) / trackW;
        pct = Math.max(0, Math.min(1.0, pct));
        this.sliderPos = pct;

        if (pct < 0.33) this.modeId = 'easy';
        else if (pct < 0.66) this.modeId = 'medium';
        else this.modeId = 'hard';
      }

      snapDifficultySlider() {
        if (this.sliderPos < 0.33) {
          this.sliderPos = 0.0;
          this.modeId = 'easy';
        } else if (this.sliderPos < 0.66) {
          this.sliderPos = 0.5;
          this.modeId = 'medium';
        } else {
          this.sliderPos = 1.0;
          this.modeId = 'hard';
        }
      }

      handleDifficultyModalDown(px, py) {
        const cardW = Math.min(324, this.width - 36);
        const cardH = 376;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        const trackX = cardX + 32;
        const trackW = cardW - 64;
        const trackY = cardY + 218;

        // Slider Touch
        if (py >= trackY - 24 && py <= trackY + 32 && px >= trackX - 16 && px <= trackX + trackW + 16) {
          this.isDraggingSlider = true;
          this.updateDifficultySlider(px);
          return;
        }

        // PLAY Button
        const playBtnW = cardW - 110;
        const playBtnH = 50;
        const playBtnX = cardX + 24;
        const playBtnY = cardY + 282;

        if (px >= playBtnX && px <= playBtnX + playBtnW && py >= playBtnY && py <= playBtnY + playBtnH) {
          this.synth.playTap();
          this.snapDifficultySlider();
          this.saveModeId(this.modeId);
          this.lastPlayClickTime = performance.now();
          this.startNewGame(true);
          return;
        }

        // ? Question Button
        const qBtnX = cardX + cardW - 74;
        if (px >= qBtnX && px <= qBtnX + 50 && py >= playBtnY && py <= playBtnY + playBtnH) {
          this.synth.playTap();
          this.tutorialSlide = 0;
          this.tutorialAnimT = 0;
          this.state = 'HOW_TO_PLAY';
          return;
        }
      }

      handleHowToPlayModalClick(px, py) {
        const cardW = Math.min(324, this.width - 36);
        const cardH = 376;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;
        const btnY = cardY + 312;
        const btnH = 44;

        // 1. Back Arrow Button
        if (px >= cardX + 16 && px <= cardX + 64 && py >= btnY - 4 && py <= btnY + btnH + 4) {
          if (this.tutorialSlide > 0) {
            this.synth.playTap();
            this.tutorialSlide--;
            this.tutorialAnimT = 0;
          }
          return;
        }

        // 2. Center OK Button
        const okX = cardX + 70;
        const okW = cardW - 140;
        if (px >= okX && px <= okX + okW && py >= btnY - 4 && py <= btnY + btnH + 4) {
          this.synth.playTap();
          this.lastPlayClickTime = performance.now();
          this.state = 'PLAYING';
          return;
        }

        // 3. Next Arrow Button
        const nextX = cardX + cardW - 64;
        if (px >= nextX && px <= nextX + 48 && py >= btnY - 4 && py <= btnY + btnH + 4) {
          if (this.tutorialSlide < 2) {
            this.synth.playTap();
            this.tutorialSlide++;
            this.tutorialAnimT = 0;
          } else {
            this.synth.playTap();
            this.lastPlayClickTime = performance.now();
            this.state = 'PLAYING';
          }
          return;
        }
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initLayout());

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          return { px: clientX - rect.left, py: clientY - rect.top };
        };

        const handleDown = (e) => {
          e.preventDefault();
          this.synth.init();
          if (e.pointerId !== undefined) {
            try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
          }
          const { px, py } = getPos(e);
          this.pointerPos = { px, py };
          this.cursorPos = { x: px, y: py };

          if (this.state === 'DIFF_SELECT') {
            this.handleDifficultyModalDown(px, py);
            return;
          }

          if (this.state === 'HOW_TO_PLAY') {
            this.handleHowToPlayModalClick(px, py);
            return;
          }

          if (this.state === 'GAME_OVER') {
            const btnW = 200, btnH = 48;
            const btnX = (this.width - btnW) / 2;
            const btnY = this.height * 0.64;
            if (px >= btnX && px <= btnX + btnW && py >= btnY && py <= btnY + btnH) {
              this.synth.playTap();
              this.startNewGame(true);
            }
            return;
          }

          // Top Header Clicks
          if (py >= this.headerY - 4 && py <= this.headerY + 54) {
            // Mode Select Pill
            const modePillW = 112;
            const modePillX = (this.width / 2) - modePillW - 8;
            if (px >= modePillX && px <= modePillX + modePillW) {
              this.synth.playTap();
              this.showDiffSelect();
              return;
            }

            // Restart Button
            if (px >= this.width - 56 && px <= this.width - 14) {
              this.synth.playTap();
              this.startNewGame(true);
              return;
            }
          }

          // HUD Clicks
          if (py >= this.hudY - 10 && py <= this.hudY + 56) {
            // Undo Button
            if (px >= 24 && px <= 76) {
              this.handleUndo();
              return;
            }
          }

          // Board Interaction
          const cell = this.getCellFromPos(px, py);
          if (cell) {
            this.isDragging = true;
            this.activePath = [cell];
            this.grid[cell.r][cell.c].highlight = 1.0;
            this.synth.playStep(1);
            this.haptic(10);
          }
        };

        const handleMove = (e) => {
          const { px, py } = getPos(e);
          if (this.state === 'DIFF_SELECT' && this.isDraggingSlider) {
            this.updateDifficultySlider(px);
            return;
          }

          if (!this.isDragging || this.state !== 'PLAYING') return;
          e.preventDefault();
          this.pointerPos = { px, py };
          this.cursorPos = { x: px, y: py };

          const cell = this.getCellFromPos(px, py);
          if (!cell) return;

          const pathLen = this.activePath.length;
          if (pathLen >= 2) {
            const prev = this.activePath[pathLen - 2];
            if (prev.r === cell.r && prev.c === cell.c) {
              const removed = this.activePath.pop();
              this.grid[removed.r][removed.c].highlight = 0;
              this.synth.playBacktrack();
              this.haptic(8);
              return;
            }
          }

          const last = this.activePath[pathLen - 1];
          if (last.r === cell.r && last.c === cell.c) return;

          const isAdj = Math.abs(last.r - cell.r) <= 1 && Math.abs(last.c - cell.c) <= 1;
          if (!isAdj) return;

          const alreadyInPath = this.activePath.some(pt => pt.r === cell.r && pt.c === cell.c);
          if (alreadyInPath) return;

          const firstVal = this.grid[this.activePath[0].r][this.activePath[0].c].val;
          const currentCellVal = this.grid[cell.r][cell.c].val;

          if (currentCellVal === firstVal) {
            this.activePath.push(cell);
            this.grid[cell.r][cell.c].highlight = 1.0;
            this.synth.playStep(this.activePath.length);
            this.haptic(12);
          }
        };

        const handleUp = (e) => {
          if (this.isDraggingSlider) {
            this.isDraggingSlider = false;
            this.snapDifficultySlider();
            return;
          }

          if (!this.isDragging) return;
          this.isDragging = false;
          this.cursorPos = null;

          if (this.activePath.length >= 2) {
            this.executeChainMerge();
          } else {
            for (const pt of this.activePath) {
              this.grid[pt.r][pt.c].highlight = 0;
            }
            this.activePath = [];
          }
        };

        if (window.PointerEvent) {
          this.canvas.addEventListener('pointerdown', handleDown);
          window.addEventListener('pointermove', handleMove);
          window.addEventListener('pointerup', handleUp);
          window.addEventListener('pointercancel', handleUp);
        } else {
          this.canvas.addEventListener('touchstart', handleDown);
          window.addEventListener('touchmove', handleMove);
          window.addEventListener('touchend', handleUp);
          window.addEventListener('touchcancel', handleUp);
        }

        window.addEventListener('message', (e) => {
          if (!e.data) return;
          const act = e.data.action || e.data.type || e.data;
          if (act === 'resume' || act === 'onGameActive' || act === 'active' || act === 'swipe_in' || act === 'show') {
            this.onPlatformSwipeIn();
          }
        });

        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            this.initLayout();
            this.onPlatformSwipeIn();
          }
        });
      }

      getCellFromPos(px, py) {
        if (px < this.boardX || px > this.boardX + this.boardW ||
            py < this.boardY || py > this.boardY + this.boardH) {
          return null;
        }
        const c = Math.floor((px - this.boardX) / this.cellSize);
        const r = Math.floor((py - this.boardY) / this.cellSize);
        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
          return { r, c };
        }
        return null;
      }

      executeChainMerge() {
        this.saveHistoryState();

        const baseVal = this.grid[this.activePath[0].r][this.activePath[0].c].val;
        const count = this.activePath.length;
        const powerIncrease = Math.floor(Math.log2(count));
        const finalVal = baseVal * Math.pow(2, powerIncrease);

        const gainedScore = finalVal * count;
        this.score += gainedScore;
        if (this.score > this.allTimeBest) {
          this.allTimeBest = this.score;
          this.saveBestScore();
        }

        const lastCell = this.activePath[count - 1];
        const lastCellCenter = this.getCellCenter(lastCell.r, lastCell.c);

        this.spawnFloatingScore('+' + gainedScore.toLocaleString(), lastCellCenter.x, lastCellCenter.y - 10);
        this.spawnRipple(lastCellCenter.x, lastCellCenter.y);

        this.synth.playMerge(finalVal);
        this.haptic(25);

        for (const pt of this.activePath) {
          this.grid[pt.r][pt.c].highlight = 0;
        }

        const clearedSet = new Set();
        for (let i = 0; i < count - 1; i++) {
          const pt = this.activePath[i];
          clearedSet.add(pt.r + ',' + pt.c);
        }

        this.grid[lastCell.r][lastCell.c].val = finalVal;
        this.activePath = [];

        this.collapseColumns(clearedSet);
      }

      collapseColumns(clearedSet) {
        for (let c = 0; c < this.cols; c++) {
          const survivingValues = [];
          for (let r = this.rows - 1; r >= 0; r--) {
            if (!clearedSet.has(r + ',' + c)) {
              survivingValues.push(this.grid[r][c].val);
            }
          }

          const missingCount = this.rows - survivingValues.length;
          const newColumnValues = [];

          for (let i = 0; i < missingCount; i++) {
            newColumnValues.push(this.generateWeightedValue());
          }
          for (let i = survivingValues.length - 1; i >= 0; i--) {
            newColumnValues.push(survivingValues[i]);
          }

          for (let r = 0; r < this.rows; r++) {
            this.grid[r][c].val = newColumnValues[r];
            if (r < missingCount) {
              this.grid[r][c].offsetY = -(missingCount - r + 1) * this.cellSize * 0.9;
            }
          }
        }

        setTimeout(() => {
          this.synth.playDropLanding();
          if (!this.hasValidMove()) {
            this.state = 'GAME_OVER';
            this.synth.playGameOver();
            this.haptic(40);
            Host.post('onGameOver', { score: this.score, bestScore: this.allTimeBest });
          }
        }, 180);
      }

      hasValidMove() {
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const val = this.grid[r][c].val;
            const neighbors = [
              { r: r - 1, c: c - 1 }, { r: r - 1, c: c }, { r: r - 1, c: c + 1 },
              { r: r,     c: c - 1 },                     { r: r,     c: c + 1 },
              { r: r + 1, c: c - 1 }, { r: r + 1, c: c }, { r: r + 1, c: c + 1 }
            ];
            for (const n of neighbors) {
              if (n.r >= 0 && n.r < this.rows && n.c >= 0 && n.c < this.cols) {
                if (this.grid[n.r][n.c].val === val) {
                  return true;
                }
              }
            }
          }
        }
        return false;
      }

      handleUndo() {
        if (this.undoCharges <= 0) {
          this.toast = { text: 'No Undos Left!', t: 1.2 };
          return;
        }
        if (this.history.length < 2) {
          this.toast = { text: 'Nothing to Undo!', t: 1.2 };
          return;
        }
        if (this.state !== 'PLAYING') return;

        this.history.pop();
        const prevState = this.history.pop();
        if (prevState) {
          this.grid = prevState.grid.map(row => row.map(c => ({ ...c, offsetY: 0, highlight: 0 })));
          this.score = prevState.score;
          this.undoCharges--;
          this.saveHistoryState();
          this.synth.playTap();
          this.toast = { text: 'Move Reverted! ↶', t: 1.0 };
        }
      }

      getCellCenter(r, c) {
        return {
          x: this.boardX + c * this.cellSize + this.cellSize / 2,
          y: this.boardY + r * this.cellSize + this.cellSize / 2
        };
      }

      spawnFloatingScore(text, x, y) {
        this.floatingScores.push({
          text: text,
          x: x,
          y: y,
          vy: -55,
          alpha: 1.0
        });
      }

      spawnRipple(x, y) {
        this.ripples.push({
          x: x,
          y: y,
          radius: 12,
          maxRadius: this.cellSize * 1.6,
          alpha: 1.0
        });
      }

      // 5. ANIMATION LOOP & PHYSICS
      loop(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = Math.min(0.06, (timestamp - this.lastTime) / 1000);
        this.lastTime = timestamp;

        this.tutorialAnimT += dt;

        // Cascade Drop Gravity Springs
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const cell = this.grid[r] && this.grid[r][c];
            if (cell && cell.offsetY < 0) {
              cell.offsetY += 1400 * dt;
              if (cell.offsetY > 0) cell.offsetY = 0;
            }
            if (cell && cell.highlight > 0 && !this.isDragging) {
              cell.highlight = 0;
            }
          }
        }

        // Floating Scores
        for (let i = this.floatingScores.length - 1; i >= 0; i--) {
          const fs = this.floatingScores[i];
          fs.y += fs.vy * dt;
          fs.alpha -= dt * 0.95;
          if (fs.alpha <= 0) this.floatingScores.splice(i, 1);
        }

        // Ripples
        for (let i = this.ripples.length - 1; i >= 0; i--) {
          const rip = this.ripples[i];
          rip.radius += 240 * dt;
          rip.alpha -= dt * 2.6;
          if (rip.alpha <= 0 || rip.radius >= rip.maxRadius) {
            this.ripples.splice(i, 1);
          }
        }

        if (this.toast) {
          this.toast.t -= dt;
          if (this.toast.t <= 0) this.toast = null;
        }

        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        const bgGrad = ctx.createLinearGradient(0, 0, 0, this.height);
        bgGrad.addColorStop(0, THEME.bgTop);
        bgGrad.addColorStop(1, THEME.bgBottom);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, this.width, this.height);

        this.renderHeader(ctx);
        this.renderBoard(ctx);
        this.renderHUD(ctx);
        this.renderOverlays(ctx);

        if (this.toast) this.renderToast(ctx);
        if (this.state === 'DIFF_SELECT') this.renderDifficultySliderModal(ctx);
        if (this.state === 'HOW_TO_PLAY') this.renderHowToPlayModal(ctx);
        if (this.state === 'GAME_OVER') this.renderGameOverModal(ctx);

        ctx.restore();
      }

      renderHeader(ctx) {
        const y = this.headerY;

        // Mode & Live Score Pill
        const modePillW = 112;
        const modePillX = (this.width / 2) - modePillW - 8;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(modePillX, y, modePillW, 42, 12);
        ctx.fillStyle = THEME.pillBg;
        ctx.fill();
        ctx.strokeStyle = THEME.pillBorder;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 10.5px Fredoka, sans-serif';
        ctx.fillStyle = THEME.textMuted;
        ctx.textAlign = 'center';
        ctx.fillText(this.mode.label + ' ▾', modePillX + modePillW / 2, y + 14);

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.score.toLocaleString(), modePillX + modePillW / 2, y + 32);
        ctx.restore();

        // All Time High Score Pill
        const bestPillW = 112;
        const bestPillX = (this.width / 2) + 8;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bestPillX, y, bestPillW, 42, 12);
        ctx.fillStyle = THEME.pillBg;
        ctx.fill();
        ctx.strokeStyle = THEME.pillBorder;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 10px Fredoka, sans-serif';
        ctx.fillStyle = THEME.accentCrown;
        ctx.textAlign = 'center';
        ctx.fillText('👑 ALL TIME', bestPillX + bestPillW / 2, y + 14);

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = THEME.accentCrown;
        ctx.fillText(this.allTimeBest.toLocaleString(), bestPillX + bestPillW / 2, y + 32);
        ctx.restore();

        // Restart Button (↺)
        const restartX = this.width - 36;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(restartX, y + 21, 20, 0, Math.PI * 2);
        ctx.fillStyle = THEME.btnBg;
        ctx.fill();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = THEME.btnIcon;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↺', restartX, y + 21);
        ctx.restore();
      }

      renderBoard(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const cs = this.cellSize;
        const tis = this.tileInnerSize;

        // Path Connector Ribbons
        if (this.activePath.length > 1) {
          const firstPt = this.activePath[0];
          const firstVal = this.grid[firstPt.r][firstPt.c].val;
          const activePal = TILE_PALETTE[firstVal] || TILE_PALETTE[2];

          ctx.save();
          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = Math.floor(cs * 0.36);
          ctx.strokeStyle = activePal.bg;
          ctx.shadowColor = activePal.bg;
          ctx.shadowBlur = 14;

          const p0 = this.getCellCenter(firstPt.r, firstPt.c);
          ctx.moveTo(p0.x, p0.y);

          for (let i = 1; i < this.activePath.length; i++) {
            const pt = this.activePath[i];
            const p = this.getCellCenter(pt.r, pt.c);
            ctx.lineTo(p.x, p.y);
          }

          if (this.isDragging && this.cursorPos) {
            ctx.lineTo(this.cursorPos.x, this.cursorPos.y);
          }
          ctx.stroke();
          ctx.restore();
        }

        // Render Grid Cells
        ctx.save();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const cell = this.grid[r] && this.grid[r][c];
            if (!cell) continue;

            const cx = bx + c * cs + cs / 2;
            const cy = by + r * cs + cs / 2 + cell.offsetY;

            const pal = TILE_PALETTE[cell.val] || TILE_PALETTE[2];
            const isHighlighted = cell.highlight > 0;

            ctx.save();
            ctx.translate(cx, cy);

            const x0 = -tis / 2;
            const y0 = -tis / 2;

            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 3;

            ctx.beginPath();
            ctx.roundRect(x0, y0, tis, tis, 8);
            ctx.fillStyle = pal.bg;
            ctx.fill();

            ctx.shadowColor = 'transparent';

            ctx.beginPath();
            ctx.roundRect(x0 + 2, y0 + 2, tis - 4, tis * 0.40, [6, 6, 2, 2]);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.22)';
            ctx.fill();

            ctx.beginPath();
            ctx.roundRect(x0, y0 + tis - 4, tis, 4, [0, 0, 8, 8]);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
            ctx.fill();

            ctx.beginPath();
            ctx.roundRect(x0, y0, tis, tis, 8);
            if (isHighlighted || pal.isHighest) {
              ctx.strokeStyle = '#FFFFFF';
              ctx.lineWidth = isHighlighted ? 3.0 : 2.0;
            } else {
              ctx.strokeStyle = pal.border;
              ctx.lineWidth = 1.2;
            }
            ctx.stroke();

            const fontSize = cell.val >= 1000 ? Math.floor(tis * 0.32) : Math.floor(tis * 0.44);
            ctx.font = '900 ' + fontSize + 'px Fredoka, sans-serif';
            ctx.fillStyle = pal.text;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(cell.val.toString(), 0, 1);

            ctx.restore();
          }
        }
        ctx.restore();

        // Ripples
        for (const rip of this.ripples) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(rip.x, rip.y, rip.radius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, ' + rip.alpha + ')';
          ctx.lineWidth = 2.5;
          ctx.stroke();
          ctx.restore();
        }

        // Active dragging cursor aura
        if (this.isDragging && this.activePath.length > 0 && this.cursorPos) {
          const firstPt = this.activePath[0];
          const firstVal = this.grid[firstPt.r][firstPt.c].val;
          const activePal = TILE_PALETTE[firstVal] || TILE_PALETTE[2];

          ctx.save();
          const auraR = cs * 0.52;
          const coreR = cs * 0.24;

          ctx.beginPath();
          ctx.arc(this.cursorPos.x, this.cursorPos.y, auraR, 0, Math.PI * 2);
          ctx.fillStyle = activePal.bg + '44';
          ctx.fill();
          ctx.strokeStyle = activePal.bg;
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(this.cursorPos.x, this.cursorPos.y, coreR, 0, Math.PI * 2);
          ctx.fillStyle = activePal.bg;
          ctx.fill();
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = 2.0;
          ctx.stroke();
          ctx.restore();
        }
      }

      renderHUD(ctx) {
        const y = this.hudY;

        const undoX = 48;
        const undoY = y + 16;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(undoX, undoY, 24, 0, Math.PI * 2);
        ctx.fillStyle = THEME.undoBg;
        ctx.fill();

        ctx.font = '900 20px sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↶', undoX, undoY - 1);

        ctx.beginPath();
        ctx.arc(undoX + 16, undoY - 16, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.font = '900 11px Inter, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText(this.undoCharges.toString(), undoX + 16, undoY - 16);

        ctx.font = '800 12px Fredoka, sans-serif';
        ctx.fillStyle = THEME.undoBg;
        ctx.fillText('Undo', undoX, undoY + 36);
        ctx.restore();
      }

      renderOverlays(ctx) {
        for (const fs of this.floatingScores) {
          ctx.save();
          ctx.font = '900 20px Fredoka, sans-serif';
          ctx.fillStyle = '#FACC15';
          ctx.globalAlpha = fs.alpha;
          ctx.textAlign = 'center';
          ctx.fillText(fs.text, fs.x, fs.y);
          ctx.restore();
        }
      }

      renderToast(ctx) {
        const t = this.toast;
        if (!t) return;
        const tw = Math.min(260, this.width - 40);
        const tx = (this.width - tw) / 2;
        const ty = this.boardY - 45;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, 36, 18);
        ctx.fillStyle = '#172733';
        ctx.fill();
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.text, tx + tw / 2, ty + 18);
        ctx.restore();
      }

      // --- DARK THEMED SUDOKU PRO STYLE DIFFICULTY SLIDER MODAL ---
      renderDifficultySliderModal(ctx) {
        ctx.fillStyle = 'rgba(10, 13, 20, 0.85)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(324, this.width - 36);
        const cardH = 376;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.70)';
        ctx.shadowBlur = 36;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = THEME.cardBg;
        ctx.fill();
        ctx.strokeStyle = THEME.cardBorder;
        ctx.lineWidth = 2.0;
        ctx.stroke();

        // Title
        ctx.font = '900 18px Fredoka, sans-serif';
        ctx.fillStyle = THEME.textMain;
        ctx.textAlign = 'center';
        ctx.fillText('SELECT GRID MODE', this.width / 2, cardY + 36);

        // Emblem
        const emblemY = cardY + 98;
        const diffObj = MODES.find(m => m.id === this.modeId) || MODES[0];

        ctx.shadowColor = diffObj.color;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(this.width / 2, emblemY, 36, 0, Math.PI * 2);
        ctx.fillStyle = '#1E2330';
        ctx.fill();
        ctx.strokeStyle = diffObj.color;
        ctx.lineWidth = 3.5;
        ctx.stroke();

        ctx.font = '32px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(diffObj.icon, this.width / 2, emblemY);
        ctx.restore();

        // Difficulty Title & Subtitle
        ctx.save();
        ctx.font = '900 21px Fredoka, sans-serif';
        ctx.fillStyle = diffObj.color;
        ctx.textAlign = 'center';
        ctx.fillText(diffObj.label, this.width / 2, cardY + 162);

        ctx.font = '700 12.5px Inter, sans-serif';
        ctx.fillStyle = THEME.textMuted;
        ctx.fillText(diffObj.desc + ' • ' + diffObj.subtitle, this.width / 2, cardY + 185);

        // Slider Track
        const trackX = cardX + 32;
        const trackW = cardW - 64;
        const trackH = 14;
        const trackY = cardY + 218;

        ctx.beginPath();
        ctx.roundRect(trackX, trackY, trackW, trackH, 7);
        ctx.fillStyle = '#1E2330';
        ctx.fill();
        ctx.strokeStyle = '#2E3547';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        const fillW = Math.max(14, trackW * this.sliderPos);
        const grad = ctx.createLinearGradient(trackX, trackY, trackX + trackW, trackY);
        grad.addColorStop(0, '#10B981');
        grad.addColorStop(0.5, '#F59E0B');
        grad.addColorStop(1, '#EF4444');

        ctx.beginPath();
        ctx.roundRect(trackX, trackY, fillW, trackH, 7);
        ctx.fillStyle = grad;
        ctx.fill();

        // Slider Knob
        const thumbX = trackX + trackW * this.sliderPos;
        const thumbY = trackY + trackH / 2;

        ctx.shadowColor = diffObj.color;
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.arc(thumbX, thumbY, 13, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = diffObj.color;
        ctx.lineWidth = 3.5;
        ctx.stroke();
        ctx.restore();

        // Bottom Row: PLAY ▶ and ? Help
        ctx.save();
        const playBtnW = cardW - 110;
        const playBtnH = 50;
        const playBtnX = cardX + 24;
        const playBtnY = cardY + 282;

        ctx.shadowColor = diffObj.color;
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.roundRect(playBtnX, playBtnY, playBtnW, playBtnH, 18);
        ctx.fillStyle = diffObj.color;
        ctx.fill();

        ctx.font = '900 17px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PLAY  ▶', playBtnX + playBtnW / 2, playBtnY + playBtnH / 2 + 1);

        // Purple ? Button
        const qBtnX = cardX + cardW - 74;
        ctx.shadowColor = '#8B5CF6';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.roundRect(qBtnX, playBtnY, 50, playBtnH, 18);
        ctx.fillStyle = '#8B5CF6';
        ctx.fill();

        ctx.font = '900 20px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('?', qBtnX + 25, playBtnY + playBtnH / 2 + 1);
        ctx.restore();
      }

      // --- DARK THEMED HOW TO PLAY MODAL ---
      renderHowToPlayModal(ctx) {
        ctx.fillStyle = 'rgba(10, 13, 20, 0.85)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(324, this.width - 36);
        const cardH = 376;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.70)';
        ctx.shadowBlur = 36;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = THEME.cardBg;
        ctx.fill();
        ctx.strokeStyle = THEME.cardBorder;
        ctx.lineWidth = 2.0;
        ctx.stroke();

        // Title
        ctx.font = '900 18px Fredoka, sans-serif';
        ctx.fillStyle = THEME.textMain;
        ctx.textAlign = 'center';
        ctx.fillText('HOW TO PLAY', this.width / 2, cardY + 30);

        // Simulation Box
        const gridBoxW = cardW - 48;
        const gridBoxH = 168;
        const gridBoxX = cardX + 24;
        const gridBoxY = cardY + 44;

        ctx.beginPath();
        ctx.roundRect(gridBoxX, gridBoxY, gridBoxW, gridBoxH, 14);
        ctx.fillStyle = '#1E2330';
        ctx.fill();

        const ts = 34;
        const t = (this.tutorialAnimT % 2.5) / 2.5;

        // Slide 1: Drag Across Matching Numbers
        if (this.tutorialSlide === 0) {
          const cx1 = gridBoxX + gridBoxW / 2 - 38;
          const cx2 = gridBoxX + gridBoxW / 2;
          const cx3 = gridBoxX + gridBoxW / 2 + 38;
          const cy = gridBoxY + 84;

          ctx.beginPath();
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#FF5E62';
          ctx.lineWidth = 10;
          ctx.moveTo(cx1, cy);
          ctx.lineTo(cx1 + (cx3 - cx1) * t, cy);
          ctx.stroke();

          this.drawTutTile(ctx, cx1, cy, ts, 2, TILE_PALETTE[2]);
          this.drawTutTile(ctx, cx2, cy, ts, 2, TILE_PALETTE[2]);
          this.drawTutTile(ctx, cx3, cy, ts, 2, TILE_PALETTE[2]);

          ctx.font = '24px sans-serif';
          ctx.fillText('👆', cx1 + (cx3 - cx1) * t + 8, cy + 12);

          ctx.font = '800 13.5px Fredoka, sans-serif';
          ctx.fillStyle = THEME.textMain;
          ctx.textAlign = 'center';
          ctx.fillText('Drag your finger across adjacent', this.width / 2, cardY + 236);
          ctx.fillText('matching numbers to connect them.', this.width / 2, cardY + 256);
        }
        // Slide 2: Connected numbers merge into next power
        else if (this.tutorialSlide === 1) {
          const cx = gridBoxX + gridBoxW / 2;
          const cy = gridBoxY + 84;
          this.drawTutTile(ctx, cx, cy, 40, 8, TILE_PALETTE[8]);

          ctx.font = '24px sans-serif';
          ctx.fillText('✨', cx - 34, cy - 20);
          ctx.fillText('✨', cx + 34, cy - 20);

          ctx.font = '800 13.5px Fredoka, sans-serif';
          ctx.fillStyle = THEME.textMain;
          ctx.textAlign = 'center';
          ctx.fillText('Connecting 3 twos makes 8!', this.width / 2, cardY + 236);
          ctx.fillText('Chained tiles merge into higher numbers.', this.width / 2, cardY + 256);
        }
        // Slide 3: Keep chaining and clear the board
        else {
          const cx = gridBoxX + gridBoxW / 2;
          const cy = gridBoxY + 84;
          this.drawTutTile(ctx, cx, cy, 44, 2048, TILE_PALETTE[2048]);

          ctx.font = '800 13.5px Fredoka, sans-serif';
          ctx.fillStyle = THEME.textMain;
          ctx.textAlign = 'center';
          ctx.fillText('Form long chain combos to hit 2048+', this.width / 2, cardY + 236);
          ctx.fillText('and rack up massive high scores!', this.width / 2, cardY + 256);
        }

        // Bottom Nav Buttons
        const btnY = cardY + 312;
        const btnH = 44;

        // Back button
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cardX + 16, btnY, 48, btnH, 14);
        ctx.fillStyle = (this.tutorialSlide > 0) ? '#2E3547' : '#1E2330';
        ctx.fill();
        ctx.font = '900 18px Fredoka, sans-serif';
        ctx.fillStyle = (this.tutorialSlide > 0) ? '#FFFFFF' : '#475569';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('◀', cardX + 40, btnY + btnH / 2 + 1);
        ctx.restore();

        // OK button
        const okW = cardW - 140;
        const okX = cardX + 70;
        ctx.save();
        ctx.shadowColor = '#8B5CF6';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(okX, btnY, okW, btnH, 14);
        ctx.fillStyle = '#8B5CF6';
        ctx.fill();
        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('OK', okX + okW / 2, btnY + btnH / 2 + 1);
        ctx.restore();

        // Next button
        ctx.save();
        const nextX = cardX + cardW - 64;
        ctx.beginPath();
        ctx.roundRect(nextX, btnY, 48, btnH, 14);
        ctx.fillStyle = '#2E3547';
        ctx.fill();
        ctx.font = '900 18px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('▶', nextX + 24, btnY + btnH / 2 + 1);
        ctx.restore();

        // Page Indicator Dots
        const dotY = cardY + 284;
        for (let i = 0; i < 3; i++) {
          const dx = this.width / 2 + (i - 1) * 16;
          ctx.beginPath();
          ctx.arc(dx, dotY, (i === this.tutorialSlide) ? 4.5 : 3, 0, Math.PI * 2);
          ctx.fillStyle = (i === this.tutorialSlide) ? '#8B5CF6' : '#475569';
          ctx.fill();
        }
        ctx.restore();
      }

      drawTutTile(ctx, cx, cy, ts, val, pal) {
        ctx.save();
        ctx.translate(cx, cy);
        const x0 = -ts / 2;
        const y0 = -ts / 2;
        ctx.beginPath();
        ctx.roundRect(x0, y0, ts, ts, 8);
        ctx.fillStyle = pal.bg;
        ctx.fill();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = '900 ' + Math.floor(ts * 0.44) + 'px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val.toString(), 0, 1);
        ctx.restore();
      }

      renderGameOverModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(320, this.width - 36);
        const cardH = 310;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 32;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#1A2936';
        ctx.fill();
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.font = '900 24px Fredoka, sans-serif';
        ctx.fillStyle = '#EF4444';
        ctx.textAlign = 'center';
        ctx.fillText('NO MORE MOVES!', this.width / 2, cardY + 48);

        ctx.font = '700 14px Inter, sans-serif';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('FINAL SCORE', this.width / 2, cardY + 86);

        ctx.font = '900 32px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.score.toLocaleString(), this.width / 2, cardY + 124);

        ctx.font = '700 13px Inter, sans-serif';
        ctx.fillStyle = '#2DD4BF';
        ctx.fillText('👑 All-Time Best: ' + this.allTimeBest.toLocaleString(), this.width / 2, cardY + 160);

        const btnW = 200, btnH = 48;
        const btnX = (this.width - btnW) / 2;
        const btnY = this.height * 0.64;

        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 24);
        ctx.fillStyle = '#38BDF8';
        ctx.fill();

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText('PLAY AGAIN 🔄', this.width / 2, btnY + 24);
        ctx.restore();
      }
    }

    function initGame() {
      const canvas = document.getElementById('gameCanvas');
      if (canvas && !window.game) {
        window.game = new NumberChainGame(canvas);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
