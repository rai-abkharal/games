  <script>
  (function() {
    'use strict';

    // Universal Bulletproof roundRect Implementation for 100% Android WebView Compatibility
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
      if (w === 0 || h === 0) return this;
      if (!radii) radii = 0;
      if (typeof radii === 'number') {
        radii = [radii, radii, radii, radii];
      } else if (Array.isArray(radii)) {
        if (radii.length === 1) radii = [radii[0], radii[0], radii[0], radii[0]];
        else if (radii.length === 2) radii = [radii[0], radii[1], radii[0], radii[1]];
        else if (radii.length === 3) radii = [radii[0], radii[1], radii[2], radii[1]];
        else if (radii.length >= 4) radii = [radii[0], radii[1], radii[2], radii[3]];
      } else {
        radii = [0, 0, 0, 0];
      }

      var maxR = Math.min(Math.abs(w) / 2, Math.abs(h) / 2);
      var rTL = Math.min(Math.max(0, Number(radii[0]) || 0), maxR);
      var rTR = Math.min(Math.max(0, Number(radii[1]) || 0), maxR);
      var rBR = Math.min(Math.max(0, Number(radii[2]) || 0), maxR);
      var rBL = Math.min(Math.max(0, Number(radii[3]) || 0), maxR);

      this.moveTo(x + rTL, y);
      this.lineTo(x + w - rTR, y);
      if (rTR > 0) this.quadraticCurveTo(x + w, y, x + w, y + rTR);
      this.lineTo(x + w, y + h - rBR);
      if (rBR > 0) this.quadraticCurveTo(x + w, y + h, x + w - rBR, y + h);
      this.lineTo(x + rBL, y + h);
      if (rBL > 0) this.quadraticCurveTo(x, y + h, x, y + h - rBL);
      this.lineTo(x, y + rTL);
      if (rTL > 0) this.quadraticCurveTo(x, y, x + rTL, y);
      this.closePath();
      return this;
    };

    // Timing table for the multi-phase screw animation. Values are fractions of
    // one move so the whole sequence can be eased from a single 0..1 progress.
    const MOVE_PHASE = {
      unscrewEnd: 0.24,
      travelEnd: 0.62,

    // ========================================================================
    // 2. PROCEDURAL SOUND SYNTHESIZER (Web Audio API)
    // ========================================================================
    // Every effect is synthesised on the fly: the bundle ships zero audio files
    // so it stays inside the mini-game size budget and works fully offline.
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.noiseBuffer = null;
        this.master = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          try {
            this.ctx = new AudioCtx();
          } catch (e) {
            this.ctx = null;
            return;
          }
          try {
            this.master = this.ctx.createGain();
            this.master.gain.value = 0.9;
            this.master.connect(this.ctx.destination);
          } catch (e) {
            this.master = null;
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      get out() {
        return this.master || (this.ctx ? this.ctx.destination : null);
      }

      ready() {
        if (this.isMuted) return false;
        this.init();
        return !!this.ctx;
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        return this.isMuted;
      }

      getNoiseBuffer() {
        if (this.noiseBuffer || !this.ctx) return this.noiseBuffer;
        const len = Math.floor(this.ctx.sampleRate * 0.35);
        const buffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < len; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        this.noiseBuffer = buffer;
        return buffer;
      }

      // One short filtered noise click - the atom of every metallic ratchet.
      click(time, freq, gainValue, dur) {
        const buffer = this.getNoiseBuffer();
        if (!buffer) return;
        const src = this.ctx.createBufferSource();
        const filter = this.ctx.createBiquadFilter();
        const gain = this.ctx.createGain();
        src.buffer = buffer;
        src.playbackRate.value = 1.4;
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(freq, time);
        filter.Q.value = 6;
        gain.gain.setValueAtTime(gainValue, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.out);
        src.start(time);
        src.stop(time + dur + 0.01);
      }

      tone(time, type, f0, f1, gainValue, dur, glideShape) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, time);
        if (glideShape === 'linear') {
          osc.frequency.linearRampToValueAtTime(f1, time + dur);
        } else {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, f1), time + dur);
        }
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(gainValue, time + Math.min(0.02, dur * 0.2));
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        osc.connect(gain);
        gain.connect(this.out);
        osc.start(time);
        osc.stop(time + dur + 0.02);
      }

      // Threaded ratchet: evenly spaced clicks whose pitch tracks the direction
      // of travel, so unscrewing and screwing read as opposite motions.
      ratchet(dur, clicks, startFreq, endFreq, gainValue) {
        if (!this.ready()) return;
        const t = this.ctx.currentTime;
        for (let i = 0; i < clicks; i++) {
          const k = clicks <= 1 ? 0 : i / (clicks - 1);
          const at = t + k * dur;
          const freq = startFreq + (endFreq - startFreq) * k;
          this.click(at, freq, gainValue * (0.75 + 0.25 * (1 - k)), 0.045);
        }
      }

      // Real physical mechanical unscrew ratchet: rapid metallic tooth clicks with upward resonance
      playUnscrew(units) {
        if (!this.ready()) return;
        const t = this.ctx.currentTime;
        const clicks = 14;
        const dur = 0.28;
        for (let i = 0; i < clicks; i++) {
          const at = t + (i / clicks) * dur;
          const freq = 2000 + (i / clicks) * 1600;
          this.click(at, freq, 0.16 * (1 - (i / clicks) * 0.25), 0.02);
        }
        this.tone(t, 'triangle', 340, 720, 0.14, 0.26, 'exp');
      }

      // Real physical mechanical screw ratchet: rapid metallic tooth clicks with downward resonance
      playScrew(units) {
        if (!this.ready()) return;
        const t = this.ctx.currentTime;
        const clicks = 14;
        const dur = 0.28;
        for (let i = 0; i < clicks; i++) {
          const at = t + (i / clicks) * dur;
          const freq = 3600 - (i / clicks) * 1600;
          this.click(at, freq, 0.16 * (0.75 + (i / clicks) * 0.25), 0.02);
        }
        this.tone(t, 'triangle', 720, 340, 0.14, 0.26, 'exp');
      }

      // Rich solid resonant steel clink: high-frequency metallic impulse + dual harmonic ring
      playSeat() {

        this.tone(t + 0.004, 'sine', 1080, 720, 0.18, 0.10, 'exp');
        this.tone(t + 0.008, 'triangle', 1620, 1080, 0.09, 0.08, 'exp');
      }

      playTap() {

      playSpecialWin() {

    // ========================================================================
    // 3. LEVEL GENERATOR (guaranteed solvable via reverse simulation)
    // ========================================================================
    class LevelGenerator {
      // Difficulty curve. Bolts grow longer, colours multiply, guidance fades
      // and hidden nuts appear so the ramp never spikes.
      static config(level) {
        const lvl = Math.max(1, level | 0);
        const isSpecial = lvl >= 10 && lvl % 10 === 0;

        // Bolt length (nuts per bolt) climbs with progression. Special levels
        // deliberately use the short 3-nut bolts from the reference art.
        let capacity = 4;
        if (isSpecial) capacity = 3;
        else if (lvl >= 25) capacity = 6;
        else if (lvl >= 13) capacity = 5;

        let colorCount;
        if (lvl === 1) colorCount = 1;
        else if (lvl === 2) colorCount = 2;
        else if (lvl <= 4) colorCount = 3;
        else if (lvl <= 6) colorCount = 4;
        else if (lvl <= 9) colorCount = 5;
        else if (lvl <= 14) colorCount = 6;
        else if (lvl <= 20) colorCount = 7;
        else colorCount = 8;
        if (isSpecial) colorCount = Math.min(NUT_PALETTE.length, colorCount + 1);

        // Free bolts the player can stage nuts on.
        let emptyBolts = lvl <= 2 ? 1 : 2;
        if (lvl >= 15 && !isSpecial) emptyBolts = 2;

        // The side storage bolt starts locked and is opened with the +BOLT booster.
        const lockedSlots = lvl >= 3 ? 1 : 0;

        // Hidden question-mark nuts from level 7 onward.
        let hiddenNuts = 0;
        if (lvl >= 7) {
          const total = colorCount * capacity;
          hiddenNuts = Math.min(Math.floor(total * 0.32), 2 + Math.floor((lvl - 7) / 2));
        }

        const scramble = Math.min(72, 12 + lvl * 3);
        const guidance = lvl <= 2;

        return {
          level: lvl, isSpecial, capacity, colorCount,
          emptyBolts, lockedSlots, hiddenNuts, scramble, guidance
        };
      }

      static makeNut(colorId) {
        return { c: colorId, hidden: false, reveal: 1 };
      }

      // Level 1 and 2 are hand authored so the tutorial beats land exactly:
      // one obvious move, then one colour-rule lesson with a spare bolt.
      static handcrafted(level) {
        if (level === 1) {
          return [[1], [1, 1, 1]];
        }
        if (level === 2) {
          return [[0, 1, 1, 1], [1, 0, 0, 0], []];
        }
        return null;
      }

      static generate(level) {
        const cfg = this.config(level);
        const scripted = this.handcrafted(cfg.level);
        if (scripted) {
          return {
            cfg,
            bolts: scripted.map(stack => stack.map(c => this.makeNut(c)))
          };
        }

        const capacity = cfg.capacity;
        const totalBolts = cfg.colorCount + cfg.emptyBolts;

        // Reverse scrambling alone can occasionally strand a board, because the
        // player must move a whole run while the scramble could move part of
        // one. Candidates are therefore rejected only when provably unsolvable.
        let raw = null;
        for (let attempt = 0; attempt < 12 && !raw; attempt++) {
          const candidate = this.scramble(cfg, capacity, totalBolts);
          if (candidate && this.verify(candidate, capacity, 1500) !== 'UNSOLVABLE') raw = candidate;
        }
        for (let attempt = 0; attempt < 8 && !raw; attempt++) {
          const candidate = this.fallback(cfg, capacity, totalBolts);
          if (this.verify(candidate, capacity, 1500) !== 'UNSOLVABLE') raw = candidate;
        }
        if (!raw) raw = this.fallback(cfg, capacity, totalBolts);

        const bolts = raw.map(stack => stack.map(c => this.makeNut(c)));
        this.applyHidden(bolts, cfg, capacity);
        return { cfg, bolts };
      }

      // Start from the solved board and walk legal moves backwards. Because
      // every scramble step is itself a legal move, the reverse path is always
      // a valid solution - the level can never be unsolvable.
      static scramble(cfg, capacity, totalBolts) {
        const bolts = [];
        for (let c = 0; c < cfg.colorCount; c++) {
          bolts.push(Array(capacity).fill(c));
        }
        for (let e = 0; e < cfg.emptyBolts; e++) {
          bolts.push([]);
        }

        let lastFrom = -1;
        let lastTo = -1;

        for (let step = 0; step < cfg.scramble; step++) {
          const moves = [];
          for (let i = 0; i < totalBolts; i++) {
            if (bolts[i].length === 0) continue;
            const color = bolts[i][bolts[i].length - 1];

            let topRun = 0;
            for (let k = bolts[i].length - 1; k >= 0; k--) {
              if (bolts[i][k] === color) topRun++;
              else break;
            }

            for (let j = 0; j < totalBolts; j++) {
              if (i === j) continue;
              if (i === lastTo && j === lastFrom) continue;
              if (bolts[j].length >= capacity) continue;
              const space = capacity - bolts[j].length;
              const count = Math.min(space, topRun, Math.random() < 0.72 ? 1 : 2);
              if (count > 0) moves.push({ from: i, to: j, count });
            }
          }

          if (moves.length === 0) break;
          const pick = moves[Math.floor(Math.random() * moves.length)];
          for (let m = 0; m < pick.count; m++) {
            bolts[pick.to].push(bolts[pick.from].pop());
          }
          lastFrom = pick.from;
          lastTo = pick.to;
        }

        // Enforce exact nut counts, full stacks on filled bolts, and clean empty bolts
        const counts = new Map();
        for (const stack of bolts) {
          for (const c of stack) counts.set(c, (counts.get(c) || 0) + 1);
        }
        for (let c = 0; c < cfg.colorCount; c++) {
          if (counts.get(c) !== capacity) return null;
        }

        const filledBolts = bolts.filter(b => b.length > 0);
        const emptyCount = bolts.filter(b => b.length === 0).length;
        if (filledBolts.length !== cfg.colorCount || emptyCount !== cfg.emptyBolts) return null;
        if (!filledBolts.every(b => b.length === capacity)) return null;

        const solved = bolts.every(s => s.length === 0 || (s.length === capacity && s.every(c => c === s[0])));
        if (solved) return null;

        return bolts;
      }

      static fallback(cfg, capacity, totalBolts) {
        const units = [];
        for (let c = 0; c < cfg.colorCount; c++) {
          for (let i = 0; i < capacity; i++) units.push(c);
        }
        for (let i = units.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = units[i];
          units[i] = units[j];
          units[j] = tmp;
        }
        const bolts = [];
        for (let i = 0; i < cfg.colorCount; i++) {
          bolts.push(units.slice(i * capacity, (i + 1) * capacity));
        }
        for (let e = 0; e < cfg.emptyBolts; e++) bolts.push([]);
        return bolts;
      }

      // Mask a share of the buried nuts. Only covered nuts may hide, so the
      // player always sees what is currently movable and uncovers the rest by
      // clearing whatever sits on top.
      static applyHidden(bolts, cfg, capacity) {
        if (cfg.hiddenNuts <= 0) return;
        const candidates = [];
        for (let b = 0; b < bolts.length; b++) {
          const stack = bolts[b];
          if (stack.length === capacity && stack.every(n => n.c === stack[0].c)) continue;
          for (let i = 0; i < stack.length - 1; i++) {
            candidates.push({ b, i });
          }
        }
        for (let i = candidates.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = candidates[i];
          candidates[i] = candidates[j];
          candidates[j] = tmp;
        }
        const take = Math.min(cfg.hiddenNuts, candidates.length);
        for (let k = 0; k < take; k++) {
          const spot = candidates[k];
          bolts[spot.b][spot.i].hidden = true;
          bolts[spot.b][spot.i].reveal = 0;
        }
      }

      // Best next move, preferring pours that finish or grow a matching run
      // before falling back to simply freeing a buried colour.
      static findHint(stacks, capacity) {
        const topColor = (s) => (s.length ? s[s.length - 1].c : null);
        const topRun = (s) => {
          if (!s.length) return 0;
          const c = topColor(s);
          let n = 0;
          for (let k = s.length - 1; k >= 0; k--) {
            if (s[k].c === c) n++;
            else break;
          }
          return n;
        };
        const isDone = (s) => s.length === capacity && s.every(n => n.c === s[0].c);

        let best = null;
        let bestScore = -1;
        for (let i = 0; i < stacks.length; i++) {
          const from = stacks[i];
          if (!from.length || isDone(from)) continue;
          const color = topColor(from);
          const run = topRun(from);

          for (let j = 0; j < stacks.length; j++) {
            if (i === j) continue;
            const to = stacks[j];
            const space = capacity - to.length;
            if (space <= 0) continue;
            if (to.length > 0 && topColor(to) !== color) continue;

            const moved = Math.min(run, space);
            if (moved <= 0) continue;

            let score = 0;
            if (to.length > 0) score += 40;                              // merges runs
            if (to.length + moved === capacity && to.length > 0) score += 60; // completes a bolt
            if (run === from.length && to.length === 0) score -= 35;     // pointless shuffle
            if (from.length - moved > 0 && from[from.length - moved - 1].hidden) score += 25; // uncovers
            score += moved * 6;

            if (score > bestScore) {
              bestScore = score;
              best = { from: i, to: j };
            }
          }
        }
        return best;
      }

      // Bounded search that proves whether a candidate board can actually be
      // finished under the player rule (whole top run, clipped to free space).
      // Nodes are never discarded, so an emptied frontier is real proof of
      // failure; running out of budget only means "not proven" and such boards
      // are accepted. Cost buckets keep the pop cheap enough to run on level
      // start without a visible hitch.
      static verify(stacks, capacity, budget) {
        const isDone = (st) => st.every(s => s.length === 0 || (s.length === capacity && s.every(c => c === s[0])));
        if (isDone(stacks)) return 'SOLVED';

        const keyOf = (st) => {
          const parts = [];
          for (let i = 0; i < st.length; i++) parts.push(st[i].join(','));
          parts.sort();
          return parts.join('|');
        };
        const cost = (st) => {
          let bad = 0;
          for (const s of st) {
            if (!s.length) continue;
            let base = 1;
            while (base < s.length && s[base] === s[0]) base++;
            bad += s.length - base;
          }
          return bad;
        };

        const buckets = [];
        let frontierSize = 0;
        let minCost = Infinity;
        const push = (st) => {
          const h = cost(st);
          if (!buckets[h]) buckets[h] = [];
          buckets[h].push(st);
          frontierSize++;
          if (h < minCost) minCost = h;
        };
        const pop = () => {
          if (frontierSize === 0) return null;
          while (!buckets[minCost] || buckets[minCost].length === 0) minCost++;
          frontierSize--;
          return buckets[minCost].pop();
        };

        const seen = new Set();
        seen.add(keyOf(stacks));
        push(stacks.map(s => s.slice()));

        let visits = 0;
        while (frontierSize > 0) {
          if (visits >= budget) return 'UNKNOWN';
          const st = pop();
          visits++;

          for (let i = 0; i < st.length; i++) {
            const from = st[i];
            if (!from.length) continue;
            const color = from[from.length - 1];
            let run = 0;
            for (let k = from.length - 1; k >= 0; k--) {
              if (from[k] === color) run++;
              else break;
            }
            if (from.length === capacity && run === capacity) continue;

            for (let j = 0; j < st.length; j++) {
              if (i === j) continue;
              const to = st[j];
              const space = capacity - to.length;
              if (space <= 0) continue;
              if (to.length > 0 && to[to.length - 1] !== color) continue;
              // Relocating a whole single-colour stack onto a bare post yields
              // an equivalent board, so it is pruned to stop endless shuffling.
              if (run === from.length && to.length === 0) continue;

              const moved = Math.min(run, space);
              const next = st.map(s => s.slice());
              const taken = next[i].splice(next[i].length - moved, moved);
              for (let q = 0; q < taken.length; q++) next[j].push(taken[q]);
              if (isDone(next)) return 'SOLVED';
              const nk = keyOf(next);
              if (seen.has(nk)) continue;
              seen.add(nk);
              push(next);
            }
          }
        }
        return 'UNSOLVABLE';
      }

      static isSolved(stacks, capacity) {
        return stacks.every(s => s.length === 0 || (s.length === capacity && s.every(n => n.c === s[0].c)));
      }
    }

    // ========================================================================
    // 4. VECTOR ART - NUTS, THREADED BOLTS, WASHERS & UI GLYPHS
    // ========================================================================
    function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInCubic(t) { return t * t * t; }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function easeOutBack(t) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function easeOutElastic(t) {
      if (t <= 0) return 0;
      if (t >= 1) return 1;
      const p = 0.32;
      return Math.pow(2, -10 * t) * Math.sin((t - p / 4) * (Math.PI * 2) / p) + 1;
    }

    const HEX_CACHE = new Map();
    function parseHex(hex) {
      let v = HEX_CACHE.get(hex);
      if (v) return v;
      const h = hex.replace('#', '');
      v = {
        r: parseInt(h.substring(0, 2), 16),
        g: parseInt(h.substring(2, 4), 16),
        b: parseInt(h.substring(4, 6), 16)
      };
      HEX_CACHE.set(hex, v);
      return v;
    }
    function mixHex(a, b, t) {
      const ca = parseHex(a), cb = parseHex(b);
      const r = Math.round(lerp(ca.r, cb.r, t));
      const g = Math.round(lerp(ca.g, cb.g, t));
      const bl = Math.round(lerp(ca.b, cb.b, t));
      return 'rgb(' + r + ',' + g + ',' + bl + ')';
    }
    function shade(hex, alpha) {
      const c = parseHex(hex);
      return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
    }

    const Art = {
      // Flattened hexagon: the isometric footprint every nut is built from.
      hexPoints(cx, cy, rx, ry, spin) {
        const pts = [];
        const base = spin || 0;
        for (let i = 0; i < 6; i++) {
          const a = base + i * (Math.PI / 3);
          pts.push({ x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) });
        }
        return pts;
      },

      tracePoly(ctx, pts, dy) {
        const off = dy || 0;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y + off);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y + off);
        ctx.closePath();
      },

      // A single real hex nut: solid 3D hexagonal prism with VERTICAL corner facet lines,
      // no middle horizontal cut, central white bolt core, and lowered question mark.
     drawNut(ctx, cx, cy, rx, ry, bandH, spin, skin, opts) {
    const o = opts || {};
    const pts = this.hexPoints(cx, cy, rx, ry, spin);
    const holeRx = rx * 0.38, holeRy = ry * 0.38;
    const color = skin.body || '#FFC700';
    const light = skin.top || '#FFD54F';
    const dark = skin.shadow || '#FFA000';
    
    // ===== SIDE FACES - REAL 3D HEXAGON =====
    for (let i = 0; i < 6; i++) {
        const p1 = pts[i];
        const p2 = pts[(i + 1) % 6];
        
        // Only draw visible faces (facing viewer)
        const midX = (p1.x + p2.x) / 2;
        if (midX > cx - rx * 0.2) {
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p2.x, p2.y + bandH);
            ctx.lineTo(p1.x, p1.y + bandH);
            ctx.closePath();
            
            // Face lighting based on angle
            const angle = (i / 6) * Math.PI * 2;
            const bright = 0.5 + 0.5 * Math.cos(angle - Math.PI/6);
            const faceColor = i % 2 === 0 ? 
                mixHex(color, dark, 0.2 * (1 - bright)) :
                mixHex(color, light, 0.3 * bright);
            ctx.fillStyle = faceColor;
            ctx.fill();
            
            // Edge lines for definition
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.stroke();
        }
    }
    
    // ===== TOP FACE - WITH SHINE =====
    this.tracePoly(ctx, pts, 0);
    const topGrad = ctx.createRadialGradient(
        cx - rx*0.3, cy - ry*0.3, 0,
        cx, cy, rx
    );
    topGrad.addColorStop(0, light);
    topGrad.addColorStop(0.5, color);
    topGrad.addColorStop(1, dark);
    ctx.fillStyle = topGrad;
    ctx.fill();
    
    // Top shine spot
    ctx.beginPath();
    ctx.ellipse(cx - rx*0.2, cy - ry*0.3, rx*0.25, ry*0.18, -0.3, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fill();
    
    // ===== BOTTOM SHADOW =====
    this.tracePoly(ctx, pts, bandH);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fill();
    
    // ===== HOLE - BOLT CORE =====
    if (o.shaftThrough !== false && !o.isFlying) {
        // White bolt shaft visible through hole
        ctx.beginPath();
        ctx.ellipse(cx, cy, holeRx, holeRy, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#F0F4FA';
        ctx.fill();
        
        // Thread lines inside hole
        for (let t = -2; t <= 2; t++) {
            ctx.beginPath();
            ctx.ellipse(cx, cy + t * holeRy * 0.3, holeRx * 0.8, holeRy * 0.15, 0, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(180,195,215,0.5)';
            ctx.lineWidth = 0.8;
            ctx.stroke();
        }
    } else {
        // Dark hollow
        ctx.beginPath();
        ctx.ellipse(cx, cy, holeRx, holeRy, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#1A2035';
        ctx.fill();
    }
    
    // ===== CORNER HIGHLIGHTS =====
    for (let i = 0; i < 6; i++) {
        const p = pts[i];
        if (p.y < cy) {
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + 1, p.y + bandH * 0.2);
            ctx.strokeStyle = 'rgba(255,255,255,0.15)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }
    }
    
    // ===== QUESTION MARK =====
    if (o.questionMark) {
        ctx.save();
        const qy = cy + bandH * 0.7;
        const qr = Math.min(rx * 0.32, bandH * 0.32);
        
        // Circle background
        ctx.beginPath();
        ctx.ellipse(cx, qy, qr, qr * 0.85, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#90A4AE';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        
        // Question text
        ctx.font = '900 ' + Math.round(rx * 0.7) + 'px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('?', cx, qy + 1);
        ctx.restore();
    }
}
    };

    Object.assign(Art, {
      // Threaded shaft. Clean white/silver threaded cylinder matching reference screenshots.
      drawShaft(ctx, cx, topY, bottomY, w, phase) {
        const h = bottomY - topY;
        if (h <= 1 || w <= 1) return;
        const x = cx - w / 2;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(x, topY, w, h, [w * 0.5, w * 0.5, w * 0.18, w * 0.18]);
        const body = ctx.createLinearGradient(x, 0, x + w, 0);
        body.addColorStop(0, '#D6DDEB');
        body.addColorStop(0.22, '#F4F6FB');
        body.addColorStop(0.48, '#FFFFFF');
        body.addColorStop(0.74, '#F0F3F9');
        body.addColorStop(1, '#D0D8E8');
        ctx.fillStyle = body;
        ctx.fill();

        // Stationary threaded ridges
        ctx.clip();
        const step = Math.max(3.2, w * 0.34);
        const bow = w * 0.16;
        ctx.lineWidth = Math.max(1, step * 0.28);
        for (let y = topY - step; y < bottomY + step; y += step) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(cx, y + bow, x + w, y);
          ctx.strokeStyle = 'rgba(165, 175, 198, 0.65)';
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(x, y - ctx.lineWidth * 0.85);
          ctx.quadraticCurveTo(cx, y + bow - ctx.lineWidth * 0.85, x + w, y - ctx.lineWidth * 0.85);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.stroke();
        }
        ctx.restore();

        // Domed tip catches the light.
        ctx.beginPath();
        ctx.ellipse(cx - w * 0.06, topY + w * 0.24, w * 0.26, w * 0.16, -0.3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fill();
      },

      // The washer plate every bolt stands on. Clean double-tier white washer disc matching reference.
      drawBase(ctx, cx, cy, rx, ry) {
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.55, rx * 1.02, ry * 0.7, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(4, 6, 28, 0.38)';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.32, rx, ry, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#CFD7E6';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        const g = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx * 0.6, cy + ry);
        g.addColorStop(0, '#FFFFFF');
        g.addColorStop(0.55, '#F0F3F8');
        g.addColorStop(1, '#CFD7E6');
        ctx.fillStyle = g;
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.12, cy - ry * 0.18, rx * 0.62, ry * 0.52, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fill();
      },

      // Clean, elegant metallic white dome cap seamlessly matching the bolt
      drawBoltCap(ctx, cx, cy, rx, ry, glow) {
        // Drop shadow under cap
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.22, rx * 0.68, ry * 0.42, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fill();

        // Silver-white washer cap rim
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.10, rx * 0.64, ry * 0.40, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#C2C8DA';
        ctx.fill();

        // Top domed cap with smooth metallic white/silver gradient matching bolt
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx * 0.64, ry * 0.40, 0, 0, Math.PI * 2);
        const g = ctx.createLinearGradient(cx - rx * 0.5, cy - ry * 0.35, cx + rx * 0.5, cy + ry * 0.35);
        g.addColorStop(0, '#FFFFFF');
        g.addColorStop(0.32, '#ECEFF8');
        g.addColorStop(0.72, '#C8D0E4');
        g.addColorStop(1, '#A0AABF');
        ctx.fillStyle = g;
        ctx.fill();

        ctx.lineWidth = 1.2;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.stroke();

        // Center stud / allen bolt head matching reference
        ctx.beginPath();
        ctx.ellipse(cx, cy, rx * 0.22, ry * 0.14, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#78829C';
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(cx - rx * 0.04, cy - ry * 0.03, rx * 0.07, ry * 0.045, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
      },

      // Dormant side-storage socket: a capped stub the +BOLT booster opens.
      drawLockedSocket(ctx, cx, cy, rx, ry, pulse) {
        ctx.beginPath();
        ctx.ellipse(cx, cy + ry * 0.5, rx * 0.98, ry * 0.66, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(4, 8, 40, 0.5)';
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
        const g = ctx.createLinearGradient(cx - rx, cy - ry, cx + rx * 0.5, cy + ry);
        g.addColorStop(0, METAL.lockedTop);
        g.addColorStop(1, METAL.lockedEdge);
        ctx.fillStyle = g;
        ctx.fill();

        // Capped screw stub with a few visible ridges.
        const stubW = rx * 0.44;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cx - stubW / 2, cy - ry * 1.5, stubW, ry * 1.7, stubW * 0.32);
        ctx.fillStyle = METAL.lockedFace;
        ctx.fill();
        ctx.clip();
        ctx.lineWidth = 1.6;
        ctx.strokeStyle = 'rgba(180, 188, 220, 0.42)';
        for (let y = cy - ry * 1.42; y < cy + ry * 0.2; y += Math.max(3, stubW * 0.34)) {
          ctx.beginPath();
          ctx.moveTo(cx - stubW, y);
          ctx.lineTo(cx + stubW, y + stubW * 0.14);
          ctx.stroke();
        }
        ctx.restore();

        if (pulse > 0) {
          ctx.beginPath();
          ctx.ellipse(cx, cy, rx * (1 + pulse * 0.25), ry * (1 + pulse * 0.25), 0, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(180, 140, 255, ' + (0.5 * (1 - pulse)).toFixed(3) + ')';
          ctx.lineWidth = 2.4;
          ctx.stroke();
        }
      }
    });

    Object.assign(Art, {
      // --- UI glyphs: all vector paths, no emoji or bitmap assets ----------
      glyphNut(ctx, cx, cy, r, fill, stroke) {
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const a = -Math.PI / 2 + i * (Math.PI / 3);
          const x = cx + r * Math.cos(a);
          const y = cy + r * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.lineWidth = Math.max(1.2, r * 0.16);
          ctx.strokeStyle = stroke;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.36, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
        ctx.fill();
      },

      glyphCoin(ctx, cx, cy, r) {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = r * 0.5;
        ctx.shadowOffsetY = r * 0.16;
        this.glyphNut(ctx, cx, cy, r, '#FFC01F', '#E08A00');
        ctx.restore();
        ctx.beginPath();
        ctx.arc(cx, cy, r * 0.34, 0, Math.PI * 2);
        ctx.fillStyle = '#FFF3C4';
        ctx.fill();
      },

      glyphRestart(ctx, cx, cy, r, color) {
        ctx.save();
        ctx.lineWidth = Math.max(2, r * 0.3);
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx, cy, r, Math.PI * 0.62, Math.PI * 2.18);
        ctx.stroke();
        // Arrow head on the open end of the loop.
        const a = Math.PI * 0.62;
        const hx = cx + r * Math.cos(a);
        const hy = cy + r * Math.sin(a);
        ctx.beginPath();
        ctx.moveTo(hx - r * 0.42, hy - r * 0.1);
        ctx.lineTo(hx + r * 0.12, hy + r * 0.34);
        ctx.lineTo(hx + r * 0.2, hy - r * 0.42);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      },

      glyphUndo(ctx, cx, cy, r, color) {
        ctx.save();
        ctx.lineWidth = Math.max(2.4, r * 0.34);
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(cx + r * 0.1, cy + r * 0.06, r * 0.86, Math.PI * 1.15, Math.PI * 0.35);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.98, cy - r * 0.62);
        ctx.lineTo(cx - r * 0.2, cy - r * 0.42);
        ctx.lineTo(cx - r * 0.7, cy + r * 0.3);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      },

      glyphAddBolt(ctx, cx, cy, r, color) {
        ctx.save();
        // Miniature bolt: washer, shaft and two stacked nuts.
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.ellipse(cx + r * 0.12, cy + r * 0.82, r * 0.7, r * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(cx - r * 0.12, cy - r * 0.75, r * 0.46, r * 1.5, r * 0.2);
        ctx.fill();
        ctx.globalAlpha = 0.55;
        ctx.lineWidth = Math.max(1, r * 0.12);
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 4; i++) {
          const y = cy - r * 0.62 + i * r * 0.3;
          ctx.beginPath();
          ctx.moveTo(cx - r * 0.12, y);
          ctx.lineTo(cx + r * 0.34, y + r * 0.08);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.roundRect(cx - r * 0.5, cy + r * 0.14, r * 1.22, r * 0.34, r * 0.12);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(cx - r * 0.44, cy - r * 0.28, r * 1.1, r * 0.32, r * 0.12);
        ctx.fill();
        // Plus badge.
        const px = cx - r * 0.82, py = cy - r * 0.62;
        ctx.lineWidth = Math.max(2, r * 0.26);
        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px - r * 0.3, py);
        ctx.lineTo(px + r * 0.3, py);
        ctx.moveTo(px, py - r * 0.3);
        ctx.lineTo(px, py + r * 0.3);
        ctx.stroke();
        ctx.restore();
      },

      glyphLock(ctx, cx, cy, r, fill, accent) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.lineWidth = Math.max(1.6, r * 0.24);
        ctx.strokeStyle = accent;
        ctx.beginPath();
        ctx.arc(cx, cy - r * 0.16, r * 0.34, Math.PI, 0);
        ctx.stroke();
        ctx.beginPath();
        ctx.roundRect(cx - r * 0.46, cy - r * 0.16, r * 0.92, r * 0.72, r * 0.2);
        ctx.fillStyle = accent;
        ctx.fill();
        ctx.restore();
      },

      glyphStar(ctx, cx, cy, r, fill, stroke) {
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? r : r * 0.46;
          const a = -Math.PI / 2 + i * (Math.PI / 5);
          const x = cx + rad * Math.cos(a);
          const y = cy + rad * Math.sin(a);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        if (stroke) {
          ctx.lineWidth = Math.max(1.2, r * 0.12);
          ctx.strokeStyle = stroke;
          ctx.stroke();
        }
      },

      glyphCheck(ctx, cx, cy, r, color) {
        ctx.save();
        ctx.lineWidth = Math.max(3, r * 0.42);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.8, cy);
        ctx.lineTo(cx - r * 0.16, cy + r * 0.62);
        ctx.lineTo(cx + r * 0.86, cy - r * 0.66);
        ctx.stroke();
        ctx.restore();
      },

      glyphCross(ctx, cx, cy, r, color) {
        ctx.save();
        ctx.lineWidth = Math.max(3, r * 0.42);
        ctx.lineCap = 'round';
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx - r * 0.68, cy - r * 0.68);
        ctx.lineTo(cx + r * 0.68, cy + r * 0.68);
        ctx.moveTo(cx + r * 0.68, cy - r * 0.68);
        ctx.lineTo(cx - r * 0.68, cy + r * 0.68);
        ctx.stroke();
        ctx.restore();
      },

      // Tutorial finger. Points up-left exactly like the reference art.
      glyphHand(ctx, cx, cy, size) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(size, size);
        ctx.beginPath();
        ctx.moveTo(-0.30, -0.02);
        ctx.lineTo(-0.14, -0.94);
        ctx.quadraticCurveTo(0.02, -1.14, 0.18, -0.94);
        ctx.lineTo(0.15, -0.12);
        ctx.quadraticCurveTo(0.40, -0.30, 0.58, -0.16);
        ctx.quadraticCurveTo(0.74, -0.02, 0.60, 0.12);
        ctx.quadraticCurveTo(0.80, 0.20, 0.64, 0.36);
        ctx.quadraticCurveTo(0.78, 0.48, 0.56, 0.62);
        ctx.quadraticCurveTo(0.38, 0.88, 0.02, 0.90);
        ctx.quadraticCurveTo(-0.44, 0.90, -0.62, 0.52);
        ctx.quadraticCurveTo(-0.76, 0.22, -0.56, 0.00);
        ctx.closePath();
        ctx.lineJoin = 'round';
        ctx.lineWidth = 0.14;
        ctx.strokeStyle = '#8A45E8';
        ctx.stroke();
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();
      },

      glyphChevron(ctx, cx, cy, r, color) {
        ctx.save();
        ctx.lineWidth = Math.max(2.4, r * 0.34);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(cx + r * 0.34, cy - r * 0.66);
        ctx.lineTo(cx - r * 0.34, cy);
        ctx.lineTo(cx + r * 0.34, cy + r * 0.66);
        ctx.stroke();
        ctx.restore();
      }
    });

    // ========================================================================
    // 5. NUT SPRITE CACHE
    // ========================================================================
    // Resting nuts never rotate, so each colour/size pair is rasterised once
    // and blitted afterwards. Only the handful of nuts in flight are redrawn
    // per frame, which keeps large boards cheap on low-end WebViews.
    class NutSpriteCache {
      constructor() {
        this.map = new Map();
        this.dpr = 1;
      }

      configure(dpr) {
        if (Math.abs(dpr - this.dpr) > 0.01) {
          this.dpr = dpr;
          this.map.clear();
        }
      }

      invalidate() {
        this.map.clear();
      }

      get(colorId, hidden, rx, ry, band) {
        const cid = hidden ? 0 : (colorId % NUT_PALETTE.length);
        const rxI = Math.round(rx * 2) / 2;
        const bandI = Math.round(band * 2) / 2;
        const key = cid + '|' + (hidden ? 1 : 0) + '|' + rxI + '|' + bandI;
        let sprite = this.map.get(key);
        if (sprite) return sprite;

        const pad = Math.ceil(rx * 0.3) + 3;
        const w = Math.ceil(rx * 2 + pad * 2);
        const h = Math.ceil(ry * 2 + band + pad * 2);
        const cv = document.createElement('canvas');
        cv.width = Math.max(2, Math.ceil(w * this.dpr));
        cv.height = Math.max(2, Math.ceil(h * this.dpr));
        const c = cv.getContext('2d');
        if (!c) return null;
        c.scale(this.dpr, this.dpr);

        const ax = pad + rx;
        const ay = pad + ry;
        const skin = hidden ? HIDDEN_SKIN : NUT_PALETTE[cid];
        Art.drawNut(c, ax, ay, rx, ry, band, 0, skin, { questionMark: hidden, shaftThrough: true });

        sprite = { canvas: cv, w: w, h: h, ax: ax, ay: ay };
        this.map.set(key, sprite);
        return sprite;
      }
    }

    // ========================================================================
    // 6. BOLT (one threaded post plus the nuts stacked on it)
    // ========================================================================
    class Bolt {
      constructor(nuts, capacity, opts) {
        const o = opts || {};
        this.nuts = nuts || [];
        this.capacity = capacity;
        this.locked = !!o.locked;
        this.isSide = !!o.isSide;

        // Layout, refreshed on every resize.
        this.x = 0;
        this.baseY = 0;
        this.rx = 26;
        this.ry = 13;
        this.band = 15;
        this.shaftExtra = 22;
        this.shaftW = 16;

        // Animation state.
        this.complete = false;
        this.completeGlow = 0;
        this.shine = -1;
        this.lift = 0;
        this.liftTarget = 0;
        this.shake = 0;
        this.unlockPulse = 0;
        this.hintPulse = 0;
        this.isHintSource = false;
        this.isHintTarget = false;
        this.spawnScale = 1;
        this.threadPhase = 0;
        this.guideMark = 0; // 1 valid, -1 invalid, 0 none
      }

      get length() { return this.nuts.length; }
      get isEmpty() { return this.nuts.length === 0; }
      get isFull() { return this.nuts.length >= this.capacity; }
      get freeSpace() { return this.capacity - this.nuts.length; }
      get topColor() {
        if (!this.nuts.length) return null;
        const top = this.nuts[this.nuts.length - 1];
        return top.hidden ? null : top.c;
      }

      topRun() {
        if (!this.nuts.length) return 0;
        const top = this.nuts[this.nuts.length - 1];
        if (top.hidden) return 0;
        const c = top.c;
        let n = 0;
        for (let i = this.nuts.length - 1; i >= 0; i--) {
          if (!this.nuts[i].hidden && this.nuts[i].c === c) n++;
          else break;
        }
        return n;
      }

      refreshComplete() {
        if (this.isSide) {
          this.complete = false;
          return false;
        }
        const done = this.nuts.length === this.capacity &&
          this.nuts.every(n => n.c === this.nuts[0].c && !n.hidden);
        const justFinished = done && !this.complete;
        this.complete = done;
        return justFinished;
      }

      // A nut may land here when the post is unlocked, has room, and the
      // landing surface is either bare metal or the same colour.
      canAccept(colorId) {
        if (this.locked || this.isFull) return false;
        if (this.isEmpty) return true;
        return this.topColor === colorId;
      }

      // Geometry -----------------------------------------------------------
      nutSlotY(index) {
        return this.baseY - this.ry * 0.1 - this.band * (index + 1);
      }

      get shaftTopY() {
        return this.baseY - this.ry * 0.1 - this.band * this.capacity - this.shaftExtra;
      }

      hoverY() {
        return this.shaftTopY - this.band * 1.9;
      }

      // Hit box spans the washer plus the whole shaft so taps feel generous.
      hitTest(px, py) {
        const halfW = this.rx * 1.25;
        const top = this.shaftTopY - this.band * 0.6;
        const bottom = this.baseY + this.ry * 1.6;
        return px >= this.x - halfW && px <= this.x + halfW && py >= top && py <= bottom;
      }

      update(dt) {
        this.lift += (this.liftTarget - this.lift) * Math.min(1, dt * 16);
        if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 5.5);
        if (this.unlockPulse > 0) this.unlockPulse = Math.max(0, this.unlockPulse - dt * 1.6);
        if (this.shine >= 0) {
          this.shine += dt * 1.75;
          if (this.shine > 1) this.shine = -1;
        }
        if (this.complete) {
          this.completeGlow = Math.min(1, this.completeGlow + dt * 3);
        } else {
          this.completeGlow = Math.max(0, this.completeGlow - dt * 4);
        }
        if (this.isHintSource || this.isHintTarget) {
          this.hintPulse += dt * 3.4;
        } else {
          this.hintPulse = 0;
        }
        if (this.spawnScale < 1) {
          this.spawnScale = Math.min(1, this.spawnScale + dt * 4.2);
        }
        for (const nut of this.nuts) {
          if (nut.reveal < 1) nut.reveal = Math.min(1, nut.reveal + dt * 3.6);
        }
      }
    }

    // ========================================================================
    // 7. PARTICLE SYSTEM
    // ========================================================================
    class ParticleSystem {
      constructor() {
        this.items = [];
      }

      clear() { this.items = []; }

      update(dt) {
        for (let i = this.items.length - 1; i >= 0; i--) {
          const p = this.items[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;

          if (p.type === 'SPARK' || p.type === 'CONFETTI') {
            p.vy += 640 * dt;
            p.vx *= 0.985;
          } else if (p.type === 'STAR') {
            p.vy += 180 * dt;
            p.vx *= 0.97;
          } else if (p.type === 'SIDE_TWINKLE') {
            p.y += p.vy * dt;
            p.x += p.vx * dt;
          } else if (p.type === 'STAR_SWEEP') {
            const distToMid = Math.abs(p.x - p.midX);
            const midFrac = clamp(distToMid / (p.midX * 0.88), 0, 1);
            p.alpha = midFrac * Math.min(1, p.life / (p.maxLife * 0.25));
          } else if (p.type === 'GLINT') {
            p.vy += 12 * dt;
          } else if (p.type === 'POP') {
            p.vy *= 0.93;
          } else if (p.type === 'RING') {
            p.radius += p.grow * dt;
          }

          if (p.vRot) p.rot += p.vRot * dt;
          p.life -= dt;
          if (p.life <= 0) this.items.splice(i, 1);
        }
      }

      render(ctx) {
        for (const p of this.items) {
          const k = Math.max(0, p.life / p.maxLife);
          ctx.save();

          if (p.type === 'SPARK') {
            ctx.globalAlpha = Math.min(1, k * 1.6);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.35 + k * 0.65), 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
          } else if (p.type === 'CONFETTI') {
            ctx.globalAlpha = Math.min(1, k * 1.5);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size * 0.5, -p.size * 0.22, p.size, p.size * 0.44);
          } else if (p.type === 'STAR') {
            ctx.globalAlpha = Math.min(1, k * 1.5);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            Art.glyphStar(ctx, 0, 0, p.size * (0.4 + k * 0.6), p.color, null);
          } else if (p.type === 'SIDE_TWINKLE') {
            const twinkle = Math.abs(Math.sin((p.maxLife - p.life) * 8 + (p.pulseOffset || 0)));
            ctx.globalAlpha = Math.min(1, k * 1.6) * (0.3 + twinkle * 0.7);
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            Art.glyphStar(ctx, 0, 0, p.size * (0.4 + twinkle * 0.6), p.color, '#FFFFFF');
          } else if (p.type === 'STAR_SWEEP') {
            const starAlpha = p.alpha !== undefined ? p.alpha : Math.min(1, k * 1.5);
            ctx.globalAlpha = starAlpha;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            Art.glyphStar(ctx, 0, 0, p.size * (0.45 + k * 0.55), p.color, '#FFFFFF');
          } else if (p.type === 'GLINT') {
            // Four-point twinkle used for the board-wide celebration sparkle.
            const s = p.size * (0.35 + Math.sin(k * Math.PI) * 0.75);
            ctx.globalAlpha = Math.sin(Math.min(1, k) * Math.PI) * 0.95;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(0, -s);
            ctx.quadraticCurveTo(s * 0.16, -s * 0.16, s, 0);
            ctx.quadraticCurveTo(s * 0.16, s * 0.16, 0, s);
            ctx.quadraticCurveTo(-s * 0.16, s * 0.16, -s, 0);
            ctx.quadraticCurveTo(-s * 0.16, -s * 0.16, 0, -s);
            ctx.closePath();
            ctx.fill();
          } else if (p.type === 'RING') {
            ctx.globalAlpha = k * 0.6;
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, p.radius, p.radius * 0.42, 0, 0, Math.PI * 2);
            ctx.strokeStyle = p.color;
            ctx.lineWidth = Math.max(1.2, p.size * k);
            ctx.stroke();
          } else if (p.type === 'POP') {
            const scale = 1 + (1 - k) * 0.35;
            ctx.globalAlpha = Math.min(1, k * 1.8);
            ctx.translate(p.x, p.y);
            ctx.scale(scale, scale);
            ctx.font = '900 ' + Math.round(p.size) + 'px Fredoka, Lilita One, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(6, 8, 34, 0.5)';
            ctx.fillText(p.text, 2, 2);
            ctx.fillStyle = p.color;
            ctx.fillText(p.text, 0, 0);
          }

          ctx.restore();
        }
      }

      // Metal-on-metal sparks when a nut seats onto a bolt.
      seatSparks(x, y, colorId, count) {
        const pal = NUT_PALETTE[colorId % NUT_PALETTE.length];
        const n = count || 10;
        for (let i = 0; i < n; i++) {
          const a = -Math.PI * 0.9 + Math.random() * Math.PI * 0.8;
          const sp = 60 + Math.random() * 150;
          this.items.push({
            type: 'SPARK', x: x + (Math.random() - 0.5) * 14, y: y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.28 + Math.random() * 0.26, maxLife: 0.54,
            size: 1.8 + Math.random() * 2.6,
            color: pal.sparks[Math.floor(Math.random() * pal.sparks.length)]
          });
        }
      }

      dustRing(x, y, colorId, radius) {
        const pal = NUT_PALETTE[colorId % NUT_PALETTE.length];
        this.items.push({
          type: 'RING', x: x, y: y, vx: 0, vy: 0,
          radius: radius * 0.4, grow: radius * 2.6,
          life: 0.42, maxLife: 0.42, size: 3, color: pal.rim
        });
      }

      // Burst that celebrates one bolt being fully sorted.
      groupBurst(x, y, colorId) {
        const pal = NUT_PALETTE[colorId % NUT_PALETTE.length];
        for (let i = 0; i < 20; i++) {
          const a = Math.random() * Math.PI * 2;
          const sp = 70 + Math.random() * 190;
          this.items.push({
            type: Math.random() < 0.55 ? 'STAR' : 'SPARK',
            x: x, y: y,
            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40,
            life: 0.5 + Math.random() * 0.5, maxLife: 1.0,
            size: 3.4 + Math.random() * 4.6, rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 9,
            color: pal.sparks[Math.floor(Math.random() * pal.sparks.length)]
          });
        }
      }

      // Sparkle field that sweeps in from the left on a successful sort.
      sparkleSweep(w, h, delayBias) {
        const colors = ['#FFFFFF', '#FFE9A0', '#B6E4FF', '#FFD3E4', '#DCF7B4'];
        for (let i = 0; i < 34; i++) {
          const px = Math.random() * w;
          const py = h * 0.12 + Math.random() * h * 0.72;
          this.items.push({
            type: 'GLINT', x: px, y: py,
            vx: 26 + Math.random() * 34, vy: -8 + Math.random() * 16,
            life: 0.5 + (px / w) * 0.5 + (delayBias || 0),
            maxLife: 0.5 + (px / w) * 0.5 + (delayBias || 0),
            size: 3 + Math.random() * 6, rot: Math.random() * 1.2,
            vRot: (Math.random() - 0.5) * 1.6,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      fireworks(w, h) {
        const colors = ['#FFC01F', '#2AA5F0', '#7FD525', '#FF5B2E', '#C348C0', '#FFFFFF', '#18C8B8'];
        for (let f = 0; f < 3; f++) {
          const cx = w * 0.2 + Math.random() * w * 0.6;
          const cy = h * 0.18 + Math.random() * h * 0.34;
          for (let i = 0; i < 30; i++) {
            const a = Math.random() * Math.PI * 2;
            const sp = 100 + Math.random() * 280;
            this.items.push({
              type: Math.random() < 0.5 ? 'CONFETTI' : 'STAR',
              x: cx, y: cy,
              vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
              life: 0.9 + Math.random() * 0.8, maxLife: 1.7,
              size: 6 + Math.random() * 6, rot: Math.random() * 6.28,
              vRot: (Math.random() - 0.5) * 10,
              color: colors[Math.floor(Math.random() * colors.length)]
            });
          }
        }
      }

      confettiCannon(w, h) {
        const colors = ['#FFC01F', '#2AA5F0', '#7FD525', '#FF5B2E', '#C348C0', '#FFFFFF', '#18C8B8', '#FF6FA8', '#FFE9A0'];
        // Left cannon shooting up-right towards center
        for (let i = 0; i < 48; i++) {
          const a = -Math.PI * 0.48 + (Math.random() - 0.5) * 0.45;
          const sp = 720 + Math.random() * 480;
          this.items.push({
            type: 'CONFETTI',
            x: w * 0.08 + (Math.random() - 0.5) * 24,
            y: h * 0.98,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            life: 2.2 + Math.random() * 1.8,
            maxLife: 4.0,
            size: 9 + Math.random() * 9,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 14,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
        // Right cannon shooting up-left towards center
        for (let i = 0; i < 48; i++) {
          const a = -Math.PI * 0.52 + (Math.random() - 0.5) * 0.45;
          const sp = 720 + Math.random() * 480;
          this.items.push({
            type: 'CONFETTI',
            x: w * 0.92 + (Math.random() - 0.5) * 24,
            y: h * 0.98,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp,
            life: 2.2 + Math.random() * 1.8,
            maxLife: 4.0,
            size: 9 + Math.random() * 9,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 14,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
        // Golden stars bursting high and falling gently
        for (let i = 0; i < 36; i++) {
          this.items.push({
            type: 'STAR',
            x: w * 0.12 + Math.random() * w * 0.76,
            y: h * 0.12 + Math.random() * h * 0.38,
            vx: (Math.random() - 0.5) * 80,
            vy: -60 + Math.random() * 90,
            life: 2.0 + Math.random() * 1.6,
            maxLife: 3.6,
            size: 7 + Math.random() * 9,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 8,
            color: '#FFE9A0'
          });
        }
      }

      // Stars sweeping inward from Left and Right edges towards middle, gently dimming
      starSweepInward(w, h) {
        const colors = ['#FFE9A0', '#FFFFFF', '#B6E4FF', '#FFD3E4', '#DCF7B4'];
        // Left side stars traveling right towards middle
        for (let i = 0; i < 18; i++) {
          const py = h * 0.22 + Math.random() * h * 0.54;
          this.items.push({
            type: 'STAR_SWEEP',
            x: 0 - Math.random() * 40,
            y: py,
            vx: 240 + Math.random() * 140,
            vy: (Math.random() - 0.5) * 36,
            midX: w * 0.5,
            life: 1.3,
            maxLife: 1.3,
            size: 7 + Math.random() * 8,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 8,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
        // Right side stars traveling left towards middle
        for (let i = 0; i < 18; i++) {
          const py = h * 0.22 + Math.random() * h * 0.54;
          this.items.push({
            type: 'STAR_SWEEP',
            x: w + Math.random() * 40,
            y: py,
            vx: -(240 + Math.random() * 140),
            vy: (Math.random() - 0.5) * 36,
            midX: w * 0.5,
            life: 1.3,
            maxLife: 1.3,
            size: 7 + Math.random() * 8,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 8,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      // Dynamic shimmering star dust that flashes on left and right margins upon bolt completion
      sideTwinkleBurst(w, h) {
        const colors = ['#FFE9A0', '#FFFFFF', '#B6E4FF', '#FFD3E4', '#DCF7B4', '#FFA726', '#EA80FC'];
        // Left margin shimmering stars
        for (let i = 0; i < 22; i++) {
          const px = Math.random() * w * 0.16;
          const py = h * 0.16 + Math.random() * h * 0.68;
          this.items.push({
            type: 'SIDE_TWINKLE',
            x: px,
            y: py,
            vx: (Math.random() - 0.5) * 6,
            vy: -8 - Math.random() * 14,
            life: 1.4 + Math.random() * 0.4,
            maxLife: 1.8,
            size: 6 + Math.random() * 7,
            pulseOffset: Math.random() * Math.PI * 2,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 4,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
        // Right margin shimmering stars
        for (let i = 0; i < 22; i++) {
          const px = w * 0.84 + Math.random() * w * 0.16;
          const py = h * 0.16 + Math.random() * h * 0.68;
          this.items.push({
            type: 'SIDE_TWINKLE',
            x: px,
            y: py,
            vx: (Math.random() - 0.5) * 6,
            vy: -8 - Math.random() * 14,
            life: 1.4 + Math.random() * 0.4,
            maxLife: 1.8,
            size: 6 + Math.random() * 7,
            pulseOffset: Math.random() * Math.PI * 2,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 4,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      // Fountain of colorful confetti shooting directly from the completed bolt cap
      capConfettiBurst(x, y) {
        const colors = ['#E040FB', '#FF5722', '#29B6F6', '#AB47BC', '#FFD600', '#FFFFFF', '#00E676'];
        for (let i = 0; i < 36; i++) {
          const a = -Math.PI * 0.5 + (Math.random() - 0.5) * 0.95;
          const sp = 150 + Math.random() * 260;
          this.items.push({
            type: Math.random() < 0.65 ? 'CONFETTI' : 'STAR',
            x: x + (Math.random() - 0.5) * 16,
            y: y,
            vx: Math.cos(a) * sp,
            vy: Math.sin(a) * sp - 70,
            life: 0.9 + Math.random() * 0.8,
            maxLife: 1.7,
            size: 6 + Math.random() * 6,
            rot: Math.random() * 6.28,
            vRot: (Math.random() - 0.5) * 14,
            color: colors[Math.floor(Math.random() * colors.length)]
          });
        }
      }

      popText(x, y, text, color, size) {
        this.items.push({
          type: 'POP', x: x, y: y, vx: 0, vy: -52,
          life: 0.95, maxLife: 0.95, size: size || 20,
          color: color || '#FFE9A0', text: text
        });
      }
    }

    // ========================================================================
    // 8. GAME ENGINE
    // ========================================================================
    class GameEngine {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d', { alpha: false }) || canvas.getContext('2d');
        this.synth = new SoundSynth();
        this.particles = new ParticleSystem();
        this.sprites = new NutSpriteCache();

        this.width = 390;
        this.height = 844;
        this.dpr = 1;
        this.time = 0;
        this.paused = false;

        this.state = 'INTRO';
        this.level = 1;
        this.bestLevel = 1;
        this.coins = 0;
        this.coinsShown = 0;
        this.moves = 0;

        this.cfg = null;
        this.bolts = [];
        this.selected = null;
        this.move = null;
        this.undoStack = [];
        this.undosLeft = 0;
        this.addBoltsLeft = 0;

        this.introTime = 0;
        this.introDuration = 0;
        this.screenShake = 0;
        this.sweep = -1;
        this.bgCache = null;

        this.victory = { stars: 0, t: 0, coins: 0, starAnim: [0, 0, 0], special: false };
        this.tutorStage = 0;
        this.handPulse = 0;
        this.hintTimer = 0;
        this.toast = null;

        this.soundBtn = { x: 0, y: 0, r: 22 };
        this.restartBtn = { x: 0, y: 0, r: 22 };
        this.actionButtons = [];
        this.nextBtn = { x: 0, y: 0, w: 200, h: 54, press: 0 };

        this.loadProgress();
        this.startLevel(this.level);
      }

      // --- Persistence ----------------------------------------------------
      loadProgress() {
        try {
          const lvl = parseInt(localStorage.getItem(STORE_KEYS.level) || '1', 10);
          const coins = parseInt(localStorage.getItem(STORE_KEYS.coins) || '0', 10);
          const best = parseInt(localStorage.getItem(STORE_KEYS.best) || '1', 10);
          if (Number.isFinite(lvl) && lvl >= 1) this.level = lvl;
          if (Number.isFinite(coins) && coins >= 0) this.coins = coins;
          if (Number.isFinite(best) && best >= 1) this.bestLevel = best;
        } catch (e) {}
        this.coinsShown = this.coins;
      }

      saveProgress(levelOverride) {
        try {
          localStorage.setItem(STORE_KEYS.level, String(levelOverride || this.level));
          localStorage.setItem(STORE_KEYS.coins, String(this.coins));
          localStorage.setItem(STORE_KEYS.best, String(Math.max(this.bestLevel, levelOverride || this.level)));
        } catch (e) {}
      }

      // --- Level lifecycle -------------------------------------------------
      startLevel(level) {
        const data = LevelGenerator.generate(level);
        this.level = data.cfg.level;
        this.cfg = data.cfg;
        this.bestLevel = Math.max(this.bestLevel, this.level);

        this.bolts = data.bolts.map(nuts => new Bolt(nuts, data.cfg.capacity, {}));
        for (let i = 0; i < data.cfg.lockedSlots; i++) {
          this.bolts.push(new Bolt([], data.cfg.capacity, { locked: true, isSide: true }));
        }

        this.selected = null;
        this.move = null;
        this.undoStack = [];
        this.moves = 0;
        this.undosLeft = this.cfg.guidance ? 0 : 2;
        this.addBoltsLeft = this.cfg.guidance ? 0 : 2;
        this.particles.clear();
        this.screenShake = 0;
        this.sweep = -1;
        this.tutorStage = 0;
        this.handPulse = 0;
        this.toast = null;
        this.victory = { stars: 0, t: 0, coins: 0, starAnim: [0, 0, 0], special: !!this.cfg.isSpecial };

        this.bolts.forEach(b => b.refreshComplete());
        this.layout();
        this.beginIntro();
        this.saveProgress();
      }

      restartLevel() {
        this.synth.playButton();
        this.startLevel(this.level);
      }

      nextLevel() {
        this.startLevel(this.level + 1);
      }

      // Nuts fly onto their posts on entry so the board assembles itself.
      // Later levels use a tighter, faster cascade to stay out of the way.
      beginIntro() {
        const fast = this.level > 4;
        const stagger = fast ? 0.026 : 0.055;
        const flight = fast ? 0.26 : 0.36;
        let order = 0;
        for (const bolt of this.bolts) {
          bolt.spawnScale = 0.55;
          for (let i = 0; i < bolt.nuts.length; i++) {
            const nut = bolt.nuts[i];
            nut.introDelay = order * stagger;
            nut.introDur = flight;
            nut.introT = 0;
            nut.introSeated = false;
            order++;
          }
        }
        this.introTime = 0;
        this.introDuration = order * stagger + flight + 0.08;
        if (order > 0 && this.synth.ctx) this.synth.playScrew(3);
        this.state = order > 0 ? 'INTRO' : 'PLAYING';
        if (this.state === 'PLAYING') this.notifyStarted();
      }

      notifyStarted() {
        if (this.startedOnce) return;
        this.startedOnce = true;
        try {
          if (Host && typeof Host.gameStarted === 'function') {
            Host.gameStarted();
          }
        } catch (e) {}
      }

      // --- Layout ----------------------------------------------------------
      setSize(w, h, dpr) {
        this.width = w;
        this.height = h;
        this.dpr = dpr;
        this.sprites.configure(dpr);
        this.bgCache = null;
        this.layout();
      }

      layout() {
        const w = this.width;
        const h = this.height;
        const s = clamp(w / 390, 0.78, 1.4);
        this.s = s;

        const btnR = 23 * s;
        const topInset = 16 * s;
        this.hudY = topInset + btnR;
        this.soundBtn = { x: 18 * s + btnR, y: this.hudY, r: btnR };
        this.restartBtn = { x: w - 18 * s - btnR, y: this.hudY, r: btnR };
        this.capsule = { w: 128 * s, h: 38 * s, x: (w - 128 * s) / 2, y: this.hudY - 19 * s };
        this.titleY = this.hudY + btnR + 30 * s;

        const panelH = 68 * s;
        const panelW = 172 * s;
        const bottomInset = 74 * s;
        this.panel = { x: (w - panelW) / 2, y: h - bottomInset - panelH, w: panelW, h: panelH };
        this.progressBar = { x: w * 0.22, y: this.panel.y - 26 * s, w: w * 0.56, h: 7 * s };
        this.messageY = this.progressBar.y - 44 * s;

        const boardTop = this.titleY + 22 * s;
        const boardBottom = this.messageY - 34 * s;
        this.boardTop = boardTop;
        this.setupActionButtons();

        const count = this.bolts.length;
        if (count === 0) return;

        const rows = count <= 3 ? 1 : (count <= 10 ? 2 : 3);
        const perRow = [];
        let left = count;
        for (let r = 0; r < rows; r++) {
          const n = Math.ceil(left / (rows - r));
          perRow.push(n);
          left -= n;
        }
        const maxCols = perRow.reduce((a, b) => Math.max(a, b), 1);

        const availW = w - 20 * s;
        const availH = Math.max(120, boardBottom - boardTop);
        const capacity = this.cfg ? this.cfg.capacity : 4;

        // Fit horizontally first, then shrink if the taller bolts overflow.
        let boltW = Math.min(64 * s, availW / (maxCols * 1.3));
        const metrics = (bw) => {
          const rx = bw / 2;
          const ry = rx * 0.52;
          const band = rx * 0.7;
          const shaftExtra = rx * 0.9;
          const tipToBase = ry * 0.1 + band * capacity + shaftExtra;
          const fullH = tipToBase + ry * 1.8;
          return { rx, ry, band, shaftExtra, tipToBase, fullH };
        };
        let m = metrics(boltW);
        let rowPitch = m.fullH * 1.1;
        if (rows * rowPitch > availH) {
          boltW *= availH / (rows * rowPitch);
          m = metrics(boltW);
          rowPitch = m.fullH * 1.1;
        }

        const cellPitch = boltW * 1.3;
        const gridH = rows * rowPitch;
        const gridTop = boardTop + Math.max(0, (availH - gridH) / 2);
        const stagger = this.cfg && this.cfg.isSpecial ? m.fullH * 0.11 : 0;

        let idx = 0;
        for (let r = 0; r < rows; r++) {
          const n = perRow[r];
          const rowW = n * cellPitch;
          const startX = (w - rowW) / 2 + cellPitch / 2;
          const boxTop = gridTop + r * rowPitch;
          for (let c = 0; c < n; c++) {
            const bolt = this.bolts[idx++];
            if (!bolt) break;
            bolt.rx = m.rx;
            bolt.ry = m.ry;
            bolt.band = m.band;
            bolt.shaftExtra = m.shaftExtra;
            bolt.shaftW = m.rx * 0.62;
            bolt.x = startX + c * cellPitch;
            bolt.baseY = boxTop + m.tipToBase + (stagger ? (c % 2 === 0 ? stagger : -stagger) : 0);
          }
        }
      }

      setupActionButtons() {
        const s = this.s || 1;
        const bw = 66 * s;
        const bh = 52 * s;
        const gap = 16 * s;
        const totalW = bw * 2 + gap;
        const x0 = this.panel.x + (this.panel.w - totalW) / 2;
        const y = this.panel.y + (this.panel.h - bh) / 2;
        this.actionButtons = [
          { id: 'undo', x: x0, y: y, w: bw, h: bh, press: 0 },
          { id: 'addbolt', x: x0 + bw + gap, y: y, w: bw, h: bh, press: 0 }
        ];
        const cardW = Math.min(this.width - 44 * s, 326 * s);
        const cardH = 300 * s;
        this.card = { w: cardW, h: cardH, x: (this.width - cardW) / 2, y: this.height * 0.5 - cardH * 0.56 };
        this.nextBtn.w = cardW * 0.66;
        this.nextBtn.h = 54 * s;
        this.nextBtn.x = (this.width - this.nextBtn.w) / 2;
        this.nextBtn.y = this.card.y + cardH - 54 * s - 24 * s;
      }

      // --- Input -----------------------------------------------------------
      toLocal(clientX, clientY) {
        const rect = this.canvas.getBoundingClientRect();
        const rw = rect.width || this.width;
        const rh = rect.height || this.height;
        return {
          x: (clientX - rect.left) * (this.width / rw),
          y: (clientY - rect.top) * (this.height / rh)
        };
      }

      handlePointerDown(clientX, clientY) {
        this.synth.init();
        const p = this.toLocal(clientX, clientY);

        if (this.state === 'VICTORY') {
          if (this.victory.t >= 1.25) {
            this.nextBtn.press = 1;
            this.synth.playButton();
            this.nextLevel();
          }
          return;
        }

        // A tap during the assembly cascade snaps the board straight to play.
        if (this.state === 'INTRO') {
          this.skipIntro();
          return;
        }

        if (this.hitCircle(p, this.soundBtn)) {
          const muted = this.synth.toggleMute();
          if (!muted) this.synth.playButton();
          return;
        }
        if (this.hitCircle(p, this.restartBtn)) {
          this.restartLevel();
          return;
        }

        if (this.state !== 'PLAYING') return;

        for (const btn of this.actionButtons) {
          if (p.x >= btn.x && p.x <= btn.x + btn.w && p.y >= btn.y && p.y <= btn.y + btn.h) {
            btn.press = 1;
            if (btn.id === 'undo') this.undo();
            else if (btn.id === 'addbolt') this.useAddBolt();
            return;
          }
        }

        for (let i = 0; i < this.bolts.length; i++) {
          if (this.bolts[i].hitTest(p.x, p.y)) {
            this.tapBolt(i);
            return;
          }
        }

        // Tapping empty space cancels a pending pick-up.
        if (this.selected !== null) this.deselect(true);
      }

      handlePointerUp() {
        this.actionButtons.forEach(b => { b.press = 0; });
        this.nextBtn.press = 0;
      }

      hitCircle(p, c) {
        const dx = p.x - c.x;
        const dy = p.y - c.y;
        const pad = c.r * 1.35;
        return dx * dx + dy * dy <= pad * pad;
      }

      tapBolt(index) {
        const bolt = this.bolts[index];

        if (bolt.locked) {
          bolt.shake = 1;
          bolt.unlockPulse = 1;
          this.synth.playError();
          this.showToast('Use +BOLT to open this slot');
          this.haptic('warning');
          return;
        }

        if (this.selected === null) {
          if (bolt.isEmpty) {
            this.synth.playTap();
            return;
          }
          if (bolt.complete) {
            bolt.shake = 0.5;
            this.synth.playTap();
            return;
          }
          this.select(index);
          return;
        }

        if (this.selected === index) {
          this.deselect(true);
          return;
        }

        this.tryMove(this.selected, index);
      }

      select(index) {
        const bolt = this.bolts[index];
        this.selected = index;
        const liftFrom = bolt.nuts.length - bolt.topRun();
        const baseNutY = bolt.nutSlotY(liftFrom);
        bolt.liftTarget = Math.max(bolt.band * 1.8, baseNutY - bolt.hoverY());
        this.synth.playSelect();
        this.haptic('light');
        this.clearHints();
        this.refreshGuideMarks();
        if (this.cfg.guidance) this.tutorStage = 1;
      }

      deselect(withSound) {
        if (this.selected === null) return;
        const bolt = this.bolts[this.selected];
        bolt.liftTarget = 0;
        this.selected = null;
        this.clearGuideMarks();
        if (withSound) this.synth.playTap();
        if (this.cfg.guidance) this.tutorStage = 0;
      }

      // Level 2 paints a tick or a cross over every post while a nut is held,
      // teaching the colour rule before guidance is withdrawn.
      refreshGuideMarks() {
        this.clearGuideMarks();
        if (this.cfg.level !== 2 || this.selected === null) return;
        const color = this.bolts[this.selected].topColor;
        if (color === null) return;
        for (let i = 0; i < this.bolts.length; i++) {
          if (i === this.selected) continue;
          const b = this.bolts[i];
          if (b.locked) continue;
          b.guideMark = b.canAccept(color) ? 1 : -1;
        }
      }

      clearGuideMarks() {
        this.bolts.forEach(b => { b.guideMark = 0; });
      }

      clearHints() {
        this.bolts.forEach(b => { b.isHintSource = false; b.isHintTarget = false; });
      }

      // --- Moves -----------------------------------------------------------
      tryMove(fromIdx, toIdx) {
        const from = this.bolts[fromIdx];
        const to = this.bolts[toIdx];
        const color = from.topColor;

        if (color === null) {
          this.deselect(false);
          return;
        }

        // Capacity and colour validation happen before anything animates, so a
        // nut is never shown entering a post it cannot physically fit on.
        if (!to.canAccept(color)) {
          this.rejectMove(to, to.isFull ? 'No space on that bolt' : 'Colours must match');
          return;
        }

        const count = Math.min(from.topRun(), to.freeSpace);
        if (count <= 0) {
          this.rejectMove(to, 'No space on that bolt');
          return;
        }

        this.pushUndo();
        this.startMove(fromIdx, toIdx, count);
      }

      // Invalid target: the held nuts settle back down with a shake and a buzz.
      rejectMove(targetBolt, message) {
        targetBolt.shake = 1;
        if (this.selected !== null) this.bolts[this.selected].shake = 0.6;
        this.deselect(false);
        this.synth.playError();
        this.haptic('error');
        this.showToast(message);
        this.screenShake = Math.max(this.screenShake, 2.4);
      }

      startMove(fromIdx, toIdx, count) {
        const from = this.bolts[fromIdx];
        const to = this.bolts[toIdx];
        const nuts = from.nuts.splice(from.nuts.length - count, count);

        // Calibrated duration so 3D rotation and trailing motion are distinctly felt:
        const perNutDur = 0.72;
        const stagger = 0.16;
        const totalDur = perNutDur + (count - 1) * stagger;

        this.move = {
          fromIdx: fromIdx,
          toIdx: toIdx,
          count: count,
          colorId: nuts[0].c,
          nuts: nuts,
          srcIndexBase: from.nuts.length,
          dstIndexBase: to.nuts.length,
          t: 0,
          dur: totalDur,
          perNutDur: perNutDur,
          stagger: stagger,
          seatedNuts: new Array(count).fill(false),
          playedScrewNuts: new Array(count).fill(false)
        };

        from.lift = 0;
        from.liftTarget = 0;
        this.selected = null;
        this.clearGuideMarks();
        this.clearHints();
        this.state = 'MOVING';
        this.moves++;
        this.synth.playUnscrew(count);
        this.haptic('light');

        // Whatever was buried under the lifted run is now on show.
        this.revealTop(from);
        if (this.cfg.guidance) this.tutorStage = 2;
      }

      revealTop(bolt) {
        if (!bolt.nuts.length) return;
        const top = bolt.nuts[bolt.nuts.length - 1];
        if (top.hidden) {
          top.hidden = false;
          top.reveal = 0;
          this.synth.playReveal();
          this.particles.seatSparks(bolt.x, bolt.nutSlotY(bolt.nuts.length - 1), top.c, 10);
        }
      }

      // Pose of one in-flight nut. Individual progress tj drives each nut in a trailing flight line!
      flyingPose(j) {
        const m = this.move;
        const from = this.bolts[m.fromIdx];
        const to = this.bolts[m.toIdx];
        const band = to.band;
        const startY = from.nutSlotY(m.srcIndexBase + j);
        const srcHover = from.hoverY() - j * band * 0.4;
        const dstHover = to.hoverY() - j * band * 0.4;
        const endY = to.nutSlotY(m.dstIndexBase + j);

        // Topmost nut of the lifted stack takes off first
        const nutOrder = (m.count - 1 - j);
        const startTime = nutOrder * m.stagger;
        const rawT = (m.t * m.dur - startTime) / m.perNutDur;
        const tj = clamp(rawT, 0, 1);

        if (rawT <= 0) {
          return { x: from.x, y: startY, spin: 0, squash: 0 };
        }

        const unscrewEnd = 0.30;
        const travelEnd = 0.70;
        const screwEnd = 0.94;

        let x, y, spin = 0, squash = 0;

        if (tj < unscrewEnd) {
          // Phase 1: Unscrew & Lift (Counter-Clockwise 2.5 full rotations)
          const p = tj / unscrewEnd;
          const e = easeOutCubic(p);
          x = from.x;
          y = lerp(startY, srcHover, e);
          spin = -Math.PI * 5 * e;
        } else if (tj < travelEnd) {
          // Phase 2: Arched Parabolic Flight across
