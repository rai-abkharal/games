          const p = (tj - unscrewEnd) / (travelEnd - unscrewEnd);
          const e = easeInOutCubic(p);
          x = lerp(from.x, to.x, e);
          y = lerp(srcHover, dstHover, e) - Math.sin(Math.PI * p) * (band * 2.2 + 28);
          spin = -Math.PI * 5 - Math.PI * 2 * p;
        } else if (tj < screwEnd) {
          // Phase 3: Screw-In Insertion (Clockwise 2.5 full rotations down into slot)
          const p = (tj - travelEnd) / (screwEnd - travelEnd);
          x = to.x;
          y = lerp(dstHover, endY, easeInOutCubic(p));
          spin = -Math.PI * 7 + Math.PI * 5 * easeOutCubic(p);
        } else {
          // Phase 4: Settle & Elastic Lock
          const p = clamp((tj - screwEnd) / (1 - screwEnd), 0, 1);
          x = to.x;
          y = endY;
          spin = -Math.PI * 2;
          squash = Math.sin(Math.PI * p) * 0.16 / (1 + j * 0.4);
        }

        return { x: x, y: y, spin: spin, squash: squash };
      }

      advanceMove(dt) {
        const m = this.move;
        if (!m) return;
        const to = this.bolts[m.toIdx];
        m.t = Math.min(1, m.t + dt / m.dur);

        for (let j = 0; j < m.count; j++) {
          const nutOrder = (m.count - 1 - j);
          const startTime = nutOrder * m.stagger;
          const rawT = (m.t * m.dur - startTime) / m.perNutDur;

          if (rawT >= 0.70 && !m.playedScrewNuts[j]) {
            m.playedScrewNuts[j] = true;
            this.synth.playScrew(1);
          }

          if (rawT >= 0.94 && !m.seatedNuts[j]) {
            m.seatedNuts[j] = true;
            const y = to.nutSlotY(m.dstIndexBase + j);
            this.particles.seatSparks(to.x, y + to.band * 0.5, m.colorId, 8);
            this.particles.dustRing(to.x, y + to.band * 0.6, m.colorId, to.rx);
            this.screenShake = Math.max(this.screenShake, 1.8);
            this.haptic('light');
          }
        }

        if (m.t >= 1) this.commitMove();
      }

      commitMove() {
        const m = this.move;
        const to = this.bolts[m.toIdx];
        for (const nut of m.nuts) to.nuts.push(nut);
        this.move = null;
        this.state = 'PLAYING';

        if (to.refreshComplete()) this.celebrateGroup(to);
        this.bolts.forEach(b => b.refreshComplete());

        if (LevelGenerator.isSolved(this.bolts.map(b => b.nuts), this.cfg.capacity)) {
          this.triggerVictory();
        }
      }

      // One colour fully gathered: cap lock, radiant beam, cap confetti fountain and left-right star dust matching reference
      celebrateGroup(bolt) {
        bolt.shine = 0;
        this.sweep = 0;
        this.particles.capConfettiBurst(bolt.x, bolt.shaftTopY);
        this.particles.sideTwinkleBurst(this.width, this.height);
        this.screenShake = Math.max(this.screenShake, 3.2);
        this.haptic('success');
      }

      // --- Boosters ---------------------------------------------------------
      pushUndo() {
        this.undoStack.push({
          stacks: this.bolts.map(b => b.nuts.map(n => ({ c: n.c, hidden: n.hidden, reveal: n.reveal }))),
          moves: this.moves
        });
        if (this.undoStack.length > 40) this.undoStack.shift();
      }

      undo() {
        if (this.undosLeft <= 0) {
          this.synth.playError();
          this.showToast(this.cfg.guidance ? 'Unlocks after the tutorial' : 'No undos left');
          return;
        }
        if (!this.undoStack.length || this.state !== 'PLAYING') {
          this.synth.playError();
          this.showToast('Nothing to undo');
          return;
        }

        const snap = this.undoStack.pop();
        this.deselect(false);
        for (let i = 0; i < this.bolts.length; i++) {
          const saved = snap.stacks[i];
          if (!saved) continue;
          this.bolts[i].nuts = saved.map(n => ({ c: n.c, hidden: n.hidden, reveal: n.reveal }));
          this.bolts[i].complete = false;
          this.bolts[i].refreshComplete();
        }
        this.moves = snap.moves;
        this.undosLeft--;
        this.synth.playButton();
        this.haptic('light');
        this.showToast('Move undone');
      }

      // Opens the dormant side socket with space for 1 nut, or expands to 2 on 2nd use.
      useAddBolt() {
        if (this.addBoltsLeft <= 0) {
          this.synth.playError();
          this.showToast(this.cfg.guidance ? 'Unlocks after the tutorial' : 'No spare bolts left');
          return;
        }
        if (this.state !== 'PLAYING') return;

        const socket = this.bolts.find(b => b.locked);
        if (socket) {
          socket.locked = false;
          socket.capacity = 1; // 1-nut capacity short bolt
          socket.unlockPulse = 1;
          socket.spawnScale = 0.5;
          this.particles.groupBurst(socket.x, socket.baseY - socket.band, 2);
        } else {
          // If already unlocked, check if we can expand the side bolt to 2 nuts
          const existingSide = this.bolts.find(b => b.isSide && !b.locked);
          if (existingSide && existingSide.capacity < 2) {
            existingSide.capacity = 2; // Expands to 2 nuts
            existingSide.unlockPulse = 1;
            this.particles.groupBurst(existingSide.x, existingSide.baseY - existingSide.band, 2);
          } else {
            const fresh = new Bolt([], 1, { isSide: true }); // Space for 1 nut
            fresh.spawnScale = 0.4;
            this.bolts.push(fresh);
            this.layout();
          }
        }

        this.addBoltsLeft--;
        this.undoStack = [];
        this.deselect(false);
        this.synth.playUnlock();
        this.haptic('success');
        this.showToast('Spare bolt ready');
      }

      // Host-driven hint (rewarded ad). Flags the best source and target.
      triggerHint() {
        if (this.state !== 'PLAYING' && this.state !== 'INTRO') return;
        if (this.state === 'INTRO') this.skipIntro();
        const hint = LevelGenerator.findHint(this.bolts.filter(b => !b.locked).map(b => b.nuts), this.cfg.capacity);
        if (!hint) {
          this.synth.playError();
          this.showToast('No move available - try +BOLT');
          return;
        }
        const open = this.bolts.filter(b => !b.locked);
        this.clearHints();
        this.deselect(false);
        if (open[hint.from]) open[hint.from].isHintSource = true;
        if (open[hint.to]) open[hint.to].isHintTarget = true;
        this.hintTimer = 3.4;
        this.synth.playHint();
        this.showToast('Move the glowing nuts');
      }

      skipIntro() {
        for (const bolt of this.bolts) {
          bolt.spawnScale = 1;
          for (const nut of bolt.nuts) {
            nut.introT = 1;
            nut.introSeated = true;
          }
        }
        this.introTime = this.introDuration;
        this.state = 'PLAYING';
        this.notifyStarted();
      }

      // --- Scoring & completion --------------------------------------------
      addCoins(amount) {
        this.coins = Math.max(0, this.coins + amount);
      }

      triggerVictory() {
        this.state = 'VICTORY';
        this.victory.t = 0;
        this.victory.starAnim = [0, 0, 0];
        this.victory.special = !!this.cfg.isSpecial;

        // Star rating from move efficiency against a generous par.
        const par = Math.max(4, Math.round(this.cfg.colorCount * 2.4));
        if (this.moves <= par) this.victory.stars = 3;
        else if (this.moves <= Math.round(par * 1.55)) this.victory.stars = 2;
        else this.victory.stars = 1;

        this.victory.coins = COINS_PER_LEVEL + (this.victory.stars - 1) * 5;
        this.addCoins(this.victory.coins);

        this.particles.confettiCannon(this.width, this.height);
        this.particles.sparkleSweep(this.width, this.height, 0.25);
        this.screenShake = 6;
        if (this.cfg.isSpecial) this.synth.playSpecialWin();
        else this.synth.playLevelWin();
        this.haptic('success');

        this.bestLevel = Math.max(this.bestLevel, this.level + 1);
        this.saveProgress(this.level + 1);

        this.notifyLevelComplete();
      }

      notifyLevelComplete() {
        try {
          const native = window.AndroidNative;
          if (native) {
            if (typeof native.postScore === 'function') native.postScore(this.coins);
            if (typeof native.onLevelCompleted === 'function') native.onLevelCompleted(this.level, this.coins);
          }
          if (Host && typeof Host.completed === 'function') {
            Host.completed({
              score: this.coins,
              level: this.level,
              stats: { moves: this.moves, stars: this.victory.stars, special: !!this.cfg.isSpecial }
            });
          }
        } catch (e) {}
      }

      showToast(text) {
        this.toast = { text: text, t: 1.6, max: 1.6 };
      }

      haptic(type) {
        try {
          if (Host && typeof Host.haptic === 'function') {
            Host.haptic(type);
          }
        } catch (e) {}
      }

      // --- Update -----------------------------------------------------------
      update(dt) {
        if (this.paused) return;
        this.time += dt;

        if (this.screenShake > 0) this.screenShake = Math.max(0, this.screenShake - dt * 22);
        if (this.sweep >= 0) {
          this.sweep += dt * 1.45;
          if (this.sweep > 1) this.sweep = -1;
        }
        if (this.toast) {
          this.toast.t -= dt;
          if (this.toast.t <= 0) this.toast = null;
        }
        if (this.hintTimer > 0) {
          this.hintTimer -= dt;
          if (this.hintTimer <= 0) this.clearHints();
        }

        const diff = this.coins - this.coinsShown;
        if (Math.abs(diff) < 0.6) this.coinsShown = this.coins;
        else this.coinsShown += diff * Math.min(1, dt * 6);

        for (const bolt of this.bolts) bolt.update(dt);
        this.particles.update(dt);

        for (const btn of this.actionButtons) {
          if (btn.press > 0) btn.press = Math.max(0, btn.press - dt * 5);
        }

        if (this.state === 'INTRO') {
          this.updateIntro(dt);
        } else if (this.state === 'MOVING') {
          // Spinning the target thread while a nut drives down reinforces the
          // direction of travel.
          const to = this.bolts[this.move ? this.move.toIdx : 0];
          if (to) to.threadPhase += dt * 120;
          this.advanceMove(dt);
        } else if (this.state === 'VICTORY') {
          this.victory.t += dt;
          for (let i = 0; i < 3; i++) {
            if (this.victory.t > 0.35 + i * 0.2 && i < this.victory.stars) {
              this.victory.starAnim[i] = Math.min(1, this.victory.starAnim[i] + dt * 3.2);
            }
          }
          // Natural roll into the next level once the celebration has landed.
          if (this.victory.t > 3.4) this.nextLevel();
        }

        if (this.state === 'PLAYING') {
          this.handPulse += dt * 2.6;
        }
      }

      updateIntro(dt) {
        this.introTime += dt;
        let pending = false;

        for (const bolt of this.bolts) {
          for (const nut of bolt.nuts) {
            if (nut.introT >= 1) continue;
            const local = this.introTime - (nut.introDelay || 0);
            if (local <= 0) { pending = true; continue; }
            nut.introT = clamp(local / (nut.introDur || 0.3), 0, 1);
            if (nut.introT >= 1 && !nut.introSeated) {
              nut.introSeated = true;
              this.introSeatCount = (this.introSeatCount || 0) + 1;
              if (this.introSeatCount % 2 === 1) this.synth.playTick();
              this.particles.seatSparks(bolt.x, bolt.baseY - bolt.band * 0.4, nut.c, 3);
            }
            if (nut.introT < 1) pending = true;
          }
        }

        if (!pending && this.introTime >= this.introDuration - 0.06) {
          this.state = 'PLAYING';
          this.notifyStarted();
        }
      }

      sortedGroups() {
        let done = 0;
        for (const b of this.bolts) if (b.complete) done++;
        return done;
      }

      // --- Render: background ----------------------------------------------
      buildBackground() {
        const w = Math.max(2, Math.ceil(this.width));
        const h = Math.max(2, Math.ceil(this.height));
        const cv = document.createElement('canvas');
        cv.width = w;
        cv.height = h;
        const c = cv.getContext('2d');
        if (!c) return null;

        const g = c.createLinearGradient(0, 0, w * 0.2, h);
        g.addColorStop(0, THEME.bgTop);
        g.addColorStop(0.50, THEME.bgMid);
        g.addColorStop(1, THEME.bgBottom);
        c.fillStyle = g;
        c.fillRect(0, 0, w, h);

        // Soft blue radial glow under the play area matching reference screenshot
        const glow = c.createRadialGradient(w * 0.5, h * 0.44, 0, w * 0.5, h * 0.44, w * 0.82);
        glow.addColorStop(0, 'rgba(80, 110, 240, 0.16)');
        glow.addColorStop(1, 'rgba(80, 110, 240, 0)');
        c.fillStyle = glow;
        c.fillRect(0, 0, w, h);

        const vig = c.createRadialGradient(w * 0.5, h * 0.5, w * 0.35, w * 0.5, h * 0.5, w * 1.05);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, THEME.vignette);
        c.fillStyle = vig;
        c.fillRect(0, 0, w, h);

        return cv;
      }

      render() {
        const ctx = this.ctx;
        if (!ctx) return;
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);

        if (!this.bgCache) this.bgCache = this.buildBackground();
        if (this.bgCache) ctx.drawImage(this.bgCache, 0, 0, this.width, this.height);
        else {
          ctx.fillStyle = THEME.bgMid;
          ctx.fillRect(0, 0, this.width, this.height);
        }

        ctx.save();
        if (this.screenShake > 0.05) {
          ctx.translate((Math.random() - 0.5) * this.screenShake, (Math.random() - 0.5) * this.screenShake);
        }
        this.drawBoard(ctx);
        this.particles.render(ctx);
        ctx.restore();

        this.drawHud(ctx);
        this.drawFooter(ctx);
        if (this.sweep >= 0) this.drawScreenSweep(ctx);
        if (this.state === 'VICTORY') this.drawVictory(ctx);
      }

      // A light band that enters from the left and crosses the board whenever a
      // colour is sorted, matching the reference celebration.
      drawScreenSweep(ctx) {
        const p = clamp(this.sweep, 0, 1);
        const bandW = this.width * 0.42;
        const x = lerp(-bandW, this.width + bandW, easeInOutCubic(p));
        const fade = Math.sin(Math.PI * p);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createLinearGradient(x - bandW / 2, 0, x + bandW / 2, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(0.5, 'rgba(190, 220, 255, ' + (0.2 * fade).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(x - bandW, this.boardTop - 20, bandW * 2, this.height * 0.62);
        ctx.restore();
      }

      drawBoard(ctx) {
        for (let i = 0; i < this.bolts.length; i++) {
          this.drawBolt(ctx, this.bolts[i], i);
        }
        if (this.move) this.drawFlyingNuts(ctx);
        this.drawGuides(ctx);
      }

      // --- Render: one bolt --------------------------------------------------
      drawBolt(ctx, bolt, index) {
        const shakeX = bolt.shake > 0 ? Math.sin(this.time * 46) * bolt.shake * 5 : 0;
        const bx = bolt.x + shakeX;
        const sc = bolt.spawnScale;

        ctx.save();
        if (sc < 1) {
          ctx.translate(bx, bolt.baseY);
          ctx.scale(sc, sc);
          ctx.translate(-bx, -bolt.baseY);
        }

        if (bolt.locked) {
          Art.drawLockedSocket(ctx, bx, bolt.baseY, bolt.rx * 1.02, bolt.ry, bolt.unlockPulse);
          Art.glyphLock(ctx, bx, bolt.baseY - bolt.ry * 3.1, bolt.rx * 0.4, 'rgba(20, 24, 60, 0.9)', '#98A0D0');
          ctx.restore();
          return;
        }

        // Vertical radiant light beam behind completed bolt matching reference screenshot Image 2
        if (bolt.completeGlow > 0.01) {
          ctx.save();
          ctx.globalCompositeOperation = 'screen';
          const beamW = bolt.rx * 2.2;
          const beamTop = bolt.shaftTopY - bolt.band * 1.6;
          const beamBottom = bolt.baseY + bolt.ry * 0.8;
          const beamG = ctx.createLinearGradient(0, beamBottom, 0, beamTop);
          beamG.addColorStop(0, 'rgba(255, 255, 255, ' + (0.85 * bolt.completeGlow).toFixed(2) + ')');
          beamG.addColorStop(0.3, 'rgba(215, 230, 255, ' + (0.55 * bolt.completeGlow).toFixed(2) + ')');
          beamG.addColorStop(0.75, 'rgba(170, 200, 255, ' + (0.25 * bolt.completeGlow).toFixed(2) + ')');
          beamG.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.fillStyle = beamG;
          ctx.beginPath();
          ctx.ellipse(bx, beamBottom, bolt.rx * 1.4, bolt.ry * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillRect(bx - beamW * 0.5, beamTop, beamW, beamBottom - beamTop);
          ctx.restore();
        }

        // Selection and hint rings sit on the washer.
        const ringPulse = 0.5 + 0.5 * Math.sin(bolt.hintPulse);
        if (this.selected === index || bolt.isHintSource || bolt.isHintTarget) {
          const col = bolt.isHintTarget ? 'rgba(120, 235, 130, ' : 'rgba(255, 226, 140, ';
          ctx.save();
          ctx.lineWidth = 3;
          ctx.strokeStyle = col + (0.45 + 0.45 * ringPulse).toFixed(3) + ')';
          ctx.beginPath();
          ctx.ellipse(bx, bolt.baseY, bolt.rx * (1.2 + 0.06 * ringPulse), bolt.ry * (1.25 + 0.06 * ringPulse), 0, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        Art.drawBase(ctx, bx, bolt.baseY, bolt.rx * 1.06, bolt.ry);
        Art.drawShaft(ctx, bx, bolt.shaftTopY, bolt.baseY, bolt.shaftW, bolt.threadPhase);

        const heldRun = this.selected === index ? bolt.topRun() : 0;
        const liftFrom = bolt.nuts.length - heldRun;

        // 1. Draw resting (non-lifted) nuts first
        for (let i = 0; i < liftFrom; i++) {
          const nut = bolt.nuts[i];
          const y = bolt.nutSlotY(i);
          this.paintNut(ctx, bx, y, bolt, nut, 0, 1, false, 0);
        }

        // 2. Redraw the exposed thread shaft emerging above the highest resting nut
        if (!bolt.complete || bolt.nuts.length < bolt.capacity) {
          const restingTopY = liftFrom > 0 ? bolt.nutSlotY(liftFrom - 1) : null;
          const capBottom = restingTopY === null ? bolt.baseY : Math.min(bolt.baseY, restingTopY + bolt.ry * 0.2);
          if (capBottom > bolt.shaftTopY + 1) {
            Art.drawShaft(ctx, bx, bolt.shaftTopY, capBottom, bolt.shaftW, bolt.threadPhase);
          }
        }

        // 3. Draw lifted (hovering) nuts with proper clearance above the shaft
        for (let i = liftFrom; i < bolt.nuts.length; i++) {
          const nut = bolt.nuts[i];
          let y = bolt.nutSlotY(i);
          let spin = 0;
          let alpha = 1;

          if (nut.introT !== undefined && nut.introT < 1) {
            const e = easeOutCubic(nut.introT);
            y -= (1 - e) * (bolt.band * 4 + bolt.rx * 1.6);
            spin = -(1 - e) * Math.PI * 2 * 1.3;
            alpha = clamp(nut.introT * 4, 0, 1);
          } else if (heldRun > 0) {
            y -= bolt.lift + Math.sin(this.time * 4.2) * bolt.ry * 0.14;
            spin = Math.sin(this.time * 3.1) * 0.13;
          }

          this.paintNut(ctx, bx, y, bolt, nut, spin, alpha, true, 0);
        }

        // 4. When bolt is completed, render clean metallic cap on top!
        if (bolt.complete && bolt.nuts.length >= bolt.capacity) {
          const topSlotY = bolt.nutSlotY(bolt.nuts.length - 1);
          Art.drawBoltCap(ctx, bx, topSlotY - bolt.ry * 0.16, bolt.rx, bolt.ry, bolt.completeGlow);
        }

        // Local shine that wipes across the bolt when its colour completes.
        if (bolt.shine >= 0) {
          const p = clamp(bolt.shine, 0, 1);
          const boxX = bx - bolt.rx * 1.5;
          const boxY = bolt.shaftTopY - bolt.band;
          const boxW = bolt.rx * 3;
          const boxH = bolt.baseY + bolt.ry * 2 - boxY;
          const bandW = boxW * 0.5;
          const sx = lerp(boxX - bandW, boxX + boxW + bandW, p);
          ctx.save();
          ctx.beginPath();
          ctx.rect(boxX, boxY, boxW, boxH);
          ctx.clip();
          ctx.globalCompositeOperation = 'lighter';
          const g = ctx.createLinearGradient(sx - bandW * 0.5, boxY, sx + bandW * 0.5, boxY + boxH);
          g.addColorStop(0, 'rgba(255,255,255,0)');
          g.addColorStop(0.5, 'rgba(255,255,255,' + (0.5 * Math.sin(Math.PI * p)).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.fillRect(boxX, boxY, boxW, boxH);
          ctx.restore();
        }

        ctx.restore();
      }

      // Cached blit for resting nuts, live vector draw for anything animating.
      paintNut(ctx, x, y, bolt, nut, spin, alpha, live, squash) {
        const rx = bolt.rx;
        const ry = bolt.ry;
        const band = bolt.band;
        const pal = NUT_PALETTE[nut.c % NUT_PALETTE.length];

        ctx.save();
        if (alpha < 1) ctx.globalAlpha = alpha;
        if (squash > 0.001) {
          const pivot = y + band;
          ctx.translate(x, pivot);
          ctx.scale(1 + squash * 0.55, 1 - squash);
          ctx.translate(-x, -pivot);
        }

        if (nut.reveal < 1) {
          // Steel shell dissolves into the real colour as it is uncovered.
          const hid = this.sprites.get(0, true, rx, ry, band);
          if (hid) {
            ctx.globalAlpha = alpha * (1 - nut.reveal);
            ctx.drawImage(hid.canvas, x - hid.ax, y - hid.ay, hid.w, hid.h);
          }
          const pop = 1 + Math.sin(Math.PI * nut.reveal) * 0.12;
          ctx.globalAlpha = alpha * nut.reveal;
          ctx.translate(x, y + band * 0.5);
          ctx.scale(pop, pop);
          ctx.translate(-x, -(y + band * 0.5));
          Art.drawNut(ctx, x, y, rx, ry, band, 0, pal, {});
        } else if (live || Math.abs(spin) > 0.002) {
          Art.drawNut(ctx, x, y, rx, ry, band, spin, nut.hidden ? HIDDEN_SKIN : pal, { questionMark: nut.hidden, isFlying: true, shaftThrough: false });
        } else {
          const sp = this.sprites.get(nut.c, nut.hidden, rx, ry, band);
          if (sp) ctx.drawImage(sp.canvas, x - sp.ax, y - sp.ay, sp.w, sp.h);
          else Art.drawNut(ctx, x, y, rx, ry, band, 0, nut.hidden ? HIDDEN_SKIN : pal, { questionMark: nut.hidden, shaftThrough: true });
        }

        ctx.restore();
      }

      drawFlyingNuts(ctx) {
        const m = this.move;
        const to = this.bolts[m.toIdx];
        if (!to) return;
        for (let j = 0; j < m.nuts.length; j++) {
          const pose = this.flyingPose(j);
          this.paintNut(ctx, pose.x, pose.y, to, m.nuts[j], pose.spin, 1, true, pose.squash);
        }
      }

      // --- Render: guidance overlays -----------------------------------------
      smallestMoveSource() {
        let best = null;
        let bestCount = Infinity;
        for (let i = 0; i < this.bolts.length; i++) {
          const from = this.bolts[i];
          if (from.locked || from.isEmpty || from.complete) continue;
          const run = from.topRun();
          for (let j = 0; j < this.bolts.length; j++) {
            if (i === j) continue;
            const to = this.bolts[j];
            if (!to.canAccept(from.topColor)) continue;
            const moved = Math.min(run, to.freeSpace);
            if (moved > 0 && moved < bestCount) {
              bestCount = moved;
              best = i;
            }
          }
        }
        return best;
      }

      // Where the tutorial finger should point next.
      tutorTarget() {
        if (this.selected !== null) {
          const color = this.bolts[this.selected].topColor;
          for (let i = 0; i < this.bolts.length; i++) {
            if (i === this.selected) continue;
            const b = this.bolts[i];
            if (!b.locked && b.canAccept(color)) return i;
          }
          return null;
        }
        return this.smallestMoveSource();
      }

      guidanceText() {
        if (!this.cfg) return null;
        if (this.cfg.level === 1) {
          return this.selected === null ? 'Click to move the nut' : 'Now tap the other bolt';
        }
        if (this.cfg.level === 2) {
          return 'Only nuts of the same color can be stacked on top of each other';
        }
        return null;
      }

      drawGuides(ctx) {
        // Level 2: tick over every post that accepts the held colour, cross
        // over the rest.
        for (const bolt of this.bolts) {
          if (!bolt.guideMark) continue;
          const cy = bolt.shaftTopY - bolt.band * 1.4;
          const r = bolt.rx * 0.52;
          if (bolt.guideMark > 0) Art.glyphCheck(ctx, bolt.x, cy, r, THEME.good);
          else Art.glyphCross(ctx, bolt.x, cy, r, THEME.bad);
        }

        // Level 1: pointing finger that bobs toward the next tap.
        if (this.cfg && this.cfg.level === 1 && this.state === 'PLAYING') {
          const target = this.tutorTarget();
          if (target !== null && this.bolts[target]) {
            const bolt = this.bolts[target];
            const bob = Math.sin(this.handPulse * 2.1) * bolt.ry * 0.6;
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;
            Art.glyphHand(ctx, bolt.x + bolt.rx * 0.42, bolt.baseY + bolt.ry * 3.4 + bob, bolt.rx * 1.2);
            ctx.restore();
          }
        }

        // Hint: bouncing arrow over the recommended destination.
        for (const bolt of this.bolts) {
          if (!bolt.isHintTarget) continue;
          const bounce = Math.abs(Math.sin(bolt.hintPulse)) * bolt.ry * 0.7;
          const y = bolt.shaftTopY - bolt.band * 1.6 - bounce;
          ctx.save();
          ctx.fillStyle = 'rgba(120, 235, 130, 0.95)';
          ctx.beginPath();
          ctx.moveTo(bolt.x, y + bolt.rx * 0.5);
          ctx.lineTo(bolt.x - bolt.rx * 0.36, y - bolt.rx * 0.2);
          ctx.lineTo(bolt.x + bolt.rx * 0.36, y - bolt.rx * 0.2);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
      }

      // --- Render: HUD -------------------------------------------------------
      drawRoundButton(ctx, cx, cy, r, pressed) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy + r * 0.12, r, 0, Math.PI * 2);
        ctx.fillStyle = THEME.chipDeep;
        ctx.fill();

        const g = ctx.createLinearGradient(cx, cy - r, cx, cy + r);
        g.addColorStop(0, THEME.chipEdge);
        g.addColorStop(0.45, THEME.chipFill);
        g.addColorStop(1, THEME.chipDeep);
        ctx.beginPath();
        ctx.arc(cx, cy - (pressed ? 0 : r * 0.04), r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(cx, cy - r * 0.42, r * 0.62, r * 0.3, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fill();
        ctx.restore();
      }

      drawHud(ctx) {
        const s = this.s || 1;

        // Sound toggle, drawn as the game mark.
        this.drawRoundButton(ctx, this.soundBtn.x, this.soundBtn.y, this.soundBtn.r, false);
        Art.glyphNut(ctx, this.soundBtn.x, this.soundBtn.y, this.soundBtn.r * 0.5, '#FFFFFF', null);
        if (this.synth.isMuted) {
          ctx.save();
          ctx.lineWidth = 3 * s;
          ctx.lineCap = 'round';
          ctx.strokeStyle = '#FF5B6E';
          ctx.beginPath();
          ctx.moveTo(this.soundBtn.x - this.soundBtn.r * 0.55, this.soundBtn.y - this.soundBtn.r * 0.55);
          ctx.lineTo(this.soundBtn.x + this.soundBtn.r * 0.55, this.soundBtn.y + this.soundBtn.r * 0.55);
          ctx.stroke();
          ctx.restore();
        }

        this.drawRoundButton(ctx, this.restartBtn.x, this.restartBtn.y, this.restartBtn.r, false);
        Art.glyphRestart(ctx, this.restartBtn.x, this.restartBtn.y, this.restartBtn.r * 0.46, '#FFFFFF');

        // Coin capsule.
        const cap = this.capsule;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cap.x, cap.y + 3 * s, cap.w, cap.h, cap.h / 2);
        ctx.fillStyle = 'rgba(20, 16, 60, 0.45)';
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(cap.x, cap.y, cap.w, cap.h, cap.h / 2);
        const capG = ctx.createLinearGradient(cap.x, cap.y, cap.x, cap.y + cap.h);
        capG.addColorStop(0, '#FFFFFF');
        capG.addColorStop(1, THEME.capsuleFill);
        ctx.fillStyle = capG;
        ctx.fill();
        ctx.lineWidth = 2 * s;
        ctx.strokeStyle = THEME.capsuleEdge;
        ctx.stroke();
        ctx.restore();

        Art.glyphCoin(ctx, cap.x + cap.h * 0.44, cap.y + cap.h / 2, cap.h * 0.5);

        ctx.save();
        ctx.font = '900 ' + Math.round(19 * s) + 'px Fredoka, Lilita One, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#3A2A6B';
        ctx.fillText(String(Math.round(this.coinsShown)), cap.x + cap.w * 0.58, cap.y + cap.h / 2 + 1);
        ctx.restore();

        // Level title.
        const title = this.cfg && this.cfg.isSpecial
          ? 'Special level ' + Math.ceil(this.level / 10)
          : 'Level ' + this.level;
        ctx.save();
        ctx.font = '900 ' + Math.round(27 * s) + 'px Fredoka, Lilita One, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(title, this.width / 2, this.titleY);
        ctx.restore();
      }

      // --- Render: footer ----------------------------------------------------
      wrapLines(ctx, text, maxWidth) {
        const words = text.split(' ');
        const lines = [];
        let line = '';
        for (const word of words) {
          const test = line ? line + ' ' + word : word;
          if (ctx.measureText(test).width > maxWidth && line) {
            lines.push(line);
            line = word;
          } else {
            line = test;
          }
        }
        if (line) lines.push(line);
        return lines;
      }

      drawFooter(ctx) {
        const s = this.s || 1;

        // Sorting progress for the level.
        const total = this.cfg ? this.cfg.colorCount : 1;
        const done = this.sortedGroups();
        const pb = this.progressBar;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(pb.x, pb.y, pb.w, pb.h, pb.h / 2);
        ctx.fillStyle = 'rgba(195, 205, 225, 0.6)';
        ctx.fill();
        const ratio = clamp(done / Math.max(1, total), 0, 1);
        if (ratio > 0) {
          ctx.beginPath();
          ctx.roundRect(pb.x, pb.y, Math.max(pb.h, pb.w * ratio), pb.h, pb.h / 2);
          const g = ctx.createLinearGradient(pb.x, pb.y, pb.x + pb.w, pb.y);
          g.addColorStop(0, '#7FD525');
          g.addColorStop(1, '#18C8B8');
          ctx.fillStyle = g;
          ctx.fill();
        }
        ctx.font = '800 ' + Math.round(11 * s) + 'px Nunito, Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = THEME.textDim;
        ctx.fillText(done + ' / ' + total + ' SORTED', this.width / 2, pb.y + pb.h + 4 * s);
        ctx.restore();

        // Booster panel.
        const p = this.panel;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(p.x, p.y + 4 * s, p.w, p.h, 20 * s);
        ctx.fillStyle = 'rgba(14, 10, 50, 0.5)';
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 20 * s);
        const pg = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        pg.addColorStop(0, THEME.panelEdge);
        pg.addColorStop(0.35, THEME.panel);
        pg.addColorStop(1, THEME.panelDeep);
        ctx.fillStyle = pg;
        ctx.fill();
        ctx.restore();

        for (const btn of this.actionButtons) {
          const locked = btn.id === 'undo' ? this.undosLeft <= 0 : this.addBoltsLeft <= 0;
          const count = btn.id === 'undo' ? this.undosLeft : this.addBoltsLeft;
          this.drawActionButton(ctx, btn, locked, count);
        }

        // Tutorial copy, then transient feedback toasts on top of it.
        const guide = this.guidanceText();
        if (guide) {
          ctx.save();
          ctx.font = '800 ' + Math.round(21 * s) + 'px Fredoka, Nunito, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const lines = this.wrapLines(ctx, guide, this.width - 48 * s);
          const lh = 27 * s;
          const startY = this.messageY - (lines.length - 1) * lh / 2;
          lines.forEach((ln, i) => {
            ctx.fillStyle = 'rgba(6, 8, 34, 0.5)';
            ctx.fillText(ln, this.width / 2, startY + i * lh + 2);
            ctx.fillStyle = THEME.text;
            ctx.fillText(ln, this.width / 2, startY + i * lh);
          });
          ctx.restore();
        }

        if (this.toast) {
          const k = clamp(this.toast.t / 0.35, 0, 1);
          const rise = (1 - clamp(this.toast.t / this.toast.max, 0, 1)) * 8 * s;
          ctx.save();
          ctx.globalAlpha = k;
          ctx.font = '800 ' + Math.round(15 * s) + 'px Nunito, Fredoka, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const tw = ctx.measureText(this.toast.text).width + 28 * s;
          const th = 32 * s;
          const tx = (this.width - tw) / 2;
          const ty = this.progressBar.y - 62 * s - rise;
          ctx.beginPath();
          ctx.roundRect(tx, ty, tw, th, th / 2);
          ctx.fillStyle = 'rgba(12, 14, 52, 0.88)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(150, 130, 240, 0.6)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = '#EDE8FF';
          ctx.fillText(this.toast.text, this.width / 2, ty + th / 2);
          ctx.restore();
        }
      }

      drawActionButton(ctx, btn, locked, count) {
        const s = this.s || 1;
        const r = 16 * s;
        const dy = btn.press > 0 ? 2 * s : 0;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(btn.x, btn.y + 4 * s, btn.w, btn.h, r);
        ctx.fillStyle = locked ? 'rgba(80, 84, 120, 0.85)' : 'rgba(88, 30, 160, 0.95)';
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(btn.x, btn.y + dy, btn.w, btn.h, r);
        const g = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
        if (locked) {
          g.addColorStop(0, '#D8DAE6');
          g.addColorStop(0.5, '#B4B8CC');
          g.addColorStop(1, '#8F94AE');
        } else {
          g.addColorStop(0, '#D77BFF');
          g.addColorStop(0.45, '#A625DC');
          g.addColorStop(1, '#7A129F');
        }
        ctx.fillStyle = g;
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(btn.x + btn.w * 0.14, btn.y + dy + 4 * s, btn.w * 0.72, btn.h * 0.3, r * 0.5);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.fill();
        ctx.restore();

        const cx = btn.x + btn.w / 2;
        const cy = btn.y + btn.h / 2 + dy;
        const icon = locked ? 'rgba(94, 98, 132, 0.95)' : '#FFFFFF';
        if (btn.id === 'undo') Art.glyphUndo(ctx, cx, cy, btn.h * 0.26, icon);
        else Art.glyphAddBolt(ctx, cx, cy, btn.h * 0.28, icon);

        // Badge: remaining charges, or a padlock while still tutorial-locked.
        const bx = btn.x + btn.w - 4 * s;
        const by = btn.y + btn.h - 2 * s + dy;
        if (locked && count <= 0) {
          Art.glyphLock(ctx, bx, by - 2 * s, 10 * s, '#5A6086', '#E4E7F5');
        } else {
          ctx.save();
          ctx.beginPath();
          ctx.arc(bx, by, 11 * s, 0, Math.PI * 2);
          ctx.fillStyle = '#FF3B5C';
          ctx.fill();
          ctx.lineWidth = 2 * s;
          ctx.strokeStyle = 'rgba(255,255,255,0.8)';
          ctx.stroke();
          ctx.font = '900 ' + Math.round(13 * s) + 'px Fredoka, Nunito, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#FFFFFF';
          ctx.fillText(String(count), bx, by + 0.5 * s);
          ctx.restore();
        }
      }

      // --- Render: victory card & pre-reward celebration --------------------
      drawVictory(ctx) {
        const s = this.s || 1;
        const card = this.card;
        if (!card) return;

        // Stage 1: (0s to 1.25s): Solved board remains fully visible with celebration title and falling confetti!
        if (this.victory.t < 1.25) {
          ctx.save();
          ctx.font = '900 ' + Math.round(28 * s) + 'px Fredoka, Lilita One, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(6, 8, 34, 0.6)';
          ctx.fillText('AMAZING!', this.width / 2, this.boardTop - 36 * s + 2);
          ctx.fillStyle = '#FFE9A0';
          ctx.fillText('AMAZING!', this.width / 2, this.boardTop - 36 * s);
          ctx.restore();
          return;
        }

        // Stage 2: (1.25s onwards): Smooth scale-up and fade-in of the reward card!
        const bannerT = this.victory.t - 1.25;
        const fade = clamp(bannerT / 0.35, 0, 1);
        const pop = easeOutBack(clamp(bannerT / 0.45, 0, 1));

        ctx.save();
        ctx.fillStyle = 'rgba(5, 7, 32, ' + (0.78 * fade).toFixed(3) + ')';
        ctx.fillRect(0, 0, this.width, this.height);

        const midX = this.width / 2;
        const midY = card.y + card.h / 2;
        ctx.translate(midX, midY);
        ctx.scale(pop, pop);
        ctx.translate(-midX, -midY);

        ctx.beginPath();
        ctx.roundRect(card.x, card.y + 8 * s, card.w, card.h, 30 * s);
        ctx.fillStyle = 'rgba(10, 8, 44, 0.7)';
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(card.x, card.y, card.w, card.h, 30 * s);
        const cg = ctx.createLinearGradient(card.x, card.y, card.x, card.y + card.h);
        cg.addColorStop(0, '#6B34D6');
        cg.addColorStop(0.5, '#4B1FA8');
        cg.addColorStop(1, '#2E1173');
        ctx.fillStyle = cg;
        ctx.fill();
        ctx.lineWidth = 3 * s;
        ctx.strokeStyle = 'rgba(214, 178, 255, 0.65)';
        ctx.stroke();

        const heading = this.victory.special ? 'SPECIAL CLEARED!' : 'LEVEL COMPLETE!';
        ctx.font = '900 ' + Math.round((this.victory.special ? 25 : 27) * s) + 'px Fredoka, Lilita One, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(6, 8, 34, 0.4)';
        ctx.fillText(heading, midX, card.y + 44 * s + 2);
        ctx.fillStyle = '#FFF3C4';
        ctx.fillText(heading, midX, card.y + 44 * s);

        // Star rating, each star popping in turn.
        const starY = card.y + 108 * s;
        const gap = 62 * s;
        for (let i = 0; i < 3; i++) {
          const x = midX + (i - 1) * gap;
          const anim = this.victory.starAnim[i];
          Art.glyphStar(ctx, x, starY, 24 * s, 'rgba(255,255,255,0.14)', 'rgba(255,255,255,0.25)');
          if (anim > 0) {
            const sp = easeOutBack(anim);
            ctx.save();
            ctx.translate(x, starY - (i === 1 ? 8 * s : 0));
            ctx.scale(sp, sp);
            Art.glyphStar(ctx, 0, 0, 27 * s, '#FFD34D', '#E08A00');
            ctx.restore();
          }
        }

        ctx.font = '800 ' + Math.round(15 * s) + 'px Nunito, Fredoka, sans-serif';
        ctx.fillStyle = 'rgba(232, 224, 255, 0.85)';
        ctx.fillText('Sorted in ' + this.moves + ' moves', midX, card.y + 160 * s);

        // Coin reward row.
        const rowY = card.y + 196 * s;
        Art.glyphCoin(ctx, midX - 34 * s, rowY, 15 * s);
        ctx.font = '900 ' + Math.round(24 * s) + 'px Fredoka, Lilita One, sans-serif';
        ctx.fillStyle = '#FFE9A0';
        ctx.textAlign = 'left';
        ctx.fillText('+' + this.victory.coins, midX - 12 * s, rowY + 1);
        ctx.textAlign = 'center';

        const btn = this.nextBtn;
        ctx.beginPath();
        ctx.roundRect(btn.x, btn.y + 5 * s, btn.w, btn.h, btn.h / 2);
        ctx.fillStyle = 'rgba(20, 90, 20, 0.8)';
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(btn.x, btn.y, btn.w, btn.h, btn.h / 2);
        const bg = ctx.createLinearGradient(btn.x, btn.y, btn.x, btn.y + btn.h);
        bg.addColorStop(0, '#A6EE5C');
        bg.addColorStop(0.5, '#6BC42A');
        bg.addColorStop(1, '#4C9612');
        ctx.fillStyle = bg;
        ctx.fill();
        ctx.font = '900 ' + Math.round(20 * s) + 'px Fredoka, Lilita One, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('CONTINUE ▶', btn.x + btn.w / 2, btn.y + btn.h / 2 + 1);

        ctx.restore();
      }

      // --- Host lifecycle ----------------------------------------------------
      setPaused(paused) {
        this.paused = !!paused;
      }
    }

    // ========================================================================
    // 9. HOST BRIDGE (Flutter WebView / admin simulator / plain iframe)
    // ========================================================================
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const message = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', message);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(message);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      },
      ready() { this.post('ready'); },
      gameStarted() { this.post('gameStarted'); },
      completed(payload) { this.post('completed', payload); },
      haptic(type) { this.post('haptic', { type: type }); }
    };

    // ========================================================================
    // 10. BOOTSTRAP, RESIZE & MAIN LOOP
    // ========================================================================
    function initGame() {
      const canvas = document.getElementById('gameCanvas');
      if (!canvas) return;

      const engine = new GameEngine(canvas);
      window.__ENGINE__ = engine;

      let rafId = 0;
      let running = false;
      let lastTime = 0;

      function frame(now) {
        rafId = 0;
        try {
          const dt = Math.min(0.064, Math.max(0, (now - lastTime) / 1000));
          lastTime = now;
          engine.update(dt);
          engine.render();
        } catch (err) {
          console.error('NutBoltSort frame error:', err);
        }
        if (running) rafId = requestAnimationFrame(frame);
      }

      function startLoop() {
        if (running) return;
        running = true;
        lastTime = performance.now();
        rafId = requestAnimationFrame(frame);
      }

      // A swiped-away game stops its loop outright rather than idling, so
      // off-screen WebViews cost nothing while another game is being played.
      function stopLoop() {
        running = false;
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = 0;
        }
      }

      window.GameBridge = {
        ready: () => Host.ready(),
        restart: () => { engine.restartLevel(); },
        pause: () => { engine.setPaused(true); stopLoop(); },
        resume: () => { engine.setPaused(false); engine.synth.init(); startLoop(); },
        setSoundEnabled: (enabled) => {
          engine.synth.isMuted = !enabled;
          if (enabled) engine.synth.init();
        },
        triggerHint: () => { engine.triggerHint(); },
        getState: () => ({ level: engine.level, coins: engine.coins, moves: engine.moves })
      };

      function resize() {
        let width = window.innerWidth ||
          (window.visualViewport ? window.visualViewport.width : 0) ||
          document.documentElement.clientWidth || document.body.clientWidth || 360;
        let height = window.innerHeight ||
          (window.visualViewport ? window.visualViewport.height : 0) ||
          document.documentElement.clientHeight || document.body.clientHeight || 640;
        if (width <= 0) width = 360;
        if (height <= 0) height = 640;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        engine.setSize(width, height, dpr);

        // Keep the frozen frame correct while the loop is stopped.
        if (!running) {
          try { engine.render(); } catch (e) {}
        }
      }

      window.addEventListener('resize', resize);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize);
      }
      window.addEventListener('orientationchange', resize);
      window.addEventListener('load', resize);

      // Multi-stage layout passes eliminate the WebView zero-height black screen.
      resize();
      setTimeout(resize, 50);
      setTimeout(resize, 150);
      setTimeout(resize, 400);

      let lastTouchAt = 0;
      function press(clientX, clientY) {
        const now = Date.now();
        if (now - lastTouchAt < 120) return; // touchstart plus synthetic pointerdown
        lastTouchAt = now;
        engine.handlePointerDown(clientX, clientY);
      }

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          press(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.pointerType !== 'touch') press(e.clientX, e.clientY);
      });

      window.addEventListener('pointerup', () => engine.handlePointerUp());
      window.addEventListener('touchend', () => engine.handlePointerUp());
      window.addEventListener('pointercancel', () => engine.handlePointerUp());

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          engine.setPaused(true);
          stopLoop();
        } else {
          engine.setPaused(false);
          startLoop();
        }
      });

      startLoop();
      Host.ready();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  })();
  </script>
</body>
</html>
