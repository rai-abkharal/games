<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cyber Blade</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#f8fafc}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;c.style.width='min(100vw,56.25vh)';c.style.height='min(177.78vw,100vh)';
document.getElementById('game-container').appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

const CRYSTALS=[
  {name:'Ruby',color:'#ef4444',pts:10,r:22},
  {name:'Sapphire',color:'#3b82f6',pts:15,r:20},
  {name:'Emerald',color:'#10b981',pts:20,r:24},
  {name:'Topaz',color:'#f59e0b',pts:25,r:18},
  {name:'Amethyst',color:'#8b5cf6',pts:30,r:20}
];

let score=0,lives=3,combo=0,best=+localStorage.getItem('cyber-blade-best')||0;
let over=false,started=false,last=performance.now(),shake=0;
let items=[],halves=[],particles=[],popups=[],trail=[],spawnTimer=0;
let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,dur=0.06,type='sine',vol=0.04){
  try{
    const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
    if(A.state==='suspended')A.resume();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
    o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
  }catch(e){}
}

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=70+Math.random()*180;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,r:2+Math.random()*3,color});
  }
}

function spawnWave(){
  const count=1+Math.floor(Math.random()*3);
  for(let i=0;i<count;i++){
    const isBomb=Math.random()<0.18;
    const fromX=50+Math.random()*(W-100);
    const targetVx=(W/2-fromX)*0.8+(Math.random()-0.5)*120;
    const targetVy=-(680+Math.random()*150);

    if(isBomb){
      items.push({
        x:fromX,y:H+30,vx:targetVx,vy:targetVy,r:22,
        isBomb:true,color:'#0f172a',rot:0,vrot:(Math.random()-0.5)*4
      });
    }else{
      const type=CRYSTALS[Math.floor(Math.random()*CRYSTALS.length)];
      items.push({
        x:fromX,y:H+30,vx:targetVx,vy:targetVy,r:type.r,
        isBomb:false,...type,rot:0,vrot:(Math.random()-0.5)*5
      });
    }
  }
}

function lineIntersectsCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1,dy=y2-y1;
  const len=Math.hypot(dx,dy);
  if(len===0)return Math.hypot(x1-cx,y1-cy)<=r;
  const u=((cx-x1)*dx+(cy-y1)*dy)/(len*len);
  const clampedU=Math.max(0,Math.min(1,u));
  const nx=x1+clampedU*dx,ny=y1+clampedU*dy;
  return Math.hypot(cx-nx,cy-ny)<=r;
}

function slice(p1,p2){
  if(over)return;
  if(!started){started=true;bridge('gameStarted');}

  let slicedCount=0;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(lineIntersectsCircle(p1.x,p1.y,p2.x,p2.y,it.x,it.y,it.r)){
      if(it.isBomb){
        lives--;shake=0.4;
        burst(it.x,it.y,25,'#ef4444');
        sound(150,0.3,'sawtooth',0.08);
        bridge('haptic','heavy');
        items.splice(i,1);
        if(lives<=0)endGame();
        return;
      }else{
        slicedCount++;
        combo++;
        const pts=it.pts+(combo>=3?15:0);
        score+=pts;
        bridge('sendScoreUpdated',score,1);
        bridge('haptic','light');
        sound(600+combo*45,0.06,'triangle',0.06);
        burst(it.x,it.y,16,it.color);
        popups.push({x:it.x,y:it.y,text:`+${pts}`,color:it.color,life:0.45,max:0.45});

        // Spawn 2 Cut Halves
        halves.push({x:it.x-8,y:it.y,vx:it.vx-80,vy:it.vy-50,r:it.r*0.75,color:it.color,rot:it.rot,vrot:-6});
        halves.push({x:it.x+8,y:it.y,vx:it.vx+80,vy:it.vy-50,r:it.r*0.75,color:it.color,rot:it.rot,vrot:6});
        items.splice(i,1);
      }
    }
  }

  if(slicedCount>1){
    popups.push({x:W/2,y:H*0.25,text:`${slicedCount}× SLICE COMBO!`,color:'#0284c7',life:0.55,max:0.55});
    sound(950,0.08,'square',0.06);
  }
}

function reset(){
  score=0;lives=3;combo=0;over=false;started=true;
  items=[];halves=[];particles=[];popups=[];trail=[];
  spawnTimer=0;last=performance.now();shake=0;
  bridge('gameStarted');
}

function endGame(){
  if(over)return;
  over=true;shake=0.35;
  sound(140,0.3,'sawtooth',0.08);
  bridge('haptic','error');
  if(score>best){best=score;localStorage.setItem('cyber-blade-best',best);}
  bridge('sendGameOver',score,1,30);
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const clX=e.touches?e.touches[0].clientX:e.clientX;
  const clY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clX-r.left)*(W/r.width),y:(clY-r.top)*(H/r.height)};
}

function addTrailPoint(x,y){
  const now=performance.now();
  trail.push({x,y,t:now});
  if(trail.length>=2){
    const p1=trail[trail.length-2];
    const p2=trail[trail.length-1];
    slice(p1,p2);
  }
}

c.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started||over){reset();return;}
  const p=getPos(e);trail=[{x:p.x,y:p.y,t:performance.now()}];
},{passive:false});

c.addEventListener('touchmove',e=>{
  e.preventDefault();
  const p=getPos(e);addTrailPoint(p.x,p.y);
},{passive:false});

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(!started||over){reset();return;}
  const p=getPos(e);trail=[{x:p.x,y:p.y,t:performance.now()}];
},{passive:false});

c.addEventListener('pointermove',e=>{
  if(e.buttons>0){
    const p=getPos(e);addTrailPoint(p.x,p.y);
  }
},{passive:false});

function frame(t){
  if(isPaused||window.__GAME_PAUSED__)return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);shake-=dt;}

  // Clean Crisp White / Light Background
  ctx.fillStyle='#f8fafc';ctx.fillRect(0,0,W,H);

  if(started&&!over){
    spawnTimer+=dt;
    if(spawnTimer>=1.2){
      spawnTimer=0;
      spawnWave();
    }
  }

  // Update & Draw Items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.vy+=720*dt; // Gravity
    it.x+=it.vx*dt;
    it.y+=it.vy*dt;
    it.rot+=it.vrot*dt;

    if(it.y>H+60&&it.vy>0){
      if(!it.isBomb&&started&&!over){
        combo=0;
      }
      items.splice(i,1);
      continue;
    }

    ctx.save();
    ctx.translate(it.x,it.y);
    ctx.rotate(it.rot);

    if(it.isBomb){
      ctx.fillStyle='#0f172a';ctx.beginPath();ctx.arc(0,0,it.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(0,-it.r-4,5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('💣',0,0);
    }else{
      // Diamond Crystal Polygon
      ctx.fillStyle=it.color;
      ctx.beginPath();
      ctx.moveTo(0,-it.r);ctx.lineTo(it.r*0.8,0);ctx.lineTo(0,it.r);ctx.lineTo(-it.r*0.8,0);
      ctx.closePath();ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.moveTo(0,-it.r);ctx.lineTo(it.r*0.4,0);ctx.lineTo(0,it.r);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }

  // Update & Draw Halves
  for(let i=halves.length-1;i>=0;i--){
    const hf=halves[i];
    hf.vy+=850*dt;
    hf.x+=hf.vx*dt;
    hf.y+=hf.vy*dt;
    hf.rot+=hf.vrot*dt;

    ctx.save();
    ctx.translate(hf.x,hf.y);
    ctx.rotate(hf.rot);
    ctx.fillStyle=hf.color;
    ctx.beginPath();
    ctx.arc(0,0,hf.r,0,Math.PI);
    ctx.fill();
    ctx.restore();

    if(hf.y>H+80)halves.splice(i,1);
  }

  // Draw Blade Trail
  const now=performance.now();
  trail=trail.filter(p=>now-p.t<180);
  if(trail.length>=2){
    for(let i=1;i<trail.length;i++){
      const p1=trail[i-1];
      const p2=trail[i];
      const alpha=1-((now-p2.t)/180);
      ctx.strokeStyle=`rgba(2, 132, 199, ${alpha})`;
      ctx.lineWidth=Math.max(1,8*alpha);
      ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Popups
  for(let i=popups.length-1;i>=0;i--){
    const pp=popups[i];pp.life-=dt;pp.y-=30*dt;
    if(pp.life<=0){popups.splice(i,1);continue;}
    ctx.globalAlpha=pp.life/pp.max;ctx.fillStyle=pp.color;
    ctx.font='bold 20px sans-serif';ctx.textAlign='center';
    ctx.fillText(pp.text,pp.x,pp.y);
  }
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle='#0f172a';ctx.font='900 24px sans-serif';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,20,40);
  ctx.textAlign='right';ctx.fillStyle='#ef4444';
  let hearts='';for(let h=0;h<lives;h++)hearts+='♥ ';
  ctx.fillText(hearts,W-20,40);

  if(combo>=3){
    ctx.fillStyle='#0284c7';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
    ctx.fillText(`STREAK ×${combo}`,W/2,40);
  }

  // Start Screen
  if(!started&&!over){
    ctx.fillStyle='rgba(248,250,252,0.92)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#0f172a';ctx.font='900 34px sans-serif';
    ctx.fillText('CYBER BLADE',W/2,H*0.36);
    ctx.fillStyle='#0284c7';ctx.font='bold 15px sans-serif';
    ctx.fillText('FAST-PACED CRYSTAL SLICER',W/2,H*0.36+32);
    ctx.fillStyle='#64748b';ctx.font='14px sans-serif';
    ctx.fillText('Swipe blade across crystals & dodge bombs!',W/2,H*0.52);
    ctx.fillStyle='#0284c7';
    ctx.beginPath();ctx.roundRect(W/2-90,H*0.62,180,50,25);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';
    ctx.fillText('TAP TO PLAY',W/2,H*0.62+30);
  }

  // Game Over
  if(over){
    ctx.fillStyle='rgba(248,250,252,0.92)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.roundRect(35,H/2-130,290,260,20);ctx.fill();
    ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.strokeRect(35,H/2-130,290,260);
    ctx.textAlign='center';ctx.fillStyle='#ef4444';ctx.font='900 26px sans-serif';
    ctx.fillText('BLADE SHATTERED',W/2,H/2-70);
    ctx.fillStyle='#0f172a';ctx.font='900 48px sans-serif';
    ctx.fillText(score,W/2,H/2-10);
    ctx.fillStyle='#64748b';ctx.font='14px sans-serif';
    ctx.fillText(`BEST SCORE: ${best}`,W/2,H/2+38);
    ctx.fillStyle='#0284c7';
    ctx.beginPath();ctx.roundRect(W/2-85,H/2+62,170,44,22);ctx.fill();
    ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';
    ctx.fillText('PLAY AGAIN',W/2,H/2+89);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
