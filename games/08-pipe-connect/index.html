<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Pipe Connect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#090d1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0f172a}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;c.style.width='min(100vw,56.25vh)';c.style.height='min(177.78vw,100vh)';
document.getElementById('game-container').appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

const GRID_SIZE=4;
let grid=[],level=1,score=0,best=+localStorage.getItem('pipe-connect-best')||0;
let over=false,started=false,last=performance.now(),shake=0,levelTime=35;
let particles=[],popups=[];
let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,dur=0.06,type='sine',vol=0.04){
  try{
    const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
    if(A.state==='suspended')A.resume();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
    o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
  }catch(e){}
}

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,r:2+Math.random()*3,color});
  }
}

// Pipe openings: [TOP, RIGHT, BOTTOM, LEFT]
const TYPES=[
  {type:'straight',dirs:[true,false,true,false]},
  {type:'elbow',dirs:[true,true,false,false]},
  {type:'cross',dirs:[true,true,true,true]},
  {type:'t',dirs:[true,true,false,true]}
];

function initGrid(){
  grid=[];
  const cellSize=68,gap=8;
  const startX=(W-(GRID_SIZE*cellSize+(GRID_SIZE-1)*gap))/2;
  const startY=H*0.22;

  for(let r=0;r<GRID_SIZE;r++){
    grid[r]=[];
    for(let col=0;col<GRID_SIZE;col++){
      const template=TYPES[Math.floor(Math.random()*TYPES.length)];
      const rot=Math.floor(Math.random()*4);
      grid[r][col]={
        x:startX+col*(cellSize+gap),
        y:startY+r*(cellSize+gap),
        w:cellSize,h:cellSize,
        type:template.type,
        baseDirs:[...template.dirs],
        rot,
        targetRot:rot,
        connected:false
      };
    }
  }
  checkFlow();
}

function getDirs(cell){
  const r=(Math.round(cell.rot)%4+4)%4;
  const d=cell.baseDirs;
  return [
    d[(4-r)%4],
    d[(5-r)%4],
    d[(6-r)%4],
    d[(7-r)%4]
  ];
}

function checkFlow(){
  for(let r=0;r<GRID_SIZE;r++){
    for(let col=0;col<GRID_SIZE;col++)grid[r][col].connected=false;
  }

  // Source at (0,0) - connected if top or left is open
  const queue=[{r:0,col:0}];
  grid[0][0].connected=true;
  const visited=new Set(['0,0']);

  while(queue.length>0){
    const {r,col}=queue.shift();
    const curr=grid[r][col];
    const dirs=getDirs(curr);

    const neighbors=[
      {nr:r-1,nc:col,fromDir:2,toDir:0}, // Top
      {nr:r,nc:col+1,fromDir:3,toDir:1}, // Right
      {nr:r+1,nc:col,fromDir:0,toDir:2}, // Bottom
      {nr:r,nc:col-1,fromDir:1,toDir:3}  // Left
    ];

    for(const {nr,nc,fromDir,toDir} of neighbors){
      if(nr>=0&&nr<GRID_SIZE&&nc>=0&&nc<GRID_SIZE&&!visited.has(`${nr},${nc}`)){
        const next=grid[nr][nc];
        const nextDirs=getDirs(next);
        if(dirs[toDir]&&nextDirs[fromDir]){
          next.connected=true;
          visited.add(`${nr},${nc}`);
          queue.push({r:nr,col:nc});
        }
      }
    }
  }

  // Check if drain (3,3) connected
  if(grid[GRID_SIZE-1][GRID_SIZE-1].connected){
    levelComplete();
  }
}

function levelComplete(){
  const pts=200+Math.round(levelTime*10);
  score+=pts;level++;levelTime=Math.max(20,35-level);
  sound(750,0.15,'triangle',0.06);
  bridge('sendScoreUpdated',score,1);
  bridge('haptic','medium');
  burst(W/2,H/2,25,'#38bdf8');
  popups.push({x:W/2,y:H*0.18,text:`LEVEL COMPLETE! +${pts}`,color:'#38bdf8',life:0.7,max:0.7});
  setTimeout(initGrid,400);
}

function rotateCell(cell){
  if(over)return;
  if(!started){started=true;bridge('gameStarted');}
  cell.targetRot+=1;
  sound(440,0.04,'sine',0.04);
  bridge('haptic','light');
}

function reset(){
  score=0;level=1;levelTime=35;over=false;started=true;
  particles=[];popups=[];last=performance.now();shake=0;
  initGrid();
  bridge('gameStarted');
}

function endGame(){
  if(over)return;
  over=true;shake=0.3;
  sound(140,0.3,'sawtooth',0.08);
  if(score>best){best=score;localStorage.setItem('pipe-connect-best',best);}
  bridge('sendGameOver',score,1,30);
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const clX=e.touches?e.touches[0].clientX:e.clientX;
  const clY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clX-r.left)*(W/r.width),y:(clY-r.top)*(H/r.height)};
}

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=getPos(e);
  if(!started||over){reset();return;}

  for(let r=0;r<GRID_SIZE;r++){
    for(let col=0;col<GRID_SIZE;col++){
      const cell=grid[r][col];
      if(p.x>=cell.x&&p.x<=cell.x+cell.w&&p.y>=cell.y&&p.y<=cell.y+cell.h){
        rotateCell(cell);
        break;
      }
    }
  }
},{passive:false});

initGrid();

function frame(t){
  if(isPaused||window.__GAME_PAUSED__)return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);shake-=dt;}

  // Background
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);

  if(started&&!over){
    levelTime-=dt;
    if(levelTime<=0)endGame();
  }

  // HUD
  ctx.fillStyle='#ffffff';ctx.font='bold 22px sans-serif';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,20,40);
  ctx.textAlign='right';ctx.fillStyle=levelTime<8?'#ef4444':'#fbbf24';
  ctx.fillText(`TIME: ${Math.ceil(levelTime)}s`,W-20,40);

  // Draw Grid
  let needCheck=false;
  for(let r=0;r<GRID_SIZE;r++){
    for(let col=0;col<GRID_SIZE;col++){
      const cell=grid[r][col];
      
      // Smooth Rotation
      if(cell.rot<cell.targetRot){
        cell.rot+=(cell.targetRot-cell.rot)*0.25;
        if(Math.abs(cell.targetRot-cell.rot)<0.02){cell.rot=cell.targetRot;needCheck=true;}
      }

      ctx.save();
      ctx.translate(cell.x+cell.w/2,cell.y+cell.h/2);
      ctx.rotate(cell.rot*Math.PI/2);

      // Cell Background
      ctx.fillStyle='#1e293b';ctx.fillRect(-cell.w/2,-cell.h/2,cell.w,cell.h);
      ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ctx.strokeRect(-cell.w/2,-cell.h/2,cell.w,cell.h);

      // Draw Pipe Shape
      ctx.strokeStyle=cell.connected?'#38bdf8':'#64748b';
      ctx.lineWidth=14;ctx.lineCap='round';

      const d=cell.baseDirs;
      // Top
      if(d[0]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-cell.h/2);ctx.stroke();}
      // Right
      if(d[1]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(cell.w/2,0);ctx.stroke();}
      // Bottom
      if(d[2]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,cell.h/2);ctx.stroke();}
      // Left
      if(d[3]){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-cell.w/2,0);ctx.stroke();}

      // Center Node
      ctx.fillStyle=cell.connected?'#38bdf8':'#64748b';
      ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();

      ctx.restore();
    }
  }

  if(needCheck)checkFlow();

  // Draw Source (Top-Left) and Drain (Bottom-Right) indicators
  ctx.fillStyle='#38bdf8';ctx.font='bold 12px sans-serif';ctx.textAlign='center';
  ctx.fillText('💧 SOURCE',grid[0][0].x+34,grid[0][0].y-10);
  ctx.fillStyle='#22c55e';
  ctx.fillText('DRAIN 🏁',grid[GRID_SIZE-1][GRID_SIZE-1].x+34,grid[GRID_SIZE-1][GRID_SIZE-1].y+grid[0][0].h+20);

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Popups
  for(let i=popups.length-1;i>=0;i--){
    const pp=popups[i];pp.life-=dt;pp.y-=25*dt;
    if(pp.life<=0){popups.splice(i,1);continue;}
    ctx.globalAlpha=pp.life/pp.max;ctx.fillStyle=pp.color;
    ctx.font='bold 18px sans-serif';ctx.textAlign='center';
    ctx.fillText(pp.text,pp.x,pp.y);
  }
  ctx.globalAlpha=1;

  // Start Screen
  if(!started&&!over){
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 32px sans-serif';
    ctx.fillText('PIPE CONNECT',W/2,H*0.36);
    ctx.fillStyle='#38bdf8';ctx.font='bold 14px sans-serif';
    ctx.fillText('GRID WATER FLOW PUZZLE',W/2,H*0.36+30);
    ctx.fillStyle='#94a3b8';ctx.font='13px sans-serif';
    ctx.fillText('Tap pipe tiles to connect water from source to drain!',W/2,H*0.52);
    ctx.fillStyle='#0284c7';ctx.fillRect(W/2-90,H*0.62,180,48);
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';
    ctx.fillText('TAP TO PLAY',W/2,H*0.62+30);
  }

  // Game Over
  if(over){
    ctx.fillStyle='rgba(15,23,42,0.88)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1e293b';ctx.fillRect(35,H/2-130,290,260);
    ctx.strokeStyle='#ef4444';ctx.lineWidth=2;ctx.strokeRect(35,H/2-130,290,260);
    ctx.textAlign='center';ctx.fillStyle='#ef4444';ctx.font='bold 26px sans-serif';
    ctx.fillText('TIME UP!',W/2,H/2-70);
    ctx.fillStyle='#ffffff';ctx.font='bold 48px sans-serif';
    ctx.fillText(score,W/2,H/2-10);
    ctx.fillStyle='#94a3b8';ctx.font='14px sans-serif';
    ctx.fillText(`BEST SCORE: ${best}`,W/2,H/2+38);
    ctx.fillStyle='#0284c7';ctx.fillRect(W/2-85,H/2+62,170,44);
    ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';
    ctx.fillText('PLAY AGAIN',W/2,H/2+89);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
