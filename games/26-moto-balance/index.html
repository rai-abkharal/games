<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Moto Balance: Wheelie Run</title>
  <style>
    :root { color-scheme: dark; --native-dock-safe: 0px; }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #071827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { overscroll-behavior: none; }
    #game-root { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: radial-gradient(circle at 50% 22%, #14445f 0%, #0a2339 58%, #050d18 100%); }
    canvas {
      display: block;
      width: min(100vw, 56.25vh) !important;
      height: min(177.7778vw, 100vh) !important;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .75), 0 0 0 1px rgba(226, 248, 255, .16);
      border-radius: clamp(0px, 1.5vw, 18px);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    .native-host canvas { width: 100% !important; height: 100% !important; box-shadow: none; border-radius: 0; }
  </style>
</head>
<body>
  <div id="game-root" aria-label="Moto Balance Wheelie Run"></div>
  <script src="assets/phaser-full.min.js"></script>
  <script>window.Phaser || document.write('<script src="../../shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="../shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="/shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"><\/script>')</script>
  <script>
  (() => {
    'use strict';

    if (typeof Phaser === 'undefined') {
      const root = document.getElementById('game-root');
      if (root) {
        root.innerHTML = '<div style="color:#eff6ff;padding:32px 20px;text-align:center;font-family:system-ui,-apple-system,sans-serif;max-width:320px;">' +
          '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">Game Engine Loading Error</div>' +
          '<div style="font-size:13px;color:#94a3b8;line-height:1.5;">Phaser 3 could not be loaded. Please ensure you have an active network connection or that phaser-full.min.js is present.</div>' +
          '</div>';
      }
      return;
    }

    const W = 360;
    const H = 640;
    const ROAD_DEPTH = 34;
    const GAME_ID = 'moto-balance';
    const VERSION = '1.1.0';
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

    const SETTINGS = {
      maxSpeed: 8.2,
      driveForce: 0.0138,
      wheelTorque: 0.0052,
      wheelieLiftTorque: 0.088,
      brakeDecel: 0.014,
      brakeFrontDownTorque: 0.068,
      crashTilt: 1.25, // approx 72 degrees over-rotation crash threshold
      color: 0x06d6a0,
      colorHex: '#06d6a0',
      accent: 0xffd166
    };

    const Host = {
      post(action, payload = {}) {
        const message = JSON.stringify({ source: 'GameBridge', action, payload });
        try { if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) window.flutter_inappwebview.callHandler('GameBridgeChannel', message); } catch (_) {}
        try { if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) window.FlutterGameBridge.postMessage(message); } catch (_) {}
        try { if (window.parent && window.parent !== window) window.parent.postMessage({ source: 'GameBridge', action, payload }, '*'); } catch (_) {}
      },
      haptic(type = 'light') {
        this.post('haptic', { type });
        try {
          if (navigator.vibrate) navigator.vibrate(type === 'heavy' ? 36 : type === 'medium' ? 18 : 8);
        } catch (_) {}
      }
    };

    class AudioBed {
      constructor() {
        this.enabled = true;
        this.ctx = null;
        this.engineOsc = null;
        this.engineGain = null;
      }
      unlock() {
        if (!this.enabled || this.ctx) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new Ctx();
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.value = 35;
          this.engineGain.gain.value = 0;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 380;
          this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        } catch (_) { this.ctx = null; }
      }
      setEngine(speed, accelerating) {
        if (!this.ctx || !this.engineOsc || !this.engineGain || !this.enabled) return;
        const now = this.ctx.currentTime;
        const targetFreq = 34 + Math.max(0, speed) * 18 + (accelerating ? 24 : 0);
        const targetGain = accelerating ? Math.min(0.08, 0.035 + speed * 0.007) : (speed > 0.3 ? 0.02 : 0.008);
        this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.05);
        this.engineGain.gain.setTargetAtTime(targetGain, now, 0.08);
      }
      beep(freq = 620, length = 0.06, type = 'sine', volume = 0.09) {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = type; osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + length);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + length + 0.01);
        } catch (_) {}
      }
      crash() {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(28, now + 0.45);
          gain.gain.setValueAtTime(0.24, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.50);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.52);
        } catch (_) {}
      }
      setEnabled(value) {
        this.enabled = Boolean(value);
        if (!this.enabled && this.engineGain && this.ctx) this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime);
      }
    }

    function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function modulo(value, divisor) { return ((value % divisor) + divisor) % divisor; }
    function normalizeAngle(angle) {
      let a = angle;
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }
    function rotate(local, angle) {
      const c = Math.cos(angle), s = Math.sin(angle);
      return { x: local.x * c - local.y * s, y: local.x * s + local.y * c };
    }
    function hex(color) { return '#' + color.toString(16).padStart(6, '0'); }

    class BestScores {
      constructor() { this.key = 'moto-wheelie-run-v2'; }
      read() {
        let scores = { allTime: 0, maxWheelie: 0 };
        try { scores = Object.assign(scores, JSON.parse(localStorage.getItem(this.key) || '{}')); } catch (_) {}
        return scores;
      }
      commit(score, maxWheelie = 0) {
        const scores = this.read();
        scores.allTime = Math.max(scores.allTime || 0, score);
        scores.maxWheelie = Math.max(scores.maxWheelie || 0, maxWheelie);
        try { localStorage.setItem(this.key, JSON.stringify(scores)); } catch (_) {}
        return scores;
      }
    }

    class MotoBalanceScene extends Phaser.Scene {
      constructor() { super({ key: 'MotoBalanceScene' }); }

      preload() {
        this.load.image('moto-bike-body', 'assets/bike.png');
        this.load.image('moto-tyre', 'assets/tyre.png');
        this.load.image('moto-environment-sheet', 'assets/environment-spritesheet.png');
      }

      create() {
        this.M = Phaser.Physics.Matter.Matter;
        this.audio = new AudioBed();
        this.bestScores = new BestScores();
        this.skyG = this.add.graphics();
        this.skyG.setDepth(0);
        this.g = this.add.graphics();
        this.g.setDepth(2);
        this.textPool = [];
        this.textIndex = 0;
        this.state = 'home';
        this.pausedByHost = false;
        this.pointerControls = new Map();
        this.keyLeft = false; this.keyRight = false;
        this.leftHeld = false; this.rightHeld = false;
        this.particles = [];
        this.floatingTexts = [];
        this.terrainBodies = [];
        this.riderConstraints = [];
        this.cameraX = 0;
        this.score = 0;
        this.finalScore = 0;
        this.timeLeft = 60;
        this.countdown = 0;
        this.crashTimer = 0;
        this.shake = 0;
        this.respawnFlash = 0;

        // Wheelie mechanics
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.maxWheelie = 0;
        this.wheelieCombo = 1;
        this.wheeliePointsAccum = 0;

        this.matter.world.engine.positionIterations = 9;
        this.matter.world.engine.velocityIterations = 7;
        this.matter.world.engine.constraintIterations = 4;
        this.matter.world.setGravity(0, 1.15);
        this.matter.world.on('collisionstart', this.onCollisionStart, this);
        this.matter.world.on('collisionactive', this.onCollisionActive, this);

        this.createBike();
        this.createBikeVisuals();
        this.createEnvironment();
        this.installInput();
        this.resetWorld();
        this.matter.world.pause();
        this.installHostBridge();
        Host.post('ready', { gameId: GAME_ID, version: VERSION });
      }

      installHostBridge() {
        const clearInputs = () => this.clearInputs();
        window.GameBridge = {
          pause: () => { this.pausedByHost = true; clearInputs(); this.matter.world.pause(); this.audio.setEngine(0, false); },
          resume: () => { this.pausedByHost = false; if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') this.matter.world.resume(); },
          restart: () => this.startRun(),
          setSoundEnabled: (enabled) => this.audio.setEnabled(enabled)
        };
        window.addEventListener('blur', () => { this.pausedByHost = true; clearInputs(); this.matter.world.pause(); });
        window.addEventListener('focus', () => { if (!document.hidden) { this.pausedByHost = false; if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') this.matter.world.resume(); } });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { this.pausedByHost = true; clearInputs(); this.matter.world.pause(); }
          else if (window.__GAME_ACTIVE__ !== false) { this.pausedByHost = false; if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') this.matter.world.resume(); }
        });
      }

      installInput() {
        const canvas = this.game.canvas;
        const point = (event) => {
          const rect = canvas.getBoundingClientRect();
          return { x: clamp((event.clientX - rect.left) * W / rect.width, 0, W), y: clamp((event.clientY - rect.top) * H / rect.height, 0, H) };
        };
        const down = (event) => {
          event.preventDefault(); this.audio.unlock();
          const p = point(event);
          try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
          this.handlePress(event.pointerId, p.x, p.y);
        };
        const up = (event) => { this.pointerControls.delete(event.pointerId); this.refreshHeldButtons(); };
        canvas.addEventListener('pointerdown', down, { passive: false });
        canvas.addEventListener('pointerup', up, { passive: false });
        canvas.addEventListener('pointercancel', up, { passive: false });
        canvas.addEventListener('pointerleave', (event) => { if (event.buttons === 0) up(event); }, { passive: false });
        window.addEventListener('pointerup', up, { passive: false });
        window.addEventListener('pointercancel', up, { passive: false });
        window.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') { this.keyLeft = true; event.preventDefault(); }
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd' || event.key.toLowerCase() === 'w') { this.keyRight = true; event.preventDefault(); }
          if (event.key === ' ' || event.key === 'Enter') {
            if (this.state === 'home') this.startRun();
            else if (this.state === 'gameover') this.startRun();
            event.preventDefault();
          }
        });
        window.addEventListener('keyup', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') this.keyLeft = false;
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd' || event.key.toLowerCase() === 'w') this.keyRight = false;
        });
      }

      handlePress(pointerId, x, y) {
        if (this.state === 'playing') {
          // Controls zone: y between 440 and 590 (Comfortably raised from bottom)
          if (y >= 440 && y <= 590) {
            this.pointerControls.set(pointerId, x < W / 2 ? 'left' : 'right');
            this.refreshHeldButtons();
            Host.haptic('light');
            return;
          }
          return;
        }
        if (this.state === 'home') {
          // Start Button Area
          if (y >= 440 && y <= 530) {
            this.startRun();
            return;
          }
        }
        if (this.state === 'gameover') {
          if (y >= 460 && y <= 540) {
            this.startRun();
            return;
          }
        }
      }

      refreshHeldButtons() {
        this.leftHeld = this.keyLeft || Array.from(this.pointerControls.values()).includes('left');
        this.rightHeld = this.keyRight || Array.from(this.pointerControls.values()).includes('right');
      }

      clearInputs() { this.pointerControls.clear(); this.keyLeft = false; this.keyRight = false; this.leftHeld = false; this.rightHeld = false; }

      createBike() {
        const M = this.M;
        this.bikeGroup = this.matter.world.nextGroup(true);
        const group = this.bikeGroup;
        const sameBike = { group };
        this.chassis = M.Bodies.rectangle(132, 301, 108, 23, {
          label: 'moto-chassis', density: 0.0024, frictionAir: 0.018, restitution: 0.04,
          chamfer: { radius: 7 }, collisionFilter: sameBike
        });
        this.rearWheel = M.Bodies.circle(88, 340, 22, {
          label: 'rear-wheel', density: 0.0026, friction: 0.98, frictionStatic: 1.6,
          frictionAir: 0.006, restitution: 0.02, collisionFilter: sameBike
        });
        this.frontWheel = M.Bodies.circle(177, 340, 22, {
          label: 'front-wheel', density: 0.0026, friction: 0.98, frictionStatic: 1.6,
          frictionAir: 0.006, restitution: 0.02, collisionFilter: sameBike
        });
        [this.chassis, this.rearWheel, this.frontWheel].forEach((body) => { body.plugin.role = body.label; });
        this.matter.world.add([this.chassis, this.rearWheel, this.frontWheel]);

        this.torso = M.Bodies.rectangle(124, 252, 27, 45, {
          label: 'rider-torso', density: 0.0012, frictionAir: 0.028, chamfer: { radius: 10 }, collisionFilter: sameBike
        });
        this.head = M.Bodies.circle(111, 217, 15, { label: 'rider-head', density: 0.0011, frictionAir: 0.02, collisionFilter: sameBike });
        this.rearKnee = M.Bodies.circle(102, 291, 10, { label: 'rider-rear-knee', density: 0.0010, frictionAir: 0.02, collisionFilter: sameBike });
        this.frontKnee = M.Bodies.circle(148, 286, 10, { label: 'rider-front-knee', density: 0.0010, frictionAir: 0.02, collisionFilter: sameBike });
        this.rearHand = M.Bodies.circle(166, 281, 7, { label: 'rider-rear-hand', density: 0.0008, frictionAir: 0.02, collisionFilter: sameBike });
        this.frontHand = M.Bodies.circle(173, 282, 7, { label: 'rider-front-hand', density: 0.0008, frictionAir: 0.02, collisionFilter: sameBike });
        this.riderBodies = [this.torso, this.head, this.rearKnee, this.frontKnee, this.rearHand, this.frontHand];
        this.riderBodies.forEach((body) => { body.plugin.role = body.label; });
        this.matter.world.add(this.riderBodies);
        this.buildRiderConstraints();
      }

      createBikeVisuals() {
        this.usingBikeSprites = this.textures.exists('moto-bike-body') && this.textures.exists('moto-tyre');
        if (!this.usingBikeSprites) return;
        if (this.textures.get('moto-bike-body')) this.textures.get('moto-bike-body').setFilter(Phaser.Textures.FilterMode.LINEAR);
        if (this.textures.get('moto-tyre')) this.textures.get('moto-tyre').setFilter(Phaser.Textures.FilterMode.LINEAR);

        const tyre = () => this.add.image(0, 0, 'moto-tyre').setOrigin(0.5).setDisplaySize(51, 51).setDepth(3).setVisible(false);
        this.rearTyreSprite = tyre();
        this.frontTyreSprite = tyre();
        this.bikeBodySprite = this.add.image(0, 0, 'moto-bike-body').setOrigin(0.5).setDisplaySize(140, 140).setDepth(4).setVisible(false);
      }

      syncBikeVisuals(visible) {
        if (!this.usingBikeSprites) return;
        this.rearTyreSprite.setVisible(visible);
        this.frontTyreSprite.setVisible(visible);
        this.bikeBodySprite.setVisible(visible);
        if (!visible) return;
        const rear = this.worldPoint(this.rearWheel);
        const front = this.worldPoint(this.frontWheel);
        this.rearTyreSprite.setPosition(rear.x, rear.y).setRotation(this.rearWheel.angle);
        this.frontTyreSprite.setPosition(front.x, front.y).setRotation(this.frontWheel.angle);
        const visualOffset = rotate({ x: 0, y: 5.5 }, this.chassis.angle);
        this.bikeBodySprite
          .setPosition(this.sx(this.chassis.position.x + visualOffset.x), this.chassis.position.y + visualOffset.y)
          .setRotation(this.chassis.angle);
      }

      createEnvironment() {
        const sourceTexture = this.textures.get('moto-environment-sheet');
        const source = sourceTexture && sourceTexture.getSourceImage();
        this.environmentLayers = [];
        this.environmentClouds = [];
        if (!source) return;

        const layers = [
          { key: 'env-far-range', x: 16, y: 8, w: 950, h: 143, screenY: 239, scale: 0.73, speed: 0.055, alpha: 0.77 },
          { key: 'env-mid-range', x: 16, y: 164, w: 950, h: 116, screenY: 284, scale: 0.84, speed: 0.105, alpha: 0.88 },
          { key: 'env-deep-range', x: 16, y: 283, w: 950, h: 120, screenY: 319, scale: 0.80, speed: 0.165, alpha: 0.95 },
          { key: 'env-green-range', x: 16, y: 410, w: 950, h: 111, screenY: 337, scale: 0.68, speed: 0.220, alpha: 1 },
          { key: 'env-forest-range', x: 16, y: 535, w: 950, h: 98, screenY: 353, scale: 0.57, speed: 0.285, alpha: 1 }
        ];
        const crop = (layer) => {
          const texture = this.textures.createCanvas(layer.key, layer.w, layer.h);
          texture.context.clearRect(0, 0, layer.w, layer.h);
          texture.context.drawImage(source, layer.x, layer.y, layer.w, layer.h, 0, 0, layer.w, layer.h);
          texture.refresh();
          const tile = this.add.tileSprite(W / 2, layer.screenY, W + 6, layer.h * layer.scale, layer.key)
            .setOrigin(0.5).setDepth(1).setAlpha(layer.alpha);
          tile.tileScaleX = layer.scale;
          tile.tileScaleY = layer.scale;
          return { tile, speed: layer.speed };
        };
        this.environmentLayers = layers.map(crop);

        const makeCloud = (key, x, y, w, h, width, height, start, speed, screenY, alpha = 1) => {
          const texture = this.textures.createCanvas(key, w, h);
          texture.context.clearRect(0, 0, w, h);
          texture.context.drawImage(source, x, y, w, h, 0, 0, w, h);
          texture.refresh();
          const image = this.add.image(0, screenY, key).setOrigin(0.5).setDisplaySize(width, height).setDepth(1).setAlpha(alpha);
          return { image, start, speed, width };
        };
        this.environmentClouds = [
          makeCloud('env-cloud-large', 976, 452, 250, 144, 124, 71, 74, 0.028, 126, 0.84),
          makeCloud('env-cloud-small', 1200, 472, 240, 103, 96, 41, 312, 0.041, 187, 0.72),
          makeCloud('env-cloud-low', 979, 595, 245, 94, 112, 43, 208, 0.034, 222, 0.64)
        ];
        this.updateEnvironment();
      }

      updateEnvironment() {
        if (!this.environmentLayers) return;
        for (const layer of this.environmentLayers) layer.tile.tilePositionX = this.cameraX * layer.speed;
        for (const cloud of this.environmentClouds) {
          cloud.image.x = modulo(cloud.start - this.cameraX * cloud.speed, W + cloud.width * 2) - cloud.width;
        }
      }

      buildRiderConstraints() {
        if (this.riderConstraints.length) this.matter.world.remove(this.riderConstraints);
        const c = (a, pointA, b, pointB, length, stiffness, damping) => this.M.Constraint.create({ bodyA: a, pointA, bodyB: b, pointB, length, stiffness, damping, render: { visible: false } });
        this.riderConstraints = [
          c(this.chassis, { x: -11, y: -10 }, this.torso, { x: 0, y: 17 }, 28, 0.54, 0.16),
          c(this.chassis, { x: 6, y: -9 }, this.torso, { x: 0, y: 17 }, 31, 0.42, 0.15),
          c(this.torso, { x: -5, y: -21 }, this.head, { x: 0, y: 10 }, 13, 0.48, 0.14),
          c(this.torso, { x: -4, y: 17 }, this.rearKnee, { x: 0, y: 0 }, 29, 0.34, 0.14),
          c(this.rearKnee, { x: 0, y: 0 }, this.chassis, { x: -37, y: 4 }, 25, 0.34, 0.12),
          c(this.torso, { x: 8, y: 15 }, this.frontKnee, { x: 0, y: 0 }, 29, 0.34, 0.14),
          c(this.frontKnee, { x: 0, y: 0 }, this.chassis, { x: 28, y: 3 }, 25, 0.34, 0.12),
          c(this.torso, { x: 10, y: -12 }, this.rearHand, { x: 0, y: 0 }, 52, 0.30, 0.12),
          c(this.rearHand, { x: 0, y: 0 }, this.chassis, { x: 48, y: -14 }, 18, 0.44, 0.15),
          c(this.torso, { x: 11, y: -8 }, this.frontHand, { x: 0, y: 0 }, 53, 0.30, 0.12),
          c(this.frontHand, { x: 0, y: 0 }, this.chassis, { x: 50, y: -15 }, 14, 0.46, 0.15)
        ];
        this.matter.world.add(this.riderConstraints);
      }

      terrainHeight() { return 365; }

      resetWorld() {
        this.clearInputs();
        for (const entry of this.terrainBodies) this.matter.world.remove(entry.body);
        this.terrainBodies = [];
        this.nextTerrainX = -480;
        const M = this.M;
        const ground = this.terrainHeight();
        const set = (body, x, y, angle = 0) => {
          M.Body.setPosition(body, { x, y }); M.Body.setVelocity(body, { x: 0, y: 0 }); M.Body.setAngle(body, angle); M.Body.setAngularVelocity(body, 0); body.force.x = 0; body.force.y = 0; body.torque = 0;
        };
        set(this.rearWheel, 88, ground - 22);
        set(this.frontWheel, 177, ground - 22);
        set(this.chassis, 132, ground - 58);
        set(this.torso, 122, ground - 111, -0.05);
        set(this.head, 108, ground - 149);
        set(this.rearKnee, 99, ground - 78);
        set(this.frontKnee, 148, ground - 78);
        set(this.rearHand, 166, ground - 84);
        set(this.frontHand, 173, ground - 83);
        this.buildRiderConstraints();
        this.ensureTerrain(1100);
        this.cameraX = this.chassis.position.x - 124;
        this.score = 0; this.finalScore = 0; this.crashTimer = 0; this.shake = 0;
        this.wheelieActive = false; this.wheelieTime = 0; this.wheelieCombo = 1; this.wheeliePointsAccum = 0;
        this.particles = []; this.floatingTexts = [];
      }

      ensureTerrain(targetX) {
        const step = 54;
        while (this.nextTerrainX < targetX) {
          const x1 = this.nextTerrainX;
          const x2 = x1 + step;
          const y1 = this.terrainHeight(x1);
          const y2 = this.terrainHeight(x2);
          const angle = Math.atan2(y2 - y1, step);
          const midY = (y1 + y2) / 2 + ROAD_DEPTH / 2;
          const body = this.M.Bodies.rectangle((x1 + x2) / 2, midY, step + 2, ROAD_DEPTH, {
            isStatic: true, label: 'terrain', friction: 1.0, frictionStatic: 1.8, restitution: 0.01,
            angle, collisionFilter: { group: 0 }

          body.plugin.role = 'terrain';
          this.matter.world.add(body);
          this.terrainBodies.push({ body, x2 });
          this.nextTerrainX += step;
        }
      }

      pruneTerrain() {
        const cutoff = this.cameraX - 320;
        while (this.terrainBodies.length && this.terrainBodies[0].x < cutoff) {
          this.matter.world.remove(this.terrainBodies.shift().body);
        }
      }

      startRun() {
        this.audio.unlock();
        this.matter.world.resume();
        this.resetWorld();
        this.state = 'countdown';
        this.countdown = 2.0;
        this.timeLeft = 60;
        this.audio.beep(510, 0.08, 'triangle', 0.10);
        Host.haptic('medium');
      }

      beginPlaying() {
        this.state = 'playing';
        this.audio.beep(780, 0.12, 'triangle', 0.12);
        Host.post('gameStarted', { mode: 'Standard' });
        Host.haptic('medium');
      }

      onCollisionStart(event) { this.inspectPairs(event.pairs, true); }
      onCollisionActive(event) { this.inspectPairs(event.pairs, false); }
      inspectPairs(pairs, started) {
        if (this.state !== 'playing') return;
        for (const pair of pairs) {
          const a = pair.bodyA, b = pair.bodyB;
          const body = a.plugin && a.plugin.role === 'terrain' ? b : b.plugin && b.plugin.role === 'terrain' ? a : null;
          if (!body || !body.plugin) continue;
          const role = body.plugin.role;
          if (role === 'rear-wheel' || role === 'front-wheel') continue;
          const impact = Math.hypot(body.velocity.x, body.velocity.y);
          const tilted = Math.abs(normalizeAngle(this.chassis.angle)) > SETTINGS.crashTilt;
          const headHit = role === 'rider-head' && (started || impact > 0.6);
          const hardFrameHit = role === 'moto-chassis' && tilted;
          const torsoHit = role === 'rider-torso' && impact > 1.8;
          if (headHit || hardFrameHit || torsoHit) {
            this.triggerCrash('Impact Crash');
            break;
          }
        }
      }

      triggerCrash(reason = 'crash') {
        if (this.state !== 'playing') return;
        this.clearInputs();
        this.audio.crash();
        this.audio.setEngine(0, false);
        Host.haptic('heavy');
        this.spawnImpact(this.chassis.position.x + 20, this.chassis.position.y);
        this.shake = 16;
        this.state = 'crashing';
        this.crashTimer = 0.65; // Short tumble, then instant respawn
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.addFloatingText('CRASH! FLIPPED!', this.sx(this.chassis.position.x), this.chassis.position.y - 45, 0xff5f79);

        // Ragdoll rider tumble
        if (this.riderConstraints.length) {
          this.matter.world.remove(this.riderConstraints);
          this.riderConstraints = [];
        }
        this.M.Body.applyForce(this.torso, this.torso.position, { x: 0.018, y: -0.022 });
        this.M.Body.setAngularVelocity(this.chassis, this.chassis.angularVelocity + (Math.random() > 0.5 ? 0.24 : -0.24));
      }

      respawnBike() {
        const M = this.M;
        const targetX = this.cameraX + 130;
        const ground = this.terrainHeight();
        const set = (body, x, y, angle = 0) => {
          M.Body.setPosition(body, { x, y });
          M.Body.setVelocity(body, { x: 0, y: 0 });
          M.Body.setAngle(body, angle);
          M.Body.setAngularVelocity(body, 0);
          body.force.x = 0; body.force.y = 0; body.torque = 0;
        };
        set(this.rearWheel, targetX - 44, ground - 22);
        set(this.frontWheel, targetX + 45, ground - 22);
        set(this.chassis, targetX, ground - 58);
        set(this.torso, targetX - 10, ground - 111, -0.05);
        set(this.head, targetX - 24, ground - 149);
        set(this.rearKnee, targetX - 33, ground - 78);
        set(this.frontKnee, targetX + 16, ground - 78);
        set(this.rearHand, targetX + 34, ground - 84);
        set(this.frontHand, targetX + 41, ground - 83);
        this.buildRiderConstraints();
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.respawnFlash = 0.5;
        this.addFloatingText('⚡ RESPAWNED! GO!', this.sx(targetX), ground - 100, 0x06d6a0);
        this.audio.beep(640, 0.08, 'sine', 0.09);
      }

      showGameOver() {
        if (this.state === 'gameover') return;
        this.state = 'gameover';
        this.matter.world.pause();
        this.finalScore = this.score;
        this.best = this.bestScores.commit(this.finalScore, this.maxWheelie);
        this.audio.beep(880, 0.22, 'triangle', 0.12);
        Host.post('gameOver', { score: this.finalScore, timeSpentSeconds: 60, stats: { maxWheelie: this.maxWheelie.toFixed(1) } });
      }

      spawnImpact(x, y) {
        const colors = [0xfff5d1, 0xff9e3d, 0xff5d67, 0xffffff, 0x64d4ff];
        for (let i = 0; i < 28; i++) {
          const a = Math.random() * Math.PI * 2;
          const speed = 1.4 + Math.random() * 4.1;
          this.particles.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed - 1.5, life: 0.35 + Math.random() * 0.55, max: 0.9, size: 2 + Math.random() * 5, color: colors[i % colors.length] });
        }
      }

      addFloatingText(text, x, y, color = 0xffffff) {
        this.floatingTexts.push({ text, x, y, vy: -1.2, life: 1.0, max: 1.0, color });
      }

      applyRideForces(dt) {
        const M = this.M;
        const speed = this.chassis.velocity.x;

        // 1. RIGHT BUTTON HELD: ACCELERATE & POP WHEELIE
        if (this.rightHeld) {
          if (speed < SETTINGS.maxSpeed) {
            M.Body.applyForce(this.chassis, this.chassis.position, { x: SETTINGS.driveForce, y: 0 });
            this.rearWheel.torque -= SETTINGS.wheelTorque;
          }
          // Arcade wheelie lift torque (lifts front up)
          this.chassis.torque -= SETTINGS.wheelieLiftTorque;
          this.torso.torque -= SETTINGS.wheelieLiftTorque * 0.18;

          // Smoke particles from rear tyre
          if (Math.random() < 0.35) {
            const groundY = this.terrainHeight(this.rearWheel.position.x);
            this.particles.push({
              x: this.rearWheel.position.x - 18,
              y: groundY - 2,
              vx: -speed * 0.5 - Math.random() * 1.5,
              vy: -0.3 - Math.random() * 0.8,
              life: 0.25 + Math.random() * 0.25,
              max: 0.5,
              size: 3 + Math.random() * 4,
              color: 0x94a3b8
            });
          }
        }

        // 2. LEFT BUTTON HELD: BRAKE (NEVER GOES BACKWARD!)
        if (this.leftHeld) {
          if (speed > 0.08) {
            const bf = Math.min(speed * 0.010, SETTINGS.brakeDecel);
            M.Body.applyForce(this.chassis, this.chassis.position, { x: -bf, y: 0 });
            this.rearWheel.angularVelocity *= 0.82;
            this.frontWheel.angularVelocity *= 0.82;
          } else {

            M.Body.setVelocity(this.chassis, { x: 0, y: this.chassis.velocity.y });
            M.Body.setVelocity(this.rearWheel, { x: 0, y: this.rearWheel.velocity.y });
            M.Body.setVelocity(this.frontWheel, { x: 0, y: this.frontWheel.velocity.y });
            this.rearWheel.angularVelocity = 0;
            this.frontWheel.angularVelocity = 0;
          }

          this.chassis.torque += SETTINGS.brakeFrontDownTorque;

        if (!this.rightHeld && !this.leftHeld) {

          }

      }

      checkWheelie(dt) {
        if (this.state !== 'playing') return;
        const groundY = this.terrainHeight(this.rearWheel.position.x);
        const frontLift = (groundY - 22) - this.frontWheel.position.y;
        const rearGrounded = Math.abs(this.rearWheel.position.y - (groundY - 22)) < 16;
        const tilt = -this.chassis.angle; // positive = front up
        const speed = this.chassis.velocity.x;

        const isWheelie = rearGrounded && frontLift > 14 && tilt > 0.16 && speed > 0.5;

        if (isWheelie) {
          this.wheelieActive = true;
          this.wheelieTime += dt;
          this.maxWheelie = Math.max(this.maxWheelie, this.wheelieTime);
          this.wheelieCombo = this.wheelieTime > 4.5 ? 4 : this.wheelieTime > 2.8 ? 3 : this.wheelieTime > 1.2 ? 2 : 1;

          // Continuous points accumulation
          const pts = dt * 180 * this.wheelieCombo;
          this.wheeliePointsAccum += pts;
          if (this.wheeliePointsAccum >= 1) {
            const add = Math.floor(this.wheeliePointsAccum);
            this.score += add;
            this.wheeliePointsAccum -= add;
          }

          // Golden wheelie sparks under rear tyre
          if (Math.random() < 0.45) {
            this.particles.push({
              x: this.rearWheel.position.x - 12 + (Math.random() - 0.5) * 8,
              y: groundY - 2 + (Math.random() - 0.5) * 3,
              vx: -speed * 0.6 + (Math.random() - 0.5) * 2,
              vy: -0.8 - Math.random() * 2.2,
              life: 0.35 + Math.random() * 0.3,
              max: 0.65,
              size: 2 + Math.random() * 4,
              color: Math.random() > 0.4 ? 0xffd166 : 0xff70a6
            });
          }
        } else {
          if (this.wheelieActive) {
            // Landed smoothly
            if (this.wheelieTime >= 0.7) {
              const landingBonus = Math.round(this.wheelieTime * 50 * this.wheelieCombo);
              this.score += landingBonus;
              this.addFloatingText(`+${landingBonus} LANDING!`, this.sx(this.chassis.position.x), this.chassis.position.y - 45, 0x43d6a6);
              this.audio.beep(880, 0.08, 'triangle', 0.08);
            }
            this.wheelieActive = false;
            this.wheelieTime = 0;
            this.wheelieCombo = 1;
          }
        }

        // CRASH ON OVER-WHEELIE (> 72 degrees / 1.25 rad)
        if (tilt > SETTINGS.crashTilt) {
          this.triggerCrash('Flipped Over Backward!');
        }
      }

      applySuspension() {
        const M = this.M;
        const mounts = [
          { wheel: this.rearWheel, local: { x: -40, y: 10 } },
          { wheel: this.frontWheel, local: { x: 42, y: 10 } }
        ];
        for (const mount of mounts) {
          const offset = rotate(mount.local, this.chassis.angle);
          const anchor = { x: this.chassis.position.x + offset.x, y: this.chassis.position.y + offset.y };
          const down = rotate({ x: 0, y: 1 }, this.chassis.angle);
          const right = rotate({ x: 1, y: 0 }, this.chassis.angle);
          const delta = { x: mount.wheel.position.x - anchor.x, y: mount.wheel.position.y - anchor.y };
          const distance = delta.x * down.x + delta.y * down.y;
          const lateral = delta.x * right.x + delta.y * right.y;
          const relativeV = { x: mount.wheel.velocity.x - this.chassis.velocity.x, y: mount.wheel.velocity.y - this.chassis.velocity.y };
          const verticalV = relativeV.x * down.x + relativeV.y * down.y;
          const lateralV = relativeV.x * right.x + relativeV.y * right.y;
          const rest = 31;
          const verticalForce = (rest - distance) * 0.0016 - verticalV * 0.00145;
          const lateralForce = -lateral * 0.00075 - lateralV * 0.0008;
          const force = { x: down.x * verticalForce + right.x * lateralForce, y: down.y * verticalForce + right.y * lateralForce };
          M.Body.applyForce(mount.wheel, mount.wheel.position, force);
          M.Body.applyForce(this.chassis, anchor, { x: -force.x, y: -force.y });
        }
      }

      updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i]; p.life -= dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.12 * dt * 60;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i]; ft.life -= dt; ft.y += ft.vy * dt * 60;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }

      update(time, rawDelta) {
        const dt = Math.min(rawDelta, 50) / 1000;
        this.refreshHeldButtons();
        if (this.pausedByHost || window.__GAME_ACTIVE__ === false) { this.render(); return; }

        if (this.state === 'countdown') {
          this.applySuspension();
          this.countdown -= dt;
          if (this.countdown <= 0) this.beginPlaying();
        } else if (this.state === 'playing') {
          this.applySuspension();
          this.applyRideForces(dt);
          this.checkWheelie(dt);
          this.timeLeft = Math.max(0, this.timeLeft - dt);
          if (this.timeLeft <= 0) this.showGameOver();
        } else if (this.state === 'crashing') {
          this.crashTimer -= dt;
          if (this.crashTimer <= 0) {
            // AUTOMATIC INSTANT RESPAWN WITHOUT DIALOG!
            if (this.timeLeft > 0) {
              this.respawnBike();
              this.state = 'playing';
            } else {
              this.showGameOver();
            }
          }
        }

        if (this.respawnFlash > 0) this.respawnFlash = Math.max(0, this.respawnFlash - dt);
        this.cameraX = lerp(this.cameraX, this.chassis.position.x - 124, clamp(dt * 6.5, 0, 1));
        this.ensureTerrain(this.cameraX + W + 320);
        this.pruneTerrain();
        this.shake = Math.max(0, this.shake - dt * 22);
        this.updateParticles(dt);
        this.audio.setEngine(this.chassis.velocity.x, this.rightHeld);
        this.render();
      }

      sx(worldX) { return worldX - this.cameraX; }
      drawPath(points, fill, stroke, width = 1) {
        const g = this.g; if (!points.length) return;
        g.beginPath(); g.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) g.lineTo(points[i].x, points[i].y);
        g.closePath(); if (fill !== null) { g.fillStyle(fill, 1); g.fillPath(); }
        if (stroke !== null && width > 0) { g.lineStyle(width, stroke, 1); g.strokePath(); }
      }

      renderSky(g) {
        const bands = [0x2288b8, 0x2fa5d6, 0x4ebfe3, 0x7dd7ee, 0xb4ecf5];
        const bandH = 420 / bands.length;
        bands.forEach((color, i) => { g.fillStyle(color, 1); g.fillRect(0, i * bandH, W, bandH + 1); });
        g.fillStyle(0xfff3c3, 0.95); g.fillCircle(282, 100, 31);
        g.fillStyle(0xffffff, 0.22); g.fillCircle(274, 92, 18);
      }

      renderWorld(g) {
        const step = 5;
        const top = [];
        for (let x = -10; x <= W + 10; x += step) top.push({ x, y: this.terrainHeight() });
        g.beginPath(); g.moveTo(top[0].x, top[0].y);
        for (let i = 1; i < top.length; i++) g.lineTo(top[i].x, top[i].y);
        g.lineTo(W + 10, H); g.lineTo(-10, H); g.closePath(); g.fillStyle(0x161f26, 1); g.fillPath();

        // Asphalt surface curb lines
        g.lineStyle(3.5, 0xf1f5f9, 1); g.beginPath(); g.moveTo(top[0].x, top[0].y + 2);
        for (let i = 1; i < top.length; i++) g.lineTo(top[i].x, top[i].y + 2); g.strokePath();

        // Neon gold road dash markings
        const startWorld = Math.floor(this.cameraX / 72) * 72 - 72;
        for (let wx = startWorld; wx < this.cameraX + W + 80; wx += 72) {
          const x = this.sx(wx), y = this.terrainHeight() + 24;
          g.lineStyle(4.5, 0xffd166, 0.98); g.lineBetween(x, y, this.sx(wx + 44), y);
        }

        // Road barrier guardrail
        const railStart = Math.floor(this.cameraX / 52) * 52 - 52;
        for (let wx = railStart; wx < this.cameraX + W + 70; wx += 52) {
          const x = this.sx(wx), roadY = this.terrainHeight();
          g.lineStyle(3, 0x1e293b, 0.75); g.lineBetween(x, roadY - 32, x, roadY - 3);
          g.lineStyle(2.5, 0xe2e8f0, 0.92); g.lineBetween(x - 4, roadY - 31, this.sx(wx + 52) - 4, roadY - 31);
        }
        g.fillStyle(0x0f172a, 0.35); g.fillRect(0, 402, W, 28);
      }

      worldPoint(body) { return { x: this.sx(body.position.x), y: body.position.y }; }
      localPoint(body, local) { const p = rotate(local, body.angle); return { x: this.sx(body.position.x + p.x), y: body.position.y + p.y }; }

      drawWheel(body, accent) {
        const g = this.g, p = this.worldPoint(body), r = 22;
        g.fillStyle(0x071118, 0.28); g.fillEllipse(p.x + 4, p.y + r - 1, r * 2.0, 7);
        g.fillStyle(0x080d12, 1); g.fillCircle(p.x, p.y, r + 2);
        g.lineStyle(1.5, 0x53616b, 1); g.strokeCircle(p.x, p.y, r - 2);
        g.fillStyle(0x29343a, 1); g.fillCircle(p.x, p.y, r - 7);
        g.fillStyle(0x101820, 1); g.fillCircle(p.x, p.y, 6);
        g.fillStyle(accent, 0.95); g.fillCircle(p.x, p.y, 3);
        g.lineStyle(1.2, 0xbfd1d4, 0.78);
        for (let i = 0; i < 10; i++) {
          const a = body.angle + i * Math.PI * 0.2;
          g.lineBetween(p.x + Math.cos(a) * 5, p.y + Math.sin(a) * 5, p.x + Math.cos(a) * (r - 8), p.y + Math.sin(a) * (r - 8));
        }
      }

      drawRider() {
        const g = this.g;
        const head = this.worldPoint(this.head), rearKnee = this.worldPoint(this.rearKnee), frontKnee = this.worldPoint(this.frontKnee), rearHand = this.worldPoint(this.rearHand), frontHand = this.worldPoint(this.frontHand);
        const hip = this.localPoint(this.torso, { x: -2, y: 17 }), shoulder = this.localPoint(this.torso, { x: 6, y: -16 });
        const pegRear = this.localPoint(this.chassis, { x: -17, y: 12 }), pegFront = this.localPoint(this.chassis, { x: 26, y: 8 });
        g.lineStyle(10, 0x151b22, 1); g.lineBetween(hip.x, hip.y, rearKnee.x, rearKnee.y); g.lineBetween(rearKnee.x, rearKnee.y, pegRear.x, pegRear.y); g.lineBetween(hip.x + 5, hip.y, frontKnee.x, frontKnee.y); g.lineBetween(frontKnee.x, frontKnee.y, pegFront.x, pegFront.y);
        g.lineStyle(6.2, 0x445461, 1); g.lineBetween(hip.x, hip.y, rearKnee.x, rearKnee.y); g.lineBetween(rearKnee.x, rearKnee.y, pegRear.x, pegRear.y); g.lineBetween(hip.x + 5, hip.y, frontKnee.x, frontKnee.y); g.lineBetween(frontKnee.x, frontKnee.y, pegFront.x, pegFront.y);
        g.lineStyle(7.5, 0xf4a369, 1); g.lineBetween(shoulder.x, shoulder.y, rearHand.x, rearHand.y); g.lineBetween(shoulder.x + 2, shoulder.y + 3, frontHand.x, frontHand.y);
        g.lineStyle(4.5, 0x2a3a43, 1); g.lineBetween(shoulder.x, shoulder.y, rearHand.x, rearHand.y); g.lineBetween(shoulder.x + 2, shoulder.y + 3, frontHand.x, frontHand.y);
        const bodyPoly = [{x:-12,y:19},{x:-15,y:-13},{x:-6,y:-24},{x:12,y:-16},{x:14,y:13},{x:5,y:23}].map((p) => this.localPoint(this.torso, p));
        this.drawPath(bodyPoly, 0x1f323b, 0x07131c, 1.7);
        const jacket = [{x:-10,y:-12},{x:5,y:-20},{x:11,y:5},{x:-8,y:11}].map((p) => this.localPoint(this.torso, p));
        this.drawPath(jacket, 0x06d6a0, 0x07131c, 1);
        g.fillStyle(0x0c171e, 1); g.fillCircle(head.x, head.y, 16); g.fillStyle(0x118ab2, 1); g.fillCircle(head.x - 1, head.y - 1, 13.5);
        g.fillStyle(0x07131c, 1); g.fillRoundedRect(head.x - 1, head.y - 5, 15, 10, 4); g.lineStyle(1.5, 0xffd166, 1); g.lineBetween(head.x + 1, head.y + 8, head.x + 10, head.y + 11);
      }

      renderParticles(g) {
        for (const p of this.particles) {
          const a = clamp(p.life / p.max, 0, 1); g.fillStyle(p.color, a); g.fillCircle(this.sx(p.x), p.y, p.size * a);
        }
        for (const ft of this.floatingTexts) {
          const a = clamp(ft.life / ft.max, 0, 1);
          this.fillText(ft.text, ft.x, ft.y, 14, ft.color, '900', 'center', a);
        }
      }

      fillText(text, x, y, size, color, weight = '800', align = 'center', alpha = 1) {
        let t = this.textPool[this.textIndex++];
        if (!t) {
          t = this.add.text(0, 0, '', {
            fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            fontSize: size + 'px',
            fontStyle: weight,
            color: hex(color),
            align,
            resolution: DPR
          });
          this.textPool.push(t);
        }
        t.setText(text); t.setPosition(x, y); t.setFontSize(size + 'px'); t.setFontStyle(weight); t.setColor(hex(color)); t.setAlign(align); t.setAlpha(alpha); t.setVisible(true);
        t.setOrigin(align === 'center' ? 0.5 : align === 'right' ? 1 : 0, 0.5); t.setDepth(8); return t;
      }

      renderHud(g) {
        // 1. Timer in top center
        const timeSec = Math.max(0, Math.ceil(this.timeLeft));
        const timerPillColor = timeSec <= 10 ? 0xff5f79 : 0x0b2535;
        g.fillStyle(timerPillColor, 0.88); g.fillRoundedRect(140, 22, 80, 48, 16);
        g.lineStyle(2, timeSec <= 10 ? 0xff5f79 : 0x38bdf8, 0.9); g.strokeRoundedRect(140, 22, 80, 48, 16);
        this.fillText(String(timeSec), 180, 42, 24, 0xffffff, '900');
        this.fillText('SECONDS', 180, 60, 8, 0x94a3b8, '800');

        // 2. Score Pill on top right
        g.fillStyle(0x0b2535, 0.88); g.fillRoundedRect(240, 24, 106, 44, 14);
        g.lineStyle(1.5, 0xffd166, 0.85); g.strokeRoundedRect(240, 24, 106, 44, 14);
        this.fillText(String(this.score), 293, 41, 18, 0xffffff, '900');
        this.fillText('SCORE', 293, 58, 8, 0xffd166, '800');

        // 3. Dynamic Wheelie Banner in mid-upper screen when actively wheeling
        if (this.wheelieActive && this.wheelieTime > 0.2) {
          const comboColor = this.wheelieCombo >= 4 ? 0xff5f79 : this.wheelieCombo >= 3 ? 0xff9d48 : 0x06d6a0;
          g.fillStyle(0x071b29, 0.92); g.fillRoundedRect(45, 96, 270, 48, 16);
          g.lineStyle(2.5, comboColor, 1); g.strokeRoundedRect(45, 96, 270, 48, 16);
          this.fillText(`🔥 WHEELIE x${this.wheelieCombo}  (${this.wheelieTime.toFixed(1)}s)`, 180, 114, 16, 0xffffff, '900');
          this.fillText('POP & HOLD TO MULTIPLY POINTS!', 180, 132, 8, comboColor, '800');
        }
      }

      renderControls(g) {
        // Raised controls: y = 468, h = 88, leaving 84px of comfortable bottom spacing!
        const y = 468, h = 88, gap = 18, w = (W - gap * 3) / 2;
        const buttons = [
          { left: true, x: gap, held: this.leftHeld, label: 'BRAKE', sub: 'STOP · BALANCE', color: 0xef4444, icon: '◀ 🛑' },
          { left: false, x: gap * 2 + w, held: this.rightHeld, label: 'GAS / RACE', sub: 'HOLD TO WHEELIE', color: 0x06d6a0, icon: '⚡ ▶' }
        ];

        for (const button of buttons) {
          const bgAlpha = button.held ? 0.95 : 0.76;
          g.fillStyle(0x071a28, bgAlpha); g.fillRoundedRect(button.x, y, w, h, 20);
          g.lineStyle(button.held ? 3.5 : 2, button.color, button.held ? 1 : 0.75);
          g.strokeRoundedRect(button.x, y, w, h, 20);

          if (button.held) {
            g.fillStyle(button.color, 0.22); g.fillRoundedRect(button.x, y, w, h, 20);
          }

          const cx = button.x + w / 2;
          this.fillText(button.icon, cx, y + 26, 18, 0xffffff, '900');
          this.fillText(button.label, cx, y + 50, 14, button.held ? 0xffffff : button.color, '900');
          this.fillText(button.sub, cx, y + 70, 8, button.held ? 0xffffff : 0x94a3b8, '800');
        }
      }

      renderHome(g) {
        g.fillStyle(0x061724, 0.65); g.fillRect(0, 0, W, H);
        g.fillStyle(0x071f2d, 0.94); g.fillRoundedRect(18, 54, 324, 520, 26);
        g.lineStyle(2, 0x06d6a0, 0.7); g.strokeRoundedRect(18, 54, 324, 520, 26);

        // Title Header
        g.fillStyle(0x06d6a0, 0.2); g.fillCircle(180, 108, 44);
        this.fillText('MOTO WHEELIE', 180, 96, 28, 0xffffff, '900');
        this.fillText('SKYLINE RUN', 180, 126, 14, 0xffd166, '900');
        this.fillText('60 SECONDS · POP WHEELIES · SCORE BIG', 180, 154, 9, 0xa5f3fc, '800');

        // Instructions Card
        g.fillStyle(0x0d2b3e, 0.88); g.fillRoundedRect(34, 182, 292, 240, 18);
        g.lineStyle(1.5, 0x38bdf8, 0.5); g.strokeRoundedRect(34, 182, 292, 240, 18);

        this.fillText('HOW TO PLAY', 180, 206, 12, 0xffffff, '900');

        const tips = [
          { icon: '⚡', title: 'HOLD GAS (RIGHT)', desc: 'Accelerates forward & lifts front wheel' },
          { icon: '🛑', title: 'HOLD BRAKE (LEFT)', desc: 'Stops the bike & brings front wheel down' },
          { icon: '🔥', title: 'HOLD A WHEELIE', desc: 'Score rapid points & climb combo multipliers' },
          { icon: '⚠️', title: 'DON’T OVER-TILT', desc: 'Tilt > 72° causes a crash! You auto-respawn!' }
        ];

        tips.forEach((tip, i) => {
          const rowY = 242 + i * 44;
          this.fillText(tip.icon, 54, rowY, 14, 0xffffff, '900');
          this.fillText(tip.title, 76, rowY - 6, 10, 0xffd166, '900', 'left');
          this.fillText(tip.desc, 76, rowY + 9, 8, 0xd1d5db, '600', 'left');
        });

        // Start Button
        g.fillStyle(0x06d6a0, 1); g.fillRoundedRect(36, 448, 288, 64, 20);
        g.lineStyle(2, 0xffffff, 0.8); g.strokeRoundedRect(36, 448, 288, 64, 20);
        this.fillText('START RUN  ▶', 180, 474, 20, 0xffffff, '900');
        this.fillText('PRESS SPACE OR TAP TO PLAY', 180, 497, 9, 0x052e25, '800');
      }

      renderCountdown(g) {
        g.fillStyle(0x06121d, 0.35); g.fillRect(0, 0, W, H);
        const value = this.countdown > 1.3 ? '3' : this.countdown > 0.65 ? '2' : this.countdown > 0.1 ? '1' : 'GO!';
        g.fillStyle(0x071f2d, 0.88); g.fillCircle(180, 242, 68);
        g.lineStyle(3.5, 0x06d6a0, 1); g.strokeCircle(180, 242, 68);
        this.fillText(value, 180, 245, value === 'GO!' ? 36 : 64, 0xffffff, '900');
        this.fillText('GET READY TO WHEELIE!', 180, 326, 11, 0xffd166, '900');
      }

      renderGameOver(g) {
        g.fillStyle(0x03101a, 0.75); g.fillRect(0, 0, W, H);
        const best = this.best || this.bestScores.read();
        g.fillStyle(0x071d2a, 0.97); g.fillRoundedRect(25, 116, 310, 440, 26);
        g.lineStyle(2, 0x06d6a0, 0.9); g.strokeRoundedRect(25, 116, 310, 440, 26);

        this.fillText(this.finalScore >= best.allTime && this.finalScore > 0 ? '🏆 NEW BEST RUN!' : 'RUN COMPLETE', 180, 150, 12, 0xffd166, '900');
        this.fillText('TIME’S UP!', 180, 182, 28, 0xffffff, '900');

        g.fillStyle(0x06d6a0, 0.18); g.fillCircle(180, 252, 54);
        g.lineStyle(2.5, 0x06d6a0, 0.85); g.strokeCircle(180, 252, 54);
        this.fillText(String(this.finalScore), 180, 246, 38, 0xffffff, '900');
        this.fillText('FINAL SCORE', 180, 280, 9, 0xffd166, '900');

        const rows = [
          ['LONGEST WHEELIE', `${this.maxWheelie.toFixed(1)}s`],
          ['ALL-TIME BEST SCORE', String(best.allTime || 0)]
        ];
        rows.forEach((row, i) => {
          const ry = 330 + i * 44;
          g.fillStyle(0x0e2a38, 0.85); g.fillRoundedRect(44, ry - 16, 272, 34, 10);
          this.fillText(row[0], 60, ry, 9, 0x94a3b8, '800', 'left');
          this.fillText(row[1], 298, ry, 15, 0xffffff, '900', 'right');
        });

        // Single clean RIDE AGAIN button (No mode change or cross button!)
        g.fillStyle(0x06d6a0, 1); g.fillRoundedRect(44, 468, 272, 58, 18);
        g.lineStyle(2, 0xffffff, 0.8); g.strokeRoundedRect(44, 468, 272, 58, 18);
        this.fillText('RIDE AGAIN  ▶', 180, 496, 18, 0xffffff, '900');
      }

      render() {
        this.skyG.clear(); this.renderSky(this.skyG); this.updateEnvironment();
        this.g.clear(); this.textIndex = 0;
        const g = this.g;
        const shakeX = this.shake ? (Math.random() - 0.5) * this.shake : 0;
        if (shakeX) g.x = shakeX; else g.x = 0;
        this.renderWorld(g);

        const showBike = this.state === 'countdown' || this.state === 'playing' || this.state === 'crashing';
        if (showBike) {
          if (this.usingBikeSprites) this.syncBikeVisuals(true);
          this.drawRider();
        } else {
          if (this.usingBikeSprites) this.syncBikeVisuals(false);
        }

        this.renderParticles(g);

        if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') {
          this.renderHud(g);
          this.renderControls(g);
        }
        if (this.state === 'home') this.renderHome(g);
        if (this.state === 'countdown') this.renderCountdown(g);
        if (this.state === 'gameover') this.renderGameOver(g);

        if (this.pausedByHost && (this.state === 'playing' || this.state === 'countdown')) {
          g.fillStyle(0x03101a, 0.55); g.fillRect(0, 0, W, H);
          this.fillText('PAUSED', 180, 316, 24, 0xffffff, '900');
        }

        if (shakeX) g.x = 0;
        for (let i = this.textIndex; i < this.textPool.length; i++) this.textPool[i].setVisible(false);
      }
    }

    const nativeHost = Boolean(window.NativeBridge || window.FlutterGameBridge || window.flutter_inappwebview);
    if (nativeHost) document.documentElement.classList.add('native-host');

    window.__MOTO_BALANCE_GAME__ = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game-root',
      width: W,
      height: H,
      resolution: DPR,
      transparent: false,
      backgroundColor: '#2288b8',
      banner: false,
      render: {
        antialias: true,
        antialiasGL: true,
        roundPixels: true,
        powerPreference: 'high-performance'
      },
      physics: {
        default: 'matter',
        matter: {
          gravity: { y: 1.15 },
          enableSleeping: false,
          debug: false
        }
      },
      scene: [MotoBalanceScene]
    });
  })();
  </script>
</body>
</html>
