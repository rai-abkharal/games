<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Moto Balance: Wheelie Run</title>
  <style>
    :root { color-scheme: dark; --native-dock-safe: 0px; }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b131e; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { overscroll-behavior: none; }
    #game-root { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #0b131e; }
    canvas {
      display: block;
      width: min(100vw, 56.25vh) !important;
      height: min(177.7778vw, 100vh) !important;
      box-shadow: 0 25px 80px rgba(0, 0, 0, .85);
      border-radius: clamp(0px, 1.5vw, 20px);
    }
    .native-host canvas { width: 100% !important; height: 100% !important; box-shadow: none; border-radius: 0; }
  </style>
</head>
<body>
  <div id="game-root" aria-label="Moto Balance Wheelie Run"></div>
  <script src="assets/phaser-full.min.js"></script>
  <script>window.Phaser || document.write('<script src="../../shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="../shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="/shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"><\/script>')</script>
  <script>
  (() => {
    'use strict';

    if (typeof Phaser === 'undefined') {
      const root = document.getElementById('game-root');
      if (root) {
        root.innerHTML = '<div style="color:#eff6ff;padding:32px 20px;text-align:center;font-family:system-ui,-apple-system,sans-serif;max-width:320px;">' +
          '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">Game Engine Loading Error</div>' +
          '<div style="font-size:13px;color:#94a3b8;line-height:1.5;">Phaser 3 could not be loaded. Please ensure phaser-full.min.js is present.</div>' +
          '</div>';
      }
      return;
    }

    // High Definition 720x1280 Native Resolution with Device Pixel Ratio Scaling
    const W = 720;
    const H = 1280;
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    const GAME_ID = 'moto-balance';
    const VERSION = '2.4.0';

    // 280px High-Res Bike Size (scaled from 1254x1254 bike.png)
    const BIKE_DISPLAY_SIZE = 280;
    const SCALE = BIKE_DISPLAY_SIZE / 1254;
    const REAR_AXLE_OFFSET_X = -371.9 * SCALE; // -83.04px from center
    const REAR_AXLE_OFFSET_Y = 302.8 * SCALE;  // +67.61px from center
    const FRONT_AXLE_OFFSET_X = 443.1 * SCALE; // +98.94px from center
    const FRONT_AXLE_OFFSET_Y = 306.9 * SCALE; // +68.53px from center

    // Exact Hub Center for tyre.png (597x600, non-transparent bbox center 303.5, 319.0)
    const TYRE_ORIGIN_X = 303.5 / 597; // 0.508375
    const TYRE_ORIGIN_Y = 319.0 / 600; // 0.531667
    const TYRE_DISPLAY_SIZE = 98;
    const TYRE_RADIUS = 48;

    // Road positioning matching reference screenshot
    const ROAD_SURFACE_Y = 720;
    const REAR_AXLE_Y = ROAD_SURFACE_Y - TYRE_RADIUS; // 672px (resting on top of road)

    const Host = {
      post(action, payload = {}) {
        const message = JSON.stringify({ source: 'GameBridge', action, payload });
        try { if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) window.flutter_inappwebview.callHandler('GameBridgeChannel', message); } catch (_) {}
        try { if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) window.FlutterGameBridge.postMessage(message); } catch (_) {}
        try { if (window.parent && window.parent !== window) window.parent.postMessage({ source: 'GameBridge', action, payload }, '*'); } catch (_) {}
      },
      haptic(type = 'light') {
        this.post('haptic', { type });
        try {
          if (navigator.vibrate) navigator.vibrate(type === 'heavy' ? 36 : type === 'medium' ? 18 : 8);
        } catch (_) {}
      }
    };

    class AudioBed {
      constructor() {
        this.enabled = true;
        this.ctx = null;
        this.engineOsc = null;
        this.engineGain = null;
      }
      unlock() {
        if (!this.enabled || this.ctx) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new Ctx();
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.value = 38;
          this.engineGain.gain.value = 0;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 420;
          this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        } catch (_) { this.ctx = null; }
      }
      setEngine(speed, accelerating, wheelie = false) {
        if (!this.ctx || !this.engineOsc || !this.engineGain || !this.enabled) return;
        const now = this.ctx.currentTime;
        const targetFreq = 36 + Math.max(0, speed) * 8 + (accelerating ? 36 : 0) + (wheelie ? 26 : 0);
        const targetGain = accelerating ? (wheelie ? 0.085 : 0.065) : (speed > 0.3 ? 0.024 : 0.009);
        this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.04);
        this.engineGain.gain.setTargetAtTime(targetGain, now, 0.06);
      }
      beep(freq = 620, length = 0.06, type = 'sine', volume = 0.09) {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = type; osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + length);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + length + 0.01);
        } catch (_) {}
      }
      crash() {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, now); osc.frequency.exponentialRampToValueAtTime(26, now + 0.45);
          gain.gain.setValueAtTime(0.26, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.50);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.52);
        } catch (_) {}
      }
      setEnabled(value) {
        this.enabled = Boolean(value);
        if (!this.enabled && this.engineGain && this.ctx) this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime);
      }
    }

    function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
    function hex(color) { return '#' + color.toString(16).padStart(6, '0'); }

    class BestScores {
      constructor() { this.key = 'moto-wheelie-run-hd-v4'; }
      read() {
        let scores = { allTime: 0, maxWheelie: 0 };
        try { scores = Object.assign(scores, JSON.parse(localStorage.getItem(this.key) || '{}')); } catch (_) {}
        return scores;
      }
      commit(score, maxWheelie = 0) {
        const scores = this.read();
        scores.allTime = Math.max(scores.allTime || 0, score);
        scores.maxWheelie = Math.max(scores.maxWheelie || 0, maxWheelie);
        try { localStorage.setItem(this.key, JSON.stringify(scores)); } catch (_) {}
        return scores;
      }
    }

    class MotoBalanceScene extends Phaser.Scene {
      constructor() { super({ key: 'MotoBalanceScene' }); }

      preload() {
        this.load.image('moto-bike-body', 'assets/bike.png');
        this.load.image('moto-tyre', 'assets/tyre.png');
        this.load.image('moto-mountains', 'assets/mountains.png');
      }

      create() {
        this.audio = new AudioBed();
        this.bestScores = new BestScores();
        this.skyG = this.add.graphics();
        this.skyG.setDepth(0);

        // Natural snow-capped blue mountains cropped from spritesheet
        if (this.textures.exists('moto-mountains')) {
          this.textures.get('moto-mountains').setFilter(Phaser.Textures.FilterMode.LINEAR);
          const mountainH = 143 * 1.35;
          this.mountainTile = this.add.tileSprite(W / 2, ROAD_SURFACE_Y - (mountainH / 2) + 6, W + 20, mountainH, 'moto-mountains')
            .setOrigin(0.5, 0.5)
            .setDepth(1);
          this.mountainTile.tileScaleX = 1.35;
          this.mountainTile.tileScaleY = 1.35;
        }

        this.g = this.add.graphics();
        this.g.setDepth(2);
        this.textPool = [];
        this.textIndex = 0;

        // Auto-start immediately with countdown (No Start button!)
        this.state = 'countdown';
        this.countdown = 2.0;
        this.pausedByHost = false;
        this.pointerControls = new Map();
        this.keyLeft = false; this.keyRight = false;
        this.leftHeld = false; this.rightHeld = false;
        this.particles = [];
        this.floatingTexts = [];

        // Game parameters
        this.score = 0;
        this.finalScore = 0;
        this.timeLeft = 60;
        this.crashTimer = 0;

        // Kinematic Motion Variables
        this.worldX = 260;
        this.speed = 0;
        this.tyreAngle = 0;

        // Snappy Progressive Wheelie Physics
        this.wheelieAngle = 0;
        this.wheelieAngleVelocity = 0;
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.maxWheelie = 0;
        this.wheelieCombo = 1;
        this.wheeliePointsAccum = 0;

        // Crash tumble kinematics
        this.crashX = 0;
        this.crashY = 0;
        this.crashVx = 0;
        this.crashVy = 0;
        this.crashAngle = 0;
        this.crashSpin = 0;

        this.cameraX = 0;

        this.createBikeVisuals();
        this.installInput();
        this.resetWorld();
        this.installHostBridge();
        this.audio.beep(510, 0.08, 'triangle', 0.10);
        Host.post('ready', { gameId: GAME_ID, version: VERSION });
      }

      installHostBridge() {
        const clearInputs = () => this.clearInputs();
        window.GameBridge = {
          pause: () => { this.pausedByHost = true; clearInputs(); this.audio.setEngine(0, false); },
          resume: () => { this.pausedByHost = false; },
          restart: () => this.startRun(),
          setSoundEnabled: (enabled) => this.audio.setEnabled(enabled)
        };
        window.addEventListener('blur', () => { this.pausedByHost = true; clearInputs(); });
        window.addEventListener('focus', () => { if (!document.hidden) this.pausedByHost = false; });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { this.pausedByHost = true; clearInputs(); }
          else if (window.__GAME_ACTIVE__ !== false) { this.pausedByHost = false; }
        });
      }

      installInput() {
        const canvas = this.game.canvas;
        const point = (event) => {
          const rect = canvas.getBoundingClientRect();
          return {
            x: clamp((event.clientX - rect.left) * W / rect.width, 0, W),
            y: clamp((event.clientY - rect.top) * H / rect.height, 0, H)
          };
        };
        const down = (event) => {
          event.preventDefault(); this.audio.unlock();
          const p = point(event);
          try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
          this.handlePress(event.pointerId, p.x, p.y);
        };
        const up = (event) => { this.pointerControls.delete(event.pointerId); this.refreshHeldButtons(); };
        canvas.addEventListener('pointerdown', down, { passive: false });
        canvas.addEventListener('pointerup', up, { passive: false });
        canvas.addEventListener('pointercancel', up, { passive: false });
        canvas.addEventListener('pointerleave', (event) => { if (event.buttons === 0) up(event); }, { passive: false });
        window.addEventListener('pointerup', up, { passive: false });
        window.addEventListener('pointercancel', up, { passive: false });
        window.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') { this.keyLeft = true; event.preventDefault(); }
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd' || event.key.toLowerCase() === 'w') { this.keyRight = true; event.preventDefault(); }
          if (event.key === ' ' || event.key === 'Enter') {
            if (this.state === 'gameover') this.startRun();
            event.preventDefault();
          }
        });
        window.addEventListener('keyup', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') this.keyLeft = false;
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd' || event.key.toLowerCase() === 'w') this.keyRight = false;
        });
      }

      handlePress(pointerId, x, y) {
        if (this.state === 'playing') {
          // Bottom button card zone matching reference image
          if (y >= 880 && y <= 1180) {
            this.pointerControls.set(pointerId, x < W / 2 ? 'left' : 'right');
            this.refreshHeldButtons();
            Host.haptic('light');
            return;
          }
          return;
        }
        if (this.state === 'gameover') {
          // Play again button
          if (y >= 900 && y <= 1030 && x >= 90 && x <= 630) {
            this.startRun();
            return;
          }
        }
      }

      refreshHeldButtons() {
        this.leftHeld = this.keyLeft || Array.from(this.pointerControls.values()).includes('left');
        this.rightHeld = this.keyRight || Array.from(this.pointerControls.values()).includes('right');
      }

      clearInputs() { this.pointerControls.clear(); this.keyLeft = false; this.keyRight = false; this.leftHeld = false; this.rightHeld = false; }

      createBikeVisuals() {
        this.usingBikeSprites = this.textures.exists('moto-bike-body') && this.textures.exists('moto-tyre');
        if (!this.usingBikeSprites) return;
        if (this.textures.get('moto-bike-body')) this.textures.get('moto-bike-body').setFilter(Phaser.Textures.FilterMode.LINEAR);
        if (this.textures.get('moto-tyre')) this.textures.get('moto-tyre').setFilter(Phaser.Textures.FilterMode.LINEAR);

        // Tyres configured with DEAD-CENTER HUB ORIGIN (0% wobble!)
        const makeTyre = () => this.add.image(0, 0, 'moto-tyre')
          .setOrigin(TYRE_ORIGIN_X, TYRE_ORIGIN_Y)
          .setDisplaySize(TYRE_DISPLAY_SIZE, TYRE_DISPLAY_SIZE)
          .setDepth(3)
          .setVisible(false);

        this.rearTyreSprite = makeTyre();
        this.frontTyreSprite = makeTyre();

        // 280px High-Definition Bike + Rider illustrated sprite
        this.bikeBodySprite = this.add.image(0, 0, 'moto-bike-body')
          .setOrigin(0.5, 0.5)
          .setDisplaySize(BIKE_DISPLAY_SIZE, BIKE_DISPLAY_SIZE)
          .setDepth(4)
          .setVisible(false);
      }

      resetWorld() {
        this.clearInputs();
        this.worldX = 260;
        this.speed = 0;
        this.tyreAngle = 0;
        this.wheelieAngle = 0;
        this.wheelieAngleVelocity = 0;
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.wheeliePointsAccum = 0;
        this.cameraX = this.worldX - 220;
        this.score = 0;
        this.finalScore = 0;
        this.crashTimer = 0;
        this.particles = [];
        this.floatingTexts = [];
      }

      startRun() {
        this.audio.unlock();
        this.resetWorld();
        this.state = 'countdown';
        this.countdown = 2.0;
        this.timeLeft = 60;
        this.audio.beep(510, 0.08, 'triangle', 0.10);
        Host.haptic('medium');
      }

      beginPlaying() {
        this.state = 'playing';
        this.audio.beep(780, 0.12, 'triangle', 0.12);
        Host.post('gameStarted', { mode: 'Standard' });
        Host.haptic('medium');
      }

      triggerCrash() {
        if (this.state !== 'playing') return;
        this.clearInputs();
        this.audio.crash();
        this.audio.setEngine(0, false);
        Host.haptic('heavy');

        const { bikeX, bikeY } = this.computeBikePose();
        this.spawnImpact(bikeX, bikeY);
        this.state = 'crashing';
        this.crashTimer = 0.55;

        // Tumble physics
        this.crashX = bikeX;
        this.crashY = bikeY;
        this.crashVx = this.speed * 0.4;
        this.crashVy = -8.5;
        this.crashAngle = -this.wheelieAngle;
        this.crashSpin = -8.0;

        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.addFloatingText('CRASH! FLIPPED OVER!', this.sx(bikeX), bikeY - 80, 0xff5f79);
      }

      respawnBike() {
        this.speed = 0;
        this.wheelieAngle = 0;
        this.wheelieAngleVelocity = 0;
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.addFloatingText('⚡ QUICK RESPAWN! KEEP GOING!', W / 2, 480, 0x10b981);
        this.audio.beep(640, 0.08, 'sine', 0.09);
      }

      showGameOver() {
        if (this.state === 'gameover') return;
        this.state = 'gameover';
        this.finalScore = this.score;
        this.best = this.bestScores.commit(this.finalScore, this.maxWheelie);
        this.audio.beep(880, 0.22, 'triangle', 0.12);
        Host.post('gameOver', { score: this.finalScore, timeSpentSeconds: 60, stats: { maxWheelie: this.maxWheelie.toFixed(1) } });
      }

      spawnImpact(x, y) {
        const colors = [0xfff5d1, 0xff9e3d, 0xff5d67, 0xffffff, 0x38bdf8];
        for (let i = 0; i < 35; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 2.5 + Math.random() * 8.0;
          this.particles.push({
            x, y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - 3.0,
            life: 0.35 + Math.random() * 0.55,
            max: 0.9,
            size: 4 + Math.random() * 9,
            color: colors[i % colors.length]
          });
        }
      }

      addFloatingText(text, x, y, color = 0xffffff) {
        this.floatingTexts.push({ text, x, y, vy: -2.0, life: 1.0, max: 1.0, color });
      }

      computeBikePose() {
        const angle = -this.wheelieAngle;
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        // Rear axle is planted firmly on the road
        const rearAxleX = this.worldX;
        const rearAxleY = REAR_AXLE_Y;

        // Bike center from rear axle
        const rxRot = REAR_AXLE_OFFSET_X * cos - REAR_AXLE_OFFSET_Y * sin;
        const ryRot = REAR_AXLE_OFFSET_X * sin + REAR_AXLE_OFFSET_Y * cos;
        const bikeX = rearAxleX - rxRot;
        const bikeY = rearAxleY - ryRot;

        // Front axle from bike center
        const fxRot = FRONT_AXLE_OFFSET_X * cos - FRONT_AXLE_OFFSET_Y * sin;
        const fyRot = FRONT_AXLE_OFFSET_X * sin + FRONT_AXLE_OFFSET_Y * cos;
        const frontAxleX = bikeX + fxRot;
        const frontAxleY = bikeY + fyRot;

        return { bikeX, bikeY, rearAxleX, rearAxleY, frontAxleX, frontAxleY, angle };
      }

      updateKinematics(dt) {
        // 1. FORWARD ACCELERATION & BRAKING
        if (this.rightHeld) {
          this.speed = Math.min(17.5, this.speed + 12.5 * dt);
        } else if (this.leftHeld) {
          this.speed = Math.max(0, this.speed - 22.0 * dt);
        } else {
          this.speed = Math.max(0, this.speed - 3.4 * dt);
        }

        // Advance world X position smoothly
        this.worldX += this.speed * 60 * dt;
        this.tyreAngle += this.speed * 0.08;

        // 2. SPEEDY & SNAPPY WHEELIE LIFT FROM 0° DIRECTLY ON RACE
        if (this.rightHeld) {
          const liftPower = 8.5;
          this.wheelieAngleVelocity += liftPower * dt;
        } else if (this.leftHeld) {
          this.wheelieAngleVelocity -= 12.0 * dt;
        } else {
          this.wheelieAngleVelocity -= 5.5 * dt;
        }

        // Apply angular damping for butter-smooth motion
        this.wheelieAngleVelocity *= Math.pow(0.88, dt * 60);
        this.wheelieAngle += this.wheelieAngleVelocity * dt;

        // Clamp to ground (cannot penetrate road below 0°)
        if (this.wheelieAngle <= 0) {
          this.wheelieAngle = 0;
          this.wheelieAngleVelocity = 0;
        }

        // 3. WHEELIE SCORING (Direct to top Score card, NO intrusive floating card!)
        const isWheelie = this.wheelieAngle > 0.14 && this.speed > 0.8;
        if (isWheelie) {
          this.wheelieActive = true;
          this.wheelieTime += dt;
          this.maxWheelie = Math.max(this.maxWheelie, this.wheelieTime);
          this.wheelieCombo = this.wheelieTime > 4.5 ? 4 : this.wheelieTime > 2.8 ? 3 : this.wheelieTime > 1.2 ? 2 : 1;

          // Continuous points accumulation
          const pts = dt * 260 * this.wheelieCombo;
          this.wheeliePointsAccum += pts;
          if (this.wheeliePointsAccum >= 1) {
            const add = Math.floor(this.wheeliePointsAccum);
            this.score += add;
            this.wheeliePointsAccum -= add;
          }

          // Golden flame particles streaming from rear wheel
          if (Math.random() < 0.5) {
            this.particles.push({
              x: this.worldX + (Math.random() - 0.5) * 16,
              y: ROAD_SURFACE_Y - 4,
              vx: -this.speed * 0.6 + (Math.random() - 0.5) * 4,
              vy: -1.2 - Math.random() * 4.0,
              life: 0.35 + Math.random() * 0.35,
              max: 0.7,
              size: 5 + Math.random() * 8,
              color: Math.random() > 0.35 ? 0xfbbf24 : 0xf43f5e
            });
          }
        } else {
          if (this.wheelieActive) {
            if (this.wheelieTime >= 0.7) {
              const landingBonus = Math.round(this.wheelieTime * 80 * this.wheelieCombo);
              this.score += landingBonus;
              this.addFloatingText(`+${landingBonus} CLEAN LANDING!`, this.sx(this.worldX + 80), ROAD_SURFACE_Y - 90, 0x10b981);
              this.audio.beep(880, 0.08, 'triangle', 0.08);
            }
            this.wheelieActive = false;
            this.wheelieTime = 0;
            this.wheelieCombo = 1;
          }
        }

        // 4. OVER-WHEELIE CRASH (> 72° / 1.26 rad)
        if (this.wheelieAngle > 1.26) {
          this.triggerCrash();
        }
      }

      updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i]; p.life -= dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.20 * dt * 60;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i]; ft.life -= dt; ft.y += ft.vy * dt * 60;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }

      update(time, rawDelta) {
        const dt = Math.min(rawDelta, 50) / 1000;
        this.refreshHeldButtons();
        if (this.pausedByHost || window.__GAME_ACTIVE__ === false) { this.render(); return; }

        if (this.state === 'countdown') {
          this.countdown -= dt;
          if (this.countdown <= 0) this.beginPlaying();
        } else if (this.state === 'playing') {
          this.updateKinematics(dt);
          this.timeLeft = Math.max(0, this.timeLeft - dt);
          if (this.timeLeft <= 0) this.showGameOver();
        } else if (this.state === 'crashing') {
          this.crashTimer -= dt;
          this.crashVy += 28 * dt;
          this.crashX += this.crashVx * 60 * dt;
          this.crashY += this.crashVy * 60 * dt;
          this.crashAngle += this.crashSpin * dt;

          if (this.crashTimer <= 0) {
            if (this.timeLeft > 0) {
              this.respawnBike();
              this.state = 'playing';
            } else {
              this.showGameOver();
            }
          }
        }

        // Camera smoothly tracks bike
        this.cameraX = this.worldX - 220;

        // Smoothly parallax scroll natural mountain layer
        if (this.mountainTile) {
          this.mountainTile.tilePositionX = this.cameraX * 0.12;
        }

        this.updateParticles(dt);
        this.audio.setEngine(this.speed, this.rightHeld, this.wheelieActive);
        this.render();
      }

      sx(worldX) { return worldX - this.cameraX; }

      syncBikeVisuals(visible) {
        if (!this.usingBikeSprites) return;
        this.rearTyreSprite.setVisible(visible);
        this.frontTyreSprite.setVisible(visible);
        this.bikeBodySprite.setVisible(visible);
        if (!visible) return;

        if (this.state === 'crashing') {
          this.bikeBodySprite.setPosition(this.sx(this.crashX), this.crashY).setRotation(this.crashAngle);
          this.rearTyreSprite.setPosition(this.sx(this.crashX - 80), this.crashY + 40).setRotation(this.crashAngle + this.tyreAngle);
          this.frontTyreSprite.setPosition(this.sx(this.crashX + 80), this.crashY + 40).setRotation(this.crashAngle + this.tyreAngle);
          return;
        }

        const pose = this.computeBikePose();

        // 100% Dead-Center Alignment
        this.bikeBodySprite.setPosition(this.sx(pose.bikeX), pose.bikeY).setRotation(pose.angle);
        this.rearTyreSprite.setPosition(this.sx(pose.rearAxleX), pose.rearAxleY).setRotation(pose.angle + this.tyreAngle);
        this.frontTyreSprite.setPosition(this.sx(pose.frontAxleX), pose.frontAxleY).setRotation(pose.angle + this.tyreAngle);
      }

      renderSky(g) {
        // Pure solid clean daytime sky blue (NO bands, NO shades above mountains!)
        g.fillStyle(0x42b4ec, 1);
        g.fillRect(0, 0, W, ROAD_SURFACE_Y);

        // Pale Cream Sun in Top-Right
        g.fillStyle(0xfef08a, 0.95);
        g.fillCircle(580, 180, 62);
        g.fillStyle(0xfffbeb, 0.35);
        g.fillCircle(580, 180, 80);
      }

      renderWorld(g) {
        // 1. Guardrail Behind Bike (Matching Reference Screenshot!)
        g.fillStyle(0x7397af, 0.90);
        g.fillRect(0, 672, W, 4);

        // Vertical Guardrail Posts
        const railSpan = 110;
        const railStart = Math.floor(this.cameraX / railSpan) * railSpan - railSpan;
        for (let wx = railStart; wx < this.cameraX + W + 120; wx += railSpan) {
          const sx = this.sx(wx);
          g.fillStyle(0x1e293b, 0.92);
          g.fillRect(sx, 672, 6, 48);
        }

        // 2. Road Top White Line
        g.fillStyle(0xf8fafc, 1);
        g.fillRect(0, ROAD_SURFACE_Y, W, 6);

        // 3. Dark Asphalt Road Strip
        g.fillStyle(0x1a2430, 1);
        g.fillRect(0, ROAD_SURFACE_Y + 6, W, 104);

        // 4. Golden Yellow Center Dashes
        const dashSpan = 100;
        const dashStart = Math.floor(this.cameraX / dashSpan) * dashSpan - dashSpan;
        for (let wx = dashStart; wx < this.cameraX + W + 120; wx += dashSpan) {
          const sx = this.sx(wx);
          g.fillStyle(0xf59e0b, 1);
          g.fillRect(sx, ROAD_SURFACE_Y + 54, 55, 9);
        }

        // 5. Solid Deep Dark Dashboard Below Road
        g.fillStyle(0x0e1722, 1);
        g.fillRect(0, ROAD_SURFACE_Y + 110, W, H - (ROAD_SURFACE_Y + 110));
      }

      renderParticles(g) {
        for (const p of this.particles) {
          const a = clamp(p.life / p.max, 0, 1); g.fillStyle(p.color, a); g.fillCircle(this.sx(p.x), p.y, p.size * a);
        }
        for (const ft of this.floatingTexts) {
          const a = clamp(ft.life / ft.max, 0, 1);
          this.fillText(ft.text, ft.x, ft.y, 26, ft.color, '900', 'center', a);
        }
      }

      fillText(text, x, y, size, color, weight = '800', align = 'center', alpha = 1) {
        let t = this.textPool[this.textIndex++];
        if (!t) {
          t = this.add.text(0, 0, '', {
            fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            fontSize: size + 'px',
            fontStyle: weight,
            color: hex(color),
            align,
            resolution: DPR
          });
          this.textPool.push(t);
        }
        t.setText(text); t.setPosition(x, y); t.setFontSize(size + 'px'); t.setFontStyle(weight); t.setColor(hex(color)); t.setAlign(align); t.setAlpha(alpha); t.setVisible(true);
        t.setOrigin(align === 'center' ? 0.5 : align === 'right' ? 1 : 0, 0.5); t.setDepth(8); return t;
      }

      renderHud(g) {
        // Symmetrical, Identical-Sized Pill Cards for Timer and Score!
        const pillW = 240;
        const pillH = 76;
        const pillRadius = 24;
        const pillY = 40;

        // 1. LEFT PILL: SECONDS / TIMER (Width: 240, Height: 76, X: 75)
        const leftX = 75;
        const timeSec = Math.max(0, Math.ceil(this.timeLeft));
        const timerBg = timeSec <= 10 ? 0x2e0811 : 0x0c1e2d;
        const timerBorder = timeSec <= 10 ? 0xf43f5e : 0x06b6d4;

        g.fillStyle(timerBg, 0.95);
        g.fillRoundedRect(leftX, pillY, pillW, pillH, pillRadius);
        g.lineStyle(3.5, timerBorder, 1);
        g.strokeRoundedRect(leftX, pillY, pillW, pillH, pillRadius);

        const leftCenter = leftX + pillW / 2;
        this.fillText(String(timeSec), leftCenter, pillY + 28, 38, 0xffffff, '900');
        this.fillText('SECONDS', leftCenter, pillY + 58, 12, timerBorder, '900');

        // 2. RIGHT PILL: SCORE (Width: 240, Height: 76, X: 405) - EXACT EQUAL SIZE!
        const rightX = 405;
        g.fillStyle(0x1a1622, 0.95);
        g.fillRoundedRect(rightX, pillY, pillW, pillH, pillRadius);
        g.lineStyle(3.5, 0xe05638, 1);
        g.strokeRoundedRect(rightX, pillY, pillW, pillH, pillRadius);

        const rightCenter = rightX + pillW / 2;
        this.fillText(String(this.score), rightCenter, pillY + 28, 38, 0xffffff, '900');
        this.fillText('★ SCORE', rightCenter, pillY + 58, 12, 0xf59e0b, '900');
      }

      renderControls(g) {
        // Button cards matching reference screenshot
        const cardY = 930;
        const cardH = 200;
        const cardW = 275;
        const leftCardX = 55;
        const rightCardX = 390;

        // 1. LEFT BUTTON CARD (Cyan)
        g.fillStyle(0x0c1722, 0.95);
        g.fillRoundedRect(leftCardX, cardY, cardW, cardH, 36);
        g.lineStyle(this.leftHeld ? 5 : 3.5, 0x06b6d4, 1);
        g.strokeRoundedRect(leftCardX, cardY, cardW, cardH, 36);

        const leftCenterX = leftCardX + cardW / 2;
        const centerY = cardY + cardH / 2;
        g.fillStyle(this.leftHeld ? 0x0284c7 : 0x0891b2, 1);
        g.fillCircle(leftCenterX, centerY, 56);
        g.lineStyle(2.5, 0xffffff, 0.6);
        g.strokeCircle(leftCenterX, centerY, 56);
        this.fillText('◀', leftCenterX - 2, centerY + 2, 48, 0xffffff, '900');

        // 2. RIGHT BUTTON CARD (Coral/Orange)
        g.fillStyle(0x16141c, 0.95);
        g.fillRoundedRect(rightCardX, cardY, cardW, cardH, 36);
        g.lineStyle(this.rightHeld ? 5 : 3.5, 0xe05638, 1);
        g.strokeRoundedRect(rightCardX, cardY, cardW, cardH, 36);

        const rightCenterX = rightCardX + cardW / 2;
        g.fillStyle(this.rightHeld ? 0xe05638 : 0xc24128, 1);
        g.fillCircle(rightCenterX, centerY, 56);
        g.lineStyle(2.5, 0xffffff, 0.6);
        g.strokeCircle(rightCenterX, centerY, 56);
        this.fillText('▶', rightCenterX + 2, centerY + 2, 48, 0xffffff, '900');
      }

      renderCountdown(g) {
        g.fillStyle(0x06111d, 0.35); g.fillRect(0, 0, W, H);
        const value = this.countdown > 1.3 ? '3' : this.countdown > 0.65 ? '2' : this.countdown > 0.1 ? '1' : 'GO!';
        g.fillStyle(0x0a1e32, 0.94); g.fillCircle(360, 480, 130);
        g.lineStyle(6, 0x0284c7, 1); g.strokeCircle(360, 480, 130);
        this.fillText(value, 360, 485, value === 'GO!' ? 70 : 120, 0xffffff, '900');
        this.fillText('GET READY TO WHEELIE!', 360, 650, 22, 0xfbbf24, '900');
      }

      renderGameOver(g) {
        // High-DPI Ultra-Crisp Light-Theme Modal Card
        g.fillStyle(0x050d18, 0.65); g.fillRect(0, 0, W, H);

        const best = this.best || this.bestScores.read();
        const isNewBest = this.finalScore >= best.allTime && this.finalScore > 0;

        // Main Dialog Card (High-Resolution White Card)
        g.fillStyle(0xffffff, 0.99);
        g.fillRoundedRect(60, 180, 600, 890, 40);
        g.lineStyle(3, 0xe2e8f0, 1);
        g.strokeRoundedRect(60, 180, 600, 890, 40);

        // Header Accent Banner
        g.fillStyle(isNewBest ? 0xfef3c7 : 0xf0fdf4, 1);
        g.fillRoundedRect(60, 180, 600, 140, { tl: 40, tr: 40, bl: 0, br: 0 });

        // Trophy Circle Badge
        g.fillStyle(isNewBest ? 0xf59e0b : 0x10b981, 0.20);
        g.fillCircle(360, 250, 50);
        this.fillText(isNewBest ? '🏆' : '🏁', 360, 250, 48, 0xffffff, '900');

        // Titles in Slate Navy
        this.fillText(isNewBest ? 'NEW HIGH SCORE!' : 'RUN COMPLETE!', 360, 348, 28, isNewBest ? 0xd97706 : 0x059669, '900');
        this.fillText('TIME’S UP', 360, 396, 46, 0x0f172a, '900');

        // Score Highlight Box
        g.fillStyle(0xf0fdf4, 1);
        g.fillRoundedRect(100, 440, 520, 138, 24);
        g.lineStyle(2, 0x86efac, 1);
        g.strokeRoundedRect(100, 440, 520, 138, 24);

        this.fillText('★ FINAL SCORE ★', 360, 472, 16, 0x059669, '800');
        this.fillText(String(this.finalScore), 360, 528, 66, 0x0f172a, '900');

        // Stats in Sleek Frosted Light-Gray Pills
        const rows = [
          { label: '⏱️ LONGEST WHEELIE', value: `${this.maxWheelie.toFixed(1)}s` },
          { label: '🏆 ALL-TIME BEST', value: String(best.allTime || 0) },
          { label: '🔥 MAX COMBO', value: `x${this.wheelieCombo} MULTIPLIER` }
        ];

        rows.forEach((row, i) => {
          const ry = 610 + i * 84;
          g.fillStyle(0xf8fafc, 1);
          g.fillRoundedRect(100, ry, 520, 70, 18);
          g.lineStyle(1.5, 0xe2e8f0, 1);
          g.strokeRoundedRect(100, ry, 520, 70, 18);

          this.fillText(row.label, 130, ry + 35, 18, 0x475569, '700', 'left');
          this.fillText(row.value, 590, ry + 35, 24, 0x0f172a, '900', 'right');
        });

        // Vibrant Emerald "PLAY AGAIN" Button
        g.fillStyle(0x10b981, 1);
        g.fillRoundedRect(100, 890, 520, 110, 30);
        g.lineStyle(2.5, 0x059669, 1);
        g.strokeRoundedRect(100, 890, 520, 110, 30);

        this.fillText('PLAY AGAIN  ▶', 360, 935, 34, 0xffffff, '900');
        this.fillText('TAP OR PRESS SPACE', 360, 972, 16, 0xd1fae5, '700');
      }

      render() {
        this.skyG.clear(); this.renderSky(this.skyG);
        this.g.clear(); this.textIndex = 0;
        const g = this.g;

        this.renderWorld(g);

        const showBike = this.state === 'countdown' || this.state === 'playing' || this.state === 'crashing';
        this.syncBikeVisuals(showBike);

        this.renderParticles(g);

        if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') {
          this.renderHud(g);
          this.renderControls(g);
        }
        if (this.state === 'countdown') this.renderCountdown(g);
        if (this.state === 'gameover') this.renderGameOver(g);

        if (this.pausedByHost && (this.state === 'playing' || this.state === 'countdown')) {
          g.fillStyle(0x03101a, 0.55); g.fillRect(0, 0, W, H);
          this.fillText('PAUSED', W / 2, 600, 48, 0xffffff, '900');
        }

        for (let i = this.textIndex; i < this.textPool.length; i++) this.textPool[i].setVisible(false);
      }
    }

    const nativeHost = Boolean(window.NativeBridge || window.FlutterGameBridge || window.flutter_inappwebview);
    if (nativeHost) document.documentElement.classList.add('native-host');

    window.__MOTO_BALANCE_GAME__ = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game-root',
      resolution: DPR,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: W,
        height: H
      },
      transparent: false,
      backgroundColor: '#0b131e',
      banner: false,
      render: {
        antialias: true,
        antialiasGL: true,
        roundPixels: true,
        powerPreference: 'high-performance'
      },
      scene: [MotoBalanceScene]
    });
  })();
  </script>
</body>
</html>
