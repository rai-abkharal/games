<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Moto Balance: Wheelie Run</title>
  <style>
    :root { color-scheme: dark; --native-dock-safe: 0px; }
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #071827; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { overscroll-behavior: none; }
    #game-root { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: radial-gradient(circle at 50% 22%, #14445f 0%, #0a2339 58%, #050d18 100%); }
    canvas {
      display: block;
      width: min(100vw, 56.25vh) !important;
      height: min(177.7778vw, 100vh) !important;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .75), 0 0 0 1px rgba(226, 248, 255, .16);
      border-radius: clamp(0px, 1.5vw, 18px);
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
    }
    .native-host canvas { width: 100% !important; height: 100% !important; box-shadow: none; border-radius: 0; }
  </style>
</head>
<body>
  <div id="game-root" aria-label="Moto Balance Wheelie Run"></div>
  <script src="assets/phaser-full.min.js"></script>
  <script>window.Phaser || document.write('<script src="../../shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="../shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="/shared/phaser-full.min.js"><\/script>')</script>
  <script>window.Phaser || document.write('<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"><\/script>')</script>
  <script>
  (() => {
    'use strict';

    if (typeof Phaser === 'undefined') {
      const root = document.getElementById('game-root');
      if (root) {
        root.innerHTML = '<div style="color:#eff6ff;padding:32px 20px;text-align:center;font-family:system-ui,-apple-system,sans-serif;max-width:320px;">' +
          '<div style="font-size:36px;margin-bottom:12px;">⚠️</div>' +
          '<div style="font-size:18px;font-weight:700;margin-bottom:8px;">Game Engine Loading Error</div>' +
          '<div style="font-size:13px;color:#94a3b8;line-height:1.5;">Phaser 3 could not be loaded. Please ensure you have an active network connection or that phaser-full.min.js is present.</div>' +
          '</div>';
      }
      return;
    }

    const W = 360;
    const H = 640;
    const GAME_ID = 'moto-balance';
    const VERSION = '1.3.0';
    const DPR = Math.min(window.devicePixelRatio || 1, 2.5);

    // Exact geometric offsets from bike.png (1254x1254) scaled to 144px
    const BIKE_DISPLAY_SIZE = 144;
    const SCALE = BIKE_DISPLAY_SIZE / 1254;
    const REAR_AXLE_OFFSET_X = -371.9 * SCALE; // -42.71px from bike image center
    const REAR_AXLE_OFFSET_Y = 302.8 * SCALE;  // +34.77px from bike image center
    const FRONT_AXLE_OFFSET_X = 443.1 * SCALE; // +50.88px from bike image center
    const FRONT_AXLE_OFFSET_Y = 306.9 * SCALE; // +35.24px from bike image center

    // Exact hub rotation center of tyre.png (597x600, non-transparent bbox center 303.5, 319.0)
    const TYRE_ORIGIN_X = 303.5 / 597; // 0.508375
    const TYRE_ORIGIN_Y = 319.0 / 600; // 0.531667
    const TYRE_DISPLAY_SIZE = 50;
    const TYRE_RADIUS = 24.5;
    const ROAD_SURFACE_Y = 365;
    const REAR_AXLE_Y = ROAD_SURFACE_Y - TYRE_RADIUS; // 340.5px (resting on road)

    const Host = {
      post(action, payload = {}) {
        const message = JSON.stringify({ source: 'GameBridge', action, payload });
        try { if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) window.flutter_inappwebview.callHandler('GameBridgeChannel', message); } catch (_) {}
        try { if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) window.FlutterGameBridge.postMessage(message); } catch (_) {}
        try { if (window.parent && window.parent !== window) window.parent.postMessage({ source: 'GameBridge', action, payload }, '*'); } catch (_) {}
      },
      haptic(type = 'light') {
        this.post('haptic', { type });
        try {
          if (navigator.vibrate) navigator.vibrate(type === 'heavy' ? 36 : type === 'medium' ? 18 : 8);
        } catch (_) {}
      }
    };

    class AudioBed {
      constructor() {
        this.enabled = true;
        this.ctx = null;
        this.engineOsc = null;
        this.engineGain = null;
      }
      unlock() {
        if (!this.enabled || this.ctx) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new Ctx();
          this.engineOsc = this.ctx.createOscillator();
          this.engineGain = this.ctx.createGain();
          this.engineOsc.type = 'sawtooth';
          this.engineOsc.frequency.value = 35;
          this.engineGain.gain.value = 0;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 380;
          this.engineOsc.connect(filter); filter.connect(this.engineGain); this.engineGain.connect(this.ctx.destination);
          this.engineOsc.start();
        } catch (_) { this.ctx = null; }
      }
      setEngine(speed, accelerating, wheelie = false) {
        if (!this.ctx || !this.engineOsc || !this.engineGain || !this.enabled) return;
        const now = this.ctx.currentTime;
        const targetFreq = 34 + Math.max(0, speed) * 16 + (accelerating ? 32 : 0) + (wheelie ? 22 : 0);
        const targetGain = accelerating ? (wheelie ? 0.085 : 0.065) : (speed > 0.3 ? 0.022 : 0.008);
        this.engineOsc.frequency.setTargetAtTime(targetFreq, now, 0.04);
        this.engineGain.gain.setTargetAtTime(targetGain, now, 0.06);
      }
      beep(freq = 620, length = 0.06, type = 'sine', volume = 0.09) {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const now = this.ctx.currentTime;
          osc.type = type; osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(volume, now); gain.gain.exponentialRampToValueAtTime(0.001, now + length);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + length + 0.01);
        } catch (_) {}
      }
      crash() {
        this.unlock();
        if (!this.ctx || !this.enabled) return;
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator(); const gain = this.ctx.createGain();
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(28, now + 0.45);
          gain.gain.setValueAtTime(0.24, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.50);
          osc.connect(gain); gain.connect(this.ctx.destination); osc.start(now); osc.stop(now + 0.52);
        } catch (_) {}
      }
      setEnabled(value) {
        this.enabled = Boolean(value);
        if (!this.enabled && this.engineGain && this.ctx) this.engineGain.gain.setValueAtTime(0, this.ctx.currentTime);
      }
    }

    function clamp(value, low, high) { return Math.max(low, Math.min(high, value)); }
    function modulo(value, divisor) { return ((value % divisor) + divisor) % divisor; }
    function hex(color) { return '#' + color.toString(16).padStart(6, '0'); }

    class BestScores {
      constructor() { this.key = 'moto-wheelie-run-v3'; }
      read() {
        let scores = { allTime: 0, maxWheelie: 0 };
        try { scores = Object.assign(scores, JSON.parse(localStorage.getItem(this.key) || '{}')); } catch (_) {}
        return scores;
      }
      commit(score, maxWheelie = 0) {
        const scores = this.read();
        scores.allTime = Math.max(scores.allTime || 0, score);
        scores.maxWheelie = Math.max(scores.maxWheelie || 0, maxWheelie);
        try { localStorage.setItem(this.key, JSON.stringify(scores)); } catch (_) {}
        return scores;
      }
    }

    class MotoBalanceScene extends Phaser.Scene {
      constructor() { super({ key: 'MotoBalanceScene' }); }

      preload() {
        this.load.image('moto-bike-body', 'assets/bike.png');
        this.load.image('moto-tyre', 'assets/tyre.png');
        this.load.image('moto-environment-sheet', 'assets/environment-spritesheet.png');
      }

      create() {
        this.audio = new AudioBed();
        this.bestScores = new BestScores();
        this.skyG = this.add.graphics();
        this.skyG.setDepth(0);
        this.g = this.add.graphics();
        this.g.setDepth(2);
        this.textPool = [];
        this.textIndex = 0;
        this.state = 'home';
        this.pausedByHost = false;
        this.pointerControls = new Map();
        this.keyLeft = false; this.keyRight = false;
        this.leftHeld = false; this.rightHeld = false;
        this.particles = [];
        this.floatingTexts = [];

        // Game loop parameters
        this.score = 0;
        this.finalScore = 0;
        this.timeLeft = 60;
        this.countdown = 0;
        this.crashTimer = 0;

        // Kinematic Motion Variables (100% Smooth, Zero Jitter)
        this.worldX = 130; // Rear wheel world X position
        this.speed = 0;    // Forward speed (pixels per frame at 60fps)
        this.tyreAngle = 0;

        // Wheelie Physics (smooth angular lift starting at 0)
        this.wheelieAngle = 0;         // In radians (0 = flat on road, >0 = front wheel up)
        this.wheelieAngleVelocity = 0; // Angular velocity
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.maxWheelie = 0;
        this.wheelieCombo = 1;
        this.wheeliePointsAccum = 0;

        // Crash tumble kinematics
        this.crashX = 0;
        this.crashY = 0;
        this.crashVx = 0;
        this.crashVy = 0;
        this.crashAngle = 0;
        this.crashSpin = 0;

        this.cameraX = 0;

        this.createBikeVisuals();
        this.createEnvironment();
        this.installInput();
        this.resetWorld();
        this.installHostBridge();
        Host.post('ready', { gameId: GAME_ID, version: VERSION });
      }

      installHostBridge() {
        const clearInputs = () => this.clearInputs();
        window.GameBridge = {
          pause: () => { this.pausedByHost = true; clearInputs(); this.audio.setEngine(0, false); },
          resume: () => { this.pausedByHost = false; },
          restart: () => this.startRun(),
          setSoundEnabled: (enabled) => this.audio.setEnabled(enabled)
        };
        window.addEventListener('blur', () => { this.pausedByHost = true; clearInputs(); });
        window.addEventListener('focus', () => { if (!document.hidden) this.pausedByHost = false; });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) { this.pausedByHost = true; clearInputs(); }
          else if (window.__GAME_ACTIVE__ !== false) { this.pausedByHost = false; }
        });
      }

      installInput() {
        const canvas = this.game.canvas;
        const point = (event) => {
          const rect = canvas.getBoundingClientRect();
          return { x: clamp((event.clientX - rect.left) * W / rect.width, 0, W), y: clamp((event.clientY - rect.top) * H / rect.height, 0, H) };
        };
        const down = (event) => {
          event.preventDefault(); this.audio.unlock();
          const p = point(event);
          try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
          this.handlePress(event.pointerId, p.x, p.y);
        };
        const up = (event) => { this.pointerControls.delete(event.pointerId); this.refreshHeldButtons(); };
        canvas.addEventListener('pointerdown', down, { passive: false });
        canvas.addEventListener('pointerup', up, { passive: false });
        canvas.addEventListener('pointercancel', up, { passive: false });
        canvas.addEventListener('pointerleave', (event) => { if (event.buttons === 0) up(event); }, { passive: false });
        window.addEventListener('pointerup', up, { passive: false });
        window.addEventListener('pointercancel', up, { passive: false });
        window.addEventListener('keydown', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') { this.keyLeft = true; event.preventDefault(); }
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd' || event.key.toLowerCase() === 'w') { this.keyRight = true; event.preventDefault(); }
          if (event.key === ' ' || event.key === 'Enter') {
            if (this.state === 'home') this.startRun();
            else if (this.state === 'gameover') this.startRun();
            event.preventDefault();
          }
        });
        window.addEventListener('keyup', (event) => {
          if (event.key === 'ArrowLeft' || event.key.toLowerCase() === 'a') this.keyLeft = false;
          if (event.key === 'ArrowRight' || event.key.toLowerCase() === 'd' || event.key.toLowerCase() === 'w') this.keyRight = false;
        });
      }

      handlePress(pointerId, x, y) {
        if (this.state === 'playing') {
          // Controls zone: y between 440 and 590 (Comfortably raised with 80px+ bottom spacing)
          if (y >= 440 && y <= 590) {
            this.pointerControls.set(pointerId, x < W / 2 ? 'left' : 'right');
            this.refreshHeldButtons();
            Host.haptic('light');
            return;
          }
          return;
        }
        if (this.state === 'home') {
          if (y >= 440 && y <= 530) {
            this.startRun();
            return;
          }
        }
        if (this.state === 'gameover') {
          if (y >= 460 && y <= 540) {
            this.startRun();
            return;
          }
        }
      }

      refreshHeldButtons() {
        this.leftHeld = this.keyLeft || Array.from(this.pointerControls.values()).includes('left');
        this.rightHeld = this.keyRight || Array.from(this.pointerControls.values()).includes('right');
      }

      clearInputs() { this.pointerControls.clear(); this.keyLeft = false; this.keyRight = false; this.leftHeld = false; this.rightHeld = false; }

      createBikeVisuals() {
        this.usingBikeSprites = this.textures.exists('moto-bike-body') && this.textures.exists('moto-tyre');
        if (!this.usingBikeSprites) return;
        if (this.textures.get('moto-bike-body')) this.textures.get('moto-bike-body').setFilter(Phaser.Textures.FilterMode.LINEAR);
        if (this.textures.get('moto-tyre')) this.textures.get('moto-tyre').setFilter(Phaser.Textures.FilterMode.LINEAR);

        // Tyres configured with DEAD-CENTER HUB ORIGIN (eliminates all wobble/orbiting!)
        const makeTyre = () => this.add.image(0, 0, 'moto-tyre')
          .setOrigin(TYRE_ORIGIN_X, TYRE_ORIGIN_Y)
          .setDisplaySize(TYRE_DISPLAY_SIZE, TYRE_DISPLAY_SIZE)
          .setDepth(3)
          .setVisible(false);

        this.rearTyreSprite = makeTyre();
        this.frontTyreSprite = makeTyre();

        // Bike Body with Rider professionally illustrated in bike.png (NO fallback stickman!)
        this.bikeBodySprite = this.add.image(0, 0, 'moto-bike-body')
          .setOrigin(0.5, 0.5)
          .setDisplaySize(BIKE_DISPLAY_SIZE, BIKE_DISPLAY_SIZE)
          .setDepth(4)
          .setVisible(false);
      }

      createEnvironment() {
        const sourceTexture = this.textures.get('moto-environment-sheet');
        const source = sourceTexture && sourceTexture.getSourceImage();
        this.environmentLayers = [];
        this.environmentClouds = [];
        if (!source) return;

        const layers = [
          { key: 'env-far-range', x: 16, y: 8, w: 950, h: 143, screenY: 239, scale: 0.73, speed: 0.055, alpha: 0.77 },
          { key: 'env-mid-range', x: 16, y: 164, w: 950, h: 116, screenY: 284, scale: 0.84, speed: 0.105, alpha: 0.88 },
          { key: 'env-deep-range', x: 16, y: 283, w: 950, h: 120, screenY: 319, scale: 0.80, speed: 0.165, alpha: 0.95 },
          { key: 'env-green-range', x: 16, y: 410, w: 950, h: 111, screenY: 337, scale: 0.68, speed: 0.220, alpha: 1 },
          { key: 'env-forest-range', x: 16, y: 535, w: 950, h: 98, screenY: 353, scale: 0.57, speed: 0.285, alpha: 1 }
        ];
        const crop = (layer) => {
          const texture = this.textures.createCanvas(layer.key, layer.w, layer.h);
          texture.context.clearRect(0, 0, layer.w, layer.h);
          texture.context.drawImage(source, layer.x, layer.y, layer.w, layer.h, 0, 0, layer.w, layer.h);
          texture.refresh();
          const tile = this.add.tileSprite(W / 2, layer.screenY, W + 6, layer.h * layer.scale, layer.key)
            .setOrigin(0.5).setDepth(1).setAlpha(layer.alpha);
          tile.tileScaleX = layer.scale;
          tile.tileScaleY = layer.scale;
          return { tile, speed: layer.speed };
        };
        this.environmentLayers = layers.map(crop);

        const makeCloud = (key, x, y, w, h, width, height, start, speed, screenY, alpha = 1) => {
          const texture = this.textures.createCanvas(key, w, h);
          texture.context.clearRect(0, 0, w, h);
          texture.context.drawImage(source, x, y, w, h, 0, 0, w, h);
          texture.refresh();
          const image = this.add.image(0, screenY, key).setOrigin(0.5).setDisplaySize(width, height).setDepth(1).setAlpha(alpha);
          return { image, start, speed, width };
        };
        this.environmentClouds = [
          makeCloud('env-cloud-large', 976, 452, 250, 144, 124, 71, 74, 0.028, 126, 0.84),
          makeCloud('env-cloud-small', 1200, 472, 240, 103, 96, 41, 312, 0.041, 187, 0.72),
          makeCloud('env-cloud-low', 979, 595, 245, 94, 112, 43, 208, 0.034, 222, 0.64)
        ];
        this.updateEnvironment();
      }

      updateEnvironment() {
        if (!this.environmentLayers) return;
        for (const layer of this.environmentLayers) layer.tile.tilePositionX = this.cameraX * layer.speed;
        for (const cloud of this.environmentClouds) {
          cloud.image.x = modulo(cloud.start - this.cameraX * cloud.speed, W + cloud.width * 2) - cloud.width;
        }
      }

      resetWorld() {
        this.clearInputs();
        this.worldX = 130;
        this.speed = 0;
        this.tyreAngle = 0;
        this.wheelieAngle = 0;
        this.wheelieAngleVelocity = 0;
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.wheeliePointsAccum = 0;
        this.cameraX = this.worldX - 100;
        this.score = 0;
        this.finalScore = 0;
        this.crashTimer = 0;
        this.particles = [];
        this.floatingTexts = [];
      }

      startRun() {
        this.audio.unlock();
        this.resetWorld();
        this.state = 'countdown';
        this.countdown = 2.0;
        this.timeLeft = 60;
        this.audio.beep(510, 0.08, 'triangle', 0.10);
        Host.haptic('medium');
      }

      beginPlaying() {
        this.state = 'playing';
        this.audio.beep(780, 0.12, 'triangle', 0.12);
        Host.post('gameStarted', { mode: 'Standard' });
        Host.haptic('medium');
      }

      triggerCrash() {
        if (this.state !== 'playing') return;
        this.clearInputs();
        this.audio.crash();
        this.audio.setEngine(0, false);
        Host.haptic('heavy');

        const { bikeX, bikeY } = this.computeBikePose();
        this.spawnImpact(bikeX, bikeY);
        this.state = 'crashing';
        this.crashTimer = 0.55; // Quick 0.55s tumble, then instant respawn!

        // Initialize tumble physics
        this.crashX = bikeX;
        this.crashY = bikeY;
        this.crashVx = this.speed * 0.4;
        this.crashVy = -4.5;
        this.crashAngle = -this.wheelieAngle;
        this.crashSpin = -8.0;

        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.addFloatingText('CRASH! FLIPPED OVER!', this.sx(bikeX), bikeY - 45, 0xff5f79);
      }

      respawnBike() {
        this.speed = 0;
        this.wheelieAngle = 0;
        this.wheelieAngleVelocity = 0;
        this.wheelieActive = false;
        this.wheelieTime = 0;
        this.wheelieCombo = 1;
        this.addFloatingText('⚡ QUICK RESPAWN! KEEP GOING!', 180, 250, 0x06d6a0);
        this.audio.beep(640, 0.08, 'sine', 0.09);
      }

      showGameOver() {
        if (this.state === 'gameover') return;
        this.state = 'gameover';
        this.finalScore = this.score;
        this.best = this.bestScores.commit(this.finalScore, this.maxWheelie);
        this.audio.beep(880, 0.22, 'triangle', 0.12);
        Host.post('gameOver', { score: this.finalScore, timeSpentSeconds: 60, stats: { maxWheelie: this.maxWheelie.toFixed(1) } });
      }

      spawnImpact(x, y) {
        const colors = [0xfff5d1, 0xff9e3d, 0xff5d67, 0xffffff, 0x64d4ff];
        for (let i = 0; i < 28; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = 1.4 + Math.random() * 4.1;
          this.particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 1.5, life: 0.35 + Math.random() * 0.55, max: 0.9, size: 2 + Math.random() * 5, color: colors[i % colors.length] });
        }
      }

      addFloatingText(text, x, y, color = 0xffffff) {
        this.floatingTexts.push({ text, x, y, vy: -1.2, life: 1.0, max: 1.0, color });
      }

      // Compute exact positions of bike body, rear wheel, and front wheel
      computeBikePose() {
        const angle = -this.wheelieAngle; // Negative is front lifted up
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);

        // Rear axle is planted firmly on the road
        const rearAxleX = this.worldX;
        const rearAxleY = REAR_AXLE_Y;

        // Bike center from rear axle
        const rxRot = REAR_AXLE_OFFSET_X * cos - REAR_AXLE_OFFSET_Y * sin;
        const ryRot = REAR_AXLE_OFFSET_X * sin + REAR_AXLE_OFFSET_Y * cos;
        const bikeX = rearAxleX - rxRot;
        const bikeY = rearAxleY - ryRot;

        // Front axle from bike center
        const fxRot = FRONT_AXLE_OFFSET_X * cos - FRONT_AXLE_OFFSET_Y * sin;
        const fyRot = FRONT_AXLE_OFFSET_X * sin + FRONT_AXLE_OFFSET_Y * cos;
        const frontAxleX = bikeX + fxRot;
        const frontAxleY = bikeY + fyRot;

        return { bikeX, bikeY, rearAxleX, rearAxleY, frontAxleX, frontAxleY, angle };
      }

      updateKinematics(dt) {
        // 1. FORWARD ACCELERATION & BRAKING
        if (this.rightHeld) {
          // Accelerate forward up to max speed
          this.speed = Math.min(8.6, this.speed + 5.5 * dt);
        } else if (this.leftHeld) {
          // Brake firmly to a stop (STRICTLY NEVER REVERSES!)
          this.speed = Math.max(0, this.speed - 9.5 * dt);
        } else {
          // Gentle natural coasting rolling resistance
          this.speed = Math.max(0, this.speed - 1.6 * dt);
        }

        // Advance world X position smoothly
        this.worldX += this.speed * 60 * dt;
        this.tyreAngle += this.speed * 0.12;

        // 2. SMOOTH WHEELIE FROM 0° DIRECTLY ON RACE
        if (this.rightHeld) {
          // As soon as Race is pressed, front tyre smoothly lifts upward starting from 0!
          // Progressive lift rate gives intuitive, responsive arcade control
          const liftPower = 4.2;
          this.wheelieAngleVelocity += liftPower * dt;
        } else if (this.leftHeld) {
          // Tapping brake immediately pulls front wheel back down to road
          this.wheelieAngleVelocity -= 7.8 * dt;
        } else {
          // Releasing throttle allows gravity to bring front wheel smoothly back down
          this.wheelieAngleVelocity -= 4.2 * dt;
        }

        // Apply angular damping for butter-smooth motion
        this.wheelieAngleVelocity *= Math.pow(0.86, dt * 60);
        this.wheelieAngle += this.wheelieAngleVelocity * dt;

        // Clamp to ground (cannot penetrate road below 0°)
        if (this.wheelieAngle <= 0) {
          this.wheelieAngle = 0;
          this.wheelieAngleVelocity = 0;
        }

        // 3. WHEELIE SCORING
        // Detected when front wheel angle is lifted (> 0.14 rad / ~8°) while moving
        const isWheelie = this.wheelieAngle > 0.14 && this.speed > 0.4;
        if (isWheelie) {
          this.wheelieActive = true;
          this.wheelieTime += dt;
          this.maxWheelie = Math.max(this.maxWheelie, this.wheelieTime);
          this.wheelieCombo = this.wheelieTime > 4.5 ? 4 : this.wheelieTime > 2.8 ? 3 : this.wheelieTime > 1.2 ? 2 : 1;

          // Continuous points accumulation
          const pts = dt * 240 * this.wheelieCombo;
          this.wheeliePointsAccum += pts;
          if (this.wheeliePointsAccum >= 1) {
            const add = Math.floor(this.wheeliePointsAccum);
            this.score += add;
            this.wheeliePointsAccum -= add;
          }

          // Golden sparks streaming from rear wheel
          if (Math.random() < 0.45) {
            this.particles.push({
              x: this.worldX + (Math.random() - 0.5) * 8,
              y: ROAD_SURFACE_Y - 2,
              vx: -this.speed * 0.6 + (Math.random() - 0.5) * 2,
              vy: -0.8 - Math.random() * 2.2,
              life: 0.35 + Math.random() * 0.3,
              max: 0.65,
              size: 2 + Math.random() * 4,
              color: Math.random() > 0.4 ? 0xffd166 : 0xff70a6
            });
          }
        } else {
          if (this.wheelieActive) {
            // Front wheel landed smoothly!
            if (this.wheelieTime >= 0.7) {
              const landingBonus = Math.round(this.wheelieTime * 70 * this.wheelieCombo);
              this.score += landingBonus;
              this.addFloatingText(`+${landingBonus} CLEAN LANDING!`, this.sx(this.worldX + 40), ROAD_SURFACE_Y - 55, 0x43d6a6);
              this.audio.beep(880, 0.08, 'triangle', 0.08);
            }
            this.wheelieActive = false;
            this.wheelieTime = 0;
            this.wheelieCombo = 1;
          }
        }

        // 4. OVER-WHEELIE CRASH (> 72° / 1.26 rad)
        if (this.wheelieAngle > 1.26) {
          this.triggerCrash();
        }
      }

      updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i]; p.life -= dt; p.x += p.vx * dt * 60; p.y += p.vy * dt * 60; p.vy += 0.12 * dt * 60;
          if (p.life <= 0) this.particles.splice(i, 1);
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i]; ft.life -= dt; ft.y += ft.vy * dt * 60;
          if (ft.life <= 0) this.floatingTexts.splice(i, 1);
        }
      }

      update(time, rawDelta) {
        const dt = Math.min(rawDelta, 50) / 1000;
        this.refreshHeldButtons();
        if (this.pausedByHost || window.__GAME_ACTIVE__ === false) { this.render(); return; }

        if (this.state === 'countdown') {
          this.countdown -= dt;
          if (this.countdown <= 0) this.beginPlaying();
        } else if (this.state === 'playing') {
          this.updateKinematics(dt);
          this.timeLeft = Math.max(0, this.timeLeft - dt);
          if (this.timeLeft <= 0) this.showGameOver();
        } else if (this.state === 'crashing') {
          this.crashTimer -= dt;
          // Animate crash tumble
          this.crashVy += 16 * dt;
          this.crashX += this.crashVx * 60 * dt;
          this.crashY += this.crashVy * 60 * dt;
          this.crashAngle += this.crashSpin * dt;

          if (this.crashTimer <= 0) {
            // AUTOMATIC INSTANT RESPAWN WITHOUT DIALOG!
            if (this.timeLeft > 0) {
              this.respawnBike();
              this.state = 'playing';
            } else {
              this.showGameOver();
            }
          }
        }

        // Camera smoothly follows bike's forward progress (zero jitter!)
        this.cameraX = this.worldX - 100;

        this.updateParticles(dt);
        this.audio.setEngine(this.speed, this.rightHeld, this.wheelieActive);
        this.render();
      }

      sx(worldX) { return worldX - this.cameraX; }

      syncBikeVisuals(visible) {
        if (!this.usingBikeSprites) return;
        this.rearTyreSprite.setVisible(visible);
        this.frontTyreSprite.setVisible(visible);
        this.bikeBodySprite.setVisible(visible);
        if (!visible) return;

        if (this.state === 'crashing') {
          // Tumble in crash
          this.bikeBodySprite.setPosition(this.sx(this.crashX), this.crashY).setRotation(this.crashAngle);
          this.rearTyreSprite.setPosition(this.sx(this.crashX - 40), this.crashY + 20).setRotation(this.crashAngle + this.tyreAngle);
          this.frontTyreSprite.setPosition(this.sx(this.crashX + 40), this.crashY + 20).setRotation(this.crashAngle + this.tyreAngle);
          return;
        }

        const pose = this.computeBikePose();

        // 100% Dead-Center Alignment: Bike frame and tyres locked together at exact axle coordinates
        this.bikeBodySprite.setPosition(this.sx(pose.bikeX), pose.bikeY).setRotation(pose.angle);
        this.rearTyreSprite.setPosition(this.sx(pose.rearAxleX), pose.rearAxleY).setRotation(pose.angle + this.tyreAngle);
        this.frontTyreSprite.setPosition(this.sx(pose.frontAxleX), pose.frontAxleY).setRotation(pose.angle + this.tyreAngle);
      }

      renderSky(g) {
        const bands = [0x2288b8, 0x2fa5d6, 0x4ebfe3, 0x7dd7ee, 0xb4ecf5];
        const bandH = 420 / bands.length;
        bands.forEach((color, i) => { g.fillStyle(color, 1); g.fillRect(0, i * bandH, W, bandH + 1); });
        g.fillStyle(0xfff3c3, 0.95); g.fillCircle(282, 100, 31);
        g.fillStyle(0xffffff, 0.22); g.fillCircle(274, 92, 18);
      }

      renderWorld(g) {
        // Continuous, straight, pixel-perfect asphalt highway (zero vibration!)
        g.fillStyle(0x161f26, 1); g.fillRect(0, ROAD_SURFACE_Y, W, H - ROAD_SURFACE_Y);

        // Crisp white curb edge line
        g.fillStyle(0xf1f5f9, 1); g.fillRect(0, ROAD_SURFACE_Y, W, 4);

        // Neon gold center dash lane markings
        const startWorld = Math.floor(this.cameraX / 72) * 72 - 72;
        for (let wx = startWorld; wx < this.cameraX + W + 80; wx += 72) {
          const x = this.sx(wx);
          g.fillStyle(0xffd166, 0.98); g.fillRoundedRect(x, ROAD_SURFACE_Y + 24, 44, 4.5, 2);
        }

        // Road barrier guardrail
        const railStart = Math.floor(this.cameraX / 52) * 52 - 52;
        for (let wx = railStart; wx < this.cameraX + W + 70; wx += 52) {
          const x = this.sx(wx);
          g.fillStyle(0x1e293b, 0.75); g.fillRect(x, ROAD_SURFACE_Y - 32, 4, 32);
          g.fillStyle(0xe2e8f0, 0.92); g.fillRect(x - 4, ROAD_SURFACE_Y - 31, 56, 3);
        }
        g.fillStyle(0x0f172a, 0.35); g.fillRect(0, 402, W, 28);
      }

      renderParticles(g) {
        for (const p of this.particles) {
          const a = clamp(p.life / p.max, 0, 1); g.fillStyle(p.color, a); g.fillCircle(this.sx(p.x), p.y, p.size * a);
        }
        for (const ft of this.floatingTexts) {
          const a = clamp(ft.life / ft.max, 0, 1);
          this.fillText(ft.text, ft.x, ft.y, 14, ft.color, '900', 'center', a);
        }
      }

      fillText(text, x, y, size, color, weight = '800', align = 'center', alpha = 1) {
        let t = this.textPool[this.textIndex++];
        if (!t) {
          t = this.add.text(0, 0, '', {
            fontFamily: 'Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
            fontSize: size + 'px',
            fontStyle: weight,
            color: hex(color),
            align,
            resolution: DPR
          });
          this.textPool.push(t);
        }
        t.setText(text); t.setPosition(x, y); t.setFontSize(size + 'px'); t.setFontStyle(weight); t.setColor(hex(color)); t.setAlign(align); t.setAlpha(alpha); t.setVisible(true);
        t.setOrigin(align === 'center' ? 0.5 : align === 'right' ? 1 : 0, 0.5); t.setDepth(8); return t;
      }

      renderHud(g) {
        // 1. Timer in top center
        const timeSec = Math.max(0, Math.ceil(this.timeLeft));
        const timerPillColor = timeSec <= 10 ? 0xff5f79 : 0x0b2535;
        g.fillStyle(timerPillColor, 0.88); g.fillRoundedRect(140, 22, 80, 48, 16);
        g.lineStyle(2, timeSec <= 10 ? 0xff5f79 : 0x38bdf8, 0.9); g.strokeRoundedRect(140, 22, 80, 48, 16);
        this.fillText(String(timeSec), 180, 42, 24, 0xffffff, '900');
        this.fillText('SECONDS', 180, 60, 8, 0x94a3b8, '800');

        // 2. Score Pill on top right
        g.fillStyle(0x0b2535, 0.88); g.fillRoundedRect(240, 24, 106, 44, 14);
        g.lineStyle(1.5, 0xffd166, 0.85); g.strokeRoundedRect(240, 24, 106, 44, 14);
        this.fillText(String(this.score), 293, 41, 18, 0xffffff, '900');
        this.fillText('SCORE', 293, 58, 8, 0xffd166, '800');

        // 3. Dynamic Wheelie Banner in mid-upper screen when actively wheeling
        if (this.wheelieActive && this.wheelieTime > 0.2) {
          const comboColor = this.wheelieCombo >= 4 ? 0xff5f79 : this.wheelieCombo >= 3 ? 0xff9d48 : 0x06d6a0;
          g.fillStyle(0x071b29, 0.92); g.fillRoundedRect(45, 96, 270, 48, 16);
          g.lineStyle(2.5, comboColor, 1); g.strokeRoundedRect(45, 96, 270, 48, 16);
          this.fillText(`🔥 WHEELIE x${this.wheelieCombo}  (${this.wheelieTime.toFixed(1)}s)`, 180, 114, 16, 0xffffff, '900');
          this.fillText('POP & HOLD TO MULTIPLY POINTS!', 180, 132, 8, comboColor, '800');
        }
      }

      renderControls(g) {
        // Raised controls: y = 470, h = 88, leaving 82px of generous bottom space!
        const y = 470, h = 88, gap = 18, w = (W - gap * 3) / 2;
        const buttons = [
          { left: true, x: gap, held: this.leftHeld, label: 'BRAKE', sub: 'STOP · BALANCE', color: 0xef4444, icon: '◀ 🛑' },
          { left: false, x: gap * 2 + w, held: this.rightHeld, label: 'RACE / GAS', sub: 'HOLD TO WHEELIE', color: 0x06d6a0, icon: '⚡ ▶' }
        ];

        for (const button of buttons) {
          const bgAlpha = button.held ? 0.95 : 0.76;
          g.fillStyle(0x071a28, bgAlpha); g.fillRoundedRect(button.x, y, w, h, 20);
          g.lineStyle(button.held ? 3.5 : 2, button.color, button.held ? 1 : 0.75);
          g.strokeRoundedRect(button.x, y, w, h, 20);

          if (button.held) {
            g.fillStyle(button.color, 0.22); g.fillRoundedRect(button.x, y, w, h, 20);
          }

          const cx = button.x + w / 2;
          this.fillText(button.icon, cx, y + 26, 18, 0xffffff, '900');
          this.fillText(button.label, cx, y + 50, 14, button.held ? 0xffffff : button.color, '900');
          this.fillText(button.sub, cx, y + 70, 8, button.held ? 0xffffff : 0x94a3b8, '800');
        }
      }

      renderHome(g) {
        g.fillStyle(0x061724, 0.65); g.fillRect(0, 0, W, H);
        g.fillStyle(0x071f2d, 0.94); g.fillRoundedRect(18, 54, 324, 520, 26);
        g.lineStyle(2, 0x06d6a0, 0.7); g.strokeRoundedRect(18, 54, 324, 520, 26);

        // Title Header
        g.fillStyle(0x06d6a0, 0.2); g.fillCircle(180, 108, 44);
        this.fillText('MOTO WHEELIE', 180, 96, 28, 0xffffff, '900');
        this.fillText('SKYLINE RUN', 180, 126, 14, 0xffd166, '900');
        this.fillText('60 SECONDS · POP WHEELIES · SCORE BIG', 180, 154, 9, 0xa5f3fc, '800');

        // Instructions Card
        g.fillStyle(0x0d2b3e, 0.88); g.fillRoundedRect(34, 182, 292, 240, 18);
        g.lineStyle(1.5, 0x38bdf8, 0.5); g.strokeRoundedRect(34, 182, 292, 240, 18);

        this.fillText('HOW TO PLAY', 180, 206, 12, 0xffffff, '900');

        const tips = [
          { icon: '⚡', title: 'HOLD RACE (RIGHT)', desc: 'Smoothly moves & lifts front wheel from 0°' },
          { icon: '🛑', title: 'HOLD BRAKE (LEFT)', desc: 'Stops bike & drops front wheel (No reverse!)' },
          { icon: '🔥', title: 'HOLD A WHEELIE', desc: 'Score rapid points & climb multipliers!' },
          { icon: '⚠️', title: 'DON’T OVER-TILT', desc: 'Tilt > 72° flips backward! Auto-respawns!' }
        ];

        tips.forEach((tip, i) => {
          const rowY = 242 + i * 44;
          this.fillText(tip.icon, 54, rowY, 14, 0xffffff, '900');
          this.fillText(tip.title, 76, rowY - 6, 10, 0xffd166, '900', 'left');
          this.fillText(tip.desc, 76, rowY + 9, 8, 0xd1d5db, '600', 'left');
        });

        // Start Button
        g.fillStyle(0x06d6a0, 1); g.fillRoundedRect(36, 448, 288, 64, 20);
        g.lineStyle(2, 0xffffff, 0.8); g.strokeRoundedRect(36, 448, 288, 64, 20);
        this.fillText('START RUN  ▶', 180, 474, 20, 0xffffff, '900');
        this.fillText('PRESS SPACE OR TAP TO PLAY', 180, 497, 9, 0x052e25, '800');
      }

      renderCountdown(g) {
        g.fillStyle(0x06121d, 0.35); g.fillRect(0, 0, W, H);
        const value = this.countdown > 1.3 ? '3' : this.countdown > 0.65 ? '2' : this.countdown > 0.1 ? '1' : 'GO!';
        g.fillStyle(0x071f2d, 0.88); g.fillCircle(180, 242, 68);
        g.lineStyle(3.5, 0x06d6a0, 1); g.strokeCircle(180, 242, 68);
        this.fillText(value, 180, 245, value === 'GO!' ? 36 : 64, 0xffffff, '900');
        this.fillText('GET READY TO WHEELIE!', 180, 326, 11, 0xffd166, '900');
      }

      renderGameOver(g) {
        g.fillStyle(0x03101a, 0.75); g.fillRect(0, 0, W, H);
        const best = this.best || this.bestScores.read();
        g.fillStyle(0x071d2a, 0.97); g.fillRoundedRect(25, 116, 310, 440, 26);
        g.lineStyle(2, 0x06d6a0, 0.9); g.strokeRoundedRect(25, 116, 310, 440, 26);

        this.fillText(this.finalScore >= best.allTime && this.finalScore > 0 ? '🏆 NEW BEST RUN!' : 'RUN COMPLETE', 180, 150, 12, 0xffd166, '900');
        this.fillText('TIME’S UP!', 180, 182, 28, 0xffffff, '900');

        g.fillStyle(0x06d6a0, 0.18); g.fillCircle(180, 252, 54);
        g.lineStyle(2.5, 0x06d6a0, 0.85); g.strokeCircle(180, 252, 54);
        this.fillText(String(this.finalScore), 180, 246, 38, 0xffffff, '900');
        this.fillText('FINAL SCORE', 180, 280, 9, 0xffd166, '900');

        const rows = [
          ['LONGEST WHEELIE', `${this.maxWheelie.toFixed(1)}s`],
          ['ALL-TIME BEST SCORE', String(best.allTime || 0)]
        ];
        rows.forEach((row, i) => {
          const ry = 330 + i * 44;
          g.fillStyle(0x0e2a38, 0.85); g.fillRoundedRect(44, ry - 16, 272, 34, 10);
          this.fillText(row[0], 60, ry, 9, 0x94a3b8, '800', 'left');
          this.fillText(row[1], 298, ry, 15, 0xffffff, '900', 'right');
        });

        g.fillStyle(0x06d6a0, 1); g.fillRoundedRect(44, 468, 272, 58, 18);
        g.lineStyle(2, 0xffffff, 0.8); g.strokeRoundedRect(44, 468, 272, 58, 18);
        this.fillText('RIDE AGAIN  ▶', 180, 496, 18, 0xffffff, '900');
      }

      render() {
        this.skyG.clear(); this.renderSky(this.skyG); this.updateEnvironment();
        this.g.clear(); this.textIndex = 0;
        const g = this.g;

        this.renderWorld(g);

        const showBike = this.state === 'countdown' || this.state === 'playing' || this.state === 'crashing';
        this.syncBikeVisuals(showBike);

        this.renderParticles(g);

        if (this.state === 'playing' || this.state === 'countdown' || this.state === 'crashing') {
          this.renderHud(g);
          this.renderControls(g);
        }
        if (this.state === 'home') this.renderHome(g);
        if (this.state === 'countdown') this.renderCountdown(g);
        if (this.state === 'gameover') this.renderGameOver(g);

        if (this.pausedByHost && (this.state === 'playing' || this.state === 'countdown')) {
          g.fillStyle(0x03101a, 0.55); g.fillRect(0, 0, W, H);
          this.fillText('PAUSED', 180, 316, 24, 0xffffff, '900');
        }

        for (let i = this.textIndex; i < this.textPool.length; i++) this.textPool[i].setVisible(false);
      }
    }

    const nativeHost = Boolean(window.NativeBridge || window.FlutterGameBridge || window.flutter_inappwebview);
    if (nativeHost) document.documentElement.classList.add('native-host');

    window.__MOTO_BALANCE_GAME__ = new Phaser.Game({
      type: Phaser.AUTO,
      parent: 'game-root',
      width: W,
      height: H,
      resolution: DPR,
      transparent: false,
      backgroundColor: '#2288b8',
      banner: false,
      render: {
        antialias: true,
        antialiasGL: true,
        roundPixels: true,
        powerPreference: 'high-performance'
      },
      scene: [MotoBalanceScene]
    });
  })();
  </script>
</body>
</html>
