<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Number Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #333C4A;
      font-family: 'Fredoka', 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    'use strict';

    // 1. ENHANCED VIBRANT TILE PALETTE
    const TILE_PALETTE = {
      2:    { bg: '#FF4359', topBg: '#FF6B7D', text: '#FFFFFF', border: '#E02D43', glow: '#FF4359' },
      4:    { bg: '#A855F7', topBg: '#C084FC', text: '#FFFFFF', border: '#9333EA', glow: '#A855F7' },
      8:    { bg: '#F59E0B', topBg: '#FBBF24', text: '#FFFFFF', border: '#D97706', glow: '#F59E0B' },
      16:   { bg: '#84CC16', topBg: '#A3E635', text: '#FFFFFF', border: '#65A30D', glow: '#84CC16' },
      32:   { bg: '#06B6D4', topBg: '#22D3EE', text: '#FFFFFF', border: '#0891B2', glow: '#06B6D4' },
      64:   { bg: '#FB923C', topBg: '#FDBA74', text: '#FFFFFF', border: '#EA580C', glow: '#FB923C' },
      128:  { bg: '#3B82F6', topBg: '#60A5FA', text: '#FFFFFF', border: '#2563EB', glow: '#3B82F6' },
      256:  { bg: '#A78BFA', topBg: '#C4B5FD', text: '#FFFFFF', border: '#8B5CF6', glow: '#A78BFA' },
      512:  { bg: '#10B981', topBg: '#34D399', text: '#FFFFFF', border: '#059669', glow: '#10B981' },
      1024: { bg: '#6366F1', topBg: '#818CF8', text: '#FFFFFF', border: '#4F46E5', glow: '#6366F1' },
      2048: { bg: '#22D3EE', topBg: '#67E8F9', text: '#FFFFFF', border: '#FFFFFF', glow: '#22D3EE', isNeon: true },
      4096: { bg: '#EC4899', topBg: '#F472B6', text: '#FFFFFF', border: '#FFFFFF', glow: '#EC4899', isNeon: true },
      8192: { bg: '#F43F5E', topBg: '#FB7185', text: '#FFFFFF', border: '#FFFFFF', glow: '#F43F5E', isNeon: true }
    };

    const THEME = {
      bg: '#333C4A',
      boardBg: '#18202A',
      boardBorder: '#0F151C',
      colLine: 'rgba(255, 255, 255, 0.05)',
      dangerTop: 'rgba(239, 68, 68, 0.28)',
      dangerBottom: 'rgba(239, 68, 68, 0.0)',
      pillBg: '#131B24',
      pillBorder: '#222E3C',
      textMain: '#FFFFFF',
      textMuted: '#94A3B8',
      accentCrown: '#2DD4BF',
      btnBg: '#FFFFFF',
      btnIcon: '#F43F5E',
      undoBg: '#F59E0B',
      undoText: '#FFFFFF'
    };

    // 2. AUDIO SYNTHESIZER
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playDrop() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, t);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.12);
        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }

      playLand() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(190, t);
        osc.frequency.exponentialRampToValueAtTime(70, t + 0.07);
        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      }

      playMerge(value = 4) {
        if (this.muted || !this.ctx) return;
        this.init();
        const step = Math.min(8, Math.max(1, Math.log2(value) - 1));
        const baseFreq = 261.63 * Math.pow(1.122, step);
        [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.035;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.20, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.34);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.35);
        });
      }

      playTap() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }

      playUndo() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.08);
        gain.gain.setValueAtTime(0.10, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.09);
      }

      playGameOver() {
        if (this.muted || !this.ctx) return;
        this.init();
        const notes = [300, 260, 220, 180];
        notes.forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.29);
        });
      }
    }

    // 3. HOST PLATFORM BRIDGE
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const msg = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', msg);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(msg);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      }
    };

    // 4. MAIN NUMBER DROP GAME ENGINE
    class NumberDropGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.synth = new SoundSynth();

        this.cols = 5;
        this.maxRows = 8;

        this.columns = [[], [], [], [], []];

        this.currentVal = 2;
        this.nextVal = 4;

        this.currentPieceX = 0; // Live X position of piece above board (starts in center)
        this.targetCol = 2;      // Target column (0..4)
        this.targetColX = 0;     // Target X corresponding to targetCol

        this.fallingPiece = null;
        this.lightPhotons = [];    // Radiant light beam sparks
        this.shockwaves = [];      // Expanding circular merge shockwaves
        this.sparkles = [];        // Merge burst sparks
        this.floatingScores = [];  // Floating '+64' scores

        this.score = 0;
        this.allTimeBest = this.loadBestScore();
        this.undoCharges = 1;
        this.history = [];

        this.state = 'AIMING'; // 'AIMING', 'GLIDING', 'FALLING', 'MERGING', 'GAME_OVER'
        this.toast = null;
        this.isPointerDown = false;

        this.initLayout();
        this.bindEvents();
        this.startNewGame();

        requestAnimationFrame((t) => this.loop(t));
      }

      loadBestScore() {
        try {
          const s = localStorage.getItem('number_drop_best_score');
          return s ? parseInt(s) || 11847 : 11847;
        } catch (e) {
          return 11847;
        }
      }

      saveBestScore() {
        try {
          localStorage.setItem('number_drop_best_score', this.allTimeBest.toString());
        } catch (e) {}
      }

      startNewGame() {
        this.columns = [[], [], [], [], []];
        this.score = 0;
        this.undoCharges = 1;
        this.history = [];
        this.fallingPiece = null;
        this.lightPhotons = [];
        this.shockwaves = [];
        this.sparkles = [];
        this.floatingScores = [];
        this.state = 'AIMING';

        this.currentVal = this.generateWeightedValue();
        this.nextVal = this.generateWeightedValue();

        // Always spawn the new piece in the exact horizontal center
        this.resetPieceToCenter();

        this.saveHistoryState();
        Host.post('onGameStarted', { mode: 'easy' });
      }

      resetPieceToCenter() {
        const centerX = this.boardX + 2 * this.colWidth + this.colWidth / 2;
        this.currentPieceX = centerX;
        this.targetCol = 2;
        this.targetColX = centerX;
      }

      getHighestTileOnBoard() {
        let maxVal = 2;
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.columns[c].length; r++) {
            if (this.columns[c][r].val > maxVal) {
              maxVal = this.columns[c][r].val;
            }
          }
        }
        return maxVal;
      }

      generateWeightedValue() {
        const highest = this.getHighestTileOnBoard();
        const options = [
          { val: 2, w: 32 },
          { val: 4, w: 28 },
          { val: 8, w: 20 },
          { val: 16, w: 12 },
          { val: 32, w: 6 },
          { val: 64, w: 2 }
        ];

        if (highest >= 128) options.push({ val: 128, w: 1 });
        if (highest >= 512) options.push({ val: 256, w: 1 });

        const totalWeight = options.reduce((sum, o) => sum + o.w, 0);
        let rand = Math.random() * totalWeight;

        for (const opt of options) {
          if (rand < opt.w) return opt.val;
          rand -= opt.w;
        }
        return 2;
      }

      saveHistoryState() {
        const snapshot = this.columns.map(col => col.map(block => ({ ...block })));
        this.history.push({
          columns: snapshot,
          score: this.score,
          currentVal: this.currentVal,
          nextVal: this.nextVal,
          undoCharges: this.undoCharges
        });
        if (this.history.length > 5) this.history.shift();
      }

      handleUndo() {
        if (this.state !== 'AIMING') return;
        if (this.undoCharges <= 0 || this.history.length <= 1) {
          this.toast = { text: 'No Undos Remaining!', t: 1.5 };
          return;
        }

        this.history.pop();
        const prev = this.history[this.history.length - 1];
        if (prev) {
          this.columns = prev.columns.map(col => col.map(b => ({ ...b })));
          this.score = prev.score;
          this.currentVal = prev.currentVal;
          this.nextVal = prev.nextVal;
          this.undoCharges--;
          this.resetPieceToCenter();
          this.synth.playUndo();
          this.toast = { text: '↺ Move Undone!', t: 1.2 };
        }
      }

      initLayout() {
        const dpr = window.devicePixelRatio || 1;
        this.dpr = dpr;
        this.width = window.innerWidth || 360;
        this.height = window.innerHeight || 640;
        this.canvas.width = Math.round(this.width * dpr);
        this.canvas.height = Math.round(this.height * dpr);

        const topPadding = 110;
        const bottomAdHeight = 65;
        const availableH = this.height - topPadding - bottomAdHeight - 75;
        const availableW = this.width - 32;

        this.colWidth = Math.floor(Math.min(availableW / this.cols, availableH / this.maxRows, 68));
        this.tileSize = this.colWidth - 4;
        this.boardW = this.cols * this.colWidth;
        this.boardH = this.maxRows * this.colWidth;

        this.boardX = Math.round((this.width - this.boardW) / 2);
        this.boardY = Math.round(topPadding + 65);

        this.headerY = 16;
        this.subHudY = this.boardY - 60;
        this.spawnY = this.boardY - this.colWidth - 8;
      }

      bindEvents() {
        window.addEventListener('resize', () => {
          this.initLayout();
          this.resetPieceToCenter();
        });

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          return { px: clientX - rect.left, py: clientY - rect.top };
        };

        const handleDown = (e) => {
          e.preventDefault();
          this.synth.init();
          if (e.pointerId !== undefined) {
            try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
          }
          const { px, py } = getPos(e);
          this.isPointerDown = true;

          // Header Clicks
          if (py >= this.headerY - 4 && py <= this.headerY + 54) {
            if (px >= 14 && px <= 54) {
              this.synth.playTap();
              Host.post('onBackClicked');
              return;
            }
            if (px >= this.width - 56 && px <= this.width - 14) {
              this.synth.playTap();
              this.startNewGame();
              return;
            }
          }

          // Sub-HUD Undo Button (Left)
          if (py >= this.subHudY - 6 && py <= this.subHudY + 50 && px >= 14 && px <= 78) {
            this.handleUndo();
            return;
          }

          // Game Over Modal Restart
          if (this.state === 'GAME_OVER') {
            const btnW = 200, btnH = 48;
            const btnX = (this.width - btnW) / 2;
            const btnY = this.height * 0.62;
            if (px >= btnX && px <= btnX + btnW && py >= btnY && py <= btnY + btnH) {
              this.synth.playTap();
              this.startNewGame();
            }
            return;
          }

          // Aiming: update selected column
          if (this.state === 'AIMING') {
            this.updateTargetColumn(px);
          }
        };

        const handleMove = (e) => {
          if (!this.isPointerDown || this.state !== 'AIMING') return;
          e.preventDefault();
          const { px } = getPos(e);
          this.updateTargetColumn(px);
        };

        const handleUp = (e) => {
          if (!this.isPointerDown) return;
          this.isPointerDown = false;

          if (this.state === 'AIMING') {
            this.initiateDropSequence();
          }
        };

        this.canvas.addEventListener('pointerdown', handleDown);
        window.addEventListener('pointermove', handleMove);
        window.addEventListener('pointerup', handleUp);
        window.addEventListener('pointercancel', handleUp);
      }

      updateTargetColumn(px) {
        let col = Math.floor((px - this.boardX) / this.colWidth);
        col = Math.max(0, Math.min(this.cols - 1, col));
        this.targetCol = col;
        this.targetColX = this.boardX + col * this.colWidth + this.colWidth / 2;
      }

      // CENTER-TO-COLUMN GLIDE BEFORE DROP
      initiateDropSequence() {
        if (this.state !== 'AIMING') return;

        const col = this.targetCol;
        if (this.columns[col].length >= this.maxRows) {
          this.toast = { text: 'Column Full!', t: 1.0 };
          return;
        }

        this.saveHistoryState();

        // Check if piece already reached target column top
        if (Math.abs(this.currentPieceX - this.targetColX) < 4) {
          this.currentPieceX = this.targetColX;
          this.startVerticalFall();
        } else {
          // Glide horizontally to target column top first
          this.state = 'GLIDING';
        }
      }

      startVerticalFall() {
        const col = this.targetCol;
        this.state = 'FALLING';
        this.synth.playDrop();
        this.haptic(10);

        const startX = this.boardX + col * this.colWidth + this.colWidth / 2;
        const startY = this.spawnY + this.colWidth / 2;
        const stackHeight = this.columns[col].length;
        const targetRow = stackHeight;
        const targetY = this.boardY + (this.maxRows - 1 - targetRow) * this.colWidth + this.colWidth / 2;

        this.fallingPiece = {
          col: col,
          val: this.currentVal,
          x: startX,
          y: startY,
          targetY: targetY,
          targetRow: targetRow,
          vy: 750
        };
      }

      resolveLanding() {
        if (!this.fallingPiece) return;

        const p = this.fallingPiece;
        const col = p.col;
        const val = p.val;
        this.fallingPiece = null;

        this.synth.playLand();
        this.haptic(15);

        // Add block to column stack
        this.columns[col].push({
          val: val,
          highlight: 1.0,
          scale: 1.0
        });

        const landedRow = this.columns[col].length - 1;
        this.state = 'MERGING';
        this.checkAndExecuteMultiMerges(col, landedRow);
      }

      // COMPREHENSIVE MULTI-DIRECTIONAL CONNECTED MERGES (Left, Right, Bottom, Top)
      checkAndExecuteMultiMerges(priorityCol = null, priorityRow = null) {
        let bestGroup = null;

        // Helper to find all orthogonal connected matching blocks using BFS
        const findConnected = (startC, startR) => {
          const targetVal = this.columns[startC][startR].val;
          const visited = new Set();
          const queue = [{ c: startC, r: startR }];
          visited.add(startC + ',' + startR);
          const group = [{ c: startC, r: startR }];

          while (queue.length > 0) {
            const { c, r } = queue.shift();
            const neighbors = [
              { c: c, r: r - 1 }, // Down
              { c: c - 1, r: r }, // Left
              { c: c + 1, r: r }, // Right
              { c: c, r: r + 1 }  // Up
            ];

            for (const n of neighbors) {
              if (n.c >= 0 && n.c < this.cols && n.r >= 0 && n.r < this.columns[n.c].length) {
                const key = n.c + ',' + n.r;
                if (!visited.has(key) && this.columns[n.c][n.r].val === targetVal) {
                  visited.add(key);
                  group.push(n);
                  queue.push(n);
                }
              }
            }
          }
          return group;
        };

        // First check priority landing cell if provided
        if (priorityCol !== null && priorityRow !== null && priorityRow < this.columns[priorityCol].length) {
          const g = findConnected(priorityCol, priorityRow);
          if (g.length >= 2) {
            bestGroup = { center: { c: priorityCol, r: priorityRow }, group: g };
          }
        }

        // If no group at priority node, scan all board blocks
        if (!bestGroup) {
          for (let c = 0; c < this.cols; c++) {
            for (let r = 0; r < this.columns[c].length; r++) {
              const g = findConnected(c, r);
              if (g.length >= 2) {
                bestGroup = { center: { c, r }, group: g };
                break;
              }
            }
            if (bestGroup) break;
          }
        }

        if (bestGroup) {
          const center = bestGroup.center;
          const group = bestGroup.group;
          const startVal = this.columns[center.c][center.r].val;
          const count = group.length;

          // Value doubles per merged pair (e.g. 2 blocks -> 2x, 3 blocks -> 4x, 4 blocks -> 8x)
          const newVal = startVal * Math.pow(2, count - 1);

          // Update target block
          const targetBlock = this.columns[center.c][center.r];
          targetBlock.val = newVal;
          targetBlock.scale = 1.38; // juicy pop
          targetBlock.highlight = 1.0;

          // Remove other participating blocks (sorted descending by row to avoid index shifting)
          const toRemove = group.filter(pt => !(pt.c === center.c && pt.r === center.r));
          toRemove.sort((a, b) => b.r - a.r);

          for (const pt of toRemove) {
            this.columns[pt.c].splice(pt.r, 1);
          }

          this.triggerMergeEffects(center.c, center.r, newVal);

          // Cascade: repeat check after merge animation
          setTimeout(() => {
            this.checkAndExecuteMultiMerges(center.c, center.r);
          }, 240);
        } else {
          this.finalizeTurn();
        }
      }

      triggerMergeEffects(col, row, newVal) {
        this.score += newVal;
        if (this.score > this.allTimeBest) {
          this.allTimeBest = this.score;
          this.saveBestScore();
        }

        this.synth.playMerge(newVal);
        this.haptic(25);

        const cx = this.boardX + col * this.colWidth + this.colWidth / 2;
        const cy = this.boardY + (this.maxRows - 1 - row) * this.colWidth + this.colWidth / 2;
        const pal = TILE_PALETTE[newVal] || TILE_PALETTE[2];

        // Shockwave Ring
        this.shockwaves.push({
          x: cx,
          y: cy,
          radius: this.tileSize * 0.3,
          maxRadius: this.tileSize * 1.30,
          color: pal.bg,
          alpha: 1.0
        });

        // Burst Sparkles
        for (let i = 0; i < 9; i++) {
          const angle = (Math.PI * 2 * i) / 9 + Math.random() * 0.3;
          const speed = 45 + Math.random() * 65;
          this.sparkles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: pal.topBg || pal.bg,
            size: 3.5 + Math.random() * 3,
            alpha: 1.0,
            life: 0.35
          });
        }

        // Floating Score
        this.floatingScores.push({
          x: cx,
          y: cy - 14,
          text: '+' + newVal.toLocaleString(),
          alpha: 1.0
        });

        Host.post('onScoreUpdated', { score: this.score, earned: newVal });
      }

      finalizeTurn() {
        this.currentVal = this.nextVal;
        this.nextVal = this.generateWeightedValue();
        this.resetPieceToCenter();
        this.state = 'AIMING';

        // Check if all columns are full
        let isFull = true;
        for (let c = 0; c < this.cols; c++) {
          if (this.columns[c].length < this.maxRows) {
            isFull = false;
            break;
          }
        }

        if (isFull) {
          this.state = 'GAME_OVER';
          this.synth.playGameOver();
          Host.post('onGameOver', { score: this.score, best: this.allTimeBest });
        }
      }

      haptic(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      loop(timestamp) {
        const dt = Math.min(0.1, (timestamp - (this.lastTime || timestamp)) / 1000);
        this.lastTime = timestamp;

        // Smooth horizontal glide for piece aiming / gliding
        if (this.state === 'AIMING' && this.isPointerDown) {
          this.currentPieceX += (this.targetColX - this.currentPieceX) * 22 * dt;
        } else if (this.state === 'GLIDING') {
          this.currentPieceX += (this.targetColX - this.currentPieceX) * 26 * dt;
          if (Math.abs(this.currentPieceX - this.targetColX) < 3.5) {
            this.currentPieceX = this.targetColX;
            this.startVerticalFall();
          }
        }

        // Falling Block Physics & Radiant Light Trail
        if (this.state === 'FALLING' && this.fallingPiece) {
          const p = this.fallingPiece;
          p.vy += 2600 * dt;
          p.y += p.vy * dt;

          const pal = TILE_PALETTE[p.val] || TILE_PALETTE[2];

          // Emit radiant light photons trailing inside the energy beam
          for (let i = 0; i < 2; i++) {
            this.lightPhotons.push({
              x: p.x + (Math.random() - 0.5) * (this.tileSize * 0.45),
              y: p.y - this.tileSize * 0.35 + (Math.random() - 0.5) * 4,
              vy: -50 - Math.random() * 50,
              size: 2.5 + Math.random() * 2.5,
              color: '#FFFFFF',
              glowColor: pal.glow,
              alpha: 0.85,
              life: 0.22
            });
          }

          if (p.y >= p.targetY) {
            p.y = p.targetY;
            this.resolveLanding();
          }
        }

        // Update Light Photons
        for (let i = this.lightPhotons.length - 1; i >= 0; i--) {
          const lp = this.lightPhotons[i];
          lp.y += lp.vy * dt;
          lp.alpha -= dt * 3.8;
          if (lp.alpha <= 0) this.lightPhotons.splice(i, 1);
        }

        // Update Shockwaves
        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += (sw.maxRadius - sw.radius) * 11 * dt;
          sw.alpha -= dt * 3.5;
          if (sw.alpha <= 0) this.shockwaves.splice(i, 1);
        }

        // Update Sparkles
        for (let i = this.sparkles.length - 1; i >= 0; i--) {
          const spk = this.sparkles[i];
          spk.x += spk.vx * dt;
          spk.y += spk.vy * dt;
          spk.alpha -= dt * 3.0;
          if (spk.alpha <= 0) this.sparkles.splice(i, 1);
        }

        // Settle Block Scales & Highlights
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.columns[c].length; r++) {
            const b = this.columns[c][r];
            if (b.scale > 1.0) {
              b.scale -= (b.scale - 1.0) * 8 * dt;
              if (b.scale < 1.01) b.scale = 1.0;
            }
            if (b.highlight > 0) {
              b.highlight = Math.max(0, b.highlight - dt * 2.5);
            }
          }
        }

        // Update Floating Scores
        for (let i = this.floatingScores.length - 1; i >= 0; i--) {
          const fs = this.floatingScores[i];
          fs.y -= 45 * dt;
          fs.alpha -= dt * 1.2;
          if (fs.alpha <= 0) this.floatingScores.splice(i, 1);
        }

        if (this.toast) {
          this.toast.t -= dt;
          if (this.toast.t <= 0) this.toast = null;
        }

        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      // --- RENDERING PIPELINE ---
      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        // 1. Overall Background
        ctx.fillStyle = THEME.bg;
        ctx.fillRect(0, 0, this.width, this.height);

        // 2. Header & Sub-HUD
        this.renderHeader(ctx);
        this.renderSubHUD(ctx);

        // 3. Play Container
        this.renderBoardContainer(ctx);

        // 4. Radiant Light Beam & Photons Behind Falling Block
        this.renderRadiantLightBeam(ctx);

        // 5. Stacked Blocks & Active Piece
        this.renderBlocks(ctx);

        // 6. Merge Shockwaves & Sparkles
        this.renderMergeEffects(ctx);

        // 7. Overlays & Toasts
        this.renderOverlays(ctx);

        if (this.toast) this.renderToast(ctx);
        if (this.state === 'GAME_OVER') this.renderGameOverModal(ctx);

        ctx.restore();
      }

      renderHeader(ctx) {
        const y = this.headerY;

        // Back Button (<)
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(36, y + 20, 20, 0, Math.PI * 2);
        ctx.fillStyle = THEME.btnBg;
        ctx.fill();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = THEME.btnIcon;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('‹', 36, y + 20);
        ctx.restore();

        // Mode & Live Score Pill
        const modePillW = 108;
        const modePillX = (this.width / 2) - modePillW - 8;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(modePillX, y, modePillW, 42, 10);
        ctx.fillStyle = THEME.pillBg;
        ctx.fill();
        ctx.strokeStyle = THEME.pillBorder;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 10.5px Fredoka, sans-serif';
        ctx.fillStyle = THEME.textMuted;
        ctx.textAlign = 'center';
        ctx.fillText('EASY MODE', modePillX + modePillW / 2, y + 14);

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.score.toLocaleString(), modePillX + modePillW / 2, y + 32);
        ctx.restore();

        // All Time High Score Pill
        const bestPillW = 108;
        const bestPillX = (this.width / 2) + 8;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bestPillX, y, bestPillW, 42, 10);
        ctx.fillStyle = THEME.pillBg;
        ctx.fill();
        ctx.strokeStyle = THEME.pillBorder;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 10px Fredoka, sans-serif';
        ctx.fillStyle = THEME.accentCrown;
        ctx.textAlign = 'center';
        ctx.fillText('👑 ALL TIME', bestPillX + bestPillW / 2, y + 14);

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = THEME.accentCrown;
        ctx.fillText(this.allTimeBest.toLocaleString(), bestPillX + bestPillW / 2, y + 32);
        ctx.restore();

        // Restart Button (↺)
        const restartX = this.width - 36;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(restartX, y + 20, 20, 0, Math.PI * 2);
        ctx.fillStyle = THEME.btnBg;
        ctx.fill();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = THEME.btnIcon;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↺', restartX, y + 20);
        ctx.restore();
      }

      renderSubHUD(ctx) {
        const y = this.subHudY;

        // Undo Button (Left)
        const undoX = 36;
        const undoY = y + 18;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(undoX, undoY, 22, 0, Math.PI * 2);
        ctx.fillStyle = THEME.undoBg;
        ctx.fill();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↶', undoX, undoY - 1);

        // Badge counter
        ctx.beginPath();
        ctx.arc(undoX + 15, undoY - 15, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.font = '900 10.5px Inter, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText(this.undoCharges.toString(), undoX + 15, undoY - 15);
        ctx.restore();

        // Upcoming Piece Preview (Right)
        const previewSize = 36;
        const previewX = this.width - 36 - previewSize / 2;
        const previewY = y;
        const nextPal = TILE_PALETTE[this.nextVal] || TILE_PALETTE[2];

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(previewX, previewY, previewSize, previewSize, 7);
        ctx.fillStyle = nextPal.bg;
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(previewX, previewY + previewSize - 3, previewSize, 3, [0, 0, 7, 7]);
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fill();

        ctx.font = '900 15px Fredoka, sans-serif';
        ctx.fillStyle = nextPal.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.nextVal.toString(), previewX + previewSize / 2, previewY + previewSize / 2 + 1);
        ctx.restore();
      }

      renderBoardContainer(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const bw = this.boardW;
        const bh = this.boardH;

        // Container Body
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 14);
        ctx.fillStyle = THEME.boardBg;
        ctx.fill();
        ctx.strokeStyle = THEME.boardBorder;
        ctx.lineWidth = 3.0;
        ctx.stroke();
        ctx.restore();

        // Column Dividers
        ctx.save();
        ctx.strokeStyle = THEME.colLine;
        ctx.lineWidth = 1.2;
        for (let c = 1; c < this.cols; c++) {
          const lx = bx + c * this.colWidth;
          ctx.beginPath();
          ctx.moveTo(lx, by + 4);
          ctx.lineTo(lx, by + bh - 4);
          ctx.stroke();
        }

        // Top Red Warning Danger Gradient
        const dangerH = this.colWidth * 1.5;
        const dangerGrad = ctx.createLinearGradient(0, by, 0, by + dangerH);
        dangerGrad.addColorStop(0, THEME.dangerTop);
        dangerGrad.addColorStop(1, THEME.dangerBottom);
        ctx.fillStyle = dangerGrad;
        ctx.beginPath();
        ctx.roundRect(bx + 2, by + 2, bw - 4, dangerH, [12, 12, 0, 0]);
        ctx.fill();

        ctx.restore();
      }

      // RADIANT LIGHT BEAM & PHOTONS (Replacing smoke)
      renderRadiantLightBeam(ctx) {
        if (this.state === 'FALLING' && this.fallingPiece) {
          const p = this.fallingPiece;
          const pal = TILE_PALETTE[p.val] || TILE_PALETTE[2];
          const beamLen = Math.min(120, p.y - this.boardY + 20);

          ctx.save();

          // 1. Soft Luminous Background Light Streak
          const glowGrad = ctx.createLinearGradient(0, p.y, 0, p.y - beamLen);
          glowGrad.addColorStop(0, pal.glow + '88');
          glowGrad.addColorStop(0.5, pal.glow + '33');
          glowGrad.addColorStop(1, pal.glow + '00');

          ctx.fillStyle = glowGrad;
          ctx.fillRect(p.x - this.tileSize * 0.42, p.y - beamLen, this.tileSize * 0.84, beamLen);

          // 2. Core Bright Energy Line
          const coreGrad = ctx.createLinearGradient(0, p.y, 0, p.y - beamLen * 0.7);
          coreGrad.addColorStop(0, '#FFFFFF');
          coreGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          ctx.strokeStyle = coreGrad;
          ctx.lineWidth = 3.0;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y - beamLen * 0.7);
          ctx.stroke();

          ctx.restore();
        }

        // Render Floating Light Photons
        for (const lp of this.lightPhotons) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(lp.x, lp.y, lp.size, 0, Math.PI * 2);
          ctx.fillStyle = lp.color;
          ctx.globalAlpha = lp.alpha;
          ctx.shadowColor = lp.glowColor;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      // BLOCKS RENDERING
      renderBlocks(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const cs = this.colWidth;
        const ts = this.tileSize;

        // 1. Settled Stacked Blocks
        for (let c = 0; c < this.cols; c++) {
          const col = this.columns[c];
          for (let r = 0; r < col.length; r++) {
            const block = col[r];
            const pal = TILE_PALETTE[block.val] || TILE_PALETTE[2];

            const cx = bx + c * cs + cs / 2;
            const cy = by + (this.maxRows - 1 - r) * cs + cs / 2;

            this.drawTile(ctx, cx, cy, ts, block.val, pal, block.highlight, block.scale || 1.0);
          }
        }

        // 2. Active Falling Block
        if (this.state === 'FALLING' && this.fallingPiece) {
          const p = this.fallingPiece;
          const pal = TILE_PALETTE[p.val] || TILE_PALETTE[2];
          this.drawTile(ctx, p.x, p.y, ts, p.val, pal, 0.4, 1.0);
        }

        // 3. Piece Above Container (AIMING or GLIDING)
        if (this.state === 'AIMING' || this.state === 'GLIDING') {
          const cx = this.currentPieceX;
          const cy = this.spawnY + cs / 2;
          const pal = TILE_PALETTE[this.currentVal] || TILE_PALETTE[2];
          this.drawTile(ctx, cx, cy, ts, this.currentVal, pal, 0.0, 1.0);
        }
      }

      drawTile(ctx, cx, cy, ts, val, pal, highlight = 0, scale = 1.0) {
        ctx.save();
        ctx.translate(cx, cy);
        if (scale !== 1.0) {
          ctx.scale(scale, scale);
        }

        const x0 = -ts / 2;
        const y0 = -ts / 2;

        // Subtle Drop Shadow
        ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 3;

        // Vibrant Body
        ctx.beginPath();
        ctx.roundRect(x0, y0, ts, ts, 8);
        ctx.fillStyle = pal.bg;
        ctx.fill();

        ctx.shadowColor = 'transparent';

        // Top Gloss Curve
        ctx.beginPath();
        ctx.roundRect(x0 + 2, y0 + 2, ts - 4, ts * 0.40, [6, 6, 2, 2]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
        ctx.fill();

        // Bottom Edge Bevel
        ctx.beginPath();
        ctx.roundRect(x0, y0 + ts - 4, ts, 4, [0, 0, 8, 8]);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fill();

        // Border / Glow Highlight
        ctx.beginPath();
        ctx.roundRect(x0, y0, ts, ts, 8);
        if (highlight > 0 || pal.isNeon) {
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = highlight > 0 ? 3.0 : 2.0;
        } else {
          ctx.strokeStyle = pal.border;
          ctx.lineWidth = 1.2;
        }
        ctx.stroke();

        // Centered Bold Typography
        const fontSize = val >= 1000 ? Math.floor(ts * 0.32) : Math.floor(ts * 0.46);
        ctx.font = '900 ' + fontSize + 'px Fredoka, sans-serif';
        ctx.fillStyle = pal.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val.toString(), 0, 1);

        ctx.restore();
      }

      // MERGE SHOCKWAVES & SPARKLES
      renderMergeEffects(ctx) {
        for (const sw of this.shockwaves) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = sw.alpha;
          ctx.lineWidth = 3.5;
          ctx.shadowColor = sw.color;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        }

        for (const spk of this.sparkles) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
          ctx.fillStyle = spk.color;
          ctx.globalAlpha = spk.alpha;
          ctx.shadowColor = '#FFFFFF';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      renderOverlays(ctx) {
        for (const fs of this.floatingScores) {
          ctx.save();
          ctx.font = '900 22px Fredoka, sans-serif';
          ctx.fillStyle = '#FACC15';
          ctx.globalAlpha = fs.alpha;
          ctx.textAlign = 'center';
          ctx.fillText(fs.text, fs.x, fs.y);
          ctx.restore();
        }

        // Bottom Ad Banner Area
        const bannerH = 50;
        const bannerY = this.height - bannerH - 8;
        const bannerW = Math.min(330, this.width - 24);
        const bannerX = (this.width - bannerW) / 2;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bannerX, bannerY, bannerW, bannerH, 6);
        ctx.fillStyle = '#0F172A';
        ctx.fill();
        ctx.strokeStyle = '#1E293B';
        ctx.lineWidth = 1.0;
        ctx.stroke();

        ctx.font = '700 11px Inter, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('ADVERTISEMENT AREA', bannerX + bannerW / 2, bannerY + bannerH / 2);
        ctx.restore();
      }

      renderToast(ctx) {
        const t = this.toast;
        if (!t) return;
        const tw = Math.min(260, this.width - 40);
        const tx = (this.width - tw) / 2;
        const ty = this.boardY - 45;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, 36, 18);
        ctx.fillStyle = '#172733';
        ctx.fill();
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.text, tx + tw / 2, ty + 18);
        ctx.restore();
      }

      renderGameOverModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(320, this.width - 36);
        const cardH = 310;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 32;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#1A2936';
        ctx.fill();
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.font = '900 24px Fredoka, sans-serif';
        ctx.fillStyle = '#EF4444';
        ctx.textAlign = 'center';
        ctx.fillText('BOARD IS FULL!', this.width / 2, cardY + 48);

        ctx.font = '700 14px Inter, sans-serif';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('FINAL SCORE', this.width / 2, cardY + 86);

        ctx.font = '900 32px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.score.toLocaleString(), this.width / 2, cardY + 124);

        ctx.font = '700 13px Inter, sans-serif';
        ctx.fillStyle = '#2DD4BF';
        ctx.fillText('👑 All-Time Best: ' + this.allTimeBest.toLocaleString(), this.width / 2, cardY + 160);

        const btnW = 200, btnH = 48;
        const btnX = (this.width - btnW) / 2;
        const btnY = this.height * 0.62;

        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 24);
        ctx.fillStyle = '#38BDF8';
        ctx.fill();

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText('PLAY AGAIN 🔄', this.width / 2, btnY + 24);
        ctx.restore();
      }
    }

    function initGame() {
      const canvas = document.getElementById('gameCanvas');
      if (canvas && !window.game) {
        window.game = new NumberDropGame(canvas);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
