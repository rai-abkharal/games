<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Number Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #333C4A;
      font-family: 'Fredoka', 'Inter', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <script>
    'use strict';

    // 1. TILE PALETTE CONFIGURATION
    const TILE_PALETTE = {
      2:    { bg: '#FF4359', topBg: '#FF6B7D', text: '#FFFFFF', border: '#E02D43', glow: '#FF4359' },
      4:    { bg: '#A855F7', topBg: '#C084FC', text: '#FFFFFF', border: '#9333EA', glow: '#A855F7' },
      8:    { bg: '#F59E0B', topBg: '#FBBF24', text: '#FFFFFF', border: '#D97706', glow: '#F59E0B' },
      16:   { bg: '#84CC16', topBg: '#A3E635', text: '#FFFFFF', border: '#65A30D', glow: '#84CC16' },
      32:   { bg: '#06B6D4', topBg: '#22D3EE', text: '#FFFFFF', border: '#0891B2', glow: '#06B6D4' },
      64:   { bg: '#FB923C', topBg: '#FDBA74', text: '#FFFFFF', border: '#EA580C', glow: '#FB923C' },
      128:  { bg: '#3B82F6', topBg: '#60A5FA', text: '#FFFFFF', border: '#2563EB', glow: '#3B82F6' },
      256:  { bg: '#A78BFA', topBg: '#C4B5FD', text: '#FFFFFF', border: '#8B5CF6', glow: '#A78BFA' },
      512:  { bg: '#10B981', topBg: '#34D399', text: '#FFFFFF', border: '#059669', glow: '#10B981' },
      1024: { bg: '#6366F1', topBg: '#818CF8', text: '#FFFFFF', border: '#4F46E5', glow: '#6366F1' },
      2048: { bg: '#22D3EE', topBg: '#67E8F9', text: '#FFFFFF', border: '#FFFFFF', glow: '#22D3EE', isNeon: true },
      4096: { bg: '#EC4899', topBg: '#F472B6', text: '#FFFFFF', border: '#FFFFFF', glow: '#EC4899', isNeon: true },
      8192: { bg: '#F43F5E', topBg: '#FB7185', text: '#FFFFFF', border: '#FFFFFF', glow: '#F43F5E', isNeon: true }
    };

    const MODES = [
      { id: 'easy', label: 'EASY MODE', rows: 9, subtitle: '9×5 Tall Grid • Relaxed & Strategic' },
      { id: 'medium', label: 'MEDIUM MODE', rows: 8, subtitle: '8×5 Grid • Balanced Flow' },
      { id: 'hard', label: 'HARD MODE', rows: 7, subtitle: '7×5 Compact Grid • Tight & Intense' }
    ];

    const THEME = {
      bg: '#333C4A',
      boardBg: '#18202A',
      boardBorder: '#0F151C',
      colLine: 'rgba(255, 255, 255, 0.05)',
      pillBg: '#131B24',
      pillBorder: '#222E3C',
      textMain: '#FFFFFF',
      textMuted: '#94A3B8',
      accentCrown: '#2DD4BF',
      btnBg: '#FFFFFF',
      btnIcon: '#F43F5E',
      undoBg: '#F59E0B',
      undoText: '#FFFFFF'
    };

    // 2. AUDIO SYNTHESIZER
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playDrop() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, t);
        osc.frequency.exponentialRampToValueAtTime(140, t + 0.18);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.19);
      }

      playLand() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(65, t + 0.09);
        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.10);
      }

      playMerge(value = 4) {
        if (this.muted || !this.ctx) return;
        this.init();
        const step = Math.min(8, Math.max(1, Math.log2(value) - 1));
        const baseFreq = 261.63 * Math.pow(1.122, step);
        [baseFreq, baseFreq * 1.25, baseFreq * 1.5].forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.04;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.22, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.44);
        });
      }

      playTap() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }

      playUndo() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.08);
        gain.gain.setValueAtTime(0.10, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.09);
      }

      playGameOver() {
        if (this.muted || !this.ctx) return;
        this.init();
        const notes = [300, 260, 220, 180];
        notes.forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.12;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.12, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.29);
        });
      }
    }

    // 3. HOST PLATFORM BRIDGE
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const msg = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', msg);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(msg);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      }
    };

    // 4. MAIN NUMBER DROP GAME ENGINE
    class NumberDropGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.synth = new SoundSynth();

        this.cols = 5;
        this.modeId = 'easy';
        this.mode = MODES.find(m => m.id === this.modeId) || MODES[0];
        this.maxRows = this.mode.rows;

        this.columns = [[], [], [], [], []];

        this.currentVal = 2;
        this.nextVal = 4;

        this.currentPieceX = 0;
        this.targetCol = 2;

        this.fallingPiece = null;
        this.absorbingBlocks = []; // Animating source blocks sliding UNDER destination block
        this.shockwaves = [];
        this.sparkles = [];
        this.floatingScores = [];

        this.score = 0;
        this.allTimeBest = this.loadBestScore();
        this.undoCharges = 1;
        this.history = [];

        this.state = 'AIMING'; // 'AIMING', 'FALLING', 'MERGING', 'MODE_SELECT', 'GAME_OVER'
        this.toast = null;
        this.isPointerDown = false;
        this.validTouchStarted = false;

        this.initLayout();
        this.bindEvents();
        this.startNewGame();

        requestAnimationFrame((t) => this.loop(t));
      }

      loadBestScore() {
        try {
          const s = localStorage.getItem('number_drop_best_score');
          return s ? parseInt(s) || 11847 : 11847;
        } catch (e) {
          return 11847;
        }
      }

      saveBestScore() {
        try {
          localStorage.setItem('number_drop_best_score', this.allTimeBest.toString());
        } catch (e) {}
      }

      startNewGame() {
        this.mode = MODES.find(m => m.id === this.modeId) || MODES[0];
        this.maxRows = this.mode.rows;
        this.columns = [[], [], [], [], []];
        this.score = 0;
        this.undoCharges = 1;
        this.history = [];
        this.fallingPiece = null;
        this.absorbingBlocks = [];
        this.shockwaves = [];
        this.sparkles = [];
        this.floatingScores = [];
        this.state = 'AIMING';
        this.validTouchStarted = false;

        this.initLayout();

        this.currentVal = this.generateWeightedValue();
        this.nextVal = this.generateWeightedValue();

        this.resetPieceToCenter();
        this.saveHistoryState();
        Host.post('onGameStarted', { mode: this.modeId });
      }

      resetPieceToCenter() {
        this.targetCol = 2;
        this.currentPieceX = this.boardX + 2 * this.colWidth + this.colWidth / 2;
      }

      getHighestTileOnBoard() {
        let maxVal = 2;
        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.columns[c].length; r++) {
            if (this.columns[c][r].val > maxVal) {
              maxVal = this.columns[c][r].val;
            }
          }
        }
        return maxVal;
      }

      generateWeightedValue() {
        const highest = this.getHighestTileOnBoard();
        const options = [
          { val: 2, w: 32 },
          { val: 4, w: 28 },
          { val: 8, w: 20 },
          { val: 16, w: 12 },
          { val: 32, w: 6 },
          { val: 64, w: 2 }
        ];

        if (highest >= 128) options.push({ val: 128, w: 1 });
        if (highest >= 512) options.push({ val: 256, w: 1 });

        const totalWeight = options.reduce((sum, o) => sum + o.w, 0);
        let rand = Math.random() * totalWeight;

        for (const opt of options) {
          if (rand < opt.w) return opt.val;
          rand -= opt.w;
        }
        return 2;
      }

      saveHistoryState() {
        const snapshot = this.columns.map(col => col.map(block => ({ ...block })));
        this.history.push({
          columns: snapshot,
          score: this.score,
          currentVal: this.currentVal,
          nextVal: this.nextVal,
          undoCharges: this.undoCharges
        });
        if (this.history.length > 5) this.history.shift();
      }

      handleUndo() {
        if (this.state !== 'AIMING') return;
        if (this.undoCharges <= 0 || this.history.length <= 1) {
          this.toast = { text: 'No Undos Remaining!', t: 1.5 };
          return;
        }

        this.history.pop();
        const prev = this.history[this.history.length - 1];
        if (prev) {
          this.columns = prev.columns.map(col => col.map(b => ({ ...b })));
          this.score = prev.score;
          this.currentVal = prev.currentVal;
          this.nextVal = prev.nextVal;
          this.undoCharges--;
          this.resetPieceToCenter();
          this.synth.playUndo();
          this.toast = { text: '↺ Move Undone!', t: 1.2 };
        }
      }

      initLayout() {
        const dpr = window.devicePixelRatio || 1;
        this.dpr = dpr;
        this.width = window.innerWidth || 360;
        this.height = window.innerHeight || 640;
        this.canvas.width = Math.round(this.width * dpr);
        this.canvas.height = Math.round(this.height * dpr);

        const topPadding = 100;
        const bottomPadding = 60;
        const availableH = this.height - topPadding - bottomPadding - 60;
        const availableW = this.width - 36;

        this.colWidth = Math.floor(Math.min(availableW / this.cols, availableH / this.maxRows, 54));
        this.tileSize = this.colWidth - 4;
        this.boardW = this.cols * this.colWidth;
        this.boardH = this.maxRows * this.colWidth;

        this.boardX = Math.round((this.width - this.boardW) / 2);
        this.boardY = Math.round(topPadding + (availableH - this.boardH) / 2 + 35);

        this.headerY = 16;
        this.subHudY = this.boardY - 48;
        this.spawnY = this.boardY - this.colWidth - 8;
      }

      bindEvents() {
        window.addEventListener('resize', () => {
          this.initLayout();
          this.resetPieceToCenter();
        });

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
          const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0] ? e.touches[0].clientY : 0);
          return { px: clientX - rect.left, py: clientY - rect.top };
        };

        const handleDown = (e) => {
          e.preventDefault();
          this.synth.init();
          if (e.pointerId !== undefined) {
            try { this.canvas.setPointerCapture(e.pointerId); } catch (_) {}
          }
          const { px, py } = getPos(e);

          if (this.state === 'MODE_SELECT') {
            this.handleModeModalClick(px, py);
            return;
          }

          // Header Clicks
          if (py >= this.headerY - 4 && py <= this.headerY + 54) {
            // Mode Select Pill
            const modePillW = 112;
            const modePillX = (this.width / 2) - modePillW - 8;
            if (px >= modePillX && px <= modePillX + modePillW) {
              this.synth.playTap();
              this.state = 'MODE_SELECT';
              return;
            }

            // Restart Button (Right)
            if (px >= this.width - 56 && px <= this.width - 14) {
              this.synth.playTap();
              this.startNewGame();
              return;
            }
          }

          // Sub-HUD Undo Button
          if (py >= this.subHudY - 6 && py <= this.subHudY + 50 && px >= 14 && px <= 78) {
            this.handleUndo();
            return;
          }

          // Game Over Modal Restart
          if (this.state === 'GAME_OVER') {
            const btnW = 200, btnH = 48;
            const btnX = (this.width - btnW) / 2;
            const btnY = this.height * 0.62;
            if (px >= btnX && px <= btnX + btnW && py >= btnY && py <= btnY + btnH) {
              this.synth.playTap();
              this.startNewGame();
            }
            return;
          }

          // ONLY ACCEPT TOUCH IF INSIDE THE BOARD & SPAWN PLAY AREA
          const inPlayZone = (px >= this.boardX - 8 && px <= this.boardX + this.boardW + 8 &&
                              py >= this.spawnY - 20 && py <= this.boardY + this.boardH + 10);

          if (this.state === 'AIMING' && inPlayZone) {
            this.isPointerDown = true;
            this.validTouchStarted = true;
            this.trackFingerPosition(px);
          }
        };

        const handleMove = (e) => {
          if (!this.isPointerDown || !this.validTouchStarted || this.state !== 'AIMING') return;
          e.preventDefault();
          const { px } = getPos(e);
          this.trackFingerPosition(px);
        };

        const handleUp = (e) => {
          if (!this.isPointerDown) return;
          this.isPointerDown = false;

          if (this.validTouchStarted && this.state === 'AIMING') {
            this.validTouchStarted = false;
            this.dropAtCurrentPosition();
          } else {
            this.validTouchStarted = false;
          }
        };

        this.canvas.addEventListener('pointerdown', handleDown);
        window.addEventListener('pointermove', handleMove);
        window.addEventListener('pointerup', handleUp);
        window.addEventListener('pointercancel', handleUp);
      }

      handleModeModalClick(px, py) {
        const cardW = Math.min(320, this.width - 36);
        const cardH = 340;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        if (px >= cardX + cardW - 44 && px <= cardX + cardW - 10 && py >= cardY + 10 && py <= cardY + 44) {
          this.synth.playTap();
          this.state = 'AIMING';
          return;
        }

        const optH = 70;
        const startY = cardY + 70;

        for (let i = 0; i < MODES.length; i++) {
          const m = MODES[i];
          const optY = startY + i * (optH + 12);
          if (px >= cardX + 16 && px <= cardX + cardW - 16 && py >= optY && py <= optY + optH) {
            this.synth.playTap();
            this.modeId = m.id;
            this.startNewGame();
            return;
          }
        }

        if (px < cardX || px > cardX + cardW || py < cardY || py > cardY + cardH) {
          this.state = 'AIMING';
        }
      }

      trackFingerPosition(px) {
        const minX = this.boardX + this.colWidth / 2;
        const maxX = this.boardX + this.boardW - this.colWidth / 2;
        this.currentPieceX = Math.max(minX, Math.min(maxX, px));

        const col = Math.floor((this.currentPieceX - this.boardX) / this.colWidth);
        this.targetCol = Math.max(0, Math.min(this.cols - 1, col));
      }

      dropAtCurrentPosition() {
        if (this.state !== 'AIMING') return;

        const col = this.targetCol;
        if (this.columns[col].length >= this.maxRows) {
          this.toast = { text: 'Column Full!', t: 1.0 };
          return;
        }

        this.saveHistoryState();
        this.state = 'FALLING';
        this.synth.playDrop();
        this.haptic(10);

        const startX = this.boardX + col * this.colWidth + this.colWidth / 2;
        const startY = this.spawnY + this.colWidth / 2;
        const stackHeight = this.columns[col].length;
        const targetRow = stackHeight;
        const targetY = this.boardY + (this.maxRows - 1 - targetRow) * this.colWidth + this.colWidth / 2;

        this.fallingPiece = {
          col: col,
          val: this.currentVal,
          x: startX,
          y: startY,
          targetY: targetY,
          targetRow: targetRow,
          vy: 280
        };
      }

      resolveLanding() {
        if (!this.fallingPiece) return;

        const p = this.fallingPiece;
        const col = p.col;
        const val = p.val;
        this.fallingPiece = null;

        this.synth.playLand();
        this.haptic(15);

        this.columns[col].push({
          val: val,
          highlight: 1.0,
          scale: 1.0
        });

        const landedRow = this.columns[col].length - 1;
        this.state = 'MERGING';
        this.checkAndExecuteMultiMerges(col, landedRow);
      }

      // SLIDE-UNDER-THE-BOX ABSORPTION ANIMATION
      checkAndExecuteMultiMerges(priorityCol = null, priorityRow = null) {
        let bestGroup = null;

        const findConnected = (startC, startR) => {
          const targetVal = this.columns[startC][startR].val;
          const visited = new Set();
          const queue = [{ c: startC, r: startR }];
          visited.add(startC + ',' + startR);
          const group = [{ c: startC, r: startR }];

          while (queue.length > 0) {
            const { c, r } = queue.shift();
            const neighbors = [
              { c: c, r: r - 1 }, // Down
              { c: c - 1, r: r }, // Left
              { c: c + 1, r: r }, // Right
              { c: c, r: r + 1 }  // Up
            ];

            for (const n of neighbors) {
              if (n.c >= 0 && n.c < this.cols && n.r >= 0 && n.r < this.columns[n.c].length) {
                const key = n.c + ',' + n.r;
                if (!visited.has(key) && this.columns[n.c][n.r].val === targetVal) {
                  visited.add(key);
                  group.push(n);
                  queue.push(n);
                }
              }
            }
          }
          return group;
        };

        if (priorityCol !== null && priorityRow !== null && priorityRow < this.columns[priorityCol].length) {
          const g = findConnected(priorityCol, priorityRow);
          if (g.length >= 2) {
            bestGroup = { center: { c: priorityCol, r: priorityRow }, group: g };
          }
        }

        if (!bestGroup) {
          for (let c = 0; c < this.cols; c++) {
            for (let r = 0; r < this.columns[c].length; r++) {
              const g = findConnected(c, r);
              if (g.length >= 2) {
                bestGroup = { center: { c, r }, group: g };
                break;
              }
            }
            if (bestGroup) break;
          }
        }

        if (bestGroup) {
          const center = bestGroup.center;
          const group = bestGroup.group;
          const startVal = this.columns[center.c][center.r].val;
          const count = group.length;

          const newVal = startVal * Math.pow(2, count - 1);

          const targetBlock = this.columns[center.c][center.r];

          const targetX = this.boardX + center.c * this.colWidth + this.colWidth / 2;
          const targetY = this.boardY + (this.maxRows - 1 - center.r) * this.colWidth + this.colWidth / 2;

          // Queue source blocks to slide underneath the target block
          const toRemove = group.filter(pt => !(pt.c === center.c && pt.r === center.r));
          toRemove.sort((a, b) => b.r - a.r);

          for (const pt of toRemove) {
            const startX = this.boardX + pt.c * this.colWidth + this.colWidth / 2;
            const startY = this.boardY + (this.maxRows - 1 - pt.r) * this.colWidth + this.colWidth / 2;
            const val = this.columns[pt.c][pt.r].val;

            this.absorbingBlocks.push({
              val: val,
              x: startX,
              y: startY,
              targetX: targetX,
              targetY: targetY,
              progress: 0,
              duration: 0.32
            });

            this.columns[pt.c].splice(pt.r, 1);
          }

          // After sliding under, pop destination block with shockwave
          setTimeout(() => {
            targetBlock.val = newVal;
            targetBlock.scale = 1.48;
            targetBlock.highlight = 1.0;
            this.triggerMergeEffects(center.c, center.r, newVal);
          }, 320);

          // Graceful slow delay for cascade progression
          setTimeout(() => {
            this.checkAndExecuteMultiMerges(center.c, center.r);
          }, 540);
        } else {
          this.finalizeTurn();
        }
      }

      triggerMergeEffects(col, row, newVal) {
        this.score += newVal;
        if (this.score > this.allTimeBest) {
          this.allTimeBest = this.score;
          this.saveBestScore();
        }

        this.synth.playMerge(newVal);
        this.haptic(25);

        const cx = this.boardX + col * this.colWidth + this.colWidth / 2;
        const cy = this.boardY + (this.maxRows - 1 - row) * this.colWidth + this.colWidth / 2;
        const pal = TILE_PALETTE[newVal] || TILE_PALETTE[2];

        this.shockwaves.push({
          x: cx,
          y: cy,
          radius: this.tileSize * 0.35,
          maxRadius: this.tileSize * 1.45,
          color: pal.bg,
          alpha: 1.0
        });

        for (let i = 0; i < 10; i++) {
          const angle = (Math.PI * 2 * i) / 10 + Math.random() * 0.3;
          const speed = 40 + Math.random() * 50;
          this.sparkles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            color: pal.topBg || pal.bg,
            size: 4 + Math.random() * 3,
            alpha: 1.0,
            life: 0.45
          });
        }

        this.floatingScores.push({
          x: cx,
          y: cy - 14,
          text: '+' + newVal.toLocaleString(),
          alpha: 1.0
        });

        Host.post('onScoreUpdated', { score: this.score, earned: newVal });
      }

      finalizeTurn() {
        this.currentVal = this.nextVal;
        this.nextVal = this.generateWeightedValue();
        this.resetPieceToCenter();
        this.state = 'AIMING';

        let isFull = true;
        for (let c = 0; c < this.cols; c++) {
          if (this.columns[c].length < this.maxRows) {
            isFull = false;
            break;
          }
        }

        if (isFull) {
          this.state = 'GAME_OVER';
          this.synth.playGameOver();
          Host.post('onGameOver', { score: this.score, best: this.allTimeBest });
        }
      }

      haptic(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      loop(timestamp) {
        const dt = Math.min(0.1, (timestamp - (this.lastTime || timestamp)) / 1000);
        this.lastTime = timestamp;

        if (this.state === 'FALLING' && this.fallingPiece) {
          const p = this.fallingPiece;
          p.vy += 1050 * dt;
          p.y += p.vy * dt;

          if (p.y >= p.targetY) {
            p.y = p.targetY;
            this.resolveLanding();
          }
        }

        // Animate Absorbing Blocks sliding under destination block
        for (let i = this.absorbingBlocks.length - 1; i >= 0; i--) {
          const ab = this.absorbingBlocks[i];
          ab.progress += dt / ab.duration;
          const t = Math.min(1.0, ab.progress);
          const ease = t * t * (3 - 2 * t); // smooth smoothstep

          ab.currX = ab.x + (ab.targetX - ab.x) * ease;
          ab.currY = ab.y + (ab.targetY - ab.y) * ease;
          ab.scale = 1.0 - 0.70 * ease;
          ab.alpha = 1.0 - 0.85 * ease;

          if (ab.progress >= 1.0) {
            this.absorbingBlocks.splice(i, 1);
          }
        }

        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.radius += (sw.maxRadius - sw.radius) * 6 * dt;
          sw.alpha -= dt * 2.2;
          if (sw.alpha <= 0) this.shockwaves.splice(i, 1);
        }

        for (let i = this.sparkles.length - 1; i >= 0; i--) {
          const spk = this.sparkles[i];
          spk.x += spk.vx * dt;
          spk.y += spk.vy * dt;
          spk.alpha -= dt * 2.2;
          if (spk.alpha <= 0) this.sparkles.splice(i, 1);
        }

        for (let c = 0; c < this.cols; c++) {
          for (let r = 0; r < this.columns[c].length; r++) {
            const b = this.columns[c][r];
            if (b.scale > 1.0) {
              b.scale -= (b.scale - 1.0) * 4.5 * dt;
              if (b.scale < 1.01) b.scale = 1.0;
            }
            if (b.highlight > 0) {
              b.highlight = Math.max(0, b.highlight - dt * 2.0);
            }
          }
        }

        for (let i = this.floatingScores.length - 1; i >= 0; i--) {
          const fs = this.floatingScores[i];
          fs.y -= 35 * dt;
          fs.alpha -= dt * 0.9;
          if (fs.alpha <= 0) this.floatingScores.splice(i, 1);
        }

        if (this.toast) {
          this.toast.t -= dt;
          if (this.toast.t <= 0) this.toast = null;
        }

        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      // --- RENDERING PIPELINE ---
      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        ctx.fillStyle = THEME.bg;
        ctx.fillRect(0, 0, this.width, this.height);

        this.renderHeader(ctx);
        this.renderSubHUD(ctx);
        this.renderBoardContainer(ctx);
        this.renderRadiantLightBeam(ctx);
        this.renderBlocks(ctx);
        this.renderMergeEffects(ctx);
        this.renderOverlays(ctx);

        if (this.toast) this.renderToast(ctx);
        if (this.state === 'MODE_SELECT') this.renderModeDialog(ctx);
        if (this.state === 'GAME_OVER') this.renderGameOverModal(ctx);

        ctx.restore();
      }

      renderHeader(ctx) {
        const y = this.headerY;

        // Mode & Live Score Pill
        const modePillW = 112;
        const modePillX = (this.width / 2) - modePillW - 8;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(modePillX, y, modePillW, 42, 10);
        ctx.fillStyle = THEME.pillBg;
        ctx.fill();
        ctx.strokeStyle = THEME.pillBorder;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 10.5px Fredoka, sans-serif';
        ctx.fillStyle = THEME.textMuted;
        ctx.textAlign = 'center';
        ctx.fillText(this.mode.label, modePillX + modePillW / 2, y + 14);

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.score.toLocaleString(), modePillX + modePillW / 2, y + 32);
        ctx.restore();

        // All Time High Score Pill
        const bestPillW = 112;
        const bestPillX = (this.width / 2) + 8;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(bestPillX, y, bestPillW, 42, 10);
        ctx.fillStyle = THEME.pillBg;
        ctx.fill();
        ctx.strokeStyle = THEME.pillBorder;
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 10px Fredoka, sans-serif';
        ctx.fillStyle = THEME.accentCrown;
        ctx.textAlign = 'center';
        ctx.fillText('👑 ALL TIME', bestPillX + bestPillW / 2, y + 14);

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = THEME.accentCrown;
        ctx.fillText(this.allTimeBest.toLocaleString(), bestPillX + bestPillW / 2, y + 32);
        ctx.restore();

        // Restart Button (↺)
        const restartX = this.width - 36;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(restartX, y + 20, 20, 0, Math.PI * 2);
        ctx.fillStyle = THEME.btnBg;
        ctx.fill();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = THEME.btnIcon;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↺', restartX, y + 20);
        ctx.restore();
      }

      renderSubHUD(ctx) {
        const y = this.subHudY;

        // Undo Button (Left)
        const undoX = 36;
        const undoY = y + 18;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(undoX, undoY, 22, 0, Math.PI * 2);
        ctx.fillStyle = THEME.undoBg;
        ctx.fill();

        ctx.font = '900 18px sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↶', undoX, undoY - 1);

        ctx.beginPath();
        ctx.arc(undoX + 15, undoY - 15, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.font = '900 10.5px Inter, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText(this.undoCharges.toString(), undoX + 15, undoY - 15);
        ctx.restore();
      }

      // DYNAMIC TOP GLOW MATCHING ACTIVE CENTER PIECE COLOR
      renderBoardContainer(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const bw = this.boardW;
        const bh = this.boardH;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.roundRect(bx, by, bw, bh, 14);
        ctx.fillStyle = THEME.boardBg;
        ctx.fill();
        ctx.strokeStyle = THEME.boardBorder;
        ctx.lineWidth = 3.0;
        ctx.stroke();
        ctx.restore();

        ctx.save();
        ctx.strokeStyle = THEME.colLine;
        ctx.lineWidth = 1.2;
        for (let c = 1; c < this.cols; c++) {
          const lx = bx + c * this.colWidth;
          ctx.beginPath();
          ctx.moveTo(lx, by + 4);
          ctx.lineTo(lx, by + bh - 4);
          ctx.stroke();
        }

        // Dynamic downward glow matching the active piece's color!
        const activePal = TILE_PALETTE[this.currentVal] || TILE_PALETTE[2];
        const dangerH = this.colWidth * 1.5;
        const dangerGrad = ctx.createLinearGradient(0, by, 0, by + dangerH);
        dangerGrad.addColorStop(0, activePal.glow + '44');
        dangerGrad.addColorStop(1, activePal.glow + '00');
        ctx.fillStyle = dangerGrad;
        ctx.beginPath();
        ctx.roundRect(bx + 2, by + 2, bw - 4, dangerH, [12, 12, 0, 0]);
        ctx.fill();

        ctx.restore();
      }

      // PURE RADIANT LIGHT BEAM (Zero particle specks)
      renderRadiantLightBeam(ctx) {
        if (this.state === 'FALLING' && this.fallingPiece) {
          const p = this.fallingPiece;
          const pal = TILE_PALETTE[p.val] || TILE_PALETTE[2];
          const beamLen = Math.min(140, p.y - this.boardY + 20);

          ctx.save();
          const glowGrad = ctx.createLinearGradient(0, p.y, 0, p.y - beamLen);
          glowGrad.addColorStop(0, pal.glow + '99');
          glowGrad.addColorStop(0.5, pal.glow + '35');
          glowGrad.addColorStop(1, pal.glow + '00');

          ctx.fillStyle = glowGrad;
          ctx.fillRect(p.x - this.tileSize * 0.42, p.y - beamLen, this.tileSize * 0.84, beamLen);

          const coreGrad = ctx.createLinearGradient(0, p.y, 0, p.y - beamLen * 0.75);
          coreGrad.addColorStop(0, '#FFFFFF');
          coreGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

          ctx.strokeStyle = coreGrad;
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y - beamLen * 0.75);
          ctx.stroke();
          ctx.restore();
        }
      }

      renderBlocks(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const cs = this.colWidth;
        const ts = this.tileSize;

        // 1. ABSORBING SOURCE BLOCKS (Rendered UNDER the destination block)
        for (const ab of this.absorbingBlocks) {
          const pal = TILE_PALETTE[ab.val] || TILE_PALETTE[2];
          ctx.save();
          ctx.globalAlpha = ab.alpha;
          this.drawTile(ctx, ab.currX, ab.currY, ts, ab.val, pal, 0.0, ab.scale);
          ctx.restore();
        }

        // 2. Settled Stacked Blocks
        for (let c = 0; c < this.cols; c++) {
          const col = this.columns[c];
          for (let r = 0; r < col.length; r++) {
            const block = col[r];
            const pal = TILE_PALETTE[block.val] || TILE_PALETTE[2];

            const cx = bx + c * cs + cs / 2;
            const cy = by + (this.maxRows - 1 - r) * cs + cs / 2;

            this.drawTile(ctx, cx, cy, ts, block.val, pal, block.highlight, block.scale || 1.0);
          }
        }

        // 3. Active Falling Block
        if (this.state === 'FALLING' && this.fallingPiece) {
          const p = this.fallingPiece;
          const pal = TILE_PALETTE[p.val] || TILE_PALETTE[2];
          this.drawTile(ctx, p.x, p.y, ts, p.val, pal, 0.4, 1.0);
        }

        // 4. NEXT UPCOMING BLOCK (Positioned to TOP-RIGHT with spacious gap)
        const centerSpawnX = bx + 2 * cs + cs / 2;
        const centerSpawnY = this.spawnY + cs / 2;
        const nextPal = TILE_PALETTE[this.nextVal] || TILE_PALETTE[2];

        // Spacious gap separating center block from diagonal preview
        const diagNextX = centerSpawnX + cs * 1.08;
        const diagNextY = centerSpawnY - cs * 0.32;

        ctx.save();
        ctx.globalAlpha = 0.95;
        this.drawTile(ctx, diagNextX, diagNextY, ts, this.nextVal, nextPal, 0.0, 0.78);
        ctx.restore();

        // 5. CURRENT ACTIVE PIECE (Center Spawn Area)
        if (this.state === 'AIMING') {
          const cx = this.currentPieceX;
          const cy = centerSpawnY;
          const pal = TILE_PALETTE[this.currentVal] || TILE_PALETTE[2];
          this.drawTile(ctx, cx, cy, ts, this.currentVal, pal, 0.0, 1.0);
        }
      }

      drawTile(ctx, cx, cy, ts, val, pal, highlight = 0, scale = 1.0) {
        ctx.save();
        ctx.translate(cx, cy);
        if (scale !== 1.0) {
          ctx.scale(scale, scale);
        }

        const x0 = -ts / 2;
        const y0 = -ts / 2;

        ctx.shadowColor = 'rgba(0, 0, 0, 0.28)';
        ctx.shadowBlur = 6;
        ctx.shadowOffsetY = 3;

        ctx.beginPath();
        ctx.roundRect(x0, y0, ts, ts, 8);
        ctx.fillStyle = pal.bg;
        ctx.fill();

        ctx.shadowColor = 'transparent';

        ctx.beginPath();
        ctx.roundRect(x0 + 2, y0 + 2, ts - 4, ts * 0.40, [6, 6, 2, 2]);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(x0, y0 + ts - 4, ts, 4, [0, 0, 8, 8]);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
        ctx.fill();

        ctx.beginPath();
        ctx.roundRect(x0, y0, ts, ts, 8);
        if (highlight > 0 || pal.isNeon) {
          ctx.strokeStyle = '#FFFFFF';
          ctx.lineWidth = highlight > 0 ? 3.0 : 2.0;
        } else {
          ctx.strokeStyle = pal.border;
          ctx.lineWidth = 1.2;
        }
        ctx.stroke();

        const fontSize = val >= 1000 ? Math.floor(ts * 0.32) : Math.floor(ts * 0.46);
        ctx.font = '900 ' + fontSize + 'px Fredoka, sans-serif';
        ctx.fillStyle = pal.text;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(val.toString(), 0, 1);

        ctx.restore();
      }

      renderMergeEffects(ctx) {
        for (const sw of this.shockwaves) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.strokeStyle = sw.color;
          ctx.globalAlpha = sw.alpha;
          ctx.lineWidth = 3.5;
          ctx.shadowColor = sw.color;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.restore();
        }

        for (const spk of this.sparkles) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
          ctx.fillStyle = spk.color;
          ctx.globalAlpha = spk.alpha;
          ctx.shadowColor = '#FFFFFF';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.restore();
        }
      }

      renderOverlays(ctx) {
        for (const fs of this.floatingScores) {
          ctx.save();
          ctx.font = '900 22px Fredoka, sans-serif';
          ctx.fillStyle = '#FACC15';
          ctx.globalAlpha = fs.alpha;
          ctx.textAlign = 'center';
          ctx.fillText(fs.text, fs.x, fs.y);
          ctx.restore();
        }
      }

      renderToast(ctx) {
        const t = this.toast;
        if (!t) return;
        const tw = Math.min(260, this.width - 40);
        const tx = (this.width - tw) / 2;
        const ty = this.boardY - 45;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, 36, 18);
        ctx.fillStyle = '#172733';
        ctx.fill();
        ctx.strokeStyle = '#38BDF8';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        ctx.font = '800 13px Inter, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.text, tx + tw / 2, ty + 18);
        ctx.restore();
      }

      renderModeDialog(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(320, this.width - 36);
        const cardH = 340;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 32;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#1A2936';
        ctx.fill();
        ctx.strokeStyle = '#2D4457';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = '900 18px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT GRID MODE', this.width / 2, cardY + 38);

        ctx.font = '800 18px sans-serif';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('✕', cardX + cardW - 26, cardY + 38);

        const optH = 70;
        const startY = cardY + 70;

        for (let i = 0; i < MODES.length; i++) {
          const m = MODES[i];
          const optY = startY + i * (optH + 12);
          const isSelected = (this.modeId === m.id);

          ctx.beginPath();
          ctx.roundRect(cardX + 16, optY, cardW - 32, optH, 16);
          ctx.fillStyle = isSelected ? '#121D27' : '#1F3140';
          ctx.fill();
          ctx.strokeStyle = isSelected ? '#38BDF8' : '#2D4457';
          ctx.lineWidth = isSelected ? 2.0 : 1.2;
          ctx.stroke();

          ctx.font = '900 15px Fredoka, sans-serif';
          ctx.fillStyle = isSelected ? '#38BDF8' : '#FFFFFF';
          ctx.textAlign = 'left';
          ctx.fillText(m.label, cardX + 32, optY + 26);

          ctx.font = '600 12px Inter, sans-serif';
          ctx.fillStyle = '#94A3B8';
          ctx.fillText(m.subtitle, cardX + 32, optY + 48);

          if (isSelected) {
            ctx.font = '900 16px sans-serif';
            ctx.fillStyle = '#38BDF8';
            ctx.textAlign = 'right';
            ctx.fillText('✓', cardX + cardW - 32, optY + optH / 2);
          }
        }
        ctx.restore();
      }

      renderGameOverModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(320, this.width - 36);
        const cardH = 310;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 32;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#1A2936';
        ctx.fill();
        ctx.strokeStyle = '#EF4444';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.font = '900 24px Fredoka, sans-serif';
        ctx.fillStyle = '#EF4444';
        ctx.textAlign = 'center';
        ctx.fillText('BOARD IS FULL!', this.width / 2, cardY + 48);

        ctx.font = '700 14px Inter, sans-serif';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('FINAL SCORE', this.width / 2, cardY + 86);

        ctx.font = '900 32px Fredoka, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText(this.score.toLocaleString(), this.width / 2, cardY + 124);

        ctx.font = '700 13px Inter, sans-serif';
        ctx.fillStyle = '#2DD4BF';
        ctx.fillText('👑 All-Time Best: ' + this.allTimeBest.toLocaleString(), this.width / 2, cardY + 160);

        const btnW = 200, btnH = 48;
        const btnX = (this.width - btnW) / 2;
        const btnY = this.height * 0.62;

        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 24);
        ctx.fillStyle = '#38BDF8';
        ctx.fill();

        ctx.font = '900 16px Fredoka, sans-serif';
        ctx.fillStyle = '#000000';
        ctx.fillText('PLAY AGAIN 🔄', this.width / 2, btnY + 24);
        ctx.restore();
      }
    }

    function initGame() {
      const canvas = document.getElementById('gameCanvas');
      if (canvas && !window.game) {
        window.game = new NumberDropGame(canvas);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
