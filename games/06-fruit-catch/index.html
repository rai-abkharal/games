<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Fruit Catch</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#090d1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0f172a}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;c.style.width='min(100vw,56.25vh)';c.style.height='min(177.78vw,100vh)';
document.getElementById('game-container').appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

const FRUITS=[
  {name:'Apple',emoji:'🍎',color:'#ef4444',pts:10},
  {name:'Banana',emoji:'🍌',color:'#fbbf24',pts:15},
  {name:'Orange',emoji:'🍊',color:'#f97316',pts:20},
  {name:'Melon',emoji:'🍉',color:'#22c55e',pts:25}
];

let score=0,lives=3,combo=0,best=+localStorage.getItem('fruit-catch-best')||0;
let over=false,started=false,last=performance.now(),shake=0;
let basket={x:W/2,y:H-60,w:80,h:24,targetX:W/2};
let items=[],particles=[],popups=[],spawnTimer=0,speed=260;
let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,dur=0.06,type='sine',vol=0.04){
  try{
    const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
    if(A.state==='suspended')A.resume();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
    o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
  }catch(e){}
}

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,r:2+Math.random()*3,color});
  }
}

function spawnItem(){
  const isBomb=Math.random()<0.2;
  if(isBomb){
    items.push({x:30+Math.random()*(W-60),y:-30,r:18,isBomb:true,color:'#64748b',vy:speed*1.1});
  }else{
    const fruit=FRUITS[Math.floor(Math.random()*FRUITS.length)];
    items.push({x:30+Math.random()*(W-60),y:-30,r:18,isBomb:false,...fruit,vy:speed});
  }
}

function reset(){
  score=0;lives=3;combo=0;over=false;started=true;
  items=[];particles=[];popups=[];spawnTimer=0;speed=260;
  basket={x:W/2,y:H-60,w:80,h:24,targetX:W/2};
  last=performance.now();shake=0;
  bridge('gameStarted');
}

function endGame(){
  if(over)return;
  over=true;shake=0.35;
  sound(140,0.3,'sawtooth',0.08);
  bridge('haptic','error');
  if(score>best){best=score;localStorage.setItem('fruit-catch-best',best);}
  bridge('sendGameOver',score,1,30);
}

function updateTouch(e){
  const r=c.getBoundingClientRect();
  const clX=e.touches?e.touches[0].clientX:e.clientX;
  basket.targetX=Math.max(basket.w/2,Math.min(W-basket.w/2,(clX-r.left)*(W/r.width)));
}

c.addEventListener('touchstart',e=>{
  if(!started||over){reset();return;}
  updateTouch(e);
},{passive:true});
c.addEventListener('touchmove',updateTouch,{passive:true});
c.addEventListener('pointerdown',e=>{
  if(!started||over){reset();return;}
  updateTouch(e);
},{passive:false});
c.addEventListener('pointermove',e=>{if(started&&!over)updateTouch(e);},{passive:false});

function frame(t){
  if(isPaused||window.__GAME_PAUSED__)return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);shake-=dt;}

  // Background
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);

  if(started&&!over){
    speed+=dt*4;
    spawnTimer+=dt;
    if(spawnTimer>=Math.max(0.45,0.9-speed*0.001)){
      spawnTimer=0;
      spawnItem();
    }
  }

  // Smooth Basket Move
  basket.x+=(basket.targetX-basket.x)*0.25;

  // Update & Draw Items
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    if(started&&!over)it.y+=it.vy*dt;
    if(it.y>H+30){
      if(!it.isBomb&&started&&!over){
        combo=0;
      }
      items.splice(i,1);
      continue;
    }

    if(it.isBomb){
      ctx.fillStyle='#334155';ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ef4444';ctx.fillRect(it.x-3,it.y-it.r-6,6,6);
    }else{
      ctx.fillStyle=it.color;ctx.beginPath();ctx.arc(it.x,it.y,it.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(it.x-4,it.y-4,it.r*0.35,0,Math.PI*2);ctx.fill();
    }

    // Catch Collision Check
    if(!over&&Math.abs(it.x-basket.x)<basket.w/2+it.r&&Math.abs(it.y-basket.y)<basket.h/2+it.r){
      if(it.isBomb){
        lives--;
        shake=0.3;
        burst(it.x,it.y,20,'#ef4444');
        sound(160,0.25,'sawtooth',0.08);
        bridge('haptic','medium');
        items.splice(i,1);
        if(lives<=0)endGame();
      }else{
        combo++;
        const pts=it.pts+(combo>=4?10:0);
        score+=pts;
        bridge('sendScoreUpdated',score,1);
        bridge('haptic','light');
        sound(520+combo*35,0.06,'triangle',0.05);
        burst(it.x,it.y,12,it.color);
        popups.push({x:it.x,y:it.y,text:`+${pts}`,color:it.color,life:0.45,max:0.45});
        items.splice(i,1);
      }
    }
  }

  // Draw Basket
  ctx.fillStyle='#78350f';ctx.fillRect(basket.x-basket.w/2,basket.y-basket.h/2,basket.w,basket.h);
  ctx.fillStyle='#b45309';ctx.fillRect(basket.x-basket.w/2+4,basket.y-basket.h/2+4,basket.w-8,basket.h-8);
  ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.strokeRect(basket.x-basket.w/2,basket.y-basket.h/2,basket.w,basket.h);

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Popups
  for(let i=popups.length-1;i>=0;i--){
    const pp=popups[i];pp.life-=dt;pp.y-=30*dt;
    if(pp.life<=0){popups.splice(i,1);continue;}
    ctx.globalAlpha=pp.life/pp.max;ctx.fillStyle=pp.color;
    ctx.font='bold 18px sans-serif';ctx.textAlign='center';
    ctx.fillText(pp.text,pp.x,pp.y);
  }
  ctx.globalAlpha=1;

  // HUD
  ctx.fillStyle='#ffffff';ctx.font='bold 22px sans-serif';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,20,40);
  ctx.textAlign='right';ctx.fillStyle='#ef4444';
  let hearts='';for(let h=0;h<lives;h++)hearts+='♥ ';
  ctx.fillText(hearts,W-20,40);

  // Start Screen
  if(!started&&!over){
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 32px sans-serif';
    ctx.fillText('FRUIT CATCH',W/2,H*0.36);
    ctx.fillStyle='#38bdf8';ctx.font='bold 14px sans-serif';
    ctx.fillText('FRUIT BASKET CATCHER',W/2,H*0.36+30);
    ctx.fillStyle='#94a3b8';ctx.font='13px sans-serif';
    ctx.fillText('Drag the basket to catch fruits and dodge bombs!',W/2,H*0.52);
    ctx.fillStyle='#0284c7';ctx.fillRect(W/2-90,H*0.62,180,48);
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';
    ctx.fillText('TAP TO PLAY',W/2,H*0.62+30);
  }

  // Game Over
  if(over){
    ctx.fillStyle='rgba(15,23,42,0.88)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1e293b';ctx.fillRect(35,H/2-130,290,260);
    ctx.strokeStyle='#ef4444';ctx.lineWidth=2;ctx.strokeRect(35,H/2-130,290,260);
    ctx.textAlign='center';ctx.fillStyle='#ef4444';ctx.font='bold 26px sans-serif';
    ctx.fillText('OUT OF LIVES',W/2,H/2-70);
    ctx.fillStyle='#ffffff';ctx.font='bold 48px sans-serif';
    ctx.fillText(score,W/2,H/2-10);
    ctx.fillStyle='#94a3b8';ctx.font='14px sans-serif';
    ctx.fillText(`BEST SCORE: ${best}`,W/2,H/2+38);
    ctx.fillStyle='#0284c7';ctx.fillRect(W/2-85,H/2+62,170,44);
    ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';
    ctx.fillText('PLAY AGAIN',W/2,H/2+89);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
