      height: 100%;

    // 3. AUDIO SYNTHESIZER (Crisp Marble Wall Clacks, Roll Whirrs, Fanfares)
    class SoundSynth {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playRoll() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360, t);
        osc.frequency.exponentialRampToValueAtTime(240, t + 0.10);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.11);
      }

      playPaintTile() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(540 + Math.random() * 80, t);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.06);
      }

      // Crisp, Tactile Marble-Wall Clack Impact
      playImpact() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;

        // 1. Wooden/Marble Body Clack
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(320, t);
        osc1.frequency.exponentialRampToValueAtTime(70, t + 0.08);
        gain1.gain.setValueAtTime(0.35, t);
        gain1.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc1.start(t);
        osc1.stop(t + 0.09);

        // 2. High Ceramic Snap Transient
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880, t);
        osc2.frequency.exponentialRampToValueAtTime(200, t + 0.04);
        gain2.gain.setValueAtTime(0.20, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc2.connect(gain2);
        gain2.connect(this.ctx.destination);
        osc2.start(t);
        osc2.stop(t + 0.05);
      }

      // Glorious Cascading AAA Victory Fanfare
      playWinFanfare() {
        if (this.muted || !this.ctx) return;
        this.init();
        const chord = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        chord.forEach((freq, i) => {
          const t = this.ctx.currentTime + i * 0.06;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = (i % 2 === 0) ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.22, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.50);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.52);
        });
      }

      playTap() {
        if (this.muted || !this.ctx) return;
        this.init();
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(580, t);
        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
      }
    }

    // 4. HOST PLATFORM BRIDGE
    const Host = {
      post(action, payload) {
        const body = payload || {};
        const msg = JSON.stringify({ action: action, payload: body });
        try {
          if (window.flutter_inappwebview && window.flutter_inappwebview.callHandler) {
            window.flutter_inappwebview.callHandler('GameBridgeChannel', msg);
          }
        } catch (e) {}
        try {
          if (window.FlutterGameBridge && window.FlutterGameBridge.postMessage) {
            window.FlutterGameBridge.postMessage(msg);
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ source: 'GameBridge', action: action, payload: body }, '*');
          }
        } catch (e) {}
      }
    };

    // 5. ACCURATE MULTI-STEP BFS HINT SOLVER
    class MazeSolver {
      static solveNextStep(grid, startR, startC, paintedMatrix) {
        const rows = grid.length;
        const cols = grid[0].length;
        const dirs = [
          { dr: -1, dc: 0, name: 'UP' },
          { dr: 1, dc: 0, name: 'DOWN' },
          { dr: 0, dc: -1, name: 'LEFT' },
          { dr: 0, dc: 1, name: 'RIGHT' }
        ];

        const queue = [];
        const visited = new Set();
        visited.add(startR + ',' + startC);

        for (const dir of dirs) {
          let currR = startR;
          let currC = startC;
          let foundUnpainted = false;
          let steps = 0;

          while (true) {
            const nextR = currR + dir.dr;
            const nextC = currC + dir.dc;
            if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols && grid[nextR][nextC] === 1) {
              currR = nextR;
              currC = nextC;
              steps++;
              if (!paintedMatrix[currR][currC]) {
                foundUnpainted = true;
              }
            } else {
              break;
            }
          }

          if (steps > 0) {
            if (foundUnpainted) {
              return dir;
            }
            const key = currR + ',' + currC;
            if (!visited.has(key)) {
              visited.add(key);
              queue.push({ r: currR, c: currC, firstDir: dir });
            }
          }
        }

        while (queue.length > 0) {
          const { r, c, firstDir } = queue.shift();

          for (const dir of dirs) {
            let currR = r;
            let currC = c;
            let foundUnpainted = false;
            let steps = 0;

            while (true) {
              const nextR = currR + dir.dr;
              const nextC = currC + dir.dc;
              if (nextR >= 0 && nextR < rows && nextC >= 0 && nextC < cols && grid[nextR][nextC] === 1) {
                currR = nextR;
                currC = nextC;
                steps++;
                if (!paintedMatrix[currR][currC]) {
                  foundUnpainted = true;
                }
              } else {
                break;
              }
            }

            if (steps > 0) {
              if (foundUnpainted) {
                return firstDir;
              }
              const key = currR + ',' + currC;
              if (!visited.has(key)) {
                visited.add(key);
                queue.push({ r: currR, c: currC, firstDir });
              }
            }
          }
        }

        return null;
      }
    }

    // 6. MAIN COLOR MAZE PAINT GAME CONTROLLER
    class ColorMazeGame {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.synth = new SoundSynth();

        this.difficulty = this.loadDifficulty();
        this.levelIndex = this.loadLevelIndex(this.difficulty);
        this.hints = 1;

        this.state = 'IDLE'; // 'IDLE', 'MOVING', 'VICTORY_MODAL', 'MODE_SELECT'
        this.toast = null;

        // Level Stats
        this.levelSwipes = 0;
        this.levelStartTime = performance.now();
        this.levelDurationSec = 0;

        // 3D Marble Ball with Sleek Radius & Dynamic Squash & Stretch
        this.ball = {
          r: 0,
          c: 0,
          x: 0,
          y: 0,
          targetX: 0,
          targetY: 0,
          targetR: 0,
          targetC: 0,
          radius: 15,
          speed: 880,
          scaleX: 1.0,
          scaleY: 1.0
        };

        this.grid = [];
        this.painted = [];
        this.totalPlayableTiles = 0;
        this.paintedCount = 0;
        this.colorObj = LEVEL_COLORS[0];

        this.splats = [];
        this.stars = [];
        this.confetti = [];
        this.victoryAnimT = 0;
        this.rippleRadius = 0;
        this.hintArrow = null;

        this.initLayout();
        this.bindEvents();
        this.loadLevel(this.levelIndex);

        requestAnimationFrame((t) => this.loop(t));
      }

      loadDifficulty() {
        try {
          const d = localStorage.getItem('cmp_difficulty');
          return d || 'easy';
        } catch (e) {
          return 'easy';
        }
      }

      saveDifficulty(diff) {
        this.difficulty = diff;
        try {
          localStorage.setItem('cmp_difficulty', diff);
        } catch (e) {}
      }

      loadLevelIndex(diff) {
        try {
          const v = localStorage.getItem('cmp_lvl_' + diff);
          return v !== null ? (parseInt(v) || 0) : 0;
        } catch (e) {
          return 0;
        }
      }

      saveLevelIndex() {
        try {
          localStorage.setItem('cmp_lvl_' + this.difficulty, this.levelIndex.toString());
        } catch (e) {}
      }

      loadLevel(idx) {
        this.levelIndex = idx;
        this.saveLevelIndex();

        const pack = LEVEL_PACKS[this.difficulty] || LEVEL_PACKS.easy;
        const lvlData = pack[this.levelIndex % pack.length];

        this.rows = lvlData.grid.length;
        this.cols = lvlData.grid[0].length;

        this.grid = Array(this.rows).fill(null).map(() => Array(this.cols).fill(0));
        this.painted = Array(this.rows).fill(null).map(() => Array(this.cols).fill(false));
        this.totalPlayableTiles = 0;

        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (lvlData.grid[r][c] === 1) {
              this.grid[r][c] = 1;
              this.totalPlayableTiles++;
            }
          }
        }

        const startR = lvlData.startR !== undefined ? lvlData.startR : 0;
        const startC = lvlData.startC !== undefined ? lvlData.startC : 0;

        this.initialStartR = startR;
        this.initialStartC = startC;

        this.ball.r = startR;
        this.ball.c = startC;
        this.ball.targetR = startR;
        this.ball.targetC = startC;
        this.ball.scaleX = 1.0;
        this.ball.scaleY = 1.0;

        this.painted[startR][startC] = true;
        this.paintedCount = 1;

        this.colorObj = LEVEL_COLORS[(lvlData.colorIdx + this.levelIndex) % LEVEL_COLORS.length];

        this.splats = [];
        this.stars = [];
        this.confetti = [];
        this.victoryAnimT = 0;
        this.rippleRadius = 0;
        this.hintArrow = null;
        this.levelSwipes = 0;
        this.levelStartTime = performance.now();
        this.state = 'IDLE';

        this.initLayout();
        Host.post('onGameStarted', { level: this.levelIndex + 1, difficulty: this.difficulty });
      }

      restartCurrentLevel() {
        this.painted = Array(this.rows).fill(null).map(() => Array(this.cols).fill(false));
        this.ball.r = this.initialStartR;
        this.ball.c = this.initialStartC;
        this.ball.targetR = this.initialStartR;
        this.ball.targetC = this.initialStartC;
        this.ball.scaleX = 1.0;
        this.ball.scaleY = 1.0;
        this.painted[this.initialStartR][this.initialStartC] = true;
        this.paintedCount = 1;

        this.ball.x = this.boardX + this.ball.c * this.tileSize + this.tileSize / 2;
        this.ball.y = this.boardY + this.ball.r * this.tileSize + this.tileSize / 2;
        this.ball.targetX = this.ball.x;
        this.ball.targetY = this.ball.y;

        this.splats = [];
        this.stars = [];
        this.confetti = [];
        this.hintArrow = null;
        this.levelSwipes = 0;
        this.levelStartTime = performance.now();
        this.state = 'IDLE';
        this.synth.playTap();
      }

      initLayout() {
        const dpr = window.devicePixelRatio || 1;
        this.dpr = dpr;
        this.width = window.innerWidth || 360;
        this.height = window.innerHeight || 640;
        this.canvas.width = Math.round(this.width * dpr);
        this.canvas.height = Math.round(this.height * dpr);

        this.headerY = 48;

        const availW = Math.min(330, this.width - 48);
        const availH = Math.min(360, this.height - 230);

        this.tileSize = Math.floor(Math.min(availW / this.cols, availH / this.rows, 50));
        this.boardW = this.cols * this.tileSize;
        this.boardH = this.rows * this.tileSize;

        this.boardX = Math.round((this.width - this.boardW) / 2);
        this.boardY = Math.round((this.height - this.boardH) / 2 - 6);

        // Sleek Marble Ball Radius with Comfortable Breathing Room
        this.ball.radius = Math.floor(this.tileSize * 0.33);
        this.ball.x = this.boardX + this.ball.c * this.tileSize + this.tileSize / 2;
        this.ball.y = this.boardY + this.ball.r * this.tileSize + this.tileSize / 2;
        this.ball.targetX = this.ball.x;
        this.ball.targetY = this.ball.y;
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initLayout());

        const getPos = (e) => {
          const rect = this.canvas.getBoundingClientRect();
          let clientX = e.clientX;
          let clientY = e.clientY;

          if (clientX === undefined && e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else if (clientX === undefined && e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
          }

          if (clientX === undefined) {
            clientX = 0;
            clientY = 0;
          }

          return { px: clientX - rect.left, py: clientY - rect.top };
        };

        const handleDown = (e) => {
          if (e.preventDefault) e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
          this.synth.init();
          const { px, py } = getPos(e);

          if (this.state === 'MODE_SELECT') {
            this.handleModeModalClick(px, py);
            return;
          }

          if (this.state === 'VICTORY_MODAL') {
            this.handleVictoryModalClick(px, py);
            return;
          }

          // Generous Touch Target: Top Left Difficulty Pill (px: 0-140, py: 0-80)
          if (px >= 0 && px <= 140 && py >= 0 && py <= 80) {
            this.synth.playTap();
            this.state = 'MODE_SELECT';
            return;
          }

          // Generous Touch Target: Bottom-Left Hint Button (💡 1) (px: 0-85, py: height-95 to height)
          if (px >= 0 && px <= 85 && py >= this.height - 95) {
            this.useHint();
            return;
          }

          // Generous Touch Target: Bottom-Left Restart Button (↺) (px: 86-170, py: height-95 to height)
          if (px >= 86 && px <= 170 && py >= this.height - 95) {
            this.restartCurrentLevel();
            return;
          }

          this.touchStart = { px, py };
          this.lastDrag = { px, py };
        };

        const handleMove = (e) => {
          if (e.preventDefault) e.preventDefault();
          if (e.stopPropagation) e.stopPropagation();
          if (!this.touchStart) return;
          const { px, py } = getPos(e);
          const dx = px - this.lastDrag.px;
          const dy = py - this.lastDrag.py;
          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          const threshold = 14;

          if (absX >= threshold || absY >= threshold) {
            if (this.state === 'IDLE') {
              if (absX > absY) {
                if (dx > 0) this.tryRoll(0, 1);
                else this.tryRoll(0, -1);
              } else {
                if (dy > 0) this.tryRoll(1, 0);
                else this.tryRoll(-1, 0);
              }
              this.lastDrag = { px, py };
            }
          }
        };

        const handleUp = (e) => {
          if (e.preventDefault) e.preventDefault();
          if (!this.touchStart) return;
          const { px, py } = getPos(e);
          const dx = px - this.touchStart.px;
          const dy = py - this.touchStart.py;
          this.touchStart = null;
          this.lastDrag = null;

          const absX = Math.abs(dx);
          const absY = Math.abs(dy);
          const threshold = 12;

          if (this.state === 'IDLE' && (absX >= threshold || absY >= threshold)) {
            if (absX > absY) {
              if (dx > 0) this.tryRoll(0, 1);
              else this.tryRoll(0, -1);
            } else {
              if (dy > 0) this.tryRoll(1, 0);
              else this.tryRoll(-1, 0);
            }
          }
        };

        this.canvas.addEventListener('pointerdown', handleDown, { passive: false });
        window.addEventListener('pointermove', handleMove, { passive: false });
        window.addEventListener('pointerup', handleUp, { passive: false });
        window.addEventListener('pointercancel', handleUp, { passive: false });

        this.canvas.addEventListener('touchstart', handleDown, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', handleUp, { passive: false });
        window.addEventListener('touchcancel', handleUp, { passive: false });

        window.addEventListener('keydown', (e) => {
          if (this.state === 'VICTORY_MODAL' && (e.key === ' ' || e.key === 'Enter')) {
            this.loadLevel(this.levelIndex + 1);
            return;
          }
          if (this.state !== 'IDLE') return;
          if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') this.tryRoll(0, 1);
          else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') this.tryRoll(0, -1);
          else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') this.tryRoll(1, 0);
          else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') this.tryRoll(-1, 0);
          else if (e.key === 'r' || e.key === 'R') this.restartCurrentLevel();
        });
      }

      handleModeModalClick(px, py) {
        const cardW = Math.min(320, this.width - 36);
        const cardH = 320;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        if (px >= cardX + cardW - 46 && px <= cardX + cardW - 6 && py >= cardY + 6 && py <= cardY + 46) {
          this.synth.playTap();
          this.state = 'IDLE';
          return;
        }

        const modes = [
          { id: 'easy', label: 'EASY', desc: 'Casual & Relaxing', color: '#10B981' },
          { id: 'medium', label: 'MEDIUM', desc: 'Standard Challenge', color: '#F59E0B' },
          { id: 'hard', label: 'HARD', desc: 'Master Labyrinth', color: '#EF4444' }
        ];

        const optH = 68;
        const startY = cardY + 66;

        for (let i = 0; i < modes.length; i++) {
          const m = modes[i];
          const optY = startY + i * (optH + 10);
          if (px >= cardX + 16 && px <= cardX + cardW - 16 && py >= optY && py <= optY + optH) {
            this.synth.playTap();
            this.saveDifficulty(m.id);
            this.levelIndex = this.loadLevelIndex(m.id);
            this.loadLevel(this.levelIndex);
            return;
          }
        }

        if (px < cardX || px > cardX + cardW || py < cardY || py > cardY + cardH) {
          this.state = 'IDLE';
        }
      }

      handleVictoryModalClick(px, py) {
        this.synth.playTap();
        this.loadLevel(this.levelIndex + 1);
      }

      useHint() {
        if (this.state !== 'IDLE') return;
        const step = MazeSolver.solveNextStep(this.grid, this.ball.r, this.ball.c, this.painted);
        if (step) {
          this.hintArrow = { ...step, timer: 2.2 };
          this.synth.playTap();
          this.haptic(15);
        }
      }

      tryRoll(dr, dc) {
        if (this.state !== 'IDLE') return;
        this.hintArrow = null;

        let currR = this.ball.r;
        let currC = this.ball.c;
        let steps = 0;

        while (true) {
          const nextR = currR + dr;
          const nextC = currC + dc;

          if (nextR >= 0 && nextR < this.rows && nextC >= 0 && nextC < this.cols && this.grid[nextR][nextC] === 1) {
            currR = nextR;
            currC = nextC;
            steps++;
          } else {
            break;
          }
        }

        if (steps > 0) {
          this.state = 'MOVING';
          this.levelSwipes++;
          this.startMoveR = this.ball.r;
          this.startMoveC = this.ball.c;
          this.ball.targetR = currR;
          this.ball.targetC = currC;
          this.ball.targetX = this.boardX + currC * this.tileSize + this.tileSize / 2;
          this.ball.targetY = this.boardY + currR * this.tileSize + this.tileSize / 2;

          if (dc !== 0) {
            this.ball.scaleX = 1.22;
            this.ball.scaleY = 0.82;
          } else {
            this.ball.scaleX = 0.82;
            this.ball.scaleY = 1.22;
          }

          this.synth.playRoll();
          this.haptic(10);
        }
      }

      paintLine(r1, c1, r2, c2) {
        const dr = Math.sign(r2 - r1);
        const dc = Math.sign(c2 - c1);
        let currR = r1;
        let currC = c1;

        while (true) {
          if (this.grid[currR][currC] === 1 && !this.painted[currR][currC]) {
            this.painted[currR][currC] = true;
            this.paintedCount++;
            this.synth.playPaintTile();
            this.spawnStarSparkle(this.boardX + currC * this.tileSize + this.tileSize / 2,
                                  this.boardY + currR * this.tileSize + this.tileSize / 2);
          }
          if (currR === r2 && currC === c2) break;
          currR += dr;
          currC += dc;
        }
      }

      spawnStarSparkle(x, y) {
        for (let i = 0; i < 3; i++) {
          this.stars.push({
            x: x + (Math.random() - 0.5) * this.tileSize * 0.5,
            y: y + (Math.random() - 0.5) * this.tileSize * 0.5,
            vx: (Math.random() - 0.5) * 40,
            vy: -20 - Math.random() * 40,
            size: 4 + Math.random() * 4,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 6,
            alpha: 1.0
          });
        }
      }

      onBallReachedDestination() {
        this.paintLine(this.startMoveR !== undefined ? this.startMoveR : this.ball.r,
                       this.startMoveC !== undefined ? this.startMoveC : this.ball.c,
                       this.ball.targetR, this.ball.targetC);

        this.ball.r = this.ball.targetR;
        this.ball.c = this.ball.targetC;
        this.ball.x = this.ball.targetX;
        this.ball.y = this.ball.targetY;
        this.state = 'IDLE';

        this.ball.scaleX = 1.0;
        this.ball.scaleY = 1.0;

        for (let i = 0; i < 6; i++) {
          this.splats.push({
            x: this.ball.x,
            y: this.ball.y,
            vx: (Math.random() - 0.5) * 80,
            vy: (Math.random() - 0.5) * 80,
            size: 2.0 + Math.random() * 2.5,
            alpha: 1.0
          });
        }

        // Play Satisfying Wall Impact Clack Sound & Haptic
        this.synth.playImpact();
        this.haptic(22);

        if (this.paintedCount >= this.totalPlayableTiles) {
          this.handleWin();
        }
      }

      handleWin() {
        this.state = 'VICTORY_MODAL';
        this.levelDurationSec = Math.max(1, Math.round((performance.now() - this.levelStartTime) / 1000));
        this.victoryAnimT = 0;
        this.rippleRadius = 0;
        this.synth.playWinFanfare();
        this.haptic(45);

        for (let i = 0; i < 60; i++) {
          this.confetti.push({
            x: this.width / 2,
            y: this.height / 2 - 40,
            vx: (Math.random() - 0.5) * 380,
            vy: -180 - Math.random() * 260,
            color: (i % 3 === 0) ? this.colorObj.hex : ((i % 3 === 1) ? '#FBBF24' : '#FFFFFF'),
            size: 5 + Math.random() * 6,
            alpha: 1.0,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 8
          });
        }

        Host.post('onLevelCompleted', { level: this.levelIndex + 1, difficulty: this.difficulty, swipes: this.levelSwipes });
      }

      haptic(ms) {
        try {
          if (navigator.vibrate) navigator.vibrate(ms);
        } catch (e) {}
      }

      loop(timestamp) {
        const dt = Math.min(0.1, (timestamp - (this.lastTime || timestamp)) / 1000);
        this.lastTime = timestamp;

        if (this.state === 'MOVING') {
          const dx = this.ball.targetX - this.ball.x;
          const dy = this.ball.targetY - this.ball.y;
          const dist = Math.hypot(dx, dy);
          const moveDist = this.ball.speed * dt;

          if (dist <= moveDist) {
            this.ball.x = this.ball.targetX;
            this.ball.y = this.ball.targetY;
            this.paintTileAtPos(this.ball.x, this.ball.y);
            this.onBallReachedDestination();
          } else {
            const angle = Math.atan2(dy, dx);
            this.ball.x += Math.cos(angle) * moveDist;
            this.ball.y += Math.sin(angle) * moveDist;
            this.paintTileAtPos(this.ball.x, this.ball.y);
          }
        }

        // Particle Updates
        for (let i = this.stars.length - 1; i >= 0; i--) {
          const st = this.stars[i];
          st.x += st.vx * dt;
          st.y += st.vy * dt;
          st.rot += st.vrot * dt;
          st.alpha -= dt * 1.6;
          if (st.alpha <= 0) this.stars.splice(i, 1);
        }

        for (let i = this.splats.length - 1; i >= 0; i--) {
          const sp = this.splats[i];
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.alpha -= dt * 2.8;
          if (sp.alpha <= 0) this.splats.splice(i, 1);
        }

        for (let i = this.confetti.length - 1; i >= 0; i--) {
          const c = this.confetti[i];
          c.x += c.vx * dt;
          c.y += c.vy * dt;
          c.vy += 320 * dt;
          c.rot += c.vrot * dt;
          c.alpha -= dt * 0.35;
          if (c.alpha <= 0) this.confetti.splice(i, 1);
        }

        if (this.hintArrow) {
          this.hintArrow.timer -= dt;
          if (this.hintArrow.timer <= 0) this.hintArrow = null;
        }

        if (this.state === 'VICTORY_MODAL') {
          this.victoryAnimT += dt;
          this.rippleRadius += dt * 380;
        }

        this.render();
        requestAnimationFrame((t) => this.loop(t));
      }

      paintTileAtPos(x, y) {
        const c = Math.floor((x - this.boardX) / this.tileSize);
        const r = Math.floor((y - this.boardY) / this.tileSize);

        if (r >= 0 && r < this.rows && c >= 0 && c < this.cols) {
          if (this.grid[r][c] === 1 && !this.painted[r][c]) {
            this.painted[r][c] = true;
            this.paintedCount++;
            this.synth.playPaintTile();
            this.spawnStarSparkle(this.boardX + c * this.tileSize + this.tileSize / 2,
                                  this.boardY + r * this.tileSize + this.tileSize / 2);
          }
        }
      }

      // --- RENDERING PIPELINE ---
      render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.scale(this.dpr, this.dpr);

        ctx.fillStyle = '#FAF7EE';
        ctx.fillRect(0, 0, this.width, this.height);

        this.renderTopUI(ctx);
        this.renderUndergroundSunkenTray(ctx);
        this.renderSplats(ctx);
        this.renderStarSparkles(ctx);
        this.renderHintGuide(ctx);
        this.renderJuicyMarbleBall(ctx);
        this.renderBottomControls(ctx);
        this.renderConfetti(ctx);

        if (this.state === 'VICTORY_MODAL') this.renderVictoryModal(ctx);
        if (this.state === 'MODE_SELECT') this.renderSudokuStyleDifficultyModal(ctx);

        ctx.restore();
      }

      // EXECUTIVE MODERN TOP HEADER
      renderTopUI(ctx) {
        const y = this.headerY;

        // 1. Left Difficulty Pill
        const pillW = 96;
        const pillH = 30;
        const pillX = 18;
        const pillY = y - 15;

        let diffColor = '#10B981';
        if (this.difficulty === 'medium') diffColor = '#F59E0B';
        if (this.difficulty === 'hard') diffColor = '#EF4444';

        ctx.save();
        ctx.shadowColor = diffColor + '33';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;

        ctx.beginPath();
        ctx.roundRect(pillX, pillY, pillW, pillH, 15);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();

        ctx.strokeStyle = diffColor;
        ctx.lineWidth = 1.8;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(pillX + 14, pillY + pillH / 2, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = diffColor;
        ctx.fill();

        ctx.font = '900 12px Outfit, sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(this.difficulty.toUpperCase() + ' ▾', pillX + 24, pillY + pillH / 2 + 0.5);
        ctx.restore();

        // 2. Center Level Badge Capsule
        const lvlBadgeW = 104;
        const lvlBadgeH = 34;
        const lvlBadgeX = (this.width - lvlBadgeW) / 2;
        const lvlBadgeY = y - 17;

        ctx.save();
        ctx.shadowColor = 'rgba(112, 26, 117, 0.15)';
        ctx.shadowBlur = 10;
        ctx.shadowOffsetY = 3;

        ctx.beginPath();
        ctx.roundRect(lvlBadgeX, lvlBadgeY, lvlBadgeW, lvlBadgeH, 17);
        ctx.fillStyle = '#701A75';
        ctx.fill();

        ctx.font = '900 15px Outfit, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('LEVEL ' + (this.levelIndex + 1), this.width / 2, lvlBadgeY + lvlBadgeH / 2 + 1);
        ctx.restore();

        // 3. Right Paint Progress Badge
        const pct = Math.min(100, Math.round((this.paintedCount / this.totalPlayableTiles) * 100));
        const progW = 76;
        const progH = 30;
        const progX = this.width - progW - 18;
        const progY = y - 15;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(progX, progY, progW, progH, 15);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.font = '900 12px Outfit, sans-serif';
        ctx.fillStyle = this.colorObj.hex;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(pct + '%', progX + progW / 2, progY + progH / 2 + 0.5);
        ctx.restore();
      }

      // UNDERGROUND SUNKEN TRAY 3D DEPTH
      renderUndergroundSunkenTray(ctx) {
        const bx = this.boardX;
        const by = this.boardY;
        const ts = this.tileSize;

        // 1. Soft Sunken Chasm Ambient Occlusion
        ctx.save();
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            if (this.grid[r][c] === 1) {
              const tx = bx + c * ts;
              const ty = by + r * ts;

              if (r === 0 || this.grid[r - 1][c] === 0) {
                const topAO = ctx.createLinearGradient(tx, ty, tx, ty + 6);
                topAO.addColorStop(0, 'rgba(30, 41, 59, 0.35)');
                topAO.addColorStop(1, 'rgba(30, 41, 59, 0)');
                ctx.fillStyle = topAO;
                ctx.fillRect(tx, ty, ts, 6);
              }
              if (c === 0 || this.grid[r][c - 1] === 0) {
                const leftAO = ctx.createLinearGradient(tx, ty, tx + 6, ty);
                leftAO.addColorStop(0, 'rgba(30, 41, 59, 0.35)');
                leftAO.addColorStop(1, 'rgba(30, 41, 59, 0)');
                ctx.fillStyle = leftAO;
                ctx.fillRect(tx, ty, 6, ts);
              }
            }
          }
        }
        ctx.restore();

        // 2. Render Tile Blocks
        for (let r = 0; r < this.rows; r++) {
          for (let c = 0; c < this.cols; c++) {
            const tx = bx + c * ts;
            const ty = by + r * ts;

            if (this.grid[r][c] === 1) {
              const isPainted = this.painted[r][c];

              ctx.save();
              ctx.beginPath();
              ctx.rect(tx + 0.5, ty + 0.5, ts - 1, ts - 1);

              if (isPainted) {
                ctx.fillStyle = this.colorObj.hex;
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 255, 255, 0.20)';
                ctx.fillRect(tx + 1, ty + 1, ts - 2, 2);
              } else {
                ctx.fillStyle = '#334155';
                ctx.fill();

                ctx.fillStyle = '#1E293B';
                ctx.fillRect(tx + 1, ty + ts - 2.5, ts - 2, 1.5);
              }

              ctx.strokeStyle = isPainted ? this.colorObj.darkHex : '#243242';
              ctx.lineWidth = 1.0;
              ctx.stroke();
              ctx.restore();
            } else {
              ctx.save();
              ctx.fillStyle = '#FAF7EE';
              ctx.fillRect(tx, ty, ts, ts);

              if (r + 1 < this.rows && this.grid[r + 1][c] === 1) {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.25)';
                ctx.fillRect(tx, ty + ts - 3, ts, 3);
              }
              if (c + 1 < this.cols && this.grid[r][c + 1] === 1) {
                ctx.fillStyle = 'rgba(30, 41, 59, 0.25)';
                ctx.fillRect(tx + ts - 3, ty, 3, ts);
              }
              ctx.restore();
            }
          }
        }

        // 3. Victory Radial Wave
        if (this.state === 'VICTORY_MODAL' && this.rippleRadius > 0) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(this.width / 2, this.boardY + this.boardH / 2, this.rippleRadius, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.lineWidth = 8;
          ctx.stroke();
          ctx.restore();
        }
      }

      // STAR SPARKLES ALONG LINE
      renderStarSparkles(ctx) {
        for (const st of this.stars) {
          ctx.save();
          ctx.translate(st.x, st.y);
          ctx.rotate(st.rot);
          ctx.globalAlpha = Math.max(0, st.alpha);

          ctx.beginPath();
          const sz = st.size;
          ctx.moveTo(0, -sz);
          ctx.quadraticCurveTo(0, 0, sz, 0);
          ctx.quadraticCurveTo(0, 0, 0, sz);
          ctx.quadraticCurveTo(0, 0, -sz, 0);
          ctx.quadraticCurveTo(0, 0, 0, -sz);
          ctx.fillStyle = '#FEF08A';
          ctx.fill();

          ctx.beginPath();
          const isz = sz * 0.4;
          ctx.moveTo(0, -isz);
          ctx.quadraticCurveTo(0, 0, isz, 0);
          ctx.quadraticCurveTo(0, 0, 0, isz);
          ctx.quadraticCurveTo(0, 0, -isz, 0);
          ctx.quadraticCurveTo(0, 0, 0, -isz);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();

          ctx.restore();
        }
      }

      // SLEEK JUICY 3D MARBLE BALL WITH SQUASH & STRETCH
      renderJuicyMarbleBall(ctx) {
        const b = this.ball;
        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.scale(b.scaleX, b.scaleY);

        // Ground Ambient Shadow
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, b.radius * 0.85, b.radius * 0.90, b.radius * 0.40, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.fill();
        ctx.restore();

        // Glossy Spherical Marble
        ctx.beginPath();
        ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(-b.radius * 0.35, -b.radius * 0.35, b.radius * 0.08, 0, 0, b.radius);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(0.55, '#F1F5F9');
        grad.addColorStop(1, '#94A3B8');
        ctx.fillStyle = grad;
        ctx.fill();

        // Crisp Specular Light Gleam
        ctx.beginPath();
        ctx.arc(-b.radius * 0.32, -b.radius * 0.32, b.radius * 0.26, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.fill();

        ctx.restore();
      }

      renderSplats(ctx) {
        for (const sp of this.splats) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
          ctx.fillStyle = this.colorObj.hex;
          ctx.globalAlpha = sp.alpha;
          ctx.fill();
          ctx.restore();
        }
      }

      renderConfetti(ctx) {
        for (const c of this.confetti) {
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rot);
          ctx.fillStyle = c.color;
          ctx.globalAlpha = Math.max(0, c.alpha);
          ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.7);
          ctx.restore();
        }
      }

      // EQUAL SIZED TACTILE BOTTOM CONTROLS: HINT (💡 1) & RESTART (↺)
      renderBottomControls(ctx) {
        const y = this.height - 54;
        const r = 24;

        // 1. Bottom-Left Hint Button (💡 1)
        const hintX = 48;
        ctx.save();
        ctx.shadowColor = 'rgba(245, 158, 11, 0.35)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;

        ctx.beginPath();
        ctx.arc(hintX, y, r, 0, Math.PI * 2);
        const grad = ctx.createLinearGradient(hintX, y - r, hintX, y + r);
        grad.addColorStop(0, '#FBBF24');
        grad.addColorStop(1, '#F59E0B');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.font = '22px sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('💡', hintX, y);

        const badgeX = hintX + 16;
        const badgeY = y - 16;
        ctx.beginPath();
        ctx.arc(badgeX, badgeY, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.0;
        ctx.stroke();

        ctx.font = '900 11px Outfit, sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.fillText(this.hints.toString(), badgeX, badgeY + 1);
        ctx.restore();

        // 2. Restart Level Button (↺)
        const restartX = 112;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.10)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 4;

        ctx.beginPath();
        ctx.arc(restartX, y, r, 0, Math.PI * 2);
        const rGrad = ctx.createLinearGradient(restartX, y - r, restartX, y + r);
        rGrad.addColorStop(0, '#FFFFFF');
        rGrad.addColorStop(1, '#F1F5F9');
        ctx.fillStyle = rGrad;
        ctx.fill();

        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        ctx.font = '900 22px Outfit, sans-serif';
        ctx.fillStyle = '#475569';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('↺', restartX, y + 1);
        ctx.restore();
      }

      renderHintGuide(ctx) {
        if (!this.hintArrow) return;
        const dir = this.hintArrow;
        const sx = this.ball.x;
        const sy = this.ball.y;
        const ex = sx + dir.dc * this.tileSize * 1.4;
        const ey = sy + dir.dr * this.tileSize * 1.4;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = '#FBBF24';
        ctx.lineWidth = 4.0;
        ctx.shadowColor = '#F59E0B';
        ctx.shadowBlur = 10;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ex, ey, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#F59E0B';
        ctx.fill();
        ctx.restore();
      }

      // AAA GAMING MASTERPIECE LEVEL COMPLETE MODAL (Classy, Bouncy, Glowing 3-Stars, Specular Shimmer)
      renderVictoryModal(ctx) {
        // Soft Dark Vignette Overlay
        ctx.fillStyle = 'rgba(15, 23, 42, 0.76)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(320, this.width - 36);
        const cardH = 340;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        // Bouncy Scale-In Spring Physics
        const t = Math.min(1.0, this.victoryAnimT * 3.2);
        // Spring easeOutBack curve
        const c1 = 1.70158;
        const c3 = c1 + 1;
        const scale = 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);

        ctx.save();
        ctx.translate(this.width / 2, this.height / 2);
        ctx.scale(Math.max(0, scale), Math.max(0, scale));
        ctx.translate(-this.width / 2, -this.height / 2);

        // 1. Outer Neon Holographic Back-Glow
        ctx.save();
        ctx.shadowColor = this.colorObj.hex;
        ctx.shadowBlur = 36;
        ctx.shadowOffsetY = 8;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 28);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        // 2. Card Gradient Border
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 28);
        ctx.strokeStyle = this.colorObj.hex;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.restore();

        // 3. Floating 3-Star Rating Crest
        const starY = cardY + 44;
        const starSpacing = 42;
        for (let i = -1; i <= 1; i++) {
          const sx = this.width / 2 + i * starSpacing;
          const isCenter = (i === 0);
          const sy = isCenter ? starY - 8 : starY;
          const sSize = isCenter ? 22 : 17;

          // Individual Star Spring Scale
          const starDelay = 0.2 + (i + 1) * 0.12;
          const starT = Math.max(0, Math.min(1.0, (this.victoryAnimT - starDelay) * 4));
          const starScale = starT > 0 ? (1 + c3 * Math.pow(starT - 1, 3) + c1 * Math.pow(starT - 1, 2)) : 0;

          if (starScale > 0) {
            ctx.save();
            ctx.translate(sx, sy);
            ctx.scale(starScale, starScale);

            // Golden Glow
            ctx.shadowColor = '#F59E0B';
            ctx.shadowBlur = 14;

            // 5-Pointed 3D Star
            ctx.beginPath();
            for (let s = 0; s < 5; s++) {
              const rot = (Math.PI / 2 * 3) + (s * Math.PI / 2.5);
              const ox = Math.cos(rot) * sSize;
              const oy = Math.sin(rot) * sSize;
              if (s === 0) ctx.moveTo(ox, oy);
              else ctx.lineTo(ox, oy);

              const inRot = rot + Math.PI / 5;
              ctx.lineTo(Math.cos(inRot) * (sSize * 0.44), Math.sin(inRot) * (sSize * 0.44));
            }
            ctx.closePath();

            const starGrad = ctx.createLinearGradient(0, -sSize, 0, sSize);
            starGrad.addColorStop(0, '#FEF08A');
            starGrad.addColorStop(0.5, '#F59E0B');
            starGrad.addColorStop(1, '#D97706');
            ctx.fillStyle = starGrad;
            ctx.fill();

            ctx.strokeStyle = '#FFFBEB';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.restore();
          }
        }

        // 4. Header Title: "PERFECT CLEAR!" in Vibrant Theme Color
        ctx.font = '900 24px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.textAlign = 'center';
        ctx.fillText('PERFECT CLEAR!', this.width / 2, cardY + 98);

        ctx.font = '700 13px Outfit, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText('Level ' + (this.levelIndex + 1) + ' Completed', this.width / 2, cardY + 118);

        // 5. High-End Frosted Glass Metrics Tray
        const trayW = cardW - 40;
        const trayH = 74;
        const trayX = cardX + 20;
        const trayY = cardY + 138;

        ctx.save();
        ctx.beginPath();
        ctx.roundRect(trayX, trayY, trayW, trayH, 18);
        ctx.fillStyle = '#F8FAFC';
        ctx.fill();
        ctx.strokeStyle = '#E2E8F0';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // Divider
        ctx.beginPath();
        ctx.moveTo(this.width / 2, trayY + 12);
        ctx.lineTo(this.width / 2, trayY + trayH - 12);
        ctx.strokeStyle = '#CBD5E1';
        ctx.lineWidth = 1.0;
        ctx.stroke();

        // Left Stat: Coverage
        const leftX = trayX + trayW * 0.25;
        ctx.font = '900 20px Outfit, sans-serif';
        ctx.fillStyle = this.colorObj.hex;
        ctx.textAlign = 'center';
        ctx.fillText('100%', leftX, trayY + 34);

        ctx.font = '800 11px Outfit, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText('COATED', leftX, trayY + 54);

        // Right Stat: Swipes & Time
        const rightX = trayX + trayW * 0.75;
        ctx.font = '900 20px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.fillText(this.levelSwipes.toString(), rightX, trayY + 34);

        ctx.font = '800 11px Outfit, sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText(this.levelDurationSec + 's TIME', rightX, trayY + 54);
        ctx.restore();

        // 6. Big Juicy Shimmering [ NEXT LEVEL ▶ ] Button
        const btnW = cardW - 40;
        const btnH = 54;
        const btnX = cardX + 20;
        const btnY = cardY + cardH - 80;

        ctx.save();
        ctx.shadowColor = this.colorObj.hex + '88';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 6;

        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 18);
        const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
        btnGrad.addColorStop(0, this.colorObj.hex);
        btnGrad.addColorStop(1, this.colorObj.darkHex);
        ctx.fillStyle = btnGrad;
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
        ctx.lineWidth = 2.0;
        ctx.stroke();

        // Shimmer Light Sweep Beam Across Button
        const shimmerPos = ((this.victoryAnimT * 1.6) % 2.0) - 0.5;
        const shimX = btnX + shimmerPos * btnW;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(btnX, btnY, btnW, btnH, 18);
        ctx.clip();

        const sGrad = ctx.createLinearGradient(shimX - 30, btnY, shimX + 30, btnY);
        sGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        sGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.45)');
        sGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = sGrad;
        ctx.fillRect(shimX - 30, btnY, 60, btnH);
        ctx.restore();

        ctx.restore();

        ctx.font = '900 18px Outfit, sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('NEXT LEVEL ▶', btnX + btnW / 2, btnY + btnH / 2 + 1);

        ctx.restore();
      }

      // CLEAN, SIMPLIFIED DIFFICULTY MODAL
      renderSudokuStyleDifficultyModal(ctx) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.72)';
        ctx.fillRect(0, 0, this.width, this.height);

        const cardW = Math.min(320, this.width - 36);
        const cardH = 320;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
        ctx.shadowBlur = 32;
        ctx.shadowOffsetY = 12;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.restore();

        // Modal Title
        ctx.font = '900 19px Outfit, sans-serif';
        ctx.fillStyle = '#701A75';
        ctx.textAlign = 'center';
        ctx.fillText('SELECT DIFFICULTY', this.width / 2, cardY + 38);

        // Close '✕' Button
        ctx.font = '800 18px sans-serif';
        ctx.fillStyle = '#94A3B8';
        ctx.fillText('✕', cardX + cardW - 26, cardY + 36);

        const modes = [
          { id: 'easy', label: 'EASY', desc: 'Casual & Relaxing', color: '#10B981' },
          { id: 'medium', label: 'MEDIUM', desc: 'Standard Challenge', color: '#F59E0B' },
          { id: 'hard', label: 'HARD', desc: 'Master Labyrinth', color: '#EF4444' }
        ];

        const optH = 68;
        const startY = cardY + 66;

        for (let i = 0; i < modes.length; i++) {
          const m = modes[i];
          const optY = startY + i * (optH + 10);
          const isSelected = (this.difficulty === m.id);

          ctx.save();
          if (isSelected) {
            ctx.shadowColor = m.color + '44';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 3;
          }

          ctx.beginPath();
          ctx.roundRect(cardX + 16, optY, cardW - 32, optH, 16);
          ctx.fillStyle = isSelected ? '#FAF7EE' : '#F8FAFC';
          ctx.fill();
          ctx.strokeStyle = isSelected ? m.color : '#E2E8F0';
          ctx.lineWidth = isSelected ? 2.2 : 1.2;
          ctx.stroke();
          ctx.restore();

          // Left Color Indicator
          ctx.beginPath();
          ctx.roundRect(cardX + 28, optY + 16, 6, optH - 32, 3);
          ctx.fillStyle = m.color;
          ctx.fill();

          ctx.font = '900 16px Outfit, sans-serif';
          ctx.fillStyle = isSelected ? '#701A75' : '#1E293B';
          ctx.textAlign = 'left';
          ctx.fillText(m.label, cardX + 44, optY + 28);

          ctx.font = '600 12px Outfit, sans-serif';
          ctx.fillStyle = '#64748B';
          ctx.fillText(m.desc, cardX + 44, optY + 48);

          if (isSelected) {
            ctx.font = '900 18px sans-serif';
            ctx.fillStyle = m.color;
            ctx.textAlign = 'right';
            ctx.fillText('✓', cardX + cardW - 28, optY + optH / 2);
          }
        }
      }
    }

    function initGame() {
      const canvas = document.getElementById('gameCanvas');
      if (canvas && !window.game) {
        window.game = new ColorMazeGame(canvas);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initGame);
    } else {
      initGame();
    }
  </script>
</body>
</html>
