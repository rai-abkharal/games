<!-- Source shell. Loads src/main.ts as a live module, so it only works behind
     `npm run dev`. build-single.mjs generates the shippable index.html from
     this file — author HTML and CSS here, never in index.html. -->
<!doctype html>
<html lang="en">
<head><script src="/preview-adapter.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0f18" />
<meta name="description" content="Deadzone 40 — 4v4 top-down team deathmatch. First squad to 40 kills wins." />
<title>Deadzone 40</title>
<style>
  :root {
    --bg: #080b12;
    --panel: rgba(255, 255, 255, 0.06);
    --stroke: rgba(255, 255, 255, 0.12);
    --ink: #e9eef8;
    --muted: rgba(233, 238, 248, 0.55);
    --accent: #7ef0b6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #16203a 0%, var(--bg) 60%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none;
  }
  #app {
    height: 100%;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) 12px max(8px, env(safe-area-inset-bottom));
  }
  header {
    width: 100%; max-width: 520px;
    display: flex; align-items: center; justify-content: space-between;
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; }
  .brand b { font-size: 15px; letter-spacing: 0.18em; font-weight: 800; }
  .brand span { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; }
  #btn-mute {
    width: 38px; height: 38px; border-radius: 12px; cursor: pointer;
    border: 1px solid var(--stroke); background: var(--panel); color: var(--ink);
    font-size: 16px; line-height: 1; display: grid; place-items: center;
  }
  #stage {
    flex: 1 1 auto; min-height: 0;
    width: 100%; max-width: 520px;
    display: grid; place-items: center;
  }
  #game {
    width: auto; height: auto; aspect-ratio: 3 / 5;
    max-width: 100%; max-height: 100%;
    border-radius: 22px; display: block;
    background: #0b0f18;
    border: 1px solid var(--stroke);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255,255,255,0.03);
    touch-action: none; cursor: crosshair;
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <div class="brand"><b>DEADZONE 40</b><span>4v4 · first to 40 kills</span></div>
      <button id="btn-mute" aria-label="Mute" type="button">🔊</button>
    </header>

    <div id="stage">
      <canvas id="game" width="480" height="800" aria-label="game canvas"></canvas>
    </div>

  </div>

function clamp(v, lo, hi) {

function inRect(px, py, r) {

function resolveCircleRect(cx, cy, cr, r) {
    const nx = clamp(cx, r.x, r.x + r.w);
    const ny = clamp(cy, r.y, r.y + r.h);
    const dx = cx - nx, dy = cy - ny;
    const d2 = dx * dx + dy * dy;
    if (d2 > cr * cr)
        return [0, 0];
    if (d2 > 0.0001) {
        const d = Math.sqrt(d2);
        return [(dx / d) * (cr - d), (dy / d) * (cr - d)];
    }
    const left = cx - r.x, right = r.x + r.w - cx;
    const top = cy - r.y, bottom = r.y + r.h - cy;
    const m = Math.min(left, right, top, bottom);
    if (m === left)
        return [-(left + cr), 0];
    if (m === right)
        return [right + cr, 0];

    ctx.lineTo(x + w - rr, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
    ctx.lineTo(x + rr, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rr);

}

    ctx.fill();

    ctx.fillStyle = bottom;
    ctx.beginPath();
    ctx.moveTo(x - tail, y + 6);
    ctx.lineTo(x + 14, y + 6);
    ctx.lineTo(x + 14, y + h + 2);
    ctx.lineTo(x - tail, y + h + 2);
    ctx.lineTo(x - tail + 14, y + (h + 8) / 2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + w + tail, y + 6);
    ctx.lineTo(x + w - 14, y + 6);
    ctx.lineTo(x + w - 14, y + h + 2);
    ctx.lineTo(x + w + tail, y + h + 2);
    ctx.lineTo(x + w + tail - 14, y + (h + 8) / 2);
    ctx.closePath();

/** Five-point star, used on the results screen. */
function star(ctx, cx, cy, r, fill, edge) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const a = -Math.PI / 2 + (i * Math.PI) / 5;
        const rr = i % 2 === 0 ? r : r * 0.45;
        const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
        if (i === 0)
            ctx.moveTo(px, py);
        else
            ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.lineWidth = 2.6;
    ctx.lineJoin = 'round';
    ctx.strokeStyle = edge;
    ctx.stroke();

/**

 * Each has update(dt, world) and draw(ctx). No DOM, no input, no FSM.

const OUTLINE = '#20242e';
const SKIN = '#e2ab74';
const SKIN_DARK = '#b3814f';
/* ------------------------------------------------------------------ */
class Particle {
    constructor(x, y, vx, vy, life, size, color, drag = 3.2) {
        this.spin = 0;
        this.rot = 0;
        this.square = false;
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.life = life;
        this.max = life;
        this.size = size;
        this.color = color;
        this.drag = drag;
    }
    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        const k = Math.exp(-this.drag * dt);
        this.vx *= k;
        this.vy *= k;
        this.rot += this.spin * dt;
        this.life -= dt;
    }
    get dead() { return this.life <= 0; }
    draw(ctx) {
        const t = clamp(this.life / this.max, 0, 1);
        ctx.globalAlpha = t;
        ctx.fillStyle = this.color;
        const s = this.size * (0.35 + t * 0.65);
        if (this.square) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rot);
            ctx.fillRect(-s, -s * 0.45, s * 2, s * 0.9);
            ctx.restore();
        }
        else {
            ctx.beginPath();
            ctx.arc(this.x, this.y, s, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}
class Decal {
    constructor(x, y, size, life = 16) {
        this.x = x;
        this.y = y;
        this.blobs = [];
        this.life = life;
        this.max = life;
        const n = randInt(5, 8);
        for (let i = 0; i < n; i++) {
            const a = rand(0, TAU), d = rand(0, size * 0.9);
            this.blobs.push({ dx: Math.cos(a) * d, dy: Math.sin(a) * d, r: rand(size * 0.22, size * 0.58), sq: rand(0.5, 0.95) });
        }
    }
    update(dt) { this.life -= dt; }
    get dead() { return this.life <= 0; }
    draw(ctx) {
        const a = clamp(this.life / 3.5, 0, 1) * 0.58;
        if (a <= 0.01)
            return;
        ctx.globalAlpha = a;
        ctx.fillStyle = css(BLOOD, -4);
        for (const b of this.blobs) {
            ctx.beginPath();
            ctx.ellipse(this.x + b.dx, this.y + b.dy, b.r, b.r * b.sq, 0, 0, TAU);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }
}
class Popup {
    constructor(x, y, text, color, size = 15) {
        this.life = 1.0;
        this.x = x + rand(-8, 8);
        this.y = y;
        this.text = text;
        this.color = color;
        this.size = size;

    }
}

class Bullet {
    constructor(owner, angle, speed, dmg, range, pierce) {
        this.travelled = 0;
        this.dead = false;
        this.hitIds = [];
        this.whizzed = false;
        this.owner = owner;
        this.team = owner.team;
        this.angle = angle;
        this.x = owner.x + Math.cos(angle) * (FIGHT_R + 18);
        this.y = owner.y + Math.sin(angle) * (FIGHT_R + 18);
        this.px = this.x;
        this.py = this.y;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.dmg = dmg;
        this.range = range;
        this.pierce = pierce;
    }
    update(dt) {
        this.px = this.x;
        this.py = this.y;
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.travelled += Math.hypot(this.vx, this.vy) * dt;
        if (this.travelled > this.range)
            this.dead = true;
        if (this.x < 0 || this.x > MAP_W || this.y < 0 || this.y > MAP_H)
            this.dead = true;
    }
    draw(ctx) {
        const c = this.team === 0 ? BLUE : RED;
        const tx = this.x - Math.cos(this.angle) * 18, ty = this.y - Math.sin(this.angle) * 18;
        const g = ctx.createLinearGradient(tx, ty, this.x, this.y);
        g.addColorStop(0, css(c, 24, 0));
        g.addColorStop(1, '#fff6d8');
        ctx.strokeStyle = g;
        ctx.lineWidth = 3.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        glow(ctx, this.x, this.y, 13, css(c, 34, 0.8), 0.7);
    }
}

class Medkit {
    constructor(x, y) {
        this.cooldown = 0;
        this.bob = rand(0, TAU);
        this.x = x;
        this.y = y;
    }
    get active() { return this.cooldown <= 0; }
    update(dt) { if (this.cooldown > 0)
        this.cooldown -= dt; this.bob += dt * 3; }
    take() { this.cooldown = MEDKIT_RESPAWN; }
    draw(ctx) {
        if (!this.active) {
            ctx.globalAlpha = 0.16;
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 5]);
            ctx.beginPath();
            ctx.arc(this.x, this.y, PICK_R, 0, TAU);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.globalAlpha = 1;
            return;
        }
        const y = this.y + Math.sin(this.bob) * 2.6;
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.beginPath();
        ctx.ellipse(this.x, this.y + 12, 14, 6.5, 0, 0, TAU);
        ctx.fill();
        glow(ctx, this.x, y, 32, 'rgba(255,255,255,0.35)', 0.5);
        // white case with a red cross, chunky outline
        roundRect(ctx, this.x - 13, y - 13, 26, 26, 7);
        ctx.fillStyle = '#eef2f6';
        ctx.fill();
        roundRect(ctx, this.x - 13, y - 13, 26, 12, 7);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.fillStyle = '#e0374d';
        roundRect(ctx, this.x - 8, y - 3, 16, 6, 2);
        ctx.fill();
        roundRect(ctx, this.x - 3, y - 8, 6, 16, 2);
        ctx.fill();
        ctx.lineWidth = 2.4;
        ctx.strokeStyle = OUTLINE;
        roundRect(ctx, this.x - 13, y - 13, 26, 26, 7);
        ctx.stroke();
    }
}

            return;
        }
        if (this.shieldT > 0)
            this.shieldT -= dt;
        if (this.cool > 0)
            this.cool -= dt;
        if (this.reloadT > 0) {
            this.reloadT -= dt;
            if (this.reloadT <= 0)
                this.mag = this.magSize;
        }
        if (world.time - this.lastHitAt > REGEN_DELAY && this.hp < this.maxHp) {
            this.hp = Math.min(this.maxHp, this.hp + REGEN_RATE * dt);
        }
        if (this.isPlayer)
            this.drivePlayer(dt, world);
        else
            this.driveBot(dt, world);
        // body banks into a turn
        const turn = angleDelta(this.prevAim, this.aim) / Math.max(dt, 1e-4);
        this.prevAim = this.aim;
        this.turnLean = damp(this.turnLean, clamp(turn * 0.02, -1, 1), 8, dt);
        this.move(dt, world);
    }
    drivePlayer(dt, world) {
        const mag = Math.hypot(this.inMoveX, this.inMoveY);
        let mx = this.inMoveX, my = this.inMoveY;
        if (mag > 1) {
            mx /= mag;
            my /= mag;
        }
        let spd = this.speed;
        if (this.inAim !== null && mag > 0.1) {
            const dot = Math.cos(Math.atan2(my, mx) - this.aim);
            spd *= lerp(0.72, 1, (dot + 1) / 2);
        }
        this.vx = damp(this.vx, mx * spd, 14, dt);
        this.vy = damp(this.vy, my * spd, 14, dt);
        if (this.inAim !== null)
            this.aim = approachAngle(this.aim, this.inAim, TURN_RATE * dt);
        else if (mag > 0.15)
            this.aim = approachAngle(this.aim, Math.atan2(my, mx), 11 * dt);
        if (this.inFire) {
            const onTarget = this.inAim === null || Math.abs(angleDelta(this.aim, this.inAim)) < FIRE_TOL;
            if (onTarget)
                this.shoot(world, this.aim);
            else if (this.mag <= 0)
                this.startReload();
        }
    }
    driveBot(dt, world) {
        const foe = this.pickTarget(world);
        let mx = 0, my = 0;
        let kit = null;
        if (this.hp < this.maxHp * 0.42) {
            let best = 420 * 420;
            for (const m of world.medkits) {
                if (!m.active)
                    continue;
                const d = dist2(this.x, this.y, m.x, m.y);
                if (d < best) {
                    best = d;
                    kit = m;
                }
            }
        }
        if (foe) {
            const dx = foe.x - this.x, dy = foe.y - this.y;
            const d = Math.hypot(dx, dy) || 1;
            const ux = dx / d, uy = dy / d;
            const clear = world.losClear(this.x, this.y, foe.x, foe.y);
            this.aim = approachAngle(this.aim, Math.atan2(dy, dx), 7.5 * dt);
            this.strafeT -= dt;
            if (this.strafeT <= 0) {
                this.strafeT = rand(0.7, 1.7);
                if (chance(0.45))
                    this.strafe *= -1;
            }
            if (kit) {
                const kdx = kit.x - this.x, kdy = kit.y - this.y;
                const kd = Math.hypot(kdx, kdy) || 1;
                mx = kdx / kd;
                my = kdy / kd;
            }
            else if (!clear || d > BOT_ENGAGE) {
                mx = ux - uy * this.strafe * 0.45;
                my = uy + ux * this.strafe * 0.45;
            }
            else if (d < BOT_TOOCLOSE) {
                mx = -ux * 0.9 - uy * this.strafe * 0.6;
                my = -uy * 0.9 + ux * this.strafe * 0.6;
            }
            else {
                const pull = (d - BOT_PREFER) / BOT_PREFER;
                mx = ux * pull * 0.7 - uy * this.strafe;
                my = uy * pull * 0.7 + ux * this.strafe;
            }
            if (clear && d < BOT_ENGAGE) {
                this.reactT += dt;
                if (this.reactT > BOT_REACT) {
                    this.burstT -= dt;
                    if (this.burstT <= 0) {
                        this.bursting = !this.bursting;
                        this.burstT = this.bursting ? rand(BOT_BURST_ON * 0.7, BOT_BURST_ON * 1.3)
                            : rand(BOT_BURST_OFF * 0.7, BOT_BURST_OFF * 1.4);
                    }
                    if (this.bursting) {
                        const lead = 0.16;
                        this.shoot(world, Math.atan2(foe.y + foe.vy * lead - this.y, foe.x + foe.vx * lead - this.x) + rand(-this.jitter, this.jitter));
                    }
                }
            }
            else {
                this.reactT = 0;
                this.bursting = false;
                if (this.mag < this.magSize * 0.5)
                    this.startReload();
            }
        }
        else {
            this.wanderT -= dt;
            if (this.wanderT <= 0) {
                this.wanderT = rand(1.4, 3);
                this.wanderX = rand(80, MAP_W - 80);
                this.wanderY = rand(80, MAP_H - 80);
            }
            const dx = this.wanderX - this.x, dy = this.wanderY - this.y;
            const d = Math.hypot(dx, dy) || 1;
            mx = dx / d;
            my = dy / d;
            this.aim = approachAngle(this.aim, Math.atan2(dy, dx), 5 * dt);
        }
        const m = Math.hypot(mx, my) || 1;
        mx /= m;
        my /= m;
        const steer = this.avoid(mx, my, world);
        this.vx = damp(this.vx, steer[0] * this.speed, 10, dt);
        this.vy = damp(this.vy, steer[1] * this.speed, 10, dt);
    }
    avoid(mx, my, world) {
        const probe = 48;
        if (!this.blocked(this.x + mx * probe, this.y + my * probe, world))
            return [mx, my];
        for (const a of [0.7, -0.7, 1.4, -1.4, 2.2, -2.2]) {
            const c = Math.cos(a), s = Math.sin(a);
            const nx = mx * c - my * s, ny = mx * s + my * c;
            if (!this.blocked(this.x + nx * probe, this.y + ny * probe, world))
                return [nx, ny];
        }
        return [-mx, -my];
    }
    blocked(x, y, world) {
        for (const w of world.walls) {
            if (x > w.x - FIGHT_R && x < w.x + w.w + FIGHT_R && y > w.y - FIGHT_R && y < w.y + w.h + FIGHT_R)
                return true;
        }
        return false;
    }
    pickTarget(world) {
        let best = null;
        let bestScore = Infinity;
        for (const f of world.fighters) {
            if (f.team === this.team || !f.alive)
                continue;
            const d = Math.sqrt(dist2(this.x, this.y, f.x, f.y));
            const score = d * (world.losClear(this.x, this.y, f.x, f.y) ? 1 : 2.1);
            if (score < bestScore) {
                bestScore = score;
                best = f;
            }
        }
        return best;
    }
    shoot(world, angle) {
        if (this.cool > 0 || this.reloadT > 0 || !this.alive)
            return;
        if (this.mag <= 0) {
            this.startReload();
            return;
        }
        this.cool = 1 / this.rate;
        this.mag--;
        this.muzzle = 1;
        this.recoil = 1;
        const cone = this.spread + this.bloom * BLOOM_MAX;
        this.bloom = Math.min(1, this.bloom + BLOOM_GAIN);
        for (let i = 0; i < this.shots; i++) {
            const off = this.shots === 1 ? 0 : (i - (this.shots - 1) / 2) * 0.075;
            world.fire(this, angle + off + rand(-cone, cone));
        }
        world.shotFx(this, angle);
        if (this.mag <= 0)
            this.startReload();
    }
    move(dt, world) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        for (const w of world.walls) {
            const [dx, dy] = resolveCircleRect(this.x, this.y, FIGHT_R, w);
            if (dx !== 0 || dy !== 0) {
                this.x += dx;
                this.y += dy;
                if (dx !== 0)
                    this.vx *= 0.2;
                if (dy !== 0)
                    this.vy *= 0.2;
            }
        }
        this.x = clamp(this.x, FIGHT_R, MAP_W - FIGHT_R);
        this.y = clamp(this.y, FIGHT_R, MAP_H - FIGHT_R);
        const spd = Math.hypot(this.vx, this.vy);
        this.legAmt = damp(this.legAmt, spd > 18 ? 1 : 0, 10, dt);
        this.walk += spd * dt * 0.085;
        if (spd > 24) {
            this.stepAcc += spd * dt;
            if (this.stepAcc > 52) {
                this.stepAcc = 0;
                this.stepped = true;
            }
        }
        else
            this.stepAcc = 0;
    }
    /* ================= drawing ================= */
    draw(ctx) {
        if (!this.alive) {
            this.drawCorpse(ctx);
            return;
        }
        const c = this.team === 0 ? BLUE : RED;
        ctx.fillStyle = 'rgba(0,0,0,0.30)';
        ctx.beginPath();
        ctx.ellipse(this.x + 3, this.y + 7, FIGHT_R * 1.2, FIGHT_R * 0.66, 0, 0, TAU);
        ctx.fill();
        const pop = 1 + easeOutCubic(this.spawnPop) * 0.28;
        const breath = this.legAmt < 0.2 ? 1 + Math.sin(this.breathe) * 0.017 : 1;
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.aim);
        ctx.scale(pop * breath, pop * breath * (1 - Math.abs(this.turnLean) * 0.07));
        this.drawSoldier(ctx, c, 1, false);
        ctx.restore();
        if (this.muzzle > 0.04)
            this.drawMuzzle(ctx);
        if (this.hurt > 0.02) {
            ctx.globalAlpha = this.hurt * 0.45;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(this.x, this.y, FIGHT_R + 2, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
        }
        if (this.shieldT > 0) {
            ctx.strokeStyle = css(c, 36, 0.5 + Math.sin(this.shieldT * 22) * 0.25);
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(this.x, this.y, FIGHT_R + 8, 0, TAU);
            ctx.stroke();
        }
        this.drawTag(ctx, c);
    }
    /** Cartoon soldier, +X forward, heavy dark outlines so it reads at any size. */
    drawSoldier(ctx, c, alpha, dead) {
        ctx.globalAlpha = alpha;
        ctx.lineJoin = 'round';
        const kick = this.recoil * 4;
        const sw = dead ? 6 : Math.sin(this.walk * 6.2) * 6.4 * this.legAmt;
        const ink = OUTLINE;
        const O = (lw = 2.4) => { ctx.lineWidth = lw; ctx.strokeStyle = ink; ctx.stroke(); };
        /* legs + boots */
        ctx.fillStyle = dead ? '#2b3039' : '#3b4351';
        roundRect(ctx, -5 + sw, -11.5, 13, 7.5, 3.4);
        ctx.fill();
        O(2.2);
        roundRect(ctx, -5 - sw, 4, 13, 7.5, 3.4);
        ctx.fill();
        O(2.2);
        ctx.fillStyle = '#1c212a';
        roundRect(ctx, 5 + sw * 1.2, -11.2, 8.5, 6.9, 3);
        ctx.fill();
        O(2);
        roundRect(ctx, 5 - sw * 1.2, 4.3, 8.5, 6.9, 3);
        ctx.fill();
        O(2);
        /* backpack */
        ctx.fillStyle = css(c, -32, 1, -20);
        roundRect(ctx, -16, -9, 10, 18, 4);
        ctx.fill();
        O(2.3);
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        roundRect(ctx, -14, -6.5, 6, 13, 2.6);
        ctx.fill();
        /* torso */
        ctx.save();
        ctx.translate(-kick * 0.45, 0);
        const g = ctx.createLinearGradient(0, -14, 0, 14);
        g.addColorStop(0, css(c, -16));
        g.addColorStop(0.45, css(c, 12));
        g.addColorStop(1, css(c, -24));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.ellipse(-1.5, 0, 12.5, 13.5, 0, 0, TAU);
        ctx.fill();
        O(2.6);
        /* plate carrier */
        ctx.fillStyle = css(c, -28, 1, -26);
        roundRect(ctx, -7.5, -9.5, 13, 19, 4.5);
        ctx.fill();
        O(2);
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        roundRect(ctx, -6.4, -8.4, 3.2, 16.8, 1.6);
        ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.28)';
        roundRect(ctx, -2, -8.2, 6, 5.6, 1.8);
        ctx.fill();
        roundRect(ctx, -2, 2.6, 6, 5.6, 1.8);
        ctx.fill();
        /* shoulder pads */
        ctx.fillStyle = css(c, 18);
        roundRect(ctx, -6.5, -14.6, 10.5, 6, 2.8);
        ctx.fill();
        O(2.1);
        roundRect(ctx, -6.5, 8.6, 10.5, 6, 2.8);
        ctx.fill();
        O(2.1);
        ctx.restore();
        /* arms out to the rifle */
        ctx.fillStyle = SKIN;
        ctx.save();
        ctx.translate(2 - kick, -8.6);
        ctx.rotate(0.36);
        roundRect(ctx, 0, -3, 15, 6, 3);
        ctx.fill();
        O(2.2);
        ctx.restore();
        ctx.save();
        ctx.translate(2 - kick, 8.6);
        ctx.rotate(-0.52);
        roundRect(ctx, 0, -3, 18, 6, 3);
        ctx.fill();
        O(2.2);
        ctx.restore();
        /* rifle */
        this.drawRifle(ctx, kick);
        /* gloves */
        ctx.fillStyle = '#20252f';
        ctx.beginPath();
        ctx.arc(16.5 - kick, -5, 3.7, 0, TAU);
        ctx.fill();
        O(2);
        ctx.beginPath();
        ctx.arc(19.5 - kick, 4.2, 3.7, 0, TAU);
        ctx.fill();
        O(2);
        /* head: skin disc, cap over the back, face to the front */
        ctx.save();
        ctx.translate(2 - kick * 0.5, 0);
        ctx.fillStyle = SKIN;
        ctx.beginPath();
        ctx.arc(0, 0, 8, 0, TAU);
        ctx.fill();
        O(2.5);
        // cap / helmet covering everything but the face
        ctx.fillStyle = css(c, 8, 1, -10);
        ctx.beginPath();
        ctx.arc(0, 0, 8.2, 0.78, TAU - 0.78);
        ctx.closePath();
        ctx.fill();
        O(2.3);
        ctx.fillStyle = 'rgba(255,255,255,0.20)';
        ctx.beginPath();
        ctx.ellipse(-2.4, -2.8, 3.6, 2.4, -0.5, 0, TAU);
        ctx.fill();
        // brim
        ctx.fillStyle = css(c, -18, 1, -10);
        roundRect(ctx, 5.4, -4.4, 4.4, 8.8, 2.2);
        ctx.fill();
        O(2);
        // eyes peeking under the brim
        if (!dead) {
            ctx.fillStyle = '#25292f';
            ctx.beginPath();
            ctx.arc(4.4, -2.6, 1.25, 0, TAU);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(4.4, 2.6, 1.25, 0, TAU);
            ctx.fill();
        }
        ctx.restore();
        ctx.globalAlpha = 1;
    }
    drawRifle(ctx, kick) {
        const O = (lw = 2.2) => { ctx.lineWidth = lw; ctx.strokeStyle = OUTLINE; ctx.stroke(); };
        ctx.save();
        ctx.translate(-kick, 0);
        ctx.fillStyle = '#2c313b';
        roundRect(ctx, -7, -2.6, 13, 5.2, 2.2);
        ctx.fill();
        O(2); // stock
        ctx.fillStyle = '#39404c';
        roundRect(ctx, 4, -3.4, 15, 6.8, 2.4);
        ctx.fill();
        O(2.2); // receiver
        ctx.fillStyle = 'rgba(255,255,255,0.13)';
        roundRect(ctx, 5.4, -2.8, 12, 1.9, 1);
        ctx.fill();
        ctx.save(); // magazine
        ctx.translate(10.5, 3);
        ctx.rotate(0.24);
        ctx.fillStyle = '#1e232c';
        roundRect(ctx, -2.8, 0, 5.6, 9.6, 2);
        ctx.fill();
        O(2);
        ctx.restore();
        ctx.fillStyle = '#313742';
        roundRect(ctx, 18, -2.7, 9, 5.4, 2);
        ctx.fill();
        O(2); // handguard
        ctx.fillStyle = '#4a5364';
        roundRect(ctx, 26, -1.6, 9, 3.2, 1.4);
        ctx.fill();
        O(1.8); // barrel
        ctx.fillStyle = '#626c80';
        roundRect(ctx, 33, -2.3, 4, 4.6, 1.5);
        ctx.fill();
        O(1.8); // muzzle device
        ctx.fillStyle = '#525a68';
        roundRect(ctx, 15, -5.4, 2.4, 2.6, 0.9);
        ctx.fill(); // iron sight
        ctx.restore();
    }
    drawMuzzle(ctx) {
        const m = this.muzzle;
        const d = 37 - this.recoil * 4;
        const mx = this.x + Math.cos(this.aim) * d;
        const my = this.y + Math.sin(this.aim) * d;
        glow(ctx, mx, my, 38 * m, 'rgba(255,214,132,0.95)', 0.95 * m);
        ctx.save();
        ctx.translate(mx, my);
        ctx.rotate(this.aim);
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = m;
        ctx.fillStyle = 'rgba(255,240,196,0.95)';
        const s = 1 + m;
        ctx.beginPath();
        ctx.moveTo(14 * s, 0);
        ctx.lineTo(2.6 * s, 3.6 * s);
        ctx.lineTo(0, 9.5 * s);
        ctx.lineTo(-2.6 * s, 3.6 * s);
        ctx.lineTo(-9.5 * s, 0);
        ctx.lineTo(-2.6 * s, -3.6 * s);
        ctx.lineTo(0, -9.5 * s);
        ctx.lineTo(2.6 * s, -3.6 * s);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.beginPath();
        ctx.arc(0, 0, 3.4 * s, 0, TAU);
        ctx.fill();
        ctx.restore();
        ctx.globalAlpha = 1;
        ctx.globalCompositeOperation = 'source-over';
    }
    drawCorpse(ctx) {
        const t = this.deadT;
        if (t > RESPAWN_TIME)
            return;
        const c = this.team === 0 ? BLUE : RED;
        const fade = clamp((RESPAWN_TIME - t) / 0.7, 0, 1);
        const grow = easeOutCubic(clamp(t / 0.9, 0, 1));
        ctx.globalAlpha = fade * 0.6;
        ctx.fillStyle = css(BLOOD, -6);
        ctx.beginPath();
        ctx.ellipse(this.x + Math.cos(this.deathAngle) * 5, this.y + Math.sin(this.deathAngle) * 5, 24 * grow, 17 * grow, this.deathAngle, 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
        const slump = easeOutCubic(clamp(t / 0.35, 0, 1));
        ctx.save();
        ctx.translate(this.x + Math.cos(this.deathAngle) * 6 * slump, this.y + Math.sin(this.deathAngle) * 6 * slump);
        ctx.rotate(this.aim + this.deathSpin * slump);
        ctx.scale(1, lerp(1, 0.84, slump));
        this.drawSoldier(ctx, { h: c.h, s: c.s * 0.3, l: c.l * 0.5 }, fade * 0.9, true);
        ctx.restore();
    }
    drawTag(ctx, c) {
        if (this.isPlayer) {
            const y = this.y - FIGHT_R - 10;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.moveTo(this.x - 6.5, y - 7);
            ctx.lineTo(this.x, y);
            ctx.lineTo(this.x + 6.5, y - 7);
            ctx.closePath();
            ctx.fill();
            ctx.lineWidth = 2.2;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = OUTLINE;
            ctx.stroke();
            return;
        }
        const w = 30, hpf = clamp(this.hp / this.maxHp, 0, 1);
        const y = this.y - FIGHT_R - 14;
        roundRect(ctx, this.x - w / 2, y, w, 6, 3);
        ctx.fillStyle = 'rgba(16,20,30,0.82)';
        ctx.fill();
        roundRect(ctx, this.x - w / 2 + 1.2, y + 1.2, (w - 2.4) * hpf, 3.6, 1.8);
        ctx.fillStyle = css(c, 26);
        ctx.fill();
    }
}
/* ------------------------------------------------------------------ */
class KillFeed {
    constructor() {
        this.items = [];
    }
    push(text, team, big = false) {
        this.items.unshift({ text, life: 4.2, team, big });
        if (this.items.length > 5)
            this.items.length = 5;
    }
    update(dt) {
        for (const it of this.items)
            it.life -= dt;
        this.items = this.items.filter((i) => i.life > 0);
    }
}

/**
 * engine.ts — Engine (canvas + fixed-timestep loop), Input, Sfx, Game (FSM).
 */
class Input {
    constructor(canvas) {
        this.canvas = canvas;
        this.keys = new Set();
        this.taps = [];
        this.moveStick = null;
        this.firePointer = -1;
        this.fireHeld = false;
        this.mouseX = VIEW_W / 2;
        this.mouseY = VIEW_H / 2;
        this.mouseDown = false;
        this.hasMouse = false;
        this.confirm = false;
        this.keyConfirm = false;
        this.onGesture = null;
        const el = canvas;
        el.style.touchAction = 'none';
        el.addEventListener('pointerdown', (e) => {
            el.setPointerCapture?.(e.pointerId);
            this.gesture();
            const v = this.toVirtual(e.clientX, e.clientY);
            this.taps.push(v);
            if (this.taps.length > 4)
                this.taps.shift();
            this.confirm = true;
            if (e.pointerType === 'mouse') {
                this.hasMouse = true;
                this.mouseX = v.x;
                this.mouseY = v.y;
                this.mouseDown = true;
            }
            else if (Input.inFireZone(v.x, v.y)) {
                if (this.firePointer < 0) {
                    this.firePointer = e.pointerId;
                    this.fireHeld = true;
                }
            }
            else if (!this.moveStick) {
                this.moveStick = { id: e.pointerId, ox: v.x, oy: v.y, x: v.x, y: v.y };
            }
            e.preventDefault();
        });
        el.addEventListener('pointermove', (e) => {
            const v = this.toVirtual(e.clientX, e.clientY);
            if (e.pointerType === 'mouse') {
                this.hasMouse = true;
                this.mouseX = v.x;
                this.mouseY = v.y;
                return;
            }
            if (this.moveStick && this.moveStick.id === e.pointerId) {
                this.moveStick.x = v.x;
                this.moveStick.y = v.y;
            }
            e.preventDefault();
        });
        const up = (e) => {
            if (e.pointerType === 'mouse')
                this.mouseDown = false;
            if (this.moveStick && this.moveStick.id === e.pointerId)
                this.moveStick = null;
            if (this.firePointer === e.pointerId) {
                this.firePointer = -1;
                this.fireHeld = false;
            }
        };
        el.addEventListener('pointerup', up);
        el.addEventListener('pointercancel', up);
        el.addEventListener('pointerleave', up);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('keydown', (e) => {
            if (e.repeat)
                return;

    onHit(b, victim, killed) {

            this.shotsHit++;

                this.sfx.hit();

                shooter.hp = Math.min(shooter.maxHp, shooter.hp + shooter.lifesteal);

        if (victim.isPlayer && !quiet) {

            this.decals.shift();

            return;

        shooter.streak++;

                return this.count('multi') < 2;
            if (u.key === 'pierce')
                return this.count('pierce') < 2;
            if (u.key === 'lifesteal')
                return this.count('lifesteal') < 3;
            if (u.key === 'armor')
                return this.count('armor') < 3;

    count(key) { return this.upgradesTaken.filter((k) => k === key).length; }

        const tap = this.input.takeTap();
        let chosen = -1;
        if (tap)
            for (let i = 0; i < cards.length; i++)
                if (inRect(tap.x, tap.y, cards[i]))
                    chosen = i;
        if (this.input.key('1'))
            chosen = 0;
        if (this.input.key('2'))
            chosen = 1;
        if (this.input.key('3'))
            chosen = 2;
        if (this.offerAnim < 0.35)
            return;
        if (chosen < 0 || !this.offers || chosen >= this.offers.length)
            return;
        this.applyUpgrade(this.offers[chosen]);
        this.offers = null;

    applyUpgrade(u) {

                break;
            case 'rate':
                p.rate *= 1.18;
                break;
            case 'mag':
                p.magSize += 12;
                p.mag += 12;
                break;
            case 'reload':
                p.reloadTime *= 0.75;
                break;
            case 'speed':
                p.speed *= 1.14;
                break;
            case 'hp':
                p.maxHp += 25;
                p.hp += 25;
                break;
            case 'multi':
                p.shots += 1;
                break;
            case 'pierce':
                p.pierce += 1;
                break;
            case 'accuracy':
                p.spread *= 0.6;
                break;
            case 'lifesteal':
                p.lifesteal += 5;
                break;
            case 'armor':
                p.armor = Math.min(0.55, p.armor + 0.15);
                break;
            case 'range':
                p.range *= 1.25;
                p.bulletSpeed *= 1.25;
                break;

    finish(s) {

        const kd = p.deaths ? p.kills / p.deaths : p.kills;
        this.stars = (s === 'WIN' ? 1 : 0) + (p.kills >= 10 ? 1 : 0) + (kd >= 1.5 ? 1 : 0);

    /* ================================================================ *

        ctx.translate(-this.camX + sx, -this.camY + sy);
        this.drawGround(ctx);
        for (const d of this.decals)
            d.draw(ctx);
        this.drawWalls(ctx);
        for (const m of this.medkits)
            m.draw(ctx);
        for (const f of this.fighters)
            if (!f.alive)
                f.draw(ctx);
        for (const f of this.fighters)
            if (f.alive)
                f.draw(ctx);
        for (const b of this.bullets)
            b.draw(ctx);
        for (const q of this.parts)
            q.draw(ctx);
        this.drawLockRing(ctx);
        for (const q of this.pops)
            q.draw(ctx);

        this.drawVignette(ctx);

    /* ---------------- environment ---------------- */

            x, y,
            w: Math.min(MAP_W, this.camX + VIEW_W + 60) - x,
            h: Math.min(MAP_H, this.camY + VIEW_H + 60) - y,

    drawGround(ctx) {
        const v = this.view();

        ctx.fillStyle = C_CONCRETE;
        ctx.fillRect(v.x, v.y, v.w, v.h);
        const T = 64;
        const i0 = Math.floor(v.x / T), i1 = Math.ceil((v.x + v.w) / T);
        const j0 = Math.floor(v.y / T), j1 = Math.ceil((v.y + v.h) / T);
        ctx.fillStyle = C_CONCRETE_2;

        ctx.strokeStyle = C_CONCRETE_LINE;

                this.drawAsphalt(ctx, p, v);

                this.drawGrass(ctx, p, v);

            ctx.lineTo(w.x + w.w - 2, w.y + w.h - 2);
            ctx.lineTo(w.x + 2, w.y + w.h - 2);
            ctx.stroke();
            ctx.restore();
            ctx.strokeStyle = edge;
            ctx.lineWidth = 2.8;
            roundRect(ctx, w.x, w.y, w.w, w.h, 7);
            ctx.stroke();
        }
    }
    crateDetail(ctx, w, edge) {
        const along = w.w >= w.h;
        ctx.strokeStyle = 'rgba(30,70,55,0.35)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        if (along)
            for (let x = w.x + 26; x < w.x + w.w - 6; x += 26) {
                ctx.moveTo(x, w.y + 3);
                ctx.lineTo(x, w.y + w.h - 3);
            }
        else
            for (let y = w.y + 26; y < w.y + w.h - 6; y += 26) {
                ctx.moveTo(w.x + 3, y);
                ctx.lineTo(w.x + w.w - 3, y);
            }
        ctx.stroke();
        // diagonal brace + corner bolts
        ctx.strokeStyle = 'rgba(255,255,255,0.16)';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(w.x + 6, w.y + w.h - 6);
        ctx.lineTo(w.x + w.w - 6, w.y + 6);
        ctx.stroke();
        ctx.fillStyle = edge;
        for (const [bx, by] of [[9, 9], [w.w - 9, 9], [9, w.h - 9], [w.w - 9, w.h - 9]]) {
            ctx.beginPath();
            ctx.arc(w.x + bx, w.y + by, 2.6, 0, TAU);
            ctx.fill();
        }
    }
    brickDetail(ctx, w) {
        ctx.strokeStyle = 'rgba(80,76,44,0.4)';
        ctx.lineWidth = 1.8;
        const R = 13;
        ctx.beginPath();
        if (w.w >= w.h) {
            for (let y = w.y + R; y < w.y + w.h; y += R) {
                ctx.moveTo(w.x, y);
                ctx.lineTo(w.x + w.w, y);
            }
            let row = 0;
            for (let y = w.y; y < w.y + w.h; y += R, row++) {
                for (let x = w.x + (row % 2 ? 0 : 16); x < w.x + w.w; x += 32) {
                    ctx.moveTo(x, y);
                    ctx.lineTo(x, y + R);
                }
            }
        }
        else {
            for (let x = w.x + R; x < w.x + w.w; x += R) {
                ctx.moveTo(x, w.y);
                ctx.lineTo(x, w.y + w.h);
            }
            let col = 0;
            for (let x = w.x; x < w.x + w.w; x += R, col++) {
                for (let y = w.y + (col % 2 ? 0 : 16); y < w.y + w.h; y += 32) {
                    ctx.moveTo(x, y);
                    ctx.lineTo(x + R, y);
                }
            }
        }
        ctx.stroke();
    }
    metalDetail(ctx, w) {
        ctx.fillStyle = 'rgba(0,0,0,0.20)';
        roundRect(ctx, w.x + 8, w.y + 8, w.w - 16, w.h - 16, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        for (const [bx, by] of [[6, 6], [w.w - 6, 6], [6, w.h - 6], [w.w - 6, w.h - 6]]) {
            ctx.beginPath();
            ctx.arc(w.x + bx, w.y + by, 2.4, 0, TAU);
            ctx.fill();
        }
    }
    drawLockRing(ctx) {
        if (!this.input.firing() || !this.player.alive)
            return;
        const t = this.fighters.find((f) => f.id === this.lockId && f.alive);
        if (!t)
            return;
        const r = (18 + this.player.bloom * 16) * (1 + Math.sin(this.lockPulse * 9) * 0.07);
        ctx.save();
        ctx.translate(t.x, t.y);
        ctx.rotate(this.lockPulse * 1.5);
        ctx.lineCap = 'round';
        ctx.strokeStyle = 'rgba(16,20,30,0.6)';
        ctx.lineWidth = 5;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, r, i * (TAU / 4) + 0.3, i * (TAU / 4) + TAU / 4 - 0.3);
            ctx.stroke();
        }
        ctx.strokeStyle = '#ff6b7f';
        ctx.lineWidth = 2.6;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.arc(0, 0, r, i * (TAU / 4) + 0.3, i * (TAU / 4) + TAU / 4 - 0.3);
            ctx.stroke();
        }
        ctx.restore();
    }
    drawOffscreenMarkers(ctx) {
        const p = this.player;
        if (!p.alive)
            return;
        for (const f of this.fighters) {
            if (f.team === p.team || !f.alive)
                continue;
            const sx = f.x - this.camX, sy = f.y - this.camY;
            if (sx > 16 && sx < VIEW_W - 16 && sy > 70 && sy < VIEW_H - 16)
                continue;
            const d = Math.hypot(f.x - p.x, f.y - p.y);
            if (d > 620)
                continue;
            const a = Math.atan2(f.y - p.y, f.x - p.x);
            ctx.save();
            ctx.translate(p.x + Math.cos(a) * 195, p.y + Math.sin(a) * 195);
            ctx.rotate(a);
            ctx.globalAlpha = 0.6;
            ctx.beginPath();
            ctx.moveTo(10, 0);
            ctx.lineTo(-7, -7);
            ctx.lineTo(-7, 7);
            ctx.closePath();
            ctx.fillStyle = css(RED, 12);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(16,20,30,0.8)';
            ctx.stroke();
            ctx.restore();
            ctx.globalAlpha = 1;
        }
    }
    drawVignette(ctx) {
        const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.3, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.74);
        g.addColorStop(0, 'rgba(0,0,0,0)');
        g.addColorStop(1, 'rgba(10,14,24,0.44)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        const p = this.player;
        if (p.alive && p.hp < p.maxHp * 0.36) {
            const t = 1 - p.hp / (p.maxHp * 0.36);
            const r = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.2, VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.62);
            r.addColorStop(0, 'rgba(255,0,0,0)');
            r.addColorStop(1, `rgba(255,20,20,${0.18 + t * 0.3 + Math.sin(this.time * 6) * 0.05})`);
            ctx.fillStyle = r;
            ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        }
    }
    /* ---------------- HUD ---------------- */
    drawHud(ctx) {
        ctx.textBaseline = 'alphabetic';
        this.teamPill(ctx, 10, 12, 150, 46, BLUE, 'BLUE', this.score[0], false);
        this.teamPill(ctx, VIEW_W - 160, 12, 150, 46, RED, 'RED', this.score[1], true);
        // timer pill
        chunky(ctx, VIEW_W / 2 - 44, 16, 88, 32, 11, '#2c3450', '#1b2138', 5);
        ctx.textAlign = 'center';
        outlined(ctx, formatTime(this.matchTime), VIEW_W / 2, 38, 16, UI_INK, 900, 4);
        this.drawMinimap(ctx, 10, 68, 86);
        this.drawFeed(ctx);
        this.drawBottom(ctx);
        if (this.hitMark > 0.02) {
            const p = this.player;
            const sx = p.x - this.camX, sy = p.y - this.camY;
            ctx.save();
            ctx.globalAlpha = this.hitMark;
            ctx.lineCap = 'round';
            for (const [col, lw] of [['rgba(16,20,30,0.8)', 5], ['#ffffff', 2.4]]) {
                ctx.strokeStyle = col;
                ctx.lineWidth = lw;
                for (const a of [0.785, 2.356, 3.927, 5.498]) {
                    ctx.beginPath();
                    ctx.moveTo(sx + Math.cos(a) * 11, sy + Math.sin(a) * 11);
                    ctx.lineTo(sx + Math.cos(a) * 19, sy + Math.sin(a) * 19);
                    ctx.stroke();
                }
            }
            ctx.restore();
        }
        if (this.bannerT > 0 && this.banner) {
            const t = clamp(this.bannerT / 1.6, 0, 1);
            const pop = easeOutBack(clamp((1.6 - this.bannerT) * 3.2, 0, 1));
            ctx.save();
            ctx.globalAlpha = Math.min(1, t * 2.2);
            ctx.translate(VIEW_W / 2, 140);
            ctx.scale(pop, pop);
            ctx.textAlign = 'center';
            outlined(ctx, this.banner, 0, 0, 27, UI_GOLD, 900, 7);
            ctx.restore();
        }
        if (!this.player.alive && this.state === 'PLAYING') {
            const secs = Math.ceil(Math.max(0, this.player.respawnT));
            ctx.fillStyle = 'rgba(8,11,18,0.5)';
            ctx.fillRect(0, 296, VIEW_W, 150);
            ctx.textAlign = 'center';
            outlined(ctx, 'YOU WERE ELIMINATED', VIEW_W / 2, 336, 17, '#ff8a9c', 900, 5);
            const beat = 1 + (1 - clamp(this.player.respawnT % 1, 0, 1)) * 0.12;
            ctx.save();
            ctx.translate(VIEW_W / 2, 404);
            ctx.scale(beat, beat);
            outlined(ctx, `${secs}`, 0, 0, 56, UI_INK, 900, 10);
            ctx.restore();
            outlined(ctx, 'RESPAWNING', VIEW_W / 2, 430, 12, 'rgba(233,238,248,0.75)', 800, 4);
        }
    }
    teamPill(ctx, x, y, w, h, c, label, v, right) {
        chunky(ctx, x, y, w, h, 14, css(c, -2), css(c, -26), 6);
        // head badge
        const bx = right ? x + w - 24 : x + 24, by = y + 18;
        ctx.fillStyle = css(c, 26);
        ctx.beginPath();
        ctx.arc(bx, by, 11, 0, TAU);
        ctx.fill();
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = 'rgba(16,20,30,0.75)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(16,20,30,0.75)';
        ctx.beginPath();
        ctx.arc(bx, by, 4.6, 0, TAU);
        ctx.fill();
        ctx.textAlign = right ? 'right' : 'left';
        const tx = right ? x + w - 42 : x + 42;
        outlined(ctx, label, tx, y + 16, 11, 'rgba(255,255,255,0.8)', 800, 3);
        outlined(ctx, `${v}`, tx, y + 33, 21, UI_INK, 900, 5);
        // progress toward the target
        const px = x + 9, pw = w - 18, py = y + h - 13;
        roundRect(ctx, px, py, pw, 5, 2.5);
        ctx.fillStyle = 'rgba(12,16,28,0.5)';
        ctx.fill();
        roundRect(ctx, px, py, pw * clamp(v / KILL_TARGET, 0, 1), 5, 2.5);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
    }
    drawMinimap(ctx, x, y, w) {
        const h = w * (MAP_H / MAP_W);
        chunky(ctx, x, y, w, h, 10, 'rgba(24,30,48,0.78)', 'rgba(14,18,30,0.85)', 4);
        const sx = w / MAP_W, sy = h / MAP_H;
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        for (const wl of this.walls)
            ctx.fillRect(x + wl.x * sx, y + wl.y * sy, Math.max(1, wl.w * sx), Math.max(1, wl.h * sy));
        ctx.strokeStyle = 'rgba(255,255,255,0.3)';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + this.camX * sx, y + this.camY * sy, VIEW_W * sx, VIEW_H * sy);
        for (const f of this.fighters) {
            if (!f.alive)
                continue;
            const enemy = f.team !== this.player.team;
            if (enemy && !f.bursting && !this.losClear(this.player.x, this.player.y, f.x, f.y))
                continue;
            ctx.fillStyle = f.isPlayer ? '#ffffff' : css(f.team === 0 ? BLUE : RED, 20);
            ctx.beginPath();
            ctx.arc(x + f.x * sx, y + f.y * sy, f.isPlayer ? 3.2 : 2.4, 0, TAU);
            ctx.fill();
        }
    }
    drawFeed(ctx) {
        ctx.textAlign = 'right';
        let y = 82;
        for (const it of this.feed.items) {
            ctx.globalAlpha = clamp(it.life / 0.7, 0, 1);
            const size = it.big ? 12 : 11;
            ctx.font = `${it.big ? 900 : 700} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
            const tw = ctx.measureText(it.text).width;
            chunky(ctx, VIEW_W - 12 - tw - 18, y - 14, tw + 20, 22, 7, it.big ? 'rgba(60,48,20,0.85)' : 'rgba(22,28,44,0.8)', 'rgba(10,14,24,0.85)', 3);
            outlined(ctx, it.text, VIEW_W - 22, y, size, it.big ? UI_GOLD : css(it.team === 0 ? BLUE : RED, 30), it.big ? 900 : 700, 3);
            y += 26;
            ctx.globalAlpha = 1;
        }
    }
    drawBottom(ctx) {
        const p = this.player;
        // health
        const bw = 208, bh = 22, bx = (VIEW_W - bw) / 2, by = VIEW_H - 64;
        chunky(ctx, bx, by, bw, bh, 11, '#2c3450', '#1b2138', 5);
        const hpf = clamp(p.hp / p.maxHp, 0, 1);
        const col = hpf > 0.5 ? ['#63d081', '#3ea75c'] : hpf > 0.25 ? ['#f5c342', '#c99321'] : ['#ef5f74', '#bc3b50'];
        roundRect(ctx, bx + 3, by + 3, (bw - 6) * hpf, bh - 11, 7);
        ctx.fillStyle = col[0];
        ctx.fill();
        roundRect(ctx, bx + 3, by + 3, (bw - 6) * hpf, (bh - 11) * 0.5, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.fill();
        ctx.textAlign = 'center';
        outlined(ctx, `${Math.ceil(p.hp)} / ${p.maxHp}`, VIEW_W / 2, by + 15, 12, UI_INK, 900, 3.5);
        // ammo
        const aw = 124, ax = (VIEW_W - aw) / 2, ay = VIEW_H - 38;
        chunky(ctx, ax, ay, aw, 28, 11, '#2c3450', '#1b2138', 5);
        if (p.reloadT > 0) {
            const t = 1 - p.reloadT / p.reloadTime;
            roundRect(ctx, ax + 4, ay + 4, (aw - 8) * t, 15, 6);
            ctx.fillStyle = UI_GOLD;
            ctx.fill();
            outlined(ctx, 'RELOADING', VIEW_W / 2, ay + 16, 11, UI_INK, 900, 3.5);
        }
        else {
            // bullet glyph
            ctx.fillStyle = p.mag <= 5 ? '#ef5f74' : UI_GOLD;
            roundRect(ctx, ax + 12, ay + 7, 7, 12, 3);
            ctx.fill();
            outlined(ctx, `${p.mag} / ${p.magSize}`, VIEW_W / 2 + 8, ay + 19, 15, p.mag <= 5 ? '#ff8a9c' : UI_INK, 900, 4);
        }
        // level + kills chips
        chunky(ctx, 12, VIEW_H - 38, 66, 28, 10, UI_GOLD, UI_GOLD_DARK, 5);
        ctx.textAlign = 'center';
        outlined(ctx, `LVL ${this.upgradesTaken.length + 1}`, 45, VIEW_H - 19, 12, UI_INK, 900, 3.5);
        chunky(ctx, VIEW_W - 90, VIEW_H - 38, 78, 28, 10, '#2c3450', '#1b2138', 5);
        outlined(ctx, `${p.kills} KILLS`, VIEW_W - 51, VIEW_H - 19, 12, UI_INK, 900, 3.5);
    }
    /* ---------------- joystick + fire button ---------------- */
    drawControls(ctx) {
        if (this.state !== 'PLAYING' || this.offers)
            return;
        const s = this.input.moveStick;
        if (s) {
            const dx = s.x - s.ox, dy = s.y - s.oy;
            const m = Math.hypot(dx, dy) || 1;
            const k = Math.min(m, Input.STICK_R);
            ctx.fillStyle = 'rgba(16,22,38,0.42)';
            ctx.beginPath();
            ctx.arc(s.ox, s.oy, Input.STICK_R, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.32)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(s.ox, s.oy, Input.STICK_R, 0, TAU);
            ctx.stroke();
            const nx = s.ox + (dx / m) * k, ny = s.oy + (dy / m) * k;
            ctx.fillStyle = 'rgba(12,18,32,0.8)';
            ctx.beginPath();
            ctx.arc(nx, ny + 3, 24, 0, TAU);
            ctx.fill();
            const g = ctx.createRadialGradient(nx - 6, ny - 8, 2, nx, ny, 25);
            g.addColorStop(0, '#f2f6ff');
            g.addColorStop(1, '#9fb3d8');
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(nx, ny, 24, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(16,20,30,0.7)';
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(nx, ny, 24, 0, TAU);
            ctx.stroke();
        }
        else {
            ctx.globalAlpha = 0.34;
            ctx.fillStyle = 'rgba(16,22,38,0.4)';
            ctx.beginPath();
            ctx.arc(STICK_HOME_X, STICK_HOME_Y, 46, 0, TAU);
            ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(STICK_HOME_X, STICK_HOME_Y, 46, 0, TAU);
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,255,255,0.75)';
            ctx.beginPath();
            ctx.arc(STICK_HOME_X, STICK_HOME_Y, 21, 0, TAU);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.textAlign = 'center';
            ctx.globalAlpha = 0.5;
            outlined(ctx, 'MOVE', STICK_HOME_X, STICK_HOME_Y + 66, 11, UI_INK, 900, 3);
            ctx.globalAlpha = 1;
        }
        // fire button — chunky, with a solid lip that compresses when held
        const press = this.firePress;
        const lip = 8 * (1 - press * 0.7);
        const r = FIRE_BTN_R;
        const hot = this.lockId !== 0 && this.input.firing();
        ctx.fillStyle = hot ? '#8e2438' : UI_REDBTN_DARK;
        ctx.beginPath();
        ctx.arc(FIRE_BTN_X, FIRE_BTN_Y + lip, r, 0, TAU);
        ctx.fill();
        const fg = ctx.createRadialGradient(FIRE_BTN_X - 12, FIRE_BTN_Y - 16, 4, FIRE_BTN_X, FIRE_BTN_Y, r);
        fg.addColorStop(0, hot ? '#ff9c8a' : '#f5798c');
        fg.addColorStop(1, hot ? '#e03651' : UI_REDBTN);
        ctx.fillStyle = fg;
        ctx.beginPath();
        ctx.arc(FIRE_BTN_X, FIRE_BTN_Y, r, 0, TAU);
        ctx.fill();
        ctx.strokeStyle = 'rgba(16,20,30,0.75)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(FIRE_BTN_X, FIRE_BTN_Y, r, 0, TAU);
        ctx.stroke();
        ctx.save();
        ctx.translate(FIRE_BTN_X, FIRE_BTN_Y - 3);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.moveTo(0, -17);
        ctx.lineTo(8, -4);
        ctx.lineTo(8, 13);
        ctx.lineTo(-8, 13);
        ctx.lineTo(-8, -4);
        ctx.closePath();
        ctx.fill();
        ctx.lineWidth = 2.6;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(16,20,30,0.8)';
        ctx.stroke();
        ctx.fillStyle = 'rgba(16,20,30,0.35)';
        ctx.fillRect(-8, 6, 16, 2.6);
        ctx.restore();
        ctx.textAlign = 'center';
        outlined(ctx, 'FIRE', FIRE_BTN_X, FIRE_BTN_Y + 34, 12, UI_INK, 900, 3.5);
        if (this.input.firing() && this.lockId === 0 && this.player.alive) {
            ctx.strokeStyle = 'rgba(255,255,255,0.35)';
            ctx.lineWidth = 2;
            ctx.setLineDash([6, 7]);
            ctx.beginPath();
            ctx.arc(FIRE_BTN_X, FIRE_BTN_Y, r + 11, 0, TAU);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }
    drawOffers(ctx) {
        if (!this.offers)
            return;
        const a = easeOutCubic(this.offerAnim);
        ctx.fillStyle = `rgba(6,9,18,${0.8 * a})`;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        ctx.globalAlpha = a;

        const rects = this.offerRects();
        for (let i = 0; i < this.offers.length; i++) {
            const r = rects[i];
            const u = this.offers[i];

        }
        ctx.textAlign = 'center';
        ctx.globalAlpha = 1;
    }
    /* ---------------- results screen ---------------- */
    rematchRect() { return { x: (VIEW_W - 252) / 2, y: 512, w: 252, h: 72 }; }
    drawResults(ctx) {
        const t = clamp(this.endTimer / 0.6, 0, 1);
        const win = this.state === 'WIN';
        ctx.fillStyle = `rgba(6,9,18,${0.88 * t})`;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        ctx.globalAlpha = t;
        ctx.textAlign = 'center';
        /* stars */
        for (let i = 0; i < 3; i++) {
            const earned = i < this.starsShown;
            const landed = earned ? this.endTimer - this.starLandedAt[i] : -1;
            this.drawStar(ctx, VIEW_W / 2 + (i - 1) * 80, 240, 33, earned, landed);
        }
        /* ribbon */
        const rp = easeOutBack(clamp((this.endTimer - 0.12) * 2.6, 0, 1));
        ctx.save();
        ctx.translate(VIEW_W / 2, 336);
        ctx.scale(rp, rp);
        ribbon(ctx, 0, 0, 290, 62, win ? UI_GREEN : UI_REDBTN, win ? UI_GREEN_DARK : UI_REDBTN_DARK);
        ctx.textAlign = 'center';
        outlined(ctx, win ? 'VICTORY' : 'DEFEAT', 0, 12, 35, UI_INK, 900, 8);
        ctx.restore();
        /* cash earned */
        ctx.textAlign = 'center';
        outlined(ctx, 'CASH EARNED', VIEW_W / 2, 412, 14, 'rgba(226,233,248,0.72)', 800, 4);
        const cashTxt = `${Math.round(this.shownCash)}`;
        ctx.font = '900 42px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
        const cw = ctx.measureText(cashTxt).width;
        const done = this.cash - this.shownCash < 12;
        const bump = done ? 1 + Math.max(0, 1 - (this.endTimer - 1.1) * 3) * 0.12 : 1;
        ctx.save();
        ctx.translate(VIEW_W / 2, 458);
        ctx.scale(bump, bump);
        this.drawCash(ctx, -cw / 2 - 30, -13);
        ctx.textAlign = 'left';
        outlined(ctx, cashTxt, -cw / 2 + 4, 0, 42, UI_GOLD, 900, 9);
        ctx.restore();
        /* rematch */
        if (this.endTimer > this.rematchAt()) {
            const r = this.rematchRect();
            const inA = easeOutBack(clamp((this.endTimer - this.rematchAt()) * 3.4, 0, 1));
            const pulse = 1 + Math.sin(this.endTimer * 4) * 0.018;
            ctx.save();
            ctx.translate(r.x + r.w / 2, r.y + r.h / 2);
            ctx.scale(inA * pulse, inA * pulse);
            chunky(ctx, -r.w / 2, -r.h / 2, r.w, r.h, 20, UI_GREEN, UI_GREEN_DARK, 9);
            // the chunky lip sits at the bottom, so the label centres on the top face
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            outlined(ctx, 'REMATCH', 0, -r.h / 2 + (r.h - 9) / 2, 27, UI_INK, 900, 6.5);
            ctx.textBaseline = 'alphabetic';
            ctx.restore();
        }
        ctx.globalAlpha = 1;
    }
    /** Chunky five-point star: outline, gradient body, inner facet, sparkle burst. */
    drawStar(ctx, cx, cy, r, earned, landed) {
        if (!earned) {
            ctx.globalAlpha *= 0.55;
            star(ctx, cx, cy, r, 'rgba(255,255,255,0.07)', 'rgba(255,255,255,0.20)');
            ctx.globalAlpha /= 0.55;
            return;
        }
        const pop = easeOutBack(clamp(landed * 4.2, 0, 1));
        const spin = (1 - clamp(landed * 3.2, 0, 1)) * -1.1;
        const idle = Math.sin(this.endTimer * 2.6 + cx) * 0.035;
        ctx.save();
        ctx.translate(cx, cy + Math.sin(this.endTimer * 2.6 + cx) * 1.8);
        ctx.rotate(spin + idle);
        ctx.scale(pop, pop);
        glow(ctx, 0, 0, r * 1.9, 'rgba(255,208,96,0.6)', 0.85);
        // dark rim first, drawn as a fat stroke under the body
        star(ctx, 0, 0, r, '#7a5310', '#3a2705');
        const g = ctx.createLinearGradient(0, -r, 0, r);
        g.addColorStop(0, '#ffe487');
        g.addColorStop(0.5, '#f7c53f');
        g.addColorStop(1, '#d99b1c');
        star(ctx, 0, 0, r * 0.93, '#00000000', '#00000000');
        ctx.fillStyle = g;
        ctx.fill();
        // inner facet + specular
        star(ctx, 0, -r * 0.06, r * 0.52, 'rgba(255,255,255,0.32)', 'rgba(255,255,255,0)');
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.beginPath();
        ctx.ellipse(-r * 0.22, -r * 0.4, r * 0.15, r * 0.09, -0.6, 0, TAU);
        ctx.fill();
        ctx.restore();
        // burst of sparks on the frame it lands
        const bt = clamp(landed / 0.5, 0, 1);
        if (bt < 1) {
            const ease = easeOutCubic(bt);
            ctx.save();
            ctx.globalAlpha *= 1 - bt;
            ctx.strokeStyle = '#ffe9a8';
            ctx.lineWidth = 3 * (1 - bt) + 0.6;
            ctx.lineCap = 'round';
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * TAU + 0.3;
                const r0 = r * (0.9 + ease * 0.7), r1 = r0 + 11 * (1 - bt) + 4;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
                ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
                ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(255,233,168,0.8)';
            ctx.lineWidth = 2.5 * (1 - bt);
            ctx.beginPath();
            ctx.arc(cx, cy, r * (1 + ease * 1.1), 0, TAU);
            ctx.stroke();
            ctx.restore();
        }
    }
    drawCash(ctx, x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(-0.12);
        for (let i = 2; i >= 0; i--) {
            roundRect(ctx, -16 + i * 2, -11 + i * 3, 32, 19, 4);
            ctx.fillStyle = i === 0 ? '#5fd06a' : '#3ea24c';
            ctx.fill();
            ctx.lineWidth = 2.2;
            ctx.strokeStyle = '#1d5c2a';
            ctx.stroke();
        }
        ctx.fillStyle = '#e8fbe9';
        roundRect(ctx, -12, -4, 24, 5, 2.5);
        ctx.fill();
        ctx.restore();
    }
}
/* ================================================================== *
 * Geometry helpers used only by the simulation
 * ================================================================== */
/** Slab test: does segment a→b intersect the AABB? */
function segRect(x0, y0, x1, y1, r) {
    const dx = x1 - x0, dy = y1 - y0;
    let tmin = 0, tmax = 1;
    for (let axis = 0; axis < 2; axis++) {
        const p = axis === 0 ? x0 : y0;
        const d = axis === 0 ? dx : dy;
        const lo = axis === 0 ? r.x : r.y;
        const hi = axis === 0 ? r.x + r.w : r.y + r.h;
        if (Math.abs(d) < 1e-8) {
            if (p < lo || p > hi)
                return false;
        }
        else {
            let t1 = (lo - p) / d, t2 = (hi - p) / d;
            if (t1 > t2) {
                const tt = t1;
                t1 = t2;
                t2 = tt;
            }
            tmin = Math.max(tmin, t1);
            tmax = Math.min(tmax, t2);
            if (tmin > tmax)
                return false;
        }
    }
    return true;
}
/** Does segment a→b pass within `rad` of point (cx, cy)? */
function segCircle(x0, y0, x1, y1, cx, cy, rad) {
    const dx = x1 - x0, dy = y1 - y0;
    const len2 = dx * dx + dy * dy;
    let t = len2 > 0 ? ((cx - x0) * dx + (cy - y0) * dy) / len2 : 0;
    t = clamp(t, 0, 1);
    const px = x0 + dx * t, py = y0 + dy * t;
    return dist2(px, py, cx, cy) <= rad * rad;
}
/* ================================================================== *
 * Engine — canvas sizing and the fixed-timestep loop
 * ================================================================== */
class Engine {
    constructor(canvas, game) {
        this.canvas = canvas;
        this.game = game;
        this.acc = 0;
        this.last = 0;
        this.raf = 0;
        this.step = 1 / 60;
        this.lastW = 0;
        this.lastH = 0;
        const c = canvas.getContext('2d', { alpha: false });
        if (!c)
            throw new Error('2d context unavailable');
        this.ctx = c;
        window.addEventListener('resize', () => this.resize());
        this.resize();
    }
    resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const rect = this.canvas.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width * dpr));
        const h = Math.max(1, Math.round(rect.height * dpr));
        if (w === this.lastW && h === this.lastH)
            return;
        this.lastW = w;
        this.lastH = h;
        this.canvas.width = w;
        this.canvas.height = h;
    }
    start() {
        cancelAnimationFrame(this.raf);
        this.acc = 0;
        this.last = performance.now();
        const frame = (now) => {
            this.raf = requestAnimationFrame(frame);
            const delta = (now - this.last) / 1000;
            this.last = now;
            this.acc += Math.min(delta, 0.25);
            let steps = 0;
            while (this.acc >= this.step && steps < 5) {
                this.game.update(this.step);
                this.acc -= this.step;
                steps++;
            }
            if (steps === 5)
                this.acc = 0;
            this.draw();
        };
        this.raf = requestAnimationFrame(frame);
    }
    stop() { cancelAnimationFrame(this.raf); }
    draw() {
        this.resize();
        const ctx = this.ctx;
        const w = this.canvas.width, h = this.canvas.height;
        const scale = Math.min(w / VIEW_W, h / VIEW_H);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = '#07090f';
        ctx.fillRect(0, 0, w, h);
        ctx.setTransform(scale, 0, 0, scale, (w - VIEW_W * scale) / 2, (h - VIEW_H * scale) / 2);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, VIEW_W, VIEW_H);
        ctx.clip();
        this.game.render(ctx);
        ctx.restore();
    }
}


/* ------------------------------------------------------------ */

/**
 * main.ts — boot: grab the DOM, wire input/audio, start the loop.
 */
const canvas = document.getElementById('game');
const muteBtn = document.getElementById('btn-mute');
if (canvas) {
    const sfx = new Sfx();
    const input = new Input(canvas);
    input.onGesture = () => sfx.init();
    const game = new Game(sfx, input);
    const engine = new Engine(canvas, game);
    if (muteBtn) {
        muteBtn.addEventListener('click', (e) => {
            e.preventDefault();
            sfx.init();
            sfx.setMuted(!sfx.muted);
            muteBtn.textContent = sfx.muted ? '🔇' : '🔊';
            muteBtn.blur();
        });
    }
    document.addEventListener('visibilitychange', () => {
        if (document.hidden)
            engine.stop();
        else
            engine.start();
    });
    engine.start();
}

</script>
