class BoardModel {
    constructor() {
        this.pawns = [];
        this.p1HasCaptured = false;
        this.p2HasCaptured = false;
        this.initPawns();
    }
    initPawns() {

                indexInPlayer: i,
                step: -1,

                x: 0,
                y: 0,
                hopOffset: 0,
                pulseAnim: 0

        }
        for (let i = 0; i < 4; i++) {
            this.pawns.push({
                id: i + 4,
                player: 2,
                indexInPlayer: i,
                step: -1,
                lapCount: 0,
                isGoal: false,
                x: 0,
                y: 0,
                hopOffset: 0,
                pulseAnim: 0
            });
        }
    }
    hasPlayerCaptured(player) {
        return player === 1 ? this.p1HasCaptured : this.p2HasCaptured;
    }
    recordCapture(player) {
        if (player === 1)
            this.p1HasCaptured = true;
        else
            this.p2HasCaptured = true;
    }
    getPath(player) {
        return player === 1 ? BoardModel.RED_PATH : BoardModel.CYAN_PATH;
    }
    getNestSlots(player) {
        return player === 1 ? BoardModel.RED_NEST_SLOTS : BoardModel.CYAN_NEST_SLOTS;
    }
    getPawnGridPos(pawn) {
        if (pawn.step === -1) {
            const nest = this.getNestSlots(pawn.player);
            return nest[pawn.indexInPlayer];
        }
        const path = this.getPath(pawn.player);
        const step = Math.min(pawn.step, BoardModel.PATH_LENGTH);
        return path[step];
    }
    isSafeTile(player, step) {
        if (step === 0)
            return true;
        if (step === 13)
            return true;
        if (step >= 24)
            return true;
        return false;
    }
    calculateMoveTarget(pawn, roll) {
        if (pawn.isGoal) {
            return null;
        }
        if (pawn.step === -1) {
            if (roll === 6) {
                return { targetStep: 0, waypoints: [this.getPath(pawn.player)[0]] };
            }
            return null;
        }
        const path = this.getPath(pawn.player);
        const hasCaptured = this.hasPlayerCaptured(pawn.player);
        if (hasCaptured && pawn.step >= 24) {
            const remainingSteps = BoardModel.PATH_LENGTH - pawn.step;
            if (roll > remainingSteps) {
                return null;
            }
        }
        const waypoints = [];
        let curr = pawn.step;
        for (let i = 1; i <= roll; i++) {
            if (curr < 24) {
                curr++;
            }
            else if (curr === 24) {
                if (hasCaptured) {
                    curr = 25;
                }
                else {
                    curr = 0;
                }
            }
            else if (curr >= 25 && curr < BoardModel.PATH_LENGTH) {
                curr++;
            }
            waypoints.push(path[curr]);
        }
        return { targetStep: curr, waypoints };
    }
    getValidMoves(player, roll) {
        const playerPawns = this.pawns.filter(p => p.player === player && !p.isGoal);
        const valid = [];
        for (const pawn of playerPawns) {
            const move = this.calculateMoveTarget(pawn, roll);
            if (move) {
                valid.push(pawn);
            }
        }
        return valid;
    }
    findOpponentOnTile(player, targetStep) {
        if (this.isSafeTile(player, targetStep))
            return null;
        const myPath = this.getPath(player);
        const targetGrid = myPath[targetStep];
        const opponentPlayer = player === 1 ? 2 : 1;
        const opponentPawns = this.pawns.filter(p => p.player === opponentPlayer && p.step >= 0 && !p.isGoal);

            if (this.isSafeTile(opponentPlayer, opp.step))

    }

class LudoAI {
    static selectBestMove(board, roll) {
        const validPawns = board.getValidMoves(2, roll);
        if (validPawns.length === 0)
            return null;
        if (validPawns.length === 1)
            return validPawns[0];
        let bestPawn = validPawns[0];
        let highestScore = -Infinity;
        const pawnsOnTrack = board.pawns.filter(p => p.player === 2 && p.step >= 0 && !p.isGoal).length;
        for (const pawn of validPawns) {
            let score = 0;
            const move = board.calculateMoveTarget(pawn, roll);
            if (!move)
                continue;
            const targetStep = move.targetStep;
            if (pawn.step === -1) {
                if (pawnsOnTrack === 0) {
                    score += 450;
                }
                else if (pawnsOnTrack === 1) {
                    score += 150;
                }
                else if (pawnsOnTrack === 2) {
                    score += 80;
                }
                else {
                    score += 40;
                }
            }
            else {
                if (targetStep === BoardModel.PATH_LENGTH) {
                    score += 500;
                }
                const victim = board.findOpponentOnTile(2, targetStep);
                if (victim) {
                    score += 350 + victim.step * 2;
                }
                if (targetStep >= 25 && pawn.step < 25) {
                    score += 180;
                }
                if (board.isSafeTile(2, targetStep)) {
                    score += 60;
                }
                score += targetStep * 2;
                const opponentPawns = board.pawns.filter(p => p.player === 1 && p.step >= 0 && !p.isGoal);
                for (const opp of opponentPawns) {
                    const dist = pawn.step - opp.step;
                    if (dist >= 1 && dist <= 6) {
                        score += 70;
                    }
                }
            }
            if (score > highestScore) {
                highestScore = score;
                bestPawn = pawn;
            }
        }
        return bestPawn;
    }
}

            this.aiTimer -= dt;
            if (this.aiTimer <= 0) {
                this.triggerDiceRoll();
            }
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life -= dt;
            if (p.life <= 0) {
                this.particles.splice(i, 1);
                continue;
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 220 * dt;
            p.rot += p.vRot * dt;
        }
        for (let i = this.popups.length - 1; i >= 0; i--) {
            const pop = this.popups[i];
            pop.life -= dt;
            pop.y -= 35 * dt;
            if (pop.life <= 0) {
                this.popups.splice(i, 1);
            }
        }
    }
    render() {
        const ctx = this.ctx;
        ctx.save();
        ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        const isP1 = (this.currentPlayer === 1);
        ctx.fillStyle = isP1 ? CONFIG.COLORS.bgP1 : CONFIG.COLORS.bgP2;
        ctx.fillRect(0, 0, this.width, this.height);
        const activeDicePos = isP1 ? this.p1DicePos : this.p2DicePos;
        EntityRenderer.renderTurnCorner(ctx, this.width, this.height, this.currentPlayer, activeDicePos, this.gameTime);
        EntityRenderer.renderBoard(ctx, this.boardX, this.boardY, this.boardSize, this.board, this.gameTime);
        const diceSize = 36;
        if (isP1) {
            EntityRenderer.renderDice(ctx, this.p1DicePos.x, this.p1DicePos.y, diceSize, this.diceValue, this.isRolling, this.rollProgress, 0);
        }
        else {
            EntityRenderer.renderDice(ctx, this.p2DicePos.x, this.p2DicePos.y, diceSize, this.diceValue, this.isRolling, this.rollProgress, 0);
        }
        this.renderAllPawns(ctx);
        EntityRenderer.renderConfetti(ctx, this.particles);
        EntityRenderer.renderPopups(ctx, this.popups);
        if (this.state === 'VICTORY') {
            this.renderVictoryModal(ctx);
        }
        ctx.restore();
    }
    getPawnPixelPos(pawn) {
        const innerPad = 4;
        const innerSize = this.boardSize - innerPad * 2;
        const cellW = innerSize / BoardModel.GRID_COLS;
        const bx = this.boardX + innerPad;
        const by = this.boardY + innerPad;
        if (pawn.isGoal) {
            const isRed = (pawn.player === 1);
            const slot = pawn.indexInPlayer;
            const baseGridX = isRed ? 8.0 : 7.0;
            const baseGridY = 7.5;
            const offsets = [
                { dx: 0, dy: -0.45 },
                { dx: isRed ? 0.35 : -0.35, dy: 0 },
                { dx: 0, dy: 0.45 },
                { dx: isRed ? -0.35 : 0.35, dy: 0 }
            ];
            const off = offsets[slot % 4];
            return {
                x: bx + (baseGridX + off.dx) * cellW,
                y: by + (baseGridY + off.dy) * cellW
            };
        }
        if (pawn === this.activeMovingPawn && this.movePath.length > 0) {
            const prevIdx = Math.max(0, this.currentPathIndex - 1);
            const currIdx = Math.min(this.movePath.length - 1, this.currentPathIndex);
            const p0 = prevIdx === currIdx
                ? (pawn.step === 0 ? this.board.getNestSlots(pawn.player)[pawn.indexInPlayer] : this.board.getPath(pawn.player)[Math.max(0, pawn.step - this.movePath.length)])
                : this.movePath[prevIdx];
            const p1 = this.movePath[currIdx];
            const t = Math.min(1.0, this.stepTimer / this.STEP_DURATION);
            let gridX = p0.x + (p1.x - p0.x) * t;
            let gridY = p0.y + (p1.y - p0.y) * t;
            if (Math.abs(p0.x - p1.x) >= 3.5) {
                if (p0.y <= 6.5) {
                    gridY = 6.0 - Math.sin(t * Math.PI) * 1.4;
                }
                else {
                    gridY = 8.0 + Math.sin(t * Math.PI) * 1.4;
                }
            }
            return {
                x: bx + (gridX + 0.5) * cellW,
                y: by + (gridY + 0.5) * cellW
            };
        }
        const grid = this.board.getPawnGridPos(pawn);
        let offsetX = 0;
        let offsetY = 0;
        if (pawn.step >= 0 && !pawn.isGoal) {
            const sameTilePawns = this.board.pawns.filter(p => {
                if (p.step < 0 || p.isGoal)
                    return false;
                const g = this.board.getPawnGridPos(p);
                return Math.abs(g.x - grid.x) < 0.05 && Math.abs(g.y - grid.y) < 0.05;
            });
            if (sameTilePawns.length > 1) {
                sameTilePawns.sort((a, b) => a.id - b.id);
                const idx = sameTilePawns.findIndex(p => p.id === pawn.id);
                const count = sameTilePawns.length;
                if (count === 2) {
                    offsetX = (idx === 0 ? -0.22 : 0.22) * cellW;
                    offsetY = (idx === 0 ? -0.12 : 0.12) * cellW;
                }
                else if (count === 3) {
                    if (idx === 0) {
                        offsetX = -0.22 * cellW;
                        offsetY = -0.16 * cellW;
                    }
                    else if (idx === 1) {
                        offsetX = 0.22 * cellW;
                        offsetY = -0.16 * cellW;
                    }
                    else {
                        offsetX = 0;
                        offsetY = 0.20 * cellW;
                    }
                }
                else if (count >= 4) {
                    if (idx === 0) {
                        offsetX = -0.20 * cellW;
                        offsetY = -0.20 * cellW;
                    }
                    else if (idx === 1) {
                        offsetX = 0.20 * cellW;
                        offsetY = -0.20 * cellW;
                    }
                    else if (idx === 2) {
                        offsetX = -0.20 * cellW;
                        offsetY = 0.20 * cellW;
                    }
                    else {
                        offsetX = 0.20 * cellW;
                        offsetY = 0.20 * cellW;
                    }
                }
            }
        }
        return {
            x: bx + (grid.x + 0.5) * cellW + offsetX,
            y: by + (grid.y + 0.5) * cellW + offsetY
        };
    }
    renderAllPawns(ctx) {
        const pawnRadius = this.cellSize * 0.44;
        for (const pawn of this.board.pawns) {
            if (pawn === this.activeMovingPawn)
                continue;
            const pos = this.getPawnPixelPos(pawn);
            const isSelectable = this.selectablePawns.includes(pawn);
            EntityRenderer.renderPawn(ctx, pos.x, pos.y, pawnRadius, pawn.player, isSelectable, this.gameTime, 0);
        }
        if (this.activeMovingPawn) {
            const pos = this.getPawnPixelPos(this.activeMovingPawn);
            EntityRenderer.renderPawn(ctx, pos.x, pos.y, pawnRadius, this.activeMovingPawn.player, false, this.gameTime, this.activeMovingPawn.hopOffset);
        }
    }
    findClickedPawn(clickX, clickY, player) {
        const hitRadius = this.cellSize * 0.95;
        const pawns = this.board.pawns.filter(p => p.player === player && !p.isGoal);
        for (const p of pawns) {
            const pos = this.getPawnPixelPos(p);
            const dx = clickX - pos.x;
            const dy = clickY - pos.y;
            if (dx * dx + dy * dy <= hitRadius * hitRadius) {
                return p;
            }
        }
        return null;
    }
    spawnPopup(x, y, text, color) {
        this.popups.push({
            x,
            y,
            text,
            color,
            life: 0.9,
            maxLife: 0.9
        });
    }
    spawnBoxConfetti(cx, cy, color) {
        const colors = [color, '#FFFFFF', '#FFD700'];
        for (let i = 0; i < 22; i++) {
            this.particles.push({
                x: cx,
                y: cy,
                vx: (Math.random() - 0.5) * 180,
                vy: -80 - Math.random() * 140,
                rot: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 12,
                size: 5 + Math.random() * 5,
                color: colors[Math.floor(Math.random() * colors.length)],
                life: 0.85,
                maxLife: 0.85
            });
        }
    }
    renderVictoryModal(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(8, 12, 16, 0.78)';
        ctx.fillRect(0, 0, this.width, this.height);
        const cardW = Math.min(330, this.width - 40);
        const cardH = 340;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 24);
        ctx.fillStyle = '#1E293B';
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#38BDF8';
        ctx.stroke();
        const isP1Win = this.board.isPlayerWon(1);
        ctx.font = '900 36px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = isP1Win ? '#FA5252' : '#00B0FF';
        ctx.fillText(isP1Win ? 'YOU WON! 👑' : 'BOT WON! 🤖', this.width / 2, cardY + 70);
        ctx.font = '700 18px "Fredoka", sans-serif';
        ctx.fillStyle = '#CBD5E1';
        ctx.fillText(isP1Win ? 'Pawn reached Home safely!' : 'Better luck next race!', this.width / 2, cardY + 125);
        const btn = this.playAgainBtn;
        btn.x = (this.width - 220) / 2;
        btn.y = cardY + 220;
        const squish = btn.pressProgress * 3;
        ctx.beginPath();
        ctx.roundRect(btn.x, btn.y + squish, btn.w, btn.h - squish, 18);
        ctx.fillStyle = '#22C55E';
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();
        ctx.font = '900 22px "Fredoka", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('PLAY AGAIN 🎲', this.width / 2, btn.y + btn.h * 0.5 + 2);
        ctx.restore();
    }
}
function initGame() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) {
        console.error('Canvas #gameCanvas not found!');
        return;
    }
    const engine = new GameEngine(canvas);
    function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        engine.setSize(width, height, dpr);
    }
    window.addEventListener('resize', resize);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resize);
    }
    resize();
    canvas.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        engine.onPointerDown(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', () => {
        engine.onPointerUp();
    });
    let lastTime = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    function frame(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;
        engine.update(dt);
        engine.render();
        window.requestAnimationFrame(frame);
    }
    window.requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
        initGame();
    });
}
else {
    window.addEventListener('DOMContentLoaded', initGame);
}
})();
  </script>
