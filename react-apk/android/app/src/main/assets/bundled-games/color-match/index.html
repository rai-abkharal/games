<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Color Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#090d1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
#game-container{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#0f172a}
</style>
</head>
<body>
<div id="game-container"></div>
<script>
(()=>{'use strict';
const W=360,H=640,D=Math.min(window.devicePixelRatio||1,2);
const c=document.createElement('canvas');c.width=W*D;c.height=H*D;c.style.width='min(100vw,56.25vh)';c.style.height='min(177.78vw,100vh)';
document.getElementById('game-container').appendChild(c);
const ctx=c.getContext('2d');ctx.scale(D,D);

const COLORS=[
  {name:'RED',hex:'#ef4444'},
  {name:'BLUE',hex:'#3b82f6'},
  {name:'GREEN',hex:'#22c55e'},
  {name:'YELLOW',hex:'#eab308'},
  {name:'PURPLE',hex:'#a855f7'}
];

let score=0,combo=0,best=+localStorage.getItem('color-match-best')||0;
let roundTime=3.0,maxRoundTime=3.0,over=false,started=false,last=performance.now(),shake=0;
let particles=[],popups=[],currentText='',textColor='',isMatch=false;
let isPaused=false;
window.__GAME_PAUSED__=false;
window.SoundFx={ctx:null};

function bridge(name,...args){
  try{window.parent.postMessage({type:'GAME_BRIDGE',event:name,args},'*');if(window.GameBridge?.[name])window.GameBridge[name](...args)}catch(e){}
}
bridge('sendReady');

function sound(freq,dur=0.06,type='sine',vol=0.04){
  try{
    const A=sound.A||(sound.A=new(window.AudioContext||window.webkitAudioContext)());
    if(A.state==='suspended')A.resume();
    const o=A.createOscillator(),g=A.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(vol,A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,A.currentTime+dur);
    o.connect(g);g.connect(A.destination);o.start();o.stop(A.currentTime+dur);
  }catch(e){}
}

function pauseGame(){
  isPaused=true;
  if(sound.A&&sound.A.state==='running'){try{sound.A.suspend()}catch(e){}}
}
function resumeGame(){
  if(isPaused||window.__GAME_PAUSED__){
    isPaused=false;
    window.__GAME_PAUSED__=false;
    last=performance.now();
    if(sound.A&&sound.A.state==='suspended'){try{sound.A.resume()}catch(e){}}
    requestAnimationFrame(frame);
  }
}
window.addEventListener('blur',pauseGame);
window.addEventListener('focus',resumeGame);
window.addEventListener('pause',pauseGame);
window.addEventListener('resume',resumeGame);

function burst(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=60+Math.random()*160;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.45,max:0.45,r:2+Math.random()*3,color});
  }
}

function nextRound(){
  isMatch=Math.random()<0.5;
  const nameItem=COLORS[Math.floor(Math.random()*COLORS.length)];
  currentText=nameItem.name;
  if(isMatch){
    textColor=nameItem.hex;
  }else{
    const others=COLORS.filter(c=>c.name!==currentText);
    textColor=others[Math.floor(Math.random()*others.length)].hex;
  }
  maxRoundTime=Math.max(1.2,2.8-score*0.04);
  roundTime=maxRoundTime;
}

function answer(userSaysMatch){
  if(over){reset();return;}
  if(!started){started=true;bridge('gameStarted');nextRound();return;}

  if(userSaysMatch===isMatch){
    // Correct!
    combo++;
    score++;
    bridge('sendScoreUpdated',score,1);
    bridge('haptic','light');
    sound(550+combo*40,0.07,'sine',0.06);
    burst(W/2,H*0.35,16,textColor);
    popups.push({x:W/2,y:H*0.32,text:`+1`,color:textColor,life:0.45,max:0.45});
    nextRound();
  }else{
    // Wrong!
    endGame();
  }
}

function reset(){
  score=0;combo=0;over=false;started=true;particles=[];popups=[];
  last=performance.now();shake=0;bridge('gameStarted');
  nextRound();
}

function endGame(){
  if(over)return;
  over=true;shake=0.35;
  sound(150,0.25,'sawtooth',0.08);
  bridge('haptic','error');
  if(score>best){best=score;localStorage.setItem('color-match-best',best);}
  bridge('sendGameOver',score,1,30);
}

function getPos(e){
  const r=c.getBoundingClientRect();
  const clX=e.touches?e.touches[0].clientX:e.clientX;
  const clY=e.touches?e.touches[0].clientY:e.clientY;
  return {x:(clX-r.left)*(W/r.width),y:(clY-r.top)*(H/r.height)};
}

c.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const p=getPos(e);
  if(!started||over){answer(true);return;}

  // Left button = NO (Match=false), Right button = YES (Match=true)
  if(p.y>H*0.65&&p.y<H*0.85){
    if(p.x<W/2-10){
      answer(false);
    }else if(p.x>W/2+10){
      answer(true);
    }
  }
},{passive:false});

function frame(t){
  if(isPaused||window.__GAME_PAUSED__)return;
  const dt=Math.min(0.033,(t-last)/1000);last=t;
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-0.5)*8,(Math.random()-0.5)*8);shake-=dt;}

  // Background
  ctx.fillStyle='#0f172a';ctx.fillRect(0,0,W,H);

  if(started&&!over){
    roundTime-=dt;
    if(roundTime<=0)endGame();
  }

  // HUD
  ctx.fillStyle='#ffffff';ctx.font='bold 22px sans-serif';ctx.textAlign='left';
  ctx.fillText(`SCORE: ${score}`,24,42);
  ctx.textAlign='right';ctx.fillStyle='#94a3b8';
  ctx.fillText(`BEST: ${best}`,W-24,42);

  // Time Bar
  const pct=Math.max(0,roundTime/maxRoundTime);
  ctx.fillStyle='#1e293b';ctx.fillRect(24,56,W-48,8);
  ctx.fillStyle=pct<0.3?'#ef4444':pct<0.6?'#eab308':'#22c55e';
  ctx.fillRect(24,56,(W-48)*pct,8);

  // Main Card Question
  ctx.fillStyle='#1e293b';ctx.fillRect(24,80,W-48,H*0.48);
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=2;ctx.strokeRect(24,80,W-48,H*0.48);

  ctx.fillStyle='#94a3b8';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText('DOES MEANING MATCH COLOR?',W/2,120);

  // Text with color
  ctx.fillStyle=textColor||'#ffffff';ctx.font='900 52px sans-serif';
  ctx.fillText(currentText||'START',W/2,H*0.35);

  if(combo>=3){
    ctx.fillStyle='#38bdf8';ctx.font='bold 15px sans-serif';
    ctx.fillText(`COMBO ×${combo}`,W/2,H*0.44);
  }

  // Action Buttons (NO vs YES)
  // NO BUTTON
  ctx.fillStyle='#ef4444';ctx.fillRect(24,H*0.68,W/2-32,68);
  ctx.fillStyle='#ffffff';ctx.font='bold 20px sans-serif';
  ctx.fillText('NO (≠)',24+(W/2-32)/2,H*0.68+42);

  // YES BUTTON
  ctx.fillStyle='#22c55e';ctx.fillRect(W/2+8,H*0.68,W/2-32,68);
  ctx.fillStyle='#ffffff';ctx.font='bold 20px sans-serif';
  ctx.fillText('YES (=)',W/2+8+(W/2-32)/2,H*0.68+42);

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.life<=0){particles.splice(i,1);continue;}
    ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  // Popups
  for(let i=popups.length-1;i>=0;i--){
    const pp=popups[i];pp.life-=dt;pp.y-=30*dt;
    if(pp.life<=0){popups.splice(i,1);continue;}
    ctx.globalAlpha=pp.life/pp.max;ctx.fillStyle=pp.color;
    ctx.font='bold 22px sans-serif';ctx.fillText(pp.text,pp.x,pp.y);
  }
  ctx.globalAlpha=1;

  // Start Screen
  if(!started&&!over){
    ctx.fillStyle='rgba(15,23,42,0.85)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#ffffff';ctx.font='bold 32px sans-serif';
    ctx.fillText('COLOR MATCH',W/2,H*0.36);
    ctx.fillStyle='#38bdf8';ctx.font='bold 14px sans-serif';
    ctx.fillText('SPEED REFLEX CHALLENGE',W/2,H*0.36+30);
    ctx.fillStyle='#94a3b8';ctx.font='13px sans-serif';
    ctx.fillText('Match the word meaning to its font color!',W/2,H*0.52);
    ctx.fillStyle='#3b82f6';ctx.fillRect(W/2-90,H*0.62,180,48);
    ctx.fillStyle='#ffffff';ctx.font='bold 16px sans-serif';
    ctx.fillText('TAP TO PLAY',W/2,H*0.62+30);
  }

  // Game Over
  if(over){
    ctx.fillStyle='rgba(15,23,42,0.88)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#1e293b';ctx.fillRect(35,H/2-130,290,260);
    ctx.strokeStyle='#ef4444';ctx.lineWidth=2;ctx.strokeRect(35,H/2-130,290,260);
    ctx.textAlign='center';ctx.fillStyle='#ef4444';ctx.font='bold 26px sans-serif';
    ctx.fillText('GAME OVER',W/2,H/2-70);
    ctx.fillStyle='#ffffff';ctx.font='bold 48px sans-serif';
    ctx.fillText(score,W/2,H/2-10);
    ctx.fillStyle='#94a3b8';ctx.font='14px sans-serif';
    ctx.fillText(`BEST SCORE: ${best}`,W/2,H/2+38);
    ctx.fillStyle='#3b82f6';ctx.fillRect(W/2-85,H/2+62,170,44);
    ctx.fillStyle='#ffffff';ctx.font='bold 14px sans-serif';
    ctx.fillText('PLAY AGAIN',W/2,H/2+89);
  }

  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
