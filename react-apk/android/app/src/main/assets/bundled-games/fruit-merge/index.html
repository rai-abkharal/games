    constructor() {

        this.intensity = intensity;
        this.duration = duration;
        this.timer = duration;
    }
    update(dt) {
        if (this.timer > 0) {
            this.timer -= dt;
            const progress = this.timer / this.duration;
            const cur = this.intensity * progress;

            this.offsetY = (Math.random() * 2 - 1) * cur;

            this.offsetX = 0;
            this.offsetY = 0;

                        f2.x += nx * overlap * (m1 / totalMass);
                        f2.y += ny * overlap * (m1 / totalMass);

            py >= this.broomBtnRect.y &&
            py <= this.broomBtnRect.y + this.broomBtnRect.h) {
            this.useBroomPowerup();
            return;
        }
        if (px >= this.undoBtnRect.x &&
            px <= this.undoBtnRect.x + this.undoBtnRect.w &&
            py >= this.undoBtnRect.y &&
            py <= this.undoBtnRect.y + this.undoBtnRect.h) {
            this.useUndoPowerup();
            return;
        }
        if (this.state !== 'PLAYING')
            return;
        const curRadius = FRUIT_DEFS[this.currentFruitTier]?.radius || 20;
        this.aimX = clamp(px, this.containerBounds.left + curRadius + 4, this.containerBounds.right - curRadius - 4);
        this.isAiming = true;
    }
    onPointerMove(px, py) {
        if (!this.isAiming || this.state !== 'PLAYING')
            return;
        const curRadius = FRUIT_DEFS[this.currentFruitTier]?.radius || 20;
        this.aimX = clamp(px, this.containerBounds.left + curRadius + 4, this.containerBounds.right - curRadius - 4);
    }
    onPointerUp() {
        if (!this.isAiming || this.state !== 'PLAYING')
            return;
        this.isAiming = false;
        if (!this.canDrop || this.dropCooldown > 0)
            return;
        this.dropCurrentFruit();
    }
    dropCurrentFruit() {
        const curDef = FRUIT_DEFS[this.currentFruitTier];
        if (!curDef)
            return;
        this.saveUndoSnapshot();
        const spawnY = this.containerBounds.top + 8;
        this.fruits.push({
            id: this.fruitUidCounter++,
            tier: this.currentFruitTier,
            x: this.aimX,
            y: spawnY,
            vx: (Math.random() - 0.5) * 10,
            vy: 60,
            angle: 0,
            vAngle: (Math.random() - 0.5) * 1.5,
            radius: curDef.radius,
            isMerging: false,
            scale: 1.0,
            targetScale: 1.0,
            aboveDangerTime: 0,
            sparkleTimer: 0,
            hasEntered: false,
            age: 0
        });
        Sound.playDrop();
        this.currentFruitTier = this.fruitQueue.shift();
        this.fruitQueue.push(this.randomSpawnTier());
        this.canDrop = false;
        this.dropCooldown = 0.42;
        this.persistCurrentState();
    }
    saveUndoSnapshot() {
        const snapshot = {
            score: this.score,
            fruits: this.fruits.map(f => ({
                tier: f.tier,
                x: f.x,
                y: f.y,
                vx: f.vx,
                vy: f.vy,
                angle: f.angle
            })),
            currentFruitTier: this.currentFruitTier,
            fruitQueue: [...this.fruitQueue],
            undoCount: this.undoCount,
            broomCount: this.broomCount
        };
        this.undoHistory.push(snapshot);
        if (this.undoHistory.length > 5)
            this.undoHistory.shift();
    }
    useUndoPowerup() {
        if (this.undoCount <= 0 || this.undoHistory.length === 0)
            return;
        const snap = this.undoHistory.pop();
        if (!snap)
            return;
        this.undoCount--;
        this.score = snap.score;
        this.currentFruitTier = snap.currentFruitTier;
        this.fruitQueue = snap.fruitQueue;
        this.fruits = snap.fruits.map(f => {
            const def = FRUIT_DEFS[f.tier] || FRUIT_DEFS[0];
            return {
                id: this.fruitUidCounter++,
                tier: f.tier,
                x: f.x,
                y: f.y,
                vx: f.vx,
                vy: f.vy,
                angle: f.angle,
                vAngle: 0,
                radius: def.radius,
                isMerging: false,
                scale: 1.0,
                targetScale: 1.0,
                aboveDangerTime: 0,
                sparkleTimer: 0,
                hasEntered: true,
                age: 1.0
            };
        });
        Sound.playPowerup();
        this.addFloatingText('UNDO!', this.undoBtnRect.x + 26, this.undoBtnRect.y + 26, '#DF5B90');
        this.persistCurrentState();
    }
    useBroomPowerup() {
        if (this.broomCount <= 0 || this.fruits.length === 0)
            return;
        this.broomCount--;
        let lowestTier = 999;
        let targetIdx = -1;
        this.fruits.forEach((f, idx) => {
            if (f.tier < lowestTier) {
                lowestTier = f.tier;
                targetIdx = idx;
            }
        });
        if (targetIdx >= 0) {
            const target = this.fruits[targetIdx];
            this.addSparkleBurst(target.x, target.y, '#FDE047', 16);
            this.fruits.splice(targetIdx, 1);
        }
        for (const f of this.fruits) {
            f.vy -= 180 + Math.random() * 100;
            f.vx += (Math.random() - 0.5) * 160;
        }
        Sound.playPowerup();
        this.screenShake.trigger(8, 0.25);
        this.addFloatingText('SHAKE!', this.broomBtnRect.x + 26, this.broomBtnRect.y + 26, '#DF5B90');
        this.persistCurrentState();
    }
    handleMergeCandidate(f1, f2, mx, my) {
        if (f1.isMerging || f2.isMerging)
            return;
        if (f1.tier !== f2.tier)
            return;
        f1.isMerging = true;
        f2.isMerging = true;
        const nextTier = Math.min(f1.tier + 1, MAX_TIER);
        const nextDef = FRUIT_DEFS[nextTier];
        this.fruits = this.fruits.filter(f => f !== f1 && f !== f2);
        const newFruit = {
            id: this.fruitUidCounter++,
            tier: nextTier,
            x: mx,
            y: my,
            vx: (f1.vx + f2.vx) * 0.4,
            vy: (f1.vy + f2.vy) * 0.4 - 40,
            angle: (f1.angle + f2.angle) / 2,
            vAngle: (f1.vAngle + f2.vAngle) * 0.5,
            radius: nextDef.radius,
            isMerging: false,
            scale: 0.35,
            targetScale: 1.0,
            aboveDangerTime: 0,
            sparkleTimer: 1.0,
            hasEntered: true,
            age: 1.0
        };
        this.fruits.push(newFruit);
        this.combo++;
        this.comboTimer = 2.0;
        const baseScore = nextDef.score;
        const comboMultiplier = Math.max(1, this.combo);
        const earnedScore = baseScore * comboMultiplier;
        this.score += earnedScore;
        if (this.score > this.bestScore) {
            this.bestScore = this.score;
            saveBestScore(this.bestScore);
        }
        this.addSparkleBurst(mx, my, nextDef.color, 14);
        Sound.playMerge(nextTier);
        if (this.combo > 1) {
            Sound.playCombo(this.combo);
            this.addFloatingText(`+${earnedScore} (x${this.combo})`, mx, my - 20, '#FACC15');
        }
        else {
            this.addFloatingText(`+${earnedScore}`, mx, my - 20, '#FFFFFF');
        }
        this.screenShake.trigger(Math.min(9, 4 + nextTier * 0.6), 0.18);
        this.persistCurrentState();
    }
    update(dt) {
        this.screenShake.update(dt);
        if (this.dropCooldown > 0) {
            this.dropCooldown -= dt;
            if (this.dropCooldown <= 0)
                this.canDrop = true;
        }
        if (this.comboTimer > 0) {
            this.comboTimer -= dt;
            if (this.comboTimer <= 0)
                this.combo = 0;
        }
        for (const f of this.fruits) {
            f.age += dt;
            if (f.scale < f.targetScale) {
                f.scale = Math.min(f.targetScale, f.scale + dt * 5.0);
            }
            if (f.sparkleTimer > 0) {
                f.sparkleTimer = Math.max(0, f.sparkleTimer - dt * 1.5);
            }
            if (!f.hasEntered && (f.y - f.radius > this.dangerLineY || f.age > 0.35)) {
                f.hasEntered = true;
            }
        }
        if (this.state === 'PLAYING') {
            this.physics.step(dt, this.fruits, this.containerBounds, (f1, f2, mx, my) => {
                this.handleMergeCandidate(f1, f2, mx, my);
            });
            this.checkDangerLine(dt);
        }
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.life += dt;
            if (p.life >= p.maxLife) {
                this.particles.splice(i, 1);
                continue;
            }
            p.vy += p.gravity * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.rotation += p.vRot * dt;
            p.alpha = 1 - p.life / p.maxLife;
        }
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const ft = this.floatingTexts[i];
            ft.life += dt;
            if (ft.life >= ft.maxLife) {
                this.floatingTexts.splice(i, 1);
                continue;
            }
            ft.y -= 45 * dt;
            ft.scale = easeOutBack(Math.min(1.0, ft.life / 0.2));
            ft.alpha = 1 - ft.life / ft.maxLife;
        }
        if (this.showGameOverModal && this.gameOverAnim < 1.0) {
            this.gameOverAnim = Math.min(1.0, this.gameOverAnim + dt * 3.5);
        }
    }
    checkDangerLine(dt) {
        let anyDanger = false;
        for (const f of this.fruits) {
            if (!f.hasEntered && f.age < 0.35)
                continue;
            const topEdge = f.y - f.radius;
            if (topEdge <= this.dangerLineY) {
                this.isDangerWarning = true;
                this.triggerGameOver();
                return;
            }
            else if (topEdge <= this.dangerLineY + 25) {
                anyDanger = true;
                this.isDangerWarning = true;
                this.dangerWarningTimer += dt;
                if (this.dangerWarningTimer > 0.35) {
                    Sound.playDangerWarning();
                    this.dangerWarningTimer = 0;
                }
            }
        }
        if (!anyDanger) {
            this.isDangerWarning = false;
            this.dangerWarningTimer = 0;
        }
    }
    triggerGameOver() {
        this.state = 'GAME_OVER';
        this.showGameOverModal = true;
        this.gameOverAnim = 0;
        clearSavedGame();
        Sound.playGameOver();
        GameBridge.sendGameOver(this.score);
        if (this.score > this.bestScore) {
            this.newBestAchieved = true;
            this.bestScore = this.score;
            saveBestScore(this.bestScore);
        }
    }
    persistCurrentState() {
        if (this.state !== 'PLAYING')
            return;
        const data = {
            score: this.score,
            bestScore: this.bestScore,
            fruits: this.fruits.map(f => ({
                tier: f.tier,
                x: f.x,
                y: f.y,
                vx: f.vx,
                vy: f.vy,
                angle: f.angle
            })),
            currentFruitTier: this.currentFruitTier,
            fruitQueue: [...this.fruitQueue],
            undoCount: this.undoCount,
            broomCount: this.broomCount,
            timestamp: Date.now()
        };
        saveGameData(data);
    }
    addSparkleBurst(x, y, color, count = 12) {
        const palette = [color, '#FFFFFF', '#FFF59D', '#F472B6', '#38BDF8'];
        for (let i = 0; i < count; i++) {
            const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
            const speed = Math.random() * 200 + 80;
            this.particles.push({
                x,
                y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 40,
                size: Math.random() * 6 + 3,
                color: palette[Math.floor(Math.random() * palette.length)],
                alpha: 1.0,
                life: 0,
                maxLife: Math.random() * 0.4 + 0.35,
                shape: Math.random() < 0.6 ? 'star' : 'sparkle',
                rotation: Math.random() * Math.PI * 2,
                vRot: (Math.random() - 0.5) * 10,
                gravity: 300
            });
        }
    }
    addFloatingText(text, x, y, color = '#FFFFFF') {
        this.floatingTexts.push({
            text,
            x,
            y,
            alpha: 1.0,
            scale: 0.2,
            life: 0,
            maxLife: 0.85,
            color,
            strokeColor: '#2B1810'
        });
    }

        ctx.save();

        this.drawTopHUD(ctx);
        this.drawActionRow(ctx);
        this.drawContainer(ctx);
        if (this.state === 'PLAYING') {
            this.drawAimingGuide(ctx);
        }
        for (const f of this.fruits) {
            drawFruit(ctx, f.tier, f.x, f.y, f.radius, f.angle, f.scale, f.sparkleTimer);
        }
        this.drawParticles(ctx);
        this.drawFloatingTexts(ctx);
        this.drawBottomProgressionBar(ctx);
        ctx.restore();
        if (this.showContinueModal) {
            this.drawContinueModal(ctx);
        }
        if (this.showGameOverModal) {
            this.drawGameOverModal(ctx);
        }
        ctx.restore();
    }

    drawParticles(ctx) {

            if (p.shape === 'star') {
                const r = p.size;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
                    const ax = Math.cos(a) * r;
                    const ay = Math.sin(a) * r;
                    if (i === 0)
                        ctx.moveTo(ax, ay);
                    else
                        ctx.lineTo(ax, ay);
                    const ia = a + Math.PI / 5;
                    ctx.lineTo(Math.cos(ia) * (r * 0.45), Math.sin(ia) * (r * 0.45));
                }
                ctx.closePath();
                ctx.fill();
            }
            else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }
        ctx.restore();
    }
    drawFloatingTexts(ctx) {
        ctx.save();
        for (const ft of this.floatingTexts) {
            if (ft.alpha <= 0)
                continue;
            ctx.save();
            ctx.globalAlpha = ft.alpha;
            ctx.translate(ft.x, ft.y);
            ctx.scale(ft.scale, ft.scale);
            ctx.font = '900 24px "Fredoka", "Outfit", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.lineWidth = 5;
            ctx.strokeStyle = ft.strokeColor;
            ctx.lineJoin = 'round';
            ctx.strokeText(ft.text, 0, 0);
            ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, 0, 0);
            ctx.restore();
        }
        ctx.restore();
    }
    drawContinueModal(ctx) {
        ctx.save();
        ctx.fillStyle = 'rgba(18, 28, 29, 0.75)';
        ctx.fillRect(0, 0, this.width, this.height);
        const cardW = Math.min(this.width - 40, 320);
        const cardH = 220;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2;
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        roundRectPath(ctx, cardX, cardY, cardW, cardH, 24);
        ctx.fill();
        ctx.font = '900 24px "Fredoka", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#1E293B';
        ctx.fillText('CONTINUE GAME?', this.width / 2, cardY + 28);
        ctx.font = '600 15px "Fredoka", sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText('Restore your previous puzzle run?', this.width / 2, cardY + 65);
        const btnW = 125;
        const btnH = 46;
        const cX = this.width / 2 - btnW - 8;
        const nX = this.width / 2 + 8;
        const btnY = cardY + 135;
        this.modalContinueRect = { x: cX, y: btnY, w: btnW, h: btnH };
        this.modalNewGameRect = { x: nX, y: btnY, w: btnW, h: btnH };
        ctx.fillStyle = '#22C55E';
        ctx.beginPath();
        roundRectPath(ctx, cX, btnY, btnW, btnH, 14);
        ctx.fill();
        ctx.font = '800 16px "Fredoka", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textBaseline = 'middle';
        ctx.fillText('CONTINUE', cX + btnW / 2, btnY + btnH / 2);
        ctx.fillStyle = '#DF5B90';
        ctx.beginPath();
        roundRectPath(ctx, nX, btnY, btnW, btnH, 14);
        ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('NEW GAME', nX + btnW / 2, btnY + btnH / 2);
        ctx.restore();
    }
    drawGameOverModal(ctx) {
        ctx.save();
        const alpha = easeOutBack(Math.min(1.0, this.gameOverAnim));
        ctx.globalAlpha = Math.min(1.0, this.gameOverAnim);
        ctx.fillStyle = 'rgba(18, 28, 29, 0.82)';
        ctx.fillRect(0, 0, this.width, this.height);
        const cardW = Math.min(this.width - 40, 330);
        const cardH = 340;
        const cardX = (this.width - cardW) / 2;
        const cardY = (this.height - cardH) / 2 - 20;
        ctx.save();
        ctx.translate(this.width / 2, this.height / 2 - 20);
        ctx.scale(alpha, alpha);
        ctx.translate(-this.width / 2, -(this.height / 2 - 20));
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 24;
        ctx.beginPath();
        roundRectPath(ctx, cardX, cardY, cardW, cardH, 26);
        ctx.fill();
        drawFruit(ctx, 10, this.width / 2, cardY + 42, 34, 0, 1.0, 0);
        ctx.font = '900 28px "Fredoka", "Lilita One", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillStyle = '#1E293B';
        ctx.fillText('GAME OVER', this.width / 2, cardY + 86);
        if (this.newBestAchieved) {
            ctx.font = '800 16px "Fredoka", sans-serif';
            ctx.fillStyle = '#F59E0B';
            ctx.fillText('🎉 NEW ALL-TIME RECORD! 🎉', this.width / 2, cardY + 120);
        }
        const scoreY = cardY + (this.newBestAchieved ? 150 : 135);
        ctx.font = '700 15px "Fredoka", sans-serif';
        ctx.fillStyle = '#64748B';
        ctx.fillText('FINAL SCORE', this.width / 2, scoreY);
        ctx.font = '900 46px "Fredoka", "Outfit", sans-serif';
        ctx.fillStyle = '#1E293B';
        ctx.fillText(`${this.score}`, this.width / 2, scoreY + 34);
        ctx.font = '800 15px "Fredoka", sans-serif';
        ctx.fillStyle = '#38E1BF';
        ctx.fillText(`ALL TIME: ${this.bestScore}`, this.width / 2, scoreY + 84);
        const btnW = 210;
        const btnH = 50;
        const btnX = (this.width - btnW) / 2;
        const btnY = cardY + cardH - 68;
        this.modalPlayAgainRect = { x: btnX, y: btnY, w: btnW, h: btnH };
        ctx.fillStyle = '#B83B6D';
        ctx.beginPath();
        roundRectPath(ctx, btnX, btnY + 4, btnW, btnH, 16);
        ctx.fill();
        ctx.fillStyle = '#DF5B90';
        ctx.beginPath();
        roundRectPath(ctx, btnX, btnY, btnW, btnH, 16);
        ctx.fill();
        ctx.font = '900 20px "Fredoka", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.textBaseline = 'middle';
        ctx.fillText('PLAY AGAIN', this.width / 2, btnY + btnH / 2);
        ctx.restore();
        ctx.restore();
    }
}
window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas)
        return;
    const ctx = canvas.getContext('2d', { alpha: false });
    if (!ctx)
        return;
    const engine = new GameEngine();
    let dpr = 1;
    let cssWidth = 390;
    let cssHeight = 844;
    function resizeCanvas() {
        const vv = window.visualViewport;
        cssWidth = vv ? vv.width : window.innerWidth;
        cssHeight = vv ? vv.height : window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(cssWidth * dpr);
        canvas.height = Math.floor(cssHeight * dpr);
        canvas.style.width = `${cssWidth}px`;
        canvas.style.height = `${cssHeight}px`;
        ctx.resetTransform();
        ctx.scale(dpr, dpr);
        engine.resize(cssWidth, cssHeight);
    }
    window.addEventListener('resize', resizeCanvas);
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', resizeCanvas);
    }
    resizeCanvas();
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) * (cssWidth / rect.width),
            y: (e.clientY - rect.top) * (cssHeight / rect.height)
        };
    }
    let isPointerDown = false;
    canvas.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isPointerDown = true;
        const { x, y } = getPointerPos(e);
        engine.onPointerDown(x, y);
    });
    window.addEventListener('mousemove', (e) => {
        if (!isPointerDown)
            return;
        const { x, y } = getPointerPos(e);
        engine.onPointerMove(x, y);
    });
    window.addEventListener('mouseup', (e) => {
        if (!isPointerDown)
            return;
        isPointerDown = false;
        engine.onPointerUp();
    });
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length > 0) {
            isPointerDown = true;
            const { x, y } = getPointerPos(e.touches[0]);
            engine.onPointerDown(x, y);
        }
    }, { passive: false });
    window.addEventListener('touchmove', (e) => {
        if (!isPointerDown)
            return;
        e.preventDefault();
        if (e.touches.length > 0) {
            const { x, y } = getPointerPos(e.touches[0]);
            engine.onPointerMove(x, y);
        }
    }, { passive: false });
    window.addEventListener('touchend', (e) => {
        if (!isPointerDown)
            return;
        isPointerDown = false;
        engine.onPointerUp();
    }, { passive: false });
    window.addEventListener('touchcancel', () => {
        isPointerDown = false;
        engine.onPointerUp();
    }, { passive: false });
    let lastTime = performance.now();
    function loop(currentTime) {
        const dt = Math.min((currentTime - lastTime) / 1000, 0.1);
        lastTime = currentTime;
        engine.update(dt);
        engine.render(ctx);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
});
})();
  </script>
