server {
    listen 443 ssl;
    server_name preview.187.77.147.226.sslip.io;
    ssl_certificate /etc/letsencrypt/live/preview.187.77.147.226.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/preview.187.77.147.226.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
